<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Notifications - KRIM Logistics</title>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
          <script src="config.js"></script>

            <style>
                body {
                      font-family: Arial, sans-serif;
                            background: #f4f6f8;
                                  margin: 0;
                                        padding: 20px;
                                            }

                                                .box {
                                                      max-width: 800px;
                                                            margin: auto;
                                                                  background: white;
                                                                        padding: 20px;
                                                                              border-radius: 12px;
                                                                                  }

                                                                                      h1 {
                                                                                            text-align: center;
                                                                                                }

                                                                                                    button {
                                                                                                          width: 100%;
                                                                                                                padding: 12px;
                                                                                                                      margin: 6px 0;
                                                                                                                            border: 0;
                                                                                                                                  border-radius: 7px;
                                                                                                                                        background: #111827;
                                                                                                                                              color: white;
                                                                                                                                                    font-size: 15px;
                                                                                                                                                          cursor: pointer;
                                                                                                                                                              }

                                                                                                                                                                  .message {
                                                                                                                                                                        margin: 12px 0;
                                                                                                                                                                              font-weight: bold;
                                                                                                                                                                                  }

                                                                                                                                                                                      .notification {
                                                                                                                                                                                            border: 1px solid #ddd;
                                                                                                                                                                                                  border-radius: 8px;
                                                                                                                                                                                                        padding: 14px;
                                                                                                                                                                                                              margin-top: 10px;
                                                                                                                                                                                                                    background: #fafafa;
                                                                                                                                                                                                                        }

                                                                                                                                                                                                                            .unread {
                                                                                                                                                                                                                                  border-left: 5px solid #111827;
                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                          .title {
                                                                                                                                                                                                                                                font-weight: bold;
                                                                                                                                                                                                                                                      font-size: 17px;
                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                              .date {
                                                                                                                                                                                                                                                                    font-size: 12px;
                                                                                                                                                                                                                                                                          color: #666;
                                                                                                                                                                                                                                                                                margin-top: 7px;
                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                        .read-button {
                                                                                                                                                                                                                                                                                              margin-top: 10px;
                                                                                                                                                                                                                                                                                                    background: #555;
                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                          </style>
                                                                                                                                                                                                                                                                                                          </head>

                                                                                                                                                                                                                                                                                                          <body>

                                                                                                                                                                                                                                                                                                          <div class="box">

                                                                                                                                                                                                                                                                                                            <h1>🔔 Notifications</h1>

                                                                                                                                                                                                                                                                                                              <button onclick="loadNotifications()">
                                                                                                                                                                                                                                                                                                                  Refresh Notifications
                                                                                                                                                                                                                                                                                                                    </button>

                                                                                                                                                                                                                                                                                                                      <div id="message" class="message"></div>

                                                                                                                                                                                                                                                                                                                        <div id="notifications">
                                                                                                                                                                                                                                                                                                                            Loading notifications...
                                                                                                                                                                                                                                                                                                                              </div>

                                                                                                                                                                                                                                                                                                                              </div>

                                                                                                                                                                                                                                                                                                                              <script>

                                                                                                                                                                                                                                                                                                                              const db = supabase.createClient(
                                                                                                                                                                                                                                                                                                                                SUPABASE_URL,
                                                                                                                                                                                                                                                                                                                                  SUPABASE_PUBLISHABLE_KEY
                                                                                                                                                                                                                                                                                                                                  );


                                                                                                                                                                                                                                                                                                                                  async function loadNotifications() {

                                                                                                                                                                                                                                                                                                                                    const container = document.getElementById("notifications");
                                                                                                                                                                                                                                                                                                                                      const message = document.getElementById("message");

                                                                                                                                                                                                                                                                                                                                        container.innerHTML = "Loading...";

                                                                                                                                                                                                                                                                                                                                          const {
                                                                                                                                                                                                                                                                                                                                              data: { user },
                                                                                                                                                                                                                                                                                                                                                  error: userError
                                                                                                                                                                                                                                                                                                                                                    } = await db.auth.getUser();

                                                                                                                                                                                                                                                                                                                                                      if (userError || !user) {
                                                                                                                                                                                                                                                                                                                                                          container.innerHTML = "Please login first.";
                                                                                                                                                                                                                                                                                                                                                              return;
                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                  const { data, error } = await db
                                                                                                                                                                                                                                                                                                                                                                      .from("notifications")
                                                                                                                                                                                                                                                                                                                                                                          .select("*")
                                                                                                                                                                                                                                                                                                                                                                              .eq("user_id", user.id)
                                                                                                                                                                                                                                                                                                                                                                                  .order("created_at", { ascending: false });

                                                                                                                                                                                                                                                                                                                                                                                    if (error) {
                                                                                                                                                                                                                                                                                                                                                                                        container.innerHTML =
                                                                                                                                                                                                                                                                                                                                                                                              "Error loading notifications: " + error.message;
                                                                                                                                                                                                                                                                                                                                                                                                  return;
                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                      if (!data || data.length === 0) {
                                                                                                                                                                                                                                                                                                                                                                                                          container.innerHTML = "No notifications yet.";
                                                                                                                                                                                                                                                                                                                                                                                                              return;
                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                  container.innerHTML = "";

                                                                                                                                                                                                                                                                                                                                                                                                                    data.forEach(notification => {

                                                                                                                                                                                                                                                                                                                                                                                                                        const div = document.createElement("div");

                                                                                                                                                                                                                                                                                                                                                                                                                            div.className =
                                                                                                                                                                                                                                                                                                                                                                                                                                  notification.is_read
                                                                                                                                                                                                                                                                                                                                                                                                                                          ? "notification"
                                                                                                                                                                                                                                                                                                                                                                                                                                                  : "notification unread";

                                                                                                                                                                                                                                                                                                                                                                                                                                                      div.innerHTML = `
                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="title">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ${notification.title}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ${notification.message}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            Type: ${notification.notification_type}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="date">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ${new Date(notification.created_at).toLocaleString()}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ${
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    notification.is_read
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ? "<div>✓ Read</div>"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    : `<button
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 class="read-button"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              onclick="markRead('${notification.id}')">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           Mark as Read
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </button>`
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                `;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    container.appendChild(div);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      async function markRead(id) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const { error } = await db
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .from("notifications")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                .update({ is_read: true })
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .eq("id", id);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if (error) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          document.getElementById("message").innerHTML =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "Error: " + error.message;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        loadNotifications();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        loadNotifications();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
