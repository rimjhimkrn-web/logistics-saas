<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>KRIM Admin MFA</title>

                <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
                    <script src="config.js"></script>

                        <style>
                                body {
                                            font-family: Arial, sans-serif;
                                                        max-width: 500px;
                                                                    margin: 40px auto;
                                                                                padding: 20px;
                                                                                        }

                                                                                                input, button {
                                                                                                            width: 100%;
                                                                                                                        padding: 12px;
                                                                                                                                    margin-top: 10px;
                                                                                                                                                box-sizing: border-box;
                                                                                                                                                        }

                                                                                                                                                                button {
                                                                                                                                                                            cursor: pointer;
                                                                                                                                                                                    }

                                                                                                                                                                                            #setup {
                                                                                                                                                                                                        display: none;
                                                                                                                                                                                                                }

                                                                                                                                                                                                                        #message {
                                                                                                                                                                                                                                    margin-top: 15px;
                                                                                                                                                                                                                                                font-weight: bold;
                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                img {
                                                                                                                                                                                                                                                                            max-width: 220px;
                                                                                                                                                                                                                                                                                        display: block;
                                                                                                                                                                                                                                                                                                    margin: 20px auto;
                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                    .secret {
                                                                                                                                                                                                                                                                                                                                word-break: break-all;
                                                                                                                                                                                                                                                                                                                                            background: #f1f1f1;
                                                                                                                                                                                                                                                                                                                                                        padding: 10px;
                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                    </style>
                                                                                                                                                                                                                                                                                                                                                                    </head>

                                                                                                                                                                                                                                                                                                                                                                    <body>

                                                                                                                                                                                                                                                                                                                                                                        <h1>KRIM Admin MFA</h1>

                                                                                                                                                                                                                                                                                                                                                                            <p id="user">Checking login...</p>

                                                                                                                                                                                                                                                                                                                                                                                <button id="startBtn" onclick="startMFA()">
                                                                                                                                                                                                                                                                                                                                                                                        Set Up Authenticator
                                                                                                                                                                                                                                                                                                                                                                                            </button>

                                                                                                                                                                                                                                                                                                                                                                                                <div id="setup">

                                                                                                                                                                                                                                                                                                                                                                                                        <h2>Scan QR Code</h2>

                                                                                                                                                                                                                                                                                                                                                                                                                <img id="qr">

                                                                                                                                                                                                                                                                                                                                                                                                                        <p>Manual Secret:</p>

                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="secret" id="secret"></div>

                                                                                                                                                                                                                                                                                                                                                                                                                                        <p>Enter the 6-digit code from your authenticator:</p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                <input
                                                                                                                                                                                                                                                                                                                                                                                                                                                            id="code"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        type="text"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    inputmode="numeric"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                maxlength="6"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            placeholder="123456"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    >

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button onclick="verifyMFA()">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        Verify MFA
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <p id="message"></p>


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let factorId = null;


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        /* Check login */

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        async function checkLogin() {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const result = await supabaseClient.auth.getSession();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const session = result.data.session;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (!session) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById("user").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        "You are not logged in.";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById("startBtn").disabled = true;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById("user").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        "Logged in as: " + session.user.email;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        /* Start MFA */

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        async function startMFA() {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const button = document.getElementById("startBtn");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                button.disabled = true;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById("message").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            "Creating MFA setup...";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const result =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        await supabaseClient.auth.mfa.enroll({
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    factorType: "totp",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                friendlyName: "KRIM Admin"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (result.error) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById("message").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                result.error.message;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        button.disabled = false;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        factorId = result.data.id;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById("qr").src =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    result.data.totp.qr_code;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("secret").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                result.data.totp.secret;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById("setup").style.display =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            "block";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById("message").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        "Scan the QR code and enter your 6-digit code.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        /* Verify MFA */

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        async function verifyMFA() {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const code =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById("code").value.trim();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (!/^[0-9]{6}$/.test(code)) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById("message").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            "Enter exactly 6 digits.";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (!factorId) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById("message").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "Start MFA setup first.";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById("message").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        "Verifying...";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const result =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    await supabaseClient.auth.mfa.challengeAndVerify({
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                factorId: factorId,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            code: code
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (result.error) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById("message").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            result.error.message;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById("message").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    "SUCCESS — MFA is now enabled for this account.";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("setup").style.display =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "none";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById("startBtn").style.display =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            "none";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            checkLogin();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
