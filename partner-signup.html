<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Partner Sign Up</title>
            </head>
            <body>

                <h1>🚚 Partner Sign Up</h1>

                    <form id="signupForm">
                            <p>
                                        <label>Email:</label><br>
                                                    <input type="email" id="email" placeholder="partner@email.com" required>
                                                            </p>

                                                                    <p>
                                                                                <label>Password:</label><br>
                                                                                            <input type="password" id="password" placeholder="Min 6 characters" required>
                                                                                                    </p>

                                                                                                            <p>
                                                                                                                        <label>Company Name:</label><br>
                                                                                                                                    <input type="text" id="companyName" placeholder="Your company name" required>
                                                                                                                                            </p>

                                                                                                                                                    <p>
                                                                                                                                                                <label>Contact Person:</label><br>
                                                                                                                                                                            <input type="text" id="contactPerson" placeholder="Full name">
                                                                                                                                                                                    </p>

                                                                                                                                                                                            <p>
                                                                                                                                                                                                        <label>Phone:</label><br>
                                                                                                                                                                                                                    <input type="text" id="phone" placeholder="Phone number">
                                                                                                                                                                                                                            </p>

                                                                                                                                                                                                                                    <button type="submit">Sign Up as Partner</button>
                                                                                                                                                                                                                                        </form>

                                                                                                                                                                                                                                            <div id="message"></div>

                                                                                                                                                                                                                                                <br>
                                                                                                                                                                                                                                                    <a href="index.html">Back to Home</a>
                                                                                                                                                                                                                                                        <br>
                                                                                                                                                                                                                                                            <a href="partner-login.html">Already have an account? Login</a>

                                                                                                                                                                                                                                                                <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
                                                                                                                                                                                                                                                                    </script>
                                                                                                                                                                                                                                                                        <script>
                                                                                                                                                                                                                                                                                const supabase = window.supabase.createClient(
                                                                                                                                                                                                                                                                                            'https://ebltviniygljwwseplph.supabase.co',
                                                                                                                                                                                                                                                                                                        'sb_publishable_8xzZUeubYp_nIxVRWEQdiw_2H4RkHAa'
                                                                                                                                                                                                                                                                                                                );

                                                                                                                                                                                                                                                                                                                        const form = document.getElementById('signupForm');
                                                                                                                                                                                                                                                                                                                                const message = document.getElementById('message');

                                                                                                                                                                                                                                                                                                                                        form.addEventListener('submit', async function(e) {
                                                                                                                                                                                                                                                                                                                                                    e.preventDefault();

                                                                                                                                                                                                                                                                                                                                                                const email = document.getElementById('email').value.trim();
                                                                                                                                                                                                                                                                                                                                                                            const password = document.getElementById('password').value.trim();
                                                                                                                                                                                                                                                                                                                                                                                        const companyName = document.getElementById('companyName').value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                    const contactPerson = document.getElementById('contactPerson').value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                const phone = document.getElementById('phone').value.trim();

                                                                                                                                                                                                                                                                                                                                                                                                                            if (!email || !password || !companyName) {
                                                                                                                                                                                                                                                                                                                                                                                                                                            message.innerHTML = '⚠️ Email, password, and company name are required';
                                                                                                                                                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (password.length < 6) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    message.innerHTML = '⚠️ Password must be at least 6 characters';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            message.innerHTML = '⏳ Creating partner account...';

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        // Create auth user with partner role
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const { data, error } = await supabase.auth.signUp({
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    email: email,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    password: password,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    options: {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        data: {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                company_name: companyName,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        contact_person: contactPerson,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                phone: phone,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        role: 'partner'
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (error) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    message.innerHTML = '❌ ' + error.message;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // Also add to partners table
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const { error: partnerError } = await supabase
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        .from('partners')
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        .insert([{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            name: companyName,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                contact_person: contactPerson,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    email: email,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        phone: phone
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }]);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (partnerError) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    console.log('Partner table error:', partnerError);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // Still continue - auth user created
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            message.innerHTML = '✅ Partner account created! Please check your email to confirm.';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        form.reset();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
