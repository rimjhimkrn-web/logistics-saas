<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Partner Signup | KRIM Logistics</title>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="config.js"></script>

        <style>
            *{
                  box-sizing:border-box;
            }

            body{
                  margin:0;
                    font-family:Arial, sans-serif;
                      background:#f4f7fb;
                        color:#1f2937;
            }

            .container{
                  width:100%;
                    max-width:450px;
                      margin:40px auto;
                        padding:20px;
            }

            .card{
                  background:white;
                    padding:25px;
                      border-radius:14px;
                        box-shadow:0 5px 20px rgba(0,0,0,.08);
            }

            .logo{
                  text-align:center;
                    color:#1261d6;
                      font-size:28px;
                        font-weight:bold;
                          margin-bottom:5px;
            }

            .subtitle{
                  text-align:center;
                    color:#666;
                      margin-bottom:25px;
            }

            label{
                  display:block;
                    margin-top:15px;
                      margin-bottom:6px;
                        font-weight:bold;
            }

            input{
                  width:100%;
                    padding:13px;
                      border:1px solid #d1d5db;
                        border-radius:8px;
                          font-size:15px;
            }

            input:focus{
                  outline:none;
                    border-color:#1261d6;
            }

            button{
                  width:100%;
                    margin-top:22px;
                      padding:14px;
                        border:0;
                          border-radius:8px;
                            background:#1261d6;
                              color:white;
                                font-size:16px;
                                  font-weight:bold;
                                    cursor:pointer;
            }

            button:disabled{
                  background:#9ca3af;
                    cursor:not-allowed;
            }

            .message{
                  margin-top:18px;
                    padding:12px;
                      border-radius:8px;
                        display:none;
                          font-size:14px;
            }

            .success{
                  display:block;
                    background:#dcfce7;
                      color:#166534;
            }

            .error{
                  display:block;
                    background:#fee2e2;
                      color:#991b1b;
            }

            .login{
                  text-align:center;
                    margin-top:20px;
            }

            .login a{
                  color:#1261d6;
                    text-decoration:none;
                      font-weight:bold;
            }
        </style>
    </head>

    <body>

        <div class="container">

              <div class="card">

                    <div class="logo">KRIM Logistics</div>

                        <div class="subtitle">
                                  Partner Registration
                        </div>

                            <form id="signupForm">

                                      <label>Company Name</label>
                                            <input
                                                    type="text"
                                                            id="company"
                                                                    placeholder="Enter company name"
                                                                            required
                                                                                  >

                                                                                        <label>Contact Person</label>
                                                                                              <input
                                                                                                      type="text"
                                                                                                              id="contact"
                                                                                                                      placeholder="Enter contact person"
                                                                                                                              required
                                                                                                                                    >

                                                                                                                                          <label>Phone Number</label>
                                                                                                                                                <input
                                                                                                                                                        type="tel"
                                                                                                                                                                id="phone"
                                                                                                                                                                        placeholder="Enter phone number"
                                                                                                                                                                                required
                                                                                                                                                                                      >

                                                                                                                                                                                            <label>Email</label>
                                                                                                                                                                                                  <input
                                                                                                                                                                                                          type="email"
                                                                                                                                                                                                                  id="email"
                                                                                                                                                                                                                          placeholder="Enter email"
                                                                                                                                                                                                                                  required
                                                                                                                                                                                                                                        >

                                                                                                                                                                                                                                              <label>Password</label>
                                                                                                                                                                                                                                                    <input
                                                                                                                                                                                                                                                            type="password"
                                                                                                                                                                                                                                                                    id="password"
                                                                                                                                                                                                                                                                            placeholder="Minimum 6 characters"
                                                                                                                                                                                                                                                                                    required
                                                                                                                                                                                                                                                                                          >

                                                                                                                                                                                                                                                                                                <label>Confirm Password</label>
                                                                                                                                                                                                                                                                                                      <input
                                                                                                                                                                                                                                                                                                              type="password"
                                                                                                                                                                                                                                                                                                                      id="confirmPassword"
                                                                                                                                                                                                                                                                                                                              placeholder="Confirm password"
                                                                                                                                                                                                                                                                                                                                      required
                                                                                                                                                                                                                                                                                                                                            >

                                                                                                                                                                                                                                                                                                                                                  <button type="submit" id="signupButton">
                                                                                                                                                                                                                                                                                                                                                            Create Partner Account
                                                                                                                                                                                                                                                                                                                                                  </button>

                                                                                                                                                                                                                                                                                                                                                </form>

                                                                                                                                                                                                                                                                                                                                                    <div id="message" class="message"></div>

                                                                                                                                                                                                                                                                                                                                                        <div class="login">
                                                                                                                                                                                                                                                                                                                                                                  Already have an account?
                                                                                                                                                                                                                                                                                                                                                                        <a href="partner-login.html">Partner Login</a>
                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                <script>

                                                                                                                                                                                                                                                                                                                                                    const form = document.getElementById("signupForm");
                                                                                                                                                                                                                                                                                                                                                    const button = document.getElementById("signupButton");
                                                                                                                                                                                                                                                                                                                                                    const message = document.getElementById("message");

                                                                                                                                                                                                                                                                                                                                                    function showMessage(text, type){

                                                                                                                                                                                                                                                                                                                                                          message.textContent = text;

                                                                                                                                                                                                                                                                                                                                                            message.className = "message " + type;

                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                    form.addEventListener("submit", async function(event){

                                                                                                                                                                                                                                                                                                                                                          event.preventDefault();

                                                                                                                                                                                                                                                                                                                                                            message.style.display = "none";

                                                                                                                                                                                                                                                                                                                                                              const company =
                                                                                                                                                                                                                                                                                                                                                                  document.getElementById("company").value.trim();

                                                                                                                                                                                                                                                                                                                                                                    const contact =
                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("contact").value.trim();

                                                                                                                                                                                                                                                                                                                                                                          const phone =
                                                                                                                                                                                                                                                                                                                                                                              document.getElementById("phone").value.trim();

                                                                                                                                                                                                                                                                                                                                                                                const email =
                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById("email").value.trim();

                                                                                                                                                                                                                                                                                                                                                                                      const password =
                                                                                                                                                                                                                                                                                                                                                                                          document.getElementById("password").value;

                                                                                                                                                                                                                                                                                                                                                                                            const confirmPassword =
                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById("confirmPassword").value;


                                                                                                                                                                                                                                                                                                                                                                                                  if(password.length < 6){

                                                                                                                                                                                                                                                                                                                                                                                                        showMessage(
                                                                                                                                                                                                                                                                                                                                                                                                                  "Password must be at least 6 characters.",
                                                                                                                                                                                                                                                                                                                                                                                                                        "error"
                                                                                                                                                                                                                                                                                                                                                                                                        );

                                                                                                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                                                                                                  }


                                                                                                                                                                                                                                                                                                                                                                                                    if(password !== confirmPassword){

                                                                                                                                                                                                                                                                                                                                                                                                            showMessage(
                                                                                                                                                                                                                                                                                                                                                                                                                      "Passwords do not match.",
                                                                                                                                                                                                                                                                                                                                                                                                                            "error"
                                                                                                                                                                                                                                                                                                                                                                                                            );

                                                                                                                                                                                                                                                                                                                                                                                                                return;
                                                                                                                                                                                                                                                                                                                                                                                                    }


                                                                                                                                                                                                                                                                                                                                                                                                      button.disabled = true;
                                                                                                                                                                                                                                                                                                                                                                                                        button.textContent = "Creating Account...";


                                                                                                                                                                                                                                                                                                                                                                                                          try{

                                                                                                                                                                                                                                                                                                                                                                                                                const result =
                                                                                                                                                                                                                                                                                                                                                                                                                      await supabaseClient.auth.signUp({

                                                                                                                                                                                                                                                                                                                                                                                                                                email: email,

                                                                                                                                                                                                                                                                                                                                                                                                                                        password: password,

                                                                                                                                                                                                                                                                                                                                                                                                                                                options: {

                                                                                                                                                                                                                                                                                                                                                                                                                                                              data: {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                            account_type: "partner",

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        company_name: company,

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    contact_person: contact,

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                phone: phone

                                                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                        });


                                                                                                                                                                                                                                                                                                                                                                                                                                                            if(result.error){

                                                                                                                                                                                                                                                                                                                                                                                                                                                                      throw result.error;

                                                                                                                                                                                                                                                                                                                                                                                                                                                            }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                showMessage(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          "Partner account created successfully.",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "success"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                );


                                                                                                                                                                                                                                                                                                                                                                                                                                                                    form.reset();


                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if(result.data.session){

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  setTimeout(function(){

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            window.location.href =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      "partner-dashboard.html";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }, 1000);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }else{

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          showMessage(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    "Account created. Please check your email to verify your account, then login.",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            "success"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                button.disabled = false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      button.textContent = "Create Partner Account";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }catch(error){

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    console.error(error);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        showMessage(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  error.message || "Signup failed. Please try again.",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        "error"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            button.disabled = false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                button.textContent = "Create Partner Account";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                        });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                </html>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        )
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          )
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  })
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                )
                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                      })
                                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                                            )
                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                        )
                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                    })
                                                                                                                                                                                                                                                                                                                                                    }
            }
            }
            }
            }
            }
            }
            }
            }
            }
            }
            }
            }
            }
            }
            }
            }
