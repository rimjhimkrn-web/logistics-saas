<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Partner Signup - KRIM Logistics</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
* {
  box-sizing: border-box;
  }

  body {
    margin: 0;
      font-family: Arial, sans-serif;
        background: #f4f7fb;
        }

        .container {
          max-width: 450px;
            margin: 40px auto;
              padding: 20px;
              }

              .card {
                background: white;
                  padding: 25px;
                    border-radius: 14px;
                      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
                      }

                      .logo {
                        text-align: center;
                          font-size: 28px;
                            font-weight: bold;
                              color: #1261d6;
                              }

                              .title {
                                text-align: center;
                                  margin: 8px 0 25px;
                                    color: #555;
                                    }

                                    label {
                                      display: block;
                                        margin-top: 15px;
                                          margin-bottom: 6px;
                                            font-weight: bold;
                                            }

                                            input {
                                              width: 100%;
                                                padding: 13px;
                                                  border: 1px solid #ccc;
                                                    border-radius: 8px;
                                                      font-size: 15px;
                                                      }

                                                      button {
                                                        width: 100%;
                                                          padding: 14px;
                                                            margin-top: 22px;
                                                              border: none;
                                                                border-radius: 8px;
                                                                  background: #1261d6;
                                                                    color: white;
                                                                      font-size: 16px;
                                                                        font-weight: bold;
                                                                        }

                                                                        button:disabled {
                                                                          background: #999;
                                                                          }

                                                                          .message {
                                                                            margin-top: 18px;
                                                                              padding: 14px;
                                                                                border-radius: 8px;
                                                                                  display: none;
                                                                                    line-height: 1.5;
                                                                                    }

                                                                                    .success {
                                                                                      display: block;
                                                                                        background: #dcfce7;
                                                                                          color: #166534;
                                                                                          }

                                                                                          .error {
                                                                                            display: block;
                                                                                              background: #fee2e2;
                                                                                                color: #991b1b;
                                                                                                }

                                                                                                .login-button {
                                                                                                  display: none;
                                                                                                    background: #16a34a;
                                                                                                    }

                                                                                                    .login-link {
                                                                                                      text-align: center;
                                                                                                        margin-top: 20px;
                                                                                                        }

                                                                                                        .login-link a {
                                                                                                          color: #1261d6;
                                                                                                            font-weight: bold;
                                                                                                              text-decoration: none;
                                                                                                              }
                                                                                                              </style>
                                                                                                              </head>

                                                                                                              <body>

                                                                                                              <div class="container">

                                                                                                              <div class="card">

                                                                                                              <div class="logo">KRIM Logistics</div>

                                                                                                              <div class="title">
                                                                                                              Partner Registration
                                                                                                              </div>

                                                                                                              <form id="signupForm">

                                                                                                              <label>Company Name</label>
                                                                                                              <input
                                                                                                                type="text"
                                                                                                                  id="company"
                                                                                                                    required
                                                                                                                      placeholder="Company name">

                                                                                                                      <label>Contact Person</label>
                                                                                                                      <input
                                                                                                                        type="text"
                                                                                                                          id="contact"
                                                                                                                            required
                                                                                                                              placeholder="Contact person">

                                                                                                                              <label>Phone Number</label>
                                                                                                                              <input
                                                                                                                                type="tel"
                                                                                                                                  id="phone"
                                                                                                                                    required
                                                                                                                                      placeholder="Phone number">

                                                                                                                                      <label>Email</label>
                                                                                                                                      <input
                                                                                                                                        type="email"
                                                                                                                                          id="email"
                                                                                                                                            required
                                                                                                                                              placeholder="Email address">

                                                                                                                                              <label>Password</label>
                                                                                                                                              <input
                                                                                                                                                type="password"
                                                                                                                                                  id="password"
                                                                                                                                                    required
                                                                                                                                                      placeholder="Minimum 6 characters">

                                                                                                                                                      <label>Confirm Password</label>
                                                                                                                                                      <input
                                                                                                                                                        type="password"
                                                                                                                                                          id="confirmPassword"
                                                                                                                                                            required
                                                                                                                                                              placeholder="Confirm password">

                                                                                                                                                              <button
                                                                                                                                                                type="submit"
                                                                                                                                                                  id="signupButton">
                                                                                                                                                                    Create Partner Account
                                                                                                                                                                    </button>

                                                                                                                                                                    </form>

                                                                                                                                                                    <div id="message" class="message"></div>

                                                                                                                                                                    <button
                                                                                                                                                                      type="button"
                                                                                                                                                                        id="loginButton"
                                                                                                                                                                          class="login-button"
                                                                                                                                                                            onclick="window.location.href='partner-login.html'">
                                                                                                                                                                              Go to Partner Login
                                                                                                                                                                              </button>

                                                                                                                                                                              <div class="login-link">
                                                                                                                                                                              Already registered?
                                                                                                                                                                              <a href="partner-login.html">Partner Login</a>
                                                                                                                                                                              </div>

                                                                                                                                                                              </div>

                                                                                                                                                                              </div>

                                                                                                                                                                              <script>

                                                                                                                                                                              const form = document.getElementById("signupForm");
                                                                                                                                                                              const button = document.getElementById("signupButton");
                                                                                                                                                                              const message = document.getElementById("message");
                                                                                                                                                                              const loginButton = document.getElementById("loginButton");

                                                                                                                                                                              function showMessage(text, type) {
                                                                                                                                                                                message.textContent = text;
                                                                                                                                                                                  message.className = "message " + type;
                                                                                                                                                                                  }

                                                                                                                                                                                  form.addEventListener("submit", async function(e) {

                                                                                                                                                                                    e.preventDefault();

                                                                                                                                                                                      button.disabled = true;
                                                                                                                                                                                        button.textContent = "Creating Account...";

                                                                                                                                                                                          const company =
                                                                                                                                                                                              document.getElementById("company").value.trim();

                                                                                                                                                                                                const contact =
                                                                                                                                                                                                    document.getElementById("contact").value.trim();

                                                                                                                                                                                                      const phone =
                                                                                                                                                                                                          document.getElementById("phone").value.trim();

                                                                                                                                                                                                            const email =
                                                                                                                                                                                                                document.getElementById("email").value.trim();

                                                                                                                                                                                                                  const password =
                                                                                                                                                                                                                      document.getElementById("password").value;

                                                                                                                                                                                                                        const confirmPassword =
                                                                                                                                                                                                                            document.getElementById("confirmPassword").value;


                                                                                                                                                                                                                              if (password.length < 6) {

                                                                                                                                                                                                                                  showMessage(
                                                                                                                                                                                                                                        "Password must contain at least 6 characters.",
                                                                                                                                                                                                                                              "error"
                                                                                                                                                                                                                                                  );

                                                                                                                                                                                                                                                      button.disabled = false;
                                                                                                                                                                                                                                                          button.textContent = "Create Partner Account";

                                                                                                                                                                                                                                                              return;
                                                                                                                                                                                                                                                                }


                                                                                                                                                                                                                                                                  if (password !== confirmPassword) {

                                                                                                                                                                                                                                                                      showMessage(
                                                                                                                                                                                                                                                                            "Passwords do not match.",
                                                                                                                                                                                                                                                                                  "error"
                                                                                                                                                                                                                                                                                      );

                                                                                                                                                                                                                                                                                          button.disabled = false;
                                                                                                                                                                                                                                                                                              button.textContent = "Create Partner Account";

                                                                                                                                                                                                                                                                                                  return;
                                                                                                                                                                                                                                                                                                    }


                                                                                                                                                                                                                                                                                                      try {

                                                                                                                                                                                                                                                                                                          const { data, error } =
                                                                                                                                                                                                                                                                                                                await supabaseClient.auth.signUp({

                                                                                                                                                                                                                                                                                                                        email: email,

                                                                                                                                                                                                                                                                                                                                password: password,

                                                                                                                                                                                                                                                                                                                                        options: {
                                                                                                                                                                                                                                                                                                                                                  data: {
                                                                                                                                                                                                                                                                                                                                                              account_type: "partner",
                                                                                                                                                                                                                                                                                                                                                                          company_name: company,
                                                                                                                                                                                                                                                                                                                                                                                      contact_person: contact,
                                                                                                                                                                                                                                                                                                                                                                                                  phone: phone
                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                          });


                                                                                                                                                                                                                                                                                                                                                                                                                              if (error) {
                                                                                                                                                                                                                                                                                                                                                                                                                                    throw error;
                                                                                                                                                                                                                                                                                                                                                                                                                                        }


                                                                                                                                                                                                                                                                                                                                                                                                                                            showMessage(
                                                                                                                                                                                                                                                                                                                                                                                                                                                  "Partner account created successfully! Please login using your email and password.",
                                                                                                                                                                                                                                                                                                                                                                                                                                                        "success"
                                                                                                                                                                                                                                                                                                                                                                                                                                                            );


                                                                                                                                                                                                                                                                                                                                                                                                                                                                loginButton.style.display = "block";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                    button.style.display = "none";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                        form.reset();


                                                                                                                                                                                                                                                                                                                                                                                                                                                                          } catch (error) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                              console.error(error);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  showMessage(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        error.message || "Unable to create account. Please try again.",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              "error"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      button.disabled = false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          button.textContent = "Create Partner Account";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
