<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
    <title>Proof of Delivery</title>

      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

        <style>
            body {
                  font-family: Arial, sans-serif;
                        padding: 30px;
                              max-width: 600px;
                                    margin: auto;
                                        }

                                            input, textarea, button {
                                                  width: 100%;
                                                        padding: 12px;
                                                              margin-top: 10px;
                                                                    box-sizing: border-box;
                                                                        }

                                                                            textarea {
                                                                                  height: 100px;
                                                                                      }

                                                                                          button {
                                                                                                cursor: pointer;
                                                                                                    }

                                                                                                        #result {
                                                                                                              margin-top: 20px;
                                                                                                                    font-weight: bold;
                                                                                                                        }
                                                                                                                          </style>
                                                                                                                          </head>

                                                                                                                          <body>

                                                                                                                            <h2>Proof of Delivery</h2>

                                                                                                                              <input
                                                                                                                                  type="text"
                                                                                                                                      id="tracking"
                                                                                                                                          placeholder="Enter Tracking Number"
                                                                                                                                            >

                                                                                                                                              <input
                                                                                                                                                  type="number"
                                                                                                                                                      id="partnerId"
                                                                                                                                                          placeholder="Enter Partner ID"
                                                                                                                                                            >

                                                                                                                                                              <input
                                                                                                                                                                  type="text"
                                                                                                                                                                      id="recipient"
                                                                                                                                                                          placeholder="Recipient Name"
                                                                                                                                                                            >

                                                                                                                                                                              <textarea
                                                                                                                                                                                  id="notes"
                                                                                                                                                                                      placeholder="Delivery Notes"
                                                                                                                                                                                        ></textarea>

                                                                                                                                                                                          <input
                                                                                                                                                                                              type="url"
                                                                                                                                                                                                  id="proofUrl"
                                                                                                                                                                                                      placeholder="Proof URL (optional)"
                                                                                                                                                                                                        >

                                                                                                                                                                                                          <button onclick="submitPOD()">
                                                                                                                                                                                                              Submit Proof of Delivery
                                                                                                                                                                                                                </button>

                                                                                                                                                                                                                  <div id="result"></div>

                                                                                                                                                                                                                    <script>

                                                                                                                                                                                                                        const SUPABASE_URL =
                                                                                                                                                                                                                              "https://ebltviniygljwwseplph.supabase.co";

                                                                                                                                                                                                                                  const SUPABASE_PUBLISHABLE_KEY =
                                                                                                                                                                                                                                        "sb_publishable_8xzZUebYp_nIxVRWEQdiw_2H4RkHAa";

                                                                                                                                                                                                                                            const supabaseClient =
                                                                                                                                                                                                                                                  supabase.createClient(
                                                                                                                                                                                                                                                          SUPABASE_URL,
                                                                                                                                                                                                                                                                  SUPABASE_PUBLISHABLE_KEY
                                                                                                                                                                                                                                                                        );


                                                                                                                                                                                                                                                                            async function submitPOD() {

                                                                                                                                                                                                                                                                                  const result =
                                                                                                                                                                                                                                                                                          document.getElementById("result");

                                                                                                                                                                                                                                                                                                const tracking =
                                                                                                                                                                                                                                                                                                        document.getElementById("tracking").value.trim();

                                                                                                                                                                                                                                                                                                              const partnerId =
                                                                                                                                                                                                                                                                                                                      Number(
                                                                                                                                                                                                                                                                                                                                document.getElementById("partnerId").value
                                                                                                                                                                                                                                                                                                                                        );

                                                                                                                                                                                                                                                                                                                                              const recipient =
                                                                                                                                                                                                                                                                                                                                                      document.getElementById("recipient").value.trim();

                                                                                                                                                                                                                                                                                                                                                            const notes =
                                                                                                                                                                                                                                                                                                                                                                    document.getElementById("notes").value.trim();

                                                                                                                                                                                                                                                                                                                                                                          const proofUrl =
                                                                                                                                                                                                                                                                                                                                                                                  document.getElementById("proofUrl").value.trim();


                                                                                                                                                                                                                                                                                                                                                                                        if (!tracking || !partnerId || !recipient) {
                                                                                                                                                                                                                                                                                                                                                                                                result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                          "Please fill required fields.";
                                                                                                                                                                                                                                                                                                                                                                                                                  return;
                                                                                                                                                                                                                                                                                                                                                                                                                        }


                                                                                                                                                                                                                                                                                                                                                                                                                              const { data: shipment, error: shipmentError } =
                                                                                                                                                                                                                                                                                                                                                                                                                                      await supabaseClient
                                                                                                                                                                                                                                                                                                                                                                                                                                                .from("shipment_requests")
                                                                                                                                                                                                                                                                                                                                                                                                                                                          .select("id, tracking_number, partner_id, status")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .eq("tracking_number", tracking)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              .single();


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (shipmentError || !shipment) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      "Shipment not found.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if (Number(shipment.partner_id) !== partnerId) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            "This shipment is not assigned to this partner.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const { error: podError } =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        await supabaseClient
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  .from("delivery_proofs")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .insert({

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        shipment_id:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      shipment.id,

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  partner_id:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                partnerId,

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            recipient_name:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          recipient,

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      delivery_notes:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    notes,

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                proof_url:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              proofUrl || null,

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          delivered_at:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        new Date().toISOString()

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  });


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (podError) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          "Error: " + podError.message;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const { error: updateError } =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      await supabaseClient
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                .from("shipment_requests")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          .update({
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      status: "delivered"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                })
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          .eq("id", shipment.id)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .eq("partner_id", partnerId);


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if (updateError) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            "POD saved, but shipment status update failed: " +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      updateError.message;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  "Proof of Delivery submitted successfully!";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
