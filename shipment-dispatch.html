<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Shipment Dispatch - KRIM Logistics</title>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
          <script src="config.js"></script>

            <style>
                body {
                      font-family: Arial, sans-serif;
                            background: #f4f6f8;
                                  margin: 0;
                                        padding: 20px;
                                            }

                                                .box {
                                                      max-width: 850px;
                                                            margin: auto;
                                                                  background: white;
                                                                        padding: 20px;
                                                                              border-radius: 12px;
                                                                                  }

                                                                                      h1 {
                                                                                            text-align: center;
                                                                                                }

                                                                                                    input, select, textarea, button {
                                                                                                          width: 100%;
                                                                                                                box-sizing: border-box;
                                                                                                                      padding: 12px;
                                                                                                                            margin: 6px 0;
                                                                                                                                  border: 1px solid #ccc;
                                                                                                                                        border-radius: 7px;
                                                                                                                                              font-size: 15px;
                                                                                                                                                  }

                                                                                                                                                      button {
                                                                                                                                                            background: #111827;
                                                                                                                                                                  color: white;
                                                                                                                                                                        border: 0;
                                                                                                                                                                              cursor: pointer;
                                                                                                                                                                                  }

                                                                                                                                                                                      .message {
                                                                                                                                                                                            margin: 12px 0;
                                                                                                                                                                                                  font-weight: bold;
                                                                                                                                                                                                      }

                                                                                                                                                                                                          .dispatch {
                                                                                                                                                                                                                border: 1px solid #ddd;
                                                                                                                                                                                                                      border-radius: 8px;
                                                                                                                                                                                                                            padding: 14px;
                                                                                                                                                                                                                                  margin-top: 10px;
                                                                                                                                                                                                                                        background: #fafafa;
                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                              </style>
                                                                                                                                                                                                                                              </head>

                                                                                                                                                                                                                                              <body>

                                                                                                                                                                                                                                              <div class="box">

                                                                                                                                                                                                                                                <h1>🚚 Shipment Dispatch</h1>

                                                                                                                                                                                                                                                  <input id="shipmentId" type="number" placeholder="Shipment ID">

                                                                                                                                                                                                                                                    <input id="partnerId" type="number" placeholder="Partner ID">

                                                                                                                                                                                                                                                      <input id="truckId" type="number" placeholder="Truck ID">

                                                                                                                                                                                                                                                        <input id="driverId" type="number" placeholder="Driver ID">

                                                                                                                                                                                                                                                          <select id="dispatchStatus">
                                                                                                                                                                                                                                                              <option value="pending">Pending</option>
                                                                                                                                                                                                                                                                  <option value="assigned">Assigned</option>
                                                                                                                                                                                                                                                                      <option value="dispatched">Dispatched</option>
                                                                                                                                                                                                                                                                          <option value="picked_up">Picked Up</option>
                                                                                                                                                                                                                                                                              <option value="in_transit">In Transit</option>
                                                                                                                                                                                                                                                                                  <option value="delivered">Delivered</option>
                                                                                                                                                                                                                                                                                      <option value="cancelled">Cancelled</option>
                                                                                                                                                                                                                                                                                        </select>

                                                                                                                                                                                                                                                                                          <label>Dispatch Date</label>
                                                                                                                                                                                                                                                                                            <input id="dispatchDate" type="datetime-local">

                                                                                                                                                                                                                                                                                              <textarea id="notes" placeholder="Notes"></textarea>

                                                                                                                                                                                                                                                                                                <button onclick="createDispatch()">Create Dispatch</button>

                                                                                                                                                                                                                                                                                                  <div id="message" class="message"></div>

                                                                                                                                                                                                                                                                                                    <h2>Dispatch Records</h2>

                                                                                                                                                                                                                                                                                                      <div id="dispatches">
                                                                                                                                                                                                                                                                                                          Loading...
                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                            <script>

                                                                                                                                                                                                                                                                                                            const db = supabase.createClient(
                                                                                                                                                                                                                                                                                                              SUPABASE_URL,
                                                                                                                                                                                                                                                                                                                SUPABASE_PUBLISHABLE_KEY
                                                                                                                                                                                                                                                                                                                );


                                                                                                                                                                                                                                                                                                                async function createDispatch() {

                                                                                                                                                                                                                                                                                                                  const shipmentId = document.getElementById("shipmentId").value;
                                                                                                                                                                                                                                                                                                                    const partnerId = document.getElementById("partnerId").value;
                                                                                                                                                                                                                                                                                                                      const truckId = document.getElementById("truckId").value;
                                                                                                                                                                                                                                                                                                                        const driverId = document.getElementById("driverId").value;
                                                                                                                                                                                                                                                                                                                          const dispatchStatus = document.getElementById("dispatchStatus").value;
                                                                                                                                                                                                                                                                                                                            const dispatchDate = document.getElementById("dispatchDate").value;
                                                                                                                                                                                                                                                                                                                              const notes = document.getElementById("notes").value;

                                                                                                                                                                                                                                                                                                                                const message = document.getElementById("message");

                                                                                                                                                                                                                                                                                                                                  if (!shipmentId) {
                                                                                                                                                                                                                                                                                                                                      message.innerHTML = "Please enter Shipment ID.";
                                                                                                                                                                                                                                                                                                                                          return;
                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                              const { error } = await db
                                                                                                                                                                                                                                                                                                                                                  .from("shipment_dispatches")
                                                                                                                                                                                                                                                                                                                                                      .insert({
                                                                                                                                                                                                                                                                                                                                                            shipment_id: Number(shipmentId),
                                                                                                                                                                                                                                                                                                                                                                  partner_id: partnerId ? Number(partnerId) : null,
                                                                                                                                                                                                                                                                                                                                                                        truck_id: truckId ? Number(truckId) : null,
                                                                                                                                                                                                                                                                                                                                                                              driver_id: driverId ? Number(driverId) : null,
                                                                                                                                                                                                                                                                                                                                                                                    dispatch_status: dispatchStatus,
                                                                                                                                                                                                                                                                                                                                                                                          dispatch_date: dispatchDate || null,
                                                                                                                                                                                                                                                                                                                                                                                                notes: notes || null
                                                                                                                                                                                                                                                                                                                                                                                                    });

                                                                                                                                                                                                                                                                                                                                                                                                      if (error) {
                                                                                                                                                                                                                                                                                                                                                                                                          message.innerHTML = "Error: " + error.message;
                                                                                                                                                                                                                                                                                                                                                                                                              return;
                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                  message.innerHTML = "Dispatch created successfully.";

                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById("shipmentId").value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                      document.getElementById("partnerId").value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("truckId").value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                          document.getElementById("driverId").value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById("dispatchDate").value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                              document.getElementById("notes").value = "";

                                                                                                                                                                                                                                                                                                                                                                                                                                loadDispatches();
                                                                                                                                                                                                                                                                                                                                                                                                                                }


                                                                                                                                                                                                                                                                                                                                                                                                                                async function loadDispatches() {

                                                                                                                                                                                                                                                                                                                                                                                                                                  const container = document.getElementById("dispatches");

                                                                                                                                                                                                                                                                                                                                                                                                                                    const { data, error } = await db
                                                                                                                                                                                                                                                                                                                                                                                                                                        .from("shipment_dispatches")
                                                                                                                                                                                                                                                                                                                                                                                                                                            .select("*")
                                                                                                                                                                                                                                                                                                                                                                                                                                                .order("id", { ascending: false });

                                                                                                                                                                                                                                                                                                                                                                                                                                                  if (error) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                      container.innerHTML = "Error loading dispatches: " + error.message;
                                                                                                                                                                                                                                                                                                                                                                                                                                                          return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                              if (!data || data.length === 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  container.innerHTML = "No dispatch records found.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                          container.innerHTML = "";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                            data.forEach(item => {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const div = document.createElement("div");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    div.className = "dispatch";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        div.innerHTML = `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <strong>Dispatch #${item.id}</strong>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div>📦 Shipment ID: ${item.shipment_id}</div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div>🤝 Partner ID: ${item.partner_id || "Not assigned"}</div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div>🚛 Truck ID: ${item.truck_id || "Not assigned"}</div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div>👤 Driver ID: ${item.driver_id || "Not assigned"}</div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div>📌 Status: ${item.dispatch_status}</div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div>📅 Dispatch: ${item.dispatch_date || "Not set"}</div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div>📝 ${item.notes || "No notes"}</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            `;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                container.appendChild(div);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  loadDispatches();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </html>
