<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>KRIM Logistics - Rating Management</title>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
          <script src="config.js"></script>

            <style>
                body {
                      font-family: Arial, sans-serif;
                            background: #f4f6f8;
                                  padding: 20px;
                                        margin: 0;
                                            }

                                                .box {
                                                      max-width: 900px;
                                                            margin: auto;
                                                                  background: white;
                                                                        padding: 20px;
                                                                              border-radius: 10px;
                                                                                  }

                                                                                      h2 {
                                                                                            margin-top: 0;
                                                                                                }

                                                                                                    .rating {
                                                                                                          font-size: 24px;
                                                                                                              }

                                                                                                                  .card {
                                                                                                                        border: 1px solid #ddd;
                                                                                                                              padding: 15px;
                                                                                                                                    margin-top: 15px;
                                                                                                                                          border-radius: 8px;
                                                                                                                                              }

                                                                                                                                                  .muted {
                                                                                                                                                        color: #666;
                                                                                                                                                              font-size: 14px;
                                                                                                                                                                  }

                                                                                                                                                                      .error {
                                                                                                                                                                            color: red;
                                                                                                                                                                                  font-weight: bold;
                                                                                                                                                                                      }

                                                                                                                                                                                          .success {
                                                                                                                                                                                                color: green;
                                                                                                                                                                                                      font-weight: bold;
                                                                                                                                                                                                          }

                                                                                                                                                                                                              button {
                                                                                                                                                                                                                    padding: 10px 15px;
                                                                                                                                                                                                                          border: 0;
                                                                                                                                                                                                                                border-radius: 6px;
                                                                                                                                                                                                                                      cursor: pointer;
                                                                                                                                                                                                                                            background: #2563eb;
                                                                                                                                                                                                                                                  color: white;
                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                        </style>
                                                                                                                                                                                                                                                        </head>

                                                                                                                                                                                                                                                        <body>

                                                                                                                                                                                                                                                        <div class="box">

                                                                                                                                                                                                                                                          <h2>KRIM Logistics</h2>
                                                                                                                                                                                                                                                            <h3>Rating Management</h3>

                                                                                                                                                                                                                                                              <button onclick="loadRatings()">Refresh Ratings</button>

                                                                                                                                                                                                                                                                <div id="message"></div>
                                                                                                                                                                                                                                                                  <div id="ratings"></div>

                                                                                                                                                                                                                                                                  </div>

                                                                                                                                                                                                                                                                  <script>

                                                                                                                                                                                                                                                                  const db = supabase.createClient(
                                                                                                                                                                                                                                                                    SUPABASE_URL,
                                                                                                                                                                                                                                                                      SUPABASE_PUBLISHABLE_KEY
                                                                                                                                                                                                                                                                      );

                                                                                                                                                                                                                                                                      async function loadRatings() {

                                                                                                                                                                                                                                                                        const message = document.getElementById("message");
                                                                                                                                                                                                                                                                          const ratingsBox = document.getElementById("ratings");

                                                                                                                                                                                                                                                                            message.innerHTML = "Loading...";
                                                                                                                                                                                                                                                                              ratingsBox.innerHTML = "";

                                                                                                                                                                                                                                                                                const { data: userData, error: userError } =
                                                                                                                                                                                                                                                                                    await db.auth.getUser();

                                                                                                                                                                                                                                                                                      if (userError || !userData.user) {
                                                                                                                                                                                                                                                                                          message.innerHTML =
                                                                                                                                                                                                                                                                                                '<p class="error">Please login first.</p>';
                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                        const userId = userData.user.id;

                                                                                                                                                                                                                                                                                                          const { data: admin, error: adminError } =
                                                                                                                                                                                                                                                                                                              await db
                                                                                                                                                                                                                                                                                                                    .from("admin_users")
                                                                                                                                                                                                                                                                                                                          .select("user_id")
                                                                                                                                                                                                                                                                                                                                .eq("user_id", userId)
                                                                                                                                                                                                                                                                                                                                      .maybeSingle();

                                                                                                                                                                                                                                                                                                                                        if (adminError || !admin) {
                                                                                                                                                                                                                                                                                                                                            message.innerHTML =
                                                                                                                                                                                                                                                                                                                                                  '<p class="error">Access denied. Admin only.</p>';
                                                                                                                                                                                                                                                                                                                                                      return;
                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                          const { data, error } =
                                                                                                                                                                                                                                                                                                                                                              await db
                                                                                                                                                                                                                                                                                                                                                                    .from("shipment_ratings")
                                                                                                                                                                                                                                                                                                                                                                          .select("*")
                                                                                                                                                                                                                                                                                                                                                                                .order("id", { ascending: false });

                                                                                                                                                                                                                                                                                                                                                                                  if (error) {
                                                                                                                                                                                                                                                                                                                                                                                      message.innerHTML =
                                                                                                                                                                                                                                                                                                                                                                                            '<p class="error">Error: ' +
                                                                                                                                                                                                                                                                                                                                                                                                  error.message +
                                                                                                                                                                                                                                                                                                                                                                                                        '</p>';
                                                                                                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                if (!data || data.length === 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                    message.innerHTML =
                                                                                                                                                                                                                                                                                                                                                                                                                          '<p>No ratings found.</p>';
                                                                                                                                                                                                                                                                                                                                                                                                                              return;
                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                  message.innerHTML =
                                                                                                                                                                                                                                                                                                                                                                                                                                      '<p class="success">Ratings loaded successfully.</p>';

                                                                                                                                                                                                                                                                                                                                                                                                                                        data.forEach(function(item) {

                                                                                                                                                                                                                                                                                                                                                                                                                                            let stars = "";

                                                                                                                                                                                                                                                                                                                                                                                                                                                for (let i = 1; i <= 5; i++) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                      stars += i <= item.rating ? "★" : "☆";
                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                              const card = document.createElement("div");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  card.className = "card";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                      card.innerHTML = `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="rating">${stars}</div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <p><b>Rating:</b> ${item.rating}/5</p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <p><b>Shipment ID:</b> ${item.shipment_id}</p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <p><b>Customer ID:</b> ${item.customer_id}</p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <p><b>Feedback:</b><br>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          ${item.feedback || "No feedback provided."}</p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <p class="muted">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        Submitted: ${new Date(item.created_at).toLocaleString()}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  `;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      ratingsBox.appendChild(card);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        loadRatings();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
