<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
    <title>Margin Management</title>

      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

        <style>
            body {
                  font-family: Arial, sans-serif;
                        padding: 30px;
                              max-width: 600px;
                                    margin: auto;
                                        }

                                            input, button {
                                                  width: 100%;
                                                        padding: 12px;
                                                              margin-top: 10px;
                                                                    box-sizing: border-box;
                                                                        }

                                                                            #result {
                                                                                  margin-top: 20px;
                                                                                        font-weight: bold;
                                                                                            }
                                                                                              </style>
                                                                                              </head>

                                                                                              <body>

                                                                                                <h2>Shipment Margin Management</h2>

                                                                                                  <input
                                                                                                      type="text"
                                                                                                          id="tracking"
                                                                                                              placeholder="Enter Tracking Number"
                                                                                                                >

                                                                                                                  <input
                                                                                                                      type="number"
                                                                                                                          id="customerAmount"
                                                                                                                              placeholder="Customer Amount"
                                                                                                                                >

                                                                                                                                  <input
                                                                                                                                      type="number"
                                                                                                                                          id="partnerCost"
                                                                                                                                              placeholder="Partner Cost"
                                                                                                                                                >

                                                                                                                                                  <button onclick="saveMargin()">Save Margin</button>

                                                                                                                                                    <div id="result"></div>

                                                                                                                                                      <script>

                                                                                                                                                          const SUPABASE_URL =
                                                                                                                                                                "https://ebltviniygljwwseplph.supabase.co";

                                                                                                                                                                    const SUPABASE_PUBLISHABLE_KEY =
                                                                                                                                                                          "sb_publishable_8xzZUebYp_nIxVRWEQdiw_2H4RkHAa";

                                                                                                                                                                              const supabaseClient =
                                                                                                                                                                                    supabase.createClient(
                                                                                                                                                                                            SUPABASE_URL,
                                                                                                                                                                                                    SUPABASE_PUBLISHABLE_KEY
                                                                                                                                                                                                          );


                                                                                                                                                                                                              async function saveMargin() {

                                                                                                                                                                                                                    const result =
                                                                                                                                                                                                                            document.getElementById("result");

                                                                                                                                                                                                                                  const tracking =
                                                                                                                                                                                                                                          document.getElementById("tracking").value.trim();

                                                                                                                                                                                                                                                const customerAmount =
                                                                                                                                                                                                                                                        Number(
                                                                                                                                                                                                                                                                  document.getElementById("customerAmount").value
                                                                                                                                                                                                                                                                          );

                                                                                                                                                                                                                                                                                const partnerCost =
                                                                                                                                                                                                                                                                                        Number(
                                                                                                                                                                                                                                                                                                  document.getElementById("partnerCost").value
                                                                                                                                                                                                                                                                                                          );


                                                                                                                                                                                                                                                                                                                if (!tracking || !customerAmount || !partnerCost) {
                                                                                                                                                                                                                                                                                                                        result.innerText =
                                                                                                                                                                                                                                                                                                                                  "Please fill all fields.";
                                                                                                                                                                                                                                                                                                                                          return;
                                                                                                                                                                                                                                                                                                                                                }


                                                                                                                                                                                                                                                                                                                                                      const { data: shipment, error: shipmentError } =
                                                                                                                                                                                                                                                                                                                                                              await supabaseClient
                                                                                                                                                                                                                                                                                                                                                                        .from("shipment_requests")
                                                                                                                                                                                                                                                                                                                                                                                  .select("id, tracking_number")
                                                                                                                                                                                                                                                                                                                                                                                            .eq("tracking_number", tracking)
                                                                                                                                                                                                                                                                                                                                                                                                      .single();


                                                                                                                                                                                                                                                                                                                                                                                                            if (shipmentError || !shipment) {
                                                                                                                                                                                                                                                                                                                                                                                                                    result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                              "Shipment not found.";
                                                                                                                                                                                                                                                                                                                                                                                                                                      return;
                                                                                                                                                                                                                                                                                                                                                                                                                                            }


                                                                                                                                                                                                                                                                                                                                                                                                                                                  const { error } =
                                                                                                                                                                                                                                                                                                                                                                                                                                                          await supabaseClient
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .from("shipment_financials")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              .insert({

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          shipment_id: shipment.id,

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      customer_amount:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    customerAmount,

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                partner_cost:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              partnerCost,

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          status:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        "pending"

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  });


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (error) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          "Error: " + error.message;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const margin =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      customerAmount - partnerCost;


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    "Margin saved successfully! Platform margin: ₹" +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            margin.toFixed(2);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </html>
