<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <title>KRIM Logistics - Shipment Operations</title>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
          <script src="config.js"></script>

            <style>
                body {
                      font-family: Arial, sans-serif;
                            background: #f4f6f8;
                                  padding: 20px;
                                        margin: 0;
                                            }

                                                .box {
                                                      max-width: 900px;
                                                            margin: auto;
                                                                  background: white;
                                                                        padding: 20px;
                                                                              border-radius: 10px;
                                                                                  }

                                                                                      input, select, textarea, button {
                                                                                            width: 100%;
                                                                                                  box-sizing: border-box;
                                                                                                        padding: 12px;
                                                                                                              margin-top: 10px;
                                                                                                                    border: 1px solid #ccc;
                                                                                                                          border-radius: 6px;
                                                                                                                              }

                                                                                                                                  textarea {
                                                                                                                                        height: 90px;
                                                                                                                                            }

                                                                                                                                                button {
                                                                                                                                                      background: #2563eb;
                                                                                                                                                            color: white;
                                                                                                                                                                  border: none;
                                                                                                                                                                        font-weight: bold;
                                                                                                                                                                              cursor: pointer;
                                                                                                                                                                                  }

                                                                                                                                                                                      .card {
                                                                                                                                                                                            border: 1px solid #ddd;
                                                                                                                                                                                                  border-radius: 8px;
                                                                                                                                                                                                        padding: 15px;
                                                                                                                                                                                                              margin-top: 15px;
                                                                                                                                                                                                                  }

                                                                                                                                                                                                                      .success {
                                                                                                                                                                                                                            color: green;
                                                                                                                                                                                                                                  font-weight: bold;
                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                          .error {
                                                                                                                                                                                                                                                color: red;
                                                                                                                                                                                                                                                      font-weight: bold;
                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                              .muted {
                                                                                                                                                                                                                                                                    color: #666;
                                                                                                                                                                                                                                                                          font-size: 14px;
                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                </style>
                                                                                                                                                                                                                                                                                </head>

                                                                                                                                                                                                                                                                                <body>

                                                                                                                                                                                                                                                                                <div class="box">

                                                                                                                                                                                                                                                                                  <h2>KRIM Logistics</h2>
                                                                                                                                                                                                                                                                                    <h3>Shipment Operations</h3>

                                                                                                                                                                                                                                                                                      <h4>Create / Update Dispatch</h4>

                                                                                                                                                                                                                                                                                        <input
                                                                                                                                                                                                                                                                                            id="shipmentId"
                                                                                                                                                                                                                                                                                                type="number"
                                                                                                                                                                                                                                                                                                    placeholder="Shipment ID"
                                                                                                                                                                                                                                                                                                      >

                                                                                                                                                                                                                                                                                                        <input
                                                                                                                                                                                                                                                                                                            id="partnerId"
                                                                                                                                                                                                                                                                                                                type="number"
                                                                                                                                                                                                                                                                                                                    placeholder="Partner ID"
                                                                                                                                                                                                                                                                                                                      >

                                                                                                                                                                                                                                                                                                                        <input
                                                                                                                                                                                                                                                                                                                            id="truckId"
                                                                                                                                                                                                                                                                                                                                type="number"
                                                                                                                                                                                                                                                                                                                                    placeholder="Truck ID (optional)"
                                                                                                                                                                                                                                                                                                                                      >

                                                                                                                                                                                                                                                                                                                                        <input
                                                                                                                                                                                                                                                                                                                                            id="driverId"
                                                                                                                                                                                                                                                                                                                                                type="number"
                                                                                                                                                                                                                                                                                                                                                    placeholder="Driver ID (optional)"
                                                                                                                                                                                                                                                                                                                                                      >

                                                                                                                                                                                                                                                                                                                                                        <input
                                                                                                                                                                                                                                                                                                                                                            id="pickup"
                                                                                                                                                                                                                                                                                                                                                                placeholder="Pickup Location"
                                                                                                                                                                                                                                                                                                                                                                  >

                                                                                                                                                                                                                                                                                                                                                                    <input
                                                                                                                                                                                                                                                                                                                                                                        id="delivery"
                                                                                                                                                                                                                                                                                                                                                                            placeholder="Delivery Location"
                                                                                                                                                                                                                                                                                                                                                                              >

                                                                                                                                                                                                                                                                                                                                                                                <select id="status">
                                                                                                                                                                                                                                                                                                                                                                                    <option value="pending">Pending</option>
                                                                                                                                                                                                                                                                                                                                                                                        <option value="assigned">Assigned</option>
                                                                                                                                                                                                                                                                                                                                                                                            <option value="dispatched">Dispatched</option>
                                                                                                                                                                                                                                                                                                                                                                                                <option value="picked_up">Picked Up</option>
                                                                                                                                                                                                                                                                                                                                                                                                    <option value="in_transit">In Transit</option>
                                                                                                                                                                                                                                                                                                                                                                                                        <option value="delivered">Delivered</option>
                                                                                                                                                                                                                                                                                                                                                                                                            <option value="cancelled">Cancelled</option>
                                                                                                                                                                                                                                                                                                                                                                                                              </select>

                                                                                                                                                                                                                                                                                                                                                                                                                <input
                                                                                                                                                                                                                                                                                                                                                                                                                    id="estimated"
                                                                                                                                                                                                                                                                                                                                                                                                                        type="datetime-local"
                                                                                                                                                                                                                                                                                                                                                                                                                          >

                                                                                                                                                                                                                                                                                                                                                                                                                            <input
                                                                                                                                                                                                                                                                                                                                                                                                                                id="actual"
                                                                                                                                                                                                                                                                                                                                                                                                                                    type="datetime-local"
                                                                                                                                                                                                                                                                                                                                                                                                                                      >

                                                                                                                                                                                                                                                                                                                                                                                                                                        <input
                                                                                                                                                                                                                                                                                                                                                                                                                                            id="currentLocation"
                                                                                                                                                                                                                                                                                                                                                                                                                                                placeholder="Current Location"
                                                                                                                                                                                                                                                                                                                                                                                                                                                  >

                                                                                                                                                                                                                                                                                                                                                                                                                                                    <textarea
                                                                                                                                                                                                                                                                                                                                                                                                                                                        id="notes"
                                                                                                                                                                                                                                                                                                                                                                                                                                                            placeholder="Notes"
                                                                                                                                                                                                                                                                                                                                                                                                                                                              ></textarea>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button onclick="saveDispatch()">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    Save Dispatch
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div id="message"></div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <hr>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <h4>Dispatch Records</h4>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <button onclick="loadDispatches()">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  Refresh Records
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div id="list"></div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const db = supabase.createClient(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        SUPABASE_URL,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          SUPABASE_PUBLISHABLE_KEY
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          );


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          /* Save */

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          async function saveDispatch() {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const message =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById("message");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  message.innerHTML = "Saving...";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const shipmentId =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("shipmentId").value;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const partnerId =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.getElementById("partnerId").value;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!shipmentId || !partnerId) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    message.innerHTML =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          '<p class="error">Shipment ID and Partner ID are required.</p>';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const record = {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      shipment_id: Number(shipmentId),
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          partner_id: Number(partnerId),
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              truck_id:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById("truckId").value
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ? Number(document.getElementById("truckId").value)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    : null,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        driver_id:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.getElementById("driverId").value
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      ? Number(document.getElementById("driverId").value)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              : null,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  pickup_location:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("pickup").value.trim() || null,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            delivery_location:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  document.getElementById("delivery").value.trim() || null,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      dispatch_status:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById("status").value,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                estimated_delivery:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      document.getElementById("estimated").value
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              ? new Date(document.getElementById("estimated").value).toISOString()
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      : null,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          actual_delivery:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById("actual").value
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ? new Date(document.getElementById("actual").value).toISOString()
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                : null,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    current_location:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          document.getElementById("currentLocation").value.trim() || null,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              notes:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById("notes").value.trim() || null
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const { error } =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            await db
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  .from("shipment_dispatches")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        .insert(record);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if (error) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              message.innerHTML =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    '<p class="error">Error: ' +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          error.message +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                '</p>';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        message.innerHTML =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            '<p class="success">Dispatch saved successfully.</p>';

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              loadDispatches();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              /* Load */

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              async function loadDispatches() {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const list =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById("list");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      list.innerHTML = "Loading...";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const { data, error } =
