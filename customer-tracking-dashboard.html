<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
    <title>Customer Shipment Tracking</title>

      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

        <style>
            body {
                  font-family: Arial, sans-serif;
                        padding: 30px;
                              max-width: 600px;
                                    margin: auto;
                                        }

                                            input, button {
                                                  width: 100%;
                                                        padding: 12px;
                                                              margin-top: 10px;
                                                                    box-sizing: border-box;
                                                                        }

                                                                            #result {
                                                                                  margin-top: 20px;
                                                                                        line-height: 1.8;
                                                                                            }
                                                                                              </style>
                                                                                              </head>

                                                                                              <body>

                                                                                                <h2>Track Your Shipment</h2>

                                                                                                  <input
                                                                                                      type="text"
                                                                                                          id="tracking"
                                                                                                              placeholder="Enter Tracking Number"
                                                                                                                >

                                                                                                                  <button onclick="trackShipment()">
                                                                                                                      Track Shipment
                                                                                                                        </button>

                                                                                                                          <div id="result"></div>

                                                                                                                            <script>

                                                                                                                                const SUPABASE_URL =
                                                                                                                                      "https://ebltviniygljwwseplph.supabase.co";

                                                                                                                                          const SUPABASE_PUBLISHABLE_KEY =
                                                                                                                                                "sb_publishable_8xzZUeubYp_nIxVRWEQdiw_2H4RkHAa";

                                                                                                                                                    const supabaseClient =
                                                                                                                                                          supabase.createClient(
                                                                                                                                                                  SUPABASE_URL,
                                                                                                                                                                          SUPABASE_PUBLISHABLE_KEY
                                                                                                                                                                                );


                                                                                                                                                                                    async function trackShipment() {

                                                                                                                                                                                          const result =
                                                                                                                                                                                                  document.getElementById("result");

                                                                                                                                                                                                        const tracking =
                                                                                                                                                                                                                document.getElementById("tracking").value.trim();


                                                                                                                                                                                                                      if (!tracking) {
                                                                                                                                                                                                                              result.innerText =
                                                                                                                                                                                                                                        "Please enter tracking number.";
                                                                                                                                                                                                                                                return;
                                                                                                                                                                                                                                                      }


                                                                                                                                                                                                                                                            const { data: userData, error: userError } =
                                                                                                                                                                                                                                                                    await supabaseClient.auth.getUser();


                                                                                                                                                                                                                                                                          if (userError || !userData.user) {
                                                                                                                                                                                                                                                                                  result.innerText =
                                                                                                                                                                                                                                                                                            "Please login first.";
                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                          }


                                                                                                                                                                                                                                                                                                                const { data: shipment, error } =
                                                                                                                                                                                                                                                                                                                        await supabaseClient
                                                                                                                                                                                                                                                                                                                                  .from("shipment_requests")
                                                                                                                                                                                                                                                                                                                                            .select(`
                                                                                                                                                                                                                                                                                                                                                        tracking_number,
                                                                                                                                                                                                                                                                                                                                                                    pickup_location,
                                                                                                                                                                                                                                                                                                                                                                                delivery_location,
                                                                                                                                                                                                                                                                                                                                                                                            material_goods,
                                                                                                                                                                                                                                                                                                                                                                                                        weight,
                                                                                                                                                                                                                                                                                                                                                                                                                    truck_type,
                                                                                                                                                                                                                                                                                                                                                                                                                                status,
                                                                                                                                                                                                                                                                                                                                                                                                                                            partner,
                                                                                                                                                                                                                                                                                                                                                                                                                                                        quoted_price,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    quote_status
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              `)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        .eq("tracking_number", tracking)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  .eq("customer_id", userData.user.id)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .single();


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if (error || !shipment) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    "Shipment not found.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        result.innerHTML = `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <hr>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <p><strong>Tracking Number:</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ${shipment.tracking_number}</p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <p><strong>Pickup:</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ${shipment.pickup_location}</p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <p><strong>Delivery:</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ${shipment.delivery_location}</p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <p><strong>Goods:</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ${shipment.material_goods}</p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <p><strong>Weight:</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ${shipment.weight}</p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <p><strong>Truck Type:</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ${shipment.truck_type}</p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <p><strong>Status:</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ${shipment.status}</p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <p><strong>Partner:</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ${shipment.partner || "Unassigned"}</p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <p><strong>Quotation:</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ${
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          shipment.quoted_price
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      ? "₹" + shipment.quoted_price
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  : "Not available"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }</p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <p><strong>Quotation Status:</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          ${shipment.quote_status || "Pending"}</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                `;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </html>
