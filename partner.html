<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Partner Dashboard</title>

        <style>
            * {
                  box-sizing: border-box;
                      }

                          body {
                                margin: 0;
                                      font-family: Arial, sans-serif;
                                            background: #f4f7fb;
                                                  color: #172033;
                                                      }

                                                          header {
                                                                background: #111827;
                                                                      color: white;
                                                                            padding: 20px;
                                                                                }

                                                                                    header h1 {
                                                                                          margin: 0;
                                                                                                font-size: 22px;
                                                                                                    }

                                                                                                        main {
                                                                                                              max-width: 1000px;
                                                                                                                    margin: auto;
                                                                                                                          padding: 20px;
                                                                                                                              }

                                                                                                                                  .card {
                                                                                                                                        background: white;
                                                                                                                                              padding: 20px;
                                                                                                                                                    margin-bottom: 15px;
                                                                                                                                                          border-radius: 12px;
                                                                                                                                                                box-shadow: 0 2px 8px rgba(0,0,0,0.08);
                                                                                                                                                                    }

                                                                                                                                                                        .status {
                                                                                                                                                                              display: inline-block;
                                                                                                                                                                                    padding: 7px 12px;
                                                                                                                                                                                          border-radius: 20px;
                                                                                                                                                                                                background: #dbeafe;
                                                                                                                                                                                                      color: #1d4ed8;
                                                                                                                                                                                                            font-weight: bold;
                                                                                                                                                                                                                }
                                                                                                                                                                                                                  </style>
                                                                                                                                                                                                                  </head>

                                                                                                                                                                                                                  <body>

                                                                                                                                                                                                                  <header>
                                                                                                                                                                                                                    <h1>Partner Dashboard</h1>
                                                                                                                                                                                                                    </header>

                                                                                                                                                                                                                    <main>

                                                                                                                                                                                                                      <div class="card">
                                                                                                                                                                                                                          <h2>My Shipments</h2>
                                                                                                                                                                                                                              <p>Assigned shipments will appear here.</p>
                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                  <div class="card">
                                                                                                                                                                                                                                      <h3>Shipment #2</h3>
                                                                                                                                                                                                                                          <p><strong>Pickup:</strong> Ranchi</p>
                                                                                                                                                                                                                                              <p><strong>Delivery:</strong> Delhi</p>
                                                                                                                                                                                                                                                  <p><strong>Goods:</strong> General Goods</p>
                                                                                                                                                                                                                                                      <p><strong>Weight:</strong> 1000 kg</p>
                                                                                                                                                                                                                                                          <p><strong>Truck:</strong> Open Truck</p>
                                                                                                                                                                                                                                                              <p><strong>Customer:</strong> Customer</p>
                                                                                                                                                                                                                                                                  <span class="status">Assigned</span>
                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                    </main>

                                                                                                                                                                                                                                                                    </body>
                                                                                                                                                                                                                                                                    </html>
