<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Customer Sign Up</title>
            </head>
            <body>

                <h1>Customer Sign Up</h1>

                    <form id="signupForm">
                            <p>
                                        <label>Email:</label><br>
                                                    <input type="email" id="email" placeholder="your@email.com">
                                                            </p>

                                                                    <p>
                                                                                <label>Password:</label><br>
                                                                                            <input type="password" id="password" placeholder="Min 6 characters">
                                                                                                    </p>

                                                                                                            <p>
                                                                                                                        <label>Full Name:</label><br>
                                                                                                                                    <input type="text" id="fullName" placeholder="Your full name">
                                                                                                                                            </p>

                                                                                                                                                    <p>
                                                                                                                                                                <label>Phone:</label><br>
                                                                                                                                                                            <input type="text" id="phone" placeholder="Phone number">
                                                                                                                                                                                    </p>

                                                                                                                                                                                            <button type="submit" id="signupBtn">Sign Up</button>
                                                                                                                                                                                                </form>

                                                                                                                                                                                                    <div id="message"></div>

                                                                                                                                                                                                        <br>
                                                                                                                                                                                                            <a href="index.html">Back to Home</a>
                                                                                                                                                                                                                <br>
                                                                                                                                                                                                                    <a href="customer-login.html">Already have an account? Login</a>

                                                                                                                                                                                                                        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
                                                                                                                                                                                                                            </script>
                                                                                                                                                                                                                                <script>
                                                                                                                                                                                                                                        // Supabase configuration
                                                                                                                                                                                                                                                const supabase = window.supabase.createClient(
                                                                                                                                                                                                                                                            'https://ebltviniygljwwseplph.supabase.co',
                                                                                                                                                                                                                                                                        'sb_publishable_8xzZUeubYp_nIxVRWEQdiw_2H4RkHAa'
                                                                                                                                                                                                                                                                                );

                                                                                                                                                                                                                                                                                        // Get the form
                                                                                                                                                                                                                                                                                                const form = document.getElementById('signupForm');
                                                                                                                                                                                                                                                                                                        const message = document.getElementById('message');

                                                                                                                                                                                                                                                                                                                // Listen for form submit
                                                                                                                                                                                                                                                                                                                        form.addEventListener('submit', async function(event) {
                                                                                                                                                                                                                                                                                                                                    // Stop page refresh
                                                                                                                                                                                                                                                                                                                                                event.preventDefault();

                                                                                                                                                                                                                                                                                                                                                            // Get values
                                                                                                                                                                                                                                                                                                                                                                        const email = document.getElementById('email').value;
                                                                                                                                                                                                                                                                                                                                                                                    const password = document.getElementById('password').value;
                                                                                                                                                                                                                                                                                                                                                                                                const fullName = document.getElementById('fullName').value;
                                                                                                                                                                                                                                                                                                                                                                                                            const phone = document.getElementById('phone').value;

                                                                                                                                                                                                                                                                                                                                                                                                                        // Show message
                                                                                                                                                                                                                                                                                                                                                                                                                                    message.innerHTML = '⏳ Creating account...';
                                                                                                                                                                                                                                                                                                                                                                                                                                                message.style.color = 'blue';

                                                                                                                                                                                                                                                                                                                                                                                                                                                            // Validate
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (!email) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        message.innerHTML = '⚠️ Please enter email';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        message.style.color = 'red';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!password || password.length < 6) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                message.innerHTML = '⚠️ Password must be at least 6 characters';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                message.style.color = 'red';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        try {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        // Call Supabase
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const { data, error } = await supabase.auth.signUp({
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            email: email,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                password: password,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    options: {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            data: {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        full_name: fullName,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    phone: phone,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                role: 'customer'
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // Check for error
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (error) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                message.innerHTML = '❌ ' + error.message;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    message.style.color = 'red';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        // Success
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        message.innerHTML = '✅ Account created! You can now login.';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        message.style.color = 'green';

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        // Clear form
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById('email').value = '';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById('password').value = '';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById('fullName').value = '';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById('phone').value = '';

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    } catch (err) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    message.innerHTML = '❌ Error: ' + err.message;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    message.style.color = 'red';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
