<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Customer Sign Up</title>
            </head>
            <body>

                <h1>Customer Sign Up</h1>

                    <form id="signupForm">
                            <p>
                                        <label>Email:</label><br>
                                                    <input type="email" id="email" placeholder="your@email.com" required>
                                                            </p>

                                                                    <p>
                                                                                <label>Password:</label><br>
                                                                                            <input type="password" id="password" placeholder="Min 6 characters" required>
                                                                                                    </p>

                                                                                                            <p>
                                                                                                                        <label>Full Name:</label><br>
                                                                                                                                    <input type="text" id="fullName" placeholder="Your full name">
                                                                                                                                            </p>

                                                                                                                                                    <p>
                                                                                                                                                                <label>Phone:</label><br>
                                                                                                                                                                            <input type="text" id="phone" placeholder="Phone number">
                                                                                                                                                                                    </p>

                                                                                                                                                                                            <button type="submit" id="submitBtn">Sign Up</button>
                                                                                                                                                                                                </form>

                                                                                                                                                                                                    <div id="message" style="margin-top:15px; padding:10px; border-radius:6px;"></div>

                                                                                                                                                                                                        <br>
                                                                                                                                                                                                            <a href="index.html">Back to Home</a>
                                                                                                                                                                                                                <br>
                                                                                                                                                                                                                    <a href="customer-login.html">Already have an account? Login</a>

                                                                                                                                                                                                                        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
                                                                                                                                                                                                                            </script>
                                                                                                                                                                                                                                <script>
                                                                                                                                                                                                                                        const supabase = window.supabase.createClient(
                                                                                                                                                                                                                                                    'https://ebltviniygljwwseplph.supabase.co',
                                                                                                                                                                                                                                                                'sb_publishable_8xzZUeubYp_nIxVRWEQdiw_2H4RkHAa'
                                                                                                                                                                                                                                                                        );

                                                                                                                                                                                                                                                                                const form = document.getElementById('signupForm');
                                                                                                                                                                                                                                                                                        const message = document.getElementById('message');
                                                                                                                                                                                                                                                                                                const submitBtn = document.getElementById('submitBtn');

                                                                                                                                                                                                                                                                                                        function showMessage(text, color) {
                                                                                                                                                                                                                                                                                                                    message.style.display = 'block';
                                                                                                                                                                                                                                                                                                                                message.style.background = color === 'red' ? '#fed7d7' : '#c6f6d5';
                                                                                                                                                                                                                                                                                                                                            message.style.color = color === 'red' ? '#9b2c2c' : '#276749';
                                                                                                                                                                                                                                                                                                                                                        message.innerHTML = text;
                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                        form.addEventListener('submit', async function(e) {
                                                                                                                                                                                                                                                                                                                                                                                    e.preventDefault();

                                                                                                                                                                                                                                                                                                                                                                                                // Disable button to prevent double click
                                                                                                                                                                                                                                                                                                                                                                                                            submitBtn.disabled = true;
                                                                                                                                                                                                                                                                                                                                                                                                                        submitBtn.textContent = 'Creating account...';

                                                                                                                                                                                                                                                                                                                                                                                                                                    const email = document.getElementById('email').value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                const password = document.getElementById('password').value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                            const fullName = document.getElementById('fullName').value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const phone = document.getElementById('phone').value.trim();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // Clear previous message
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                message.style.display = 'none';

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // Validation
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (!email) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        showMessage('⚠️ Please enter your email address', 'red');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        submitBtn.disabled = false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        submitBtn.textContent = 'Sign Up';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!password) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                showMessage('⚠️ Please enter a password', 'red');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                submitBtn.disabled = false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                submitBtn.textContent = 'Sign Up';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (password.length < 6) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        showMessage('⚠️ Password must be at least 6 characters', 'red');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        submitBtn.disabled = false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        submitBtn.textContent = 'Sign Up';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                showMessage('⏳ Creating account... Please wait.', 'green');

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            try {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const { data, error } = await supabase.auth.signUp({
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                email: email,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    password: password,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        options: {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                data: {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            full_name: fullName || null,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        phone: phone || null,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    role: 'customer'
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (error) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    showMessage('❌ ' + error.message, 'red');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        submitBtn.disabled = false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            submitBtn.textContent = 'Sign Up';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (data.user) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    showMessage(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            '✅ Account created successfully! You can now login.',
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    'green'
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        );
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            form.reset();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                showMessage('❌ Something went wrong. Please try again.', 'red');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            } catch (err) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            showMessage('❌ Error: ' + err.message, 'red');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    submitBtn.disabled = false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                submitBtn.textContent = 'Sign Up';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
