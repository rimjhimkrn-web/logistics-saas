<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Customer Sign Up</title>
            </head>
            <body>

                <h1>Customer Sign Up</h1>

                    <form>
                            <p>
                                        <label>Email:</label><br>
                                                    <input type="email" id="email" placeholder="your@email.com">
                                                            </p>

                                                                    <p>
                                                                                <label>Password:</label><br>
                                                                                            <input type="password" id="password" placeholder="Min 6 characters">
                                                                                                    </p>

                                                                                                            <p>
                                                                                                                        <label>Full Name:</label><br>
                                                                                                                                    <input type="text" id="fullName" placeholder="Your full name">
                                                                                                                                            </p>

                                                                                                                                                    <p>
                                                                                                                                                                <label>Phone:</label><br>
                                                                                                                                                                            <input type="text" id="phone" placeholder="Phone number">
                                                                                                                                                                                    </p>

                                                                                                                                                                                            <button type="button" onclick="signup()">Sign Up</button>
                                                                                                                                                                                                </form>

                                                                                                                                                                                                    <div id="message"></div>

                                                                                                                                                                                                        <br>
                                                                                                                                                                                                            <a href="index.html">Back to Home</a>
                                                                                                                                                                                                                <br>
                                                                                                                                                                                                                    <a href="customer-login.html">Already have an account? Login</a>

                                                                                                                                                                                                                        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
                                                                                                                                                                                                                            </script>
                                                                                                                                                                                                                                <script>
                                                                                                                                                                                                                                        const supabase = window.supabase.createClient(
                                                                                                                                                                                                                                                    'https://ebltviniygljwwseplph.supabase.co',
                                                                                                                                                                                                                                                                'sb_publishable_8xzZUeubYp_nIxVRWEQdiw_2H4RkHAa'
                                                                                                                                                                                                                                                                        );

                                                                                                                                                                                                                                                                                async function signup() {
                                                                                                                                                                                                                                                                                            const email = document.getElementById('email').value;
                                                                                                                                                                                                                                                                                                        const password = document.getElementById('password').value;
                                                                                                                                                                                                                                                                                                                    const fullName = document.getElementById('fullName').value;
                                                                                                                                                                                                                                                                                                                                const phone = document.getElementById('phone').value;
                                                                                                                                                                                                                                                                                                                                            const message = document.getElementById('message');

                                                                                                                                                                                                                                                                                                                                                        if (!email) {
                                                                                                                                                                                                                                                                                                                                                                        message.innerHTML = 'Please enter email';
                                                                                                                                                                                                                                                                                                                                                                                        message.style.color = 'red';
                                                                                                                                                                                                                                                                                                                                                                                                        return;
                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                if (!password || password.length < 6) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                message.innerHTML = 'Password must be at least 6 characters';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                message.style.color = 'red';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        message.innerHTML = 'Creating account...';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    message.style.color = 'blue';

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const { data, error } = await supabase.auth.signUp({
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                email: email,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                password: password,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                options: {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    data: {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            full_name: fullName,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    phone: phone,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            role: 'customer'
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (error) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        message.innerHTML = 'Error: ' + error.message;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        message.style.color = 'red';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                message.innerHTML = '✅ Account created! You can now login.';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            message.style.color = 'green';

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById('email').value = '';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById('password').value = '';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById('fullName').value = '';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById('phone').value = '';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
