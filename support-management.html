<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>KRIM Logistics - Support Management</title>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
          <script src="config.js"></script>

            <style>
                body {
                      font-family: Arial, sans-serif;
                            margin: 0;
                                  background: #f4f6f8;
                                        color: #222;
                                            }

                                                header {
                                                      background: #111827;
                                                            color: white;
                                                                  padding: 18px;
                                                                      }

                                                                          header h1 {
                                                                                margin: 0;
                                                                                      font-size: 22px;
                                                                                          }

                                                                                              header p {
                                                                                                    margin: 5px 0 0;
                                                                                                          color: #cbd5e1;
                                                                                                                font-size: 14px;
                                                                                                                    }

                                                                                                                        .container {
                                                                                                                              max-width: 1100px;
                                                                                                                                    margin: 20px auto;
                                                                                                                                          padding: 0 15px;
                                                                                                                                              }

                                                                                                                                                  .top {
                                                                                                                                                        display: flex;
                                                                                                                                                              justify-content: space-between;
                                                                                                                                                                    align-items: center;
                                                                                                                                                                          gap: 10px;
                                                                                                                                                                                margin-bottom: 20px;
                                                                                                                                                                                      flex-wrap: wrap;
                                                                                                                                                                                          }

                                                                                                                                                                                              button {
                                                                                                                                                                                                    border: none;
                                                                                                                                                                                                          border-radius: 7px;
                                                                                                                                                                                                                padding: 10px 15px;
                                                                                                                                                                                                                      cursor: pointer;
                                                                                                                                                                                                                            font-weight: bold;
                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                    #refreshBtn {
                                                                                                                                                                                                                                          background: #2563eb;
                                                                                                                                                                                                                                                color: white;
                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                        #logoutBtn {
                                                                                                                                                                                                                                                              background: #dc2626;
                                                                                                                                                                                                                                                                    color: white;
                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                            .message {
                                                                                                                                                                                                                                                                                  background: white;
                                                                                                                                                                                                                                                                                        padding: 15px;
                                                                                                                                                                                                                                                                                              border-radius: 10px;
                                                                                                                                                                                                                                                                                                    margin-bottom: 15px;
                                                                                                                                                                                                                                                                                                          display: none;
                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                  .ticket {
                                                                                                                                                                                                                                                                                                                        background: white;
                                                                                                                                                                                                                                                                                                                              border-radius: 12px;
                                                                                                                                                                                                                                                                                                                                    padding: 18px;
                                                                                                                                                                                                                                                                                                                                          margin-bottom: 15px;
                                                                                                                                                                                                                                                                                                                                                box-shadow: 0 2px 8px rgba(0,0,0,0.06);
                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                        .ticket h3 {
                                                                                                                                                                                                                                                                                                                                                              margin: 0 0 8px;
                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                      .info {
                                                                                                                                                                                                                                                                                                                                                                            font-size: 14px;
                                                                                                                                                                                                                                                                                                                                                                                  line-height: 1.6;
                                                                                                                                                                                                                                                                                                                                                                                        color: #444;
                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                .issue {
                                                                                                                                                                                                                                                                                                                                                                                                      background: #f8fafc;
                                                                                                                                                                                                                                                                                                                                                                                                            padding: 12px;
                                                                                                                                                                                                                                                                                                                                                                                                                  border-radius: 8px;
                                                                                                                                                                                                                                                                                                                                                                                                                        margin: 12px 0;
                                                                                                                                                                                                                                                                                                                                                                                                                              white-space: pre-wrap;
                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                      .status-row {
                                                                                                                                                                                                                                                                                                                                                                                                                                            display: flex;
                                                                                                                                                                                                                                                                                                                                                                                                                                                  gap: 10px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                        align-items: center;
                                                                                                                                                                                                                                                                                                                                                                                                                                                              flex-wrap: wrap;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                      select {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            padding: 9px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  border: 1px solid #cbd5e1;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        border-radius: 7px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              background: white;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      .update-btn {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            background: #16a34a;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  color: white;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          .empty {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                background: white;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      padding: 25px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            text-align: center;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  border-radius: 10px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        color: #666;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                .error {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      color: #b91c1c;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              .success {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    color: #15803d;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </head>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <header>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <h1>KRIM Logistics</h1>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <p>Support Management</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </header>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="container">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="top">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <h2>Customer Support Tickets</h2>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <button id="refreshBtn" onclick="loadTickets()">Refresh</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button id="logoutBtn" onclick="logout()">Logout</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div id="message" class="message"></div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div id="tickets">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  Loading tickets...
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const db = supabase.createClient(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          SUPABASE_URL,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              SUPABASE_PUBLISHABLE_KEY
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  let currentUser = null;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    async function checkAdmin() {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const { data, error } = await db.auth.getUser();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (error || !data.user) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  document.getElementById("tickets").innerHTML =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          '<div class="empty error">Please login with your admin account.</div>';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                return false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        currentUser = data.user;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const { data: admin, error: adminError } = await db
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  .from("admin_users")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        .select("user_id")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              .eq("user_id", currentUser.id)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .maybeSingle();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (adminError || !admin) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.getElementById("tickets").innerHTML =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      '<div class="empty error">Access denied. This account is not an admin.</div>';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            return false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return true;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        async function loadTickets() {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const allowed = await checkAdmin();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!allowed) return;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const container = document.getElementById("tickets");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        container.innerHTML = "Loading tickets...";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const { data, error } = await db
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  .from("support_tickets")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        .select("*")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              .order("id", { ascending: false });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if (error) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        container.innerHTML =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                '<div class="empty error">Unable to load tickets.<br>' +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        error.message +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                '</div>';

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if (!data || data.length === 0) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    container.innerHTML =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            '<div class="empty">No support tickets found.</div>';

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  return;
