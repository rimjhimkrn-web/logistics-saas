<!DOCTYPE html>
<html lang="en">
    <head>
          <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>KRIM Logistics | Reset Password</title>

                <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
                  <script src="config.js"></script>

                    <style>
                            * {
                                      box-sizing: border-box;
                            }

                                body {
                                          margin: 0;
                                                font-family: Arial, sans-serif;
                                                      background: #f4f7fb;
                                                            color: #172033;
                                }

                                    .box {
                                              width: 92%;
                                                    max-width: 420px;
                                                          margin: 80px auto;
                                                                background: white;
                                                                      padding: 25px;
                                                                            border-radius: 15px;
                                                                                  box-shadow: 0 5px 20px rgba(0,0,0,.08);
                                    }

                                        h1 {
                                                  margin-top: 0;
                                                        color: #0b5ed7;
                                                              font-size: 25px;
                                        }

                                            p {
                                                      color: #667085;
                                                            line-height: 1.5;
                                            }

                                                input {
                                                          width: 100%;
                                                                padding: 13px;
                                                                      margin: 10px 0;
                                                                            border: 1px solid #d1d5db;
                                                                                  border-radius: 8px;
                                                                                        font-size: 15px;
                                                }

                                                    button {
                                                              width: 100%;
                                                                    padding: 13px;
                                                                          margin-top: 8px;
                                                                                border: 0;
                                                                                      border-radius: 8px;
                                                                                            background: #0b5ed7;
                                                                                                  color: white;
                                                                                                        font-size: 15px;
                                                                                                              font-weight: bold;
                                                                                                                    cursor: pointer;
                                                    }

                                                        .back {
                                                                  display: block;
                                                                        text-align: center;
                                                                              margin-top: 18px;
                                                                                    color: #0b5ed7;
                                                                                          text-decoration: none;
                                                                                                font-weight: bold;
                                                        }

                                                            #message {
                                                                      margin-top: 15px;
                                                                            padding: 10px;
                                                                                  border-radius: 8px;
                                                                                        display: none;
                                                                                              font-size: 14px;
                                                            }
                                                        </style>
                                                    </head>

                                                    <body>

                                                          <div class="box">

                                                                <h1>Reset Password</h1>

                                                                    <p>
                                                                              Enter your registered customer email address.
                                                                                    We will send you a password reset link.
                                                                    </p>

                                                                        <input
                                                                              type="email"
                                                                                    id="email"
                                                                                          placeholder="Enter your email"
                                                                                                required
                                                                                                    >

                                                                                                        <button id="resetBtn">
                                                                                                                  Send Reset Link
                                                                                                        </button>

                                                                                                            <div id="message"></div>

                                                                                                                <a href="customer-login.html" class="back">
                                                                                                                          ← Back to Customer Login
                                                                                                                </a>

                                                                                                            </div>

                                                                                                              <script>
                                                                                                                    const client =
                                                                                                                          (typeof supabaseClient !== "undefined")
                                                                                                                                  ? supabaseClient
                                                                                                                                          : supabase.createClient(
                                                                                                                                                        SUPABASE_URL,
                                                                                                                                                                    SUPABASE_PUBLISHABLE_KEY
                                                                                                                                          );

                                                                                                                                              const button = document.getElementById("resetBtn");
                                                                                                                                                  const message = document.getElementById("message");

                                                                                                                                                      function showMessage(text, success) {
                                                                                                                                                              message.style.display = "block";
                                                                                                                                                                    message.textContent = text;

                                                                                                                                                                          if (success) {
                                                                                                                                                                                    message.style.background = "#dcfce7";
                                                                                                                                                                                            message.style.color = "#166534";
                                                                                                                                                                          } else {
                                                                                                                                                                                    message.style.background = "#fee2e2";
                                                                                                                                                                                            message.style.color = "#991b1b";
                                                                                                                                                                          }
                                                                                                                                                                        }

                                                                                                                                                                            button.addEventListener("click", async function () {

                                                                                                                                                                                      const email = document.getElementById("email").value.trim();

                                                                                                                                                                                            if (!email) {
                                                                                                                                                                                                        showMessage("Please enter your email address.", false);
                                                                                                                                                                                                                return;
                                                                                                                                                                                            }

                                                                                                                                                                                                  button.disabled = true;
                                                                                                                                                                                                        button.textContent = "Sending...";

                                                                                                                                                                                                              try {

                                                                                                                                                                                                                        const redirectUrl =
                                                                                                                                                                                                                                  window.location.origin +
                                                                                                                                                                                                                                            window.location.pathname.replace(
                                                                                                                                                                                                                                                            "forgot-password.html",
                                                                                                                                                                                                                                                                        "reset-password.html"
                                                                                                                                                                                                                                            );

                                                                                                                                                                                                                                                    const { error } =
                                                                                                                                                                                                                                                              await client.auth.resetPasswordForEmail(
                                                                                                                                                                                                                                                                            email,
                                                                                                                                                                                                                                                                                        {
                                                                                                                                                                                                                                                                                                          redirectTo: redirectUrl
                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                              );

                                                                                                                                                                                                                                                                      if (error) {
                                                                                                                                                                                                                                                                                  throw error;
                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                              showMessage(
                                                                                                                                                                                                                                                                                          "Reset link sent! Please check your email.",
                                                                                                                                                                                                                                                                                                    true
                                                                                                                                                                                                                                                                              );

                                                                                                                                                                                                                                                                    } catch (error) {

                                                                                                                                                                                                                                                                                showMessage(
                                                                                                                                                                                                                                                                                              error.message || "Unable to send reset link.",
                                                                                                                                                                                                                                                                                                        false
                                                                                                                                                                                                                                                                                );

                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                          button.disabled = false;
                                                                                                                                                                                                                                                                                button.textContent = "Send Reset Link";
                                                                                                                                                                                                                                                                });
                                                                                                                                                                                                                                                            </script>

                                                                                                                                                                                                                                                        </body>
                                                                                                                                                                                                                                                        </html>
                                                                                                                                                                                                                                                                                )
                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                              )
                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                              )
                                                                                                                                                                                                                                            )
                                                                                                                                                                                                              }
                                                                                                                                                                                            }
                                                                                                                                                                            })
                                                                                                                                                                          }
                                                                                                                                                                          }
                                                                                                                                                      }
                                                                                                                                          )
                                                            }
                                                        }
                                                    }
                                                }
                                            }
                                        }
                                    }
                                }
                            }
