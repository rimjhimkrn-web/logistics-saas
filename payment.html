<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <title>KRIM Logistics - Payment</title>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
          <script src="config.js"></script>

            <style>
                body {
                      font-family: Arial, sans-serif;
                            background: #f4f7fb;
                                  padding: 20px;
                                      }

                                          .box {
                                                max-width: 500px;
                                                      margin: 40px auto;
                                                            background: white;
                                                                  padding: 25px;
                                                                        border-radius: 12px;
                                                                              box-shadow: 0 4px 15px rgba(0,0,0,0.08);
                                                                                  }

                                                                                      h1 {
                                                                                            color: #102a43;
                                                                                                }

                                                                                                    .info {
                                                                                                          margin: 15px 0;
                                                                                                                padding: 12px;
                                                                                                                      background: #f1f5f9;
                                                                                                                            border-radius: 8px;
                                                                                                                                }

                                                                                                                                    button {
                                                                                                                                          width: 100%;
                                                                                                                                                padding: 14px;
                                                                                                                                                      background: #102a43;
                                                                                                                                                            color: white;
                                                                                                                                                                  border: none;
                                                                                                                                                                        border-radius: 7px;
                                                                                                                                                                              font-size: 16px;
                                                                                                                                                                                    cursor: pointer;
                                                                                                                                                                                        }

                                                                                                                                                                                            button:disabled {
                                                                                                                                                                                                  background: #999;
                                                                                                                                                                                                      }

                                                                                                                                                                                                          #message {
                                                                                                                                                                                                                margin-top: 15px;
                                                                                                                                                                                                                      font-weight: bold;
                                                                                                                                                                                                                          }
                                                                                                                                                                                                                            </style>
                                                                                                                                                                                                                            </head>

                                                                                                                                                                                                                            <body>

                                                                                                                                                                                                                            <div class="box">

                                                                                                                                                                                                                              <h1>Shipment Payment</h1>

                                                                                                                                                                                                                                <div class="info">
                                                                                                                                                                                                                                    <strong>Tracking Number:</strong>
                                                                                                                                                                                                                                        <span id="tracking">Loading...</span>
                                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                                            <div class="info">
                                                                                                                                                                                                                                                <strong>Quotation:</strong>
                                                                                                                                                                                                                                                    ₹<span id="price">Loading...</span>
                                                                                                                                                                                                                                                      </div>

                                                                                                                                                                                                                                                        <button id="payButton" onclick="payNow()" disabled>
                                                                                                                                                                                                                                                            Pay Now
                                                                                                                                                                                                                                                              </button>

                                                                                                                                                                                                                                                                <div id="message"></div>

                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                <script>

                                                                                                                                                                                                                                                                const tracking =
                                                                                                                                                                                                                                                                  new URLSearchParams(window.location.search).get("tracking")
                                                                                                                                                                                                                                                                    || "TRK-000014";

                                                                                                                                                                                                                                                                    document.getElementById("tracking").innerText = tracking;

                                                                                                                                                                                                                                                                    async function loadPayment() {

                                                                                                                                                                                                                                                                      const message = document.getElementById("message");
                                                                                                                                                                                                                                                                        const payButton = document.getElementById("payButton");

                                                                                                                                                                                                                                                                          const { data: shipment, error } = await supabaseClient
                                                                                                                                                                                                                                                                              .from("shipment_requests")
                                                                                                                                                                                                                                                                                  .select("id, tracking_number, quoted_price, quote_status")
                                                                                                                                                                                                                                                                                      .eq("tracking_number", tracking)
                                                                                                                                                                                                                                                                                          .maybeSingle();

                                                                                                                                                                                                                                                                                            if (error) {
                                                                                                                                                                                                                                                                                                message.innerText = "Error loading shipment.";
                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                        if (!shipment) {
                                                                                                                                                                                                                                                                                                            message.innerText = "Shipment not found.";
                                                                                                                                                                                                                                                                                                                return;
                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                    // Check quotation
                                                                                                                                                                                                                                                                                                                      if (
                                                                                                                                                                                                                                                                                                                          shipment.quote_status !== "accepted"
                                                                                                                                                                                                                                                                                                                              || shipment.quoted_price === null
                                                                                                                                                                                                                                                                                                                                ) {
                                                                                                                                                                                                                                                                                                                                    message.innerText = "Please accept the quotation first.";
                                                                                                                                                                                                                                                                                                                                        return;
                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                            // Show quotation
                                                                                                                                                                                                                                                                                                                                              document.getElementById("price").innerText =
                                                                                                                                                                                                                                                                                                                                                  Number(shipment.quoted_price).toLocaleString("en-IN");

                                                                                                                                                                                                                                                                                                                                                    // Enable payment button
                                                                                                                                                                                                                                                                                                                                                      payButton.disabled = false;

                                                                                                                                                                                                                                                                                                                                                        message.innerText = "Quotation accepted. You can make payment.";
                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                        function payNow() {

                                                                                                                                                                                                                                                                                                                                                          alert(
                                                                                                                                                                                                                                                                                                                                                              "Payment gateway is ready to be connected here."
                                                                                                                                                                                                                                                                                                                                                                );

                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                loadPayment();

                                                                                                                                                                                                                                                                                                                                                                </script>

                                                                                                                                                                                                                                                                                                                                                                </body>
                                                                                                                                                                                                                                                                                                                                                                </html>
