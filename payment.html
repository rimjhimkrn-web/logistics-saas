<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <title>KRIM Logistics - Shipment Payment</title>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
          <script src="config.js"></script>

            <style>
                body {
                      font-family: Arial, sans-serif;
                            background: #f4f7fb;
                                  margin: 0;
                                        padding: 20px;
                                            }

                                                .box {
                                                      max-width: 500px;
                                                            margin: 40px auto;
                                                                  background: white;
                                                                        padding: 25px;
                                                                              border-radius: 14px;
                                                                                    box-shadow: 0 4px 18px rgba(0,0,0,0.08);
                                                                                        }

                                                                                            h1 {
                                                                                                  color: #102a43;
                                                                                                        margin-top: 0;
                                                                                                            }

                                                                                                                .row {
                                                                                                                      margin: 18px 0;
                                                                                                                            padding: 14px;
                                                                                                                                  background: #f7f9fc;
                                                                                                                                        border-radius: 8px;
                                                                                                                                            }

                                                                                                                                                .label {
                                                                                                                                                      font-size: 13px;
                                                                                                                                                            color: #666;
                                                                                                                                                                  margin-bottom: 5px;
                                                                                                                                                                      }

                                                                                                                                                                          .value {
                                                                                                                                                                                font-size: 20px;
                                                                                                                                                                                      font-weight: bold;
                                                                                                                                                                                            color: #102a43;
                                                                                                                                                                                                }

                                                                                                                                                                                                    button {
                                                                                                                                                                                                          width: 100%;
                                                                                                                                                                                                                padding: 14px;
                                                                                                                                                                                                                      border: none;
                                                                                                                                                                                                                            border-radius: 8px;
                                                                                                                                                                                                                                  background: #102a43;
                                                                                                                                                                                                                                        color: white;
                                                                                                                                                                                                                                              font-size: 16px;
                                                                                                                                                                                                                                                    cursor: pointer;
                                                                                                                                                                                                                                                          margin-top: 10px;
                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                  button:disabled {
                                                                                                                                                                                                                                                                        background: #aaa;
                                                                                                                                                                                                                                                                              cursor: not-allowed;
                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                      #message {
                                                                                                                                                                                                                                                                                            margin-top: 15px;
                                                                                                                                                                                                                                                                                                  font-weight: bold;
                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                        </style>
                                                                                                                                                                                                                                                                                                        </head>

                                                                                                                                                                                                                                                                                                        <body>

                                                                                                                                                                                                                                                                                                        <div class="box">

                                                                                                                                                                                                                                                                                                          <h1>Shipment Payment</h1>

                                                                                                                                                                                                                                                                                                            <div class="row">
                                                                                                                                                                                                                                                                                                                <div class="label">Tracking Number</div>
                                                                                                                                                                                                                                                                                                                    <div class="value" id="tracking">Loading...</div>
                                                                                                                                                                                                                                                                                                                      </div>

                                                                                                                                                                                                                                                                                                                        <div class="row">
                                                                                                                                                                                                                                                                                                                            <div class="label">Quotation</div>
                                                                                                                                                                                                                                                                                                                                <div class="value" id="quotation">Loading...</div>
                                                                                                                                                                                                                                                                                                                                  </div>

                                                                                                                                                                                                                                                                                                                                    <button id="payButton" onclick="payNow()" disabled>
                                                                                                                                                                                                                                                                                                                                        Pay Now
                                                                                                                                                                                                                                                                                                                                          </button>

                                                                                                                                                                                                                                                                                                                                            <div id="message"></div>

                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                            <script>

                                                                                                                                                                                                                                                                                                                                            const params = new URLSearchParams(window.location.search);

                                                                                                                                                                                                                                                                                                                                            const trackingNumber =
                                                                                                                                                                                                                                                                                                                                              params.get("tracking") || "TRK-000014";

                                                                                                                                                                                                                                                                                                                                              const trackingEl = document.getElementById("tracking");
                                                                                                                                                                                                                                                                                                                                              const quotationEl = document.getElementById("quotation");
                                                                                                                                                                                                                                                                                                                                              const payButton = document.getElementById("payButton");
                                                                                                                                                                                                                                                                                                                                              const messageEl = document.getElementById("message");

                                                                                                                                                                                                                                                                                                                                              let shipment = null;

                                                                                                                                                                                                                                                                                                                                              trackingEl.innerText = trackingNumber;

                                                                                                                                                                                                                                                                                                                                              async function loadPayment() {

                                                                                                                                                                                                                                                                                                                                                messageEl.innerText = "Loading payment details...";

                                                                                                                                                                                                                                                                                                                                                  try {

                                                                                                                                                                                                                                                                                                                                                      const { data, error } = await supabaseClient
                                                                                                                                                                                                                                                                                                                                                            .from("shipment_requests")
                                                                                                                                                                                                                                                                                                                                                                  .select(`
                                                                                                                                                                                                                                                                                                                                                                          id,
                                                                                                                                                                                                                                                                                                                                                                                  tracking_number,
                                                                                                                                                                                                                                                                                                                                                                                          quoted_price,
                                                                                                                                                                                                                                                                                                                                                                                                  quote_status
                                                                                                                                                                                                                                                                                                                                                                                                        `)
                                                                                                                                                                                                                                                                                                                                                                                                              .eq("tracking_number", trackingNumber)
                                                                                                                                                                                                                                                                                                                                                                                                                    .maybeSingle();

                                                                                                                                                                                                                                                                                                                                                                                                                        if (error) {
                                                                                                                                                                                                                                                                                                                                                                                                                              console.error(error);

                                                                                                                                                                                                                                                                                                                                                                                                                                    quotationEl.innerText = "Unable to load";
                                                                                                                                                                                                                                                                                                                                                                                                                                          messageEl.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                  "Database error: " + error.message;

                                                                                                                                                                                                                                                                                                                                                                                                                                                        return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!data) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                      quotationEl.innerText = "Not found";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            messageEl.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    "Shipment not found.";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  shipment = data;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      console.log("PAYMENT SHIPMENT:", shipment);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          /*
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                IMPORTANT:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      PostgreSQL/Supabase values are checked directly.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          */

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if (
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    data.quoted_price !== null &&
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          data.quoted_price !== undefined
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              ) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    quotationEl.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            "₹" +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    Number(data.quoted_price).toLocaleString("en-IN");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        } else {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              quotationEl.innerText = "Not quoted yet";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      /*
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            Allow payment only after customer accepted quote.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                */

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          String(data.quote_status || "").toLowerCase() ===
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "accepted"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      &&
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            data.quoted_price !== null
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  &&
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        Number(data.quoted_price) > 0
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  payButton.disabled = false;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        messageEl.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "Quotation accepted. You can make payment.";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    } else {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          payButton.disabled = true;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                messageEl.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        "Please accept the quotation first.";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              } catch (err) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  console.error(err);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      quotationEl.innerText = "Unable to load";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          messageEl.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "Error: " + err.message;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  function payNow() {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (!shipment) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        alert("Payment details are not loaded yet.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!shipment.quoted_price) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    alert("Quotation amount is missing.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            /*
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                Razorpay connection will be added here next.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  */

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    alert(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        "Payment amount: ₹" +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            Number(shipment.quoted_price).toLocaleString("en-IN")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              loadPayment();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </html>
