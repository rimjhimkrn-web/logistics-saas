<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
    <title>Pay for Shipment</title>

      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

          <style>
              body {
                    font-family: Arial, sans-serif;
                          padding: 30px;
                                max-width: 500px;
                                      margin: auto;
                                          }

                                              input, button {
                                                    width: 100%;
                                                          padding: 12px;
                                                                margin-top: 10px;
                                                                      box-sizing: border-box;
                                                                          }

                                                                              button {
                                                                                    cursor: pointer;
                                                                                        }

                                                                                            #result {
                                                                                                  margin-top: 20px;
                                                                                                        font-weight: bold;
                                                                                                            }
                                                                                                              </style>
                                                                                                              </head>

                                                                                                              <body>

                                                                                                                <h2>Shipment Payment</h2>

                                                                                                                  <input
                                                                                                                      type="text"
                                                                                                                          id="tracking"
                                                                                                                              placeholder="Enter Tracking Number"
                                                                                                                                >

                                                                                                                                  <button onclick="startPayment()">Pay Now</button>

                                                                                                                                    <div id="result"></div>

                                                                                                                                      <script>
                                                                                                                                          const SUPABASE_URL =
                                                                                                                                                "https://ebltviniygljwwseplph.supabase.co";

                                                                                                                                                    const SUPABASE_PUBLISHABLE_KEY =
                                                                                                                                                          "sb_publishable_8xzZUeubYp_nIxVRWEQdiw_2H4RkHAa";

                                                                                                                                                              const RAZORPAY_KEY_ID =
                                                                                                                                                                    "rzp_test_TYjnGVeCidh3SI";

                                                                                                                                                                        const supabaseClient = supabase.createClient(
                                                                                                                                                                              SUPABASE_URL,
                                                                                                                                                                                    SUPABASE_PUBLISHABLE_KEY
                                                                                                                                                                                        );

                                                                                                                                                                                            async function startPayment() {

                                                                                                                                                                                                  const result = document.getElementById("result");
                                                                                                                                                                                                        const tracking =
                                                                                                                                                                                                                document.getElementById("tracking").value.trim();

                                                                                                                                                                                                                      result.innerText = "";

                                                                                                                                                                                                                            if (!tracking) {
                                                                                                                                                                                                                                    result.innerText = "Please enter tracking number.";
                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                        const { data: userData, error: userError } =
                                                                                                                                                                                                                                                                await supabaseClient.auth.getUser();

                                                                                                                                                                                                                                                                      if (userError || !userData.user) {
                                                                                                                                                                                                                                                                              result.innerText = "Please login first.";
                                                                                                                                                                                                                                                                                      return;
                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                  const { data: shipment, error: shipmentError } =
                                                                                                                                                                                                                                                                                                          await supabaseClient
                                                                                                                                                                                                                                                                                                                    .from("shipment_requests")
                                                                                                                                                                                                                                                                                                                              .select(
                                                                                                                                                                                                                                                                                                                                          "id, tracking_number, quoted_price, quote_status"
                                                                                                                                                                                                                                                                                                                                                    )
                                                                                                                                                                                                                                                                                                                                                              .eq("tracking_number", tracking)
                                                                                                                                                                                                                                                                                                                                                                        .eq("customer_id", userData.user.id)
                                                                                                                                                                                                                                                                                                                                                                                  .single();

                                                                                                                                                                                                                                                                                                                                                                                        if (shipmentError || !shipment) {
                                                                                                                                                                                                                                                                                                                                                                                                result.innerText = "Shipment not found.";
                                                                                                                                                                                                                                                                                                                                                                                                        return;
                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                    if (!shipment.quoted_price) {
                                                                                                                                                                                                                                                                                                                                                                                                                            result.innerText = "Quotation is not available.";
                                                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                if (shipment.quote_status !== "accepted") {
                                                                                                                                                                                                                                                                                                                                                                                                                                                        result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  "Please accept the quotation first.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const amount = Math.round(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              Number(shipment.quoted_price) * 100
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          result.innerText = "Creating payment order...";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const response = await fetch(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        SUPABASE_URL +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "/functions/v1/create-razorpay-order",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  method: "POST",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            headers: {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        "Content-Type": "application/json",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    "apikey": SUPABASE_PUBLISHABLE_KEY,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "Authorization":
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              "Bearer " + SUPABASE_PUBLISHABLE_KEY
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  body: JSON.stringify({
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              amount: amount,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          receipt: tracking
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    })
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const order = await response.json();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if (!response.ok || !order.id) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "Payment order error: " +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          (order.error || "Unable to create order.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const options = {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      key: RAZORPAY_KEY_ID,

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              amount: order.amount,

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      currency: order.currency,

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              name: "RimjhimKrn Web",

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      description: "Shipment Payment",

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              order_id: order.id,

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      handler: async function (paymentResponse) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const { error } =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            await supabaseClient
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          .from("payments")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        .insert({
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        shipment_id: shipment.id,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        customer_id: userData.user.id,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        amount: Number(shipment.quoted_price),
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        status: "pending",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        payment_method: "razorpay",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        transaction_id:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          paymentResponse.razorpay_payment_id
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if (error) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            "Payment received, but record error: " +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          error.message;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      "Payment submitted successfully! " +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  "Verification pending.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          },

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  theme: {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            color: "#3399cc"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const razorpay =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        new Razorpay(options);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              razorpay.open();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
