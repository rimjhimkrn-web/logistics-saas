<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>KRIM Dispatch Diagnostic</title>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        </head>

        <body>

        <h2>KRIM Dispatch Diagnostic</h2>

        <p id="status">Checking login...</p>

        <button id="testBtn" disabled>
          Test Assigned → Dispatched
          </button>

          <pre id="result"></pre>

          <script>

          const SUPABASE_URL =
          "https://ebltviniygljwwseplph.supabase.co";

          const SUPABASE_KEY =
          "sb_publishable_8xzZUeubYp_nIxVRWEQdiw_2H4RkHAa";

          const supabaseClient =
          supabase.createClient(
            SUPABASE_URL,
              SUPABASE_KEY
              );

              const status =
              document.getElementById("status");

              const button =
              document.getElementById("testBtn");

              const result =
              document.getElementById("result");


              async function start() {

                const { data, error } =
                    await supabaseClient.auth.getSession();

                      if (error) {
                          status.textContent =
                                "Login error: " + error.message;
                                    return;
                                      }

                                        if (!data.session) {
                                            status.textContent =
                                                  "❌ Please login to KRIM first.";
                                                      return;
                                                        }

                                                          status.textContent =
                                                              "✅ Logged in: " +
                                                                  data.session.user.email;

                                                                    button.disabled = false;
                                                                    }


                                                                    button.onclick = async function () {

                                                                      button.disabled = true;

                                                                        result.textContent =
                                                                            "Testing direct shipment transition...";

                                                                              try {

                                                                                  const { data, error } =
                                                                                        await supabaseClient.rpc(
                                                                                                "krim_transition_shipment",
                                                                                                        {
                                                                                                                  p_shipment_id: 1,
                                                                                                                            p_to_status: "dispatched",
                                                                                                                                      p_reason: "Direct dispatch diagnostic",
                                                                                                                                                p_metadata: {}
                                                                                                                                                        }
                                                                                                                                                              );

                                                                                                                                                                  if (error) {

                                                                                                                                                                        result.textContent =
                                                                                                                                                                                "❌ DATABASE ERROR\n\n" +
                                                                                                                                                                                        "Message: " + error.message +
                                                                                                                                                                                                "\n\nCode: " + (error.code || "N/A") +
                                                                                                                                                                                                        "\n\nDetails: " + (error.details || "N/A") +
                                                                                                                                                                                                                "\n\nHint: " + (error.hint || "N/A");

                                                                                                                                                                                                                      button.disabled = false;
                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                    result.textContent =
                                                                                                                                                                                                                                          "✅ SUCCESS\n\n" +
                                                                                                                                                                                                                                                JSON.stringify(data, null, 2);

                                                                                                                                                                                                                                                  } catch (e) {

                                                                                                                                                                                                                                                      result.textContent =
                                                                                                                                                                                                                                                            "❌ REQUEST ERROR\n\n" +
                                                                                                                                                                                                                                                                  e.name + "\n\n" +
                                                                                                                                                                                                                                                                        e.message;

                                                                                                                                                                                                                                                                            button.disabled = false;
                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                              };


                                                                                                                                                                                                                                                                              start();

                                                                                                                                                                                                                                                                              </script>

                                                                                                                                                                                                                                                                              </body>
                                                                                                                                                                                                                                                                              </html>
