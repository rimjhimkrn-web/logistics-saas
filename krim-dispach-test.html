<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>KRIM Dispatch Test</title>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        </head>

        <body>

          <h2>KRIM Dispatch Engine Test</h2>

            <p id="status">Checking login...</p>

              <button id="dispatchBtn" disabled>
                  Test Dispatch Shipment 1
                    </button>

                      <pre id="result"></pre>

                      <script>

                      const SUPABASE_URL =
                      "https://ebltviniygljwwseplph.supabase.co";

                      const SUPABASE_KEY =
                      "sb_publishable_8xzZUeubYp_nIxVRWEQdiw_2H4RkHAa";

                      const supabaseClient =
                      supabase.createClient(
                        SUPABASE_URL,
                          SUPABASE_KEY
                          );

                          const status =
                          document.getElementById("status");

                          const button =
                          document.getElementById("dispatchBtn");

                          const result =
                          document.getElementById("result");


                          async function start() {

                            const { data, error } =
                                await supabaseClient.auth.getSession();

                                  if (error) {

                                      status.textContent =
                                            "Login error: " + error.message;

                                                return;
                                                  }

                                                    if (!data.session) {

                                                        status.textContent =
                                                              "❌ Please login to KRIM first.";

                                                                  return;
                                                                    }

                                                                      status.textContent =
                                                                          "✅ Logged in: " +
                                                                              data.session.user.email;

                                                                                button.disabled = false;
                                                                                }


                                                                                button.onclick = async function () {

                                                                                  button.disabled = true;

                                                                                    result.textContent =
                                                                                        "Running dispatch operation...";

                                                                                          const { data, error } =
                                                                                              await supabaseClient.rpc(
                                                                                                    "krim_dispatch_shipment",
                                                                                                          {
                                                                                                                  p_shipment_id: 1,
                                                                                                                          p_notes:
                                                                                                                                    "Controlled dispatch execution test",
                                                                                                                                            p_metadata: {}
                                                                                                                                                  }
                                                                                                                                                      );


                                                                                                                                                        if (error) {

                                                                                                                                                            result.textContent =
                                                                                                                                                                  "❌ FAILED\n\n" +
                                                                                                                                                                        error.message;

                                                                                                                                                                            button.disabled = false;

                                                                                                                                                                                return;
                                                                                                                                                                                  }


                                                                                                                                                                                    result.textContent =
                                                                                                                                                                                        "✅ SUCCESS\n\n" +
                                                                                                                                                                                            "Shipment number:\n" +
                                                                                                                                                                                                data.shipment_number +
                                                                                                                                                                                                    "\n\n" +
                                                                                                                                                                                                        "Shipment status:\n" +
                                                                                                                                                                                                            data.status;
                                                                                                                                                                                                            };


                                                                                                                                                                                                            start();

                                                                                                                                                                                                            </script>

                                                                                                                                                                                                            </body>
                                                                                                                                                                                                            </html>
