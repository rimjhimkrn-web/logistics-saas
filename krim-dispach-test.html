<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>KRIM Lifecycle Diagnostic</title>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

          <style>
              body {
                    font-family: Arial, sans-serif;
                          max-width: 700px;
                                margin: 30px auto;
                                      padding: 20px;
                                          }

                                              button {
                                                    padding: 14px 18px;
                                                          margin: 8px 0;
                                                                width: 100%;
                                                                      cursor: pointer;
                                                                          }

                                                                              pre {
                                                                                    background: #f4f4f4;
                                                                                          padding: 15px;
                                                                                                white-space: pre-wrap;
                                                                                                      word-break: break-word;
                                                                                                          }

                                                                                                              .success { color: green; }
                                                                                                                  .error { color: red; }
                                                                                                                    </style>
                                                                                                                    </head>

                                                                                                                    <body>

                                                                                                                    <h2>KRIM Lifecycle Diagnostic</h2>

                                                                                                                    <div id="login">Checking login...</div>

                                                                                                                    <button id="testBtn">Test Dispatched → In Transit</button>

                                                                                                                    <pre id="result">Ready...</pre>

                                                                                                                    <script>
                                                                                                                    const SUPABASE_URL =
                                                                                                                      "https://ebltviniygljwwseplph.supabase.co";

                                                                                                                      const SUPABASE_KEY =
                                                                                                                        "sb_publishable_8xzZUeubYp_nIxVRWEQdiw_2H4RkHAa";

                                                                                                                        const supabaseClient =
                                                                                                                          supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

                                                                                                                          const loginEl = document.getElementById("login");
                                                                                                                          const resultEl = document.getElementById("result");
                                                                                                                          const testBtn = document.getElementById("testBtn");

                                                                                                                          async function checkLogin() {
                                                                                                                            const {
                                                                                                                                data: { user },
                                                                                                                                    error
                                                                                                                                      } = await supabaseClient.auth.getUser();

                                                                                                                                        if (error || !user) {
                                                                                                                                            loginEl.innerHTML =
                                                                                                                                                  '<span class="error">❌ Not logged in</span>';
                                                                                                                                                      testBtn.disabled = true;
                                                                                                                                                          return;
                                                                                                                                                            }

                                                                                                                                                              loginEl.innerHTML =
                                                                                                                                                                  '<span class="success">✅ Logged in: ' +
                                                                                                                                                                      user.email +
                                                                                                                                                                          '</span>';
                                                                                                                                                                          }

                                                                                                                                                                          testBtn.onclick = async function () {

                                                                                                                                                                            resultEl.textContent =
                                                                                                                                                                                "Testing dispatched → in_transit...";

                                                                                                                                                                                  testBtn.disabled = true;

                                                                                                                                                                                    try {

                                                                                                                                                                                        const { data, error } =
                                                                                                                                                                                              await supabaseClient.rpc(
                                                                                                                                                                                                      "krim_transition_shipment",
                                                                                                                                                                                                              {
                                                                                                                                                                                                                        p_shipment_id: 1,
                                                                                                                                                                                                                                  p_to_status: "in_transit",
                                                                                                                                                                                                                                            p_reason: "Shipment entered transit",
                                                                                                                                                                                                                                                      p_metadata: {}
                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                    );

                                                                                                                                                                                                                                                                        if (error) {

                                                                                                                                                                                                                                                                              resultEl.innerHTML =
                                                                                                                                                                                                                                                                                      "❌ DATABASE ERROR\n\n" +
                                                                                                                                                                                                                                                                                              "Message: " + (error.message || "") + "\n\n" +
                                                                                                                                                                                                                                                                                                      "Code: " + (error.code || "") + "\n\n" +
                                                                                                                                                                                                                                                                                                              "Details: " + (error.details || "") + "\n\n" +
                                                                                                                                                                                                                                                                                                                      "Hint: " + (error.hint || "");

                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                    resultEl.innerHTML =
                                                                                                                                                                                                                                                                                                                                          "✅ SUCCESS\n\n" +
                                                                                                                                                                                                                                                                                                                                                JSON.stringify(data, null, 2);

                                                                                                                                                                                                                                                                                                                                                  } catch (err) {

                                                                                                                                                                                                                                                                                                                                                      resultEl.innerHTML =
                                                                                                                                                                                                                                                                                                                                                            "❌ JAVASCRIPT ERROR\n\n" +
                                                                                                                                                                                                                                                                                                                                                                  err.message;
                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                      testBtn.disabled = false;
                                                                                                                                                                                                                                                                                                                                                                      };

                                                                                                                                                                                                                                                                                                                                                                      checkLogin();
                                                                                                                                                                                                                                                                                                                                                                      </script>

                                                                                                                                                                                                                                                                                                                                                                      </body>
                                                                                                                                                                                                                                                                                                                                                                      </html>
