<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>KRIM Dispatch Engine Test</title>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        </head>

        <body>

          <h2>KRIM Dispatch Engine Test</h2>

            <p id="status">Checking login...</p>

              <button id="inspectBtn" disabled>
                  Inspect Shipment 1
                    </button>

                      <button id="dispatchBtn" disabled>
                          Test Dispatch Shipment 1
                            </button>

                              <pre id="result"></pre>

                              <script>

                              const SUPABASE_URL =
                              "https://ebltviniygljwwseplph.supabase.co";

                              const SUPABASE_KEY =
                              "sb_publishable_8xzZUeubYp_nIxVRWEQdiw_2H4RkHAa";

                              const supabaseClient =
                              supabase.createClient(
                                SUPABASE_URL,
                                  SUPABASE_KEY
                                  );

                                  const status =
                                  document.getElementById("status");

                                  const inspectBtn =
                                  document.getElementById("inspectBtn");

                                  const dispatchBtn =
                                  document.getElementById("dispatchBtn");

                                  const result =
                                  document.getElementById("result");


                                  async function start() {

                                    const { data, error } =
                                        await supabaseClient.auth.getSession();

                                          if (error) {
                                              status.textContent =
                                                    "Login error: " + error.message;
                                                        return;
                                                          }

                                                            if (!data.session) {
                                                                status.textContent =
                                                                      "❌ Please login to KRIM first.";
                                                                          return;
                                                                            }

                                                                              status.textContent =
                                                                                  "✅ Logged in: " +
                                                                                      data.session.user.email;

                                                                                        inspectBtn.disabled = false;
                                                                                          dispatchBtn.disabled = false;
                                                                                          }


                                                                                          inspectBtn.onclick = async function () {

                                                                                            inspectBtn.disabled = true;

                                                                                              result.textContent =
                                                                                                  "Inspecting shipment...";

                                                                                                    const { data, error } =
                                                                                                        await supabaseClient
                                                                                                              .from("krim_shipments")
                                                                                                                    .select(
                                                                                                                            "id,shipment_number,status,customer_organization_id"
                                                                                                                                  )
                                                                                                                                        .eq("id", 1)
                                                                                                                                              .single();

                                                                                                                                                if (error) {

                                                                                                                                                    result.textContent =
                                                                                                                                                          "❌ INSPECTION FAILED\n\n" +
                                                                                                                                                                error.message;

                                                                                                                                                                    inspectBtn.disabled = false;
                                                                                                                                                                        return;
                                                                                                                                                                          }

                                                                                                                                                                            result.textContent =
                                                                                                                                                                                "SHIPMENT STATE\n\n" +
                                                                                                                                                                                    JSON.stringify(data, null, 2);

                                                                                                                                                                                      inspectBtn.disabled = false;
                                                                                                                                                                                      };


                                                                                                                                                                                      dispatchBtn.onclick = async function () {

                                                                                                                                                                                        dispatchBtn.disabled = true;

                                                                                                                                                                                          result.textContent =
                                                                                                                                                                                              "Running dispatch operation...";

                                                                                                                                                                                                const { data, error } =
                                                                                                                                                                                                    await supabaseClient.rpc(
                                                                                                                                                                                                          "krim_dispatch_shipment",
                                                                                                                                                                                                                {
                                                                                                                                                                                                                        p_shipment_id: 1,
                                                                                                                                                                                                                                p_notes:
                                                                                                                                                                                                                                          "Controlled dispatch execution test",
                                                                                                                                                                                                                                                  p_metadata: {}
                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                            );

                                                                                                                                                                                                                                                              if (error) {

                                                                                                                                                                                                                                                                  result.textContent =
                                                                                                                                                                                                                                                                        "❌ DISPATCH FAILED\n\n" +
                                                                                                                                                                                                                                                                              error.message;

                                                                                                                                                                                                                                                                                  dispatchBtn.disabled = false;
                                                                                                                                                                                                                                                                                      return;
                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                          result.textContent =
                                                                                                                                                                                                                                                                                              "✅ DISPATCH SUCCESS\n\n" +
                                                                                                                                                                                                                                                                                                  JSON.stringify(data, null, 2);

                                                                                                                                                                                                                                                                                                  };


                                                                                                                                                                                                                                                                                                  start();

                                                                                                                                                                                                                                                                                                  </script>

                                                                                                                                                                                                                                                                                                  </body>
                                                                                                                                                                                                                                                                                                  </html>
