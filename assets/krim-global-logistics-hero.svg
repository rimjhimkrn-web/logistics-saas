<path d="M132 185l44-30 53 10 29 26 51-4 32 27-14 34-39 9-16 36-37 14-14 43-35 9-20-33-35-9-13-37-31-21 11-36-17-24z" fill="#7cb4d2" opacity=".24"/>
<path d="M309 365l37 15 26 37-8 38 23 33-11 52-28 42-10 47-23 21-23-36-7-43-23-32 6-37-17-31 14-42z" fill="#7cb4d2" opacity=".23"/>
