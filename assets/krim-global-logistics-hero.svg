<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">KRIM global freight network illustration</title><desc id="desc">Original illustration showing global shipping routes connecting a cargo vessel, aircraft, road freight and a logistics warehouse.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b2440"/><stop offset=".56" stop-color="#102f50"/><stop offset="1" stop-color="#07182c"/></linearGradient>
 <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b4568"/><stop offset="1" stop-color="#0a2947"/></linearGradient>
 <linearGradient id="ship" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f9fcff"/><stop offset="1" stop-color="#b8cad9"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#56a6ff"/><stop offset="1" stop-color="#2461e8"/></linearGradient>
 <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#8bb8dc" stroke-opacity=".11" stroke-width="1"/></pattern>
 <pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.7" fill="#8dc9e9" fill-opacity=".5"/></pattern>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020b16" flood-opacity=".42"/></filter>
</defs>
<rect width="1200" height="850" rx="24" fill="url(#bg)"/><rect width="1200" height="850" rx="24" fill="url(#grid)"/>
