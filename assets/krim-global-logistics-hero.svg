<!-- floating operation card -->
<g transform="translate(70 690)" filter="url(#shadow)"><rect width="270" height="92" rx="8" fill="#f7fbff"/><rect width="5" height="92" rx="2" fill="#65e3d8"/><text x="22" y="24" fill="#47637b" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1.4">OPERATIONS NETWORK</text><text x="22" y="49" fill="#102f50" font-family="Arial,sans-serif" font-size="18" font-weight="700">Freight, in motion.</text><circle cx="24" cy="70" r="4" fill="#159b82"/><text x="36" y="74" fill="#597087" font-family="Arial,sans-serif" font-size="10">Shipment workflows · Role-based access</text></g>
