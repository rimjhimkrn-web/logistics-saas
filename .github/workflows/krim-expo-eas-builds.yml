name: KRIM Expo EAS Android builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/krim-customer/**"
      - "mobile/krim-partner/**"
      - "mobile/krim-driver/**"
      - ".github/workflows/krim-expo-eas-builds.yml"

permissions:
  contents: read

jobs:
  eas-build:
    name: Build ${{ matrix.app }} on Expo
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: Customer
            directory: mobile/krim-customer
          - app: Partner
            directory: mobile/krim-partner
          - app: Driver
            directory: mobile/krim-driver
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Expo project
        run: npx expo config --type public
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK on Expo EAS
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
