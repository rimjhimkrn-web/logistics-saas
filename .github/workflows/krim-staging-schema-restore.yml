name: KRIM Staging schema snapshot restore validation

on:
  push:
    branches:
      - staging/phase00-env-isolation
    paths:
      - .github/workflows/krim-staging-schema-restore.yml
      - scripts/krim_staging_schema_restore_check.py
  workflow_dispatch:

concurrency:
  group: krim-staging-schema-restore-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  schema-snapshot-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out Staging branch
        uses: actions/checkout@v4
        with:
          ref: staging/phase00-env-isolation

      - name: Validate Staging connection secret
        shell: bash
        env:
          STAGING_DB_URL: ${{ secrets.KRIM_STAGING_DB_URL }}
        run: |
          set -euo pipefail
          if [[ -z "$STAGING_DB_URL" ]]; then
            echo "::error::KRIM_STAGING_DB_URL is not configured. No database was contacted."
            exit 1
          fi
          python - <<'PY'
          import os, re, sys
          from urllib.parse import urlsplit
          value=os.environ["STAGING_DB_URL"]
          try:
              parsed=urlsplit(value)
              valid=(parsed.scheme in ("postgres","postgresql") and bool(parsed.hostname)
                     and bool(parsed.username) and parsed.password is not None
                     and bool(parsed.path.strip("/")) and "[YOUR-PASSWORD]" not in value
                     and not re.search(r"%(?![0-9A-Fa-f]{2})", value)
                     and not any(ch.isspace() for ch in value))
          except Exception:
              valid=False
          if not valid:
              print("::error::KRIM_STAGING_DB_URL is not a valid PostgreSQL URI; value was not displayed.")
              sys.exit(1)
          print("Staging connection URI format validated; credentials were not displayed.")
          PY

      - name: Install Supabase CLI v3.4.0
        uses: supabase/setup-cli@v3
        with:
          version: 3.4.0

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Create ephemeral local Supabase stack
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/krim-schema-restore"
          cd "$RUNNER_TEMP/krim-schema-restore"
          CI=true supabase init
          timeout --signal=TERM --kill-after=30s 600s supabase start --exclude studio,imgproxy,logflare,vector,supavisor,mailpit
          supabase status -o env > "$RUNNER_TEMP/krim-local-supabase.env"
          chmod 600 "$RUNNER_TEMP/krim-local-supabase.env"
          if ! grep -q '^DB_URL=' "$RUNNER_TEMP/krim-local-supabase.env"; then
            echo "::error::Local Supabase DB_URL was not emitted."
            exit 1
          fi

      - name: Export schema-only snapshot from Staging
        timeout-minutes: 18
        shell: bash
        env:
          STAGING_DB_URL: ${{ secrets.KRIM_STAGING_DB_URL }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/krim-schema-restore"
          # Use pg_dump directly against the validated Staging URI. This avoids
          # the Supabase CLI's remote dump orchestration layer and provides
          # verbose per-schema progress while preserving a schema-only export.
          export PGCONNECT_TIMEOUT=20
          timeout --signal=TERM --kill-after=30s 900s pg_dump \
            --schema-only --no-owner --no-privileges --verbose \
            --schema=public --schema=private --schema=krim_internal \
            --file "$RUNNER_TEMP/krim-staging-schema.sql" \
            "$STAGING_DB_URL"
          test -s "$RUNNER_TEMP/krim-staging-schema.sql"
          python "$GITHUB_WORKSPACE/scripts/krim_staging_schema_restore_check.py" \
            "$RUNNER_TEMP/krim-staging-schema.sql" \
            "$RUNNER_TEMP/krim-staging-schema-sanitized.sql" \
            | tee "$RUNNER_TEMP/krim-schema-safety-report.json"
          chmod 600 "$RUNNER_TEMP/krim-staging-schema.sql" "$RUNNER_TEMP/krim-staging-schema-sanitized.sql"

      - name: Restore schema into isolated local Supabase
        shell: bash
        run: |
          set -euo pipefail
          set +x
          set -a
          source "$RUNNER_TEMP/krim-local-supabase.env"
          set +a
          test -n "${DB_URL:-}"
          # graphql_public is a Supabase-managed schema owned by the local
          # stack's admin role. It is deliberately excluded from this application
          # schema restore; compare application-owned schemas only below.
          psql "$DB_URL" --no-psqlrc --quiet --set ON_ERROR_STOP=1 \
            --single-transaction --file "$RUNNER_TEMP/krim-staging-schema-sanitized.sql"
          echo "Staging schema-only snapshot restored into the disposable local Supabase database."

      - name: Compare schema integrity metrics
        shell: bash
        env:
          STAGING_DB_URL: ${{ secrets.KRIM_STAGING_DB_URL }}
        run: |
          set -euo pipefail
          set +x
          set -a
          source "$RUNNER_TEMP/krim-local-supabase.env"
          set +a
          cat > "$RUNNER_TEMP/krim-schema-metrics.sql" <<'SQL'
          SELECT jsonb_build_object(
            'tables', (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname IN ('public','private','krim_internal') AND c.relkind IN ('r','p')),
            'views', (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname IN ('public','private','krim_internal') AND c.relkind IN ('v','m')),
            'functions', (SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname IN ('public','private','krim_internal')),
            'triggers', (SELECT count(*) FROM pg_trigger t JOIN pg_class c ON c.oid=t.tgrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname IN ('public','private','krim_internal') AND NOT t.tgisinternal),
            'policies', (SELECT count(*) FROM pg_policy p JOIN pg_class c ON c.oid=p.polrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname IN ('public','private','krim_internal')),
            'indexes', (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname IN ('public','private','krim_internal') AND c.relkind='i'),
            'constraints', (SELECT count(*) FROM pg_constraint co JOIN pg_class c ON c.oid=co.conrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname IN ('public','private','krim_internal')),
            'rls_enabled_without_policy', (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname IN ('public','private','krim_internal') AND c.relkind IN ('r','p') AND c.relrowsecurity AND NOT EXISTS (SELECT 1 FROM pg_policy p WHERE p.polrelid=c.oid)),
            'security_definer_without_search_path', (SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname IN ('public','private','krim_internal') AND p.prosecdef AND (p.proconfig IS NULL OR NOT EXISTS (SELECT 1 FROM unnest(p.proconfig) cfg WHERE cfg LIKE 'search_path=%'))),
            'unvalidated_constraints', (SELECT count(*) FROM pg_constraint co JOIN pg_class c ON c.oid=co.conrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname IN ('public','private','krim_internal') AND NOT co.convalidated)
          )::text;
          SQL
          psql "$STAGING_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 --tuples-only --no-align \
            --file "$RUNNER_TEMP/krim-schema-metrics.sql" > "$RUNNER_TEMP/staging-metrics.json"
          psql "$DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 --tuples-only --no-align \
            --file "$RUNNER_TEMP/krim-schema-metrics.sql" > "$RUNNER_TEMP/local-metrics.json"
          python - <<'PY'
          import json, sys
          from pathlib import Path
          remote=json.loads(Path("".join([__import__("os").environ["RUNNER_TEMP"],"/staging-metrics.json"])).read_text())
          local=json.loads(Path("".join([__import__("os").environ["RUNNER_TEMP"],"/local-metrics.json"])).read_text())
          report={"staging_metrics":remote,"restored_local_metrics":local,"metrics_match":remote==local}
          Path(__import__("os").environ["RUNNER_TEMP"]+"/krim-schema-restore-report.json").write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          print(json.dumps(report,sort_keys=True))
          if remote!=local:
              print("::error::Restored local schema metrics do not match Staging.")
              sys.exit(1)
          PY

      - name: Compare canonical object definitions in Staging and isolated restore
        shell: bash
        env:
          STAGING_DB_URL: ${{ secrets.KRIM_STAGING_DB_URL }}
        run: |
          set -euo pipefail
          set +x
          set -a
          source "$RUNNER_TEMP/krim-local-supabase.env"
          set +a
          cat > "$RUNNER_TEMP/krim-object-fingerprints.sql" <<'SQL'
          WITH relation_defs AS (
            SELECT n.nspname||'.'||c.relname AS object_key,
              md5(coalesce(string_agg(
                a.attnum||':'||a.attname||':'||format_type(a.atttypid,a.atttypmod)||':'||
                a.attnotnull||':'||coalesce(pg_get_expr(ad.adbin,ad.adrelid),'')||':'||
                coalesce(coll.collname,''), '|' ORDER BY a.attnum
              ),'')) AS fingerprint
            FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
            LEFT JOIN pg_attribute a ON a.attrelid=c.oid AND a.attnum>0 AND NOT a.attisdropped
            LEFT JOIN pg_attrdef ad ON ad.adrelid=c.oid AND ad.adnum=a.attnum
            LEFT JOIN pg_collation coll ON coll.oid=a.attcollation AND a.attcollation<>0
            WHERE n.nspname IN ('public','private','krim_internal') AND c.relkind IN ('r','p','v','m','f')
            GROUP BY n.nspname,c.relname
          ),
          function_defs AS (
            SELECT n.nspname||'.'||p.proname||'('||pg_get_function_identity_arguments(p.oid)||')' AS object_key,
              md5(pg_get_functiondef(p.oid)) AS fingerprint
            FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
            WHERE n.nspname IN ('public','private','krim_internal')
          ),
          policy_defs AS (
            SELECT n.nspname||'.'||c.relname||'.'||p.polname AS object_key,
              md5(p.polcmd||'|'||p.polpermissive||'|'||coalesce((SELECT string_agg(coalesce(r.rolname,'PUBLIC'),',' ORDER BY coalesce(r.rolname,'PUBLIC')) FROM unnest(p.polroles) AS pr(role_oid) LEFT JOIN pg_roles r ON r.oid=pr.role_oid),'')||'|'||
                   coalesce(pg_get_expr(p.polqual,p.polrelid),'')||'|'||
                   coalesce(pg_get_expr(p.polwithcheck,p.polrelid),'')) AS fingerprint
            FROM pg_policy p JOIN pg_class c ON c.oid=p.polrelid
            JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname IN ('public','private','krim_internal')
          ),
          trigger_defs AS (
            SELECT n.nspname||'.'||c.relname||'.'||t.tgname AS object_key,
              md5(pg_get_triggerdef(t.oid,true)) AS fingerprint
            FROM pg_trigger t JOIN pg_class c ON c.oid=t.tgrelid
            JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname IN ('public','private','krim_internal') AND NOT t.tgisinternal
          ),
          index_defs AS (
            SELECT n.nspname||'.'||c.relname||'.'||i.relname AS object_key,
              md5(pg_get_indexdef(i.oid)) AS fingerprint
            FROM pg_index ix JOIN pg_class c ON c.oid=ix.indrelid
            JOIN pg_class i ON i.oid=ix.indexrelid JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname IN ('public','private','krim_internal')
          ),
          constraint_defs AS (
            SELECT n.nspname||'.'||c.relname||'.'||co.conname AS object_key,
              md5(pg_get_constraintdef(co.oid,true)||'|'||co.convalidated) AS fingerprint
            FROM pg_constraint co JOIN pg_class c ON c.oid=co.conrelid
            JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname IN ('public','private','krim_internal')
          ),
          all_defs AS (
            SELECT 'relation' category,object_key,fingerprint FROM relation_defs
            UNION ALL SELECT 'function',object_key,fingerprint FROM function_defs
            UNION ALL SELECT 'policy',object_key,fingerprint FROM policy_defs
            UNION ALL SELECT 'trigger',object_key,fingerprint FROM trigger_defs
            UNION ALL SELECT 'index',object_key,fingerprint FROM index_defs
            UNION ALL SELECT 'constraint',object_key,fingerprint FROM constraint_defs
          )
          SELECT category||E'\t'||object_key||E'\t'||fingerprint
          FROM all_defs ORDER BY category,object_key;
          SQL
          psql "$STAGING_DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 --tuples-only --no-align --file "$RUNNER_TEMP/krim-object-fingerprints.sql" > "$RUNNER_TEMP/staging-object-fingerprints.tsv"
          psql "$DB_URL" --no-psqlrc --set ON_ERROR_STOP=1 --tuples-only --no-align --file "$RUNNER_TEMP/krim-object-fingerprints.sql" > "$RUNNER_TEMP/local-object-fingerprints.tsv"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          def load(name):
              result={}
              for line in (root/name).read_text().splitlines():
                  parts=line.split("\t")
                  if len(parts)==3:
                      result[(parts[0],parts[1])]=parts[2]
              return result
          remote,local=load("staging-object-fingerprints.tsv"),load("local-object-fingerprints.tsv")
          keys=sorted(set(remote)|set(local))
          missing_local=[k for k in keys if k in remote and k not in local]
          missing_remote=[k for k in keys if k in local and k not in remote]
          changed=[k for k in keys if k in remote and k in local and remote[k]!=local[k]]
          by_category={}
          for category,_ in keys:
              by_category.setdefault(category,{"staging":0,"local":0,"missing_local":0,"missing_staging":0,"definition_mismatch":0})
              by_category[category]["staging"]+=1
          for category,_ in local:
              by_category.setdefault(category,{"staging":0,"local":0,"missing_local":0,"missing_staging":0,"definition_mismatch":0})
              by_category[category]["local"]+=1
          for k in missing_local: by_category[k[0]]["missing_local"]+=1
          for k in missing_remote: by_category[k[0]]["missing_staging"]+=1
          for k in changed: by_category[k[0]]["definition_mismatch"]+=1
          report={
            "comparison_scope":"public, private, krim_internal; relations, functions, policies, triggers, indexes, constraints",
            "staging_object_count":len(remote),"isolated_restore_object_count":len(local),
            "missing_from_isolated_restore":[list(k) for k in missing_local[:100]],
            "missing_from_staging":[list(k) for k in missing_remote[:100]],
            "definition_mismatch_samples":[list(k)+[remote[k],local[k]] for k in changed[:100]],
            "truncated_samples":len(missing_local)>100 or len(missing_remote)>100 or len(changed)>100,
            "by_category":by_category,
            "object_level_match":not (missing_local or missing_remote or changed)
          }
          (root/"krim-object-fingerprint-comparison.json").write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          print(json.dumps({k:v for k,v in report.items() if k not in ("missing_from_isolated_restore","missing_from_staging","definition_mismatch_samples")},sort_keys=True))
          print("Object-level differences are reported for review; this step does not authorize migrations.")
          PY

      - name: Upload sanitized restore evidence
        uses: actions/upload-artifact@v4
        with:
          name: krim-staging-schema-restore-evidence
          path: |
            ${{ runner.temp }}/krim-schema-safety-report.json
            ${{ runner.temp }}/krim-schema-restore-report.json
            ${{ runner.temp }}/krim-object-fingerprint-comparison.json
          if-no-files-found: error
          retention-days: 7

      - name: Stop ephemeral Supabase stack and remove schema files
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -f "$RUNNER_TEMP/krim-local-supabase.env" ]]; then
            cd "$RUNNER_TEMP/krim-schema-restore"
            supabase stop --no-backup
          fi
          rm -rf "$RUNNER_TEMP/krim-schema-restore"
          rm -f "$RUNNER_TEMP/krim-local-supabase.env" \
            "$RUNNER_TEMP/krim-staging-schema.sql" \
            "$RUNNER_TEMP/krim-staging-schema-sanitized.sql" \
            "$RUNNER_TEMP/krim-schema-metrics.sql" \
            "$RUNNER_TEMP/staging-metrics.json" \
            "$RUNNER_TEMP/local-metrics.json"
