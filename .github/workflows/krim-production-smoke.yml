name: KRIM production smoke checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate critical KRIM workflows
        run: node scripts/krim-production-smoke.mjs
      - name: Run repository-wide static audit
        run: node scripts/krim-complete-static-audit.mjs
      - name: Upload full audit report
        uses: actions/upload-artifact@v4
        with:
          name: krim-complete-static-audit
          path: audit-output/
          if-no-files-found: error
          retention-days: 30
