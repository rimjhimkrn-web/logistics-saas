name: KRIM country-pack status reference repair isolated SQL test
on:
  pull_request:
    paths:
      - 'docs/proposed-migrations/20261124_fix_partner_service_area_country_pack_status_reference.sql'
      - 'tests/sql/country-pack-status-reference-*.sql'
      - '.github/workflows/country-pack-status-reference-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  country-pack-status-reference-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: krim_country_pack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d krim_country_pack_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Create synthetic schema and intentionally broken function
        env:
          PGPASSWORD: test-only
        run: psql -h localhost -U postgres -d krim_country_pack_test -v ON_ERROR_STOP=1 -f tests/sql/country-pack-status-reference-fixture.sql
      - name: Apply proposed forward-only repair
        env:
          PGPASSWORD: test-only
        run: psql -h localhost -U postgres -d krim_country_pack_test -v ON_ERROR_STOP=1 -f docs/proposed-migrations/20261124_fix_partner_service_area_country_pack_status_reference.sql
      - name: Verify function definition, ACL preservation and execution
        env:
          PGPASSWORD: test-only
        run: psql -h localhost -U postgres -d krim_country_pack_test -v ON_ERROR_STOP=1 -f tests/sql/country-pack-status-reference-assertions.sql
