name: KRIM Driver mobile validation

on:
  push:
    branches: [main]
    paths:
      - 'mobile/krim-driver/**'
      - 'supabase/functions/krim-driver-gps-update/**'
      - 'supabase/functions/krim-driver-tracking-session/**'
      - 'supabase/migrations/*driver_tracking*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: krim-driver-mobile-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile/krim-driver
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Stage KRIM brand assets
        run: |
          npx --yes sharp-cli -i ../../assets/krim-primary.svg -o assets/krim-master-logo.png -f png resize 720 216 --fit contain --background '#FFFFFF'
          npx --yes sharp-cli -i ../../assets/krim-icon.svg -o assets/icon.png -f png resize 1024 1024 --fit contain --background '#071B35'
          npx --yes sharp-cli -i ../../assets/krim-icon.svg -o assets/adaptive-icon.png -f png resize 680 680 --fit contain --background '#071B35'
          npx --yes sharp-cli -i assets/adaptive-icon.png -o assets/adaptive-icon.png -f png extend 172 172 172 172 --background '#071B35'
      - name: Check Expo SDK package compatibility
        run: npx expo install --check
      - name: TypeScript validation
        run: npm run typecheck
      - name: Validate Android Expo configuration
        run: npx expo config --type public --json > /tmp/krim-driver-expo-config.json
      - name: Validate Android production bundle
        run: npx expo export --platform android
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: validation-placeholder
