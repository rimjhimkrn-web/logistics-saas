name: Deploy KRIM website and Customer OS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assemble website without replacing the existing homepage
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/
          mkdir -p _site/customer-os
          cp -a public/customer-os/. _site/customer-os/
          # Repair logo URLs relative to each page's actual directory. The project
          # is hosted below /logistics-saas/, so paths escaping to /assets fail.
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          root = Path("_site")
          for page in (root / "customer-os").rglob("*.html"):
              html = page.read_text(encoding="utf-8")
              relative_logo = os.path.relpath(root / "assets" / "krim-primary.svg", page.parent)
              pattern = r'((?:src|href)=["\'])[^"\']*krim-primary\.svg([^"\']*)(["\'])'
              fixed = re.sub(pattern, lambda m: m.group(1) + relative_logo + m.group(2) + m.group(3), html)
              if fixed != html:
                  page.write_text(fixed, encoding="utf-8")
          PY
          test -f _site/assets/krim-primary.svg
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/customer-os/INTEGRATION-MANIFEST.html
          echo "Customer OS HTML pages: $(find _site/customer-os -type f -name '*.html' | wc -l)"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload complete website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
