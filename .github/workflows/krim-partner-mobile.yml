name: KRIM mobile app validation
on:
  push:
    branches: [main, mobile/krim-partner-app]
    paths:
      - 'mobile/krim-partner/**'
      - 'mobile/krim-customer/**'
      - 'mobile/krim-driver/**'
      - '.github/workflows/krim-partner-mobile.yml'
  pull_request:
    paths:
      - 'mobile/krim-partner/**'
      - 'mobile/krim-customer/**'
      - 'mobile/krim-driver/**'
      - '.github/workflows/krim-partner-mobile.yml'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [krim-partner, krim-customer, krim-driver]
    defaults:
      run:
        working-directory: mobile/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Preserve generated dependency lockfile for reproducible CI
        uses: actions/upload-artifact@v4
        with:
          name: krim-${{ matrix.app }}-package-lock
          path: mobile/${{ matrix.app }}/package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Stage official KRIM master logo inside app bundle
        run: npx --yes sharp-cli -i ../../assets/krim-primary.svg -o assets/krim-master-logo.png -f png resize 720 216 --fit contain --background '#FFFFFF'
      - name: Generate Expo icon PNG assets
        run: |
          npx --yes sharp-cli -i assets/icon.svg -o assets -f png resize 1024 1024
          npx --yes sharp-cli -i assets/adaptive-icon.svg -o assets -f png resize 1024 1024
      - name: Check Expo SDK package compatibility
        run: npx expo install --check
      - name: Validate Expo configuration
        run: npx expo config --type public --json > /tmp/krim-expo-config.json
      - run: npm run typecheck
      - run: npx expo export --platform android
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: validation-placeholder


  build-driver-debug-apk:
    name: Build installable KRIM Driver Android debug APK
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile/krim-driver
    steps:
      - name: Check out validated source
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install driver dependencies
        run: npm install --no-audit --no-fund
      - name: Stage KRIM brand assets
        run: |
          npx --yes sharp-cli -i ../../assets/krim-primary.svg -o assets/krim-master-logo.png -f png resize 720 216 --fit contain --background '#FFFFFF'
          npx --yes sharp-cli -i ../../assets/krim-icon.svg -o assets/icon.png -f png resize 1024 1024 --fit contain --background '#071B35'
          npx --yes sharp-cli -i ../../assets/krim-icon.svg -o assets/adaptive-icon.png -f png resize 680 680 --fit contain --background '#071B35'
          npx --yes sharp-cli -i assets/adaptive-icon.png -o assets/adaptive-icon.png -f png extend 172 172 172 172 --background '#071B35'
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: validation-placeholder
      - name: Verify Android location and notification manifest permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_BACKGROUND_LOCATION' "$MANIFEST"
          grep -q 'android.permission.FOREGROUND_SERVICE_LOCATION' "$MANIFEST"
          grep -q 'android.permission.POST_NOTIFICATIONS' "$MANIFEST"
          grep -q 'foregroundServiceType="location"' "$MANIFEST"
      - name: Assemble installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload KRIM Driver debug APK
        uses: actions/upload-artifact@v4
        with:
          name: krim-driver-android-debug-apk
          path: mobile/krim-driver/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  commit-lockfiles:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all generated app lockfiles
        uses: actions/download-artifact@v4
        with:
          pattern: krim-*-package-lock
          path: package-locks
      - name: Commit reproducible dependency lockfiles
        run: |
          set -euo pipefail
          cp package-locks/krim-krim-driver-package-lock/package-lock.json mobile/krim-driver/package-lock.json
          cp package-locks/krim-krim-customer-package-lock/package-lock.json mobile/krim-customer/package-lock.json
          cp package-locks/krim-krim-partner-package-lock/package-lock.json mobile/krim-partner/package-lock.json
          git fetch origin main
          git rebase origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/krim-driver/package-lock.json mobile/krim-customer/package-lock.json mobile/krim-partner/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles are already current."
            exit 0
          fi
          git commit -m "Add reproducible lockfiles for KRIM mobile apps"
          git push
