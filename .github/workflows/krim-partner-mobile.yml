name: KRIM mobile app validation
on:
  push:
    branches: [main, mobile/krim-partner-app]
    paths:
      - 'mobile/krim-partner/**'
      - 'mobile/krim-customer/**'
      - 'mobile/krim-driver/**'
      - '.github/workflows/krim-partner-mobile.yml'
  pull_request:
    paths:
      - 'mobile/krim-partner/**'
      - 'mobile/krim-customer/**'
      - 'mobile/krim-driver/**'
      - '.github/workflows/krim-partner-mobile.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [krim-partner, krim-customer, krim-driver]
    defaults:
      run:
        working-directory: mobile/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Stage official KRIM master logo inside app bundle
        run: npx --yes sharp-cli -i ../../assets/krim-primary.svg -o assets/krim-master-logo.png -f png resize 720 216 --fit contain --background '#FFFFFF'
      - name: Generate Expo icon PNG assets
        run: |
          npx --yes sharp-cli -i assets/icon.svg -o assets -f png resize 1024 1024
          npx --yes sharp-cli -i assets/adaptive-icon.svg -o assets -f png resize 1024 1024
      - name: Check Expo SDK package compatibility
        run: npx expo install --check
      - name: Validate Expo configuration
        run: npx expo config --type public --json > /tmp/krim-expo-config.json
      - run: npm run typecheck
      - run: npx expo export --platform android
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: validation-placeholder


  build-driver-debug-apk:
    name: Build installable KRIM Driver Android debug APK
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile/krim-driver
    steps:
      - name: Check out validated source
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install driver dependencies
        run: npm ci --no-audit --no-fund
      - name: Stage KRIM brand assets
        run: |
          npx --yes sharp-cli -i ../../assets/krim-primary.svg -o assets/krim-master-logo.png -f png resize 720 216 --fit contain --background '#FFFFFF'
          npx --yes sharp-cli -i ../../assets/krim-icon.svg -o assets/icon.png -f png resize 1024 1024 --fit contain --background '#071B35'
          npx --yes sharp-cli -i ../../assets/krim-icon.svg -o assets/adaptive-icon.png -f png resize 680 680 --fit contain --background '#071B35'
          npx --yes sharp-cli -i assets/adaptive-icon.png -o assets/adaptive-icon.png -f png extend 172 172 172 172 --background '#071B35'
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: validation-placeholder
      - name: Verify Android location and notification manifest permissions
        run: |
          set -euo pipefail
          MANIFEST=android/app/src/main/AndroidManifest.xml
          test -f "$MANIFEST" || { echo "Generated Android manifest is missing."; find android -name AndroidManifest.xml -print; exit 1; }
          echo "Generated location-related manifest declarations:"
          grep -nE 'uses-permission|foregroundServiceType' "$MANIFEST" || true
          missing=0
          for permission in ACCESS_BACKGROUND_LOCATION FOREGROUND_SERVICE_LOCATION POST_NOTIFICATIONS; do
            if grep -q "android.permission.$permission" "$MANIFEST"; then
              echo "PASS: $permission"
            else
              echo "MISSING: $permission"
              missing=1
            fi
          done
          if grep -Eq 'android:foregroundServiceType="location"|foregroundServiceType="location"' "$MANIFEST"; then
            echo "PASS: location foreground-service type"
          else
            echo "MISSING: location foreground-service type"
            missing=1
          fi
          exit "$missing"
      - name: Assemble installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload KRIM Driver debug APK
        uses: actions/upload-artifact@v4
        with:
          name: krim-driver-android-debug-apk
          path: mobile/krim-driver/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
