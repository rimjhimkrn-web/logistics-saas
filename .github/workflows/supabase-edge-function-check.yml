name: KRIM Supabase Edge Function Check

on:
  pull_request:
  push:
    branches:
      - main
      - "krim/**"
    paths:
      - "supabase/functions/**/*.ts"
      - ".github/workflows/supabase-edge-function-check.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check source-controlled payment functions
        run: deno check supabase/functions/create-global-razorpay-order/index.ts supabase/functions/verify-razorpay-payment/index.ts
