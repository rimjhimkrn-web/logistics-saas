name: KRIM Staging Edge Project Guard Tests

on:
  push:
    branches:
      - staging/phase00-env-isolation
    paths:
      - "supabase/functions/_shared/krim-staging-project-guard.ts"
      - "supabase/functions/_shared/krim-staging-project-guard_test.ts"
      - "supabase/functions/global-admin-control/**"
      - "supabase/functions/owner-testing-authorize/**"
      - "supabase/functions/krim-resend-email-worker/**"
      - "supabase/functions/krim-phase00-test-user-invites/**"
      - "supabase/functions/krim-phase00-provision-test-organizations/**"
      - ".github/workflows/krim-staging-edge-project-guard-tests.yml"
  pull_request:
    paths:
      - "supabase/functions/_shared/krim-staging-project-guard.ts"
      - "supabase/functions/_shared/krim-staging-project-guard_test.ts"
      - "supabase/functions/global-admin-control/**"
      - "supabase/functions/owner-testing-authorize/**"
      - "supabase/functions/krim-resend-email-worker/**"
      - ".github/workflows/krim-staging-edge-project-guard-tests.yml"

permissions:
  contents: read

jobs:
  project-guard-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test exact Staging project guard
        run: deno test --no-check supabase/functions/_shared/krim-staging-project-guard_test.ts
