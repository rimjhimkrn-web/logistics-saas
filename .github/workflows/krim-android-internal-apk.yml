name: KRIM Android internal APK build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-krim-apk-build.txt'
  workflow_dispatch:
    inputs:
      app:
        description: Select the KRIM app to build
        required: true
        type: choice
        options:
          - krim-partner
          - krim-customer
          - krim-driver

permissions:
  contents: read

concurrency:
  group: krim-android-apk-${{ github.event_name == 'workflow_dispatch' && inputs.app || 'all' }}
  cancel-in-progress: true

jobs:
  build-window-guard:
    name: Check APK build window
    runs-on: ubuntu-latest
    outputs:
      build_allowed: ${{ steps.window.outputs.build_allowed }}
    steps:
      - name: Compare run timestamp with the December release window
        id: window
        env:
          RUN_STARTED_AT: ${{ github.run_started_at }}
        shell: bash
        run: |
          cutoff_epoch="$(date -u -d '2026-12-01T00:00:00Z' +%s)"
          run_epoch="$(date -u -d "$RUN_STARTED_AT" +%s)"
          if [[ "$run_epoch" -lt "$cutoff_epoch" ]]; then
            echo "build_allowed=false" >> "$GITHUB_OUTPUT"
            echo "KRIM Android APK builds are paused until 1 December 2026."
          else
            echo "build_allowed=true" >> "$GITHUB_OUTPUT"
            echo "APK build window is open."
          fi

  build-window-notice:
    needs: build-window-guard
    if: ${{ needs.build-window-guard.outputs.build_allowed != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain the temporary APK pause
        run: echo "KRIM Android APK builds are paused until 1 December 2026. Source validation remains available."

  build:
    needs: build-window-guard
    if: ${{ needs.build-window-guard.outputs.build_allowed == 'true' }}
    name: Build ${{ matrix.app }} Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        app: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.app)) || fromJSON('["krim-partner","krim-customer","krim-driver"]') }}
    defaults:
      run:
        working-directory: mobile/${{ matrix.app }}
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm ci --no-audit --no-fund
      - name: Stage official KRIM logo inside app bundle
        run: npx --yes sharp-cli -i ../../assets/krim-primary.svg -o assets/krim-master-logo.png -f png resize 720 216 --fit contain --background '#FFFFFF'

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Apply official KRIM master logo without cropping
        run: |
          npx --yes sharp-cli -i ../../assets/krim-icon.svg -o assets/icon.png -f png resize 1024 1024 --fit contain --background '#071B35'
          npx --yes sharp-cli -i ../../assets/krim-icon.svg -o assets/adaptive-icon.png -f png resize 680 680 --fit contain --background '#071B35'
          npx --yes sharp-cli -i assets/adaptive-icon.png -o assets/adaptive-icon.png -f png extend 172 172 172 172 --background '#071B35'

      - name: Validate Expo Android export
        run: npx expo export --platform android
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: validation-placeholder

      - name: Build internal Android APK with EAS
        run: npx --yes eas-cli@latest build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
