name: KRIM Android internal APK build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-krim-apk-build.txt'
  workflow_dispatch:
    inputs:
      app:
        description: Select the KRIM app to build
        required: true
        type: choice
        options:
          - krim-partner
          - krim-customer
          - krim-driver

permissions:
  contents: read

concurrency:
  group: krim-android-apk-${{ github.event_name == 'workflow_dispatch' && inputs.app || 'all' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.app }} Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        app: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.app)) || fromJSON('["krim-partner","krim-customer","krim-driver"]') }}
    defaults:
      run:
        working-directory: mobile/${{ matrix.app }}
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm install --no-audit --no-fund
      - name: Stage official KRIM logo inside app bundle
        run: cp ../../assets/file_00000000242881faa8abc7188d1c40c4.png assets/krim-master-logo.png

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Apply official KRIM master logo without cropping
        run: |
          npx --yes sharp-cli -i ../../assets/file_00000000242881faa8abc7188d1c40c4.png -o assets/icon.png -f png resize 1024 1024 --fit contain --background '#071B35'
          npx --yes sharp-cli -i ../../assets/file_00000000242881faa8abc7188d1c40c4.png -o assets/adaptive-icon.png -f png resize 680 680 --fit contain --background '#071B35'
          npx --yes sharp-cli -i assets/adaptive-icon.png -o assets/adaptive-icon.png -f png extend 172 172 172 172 --background '#071B35'

      - name: Validate Expo Android export
        run: npx expo export --platform android
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: validation-placeholder

      - name: Build internal Android APK with EAS
        run: npx --yes eas-cli@latest build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
