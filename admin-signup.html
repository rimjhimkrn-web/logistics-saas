<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Admin Sign Up</title>
            </head>
            <body>

                <h1>🔐 Create Admin Account</h1>
                    <p style="color:red;">⚠️ Remove this file after creating admin</p>

                        <form id="signupForm">
                                <p>
                                            <label>Email:</label><br>
                                                        <input type="email" id="email" placeholder="admin@yourcompany.com" required>
                                                                </p>

                                                                        <p>
                                                                                    <label>Password:</label><br>
                                                                                                <input type="password" id="password" placeholder="Min 6 characters" required>
                                                                                                        </p>

                                                                                                                <button type="submit">Create Admin</button>
                                                                                                                    </form>

                                                                                                                        <div id="message"></div>

                                                                                                                            <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
                                                                                                                                </script>
                                                                                                                                    <script>
                                                                                                                                            const supabase = window.supabase.createClient(
                                                                                                                                                        'https://ebltviniygljwwseplph.supabase.co',
                                                                                                                                                                    'sb_publishable_8xzZUeubYp_nIxVRWEQdiw_2H4RkHAa'
                                                                                                                                                                            );

                                                                                                                                                                                    const form = document.getElementById('signupForm');
                                                                                                                                                                                            const message = document.getElementById('message');

                                                                                                                                                                                                    form.addEventListener('submit', async function(e) {
                                                                                                                                                                                                                e.preventDefault();

                                                                                                                                                                                                                            const email = document.getElementById('email').value.trim();
                                                                                                                                                                                                                                        const password = document.getElementById('password').value.trim();

                                                                                                                                                                                                                                                    if (!email || !password) {
                                                                                                                                                                                                                                                                    message.innerHTML = '⚠️ Email and password are required';
                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                            if (password.length < 6) {
                                                                                                                                                                                                                                                                                                                            message.innerHTML = '⚠️ Password must be at least 6 characters';
                                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                    message.innerHTML = '⏳ Creating admin account...';

                                                                                                                                                                                                                                                                                                                                                                                const { data, error } = await supabase.auth.signUp({
                                                                                                                                                                                                                                                                                                                                                                                                email: email,
                                                                                                                                                                                                                                                                                                                                                                                                                password: password,
                                                                                                                                                                                                                                                                                                                                                                                                                                options: {
                                                                                                                                                                                                                                                                                                                                                                                                                                                    data: {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            role: 'admin'
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (error) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        message.innerHTML = '❌ ' + error.message;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                message.innerHTML = '✅ Admin account created! Please check your email to confirm.';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            form.reset();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
