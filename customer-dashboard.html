<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>My Dashboard</title>
            </head>
            <body>

                <h1>👋 My Dashboard</h1>

                    <div id="userInfo"></div>

                        <h2>My Shipments</h2>
                            <div id="shipments">Loading...</div>

                                <br>
                                    <a href="submit-shipment.html">+ Request New Shipment</a>
                                        <br>
                                            <br>
                                                <button onclick="logout()">Logout</button>
                                                    <br>
                                                        <a href="index.html">Back to Home</a>

                                                            <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
                                                                </script>
                                                                    <script>
                                                                            const supabase = window.supabase.createClient(
                                                                                        'https://ebltviniygljwwseplph.supabase.co',
                                                                                                    'sb_publishable_8xzZUeubYp_nIxVRWEQdiw_2H4RkHAa'
                                                                                                            );

                                                                                                                    async function loadDashboard() {
                                                                                                                                // Check if user is logged in
                                                                                                                                            const { data: { user }, error: userError } = await supabase.auth.getUser();

                                                                                                                                                        if (userError || !user) {
                                                                                                                                                                        document.getElementById('userInfo').innerHTML = 'Please login first.';
                                                                                                                                                                                        document.getElementById('shipments').innerHTML = '';
                                                                                                                                                                                                        return;
                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                // Show user info
                                                                                                                                                                                                                                            document.getElementById('userInfo').innerHTML = `
                                                                                                                                                                                                                                                            <p><strong>Welcome,</strong> ${user.user_metadata?.full_name || user.email}</p>
                                                                                                                                                                                                                                                                            <p><strong>Email:</strong> ${user.email}</p>
                                                                                                                                                                                                                                                                                            <hr>
                                                                                                                                                                                                                                                                                                        `;

                                                                                                                                                                                                                                                                                                                    // Fetch shipments for this user
                                                                                                                                                                                                                                                                                                                                const { data, error } = await supabase
                                                                                                                                                                                                                                                                                                                                                .from('shipment_requests')
                                                                                                                                                                                                                                                                                                                                                                .select('*')
                                                                                                                                                                                                                                                                                                                                                                                .eq('customer_email', user.email)
                                                                                                                                                                                                                                                                                                                                                                                                .order('created_at', { ascending: false });

                                                                                                                                                                                                                                                                                                                                                                                                            if (error) {
                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById('shipments').innerHTML = 'Error loading shipments';
                                                                                                                                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (!data || data.length === 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById('shipments').innerHTML = 'No shipments found.';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let html = '';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        data.forEach(s => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        html += `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div style="border:1px solid #ccc; padding:12px; margin:10px 0; border-radius:6px;">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <strong>${s.tracking_number}</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <span style="background:#eee; padding:2px 10px; border-radius:12px;">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ${s.status || 'NEW'}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <br>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ${s.pickup_location} → ${s.delivery_location}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <br>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <small>${s.material || s.material_goods}</small>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <br>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <a href="shipment-details.html?tracking=${s.tracking_number}">View Details</a>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    `;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById('shipments').innerHTML = html;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            async function logout() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        await supabase.auth.signOut();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    window.location.href = 'index.html';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // Load on page open
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            loadDashboard();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </html>
