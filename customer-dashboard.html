<!DOCTYPE html>
<html>
<head>
  <title>Customer Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

      <style>
          body {
                font-family: Arial, sans-serif;
                      background: #f4f6f8;
                            padding: 20px;
                                }

                                    .box {
                                          max-width: 700px;
                                                margin: auto;
                                                      background: white;
                                                            padding: 20px;
                                                                  border-radius: 10px;
                                                                      }

                                                                          h1 {
                                                                                color: #222;
                                                                                    }

                                                                                        h2 {
                                                                                              color: #333;
                                                                                                  }

                                                                                                      .info {
                                                                                                            background: #f1f5f9;
                                                                                                                  padding: 15px;
                                                                                                                        border-radius: 8px;
                                                                                                                              margin-bottom: 20px;
                                                                                                                                  }

                                                                                                                                      .shipment {
                                                                                                                                            border: 1px solid #ddd;
                                                                                                                                                  padding: 15px;
                                                                                                                                                        margin-bottom: 15px;
                                                                                                                                                              border-radius: 8px;
                                                                                                                                                                  }

                                                                                                                                                                      button {
                                                                                                                                                                            background: #087df1;
                                                                                                                                                                                  color: white;
                                                                                                                                                                                        border: none;
                                                                                                                                                                                              padding: 10px 15px;
                                                                                                                                                                                                    border-radius: 5px;
                                                                                                                                                                                                          cursor: pointer;
                                                                                                                                                                                                                margin: 5px 5px 5px 0;
                                                                                                                                                                                                                    }

                                                                                                                                                                                                                        button.logout {
                                                                                                                                                                                                                              background: #dc3545;
                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                      a {
                                                                                                                                                                                                                                            text-decoration: none;
                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                    .status {
                                                                                                                                                                                                                                                          font-weight: bold;
                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                </style>
                                                                                                                                                                                                                                                                </head>

                                                                                                                                                                                                                                                                <body>

                                                                                                                                                                                                                                                                  <div class="box">

                                                                                                                                                                                                                                                                      <h1>Customer Dashboard</h1>

                                                                                                                                                                                                                                                                          <div id="message">Loading...</div>

                                                                                                                                                                                                                                                                              <div id="dashboard" style="display:none;">

                                                                                                                                                                                                                                                                                    <div class="info">
                                                                                                                                                                                                                                                                                            <h2>Welcome, <span id="customerName"></span></h2>

                                                                                                                                                                                                                                                                                                    <p>
                                                                                                                                                                                                                                                                                                              <b>Company:</b>
                                                                                                                                                                                                                                                                                                                        <span id="companyName"></span>
                                                                                                                                                                                                                                                                                                                                </p>

                                                                                                                                                                                                                                                                                                                                        <p>
                                                                                                                                                                                                                                                                                                                                                  <b>Phone:</b>
                                                                                                                                                                                                                                                                                                                                                            <span id="phone"></span>
                                                                                                                                                                                                                                                                                                                                                                    </p>
                                                                                                                                                                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                                                                                                                                                                                <h2>My Shipments</h2>

                                                                                                                                                                                                                                                                                                                                                                                      <div id="shipments">
                                                                                                                                                                                                                                                                                                                                                                                              Loading shipments...
                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                          <br>

                                                                                                                                                                                                                                                                                                                                                                                                                <a href="index.html">
                                                                                                                                                                                                                                                                                                                                                                                                                        <button>+ Create New Shipment</button>
                                                                                                                                                                                                                                                                                                                                                                                                                              </a>

                                                                                                                                                                                                                                                                                                                                                                                                                                    <a href="tracking.html">
                                                                                                                                                                                                                                                                                                                                                                                                                                            <button>Track Shipment</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                  </a>

                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button class="logout" onclick="logout()">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                Logout
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                              // Supabase
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const SUPABASE_URL = "https://ebltviniygljwwseplph.supabase.co";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const SUPABASE_KEY =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      "sb_publishable_8xzZUeubYp_nIxVRWEQdiw_2H4RkHAa";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const supabaseClient =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              // Load customer
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                async function loadDashboard() {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          data: { user },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                error
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    } = await supabaseClient.auth.getUser();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (error || !user) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.getElementById("message").innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      "Please login first.";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // Get customer profile
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              data: profile,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    error: profileError
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        } = await supabaseClient
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              .from("customer_profiles")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .select("full_name, company_name, phone")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          .eq("id", user.id)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                .maybeSingle();


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (profileError) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          document.getElementById("message").innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  profileError.message;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!profile) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      document.getElementById("message").innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              "Customer profile not found.";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // Show customer information
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById("customerName").innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      profile.full_name || "Customer";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          document.getElementById("companyName").innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                profile.company_name || "-";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById("phone").innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          profile.phone || "-";


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              // Get shipments using customer phone
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        data: shipments,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              error: shipmentError
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  } = await supabaseClient
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        .from("shipment_requests")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              .select(`
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      id,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              tracking_number,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      pickup_location,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              delivery_location,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      material_goods,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              weight,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      truck_type,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              status,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      created_at
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            `)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  .eq("phone_number", profile.phone)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        .order("created_at", { ascending: false });


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (shipmentError) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  document.getElementById("shipments").innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          shipmentError.message;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              } else {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    showShipments(shipments);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById("message").style.display = "none";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById("dashboard").style.display = "block";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // Show shipments
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      function showShipments(shipments) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const container =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById("shipments");


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (!shipments || shipments.length === 0) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          container.innerHTML =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  "<p>No shipments found.</p>";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                container.innerHTML = "";


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    shipments.forEach(function(shipment) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const div = document.createElement("div");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                div.className = "shipment";


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      div.innerHTML = `
