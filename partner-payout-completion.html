<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Partner Payout Completion | KRIM Logistics</title>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

          <style>
              * {
                    box-sizing: border-box;
                          font-family: Arial, sans-serif;
                              }

                                  body {
                                        margin: 0;
                                              background: #f4f6f8;
                                                    color: #111827;
                                                        }

                                                            .container {
                                                                  max-width: 600px;
                                                                        margin: 40px auto;
                                                                              padding: 20px;
                                                                                  }

                                                                                      .card {
                                                                                            background: white;
                                                                                                  padding: 25px;
                                                                                                        border-radius: 12px;
                                                                                                              box-shadow: 0 4px 15px rgba(0,0,0,0.08);
                                                                                                                  }

                                                                                                                      h1 {
                                                                                                                            margin-top: 0;
                                                                                                                                  font-size: 25px;
                                                                                                                                      }

                                                                                                                                          label {
                                                                                                                                                display: block;
                                                                                                                                                      margin-top: 18px;
                                                                                                                                                            margin-bottom: 7px;
                                                                                                                                                                  font-weight: bold;
                                                                                                                                                                      }

                                                                                                                                                                          input, select {
                                                                                                                                                                                width: 100%;
                                                                                                                                                                                      padding: 12px;
                                                                                                                                                                                            border: 1px solid #d1d5db;
                                                                                                                                                                                                  border-radius: 7px;
                                                                                                                                                                                                        font-size: 16px;
                                                                                                                                                                                                            }

                                                                                                                                                                                                                button {
                                                                                                                                                                                                                      width: 100%;
                                                                                                                                                                                                                            margin-top: 22px;
                                                                                                                                                                                                                                  padding: 13px;
                                                                                                                                                                                                                                        border: 0;
                                                                                                                                                                                                                                              border-radius: 7px;
                                                                                                                                                                                                                                                    background: #111827;
                                                                                                                                                                                                                                                          color: white;
                                                                                                                                                                                                                                                                font-size: 16px;
                                                                                                                                                                                                                                                                      cursor: pointer;
                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                              button:disabled {
                                                                                                                                                                                                                                                                                    opacity: 0.6;
                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                            #message {
                                                                                                                                                                                                                                                                                                  margin-top: 18px;
                                                                                                                                                                                                                                                                                                        padding: 12px;
                                                                                                                                                                                                                                                                                                              border-radius: 7px;
                                                                                                                                                                                                                                                                                                                    display: none;
                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                            .success {
                                                                                                                                                                                                                                                                                                                                  background: #dcfce7;
                                                                                                                                                                                                                                                                                                                                        color: #166534;
                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                .error {
                                                                                                                                                                                                                                                                                                                                                      background: #fee2e2;
                                                                                                                                                                                                                                                                                                                                                            color: #991b1b;
                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                  </style>
                                                                                                                                                                                                                                                                                                                                                                  </head>

                                                                                                                                                                                                                                                                                                                                                                  <body>

                                                                                                                                                                                                                                                                                                                                                                  <div class="container">
                                                                                                                                                                                                                                                                                                                                                                    <div class="card">

                                                                                                                                                                                                                                                                                                                                                                        <h1>Partner Payout Completion</h1>

                                                                                                                                                                                                                                                                                                                                                                            <label for="payoutId">Payout ID</label>
                                                                                                                                                                                                                                                                                                                                                                                <input
                                                                                                                                                                                                                                                                                                                                                                                      id="payoutId"
                                                                                                                                                                                                                                                                                                                                                                                            type="number"
                                                                                                                                                                                                                                                                                                                                                                                                  placeholder="Enter payout ID"
                                                                                                                                                                                                                                                                                                                                                                                                      >

                                                                                                                                                                                                                                                                                                                                                                                                          <label for="transactionId">Transaction ID</label>
                                                                                                                                                                                                                                                                                                                                                                                                              <input
                                                                                                                                                                                                                                                                                                                                                                                                                    id="transactionId"
                                                                                                                                                                                                                                                                                                                                                                                                                          type="text"
                                                                                                                                                                                                                                                                                                                                                                                                                                placeholder="Enter transaction ID"
                                                                                                                                                                                                                                                                                                                                                                                                                                    >

                                                                                                                                                                                                                                                                                                                                                                                                                                        <label for="payoutMethod">Payout Method</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                            <select id="payoutMethod">
                                                                                                                                                                                                                                                                                                                                                                                                                                                  <option value="bank_transfer">Bank Transfer</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                        <option value="upi">UPI</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                              <option value="neft">NEFT</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <option value="imps">IMPS</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <option value="other">Other</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </select>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <button id="completeBtn" onclick="completePayout()">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        Mark Payout as Paid
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div id="message"></div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <script src="config.js"></script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const supabaseClient = window.supabase.createClient(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        window.SUPABASE_URL,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            window.SUPABASE_ANON_KEY
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                async function completePayout() {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const payoutId = document.getElementById("payoutId").value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const transactionId = document.getElementById("transactionId").value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const payoutMethod = document.getElementById("payoutMethod").value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const button = document.getElementById("completeBtn");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const message = document.getElementById("message");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        message.style.display = "none";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (!payoutId) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  showMessage("Please enter the Payout ID.", false);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!transactionId) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      showMessage("Please enter the Transaction ID.", false);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    button.disabled = true;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        button.textContent = "Processing...";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            try {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          data: { session }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                } = await supabaseClient.auth.getSession();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if (!session) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              throw new Error("Please login as Admin first.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const { data, error } = await supabaseClient.rpc(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  "complete_partner_payout",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    p_payout_id: Number(payoutId),
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              p_transaction_id: transactionId,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        p_payout_method: payoutMethod
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (error) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    throw error;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                showMessage(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        "Partner payout completed successfully!",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                true
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById("payoutId").value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  document.getElementById("transactionId").value = "";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      } catch (error) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            showMessage(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    "Error: " + error.message,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            false
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      } finally {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            button.disabled = false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  button.textContent = "Mark Payout as Paid";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          function showMessage(text, success) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const message = document.getElementById("message");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  message.textContent = text;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      message.className = success ? "success" : "error";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          message.style.display = "block";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
