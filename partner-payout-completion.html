<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
    <title>Partner Payout Completion</title>

      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

        <style>
            body {
                  font-family: Arial, sans-serif;
                        padding: 30px;
                              max-width: 600px;
                                    margin: auto;
                                        }

                                            input, button {
                                                  width: 100%;
                                                        padding: 12px;
                                                              margin-top: 10px;
                                                                    box-sizing: border-box;
                                                                        }

                                                                            #result {
                                                                                  margin-top: 20px;
                                                                                        line-height: 1.8;
                                                                                            }
                                                                                              </style>
                                                                                              </head>

                                                                                              <body>

                                                                                                <h2>Partner Payout Completion</h2>

                                                                                                  <input
                                                                                                      type="text"
                                                                                                          id="tracking"
                                                                                                              placeholder="Enter Tracking Number"
                                                                                                                >

                                                                                                                  <button onclick="checkPayout()">
                                                                                                                      Check Payout
                                                                                                                        </button>

                                                                                                                          <div id="result"></div>

                                                                                                                            <script>

                                                                                                                                const SUPABASE_URL =
                                                                                                                                      "https://ebltviniygljwwseplph.supabase.co";

                                                                                                                                          const SUPABASE_PUBLISHABLE_KEY =
                                                                                                                                                "sb_publishable_8xzZUeubYp_nIxVRWEQdiw_2H4RkHAa";

                                                                                                                                                    const supabaseClient =
                                                                                                                                                          supabase.createClient(
                                                                                                                                                                  SUPABASE_URL,
                                                                                                                                                                          SUPABASE_PUBLISHABLE_KEY
                                                                                                                                                                                );


                                                                                                                                                                                    async function checkPayout() {

                                                                                                                                                                                          const result =
                                                                                                                                                                                                  document.getElementById("result");

                                                                                                                                                                                                        const tracking =
                                                                                                                                                                                                                document.getElementById("tracking").value.trim();


                                                                                                                                                                                                                      if (!tracking) {
                                                                                                                                                                                                                              result.innerText =
                                                                                                                                                                                                                                        "Please enter tracking number.";
                                                                                                                                                                                                                                                return;
                                                                                                                                                                                                                                                      }


                                                                                                                                                                                                                                                            const { data: shipment, error: shipmentError } =
                                                                                                                                                                                                                                                                    await supabaseClient
                                                                                                                                                                                                                                                                              .from("shipment_requests")
                                                                                                                                                                                                                                                                                        .select("id, tracking_number, status")
                                                                                                                                                                                                                                                                                                  .eq("tracking_number", tracking)
                                                                                                                                                                                                                                                                                                            .single();


                                                                                                                                                                                                                                                                                                                  if (shipmentError || !shipment) {
                                                                                                                                                                                                                                                                                                                          result.innerText =
                                                                                                                                                                                                                                                                                                                                    "Shipment not found.";
                                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                                                  }


                                                                                                                                                                                                                                                                                                                                                        const { data: payout, error: payoutError } =
                                                                                                                                                                                                                                                                                                                                                                await supabaseClient
                                                                                                                                                                                                                                                                                                                                                                          .from("partner_payouts")
                                                                                                                                                                                                                                                                                                                                                                                    .select(
                                                                                                                                                                                                                                                                                                                                                                                                "id, partner_id, payout_amount, status, payout_method, transaction_id, paid_at"
                                                                                                                                                                                                                                                                                                                                                                                                          )
                                                                                                                                                                                                                                                                                                                                                                                                                    .eq("shipment_id", shipment.id)
                                                                                                                                                                                                                                                                                                                                                                                                                              .maybeSingle();


                                                                                                                                                                                                                                                                                                                                                                                                                                    if (payoutError) {
                                                                                                                                                                                                                                                                                                                                                                                                                                            result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                      "Payout information unavailable.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                              return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if (!payout) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            "Payout record not found.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const { data: financials } =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        await supabaseClient
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  .from("shipment_financials")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .select(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        "customer_amount, partner_cost, platform_margin, status"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  )
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .eq("shipment_id", shipment.id)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      .maybeSingle();


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let html = `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <hr>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <strong>Tracking:</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ${shipment.tracking_number}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <strong>Shipment Status:</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ${shipment.status}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <strong>Partner ID:</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ${payout.partner_id}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <strong>Payout Amount:</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ₹${payout.payout_amount}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <strong>Payout Status:</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ${payout.status}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              `;


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (financials) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            html += `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <h3>Financial Summary</h3>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <strong>Customer Amount:</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ₹${financials.customer_amount}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <strong>Partner Cost:</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ₹${financials.partner_cost}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <strong>Platform Margin:</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ₹${financials.platform_margin}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  `;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if (payout.status === "paid") {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      html += `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <strong>Payment:</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        Already Paid
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <strong>Paid At:</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ${payout.paid_at || "Available"}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      `;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            } else {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    html += `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <button onclick="markPaid(${payout.id})">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          Mark Payout as Paid
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            `;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        result.innerHTML = html;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                async function markPaid(payoutId) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const result =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.getElementById("result");


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const transactionId =
