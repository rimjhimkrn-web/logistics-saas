<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Accept Quotation - KRIM Logistics">

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
          <script src="config.js"></script>

            <style>
                body {
                      font-family: Arial, sans-serif;
                            background: #f4f6f8;
                                  padding: 30px 15px;
                                      }

                                          .box {
                                                max-width: 450px;
                                                      margin: auto;
                                                            background: white;
                                                                  padding: 25px;
                                                                        border-radius: 15px;
                                                                              box-shadow: 0 5px 20px #ddd;
                                                                                  }

                                                                                      h1 {
                                                                                            text-align: center;
                                                                                                  color: #0b1f3a;
                                                                                                      }

                                                                                                          p {
                                                                                                                font-size: 16px;
                                                                                                                      margin: 15px 0;
                                                                                                                          }

                                                                                                                              button {
                                                                                                                                    width: 100%;
                                                                                                                                          padding: 15px;
                                                                                                                                                background: #0b1f3a;
                                                                                                                                                      color: white;
                                                                                                                                                            border: none;
                                                                                                                                                                  border-radius: 8px;
                                                                                                                                                                        font-size: 17px;
                                                                                                                                                                              cursor: pointer;
                                                                                                                                                                                  }

                                                                                                                                                                                      button:disabled {
                                                                                                                                                                                            opacity: 0.6;
                                                                                                                                                                                                }

                                                                                                                                                                                                    #message {
                                                                                                                                                                                                          text-align: center;
                                                                                                                                                                                                                margin-top: 20px;
                                                                                                                                                                                                                      font-weight: bold;
                                                                                                                                                                                                                          }
                                                                                                                                                                                                                            </style>
                                                                                                                                                                                                                            </head>

                                                                                                                                                                                                                            <body>

                                                                                                                                                                                                                            <div class="box">

                                                                                                                                                                                                                              <h1>Accept Quotation</h1>

                                                                                                                                                                                                                                <p>
                                                                                                                                                                                                                                    <b>Tracking Number:</b>
                                                                                                                                                                                                                                        <span id="tracking">TRK-000014</span>
                                                                                                                                                                                                                                          </p>

                                                                                                                                                                                                                                            <p>
                                                                                                                                                                                                                                                <b>Quotation:</b>
                                                                                                                                                                                                                                                    ₹<span id="price">5000</span>
                                                                                                                                                                                                                                                      </p>

                                                                                                                                                                                                                                                        <p>
                                                                                                                                                                                                                                                            <b>Current Status:</b>
                                                                                                                                                                                                                                                                <span id="status">sent</span>
                                                                                                                                                                                                                                                                  </p>

                                                                                                                                                                                                                                                                    <button id="acceptBtn">
                                                                                                                                                                                                                                                                        Accept Quote
                                                                                                                                                                                                                                                                          </button>

                                                                                                                                                                                                                                                                            <div id="message"></div>

                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                            <script>

                                                                                                                                                                                                                                                                            const tracking = new URLSearchParams(location.search)
                                                                                                                                                                                                                                                                              .get("tracking") || "TRK-000014";

                                                                                                                                                                                                                                                                              document.getElementById("tracking").textContent = tracking;

                                                                                                                                                                                                                                                                              const button = document.getElementById("acceptBtn");
                                                                                                                                                                                                                                                                              const message = document.getElementById("message");

                                                                                                                                                                                                                                                                              async function acceptQuote() {

                                                                                                                                                                                                                                                                                button.disabled = true;
                                                                                                                                                                                                                                                                                  button.textContent = "Processing...";

                                                                                                                                                                                                                                                                                    try {

                                                                                                                                                                                                                                                                                        const { data, error } = await supabaseClient.rpc(
                                                                                                                                                                                                                                                                                              "accept_shipment_quote",
                                                                                                                                                                                                                                                                                                    {
                                                                                                                                                                                                                                                                                                            p_shipment_id: 14
                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                      );

                                                                                                                                                                                                                                                                                                                          if (error) {
                                                                                                                                                                                                                                                                                                                                throw error;
                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                        document.getElementById("status").textContent = "accepted";

                                                                                                                                                                                                                                                                                                                                            message.textContent =
                                                                                                                                                                                                                                                                                                                                                  "Quotation accepted successfully!";

                                                                                                                                                                                                                                                                                                                                                      message.style.color = "green";

                                                                                                                                                                                                                                                                                                                                                          button.textContent = "Accepted";

                                                                                                                                                                                                                                                                                                                                                              setTimeout(function() {
                                                                                                                                                                                                                                                                                                                                                                    window.location.href =
                                                                                                                                                                                                                                                                                                                                                                            "payment.html?tracking=" +
                                                                                                                                                                                                                                                                                                                                                                                    encodeURIComponent(tracking);
                                                                                                                                                                                                                                                                                                                                                                                        }, 1000);

                                                                                                                                                                                                                                                                                                                                                                                          } catch (error) {

                                                                                                                                                                                                                                                                                                                                                                                              console.error(error);

                                                                                                                                                                                                                                                                                                                                                                                                  message.textContent =
                                                                                                                                                                                                                                                                                                                                                                                                        "Acceptance failed: " + error.message;

                                                                                                                                                                                                                                                                                                                                                                                                            message.style.color = "red";

                                                                                                                                                                                                                                                                                                                                                                                                                button.disabled = false;
                                                                                                                                                                                                                                                                                                                                                                                                                    button.textContent = "Accept Quote";
                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                      button.addEventListener("click", acceptQuote);

                                                                                                                                                                                                                                                                                                                                                                                                                      </script>

                                                                                                                                                                                                                                                                                                                                                                                                                      </body>
                                                                                                                                                                                                                                                                                                                                                                                                                      </html>
