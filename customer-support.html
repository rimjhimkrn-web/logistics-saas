<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <title>KRIM Logistics Support</title>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
          <script src="config.js"></script>

            <style>
                body {
                      font-family: Arial, sans-serif;
                            margin: 0;
                                  padding: 20px;
                                        background: #f5f5f5;
                                            }

                                                .box {
                                                      max-width: 600px;
                                                            margin: auto;
                                                                  background: white;
                                                                        padding: 20px;
                                                                              border-radius: 10px;
                                                                                  }

                                                                                      input, select, textarea, button {
                                                                                            width: 100%;
                                                                                                  box-sizing: border-box;
                                                                                                        padding: 12px;
                                                                                                              margin: 7px 0 15px;
                                                                                                                    font-size: 15px;
                                                                                                                        }

                                                                                                                            textarea {
                                                                                                                                  height: 120px;
                                                                                                                                      }

                                                                                                                                          button {
                                                                                                                                                background: #111;
                                                                                                                                                      color: white;
                                                                                                                                                            border: none;
                                                                                                                                                                  border-radius: 6px;
                                                                                                                                                                      }

                                                                                                                                                                          .ticket {
                                                                                                                                                                                background: #f1f1f1;
                                                                                                                                                                                      padding: 12px;
                                                                                                                                                                                            margin-top: 10px;
                                                                                                                                                                                                  border-radius: 7px;
                                                                                                                                                                                                      }

                                                                                                                                                                                                          #message {
                                                                                                                                                                                                                font-weight: bold;
                                                                                                                                                                                                                      margin-bottom: 15px;
                                                                                                                                                                                                                          }
                                                                                                                                                                                                                            </style>
                                                                                                                                                                                                                            </head>

                                                                                                                                                                                                                            <body>

                                                                                                                                                                                                                            <div class="box">

                                                                                                                                                                                                                              <h2>KRIM Logistics Support</h2>

                                                                                                                                                                                                                                <div id="message"></div>

                                                                                                                                                                                                                                  <form id="form">

                                                                                                                                                                                                                                      <label>Tracking Number</label>
                                                                                                                                                                                                                                          <input
                                                                                                                                                                                                                                                id="tracking"
                                                                                                                                                                                                                                                      placeholder="Example: TRK-000011"
                                                                                                                                                                                                                                                          >

                                                                                                                                                                                                                                                              <label>Issue</label>
                                                                                                                                                                                                                                                                  <select id="category">
                                                                                                                                                                                                                                                                        <option value="general">General</option>
                                                                                                                                                                                                                                                                              <option value="shipment">Shipment</option>
                                                                                                                                                                                                                                                                                    <option value="payment">Payment</option>
                                                                                                                                                                                                                                                                                          <option value="delivery">Delivery</option>
                                                                                                                                                                                                                                                                                                <option value="partner">Partner</option>
                                                                                                                                                                                                                                                                                                      <option value="technical">Technical</option>
                                                                                                                                                                                                                                                                                                            <option value="other">Other</option>
                                                                                                                                                                                                                                                                                                                </select>

                                                                                                                                                                                                                                                                                                                    <label>Subject</label>
                                                                                                                                                                                                                                                                                                                        <input
                                                                                                                                                                                                                                                                                                                              id="subject"
                                                                                                                                                                                                                                                                                                                                    placeholder="Enter subject"
                                                                                                                                                                                                                                                                                                                                          required
                                                                                                                                                                                                                                                                                                                                              >

                                                                                                                                                                                                                                                                                                                                                  <label>Message</label>
                                                                                                                                                                                                                                                                                                                                                      <textarea
                                                                                                                                                                                                                                                                                                                                                            id="text"
                                                                                                                                                                                                                                                                                                                                                                  placeholder="Describe your problem"
                                                                                                                                                                                                                                                                                                                                                                        required
                                                                                                                                                                                                                                                                                                                                                                            ></textarea>

                                                                                                                                                                                                                                                                                                                                                                                <button type="submit">
                                                                                                                                                                                                                                                                                                                                                                                      Submit Ticket
                                                                                                                                                                                                                                                                                                                                                                                          </button>

                                                                                                                                                                                                                                                                                                                                                                                            </form>

                                                                                                                                                                                                                                                                                                                                                                                              <hr>

                                                                                                                                                                                                                                                                                                                                                                                                <h3>My Tickets</h3>

                                                                                                                                                                                                                                                                                                                                                                                                  <button onclick="loadTickets()">
                                                                                                                                                                                                                                                                                                                                                                                                      Refresh
                                                                                                                                                                                                                                                                                                                                                                                                        </button>

                                                                                                                                                                                                                                                                                                                                                                                                          <div id="tickets">
                                                                                                                                                                                                                                                                                                                                                                                                              Loading...
                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                <script>

                                                                                                                                                                                                                                                                                                                                                                                                                const db = supabase.createClient(
                                                                                                                                                                                                                                                                                                                                                                                                                  SUPABASE_URL,
                                                                                                                                                                                                                                                                                                                                                                                                                    SUPABASE_PUBLISHABLE_KEY
                                                                                                                                                                                                                                                                                                                                                                                                                    );


                                                                                                                                                                                                                                                                                                                                                                                                                    let userId = null;


                                                                                                                                                                                                                                                                                                                                                                                                                    async function start() {

                                                                                                                                                                                                                                                                                                                                                                                                                      const result = await db.auth.getUser();

                                                                                                                                                                                                                                                                                                                                                                                                                        if (!result.data.user) {

                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById("message").innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                  "Please login first.";

                                                                                                                                                                                                                                                                                                                                                                                                                                      document.getElementById("form").style.display =
                                                                                                                                                                                                                                                                                                                                                                                                                                            "none";

                                                                                                                                                                                                                                                                                                                                                                                                                                                return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                    userId = result.data.user.id;

                                                                                                                                                                                                                                                                                                                                                                                                                                                      loadTickets();
                                                                                                                                                                                                                                                                                                                                                                                                                                                      }


                                                                                                                                                                                                                                                                                                                                                                                                                                                      document.getElementById("form").onsubmit =
                                                                                                                                                                                                                                                                                                                                                                                                                                                      async function(e) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                        e.preventDefault();

                                                                                                                                                                                                                                                                                                                                                                                                                                                          const { error } = await db
                                                                                                                                                                                                                                                                                                                                                                                                                                                              .from("support_tickets")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  .insert({

                                                                                                                                                                                                                                                                                                                                                                                                                                                                        user_id: userId,

                                                                                                                                                                                                                                                                                                                                                                                                                                                                              tracking_number:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      document.getElementById("tracking").value || null,

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            category:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById("category").value,

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          subject:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  document.getElementById("subject").value,

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        message:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById("text").value

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    });


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if (error) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          document.getElementById("message").innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "Error: " + error.message;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("message").innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            "Ticket submitted successfully.";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.getElementById("form").reset();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                loadTickets();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                };


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                async function loadTickets() {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if (!userId) return;


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const box =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("tickets");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          box.innerHTML = "Loading...";


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const { data, error } = await db
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                .from("support_tickets")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .select("*")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        .eq("user_id", userId)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .order("id", { ascending: false });


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if (error) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  box.innerHTML =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        "Error: " + error.message;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!data || data.length === 0) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    box.innerHTML =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          "No tickets yet.";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  box.innerHTML = "";


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    data.forEach(ticket => {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        box.innerHTML += `

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="ticket">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <b>Ticket #${ticket.id}</b>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <b>Subject:</b>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  ${ticket.subject}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <b>Category:</b>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      ${ticket.category}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <b>Status:</b>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          ${ticket.status}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ${ticket.message}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      `;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        start();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
