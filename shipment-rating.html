<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>KRIM Logistics - Rating</title>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
          <script src="config.js"></script>

            <style>
                body {
                      font-family: Arial, sans-serif;
                            background: #f4f6f8;
                                  padding: 20px;
                                      }

                                          .box {
                                                max-width: 500px;
                                                      margin: auto;
                                                            background: white;
                                                                  padding: 20px;
                                                                        border-radius: 10px;
                                                                            }

                                                                                input, textarea, button {
                                                                                      width: 100%;
                                                                                            box-sizing: border-box;
                                                                                                  padding: 12px;
                                                                                                        margin-top: 10px;
                                                                                                              border-radius: 6px;
                                                                                                                    border: 1px solid #ccc;
                                                                                                                        }

                                                                                                                            textarea {
                                                                                                                                  height: 100px;
                                                                                                                                      }

                                                                                                                                          button {
                                                                                                                                                background: #2563eb;
                                                                                                                                                      color: white;
                                                                                                                                                            border: none;
                                                                                                                                                                  font-weight: bold;
                                                                                                                                                                      }

                                                                                                                                                                          .stars {
                                                                                                                                                                                font-size: 35px;
                                                                                                                                                                                      margin-top: 10px;
                                                                                                                                                                                          }

                                                                                                                                                                                              .star {
                                                                                                                                                                                                    cursor: pointer;
                                                                                                                                                                                                          color: #ccc;
                                                                                                                                                                                                              }

                                                                                                                                                                                                                  .selected {
                                                                                                                                                                                                                        color: orange;
                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                #msg {
                                                                                                                                                                                                                                      margin-top: 15px;
                                                                                                                                                                                                                                            font-weight: bold;
                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                  </style>
                                                                                                                                                                                                                                                  </head>

                                                                                                                                                                                                                                                  <body>

                                                                                                                                                                                                                                                  <div class="box">

                                                                                                                                                                                                                                                    <h2>KRIM Logistics</h2>
                                                                                                                                                                                                                                                      <h3>Rate Your Shipment</h3>

                                                                                                                                                                                                                                                        <input
                                                                                                                                                                                                                                                            id="tracking"
                                                                                                                                                                                                                                                                placeholder="Tracking Number (example: TRK-000011)"
                                                                                                                                                                                                                                                                  >

                                                                                                                                                                                                                                                                    <p><b>Rating</b></p>

                                                                                                                                                                                                                                                                      <div class="stars">
                                                                                                                                                                                                                                                                          <span class="star" onclick="rate(1)">★</span>
                                                                                                                                                                                                                                                                              <span class="star" onclick="rate(2)">★</span>
                                                                                                                                                                                                                                                                                  <span class="star" onclick="rate(3)">★</span>
                                                                                                                                                                                                                                                                                      <span class="star" onclick="rate(4)">★</span>
                                                                                                                                                                                                                                                                                          <span class="star" onclick="rate(5)">★</span>
                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                              <textarea
                                                                                                                                                                                                                                                                                                  id="feedback"
                                                                                                                                                                                                                                                                                                      placeholder="Write your feedback (optional)"
                                                                                                                                                                                                                                                                                                        ></textarea>

                                                                                                                                                                                                                                                                                                          <button onclick="submitRating()">
                                                                                                                                                                                                                                                                                                              Submit Rating
                                                                                                                                                                                                                                                                                                                </button>

                                                                                                                                                                                                                                                                                                                  <div id="msg"></div>

                                                                                                                                                                                                                                                                                                                  </div>

                                                                                                                                                                                                                                                                                                                  <script>

                                                                                                                                                                                                                                                                                                                  const db = supabase.createClient(
                                                                                                                                                                                                                                                                                                                    SUPABASE_URL,
                                                                                                                                                                                                                                                                                                                      SUPABASE_PUBLISHABLE_KEY
                                                                                                                                                                                                                                                                                                                      );

                                                                                                                                                                                                                                                                                                                      let selectedRating = 0;


                                                                                                                                                                                                                                                                                                                      function rate(number) {

                                                                                                                                                                                                                                                                                                                        selectedRating = number;

                                                                                                                                                                                                                                                                                                                          const stars = document.querySelectorAll(".star");

                                                                                                                                                                                                                                                                                                                            stars.forEach((star, index) => {

                                                                                                                                                                                                                                                                                                                                if (index < number) {
                                                                                                                                                                                                                                                                                                                                      star.classList.add("selected");
                                                                                                                                                                                                                                                                                                                                          } else {
                                                                                                                                                                                                                                                                                                                                                star.classList.remove("selected");
                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                      });
                                                                                                                                                                                                                                                                                                                                                      }


                                                                                                                                                                                                                                                                                                                                                      async function submitRating() {

                                                                                                                                                                                                                                                                                                                                                        const tracking =
                                                                                                                                                                                                                                                                                                                                                            document.getElementById("tracking").value.trim();

                                                                                                                                                                                                                                                                                                                                                              const feedback =
                                                                                                                                                                                                                                                                                                                                                                  document.getElementById("feedback").value.trim();

                                                                                                                                                                                                                                                                                                                                                                    const msg =
                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("msg");


                                                                                                                                                                                                                                                                                                                                                                          if (!tracking) {
                                                                                                                                                                                                                                                                                                                                                                              msg.textContent = "Please enter tracking number.";
                                                                                                                                                                                                                                                                                                                                                                                  return;
                                                                                                                                                                                                                                                                                                                                                                                    }


                                                                                                                                                                                                                                                                                                                                                                                      if (selectedRating === 0) {
                                                                                                                                                                                                                                                                                                                                                                                          msg.textContent = "Please select a rating.";
                                                                                                                                                                                                                                                                                                                                                                                              return;
                                                                                                                                                                                                                                                                                                                                                                                                }


                                                                                                                                                                                                                                                                                                                                                                                                  const { data: userData } =
                                                                                                                                                                                                                                                                                                                                                                                                      await db.auth.getUser();


                                                                                                                                                                                                                                                                                                                                                                                                        if (!userData.user) {
                                                                                                                                                                                                                                                                                                                                                                                                            msg.textContent = "Please login first.";
                                                                                                                                                                                                                                                                                                                                                                                                                return;
                                                                                                                                                                                                                                                                                                                                                                                                                  }


                                                                                                                                                                                                                                                                                                                                                                                                                    const { data: shipment, error: shipmentError } =
                                                                                                                                                                                                                                                                                                                                                                                                                        await db
                                                                                                                                                                                                                                                                                                                                                                                                                              .from("shipment_requests")
                                                                                                                                                                                                                                                                                                                                                                                                                                    .select("id")
                                                                                                                                                                                                                                                                                                                                                                                                                                          .eq("tracking_number", tracking)
                                                                                                                                                                                                                                                                                                                                                                                                                                                .eq("customer_id", userData.user.id)
                                                                                                                                                                                                                                                                                                                                                                                                                                                      .single();


                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (shipmentError || !shipment) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                            msg.textContent = "Shipment not found.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const { error } =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        await db
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              .from("shipment_ratings")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .insert({
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            shipment_id: shipment.id,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    customer_id: userData.user.id,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            rating: selectedRating,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    feedback: feedback
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          });


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (error) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (error.code === "23505") {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      msg.textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              "You already rated this shipment.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        msg.textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "Error: " + error.message;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            msg.textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "Thank you! Rating submitted successfully.";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </html>
