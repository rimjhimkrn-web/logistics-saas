<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <title>KRIM Logistics - Partner Payout</title>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
          <script src="config.js"></script>

            <style>
                body {
                      margin: 0;
                            font-family: Arial, sans-serif;
                                  background: #f4f7fb;
                                        color: #111827;
                                            }

                                                header {
                                                      background: #111827;
                                                            color: white;
                                                                  padding: 22px;
                                                                        text-align: center;
                                                                            }

                                                                                header h1 {
                                                                                      margin: 0;
                                                                                            font-size: 24px;
                                                                                                }

                                                                                                    header p {
                                                                                                          margin: 6px 0 0;
                                                                                                                color: #d1d5db;
                                                                                                                    }

                                                                                                                        .container {
                                                                                                                              max-width: 700px;
                                                                                                                                    margin: 30px auto;
                                                                                                                                          padding: 15px;
                                                                                                                                              }

                                                                                                                                                  .card {
                                                                                                                                                        background: white;
                                                                                                                                                              padding: 25px;
                                                                                                                                                                    border-radius: 12px;
                                                                                                                                                                          box-shadow: 0 3px 15px rgba(0,0,0,0.08);
                                                                                                                                                                              }

                                                                                                                                                                                  h2 {
                                                                                                                                                                                        margin-top: 0;
                                                                                                                                                                                            }

                                                                                                                                                                                                label {
                                                                                                                                                                                                      display: block;
                                                                                                                                                                                                            margin-top: 18px;
                                                                                                                                                                                                                  margin-bottom: 6px;
                                                                                                                                                                                                                        font-weight: bold;
                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                input,
                                                                                                                                                                                                                                    select {
                                                                                                                                                                                                                                          width: 100%;
                                                                                                                                                                                                                                                box-sizing: border-box;
                                                                                                                                                                                                                                                      padding: 12px;
                                                                                                                                                                                                                                                            border: 1px solid #d1d5db;
                                                                                                                                                                                                                                                                  border-radius: 8px;
                                                                                                                                                                                                                                                                        font-size: 16px;
                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                button {
                                                                                                                                                                                                                                                                                      width: 100%;
                                                                                                                                                                                                                                                                                            margin-top: 22px;
                                                                                                                                                                                                                                                                                                  padding: 13px;
                                                                                                                                                                                                                                                                                                        border: none;
                                                                                                                                                                                                                                                                                                              border-radius: 8px;
                                                                                                                                                                                                                                                                                                                    background: #2563eb;
                                                                                                                                                                                                                                                                                                                          color: white;
                                                                                                                                                                                                                                                                                                                                font-size: 16px;
                                                                                                                                                                                                                                                                                                                                      font-weight: bold;
                                                                                                                                                                                                                                                                                                                                            cursor: pointer;
                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                    button:disabled {
                                                                                                                                                                                                                                                                                                                                                          background: #9ca3af;
                                                                                                                                                                                                                                                                                                                                                                cursor: not-allowed;
                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                        #message {
                                                                                                                                                                                                                                                                                                                                                                              margin-top: 18px;
                                                                                                                                                                                                                                                                                                                                                                                    padding: 12px;
                                                                                                                                                                                                                                                                                                                                                                                          border-radius: 8px;
                                                                                                                                                                                                                                                                                                                                                                                                display: none;
                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                        .success {
                                                                                                                                                                                                                                                                                                                                                                                                              display: block !important;
                                                                                                                                                                                                                                                                                                                                                                                                                    background: #dcfce7;
                                                                                                                                                                                                                                                                                                                                                                                                                          color: #166534;
                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                  .error {
                                                                                                                                                                                                                                                                                                                                                                                                                                        display: block !important;
                                                                                                                                                                                                                                                                                                                                                                                                                                              background: #fee2e2;
                                                                                                                                                                                                                                                                                                                                                                                                                                                    color: #991b1b;
                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                            .back {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  display: block;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        margin-top: 20px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              text-align: center;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    color: #2563eb;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          text-decoration: none;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </head>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <header>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <h1>KRIM Logistics</h1>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <p>Partner Payout Management</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </header>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="container">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="card">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <h2>Complete Partner Payout</h2>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <label>Payout ID</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <input
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        id="payoutId"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              type="number"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    value="1"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          placeholder="Example: 1"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              >

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <label>Transaction ID</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <input
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            id="transactionId"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  type="text"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        placeholder="Example: PAYOUT-001"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            >

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <label>Payment Method</label>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <select id="method">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <option value="bank_transfer">Bank Transfer</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <option value="upi">UPI</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <option value="cash">Cash</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <option value="other">Other</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </select>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button id="payButton" onclick="completePayout()">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          Mark Payout as Paid
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div id="message"></div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <a class="back" href="admin-control-center.html">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ← Back to Admin Control Center
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </a>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  async function completePayout() {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const button = document.getElementById("payButton");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const message = document.getElementById("message");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const payoutId =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            Number(document.getElementById("payoutId").value);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const transactionId =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  document.getElementById("transactionId").value.trim();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const method =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("method").value;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          message.className = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            message.style.display = "none";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if (!payoutId) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  message.textContent = "Please enter Payout ID.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      message.className = "error";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if (!transactionId) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  message.textContent = "Please enter Transaction ID.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      message.className = "error";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              button.disabled = true;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                button.textContent = "Processing...";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  try {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      /*
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            Create Supabase client ONLY here.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  This avoids the previous db initialization error.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      */

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const client =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                window.supabase.createClient(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        SUPABASE_URL,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                SUPABASE_ANON_KEY
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const sessionResult =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                await client.auth.getSession();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (sessionResult.error) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          throw new Error(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  sessionResult.error.message
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        );
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!sessionResult.data.session) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      throw new Error(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              "Admin session not found. Please login again."
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    );
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const result =
