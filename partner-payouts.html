<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

      <title>KRIM Partner Payouts</title>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
          <script src="config.js"></script>

            <style>
                body {
                      font-family: Arial;
                            padding: 20px;
                                  background: #f5f5f5;
                                      }

                                          .box {
                                                max-width: 900px;
                                                      margin: auto;
                                                            background: white;
                                                                  padding: 20px;
                                                                      }

                                                                          input, select {
                                                                                width: 100%;
                                                                                      padding: 10px;
                                                                                            margin: 5px 0 10px;
                                                                                                }

                                                                                                    button {
                                                                                                          padding: 10px 15px;
                                                                                                                margin: 5px;
                                                                                                                      cursor: pointer;
                                                                                                                          }

                                                                                                                              table {
                                                                                                                                    width: 100%;
                                                                                                                                          margin-top: 20px;
                                                                                                                                                border-collapse: collapse;
                                                                                                                                                    }

                                                                                                                                                        th, td {
                                                                                                                                                              border: 1px solid #ddd;
                                                                                                                                                                    padding: 8px;
                                                                                                                                                                        }

                                                                                                                                                                            th {
                                                                                                                                                                                  background: #eee;
                                                                                                                                                                                      }

                                                                                                                                                                                          .paid {
                                                                                                                                                                                                color: green;
                                                                                                                                                                                                      font-weight: bold;
                                                                                                                                                                                                          }
                                                                                                                                                                                                            </style>
                                                                                                                                                                                                            </head>

                                                                                                                                                                                                            <body>

                                                                                                                                                                                                            <div class="box">

                                                                                                                                                                                                              <h1>KRIM Logistics</h1>

                                                                                                                                                                                                                <h2>Partner Payouts</h2>

                                                                                                                                                                                                                  <p id="message">Loading...</p>

                                                                                                                                                                                                                    <hr>

                                                                                                                                                                                                                      <h3>Create Payout</h3>

                                                                                                                                                                                                                        <input id="shipment" type="number" placeholder="Shipment ID">

                                                                                                                                                                                                                          <input id="partner" type="number" placeholder="Partner ID">

                                                                                                                                                                                                                            <input id="amount" type="number" placeholder="Payout Amount">

                                                                                                                                                                                                                              <select id="method">
                                                                                                                                                                                                                                  <option value="bank_transfer">Bank Transfer</option>
                                                                                                                                                                                                                                      <option value="upi">UPI</option>
                                                                                                                                                                                                                                          <option value="cash">Cash</option>
                                                                                                                                                                                                                                            </select>

                                                                                                                                                                                                                                              <button onclick="createPayout()">
                                                                                                                                                                                                                                                  Create Payout
                                                                                                                                                                                                                                                    </button>

                                                                                                                                                                                                                                                      <button onclick="load()">
                                                                                                                                                                                                                                                          Refresh
                                                                                                                                                                                                                                                            </button>

                                                                                                                                                                                                                                                              <hr>

                                                                                                                                                                                                                                                                <h3>Payout Records</h3>

                                                                                                                                                                                                                                                                  <table>

                                                                                                                                                                                                                                                                      <thead>
                                                                                                                                                                                                                                                                            <tr>
                                                                                                                                                                                                                                                                                    <th>ID</th>
                                                                                                                                                                                                                                                                                            <th>Shipment</th>
                                                                                                                                                                                                                                                                                                    <th>Partner</th>
                                                                                                                                                                                                                                                                                                            <th>Amount</th>
                                                                                                                                                                                                                                                                                                                    <th>Status</th>
                                                                                                                                                                                                                                                                                                                            <th>Action</th>
                                                                                                                                                                                                                                                                                                                                  </tr>
                                                                                                                                                                                                                                                                                                                                      </thead>

                                                                                                                                                                                                                                                                                                                                          <tbody id="list"></tbody>

                                                                                                                                                                                                                                                                                                                                            </table>

                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                            <script>

                                                                                                                                                                                                                                                                                                                                            const db = supabase.createClient(
                                                                                                                                                                                                                                                                                                                                              SUPABASE_URL,
                                                                                                                                                                                                                                                                                                                                                SUPABASE_ANON_KEY
                                                                                                                                                                                                                                                                                                                                                );


                                                                                                                                                                                                                                                                                                                                                async function load() {

                                                                                                                                                                                                                                                                                                                                                  document.getElementById("message").innerText =
                                                                                                                                                                                                                                                                                                                                                      "Loading...";

                                                                                                                                                                                                                                                                                                                                                        const { data, error } = await db
                                                                                                                                                                                                                                                                                                                                                            .from("partner_payouts")
                                                                                                                                                                                                                                                                                                                                                                .select("*")
                                                                                                                                                                                                                                                                                                                                                                    .order("id", { ascending: false });

                                                                                                                                                                                                                                                                                                                                                                      if (error) {

                                                                                                                                                                                                                                                                                                                                                                          document.getElementById("message").innerText =
                                                                                                                                                                                                                                                                                                                                                                                "Error: " + error.message;

                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                        const list = document.getElementById("list");

                                                                                                                                                                                                                                                                                                                                                                                          list.innerHTML = "";

                                                                                                                                                                                                                                                                                                                                                                                            data.forEach(function(row) {

                                                                                                                                                                                                                                                                                                                                                                                                list.innerHTML += `
                                                                                                                                                                                                                                                                                                                                                                                                      <tr>

                                                                                                                                                                                                                                                                                                                                                                                                              <td>${row.id}</td>

                                                                                                                                                                                                                                                                                                                                                                                                                      <td>${row.shipment_id}</td>

                                                                                                                                                                                                                                                                                                                                                                                                                              <td>${row.partner_id}</td>

                                                                                                                                                                                                                                                                                                                                                                                                                                      <td>₹${row.payout_amount}</td>

                                                                                                                                                                                                                                                                                                                                                                                                                                              <td>
                                                                                                                                                                                                                                                                                                                                                                                                                                                        ${row.status}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                </td>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <td>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  ${
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              row.status === "paid"

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          ? "<span class='paid'>PAID</span>"

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      : `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button onclick="paid(${row.id})">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    Mark Paid
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </td>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </tr>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          `;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.getElementById("message").innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  "Payouts loaded.";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  async function createPayout() {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const shipment =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("shipment").value;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const partner =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.getElementById("partner").value;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const amount =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById("amount").value;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const method =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          document.getElementById("method").value;


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (!shipment || !partner || !amount) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                alert("Please fill all fields.");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const { error } = await db
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .from("partner_payouts")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                .insert({

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      shipment_id: shipment,

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            partner_id: partner,

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  payout_amount: amount,

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        status: "pending",

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              payout_method: method

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  });


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (error) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        alert("Error: " + error.message);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                alert("Payout created.");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  document.getElementById("shipment").value = "";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById("partner").value = "";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      document.getElementById("amount").value = "";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        load();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        async function paid(id) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const transaction =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              prompt("Transaction ID:");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!transaction) return;


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const { error } = await db
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      .from("partner_payouts")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          .update({

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                status: "paid",

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      transaction_id: transaction,

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            paid_at: new Date().toISOString()

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                })
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .eq("id", id);


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if (error) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          alert("Error: " + error.message);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  alert("Payout marked as paid.");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    load();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    load();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
