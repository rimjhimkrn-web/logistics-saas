<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <title>KRIM Logistics - Partner Payout</title>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
          <script src="config.js"></script>

            <style>
                * {
                      box-sizing: border-box;
                          }

                              body {
                                    margin: 0;
                                          font-family: Arial, sans-serif;
                                                background: #f4f7fb;
                                                      color: #172033;
                                                          }

                                                              header {
                                                                    background: #111827;
                                                                          color: white;
                                                                                padding: 18px 20px;
                                                                                      text-align: center;
                                                                                          }

                                                                                              header h1 {
                                                                                                    margin: 0;
                                                                                                          font-size: 22px;
                                                                                                              }

                                                                                                                  header p {
                                                                                                                        margin: 5px 0 0;
                                                                                                                              color: #cbd5e1;
                                                                                                                                    font-size: 13px;
                                                                                                                                        }

                                                                                                                                            .container {
                                                                                                                                                  max-width: 700px;
                                                                                                                                                        margin: 25px auto;
                                                                                                                                                              padding: 15px;
                                                                                                                                                                  }

                                                                                                                                                                      .card {
                                                                                                                                                                            background: white;
                                                                                                                                                                                  padding: 22px;
                                                                                                                                                                                        border-radius: 12px;
                                                                                                                                                                                              box-shadow: 0 2px 10px rgba(0,0,0,.06);
                                                                                                                                                                                                  }

                                                                                                                                                                                                      h2 {
                                                                                                                                                                                                            margin-top: 0;
                                                                                                                                                                                                                }

                                                                                                                                                                                                                    label {
                                                                                                                                                                                                                          display: block;
                                                                                                                                                                                                                                margin-top: 16px;
                                                                                                                                                                                                                                      margin-bottom: 6px;
                                                                                                                                                                                                                                            font-weight: 600;
                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                    input,
                                                                                                                                                                                                                                                        select {
                                                                                                                                                                                                                                                              width: 100%;
                                                                                                                                                                                                                                                                    padding: 11px;
                                                                                                                                                                                                                                                                          border: 1px solid #d1d5db;
                                                                                                                                                                                                                                                                                border-radius: 8px;
                                                                                                                                                                                                                                                                                      font-size: 15px;
                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                              button {
                                                                                                                                                                                                                                                                                                    width: 100%;
                                                                                                                                                                                                                                                                                                          margin-top: 20px;
                                                                                                                                                                                                                                                                                                                padding: 12px;
                                                                                                                                                                                                                                                                                                                      border: 0;
                                                                                                                                                                                                                                                                                                                            border-radius: 8px;
                                                                                                                                                                                                                                                                                                                                  background: #2563eb;
                                                                                                                                                                                                                                                                                                                                        color: white;
                                                                                                                                                                                                                                                                                                                                              font-size: 15px;
                                                                                                                                                                                                                                                                                                                                                    font-weight: 600;
                                                                                                                                                                                                                                                                                                                                                          cursor: pointer;
                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                  button:disabled {
                                                                                                                                                                                                                                                                                                                                                                        opacity: .6;
                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                #message {
                                                                                                                                                                                                                                                                                                                                                                                      margin-top: 15px;
                                                                                                                                                                                                                                                                                                                                                                                            padding: 11px;
                                                                                                                                                                                                                                                                                                                                                                                                  border-radius: 8px;
                                                                                                                                                                                                                                                                                                                                                                                                        display: none;
                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                .success {
                                                                                                                                                                                                                                                                                                                                                                                                                      display: block !important;
                                                                                                                                                                                                                                                                                                                                                                                                                            background: #dcfce7;
                                                                                                                                                                                                                                                                                                                                                                                                                                  color: #166534;
                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                          .error {
                                                                                                                                                                                                                                                                                                                                                                                                                                                display: block !important;
                                                                                                                                                                                                                                                                                                                                                                                                                                                      background: #fee2e2;
                                                                                                                                                                                                                                                                                                                                                                                                                                                            color: #991b1b;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .back {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          display: block;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                margin-top: 18px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      text-align: center;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            color: #2563eb;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  text-decoration: none;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </head>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <header>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <h1>KRIM Logistics</h1>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <p>Partner Payout Management</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </header>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="container">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="card">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <h2>Complete Partner Payout</h2>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <label>Payout ID</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <input
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                id="payoutId"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      type="number"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            value="1"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                >

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <label>Transaction ID</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <input
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              id="transactionId"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    type="text"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          placeholder="Example: TEST-PAYOUT-002"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              >

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <label>Payment Method</label>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <select id="method">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <option value="bank_transfer">Bank Transfer</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <option value="upi">UPI</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <option value="cash">Cash</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <option value="other">Other</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </select>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <button id="payButton" onclick="completePayout()">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            Mark Payout as Paid
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div id="message"></div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <a class="back" href="admin-control-center.html">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              ← Back to Admin Control Center
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </a>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    async function completePayout() {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const button = document.getElementById("payButton");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const message = document.getElementById("message");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const payoutId =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              Number(document.getElementById("payoutId").value);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const transactionId =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById("transactionId").value.trim();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const method =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          document.getElementById("method").value;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            message.className = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              message.style.display = "none";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!payoutId) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    message.textContent = "Please enter Payout ID.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        message.className = "error";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!transactionId) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    message.textContent = "Please enter Transaction ID.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        message.className = "error";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                button.disabled = true;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  button.textContent = "Processing...";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    try {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        /* IMPORTANT:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               config.js already creates supabaseClient.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      We use that existing client.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          */

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if (typeof supabaseClient === "undefined") {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    throw new Error(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            "Supabase client not found. Please check config.js."
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  );
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                data: sessionData,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      error: sessionError
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          } = await supabaseClient.auth.getSession();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if (sessionError) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    throw new Error(sessionError.message);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (!sessionData.session) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  throw new Error(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          "Admin session not found. Please login again."
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                );
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const {
