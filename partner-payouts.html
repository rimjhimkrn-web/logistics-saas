<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <title>Partner Payouts | KRIM Logistics</title>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
          <script src="config.js"></script>

            <style>
                body {
                      font-family: Arial, sans-serif;
                            background: #f5f8fc;
                                  margin: 0;
                                        padding: 20px;
                                            }

                                                .box {
                                                      max-width: 600px;
                                                            margin: 30px auto;
                                                                  background: white;
                                                                        padding: 25px;
                                                                              border-radius: 12px;
                                                                                    box-shadow: 0 3px 12px rgba(0,0,0,.08);
                                                                                        }

                                                                                            h1 {
                                                                                                  color: #0b5ed7;
                                                                                                      }

                                                                                                          input, select {
                                                                                                                width: 100%;
                                                                                                                      padding: 12px;
                                                                                                                            margin: 8px 0 15px;
                                                                                                                                  box-sizing: border-box;
                                                                                                                                        border: 1px solid #ccc;
                                                                                                                                              border-radius: 7px;
                                                                                                                                                  }

                                                                                                                                                      button {
                                                                                                                                                            width: 100%;
                                                                                                                                                                  padding: 13px;
                                                                                                                                                                        border: none;
                                                                                                                                                                              border-radius: 7px;
                                                                                                                                                                                    background: #0b5ed7;
                                                                                                                                                                                          color: white;
                                                                                                                                                                                                font-weight: bold;
                                                                                                                                                                                                      font-size: 15px;
                                                                                                                                                                                                          }

                                                                                                                                                                                                              #message {
                                                                                                                                                                                                                    margin-top: 15px;
                                                                                                                                                                                                                          padding: 12px;
                                                                                                                                                                                                                                border-radius: 7px;
                                                                                                                                                                                                                                      display: none;
                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                              .success {
                                                                                                                                                                                                                                                    background: #dcfce7;
                                                                                                                                                                                                                                                          color: #166534;
                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                  .error {
                                                                                                                                                                                                                                                                        background: #fee2e2;
                                                                                                                                                                                                                                                                              color: #991b1b;
                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                      .info {
                                                                                                                                                                                                                                                                                            background: #e0f2fe;
                                                                                                                                                                                                                                                                                                  color: #075985;
                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                        </style>
                                                                                                                                                                                                                                                                                                        </head>

                                                                                                                                                                                                                                                                                                        <body>

                                                                                                                                                                                                                                                                                                        <div class="box">

                                                                                                                                                                                                                                                                                                          <h1>KRIM Logistics</h1>

                                                                                                                                                                                                                                                                                                            <h2>Partner Payout</h2>

                                                                                                                                                                                                                                                                                                              <p>
                                                                                                                                                                                                                                                                                                                  Complete a pending partner payout.
                                                                                                                                                                                                                                                                                                                    </p>

                                                                                                                                                                                                                                                                                                                      <label>Payout ID</label>

                                                                                                                                                                                                                                                                                                                        <input
                                                                                                                                                                                                                                                                                                                            id="payoutId"
                                                                                                                                                                                                                                                                                                                                type="number"
                                                                                                                                                                                                                                                                                                                                    value="1"
                                                                                                                                                                                                                                                                                                                                      >

                                                                                                                                                                                                                                                                                                                                        <label>Transaction ID</label>

                                                                                                                                                                                                                                                                                                                                          <input
                                                                                                                                                                                                                                                                                                                                              id="transactionId"
                                                                                                                                                                                                                                                                                                                                                  type="text"
                                                                                                                                                                                                                                                                                                                                                      placeholder="Example: TEST-PAYOUT-001"
                                                                                                                                                                                                                                                                                                                                                        >

                                                                                                                                                                                                                                                                                                                                                          <label>Payment Method</label>

                                                                                                                                                                                                                                                                                                                                                            <select id="method">

                                                                                                                                                                                                                                                                                                                                                                <option value="bank_transfer">
                                                                                                                                                                                                                                                                                                                                                                      Bank Transfer
                                                                                                                                                                                                                                                                                                                                                                          </option>

                                                                                                                                                                                                                                                                                                                                                                              <option value="upi">
                                                                                                                                                                                                                                                                                                                                                                                    UPI
                                                                                                                                                                                                                                                                                                                                                                                        </option>

                                                                                                                                                                                                                                                                                                                                                                                            <option value="neft">
                                                                                                                                                                                                                                                                                                                                                                                                  NEFT
                                                                                                                                                                                                                                                                                                                                                                                                      </option>

                                                                                                                                                                                                                                                                                                                                                                                                          <option value="imps">
                                                                                                                                                                                                                                                                                                                                                                                                                IMPS
                                                                                                                                                                                                                                                                                                                                                                                                                    </option>

                                                                                                                                                                                                                                                                                                                                                                                                                      </select>

                                                                                                                                                                                                                                                                                                                                                                                                                        <button onclick="completePayout()">
                                                                                                                                                                                                                                                                                                                                                                                                                            Mark Payout as Paid
                                                                                                                                                                                                                                                                                                                                                                                                                              </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                <div id="message"></div>

                                                                                                                                                                                                                                                                                                                                                                                                                                </div>


                                                                                                                                                                                                                                                                                                                                                                                                                                <script>

                                                                                                                                                                                                                                                                                                                                                                                                                                const db = supabase.createClient(
                                                                                                                                                                                                                                                                                                                                                                                                                                  SUPABASE_URL,
                                                                                                                                                                                                                                                                                                                                                                                                                                    SUPABASE_ANON_KEY
                                                                                                                                                                                                                                                                                                                                                                                                                                    );


                                                                                                                                                                                                                                                                                                                                                                                                                                    function message(text, type) {

                                                                                                                                                                                                                                                                                                                                                                                                                                      const box =
                                                                                                                                                                                                                                                                                                                                                                                                                                          document.getElementById("message");

                                                                                                                                                                                                                                                                                                                                                                                                                                            box.innerText = text;

                                                                                                                                                                                                                                                                                                                                                                                                                                              box.className = type;

                                                                                                                                                                                                                                                                                                                                                                                                                                                box.style.display = "block";
                                                                                                                                                                                                                                                                                                                                                                                                                                                }


                                                                                                                                                                                                                                                                                                                                                                                                                                                async function completePayout() {

                                                                                                                                                                                                                                                                                                                                                                                                                                                  const payoutId =
                                                                                                                                                                                                                                                                                                                                                                                                                                                      document.getElementById("payoutId").value;

                                                                                                                                                                                                                                                                                                                                                                                                                                                        const transactionId =
                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById("transactionId").value.trim();

                                                                                                                                                                                                                                                                                                                                                                                                                                                              const method =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  document.getElementById("method").value;


                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (!payoutId) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                        message(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              "Enter Payout ID.",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    "error"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!transactionId) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    message(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          "Enter Transaction ID.",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "error"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            message(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "Processing payout...",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    "info"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      );


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const result =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            await db.rpc(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  "complete_partner_payout",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                p_payout_id: Number(payoutId),
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        p_transaction_id: transactionId,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                p_payout_method: method
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          );


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (result.error) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                message(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      "Error: " + result.error.message,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            "error"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        message(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            "Payout completed successfully!",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "success"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </html>
