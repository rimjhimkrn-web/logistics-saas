<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <title>Partner Payout Management</title>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

          <style>
              body {
                    font-family: Arial, sans-serif;
                          background: #f5f7fb;
                                margin: 0;
                                      padding: 20px;
                                          }

                                              .box {
                                                    max-width: 500px;
                                                          margin: auto;
                                                                background: white;
                                                                      padding: 25px;
                                                                            border-radius: 12px;
                                                                                  box-shadow: 0 3px 15px rgba(0,0,0,0.08);
                                                                                      }

                                                                                          h1 {
                                                                                                font-size: 22px;
                                                                                                      margin-bottom: 25px;
                                                                                                          }

                                                                                                              label {
                                                                                                                    display: block;
                                                                                                                          margin-top: 15px;
                                                                                                                                margin-bottom: 6px;
                                                                                                                                      font-weight: bold;
                                                                                                                                          }

                                                                                                                                              input, select {
                                                                                                                                                    width: 100%;
                                                                                                                                                          padding: 12px;
                                                                                                                                                                border: 1px solid #ccc;
                                                                                                                                                                      border-radius: 7px;
                                                                                                                                                                            box-sizing: border-box;
                                                                                                                                                                                  font-size: 15px;
                                                                                                                                                                                      }

                                                                                                                                                                                          button {
                                                                                                                                                                                                width: 100%;
                                                                                                                                                                                                      margin-top: 22px;
                                                                                                                                                                                                            padding: 13px;
                                                                                                                                                                                                                  background: #2563eb;
                                                                                                                                                                                                                        color: white;
                                                                                                                                                                                                                              border: none;
                                                                                                                                                                                                                                    border-radius: 7px;
                                                                                                                                                                                                                                          font-size: 16px;
                                                                                                                                                                                                                                                font-weight: bold;
                                                                                                                                                                                                                                                      cursor: pointer;
                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                              button:disabled {
                                                                                                                                                                                                                                                                    opacity: 0.6;
                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                            #message {
                                                                                                                                                                                                                                                                                  margin-top: 15px;
                                                                                                                                                                                                                                                                                        padding: 10px;
                                                                                                                                                                                                                                                                                              border-radius: 7px;
                                                                                                                                                                                                                                                                                                    display: none;
                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                            .success {
                                                                                                                                                                                                                                                                                                                  background: #dcfce7;
                                                                                                                                                                                                                                                                                                                        color: #166534;
                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                .error {
                                                                                                                                                                                                                                                                                                                                      background: #fee2e2;
                                                                                                                                                                                                                                                                                                                                            color: #991b1b;
                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                    .records {
                                                                                                                                                                                                                                                                                                                                                          margin-top: 30px;
                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                  .record {
                                                                                                                                                                                                                                                                                                                                                                        border: 1px solid #ddd;
                                                                                                                                                                                                                                                                                                                                                                              border-radius: 8px;
                                                                                                                                                                                                                                                                                                                                                                                    padding: 12px;
                                                                                                                                                                                                                                                                                                                                                                                          margin-top: 10px;
                                                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                                                </style>
                                                                                                                                                                                                                                                                                                                                                                                                </head>

                                                                                                                                                                                                                                                                                                                                                                                                <body>

                                                                                                                                                                                                                                                                                                                                                                                                <div class="box">

                                                                                                                                                                                                                                                                                                                                                                                                  <h1>Partner Payout Management</h1>

                                                                                                                                                                                                                                                                                                                                                                                                    <label>Enter Tracking Number</label>
                                                                                                                                                                                                                                                                                                                                                                                                      <input
                                                                                                                                                                                                                                                                                                                                                                                                          id="tracking"
                                                                                                                                                                                                                                                                                                                                                                                                              type="text"
                                                                                                                                                                                                                                                                                                                                                                                                                  placeholder="TRK-000014"
                                                                                                                                                                                                                                                                                                                                                                                                                    >

                                                                                                                                                                                                                                                                                                                                                                                                                      <label>Partner Payout Amount</label>
                                                                                                                                                                                                                                                                                                                                                                                                                        <input
                                                                                                                                                                                                                                                                                                                                                                                                                            id="amount"
                                                                                                                                                                                                                                                                                                                                                                                                                                type="number"
                                                                                                                                                                                                                                                                                                                                                                                                                                    placeholder="3000"
                                                                                                                                                                                                                                                                                                                                                                                                                                      >

                                                                                                                                                                                                                                                                                                                                                                                                                                        <label>Partner ID</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                          <input
                                                                                                                                                                                                                                                                                                                                                                                                                                              id="partner"
                                                                                                                                                                                                                                                                                                                                                                                                                                                  type="number"
                                                                                                                                                                                                                                                                                                                                                                                                                                                      placeholder="10"
                                                                                                                                                                                                                                                                                                                                                                                                                                                        >

                                                                                                                                                                                                                                                                                                                                                                                                                                                          <label>Status</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                            <select id="status">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                <option value="pending">Pending</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <option value="paid">Paid</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </select>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button id="save" onclick="savePayout()">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            Save Payout
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div id="message"></div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="records">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <h2>Payout Records</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div id="records">Loading...</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            /* =========================================
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               USE YOUR EXISTING SUPABASE CONFIG HERE
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  ========================================= */

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const SUPABASE_URL =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    "YOUR_SUPABASE_URL";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const SUPABASE_ANON_KEY =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      "YOUR_SUPABASE_ANON_KEY";


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const supabaseClient =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        supabase.createClient(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            SUPABASE_URL,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                SUPABASE_ANON_KEY
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  );


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  /* =========================================
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     MESSAGE
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ========================================= */

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        function message(text, type) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const box =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.getElementById("message");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                box.innerText = text;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  box.className = type;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    box.style.display = "block";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    /* =========================================
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       SAVE PAYOUT
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          ========================================= */

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          async function savePayout() {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const tracking =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById("tracking")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      .value.trim();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const amount =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById("amount")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  .value;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const partner =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("partner")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              .value;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const status =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById("status")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          .value;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const button =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById("save");


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if (!tracking || !amount || !partner) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      message(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            "Please fill all required fields.",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  "error"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              button.disabled = true;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                button.innerText = "Saving...";


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  try {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      /* Find shipment */

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                data: shipment,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      error: shipmentError
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          } = await supabaseClient
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                .from("shipment_requests")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      .select("id, partner_id")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .eq("tracking_number", tracking)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  .single();


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if (shipmentError) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            throw shipmentError;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    /* Insert payout */

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              data,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    error
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        } = await supabaseClient
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              .from("partner_payouts")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .insert({
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            shipment_id: shipment.id,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    partner_id: Number(partner),
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            payout_amount: Number(amount),
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    status: status
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          })
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                .select()
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      .single();


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if (error) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                throw error;
