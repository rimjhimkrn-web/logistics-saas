<!DOCTYPE html>
<html>
<head>
    <title>Track Shipment</title>
    </head>
    <body>

        <h1>Track Your Shipment</h1>

            <label>Tracking Number:</label>
                <input type="text" id="trackingInput" placeholder="TRK-000009">
                    <br><br>
                        <button onclick="trackShipment()">Track</button>

                            <div id="result"></div>

                                <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
                                    </script>
                                        <script>
                                                // ========================================
                                                        // 🔑 REPLACE WITH YOUR SUPABASE CREDENTIALS
                                                                // ========================================
                                                                        const SUPABASE_URL = 'https://ebltviniygljwwseplph.supabase.co';
                                                                                const SUPABASE_ANON_KEY = 'sb_publishable_8xzZUeubYp_nIxVRWEQdiw_2H4RkHAa';
                                                                                        // ========================================

                                                                                                const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

                                                                                                        async function trackShipment() {
                                                                                                                    const input = document.getElementById('trackingInput');
                                                                                                                                const resultDiv = document.getElementById('result');
                                                                                                                                            const trackingNumber = input.value.trim();

                                                                                                                                                        // Check if empty
                                                                                                                                                                    if (trackingNumber === '') {
                                                                                                                                                                                    resultDiv.innerHTML = 'Please enter a tracking number.';
                                                                                                                                                                                                    return;
                                                                                                                                                                                                                }

                                                                                                                                                                                                                            // Show loading
                                                                                                                                                                                                                                        resultDiv.innerHTML = 'Searching...';

                                                                                                                                                                                                                                                    // Query Supabase
                                                                                                                                                                                                                                                                const { data, error } = await supabase
                                                                                                                                                                                                                                                                                .from('shipment_requests')
                                                                                                                                                                                                                                                                                                .select('*')
                                                                                                                                                                                                                                                                                                                .eq('tracking_number', trackingNumber)
                                                                                                                                                                                                                                                                                                                                .single();

                                                                                                                                                                                                                                                                                                                                            if (error) {
                                                                                                                                                                                                                                                                                                                                                            resultDiv.innerHTML = '❌ Shipment not found. Please check the tracking number.';
                                                                                                                                                                                                                                                                                                                                                                            console.log('Error:', error);
                                                                                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                    // Show results
                                                                                                                                                                                                                                                                                                                                                                                                                                resultDiv.innerHTML = `
                                                                                                                                                                                                                                                                                                                                                                                                                                                <h2>Shipment Details</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                <p><strong>Tracking Number:</strong> ${data.tracking_number}</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <p><strong>Status:</strong> ${data.status}</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <p><strong>Pickup:</strong> ${data.pickup_location}</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <p><strong>Delivery:</strong> ${data.delivery_location}</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <p><strong>Material:</strong> ${data.material || data.material_goods}</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <p><strong>Created:</strong> ${data.created_at}</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            `;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // Enter key support
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById('trackingInput').addEventListener('keydown', function(e) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (e.key === 'Enter') {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                trackShipment();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
