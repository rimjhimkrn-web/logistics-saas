<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <title>KRIM Logistics - Admin Login</title>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
          <script src="config.js"></script>

            <style>
                * {
                      box-sizing: border-box;
                          }

                              body {
                                    margin: 0;
                                          min-height: 100vh;
                                                font-family: Arial, sans-serif;
                                                      background: #f4f7fb;
                                                            display: flex;
                                                                  align-items: center;
                                                                        justify-content: center;
                                                                              padding: 20px;
                                                                                  }

                                                                                      .login-box {
                                                                                            width: 100%;
                                                                                                  max-width: 420px;
                                                                                                        background: #fff;
                                                                                                              padding: 30px 24px;
                                                                                                                    border-radius: 18px;
                                                                                                                          box-shadow: 0 8px 30px rgba(0,0,0,0.10);
                                                                                                                              }

                                                                                                                                  .logo {
                                                                                                                                        text-align: center;
                                                                                                                                              font-size: 28px;
                                                                                                                                                    font-weight: bold;
                                                                                                                                                          margin-bottom: 6px;
                                                                                                                                                              }

                                                                                                                                                                  .subtitle {
                                                                                                                                                                        text-align: center;
                                                                                                                                                                              color: #666;
                                                                                                                                                                                    margin-bottom: 25px;
                                                                                                                                                                                        }

                                                                                                                                                                                            label {
                                                                                                                                                                                                  display: block;
                                                                                                                                                                                                        margin-top: 15px;
                                                                                                                                                                                                              margin-bottom: 7px;
                                                                                                                                                                                                                    font-weight: bold;
                                                                                                                                                                                                                        }

                                                                                                                                                                                                                            input {
                                                                                                                                                                                                                                  width: 100%;
                                                                                                                                                                                                                                        padding: 13px;
                                                                                                                                                                                                                                              border: 1px solid #ccc;
                                                                                                                                                                                                                                                    border-radius: 10px;
                                                                                                                                                                                                                                                          font-size: 16px;
                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                  button {
                                                                                                                                                                                                                                                                        width: 100%;
                                                                                                                                                                                                                                                                              margin-top: 22px;
                                                                                                                                                                                                                                                                                    padding: 14px;
                                                                                                                                                                                                                                                                                          border: 0;
                                                                                                                                                                                                                                                                                                border-radius: 10px;
                                                                                                                                                                                                                                                                                                      background: #111827;
                                                                                                                                                                                                                                                                                                            color: white;
                                                                                                                                                                                                                                                                                                                  font-size: 16px;
                                                                                                                                                                                                                                                                                                                        font-weight: bold;
                                                                                                                                                                                                                                                                                                                              cursor: pointer;
                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                      button:disabled {
                                                                                                                                                                                                                                                                                                                                            opacity: 0.6;
                                                                                                                                                                                                                                                                                                                                                  cursor: not-allowed;
                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                          .message {
                                                                                                                                                                                                                                                                                                                                                                margin-top: 15px;
                                                                                                                                                                                                                                                                                                                                                                      padding: 12px;
                                                                                                                                                                                                                                                                                                                                                                            border-radius: 10px;
                                                                                                                                                                                                                                                                                                                                                                                  display: none;
                                                                                                                                                                                                                                                                                                                                                                                        text-align: center;
                                                                                                                                                                                                                                                                                                                                                                                              font-size: 14px;
                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                      .error {
                                                                                                                                                                                                                                                                                                                                                                                                            display: block;
                                                                                                                                                                                                                                                                                                                                                                                                                  background: #fee2e2;
                                                                                                                                                                                                                                                                                                                                                                                                                        color: #991b1b;
                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                .success {
                                                                                                                                                                                                                                                                                                                                                                                                                                      display: block;
                                                                                                                                                                                                                                                                                                                                                                                                                                            background: #dcfce7;
                                                                                                                                                                                                                                                                                                                                                                                                                                                  color: #166534;
                                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                                          .links {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                text-align: center;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      margin-top: 20px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                              .links a {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    display: block;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          margin-top: 10px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                color: #2563eb;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      text-decoration: none;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </head>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="login-box">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="logo">KRIM Logistics</div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="subtitle">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            Admin Control Center
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <form id="loginForm">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <label for="email">Admin Email</label>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <input
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        type="email"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                id="email"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        placeholder="Enter admin email"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                required
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        autocomplete="email"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              >

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <label for="password">Password</label>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <input
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  type="password"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          id="password"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  placeholder="Enter password"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          required
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  autocomplete="current-password"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        >

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <button type="submit" id="loginButton">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      Admin Login
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </form>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div id="message" class="message"></div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="links">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <a href="forgot-password.html">Forgot Password?</a>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <a href="index.html">Back to KRIM Logistics</a>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const form = document.getElementById("loginForm");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const button = document.getElementById("loginButton");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const message = document.getElementById("message");


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          function showMessage(text, type) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            message.textContent = text;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              message.className = "message " + type;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              form.addEventListener("submit", async function(event) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                event.preventDefault();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  button.disabled = true;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    button.textContent = "Checking...";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      message.className = "message";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        message.textContent = "";


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          try {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if (typeof supabaseClient === "undefined") {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    throw new Error(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            "Supabase client not found. Please check config.js."
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const email =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById("email").value.trim();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const password =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          document.getElementById("password").value;


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const { data, error } =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    await supabaseClient.auth.signInWithPassword({

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            email: email,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    password: password

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          });


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if (error) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    throw error;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (!data || !data.user || !data.session) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  throw new Error(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          "Login completed but no active session was found."
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        /*
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              Verify that this authenticated user
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    is actually an administrator.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        */

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const { data: adminRecord, error: adminError } =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  await supabaseClient
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          .from("admin_users")
