<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

      <title>KRIM Logistics - Admin Login</title>

      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

      <script src="config.js"></script>

      <style>

      *{
          box-sizing:border-box;
          }

          body{
              margin:0;
                  font-family:Arial,Helvetica,sans-serif;
                      background:#f4f6f8;
                          min-height:100vh;

                              display:flex;
                                  align-items:center;
                                      justify-content:center;
                                      }

                                      .login-box{
                                          width:92%;
                                              max-width:400px;

                                                  background:white;

                                                      padding:30px 22px;

                                                          border-radius:14px;

                                                              box-shadow:0 5px 20px rgba(0,0,0,0.10);
                                                              }

                                                              .logo{
                                                                  text-align:center;

                                                                      font-size:28px;

                                                                          font-weight:bold;

                                                                              color:#111827;
                                                                              }

                                                                              .subtitle{
                                                                                  text-align:center;

                                                                                      margin-top:7px;

                                                                                          margin-bottom:25px;

                                                                                              color:#667085;

                                                                                                  font-size:14px;
                                                                                                  }

                                                                                                  label{
                                                                                                      display:block;

                                                                                                          margin-top:15px;

                                                                                                              margin-bottom:7px;

                                                                                                                  font-weight:bold;

                                                                                                                      color:#222;
                                                                                                                      }

                                                                                                                      input{
                                                                                                                          width:100%;

                                                                                                                              padding:13px;

                                                                                                                                  border:1px solid #d1d5db;

                                                                                                                                      border-radius:8px;

                                                                                                                                          font-size:16px;
                                                                                                                                          }

                                                                                                                                          input:focus{
                                                                                                                                              outline:none;

                                                                                                                                                  border-color:#2563eb;
                                                                                                                                                  }

                                                                                                                                                  button{
                                                                                                                                                      width:100%;

                                                                                                                                                          margin-top:22px;

                                                                                                                                                              padding:13px;

                                                                                                                                                                  border:0;

                                                                                                                                                                      border-radius:8px;

                                                                                                                                                                          background:#2563eb;

                                                                                                                                                                              color:white;

                                                                                                                                                                                  font-size:16px;

                                                                                                                                                                                      font-weight:bold;

                                                                                                                                                                                          cursor:pointer;
                                                                                                                                                                                          }

                                                                                                                                                                                          button:disabled{
                                                                                                                                                                                              background:#9ca3af;

                                                                                                                                                                                                  cursor:not-allowed;
                                                                                                                                                                                                  }

                                                                                                                                                                                                  .message{
                                                                                                                                                                                                      margin-top:15px;

                                                                                                                                                                                                          padding:11px;

                                                                                                                                                                                                              border-radius:8px;

                                                                                                                                                                                                                  text-align:center;

                                                                                                                                                                                                                      font-size:14px;

                                                                                                                                                                                                                          display:none;
                                                                                                                                                                                                                          }

                                                                                                                                                                                                                          .message.error{
                                                                                                                                                                                                                              display:block;

                                                                                                                                                                                                                                  background:#fee2e2;

                                                                                                                                                                                                                                      color:#991b1b;
                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                      .message.success{
                                                                                                                                                                                                                                          display:block;

                                                                                                                                                                                                                                              background:#dcfce7;

                                                                                                                                                                                                                                                  color:#166534;
                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                  .message.info{
                                                                                                                                                                                                                                                      display:block;

                                                                                                                                                                                                                                                          background:#dbeafe;

                                                                                                                                                                                                                                                              color:#1e40af;
                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                              .forgot{
                                                                                                                                                                                                                                                                  display:block;

                                                                                                                                                                                                                                                                      text-align:center;

                                                                                                                                                                                                                                                                          margin-top:18px;

                                                                                                                                                                                                                                                                              color:#2563eb;

                                                                                                                                                                                                                                                                                  text-decoration:none;

                                                                                                                                                                                                                                                                                      font-size:14px;
                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                      </style>

                                                                                                                                                                                                                                                                                      </head>


                                                                                                                                                                                                                                                                                      <body>


                                                                                                                                                                                                                                                                                      <div class="login-box">

                                                                                                                                                                                                                                                                                          <div class="logo">
                                                                                                                                                                                                                                                                                                  KRIM Logistics
                                                                                                                                                                                                                                                                                                      </div>

                                                                                                                                                                                                                                                                                                          <div class="subtitle">
                                                                                                                                                                                                                                                                                                                  Admin Login
                                                                                                                                                                                                                                                                                                                      </div>


                                                                                                                                                                                                                                                                                                                          <form id="loginForm">

                                                                                                                                                                                                                                                                                                                                  <label for="email">
                                                                                                                                                                                                                                                                                                                                              Email
                                                                                                                                                                                                                                                                                                                                                      </label>

                                                                                                                                                                                                                                                                                                                                                              <input
                                                                                                                                                                                                                                                                                                                                                                          id="email"
                                                                                                                                                                                                                                                                                                                                                                                      type="email"
                                                                                                                                                                                                                                                                                                                                                                                                  placeholder="Enter admin email"
                                                                                                                                                                                                                                                                                                                                                                                                              required
                                                                                                                                                                                                                                                                                                                                                                                                                      >


                                                                                                                                                                                                                                                                                                                                                                                                                              <label for="password">
                                                                                                                                                                                                                                                                                                                                                                                                                                          Password
                                                                                                                                                                                                                                                                                                                                                                                                                                                  </label>

                                                                                                                                                                                                                                                                                                                                                                                                                                                          <input
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      id="password"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  type="password"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              placeholder="Enter password"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          required
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  >


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <button
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      id="loginButton"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  type="submit"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          >
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      Login
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </form>


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              id="message"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      class="message"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          ></div>


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <a
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      class="forgot"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              href="forgot-password.html"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  >
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          Forgot Password?
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </a>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const form =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.getElementById("loginForm");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const emailInput =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.getElementById("email");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const passwordInput =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.getElementById("password");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const loginButton =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.getElementById("loginButton");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const message =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.getElementById("message");


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              function showMessage(text,type){

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  message.textContent = text;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      message.className =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              "message " + type;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              form.addEventListener(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  "submit",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      async function(event){

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              event.preventDefault();


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      loginButton.disabled = true;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              loginButton.textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          "Logging in...";


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  showMessage(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              "Checking login...",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          "info"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  );


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          try{

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      /*
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   * config.js provides the existing
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                * working Supabase client.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             */

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         if(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         typeof supabaseClient ===
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         "undefined"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     ){

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     throw new Error(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         "Supabase configuration could not be loaded."
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 const email =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 emailInput.value.trim();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             const password =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             passwordInput.value;


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         const {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         data,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         error
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     } =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 await supabaseClient.auth.signInWithPassword({

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 email: email,

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 password: password

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             });


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         if(error){
