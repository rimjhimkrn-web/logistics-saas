<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KRIM Logistics - Admin Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    margin:0;
        font-family:Arial,sans-serif;
            background:#f4f6f8;
                min-height:100vh;
                    display:flex;
                        align-items:center;
                            justify-content:center;
                            }

                            .box{
                                width:90%;
                                    max-width:400px;
                                        background:white;
                                            padding:30px 20px;
                                                border-radius:14px;
                                                    box-shadow:0 4px 20px rgba(0,0,0,.10);
                                                    }

                                                    .logo{
                                                        text-align:center;
                                                            font-size:28px;
                                                                font-weight:bold;
                                                                    color:#111827;
                                                                    }

                                                                    .title{
                                                                        text-align:center;
                                                                            margin-top:8px;
                                                                                color:#666;
                                                                                    margin-bottom:25px;
                                                                                    }

                                                                                    label{
                                                                                        display:block;
                                                                                            margin-top:15px;
                                                                                                margin-bottom:6px;
                                                                                                    font-weight:bold;
                                                                                                    }

                                                                                                    input{
                                                                                                        width:100%;
                                                                                                            padding:12px;
                                                                                                                border:1px solid #d1d5db;
                                                                                                                    border-radius:8px;
                                                                                                                        font-size:16px;
                                                                                                                        }

                                                                                                                        button{
                                                                                                                            width:100%;
                                                                                                                                margin-top:20px;
                                                                                                                                    padding:13px;
                                                                                                                                        border:0;
                                                                                                                                            border-radius:8px;
                                                                                                                                                background:#2563eb;
                                                                                                                                                    color:white;
                                                                                                                                                        font-size:16px;
                                                                                                                                                            font-weight:bold;
                                                                                                                                                            }

                                                                                                                                                            button:disabled{
                                                                                                                                                                background:#9ca3af;
                                                                                                                                                                }

                                                                                                                                                                .message{
                                                                                                                                                                    margin-top:15px;
                                                                                                                                                                        text-align:center;
                                                                                                                                                                            font-size:14px;
                                                                                                                                                                            }

                                                                                                                                                                            .error{
                                                                                                                                                                                color:#dc2626;
                                                                                                                                                                                }

                                                                                                                                                                                .success{
                                                                                                                                                                                    color:#16a34a;
                                                                                                                                                                                    }

                                                                                                                                                                                    </style>
                                                                                                                                                                                    </head>

                                                                                                                                                                                    <body>

                                                                                                                                                                                    <div class="box">

                                                                                                                                                                                    <div class="logo">
                                                                                                                                                                                    KRIM Logistics
                                                                                                                                                                                    </div>

                                                                                                                                                                                    <div class="title">
                                                                                                                                                                                    Admin Login
                                                                                                                                                                                    </div>

                                                                                                                                                                                    <form id="loginForm">

                                                                                                                                                                                    <label>Email</label>

                                                                                                                                                                                    <input
                                                                                                                                                                                        type="email"
                                                                                                                                                                                            id="email"
                                                                                                                                                                                                placeholder="Admin email"
                                                                                                                                                                                                    required
                                                                                                                                                                                                    >

                                                                                                                                                                                                    <label>Password</label>

                                                                                                                                                                                                    <input
                                                                                                                                                                                                        type="password"
                                                                                                                                                                                                            id="password"
                                                                                                                                                                                                                placeholder="Password"
                                                                                                                                                                                                                    required
                                                                                                                                                                                                                    >

                                                                                                                                                                                                                    <button type="submit" id="loginButton">
                                                                                                                                                                                                                    Login
                                                                                                                                                                                                                    </button>

                                                                                                                                                                                                                    </form>

                                                                                                                                                                                                                    <div id="message" class="message"></div>

                                                                                                                                                                                                                    </div>


                                                                                                                                                                                                                    <script>

                                                                                                                                                                                                                    const SUPABASE_URL =
                                                                                                                                                                                                                    "https://ebltviniygljwwseplph.supabase.co";

                                                                                                                                                                                                                    const SUPABASE_KEY =
                                                                                                                                                                                                                    "YOUR_SUPABASE_PUBLISHABLE_OR_ANON_KEY";

                                                                                                                                                                                                                    const supabaseClient =
                                                                                                                                                                                                                    supabase.createClient(
                                                                                                                                                                                                                        SUPABASE_URL,
                                                                                                                                                                                                                            SUPABASE_KEY
                                                                                                                                                                                                                            );


                                                                                                                                                                                                                            const form =
                                                                                                                                                                                                                            document.getElementById("loginForm");

                                                                                                                                                                                                                            const button =
                                                                                                                                                                                                                            document.getElementById("loginButton");

                                                                                                                                                                                                                            const message =
                                                                                                                                                                                                                            document.getElementById("message");


                                                                                                                                                                                                                            form.addEventListener("submit", async function(event){

                                                                                                                                                                                                                                event.preventDefault();

                                                                                                                                                                                                                                    button.disabled = true;
                                                                                                                                                                                                                                        button.textContent = "Logging in...";

                                                                                                                                                                                                                                            message.textContent = "";
                                                                                                                                                                                                                                                message.className = "message";


                                                                                                                                                                                                                                                    const email =
                                                                                                                                                                                                                                                        document.getElementById("email").value.trim();

                                                                                                                                                                                                                                                            const password =
                                                                                                                                                                                                                                                                document.getElementById("password").value;


                                                                                                                                                                                                                                                                    try{

                                                                                                                                                                                                                                                                            const { data, error } =
                                                                                                                                                                                                                                                                                    await supabaseClient.auth.signInWithPassword({
                                                                                                                                                                                                                                                                                                email: email,
                                                                                                                                                                                                                                                                                                            password: password
                                                                                                                                                                                                                                                                                                                    });


                                                                                                                                                                                                                                                                                                                            if(error){
                                                                                                                                                                                                                                                                                                                                        throw error;
                                                                                                                                                                                                                                                                                                                                                }


                                                                                                                                                                                                                                                                                                                                                        const { data: adminCheck, error: adminError } =
                                                                                                                                                                                                                                                                                                                                                                await supabaseClient.rpc("is_admin");


                                                                                                                                                                                                                                                                                                                                                                        if(adminError){
                                                                                                                                                                                                                                                                                                                                                                                    throw adminError;
                                                                                                                                                                                                                                                                                                                                                                                            }


                                                                                                                                                                                                                                                                                                                                                                                                    if(adminCheck !== true){

                                                                                                                                                                                                                                                                                                                                                                                                                await supabaseClient.auth.signOut();

                                                                                                                                                                                                                                                                                                                                                                                                                            throw new Error(
                                                                                                                                                                                                                                                                                                                                                                                                                                            "This account is not authorized as an admin."
                                                                                                                                                                                                                                                                                                                                                                                                                                                        );
                                                                                                                                                                                                                                                                                                                                                                                                                                                                }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                        message.textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "Login successful. Opening Admin Control Center...";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        message.className =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "message success";


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        setTimeout(function(){

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    window.location.href =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "admin-control-center.html";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        },500);


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }catch(error){

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    console.error(error);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            message.textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    error.message || "Login failed.";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            message.className =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    "message error";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            button.disabled = false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    button.textContent = "Login";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
