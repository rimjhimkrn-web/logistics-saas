<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
    <title>Shipment Lifecycle</title>

      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

        <style>
            body {
                  font-family: Arial, sans-serif;
                        padding: 30px;
                              max-width: 600px;
                                    margin: auto;
                                        }

                                            input, button {
                                                  width: 100%;
                                                        padding: 12px;
                                                              margin-top: 10px;
                                                                    box-sizing: border-box;
                                                                        }

                                                                            #result {
                                                                                  margin-top: 20px;
                                                                                        line-height: 2;
                                                                                            }

                                                                                                .step {
                                                                                                      padding: 8px;
                                                                                                            border: 1px solid #ddd;
                                                                                                                  margin-top: 5px;
                                                                                                                      }
                                                                                                                        </style>
                                                                                                                        </head>

                                                                                                                        <body>

                                                                                                                          <h2>Shipment Lifecycle</h2>

                                                                                                                            <input
                                                                                                                                type="text"
                                                                                                                                    id="tracking"
                                                                                                                                        placeholder="Enter Tracking Number"
                                                                                                                                          >

                                                                                                                                            <button onclick="loadLifecycle()">
                                                                                                                                                Check Shipment
                                                                                                                                                  </button>

                                                                                                                                                    <div id="result"></div>

                                                                                                                                                      <script>

                                                                                                                                                          const SUPABASE_URL =
                                                                                                                                                                "https://ebltviniygljwwseplph.supabase.co";

                                                                                                                                                                    const SUPABASE_PUBLISHABLE_KEY =
                                                                                                                                                                          "sb_publishable_8xzZUeubYp_nIxVRWEQdiw_2H4RkHAa";

                                                                                                                                                                              const supabaseClient =
                                                                                                                                                                                    supabase.createClient(
                                                                                                                                                                                            SUPABASE_URL,
                                                                                                                                                                                                    SUPABASE_PUBLISHABLE_KEY
                                                                                                                                                                                                          );


                                                                                                                                                                                                              async function loadLifecycle() {

                                                                                                                                                                                                                    const result =
                                                                                                                                                                                                                            document.getElementById("result");

                                                                                                                                                                                                                                  const tracking =
                                                                                                                                                                                                                                          document.getElementById("tracking").value.trim();


                                                                                                                                                                                                                                                if (!tracking) {
                                                                                                                                                                                                                                                        result.innerText =
                                                                                                                                                                                                                                                                  "Please enter tracking number.";
                                                                                                                                                                                                                                                                          return;
                                                                                                                                                                                                                                                                                }


                                                                                                                                                                                                                                                                                      const { data, error } =
                                                                                                                                                                                                                                                                                              await supabaseClient
                                                                                                                                                                                                                                                                                                        .from("shipment_requests")
                                                                                                                                                                                                                                                                                                                  .select(`
                                                                                                                                                                                                                                                                                                                              id,
                                                                                                                                                                                                                                                                                                                                          tracking_number,
                                                                                                                                                                                                                                                                                                                                                      status,
                                                                                                                                                                                                                                                                                                                                                                  partner,
                                                                                                                                                                                                                                                                                                                                                                              quoted_price,
                                                                                                                                                                                                                                                                                                                                                                                          quote_status
                                                                                                                                                                                                                                                                                                                                                                                                    `)
                                                                                                                                                                                                                                                                                                                                                                                                              .eq("tracking_number", tracking)
                                                                                                                                                                                                                                                                                                                                                                                                                        .single();


                                                                                                                                                                                                                                                                                                                                                                                                                              if (error || !data) {
                                                                                                                                                                                                                                                                                                                                                                                                                                      result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                "Shipment not found.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                        return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                              }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const status = data.status;


                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const steps = [
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  ["New", ["new"]],
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          ["Assigned", ["assigned"]],
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  ["Accepted", ["accepted"]],
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          ["Picked Up", ["pickup", "picked_up"]],
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  ["In Transit", ["transit", "in_transit"]],
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          ["Delivered", ["delivered"]]
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ];


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      let html = `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <hr>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <strong>Tracking:</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          ${data.tracking_number}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <strong>Partner:</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              ${data.partner || "Unassigned"}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <strong>Quotation:</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  ${
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              data.quoted_price
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ? "₹" + data.quoted_price
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          : "Not available"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <strong>Quotation Status:</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ${data.quote_status || "Pending"}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <h3>Shipment Progress</h3>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              `;


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    steps.forEach(function(step) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const name = step[0];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const statuses = step[1];

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const active =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      statuses.includes(status);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              html += `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="step">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ${active ? "🟢" : "⚪"} ${name}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      `;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            });


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  html += `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <strong>Current Status:</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              ${status}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            `;


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if (status === "delivered") {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          html += `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <strong>Shipment:</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            Delivered
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              `;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const { data: pod } =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                await supabaseClient
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .from("delivery_proofs")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        .select(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      "recipient_name, delivery_notes, proof_url, delivered_at"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  )
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              .eq("shipment_id", data.id)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          .maybeSingle();


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if (pod) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            html += `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <h3>Proof of Delivery</h3>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <strong>Recipient:</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ${pod.recipient_name || "Not provided"}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <strong>Notes:</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ${pod.delivery_notes || "None"}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <strong>Delivered At:</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ${pod.delivered_at || "Not available"}
