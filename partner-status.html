<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
    <title>Partner Shipment Status</title>

      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

        <style>
            body {
                  font-family: Arial, sans-serif;
                        padding: 30px;
                              max-width: 600px;
                                    margin: auto;
                                        }

                                            input, select, button {
                                                  width: 100%;
                                                        padding: 12px;
                                                              margin-top: 10px;
                                                                    box-sizing: border-box;
                                                                        }

                                                                            #result {
                                                                                  margin-top: 20px;
                                                                                        font-weight: bold;
                                                                                            }
                                                                                              </style>
                                                                                              </head>

                                                                                              <body>

                                                                                                <h2>Partner Shipment Status</h2>

                                                                                                  <input
                                                                                                      type="text"
                                                                                                          id="tracking"
                                                                                                              placeholder="Enter Tracking Number"
                                                                                                                >

                                                                                                                  <input
                                                                                                                      type="number"
                                                                                                                          id="partnerId"
                                                                                                                              placeholder="Enter Partner ID"
                                                                                                                                >

                                                                                                                                  <select id="status">
                                                                                                                                      <option value="picked_up">Picked Up</option>
                                                                                                                                          <option value="in_transit">In Transit</option>
                                                                                                                                              <option value="delivered">Delivered</option>
                                                                                                                                                </select>

                                                                                                                                                  <button onclick="updateStatus()">
                                                                                                                                                      Update Shipment Status
                                                                                                                                                        </button>

                                                                                                                                                          <div id="result"></div>

                                                                                                                                                            <script>

                                                                                                                                                                const SUPABASE_URL =
                                                                                                                                                                      "https://ebltviniygljwwseplph.supabase.co";

                                                                                                                                                                          const SUPABASE_PUBLISHABLE_KEY =
                                                                                                                                                                                "sb_publishable_8xzZUeubYp_nIxVRWEQdiw_2H4RkHAa";

                                                                                                                                                                                    const supabaseClient =
                                                                                                                                                                                          supabase.createClient(
                                                                                                                                                                                                  SUPABASE_URL,
                                                                                                                                                                                                          SUPABASE_PUBLISHABLE_KEY
                                                                                                                                                                                                                );


                                                                                                                                                                                                                    async function updateStatus() {

                                                                                                                                                                                                                          const result =
                                                                                                                                                                                                                                  document.getElementById("result");

                                                                                                                                                                                                                                        const tracking =
                                                                                                                                                                                                                                                document.getElementById("tracking").value.trim();

                                                                                                                                                                                                                                                      const partnerId =
                                                                                                                                                                                                                                                              Number(
                                                                                                                                                                                                                                                                        document.getElementById("partnerId").value
                                                                                                                                                                                                                                                                                );

                                                                                                                                                                                                                                                                                      const newStatus =
                                                                                                                                                                                                                                                                                              document.getElementById("status").value;


                                                                                                                                                                                                                                                                                                    if (!tracking || !partnerId) {
                                                                                                                                                                                                                                                                                                            result.innerText =
                                                                                                                                                                                                                                                                                                                      "Please fill all fields.";
                                                                                                                                                                                                                                                                                                                              return;
                                                                                                                                                                                                                                                                                                                                    }


                                                                                                                                                                                                                                                                                                                                          const { data: shipment, error: shipmentError } =
                                                                                                                                                                                                                                                                                                                                                  await supabaseClient
                                                                                                                                                                                                                                                                                                                                                            .from("shipment_requests")
                                                                                                                                                                                                                                                                                                                                                                      .select("id, tracking_number, partner_id, status")
                                                                                                                                                                                                                                                                                                                                                                                .eq("tracking_number", tracking)
                                                                                                                                                                                                                                                                                                                                                                                          .single();


                                                                                                                                                                                                                                                                                                                                                                                                if (shipmentError || !shipment) {
                                                                                                                                                                                                                                                                                                                                                                                                        result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                  "Shipment not found.";
                                                                                                                                                                                                                                                                                                                                                                                                                          return;
                                                                                                                                                                                                                                                                                                                                                                                                                                }


                                                                                                                                                                                                                                                                                                                                                                                                                                      if (Number(shipment.partner_id) !== partnerId) {
                                                                                                                                                                                                                                                                                                                                                                                                                                              result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                        "This shipment is not assigned to this partner.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const allowedTransitions = {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    accepted: ["picked_up"],
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            picked_up: ["in_transit"],
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    in_transit: ["delivered"]
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          };


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        !allowedTransitions[shipment.status] ||
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                !allowedTransitions[shipment.status].includes(newStatus)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      ) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        "Invalid status transition.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const { error: updateError } =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    await supabaseClient
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              .from("shipment_requests")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        .update({
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    status: newStatus
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              })
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        .eq("id", shipment.id)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  .eq("partner_id", partnerId);


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (updateError) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          "Error: " + updateError.message;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      "Shipment status updated successfully!";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
