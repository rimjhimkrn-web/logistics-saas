<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07121c">
  <title>Create account | KRIM</title>
  <link rel="stylesheet" href="/core/styles/main.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="/config.js"></script>
  <script defer src="/config/markets.js"></script>
  <script defer src="/core/localization/catalog.js"></script>
  <script defer src="/core/js/platform.js"></script>
  <script defer src="/core/js/auth-flows.js"></script>
</head>
<body class="app-login">
  <main class="app-login-panel surface">
    <a class="brand" href="/"><span class="brand-mark">K</span><span>KRIM<small>LOGISTICS SYSTEMS</small></span></a>
    <span class="eyebrow">ACCOUNT ACCESS</span>
    <h1>Create a KRIM account</h1>
    <p class="muted">This creates an authentication identity only. It does not create an organization, membership, or workspace permissions.</p>
    <form class="app-login-form" data-auth-flow="register" novalidate>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required></div>
      <button class="button" type="submit">Create account</button>
    </form>
    <div data-notifications aria-live="polite" class="signin-feedback"></div>
    <p class="signin-back"><a href="/app/sign-in.html">Back to sign in</a></p>
  </main>
</body>
</html>
