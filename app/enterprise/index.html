<style>
:root{--ent-navy:#102b50;--ent-ink:#172b45;--ent-blue:#2463eb;--ent-pale:#eef5ff;--ent-line:#e1e8f1;--ent-muted:#66758b}
body[data-portal="enterprise"]{background:#f5f8fc;color:var(--ent-ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
body[data-portal="enterprise"] .portal-layout{min-height:100vh}
body[data-portal="enterprise"] .portal-side{background:linear-gradient(180deg,#102b50 0%,#0b1e38 100%);color:#fff;border-right:1px solid #203d61;box-shadow:8px 0 30px #102b5010}
body[data-portal="enterprise"] .brand{color:#fff;text-decoration:none;font-weight:800;letter-spacing:.06em}
body[data-portal="enterprise"] .brand small{display:block;color:#b7c8df;font-size:9px;letter-spacing:.17em;margin-top:4px}
body[data-portal="enterprise"] .brand-mark{background:linear-gradient(135deg,#77b7ff,#fff);color:#102b50;border-radius:12px;box-shadow:0 8px 20px #0002}
body[data-portal="enterprise"] .portal-role{color:#a9c5e7;text-transform:uppercase;letter-spacing:.14em;font-size:10px;font-weight:800;margin-top:30px}
body[data-portal="enterprise"] .portal-nav a{border-radius:10px;margin:4px 0;color:#d5e1f1;padding:11px 13px;transition:background .18s ease,color .18s ease,transform .18s ease}
body[data-portal="enterprise"] .portal-nav a:hover{background:#ffffff12;color:#fff;transform:translateX(2px)}
body[data-portal="enterprise"] .portal-nav a[aria-current="page"]{background:#eaf3ff;color:#102b50;font-weight:750;box-shadow:inset 3px 0 #4d8cff}
body[data-portal="enterprise"] .language-select{background:#19395f;color:#fff;border:1px solid #426080;border-radius:9px;padding:9px;max-width:100%}
body[data-portal="enterprise"] .portal-side-bottom .button{color:#e7eff9}
body[data-portal="enterprise"] .portal-main{min-width:0}
body[data-portal="enterprise"] .portal-topbar{position:sticky;top:0;z-index:10;min-height:64px;background:#ffffffed;backdrop-filter:blur(12px);border-bottom:1px solid var(--ent-line);padding:12px clamp(16px,3vw,34px);display:flex;align-items:center;gap:16px}
body[data-portal="enterprise"] .portal-topbar:after{content:"ENTERPRISE NETWORK";margin-left:auto;font-size:10px;font-weight:800;letter-spacing:.14em;color:#58708e;background:#f0f5fc;border:1px solid #dce6f3;border-radius:999px;padding:8px 12px}
body[data-portal="enterprise"] .portal-content{max-width:1600px;margin:0 auto;padding:clamp(18px,3vw,38px)}
body[data-portal="enterprise"] .portal-content> .eyebrow{display:inline-flex;align-items:center;gap:8px;color:#2857a4;font-weight:800;font-size:10px;letter-spacing:.16em;text-transform:uppercase;background:#e8f1ff;border:1px solid #d6e5ff;border-radius:999px;padding:8px 12px}
body[data-portal="enterprise"] .portal-content> .eyebrow:before{content:"";width:7px;height:7px;border-radius:50%;background:#3679f6;box-shadow:0 0 0 4px #3679f61b}
body[data-portal="enterprise"] .portal-content>h1{font-size:clamp(30px,4vw,46px);line-height:1.08;letter-spacing:-.045em;color:#102b50;margin:17px 0 10px;font-weight:850}
body[data-portal="enterprise"] .portal-content>p.muted{font-size:14px;line-height:1.75;color:var(--ent-muted);max-width:780px;margin:0 0 24px}
body[data-portal="enterprise"] .portal-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:22px 0 28px}
body[data-portal="enterprise"] .portal-card,body[data-portal="enterprise"] .surface{background:#fff;border:1px solid var(--ent-line);border-radius:18px;box-shadow:0 8px 24px #1d3b6208;min-width:0;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
body[data-portal="enterprise"] .portal-card:hover{border-color:#c6d8f3;box-shadow:0 14px 30px #1d3b6210;transform:translateY(-2px)}
body[data-portal="enterprise"] .portal-card h2{font-size:16px;letter-spacing:-.02em;color:#17375f;margin:0 0 10px}
body[data-portal="enterprise"] .portal-card p{font-size:13px;line-height:1.65;color:#6b7b90}
body[data-portal="enterprise"] .portal-card a{display:inline-flex;align-items:center;gap:8px;color:#215fca;font-size:13px;font-weight:750;text-decoration:none;margin-top:8px}
body[data-portal="enterprise"] .portal-card a:hover{text-decoration:underline}
body[data-portal="enterprise"] .data-table-wrap{overflow:auto;border:1px solid var(--ent-line);border-radius:16px;background:#fff;box-shadow:0 8px 24px #1d3b6208}
body[data-portal="enterprise"] .data-table{width:100%;border-collapse:collapse;min-width:680px}
body[data-portal="enterprise"] .data-table th{background:#f1f6fd;color:#526882;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.1em;padding:14px 16px;white-space:nowrap}
body[data-portal="enterprise"] .data-table td{padding:14px 16px;border-top:1px solid #edf1f7;font-size:13px;color:#34465e}
body[data-portal="enterprise"] .empty-state{background:#fff;border:1px dashed #c7d6e9;border-radius:18px;padding:24px;color:#66758b;line-height:1.7}
body[data-portal="enterprise"] .empty-state h2,body[data-portal="enterprise"] .empty-state h3{color:#17375f}
body[data-portal="enterprise"] .button{border-radius:10px;font-weight:750}
body[data-portal="enterprise"] input,body[data-portal="enterprise"] select,body[data-portal="enterprise"] textarea{border:1px solid #d7e1ee;border-radius:10px;background:#fff;padding:11px 12px;max-width:100%}
body[data-portal="enterprise"] :focus-visible{outline:3px solid #80b4ff;outline-offset:3px}
@media(max-width:1050px){body[data-portal="enterprise"] .portal-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){body[data-portal="enterprise"] .portal-content{padding:18px 14px 28px}body[data-portal="enterprise"] .portal-grid{grid-template-columns:1fr;gap:12px}body[data-portal="enterprise"] .portal-content>h1{font-size:32px}body[data-portal="enterprise"] .portal-topbar:after{font-size:8px;padding:7px 9px;letter-spacing:.08em}}
@media(prefers-reduced-motion:reduce){body[data-portal="enterprise"] *{transition:none!important;scroll-behavior:auto!important}}

/* Enterprise workspace finishing layer — premium global command interface */
body[data-portal="enterprise"]{background:#f4f7fb}
body[data-portal="enterprise"] .portal-layout{display:grid;grid-template-columns:268px minmax(0,1fr)}
body[data-portal="enterprise"] .portal-side{width:268px;position:sticky;top:0;height:100dvh;overflow:auto;padding:24px 18px;display:flex;flex-direction:column}
body[data-portal="enterprise"] .brand{display:flex;align-items:center;gap:12px;font-size:17px}
body[data-portal="enterprise"] .brand-mark{display:grid;place-items:center;width:42px;height:42px;font-size:22px;font-weight:900}
body[data-portal="enterprise"] .portal-nav{display:grid;gap:5px;margin-top:16px}
body[data-portal="enterprise"] .portal-nav a{display:flex;align-items:center;min-height:42px}
body[data-portal="enterprise"] .portal-side-bottom{margin-top:auto;padding-top:24px;display:grid;gap:10px}
body[data-portal="enterprise"] .portal-main{min-width:0}
body[data-portal="enterprise"] .portal-topbar{min-height:70px}
body[data-portal="enterprise"] .portal-content{width:100%}
body[data-portal="enterprise"] .portal-content h1{font-weight:850}
body[data-portal="enterprise"] .portal-content .portal-grid{align-items:stretch}
body[data-portal="enterprise"] .portal-card{padding:22px}
body[data-portal="enterprise"] .portal-card h2{font-size:17px}
body[data-portal="enterprise"] .portal-card p{margin:0;line-height:1.7}
body[data-portal="enterprise"] .portal-card a{padding:8px 0}
body[data-portal="enterprise"] .portal-content section,body[data-portal="enterprise"] .portal-content [class*="panel"],body[data-portal="enterprise"] .portal-content [class*="section"]{min-width:0}
body[data-portal="enterprise"] .portal-content button,body[data-portal="enterprise"] .portal-content a,body[data-portal="enterprise"] .portal-side button{touch-action:manipulation}
body[data-portal="enterprise"] .portal-content :is(input,select,textarea){width:100%;min-height:42px}
body[data-portal="enterprise"] .portal-content :is(button,.button){min-height:40px}
body[data-portal="enterprise"] .portal-content .data-table-wrap{max-width:100%}
body[data-portal="enterprise"] .portal-content .empty-state{max-width:100%}
body[data-portal="enterprise"] .portal-content :is(h2,h3){letter-spacing:-.025em}
body[data-portal="enterprise"] .portal-content :is(.status,.badge,[class*="badge"],[class*="status"]){border-radius:999px}
@media(max-width:900px){
 body[data-portal="enterprise"] .portal-layout{display:block}
 body[data-portal="enterprise"] .portal-side{position:fixed;z-index:40;left:0;top:0;bottom:0;height:100dvh;width:min(300px,86vw);transform:translateX(-105%);transition:transform .2s ease}
 body[data-portal="enterprise"] .portal-side.is-open,body[data-portal="enterprise"] .portal-side[data-open="true"]{transform:translateX(0)}
 body[data-portal="enterprise"] .portal-topbar{padding:12px 16px}
 body[data-portal="enterprise"] .portal-topbar:after{content:"KRIM ENTERPRISE"}
}
@media(max-width:640px){
 body[data-portal="enterprise"] .portal-content .portal-grid{grid-template-columns:minmax(0,1fr)}
 body[data-portal="enterprise"] .portal-content .portal-card{padding:18px}
 body[data-portal="enterprise"] .portal-content>h1{font-size:clamp(28px,8vw,36px)}
 body[data-portal="enterprise"] .portal-topbar>span{font-size:12px}
}

</style>
