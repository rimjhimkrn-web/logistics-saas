<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#081a36"><title>Partner Workspace Router | KRIM Logistics OS</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../config.js"></script><style>body{margin:0;background:#f3f6fb;color:#172b46;font:14px/1.6 system-ui,sans-serif}.box{width:min(620px,calc(100% - 32px));margin:12vh auto;padding:26px;background:#fff;border:1px solid #dce5ef;border-radius:16px;box-shadow:0 14px 36px #081a3610}h1{color:#081a36;font-size:25px;margin:0 0 8px}p{color:#64758b;font-size:13px}.btn{display:inline-block;padding:10px 14px;border-radius:9px;background:#2563eb;color:#fff;text-decoration:none;font-weight:800;font-size:11px}</style></head><body><main class="box" role="status" aria-live="polite"><h1 id="title">Opening your partner workspace…</h1><p id="message">KRIM is verifying your account pathway and organization access.</p><a class="btn" href="../../auth/partner-signin.html">Partner sign in</a></main><script>(async function(){const $=id=>document.getElementById(id),client=window.KRIM_SUPABASE,base=window.KRIM_BASE_PATH||"";const go=p=>base+"/"+p;try{if(!client)throw Error("Authentication service is unavailable.");const {data,error}=await client.auth.getUser();if(error)throw error;if(!data?.user){location.replace(go("auth/partner-signin.html"));return}const {data:members,error:me}=await client.from("krim_organization_members").select("organization_id,status").eq("user_id",data.user.id).eq("status","active");if(me)throw me;const ids=[...new Set((members||[]).map(x=>Number(x.organization_id)).filter(n=>Number.isSafeInteger(n)&&n>0))];if(!ids.length){location.replace(go("public/partner/partner-onboarding.html"));return}const {data:orgs,error:oe}=await client.from("krim_organizations").select("id,organization_type,organization_type_code,status,partner_account_mode").in("id",ids);if(oe)throw oe;const valid=["partner","carrier","forwarder","logistics_provider","warehouse_operator"],org=(orgs||[]).find(o=>valid.includes(String(o.organization_type||"").toLowerCase())||valid.includes(String(o.organization_type_code||"").toLowerCase()));if(!org)throw Error("No active partner organization was found for this account.");if(String(org.status||"").toLowerCase()!=="active")throw Error("Your partner organization is inactive. Contact KRIM support.");const routes={development_test:"development",individual_interest:"individual",registered_business:"business"},mode=String(org.partner_account_mode||"").toLowerCase();if(!routes[mode]){location.replace(go("public/partner/partner-onboarding.html"));return}location.replace(go("app/partner/"+routes[mode]+"/index.html"))}catch(e){$("title").textContent="Partner workspace could not be opened";$("message").textContent=e?.message||"Refresh and sign in again."}})();</script></body></html>
