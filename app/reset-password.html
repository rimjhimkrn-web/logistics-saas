<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07121c">
  <title>Choose a new password | KRIM</title>
  <link rel="stylesheet" href="/core/styles/main.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="/config.js"></script>
  <script defer src="/config/markets.js"></script>
  <script defer src="/core/localization/catalog.js"></script>
  <script defer src="/core/js/platform.js"></script>
  <script defer src="/core/js/auth-flows.js"></script>
</head>
<body class="app-login">
  <main class="app-login-panel surface">
    <a class="brand" href="/"><span class="brand-mark">K</span><span>KRIM<small>LOGISTICS SYSTEMS</small></span></a>
    <span class="eyebrow">ACCOUNT RECOVERY</span>
    <h1>Choose a new password</h1>
    <p class="muted">Open this page using a valid recovery link from KRIM.</p>
    <form class="app-login-form" data-auth-flow="reset" novalidate>
      <div class="field"><label for="password">New password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required></div>
      <div class="field"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required></div>
      <button class="button" type="submit">Update password</button>
    </form>
    <div data-notifications aria-live="polite" class="signin-feedback"></div>
    <p class="signin-back"><a href="/app/sign-in.html">Back to sign in</a></p>
  </main>
</body>
</html>
