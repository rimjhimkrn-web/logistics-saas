<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>My Shipment Quotation - KRIM Logistics</title>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
          <script src="config.js"></script>

            <style>
                body {
                      margin: 0;
                            font-family: Arial, sans-serif;
                                  background: #f4f6f8;
                                        color: #172033;
                                            }

                                                header {
                                                      background: #071a33;
                                                            color: white;
                                                                  padding: 20px;
                                                                      }

                                                                          .container {
                                                                                max-width: 600px;
                                                                                      margin: 30px auto;
                                                                                            padding: 20px;
                                                                                                }

                                                                                                    .card {
                                                                                                          background: white;
                                                                                                                padding: 22px;
                                                                                                                      border-radius: 12px;
                                                                                                                            margin-bottom: 15px;
                                                                                                                                }

                                                                                                                                    h1 {
                                                                                                                                          margin: 0;
                                                                                                                                                font-size: 22px;
                                                                                                                                                    }

                                                                                                                                                        h2 {
                                                                                                                                                              margin-top: 0;
                                                                                                                                                                  }

                                                                                                                                                                      .row {
                                                                                                                                                                            padding: 10px 0;
                                                                                                                                                                                  border-bottom: 1px solid #eee;
                                                                                                                                                                                      }

                                                                                                                                                                                          .label {
                                                                                                                                                                                                color: #666;
                                                                                                                                                                                                      font-size: 13px;
                                                                                                                                                                                                          }

                                                                                                                                                                                                              .value {
                                                                                                                                                                                                                    font-weight: bold;
                                                                                                                                                                                                                          margin-top: 4px;
                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                  .price {
                                                                                                                                                                                                                                        font-size: 24px;
                                                                                                                                                                                                                                              color: #0757a5;
                                                                                                                                                                                                                                                    font-weight: bold;
                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                            .status {
                                                                                                                                                                                                                                                                  display: inline-block;
                                                                                                                                                                                                                                                                        padding: 6px 10px;
                                                                                                                                                                                                                                                                              border-radius: 20px;
                                                                                                                                                                                                                                                                                    background: #e8f7ed;
                                                                                                                                                                                                                                                                                          color: #176b35;
                                                                                                                                                                                                                                                                                                font-weight: bold;
                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                        button {
                                                                                                                                                                                                                                                                                                              width: 100%;
                                                                                                                                                                                                                                                                                                                    padding: 13px;
                                                                                                                                                                                                                                                                                                                          border: 0;
                                                                                                                                                                                                                                                                                                                                border-radius: 7px;
                                                                                                                                                                                                                                                                                                                                      background: #0757a5;
                                                                                                                                                                                                                                                                                                                                            color: white;
                                                                                                                                                                                                                                                                                                                                                  font-size: 16px;
                                                                                                                                                                                                                                                                                                                                                        margin-top: 15px;
                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                #message {
                                                                                                                                                                                                                                                                                                                                                                      margin-top: 15px;
                                                                                                                                                                                                                                                                                                                                                                            padding: 10px;
                                                                                                                                                                                                                                                                                                                                                                                  border-radius: 7px;
                                                                                                                                                                                                                                                                                                                                                                                        background: #f1f3f5;
                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                              </style>
                                                                                                                                                                                                                                                                                                                                                                                              </head>

                                                                                                                                                                                                                                                                                                                                                                                              <body>

                                                                                                                                                                                                                                                                                                                                                                                              <header>
                                                                                                                                                                                                                                                                                                                                                                                                <h1>KRIM Logistics</h1>
                                                                                                                                                                                                                                                                                                                                                                                                </header>

                                                                                                                                                                                                                                                                                                                                                                                                <div class="container">

                                                                                                                                                                                                                                                                                                                                                                                                  <div class="card">

                                                                                                                                                                                                                                                                                                                                                                                                      <h2>My Shipment Quotation</h2>

                                                                                                                                                                                                                                                                                                                                                                                                          <div id="message">
                                                                                                                                                                                                                                                                                                                                                                                                                Loading quotation...
                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                      </div>

                                                                                                                                                                                                                                                                                                                                                                                                                      </div>

                                                                                                                                                                                                                                                                                                                                                                                                                      <script>

                                                                                                                                                                                                                                                                                                                                                                                                                      async function loadQuotation() {

                                                                                                                                                                                                                                                                                                                                                                                                                        const message = document.getElementById("message");

                                                                                                                                                                                                                                                                                                                                                                                                                          const {
                                                                                                                                                                                                                                                                                                                                                                                                                              data: { session },
                                                                                                                                                                                                                                                                                                                                                                                                                                  error: sessionError
                                                                                                                                                                                                                                                                                                                                                                                                                                    } = await supabaseClient.auth.getSession();

                                                                                                                                                                                                                                                                                                                                                                                                                                      if (sessionError || !session) {
                                                                                                                                                                                                                                                                                                                                                                                                                                          window.location.href = "customer-login.html";
                                                                                                                                                                                                                                                                                                                                                                                                                                              return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                  const user = session.user;

                                                                                                                                                                                                                                                                                                                                                                                                                                                    const { data, error } = await supabaseClient
                                                                                                                                                                                                                                                                                                                                                                                                                                                        .from("shipment_requests")
                                                                                                                                                                                                                                                                                                                                                                                                                                                            .select(`
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  tracking_number,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        quoted_price,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              quote_status,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    status,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          pickup_location,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                delivery_location
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    `)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        .eq("customer_id", user.id)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .order("created_at", { ascending: false });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if (error) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  console.log(error);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      message.innerHTML =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            "Unable to load quotation.";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (!data || data.length === 0) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        message.innerHTML =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              "No shipment quotation found.";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const shipment = data[0];

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const price =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            shipment.quoted_price !== null
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  ? "₹" + Number(shipment.quoted_price).toLocaleString("en-IN")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        : "Not quoted yet";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const quoteStatus =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              shipment.quote_status || "pending";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                message.innerHTML = `

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="row">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="label">Tracking Number</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="value">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ${shipment.tracking_number || "-"}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="row">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="label">Pickup</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="value">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          ${shipment.pickup_location || "-"}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="row">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="label">Delivery</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="value">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ${shipment.delivery_location || "-"}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="row">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="label">Quotation Status</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="value">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <span class="status">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ${quoteStatus}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="row">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="label">Quoted Price</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="price">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  ${price}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ${
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      shipment.quoted_price !== null &&
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            quoteStatus === "sent"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  ? `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <button onclick="acceptQuote()">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    Accept Quote
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        : ""
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              `;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              function acceptQuote() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                window.location.href =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    "accept-quote.html?tracking=" +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        encodeURIComponent(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.querySelector(".value").innerText
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  );
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  loadQuotation();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </html>
