<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>My Shipments</title>
            </head>
            <body>

                <h1>My Shipments</h1>

                    <p>
                            <label>Select Partner:</label>
                                    <select id="partnerSelect">
                                                <option value="">-- Select --</option>
                                                        </select>
                                                                <button onclick="loadShipments()">View</button>
                                                                    </p>

                                                                        <div id="result"></div>

                                                                            <br>
                                                                                <a href="index.html">Back to Home</a>

                                                                                    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
                                                                                        </script>
                                                                                            <script>
                                                                                                    const supabase = window.supabase.createClient(
                                                                                                                'https://ebltviniygljwwseplph.supabase.co',
                                                                                                                            'sb_publishable_8xzZUeubYp_nIxVRWEQdiw_2H4RkHAa'
                                                                                                                                    );

                                                                                                                                            // Load partners into dropdown
                                                                                                                                                    async function loadPartners() {
                                                                                                                                                                const select = document.getElementById('partnerSelect');

                                                                                                                                                                            const { data, error } = await supabase
                                                                                                                                                                                            .from('partners')
                                                                                                                                                                                                            .select('name');

                                                                                                                                                                                                                        if (error) {
                                                                                                                                                                                                                                        select.innerHTML = '<option>Error</option>';
                                                                                                                                                                                                                                                        return;
                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                let options = '<option value="">-- Select --</option>';
                                                                                                                                                                                                                                                                                            data.forEach(p => {
                                                                                                                                                                                                                                                                                                            options += `<option value="${p.name}">${p.name}</option>`;
                                                                                                                                                                                                                                                                                                                        });
                                                                                                                                                                                                                                                                                                                                    select.innerHTML = options;
                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                    // Load shipments for selected partner
                                                                                                                                                                                                                                                                                                                                                            async function loadShipments() {
                                                                                                                                                                                                                                                                                                                                                                        const select = document.getElementById('partnerSelect');
                                                                                                                                                                                                                                                                                                                                                                                    const result = document.getElementById('result');
                                                                                                                                                                                                                                                                                                                                                                                                const partnerName = select.value;

                                                                                                                                                                                                                                                                                                                                                                                                            if (!partnerName) {
                                                                                                                                                                                                                                                                                                                                                                                                                            result.innerHTML = 'Please select a partner';
                                                                                                                                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                    result.innerHTML = 'Loading...';

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const { data, error } = await supabase
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                .from('shipment_requests')
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                .select('*')
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                .eq('assigned_partner', partnerName);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (error) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            result.innerHTML = 'Error: ' + error.message;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (!data || data.length === 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    result.innerHTML = 'No shipments for ' + partnerName;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let html = `<h3>Shipments for ${partnerName}</h3>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        data.forEach(s => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        html += `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div style="border:1px solid #ccc; padding:10px; margin:10px 0;">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <strong>${s.tracking_number}</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <span style="background:#eee; padding:2px 10px;">${s.status || 'NEW'}</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <br>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ${s.pickup_location} → ${s.delivery_location}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <br>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <small>${s.material || s.material_goods}</small>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                `;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        result.innerHTML = html;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        // Load partners when page opens
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                loadPartners();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
