<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KRIM Customer — Shipments</title><meta name="description" content="View shipments belonging to your KRIM customer organization.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../config.js"></script>
<script>(function(){var p=location.pathname,b=p.indexOf("/logistics-saas/")===0?"/logistics-saas/":"/",l=document.createElement("link");l.rel="stylesheet";l.href=b+"core/krim-unified-page.css";document.head.appendChild(l)}())</script>
</head><body class="min-h-screen bg-slate-950 text-slate-100">
<header class="border-b border-slate-800 bg-slate-900"><div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between gap-4"><a href="../../index.html" class="font-extrabold">KRIM Logistics OS</a><a href="shipment-create.html" class="rounded-xl bg-sky-600 hover:bg-sky-500 px-4 py-2 text-sm font-bold">+ Create shipment</a></div></header>
<main class="max-w-5xl mx-auto px-4 py-10"><p class="text-xs uppercase tracking-widest text-sky-300 font-bold">Customer workspace</p><h1 class="text-3xl font-extrabold mt-2">My shipments</h1><p class="text-slate-400 text-sm mt-3">This list is loaded from your organization-scoped KRIM backend data. No sample shipments are displayed.</p>
<div id="status" role="status" aria-live="polite" class="my-6 text-sm text-slate-300">Loading secure session…</div><div id="shipments" class="space-y-4"></div></main>
<script>
(async function(){
const client=window.KRIM_SUPABASE||window.supabaseClient,status=document.getElementById("status"),container=document.getElementById("shipments");
function msg(t,bad=false){status.textContent=t;status.className="my-6 text-sm "+(bad?"text-rose-300":"text-slate-300")}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
try{
 if(!client)throw new Error("KRIM backend configuration did not load.");
 const {data:{session},error:authError}=await client.auth.getSession();if(authError)throw authError;if(!session){location.href="../../auth/login.html";return}
 const {data:members,error:memberError}=await client.from("krim_organization_members").select("organization_id").eq("user_id",session.user.id).eq("status","active");if(memberError)throw memberError;
 const ids=[...new Set((members||[]).map(x=>Number(x.organization_id)).filter(Number.isSafeInteger))];
 if(!ids.length)throw new Error("No active organization is linked to this account. Create a customer organization from the shipment creation page first.");
 const {data:orgs,error:orgError}=await client.from("krim_organizations").select("id,organization_type,status").in("id",ids).eq("status","active");if(orgError)throw orgError;
 const customerIds=(orgs||[]).filter(o=>["customer","shipper","enterprise"].includes(String(o.organization_type).toLowerCase())).map(o=>Number(o.id));
 if(!customerIds.length)throw new Error("No active customer organization is available for this account.");
 const {data:rows,error:shipmentError}=await client.from("krim_shipments").select("id,shipment_number,customer_organization_id,origin_location_id,destination_location_id,goods_description,total_weight_kg,status,created_at,estimated_delivery_at").in("customer_organization_id",customerIds).order("created_at",{ascending:false}).limit(100);
 if(shipmentError)throw shipmentError;
 if(!rows||!rows.length){msg("No shipments yet. Create your first shipment to start a genuine booking workflow.");return}
 const locationIds=[...new Set(rows.flatMap(s=>[Number(s.origin_location_id),Number(s.destination_location_id)]).filter(Number.isSafeInteger))];
 const {data:locs,error:locError}=locationIds.length?await client.from("krim_locations").select("id,city,state_region,location_code").in("id",locationIds):{data:[],error:null};if(locError)throw locError;
 const locMap=new Map((locs||[]).map(l=>[Number(l.id),[l.city,l.state_region,l.location_code].filter(Boolean).join(", ")]));
 container.innerHTML=rows.map(s=>{
 const statusText=String(s.status||"unknown").replace(/_/g," ");
 return '<article class="rounded-2xl border border-slate-800 bg-slate-900 p-5"><div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-3"><div><p class="text-xs text-sky-300 font-bold">'+esc(s.shipment_number||("Shipment #"+s.id))+'</p><h2 class="text-lg font-bold mt-2">'+esc(locMap.get(Number(s.origin_location_id))||"Origin")+' → '+esc(locMap.get(Number(s.destination_location_id))||"Destination")+'</h2><p class="text-sm text-slate-300 mt-2">'+esc(s.goods_description||"Cargo description not provided")+' · '+esc(s.total_weight_kg??"—")+' kg</p><p class="text-xs text-slate-500 mt-2">Created '+esc(s.created_at?new Date(s.created_at).toLocaleString():"—")+(s.estimated_delivery_at?" · Estimated delivery "+esc(new Date(s.estimated_delivery_at).toLocaleDateString()):"")+'</p></div><span class="self-start rounded-lg border border-slate-700 bg-slate-800 px-3 py-2 text-xs uppercase font-bold">'+esc(statusText)+'</span></div></article>';
 }).join("");
 msg("Loaded "+rows.length+" shipment(s) associated with your customer organization.");
}catch(e){msg(e.message||"Unable to load shipments.",true)}
})();
</script></body></html>
