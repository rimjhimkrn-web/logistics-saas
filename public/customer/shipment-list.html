<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRIM OS — Enterprise Shipment List</title>
    <meta name="description" content="Monitor active, in-transit, and completed institutional cargo shipments in KRIM OS.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../platform/krim-config.js"></script>
    <script src="../../platform/krim-navigation.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0284c7', 600: '#026f9e', 900: '#0f172a' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans antialiased">
    <header class="bg-slate-900/95 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-sky-600 to-slate-800 flex items-center justify-center text-white font-bold text-lg">K</div>
                <div>
                    <span class="text-base font-extrabold tracking-wide text-white uppercase">KRIM OS</span>
                    <span class="block text-[10px] tracking-widest text-sky-400 font-semibold uppercase">Shipment List</span>
                </div>
            </div>
            <a href="/public/customer/shipment-create.html" class="bg-sky-600 hover:bg-sky-500 text-white px-4 py-2 rounded-xl text-xs uppercase tracking-wider transition shadow-lg shadow-sky-600/20">Create Shipment</a>
        </div>
    </header>

    <main class="flex-grow max-w-6xl mx-auto px-6 py-12 w-full space-y-8">
        <div class="space-y-2">
            <span class="inline-block px-3 py-1 rounded-full text-[10px] font-mono font-semibold bg-sky-500/10 text-sky-400 border border-sky-500/20 uppercase tracking-widest">Active Manifests</span>
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Shipment Registry</h1>
            <p class="text-slate-400 text-xs font-mono">Real-time tracking and status overview of all corporate freight currently in transit or delivered.</p>
        </div>

        <div id="shipment-list-container" class="space-y-4 font-mono text-xs">
            <p class="text-slate-400">Loading authorized shipment records…</p>
        </div>
    </main>

    <footer class="bg-slate-900 border-t border-slate-800 py-8 text-xs text-slate-500 font-mono text-center">
        <p>KRIM Logistics OS Global Network © 2026. All rights reserved.</p>
    </footer>
    <script>
      const shipmentListClient = window.KRIM_SUPABASE || window.supabase.createClient(
        window.KRIM_CONFIG.supabase.url,
        window.KRIM_CONFIG.supabase.publishableKey,
        { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: "pkce" } }
      );
      window.KRIM_SUPABASE = shipmentListClient;
      const shipmentListContainer = document.getElementById("shipment-list-container");

      function shipmentEscape(value) {
        return String(value ?? "").replace(/[&<>"']/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[ch]);
      }

      async function loadCustomerShipments() {
        try {
          const { data: sessionData, error: sessionError } = await shipmentListClient.auth.getSession();
          if (sessionError) throw sessionError;
          const session = sessionData?.session;
          if (!session) {
            window.location.assign(window.KRIM_ROUTE("auth/login.html"));
            return;
          }

          let { data: membership, error: membershipError } = await shipmentListClient
            .from("krim_organization_members")
            .select("organization_id")
            .eq("user_id", session.user.id)
            .eq("status", "active")
            .limit(1)
            .maybeSingle();
          if (membershipError) throw membershipError;
          let organizationId = membership?.organization_id;
          if (!organizationId) {
            const legalName = String(session.user.user_metadata?.organization_name || session.user.user_metadata?.company_name || (session.user.email || "KRIM Customer").split("@")[0] + " Workspace").trim();
            const { data, error } = await shipmentListClient.rpc("krim_provision_customer_organization", { p_legal_name: legalName });
            if (error) throw error;
            organizationId = data;
          }
          if (!organizationId) throw new Error("No active customer organization is available.");

          const { data: shipments, error: shipmentError } = await shipmentListClient
            .from("krim_shipments")
            .select("id, shipment_number, origin_location_id, destination_location_id, goods_description, total_weight_kg, status, created_at, estimated_delivery_at, actual_delivery_at")
            .eq("customer_organization_id", organizationId)
            .order("created_at", { ascending: false })
            .limit(100);
          if (shipmentError) throw shipmentError;
          if (!shipments?.length) {
            shipmentListContainer.innerHTML = '<div class="bg-slate-800 border border-slate-700 rounded-3xl p-8 text-center"><p class="text-slate-300">No shipments have been created for this organization yet.</p><a href="' + window.KRIM_ROUTE("public/shipper/booking-request.html") + '" class="inline-block mt-4 bg-sky-600 hover:bg-sky-500 text-white px-4 py-2 rounded-xl">Create your first shipment →</a></div>';
            return;
          }

          const locationIds = [...new Set(shipments.flatMap(s => [s.origin_location_id, s.destination_location_id]).filter(Boolean))];
          let locations = [];
          if (locationIds.length) {
            const result = await shipmentListClient.from("krim_locations").select("id, location_code, city, state_region").in("id", locationIds);
            if (!result.error) locations = result.data || [];
          }
          const locationMap = new Map(locations.map(item => [String(item.id), [item.location_code, item.city, item.state_region].filter(Boolean).join(" — ")]));
          shipmentListContainer.innerHTML = shipments.map(shipment => {
            const status = String(shipment.status || "unknown");
            const statusClass = ["delivered","closed","completed"].includes(status.toLowerCase())
              ? "bg-emerald-500/15 text-emerald-400 border-emerald-500/30"
              : ["cancelled","failed"].includes(status.toLowerCase())
                ? "bg-rose-500/15 text-rose-300 border-rose-500/30"
                : "bg-sky-500/15 text-sky-400 border-sky-500/30";
            const origin = locationMap.get(String(shipment.origin_location_id)) || ("Location #" + shipment.origin_location_id);
            const destination = locationMap.get(String(shipment.destination_location_id)) || ("Location #" + shipment.destination_location_id);
            const route = window.KRIM_ROUTE("public/customer/shipment-details.html?shipment_id=" + encodeURIComponent(shipment.id));
            return '<div class="bg-slate-800 border border-slate-700 rounded-3xl p-6 shadow-xl flex flex-col md:flex-row items-start md:items-center justify-between gap-6">' +
              '<div class="space-y-2"><div class="flex flex-wrap items-center gap-3"><span class="font-bold text-white text-base">#' + shipmentEscape(shipment.shipment_number || shipment.id) + '</span><span class="px-2.5 py-0.5 ' + statusClass + ' font-bold rounded-md border text-[10px] uppercase">' + shipmentEscape(status) + '</span></div>' +
              '<p class="text-slate-400 text-[11px]">' + shipmentEscape(origin) + ' → ' + shipmentEscape(destination) + '</p>' +
              '<p class="text-slate-500 text-[11px]">' + shipmentEscape(shipment.goods_description || "Cargo details pending") + ' • ' + shipmentEscape(shipment.total_weight_kg || "—") + ' kg</p></div>' +
              '<div class="flex items-center space-x-3 w-full md:w-auto justify-end"><a href="' + route + '" class="bg-slate-700 hover:bg-slate-600 text-slate-200 border border-slate-600 px-4 py-2.5 rounded-xl uppercase tracking-wider transition text-center">View Details →</a></div></div>';
          }).join("");
        } catch (error) {
          shipmentListContainer.textContent = "Unable to load shipments: " + (error?.message || "Unknown error");
          shipmentListContainer.className = "space-y-4 font-mono text-xs text-rose-300";
        }
      }
      loadCustomerShipments();
    </script>
</body>
</html>
