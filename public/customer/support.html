<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRIM OS — Enterprise Helpdesk & Support Center</title>
    <meta name="description" content="Access 24/7 institutional logistics support, emergency dispatch intervention, and escalation ticketing inside KRIM OS.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../platform/krim-config.js"></script>
    <script src="../../platform/krim-navigation.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0284c7', 600: '#026f9e', 900: '#0f172a' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans antialiased">
    <header class="bg-slate-900/95 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-sky-600 to-slate-900 flex items-center justify-center text-white font-bold text-lg">K</div>
                <div>
                    <span class="text-base font-extrabold tracking-wide text-white uppercase">KRIM OS</span>
                    <span class="block text-[10px] tracking-widest text-sky-400 font-semibold uppercase">Support & Escalations</span>
                </div>
            </div>
            <a href="/public/customer/reorder.html" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-4 py-2 rounded-xl text-xs uppercase tracking-wider transition">Next: Reorder →</a>
        </div>
    </header>

    <main class="flex-grow max-w-4xl mx-auto px-6 py-12 w-full space-y-8">
        <div class="space-y-2">
            <span class="inline-block px-3 py-1 rounded-full text-[10px] font-mono font-semibold bg-sky-500/10 text-sky-400 border border-sky-500/20 uppercase tracking-widest">24/7 Control Tower</span>
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Enterprise Helpdesk & Support</h1>
            <p class="text-slate-400 text-xs font-mono">Open priority escalation tickets, connect with logistics controllers, and manage emergency route interventions.</p>
        </div>

        <div class="bg-slate-800 border border-slate-700 rounded-3xl p-8 shadow-xl space-y-6 font-mono text-xs">
            <form id="support-ticket-form" class="space-y-5">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="block text-slate-400 uppercase tracking-wider">Issue Category</label>
                        <select id="support-category" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-sky-500 transition">
                            <option value="shipment_interruption">Live Shipment Interruption / Delay</option>
                            <option value="billing_discrepancy">Billing Discrepancy</option>
                            <option value="carrier_communication">Carrier Communication Failure</option>
                            <option value="technical_platform">Technical API / Platform Issue</option>
                        </select>
                    </div>
                    <div class="space-y-2">
                        <label class="block text-slate-400 uppercase tracking-wider">Priority Level</label>
                        <select id="support-priority" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-sky-500 transition">
                            <option value="critical">P1 — Critical Emergency</option>
                            <option value="high">P2 — High Urgency</option>
                            <option value="normal" selected>P3 — Standard Inquiry</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-2">
                    <label for="support-subject" class="block text-slate-400 uppercase tracking-wider">Subject</label>
                    <input id="support-subject" type="text" maxlength="200" required placeholder="Briefly describe the issue" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-sky-500 transition">
                </div>
                <div class="space-y-2">
                    <label for="support-shipment-id" class="block text-slate-400 uppercase tracking-wider">Shipment ID (optional)</label>
                    <input id="support-shipment-id" type="number" min="1" placeholder="KRIM shipment ID" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-sky-500 transition">
                </div>
                <div class="space-y-2">
                    <label for="support-message" class="block text-slate-400 uppercase tracking-wider">Detailed Description</label>
                    <textarea id="support-message" rows="4" required maxlength="10000" placeholder="Describe what happened and what help you need…" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-4 text-white focus:outline-none focus:border-sky-500 transition resize-none"></textarea>
                </div>
                <div id="support-ticket-feedback" role="status" aria-live="polite" class="text-sm text-slate-300 break-words"></div>

                <button type="submit" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-semibold py-4 rounded-xl text-xs uppercase tracking-wider transition shadow-lg shadow-sky-600/25 cursor-pointer">
                    Submit Priority Ticket to Control Tower →
                </button>
            </form>
        </div>
    </main>

    <footer class="bg-slate-900 border-t border-slate-800 py-8 text-xs text-slate-500 font-mono text-center">
        <p>KRIM Logistics OS Global Network © 2026. All rights reserved.</p>
    </footer>

    <script>
      const supportClient = window.KRIM_SUPABASE || window.supabase.createClient(
        window.KRIM_CONFIG.supabase.url,
        window.KRIM_CONFIG.supabase.publishableKey,
        { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: "pkce" } }
      );
      window.KRIM_SUPABASE = supportClient;
      const supportForm = document.getElementById("support-ticket-form");
      const supportButton = supportForm.querySelector('button[type="submit"]');
      const supportFeedback = document.getElementById("support-ticket-feedback");
      supportForm.addEventListener("submit", async function(event) {
        event.preventDefault();
        supportButton.disabled = true;
        supportButton.textContent = "Submitting secure support ticket…";
        try {
          const { data: sessionData, error: sessionError } = await supportClient.auth.getSession();
          if (sessionError) throw sessionError;
          const session = sessionData?.session;
          if (!session) {
            window.location.assign(window.KRIM_ROUTE("auth/login.html"));
            return;
          }
          const { data: membership, error: membershipError } = await supportClient
            .from("krim_organization_members").select("organization_id")
            .eq("user_id", session.user.id).eq("status", "active").limit(1).maybeSingle();
          if (membershipError) throw membershipError;
          if (!membership?.organization_id) throw new Error("An active organization membership is required to open an organization support ticket.");

          const shipmentValue = document.getElementById("support-shipment-id").value.trim();
          let krimShipmentId = null;
          if (shipmentValue) {
            if (!/^\d+$/.test(shipmentValue)) throw new Error("Shipment ID must be a number.");
            const { data: shipment, error: shipmentError } = await supportClient
              .from("krim_shipments").select("id")
              .eq("id", Number(shipmentValue))
              .eq("customer_organization_id", membership.organization_id)
              .maybeSingle();
            if (shipmentError) throw shipmentError;
            if (!shipment) throw new Error("That shipment does not belong to your active organization or is not accessible.");
            krimShipmentId = shipment.id;
          }

          const payload = {
            user_id: session.user.id,
            krim_organization_id: membership.organization_id,
            krim_shipment_id: krimShipmentId,
            category: document.getElementById("support-category").value,
            priority: document.getElementById("support-priority").value,
            subject: document.getElementById("support-subject").value.trim(),
            message: document.getElementById("support-message").value.trim(),
            status: "open"
          };
          if (!payload.subject || payload.subject.length > 200) throw new Error("Subject must be between 1 and 200 characters.");
          if (!payload.message || payload.message.length > 10000) throw new Error("Message must be between 1 and 10,000 characters.");
          const { data: ticket, error: insertError } = await supportClient
            .from("support_tickets")
            .insert(payload)
            .select("id, ticket_number, status, created_at")
            .single();
          if (insertError) throw insertError;
          supportFeedback.textContent = "Support ticket created: " + (ticket.ticket_number || ("#" + ticket.id)) + " · Status: " + ticket.status + ". Keep this reference for follow-up.";
          supportFeedback.className = "text-sm text-emerald-300 break-words";
          supportButton.textContent = "Ticket Submitted ✓";
          supportForm.reset();
        } catch (error) {
          supportFeedback.textContent = "Ticket submission failed: " + (error?.message || "Unknown error");
          supportFeedback.className = "text-sm text-rose-300 break-words";
          supportButton.disabled = false;
          supportButton.textContent = "Submit Priority Ticket to Control Tower →";
        }
      });
    </script>
</body>
  </html>
