<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRIM OS — Customer Portal Onboarding</title>
    <meta name="description" content="Initialize your institutional shipper profile and tenant workspace within KRIM OS.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0284c7', 600: '#026f9e', 900: '#0f172a' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
                }
            }
        }
    </script>

<!-- KRIM_UNIFIED_LIGHT_THEME_BATCH_2 -->
<script>(function(){var p=location.pathname;var b=p.indexOf("/logistics-saas/")===0?"/logistics-saas/":"/";var l=document.createElement("link");l.rel="stylesheet";l.href=b+"core/krim-unified-page.css";document.head.appendChild(l);}());</script>

<!-- KRIM_CUSTOMER_FLOW_NAV -->
<link rel="stylesheet" href="/logistics-saas/core/krim-customer-workflow.css">
<script defer src="/logistics-saas/core/krim-customer-workflow.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans antialiased">
    <header class="bg-slate-900/95 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-sky-600 to-slate-800 flex items-center justify-center text-white font-bold text-lg">K</div>
                <div>
                    <span class="text-base font-extrabold tracking-wide text-white uppercase">KRIM OS</span>
                    <span class="block text-[10px] tracking-widest text-sky-400 font-semibold uppercase">Customer Onboarding</span>
                </div>
            </div>
            <a href="/logistics-saas/customer/workspace.html" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-4 py-2 rounded-xl text-xs uppercase tracking-wider transition">Return to Workspace</a>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center px-6 py-16">
        <div class="w-full max-w-xl bg-slate-800 border border-slate-700 rounded-3xl p-8 sm:p-10 shadow-2xl space-y-8">
            <div class="space-y-2 text-center">
                <span class="inline-block px-3 py-1 rounded-full text-[10px] font-mono font-semibold bg-sky-500/10 text-sky-400 border border-sky-500/20 uppercase tracking-widest">Step 1 of 4</span>
                <h1 class="text-2xl font-extrabold text-white tracking-tight">Shipper Onboarding</h1>
                <p class="text-slate-400 text-xs font-mono">Setup your organizational logistics profile and supply chain credentials.</p>
            </div>

            <form onsubmit="handleOnboarding(event)" class="space-y-5 font-mono text-xs">
                <div class="space-y-2">
                    <label class="block text-slate-400 uppercase tracking-wider">Legal Entity Name</label>
                    <input type="text" required placeholder="Acme Global Logistics Pvt Ltd" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-sky-500 transition">
                </div>

                <div class="space-y-2">
                    <label class="block text-slate-400 uppercase tracking-wider">Tax ID / GSTIN / VAT Number</label>
                    <input type="text" required placeholder="27AAACA1234A1Z5" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-sky-500 transition">
                </div>

                <div class="space-y-2">
                    <label class="block text-slate-400 uppercase tracking-wider">Primary Operating Node</label>
                    <select class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-sky-500 transition">
                        <option>AP-SOUTH-1 (Mumbai Hub)</option>
                        <option>EU-CENTRAL-1 (Frankfurt Hub)</option>
                        <option>US-EAST-1 (Virginia Hub)</option>
                    </select>
                </div>

                <button type="submit" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-semibold py-4 rounded-xl text-xs uppercase tracking-wider transition shadow-lg shadow-sky-600/25 cursor-pointer">
                    Proceed to Company Profile →
                </button>
            </form>
        </div>
    </main>

    <footer class="bg-slate-900 border-t border-slate-800 py-8 text-xs text-slate-500 font-mono text-center">
        <p>KRIM Logistics OS Global Network © 2026. All rights reserved.</p>
    </footer>

    <script>
        function handleOnboarding(e) {
            e.preventDefault();
            alert('Shipper entity registered successfully in Supabase tenant database.');
            window.location.href = '/public/customer/company-profile.html';
        }
    </script>
</body>
</html>
