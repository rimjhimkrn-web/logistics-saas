<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRIM OS — Enterprise Carrier Ratings & Reviews</title>
    <meta name="description" content="Rate carrier performance, punctuality, and equipment quality inside KRIM OS.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0284c7', 600: '#026f9e', 900: '#0f172a' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans antialiased">
    <header class="bg-slate-900/95 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-600 to-slate-900 flex items-center justify-center text-white font-bold text-lg">K</div>
                <div>
                    <span class="text-base font-extrabold tracking-wide text-white uppercase">KRIM OS</span>
                    <span class="block text-[10px] tracking-widest text-amber-400 font-semibold uppercase">Ratings & Reviews</span>
                </div>
            </div>
            <a href="/public/customer/support.html" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-4 py-2 rounded-xl text-xs uppercase tracking-wider transition">Next: Support →</a>
        </div>
    </header>

    <main class="flex-grow max-w-4xl mx-auto px-6 py-12 w-full space-y-8">
        <div class="space-y-2">
            <span class="inline-block px-3 py-1 rounded-full text-[10px] font-mono font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20 uppercase tracking-widest">Carrier Performance Scorecard</span>
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Rate Carrier & Fleet Partners</h1>
            <p class="text-slate-400 text-xs font-mono">Submit punctuality, equipment compliance, and driver professionalism ratings for completed shipments.</p>
        </div>

        <div class="bg-slate-800 border border-slate-700 rounded-3xl p-8 shadow-xl space-y-6 font-mono text-xs">
            <form onsubmit="handleReviewSubmit(event)" class="space-y-5">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="block text-slate-400 uppercase tracking-wider">Shipment Reference</label>
                        <select class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500 transition">
                            <option>#SHP-2026-8841 (TransGlobal Fleet)</option>
                            <option>#SHP-2026-8790 (Apex Express)</option>
                        </select>
                    </div>
                    <div class="space-y-2">
                        <label class="block text-slate-400 uppercase tracking-wider">Overall Carrier Score</label>
                        <select class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500 transition">
                            <option>⭐⭐⭐⭐⭐ (5.0 - Exceptional Institutional SLA)</option>
                            <option>⭐⭐⭐⭐ (4.0 - Reliable Performance)</option>
                            <option>⭐⭐⭐ (3.0 - Minor Delays / Acceptable)</option>
                            <option>⭐⭐ (2.0 - Non-Compliant)</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="block text-slate-400 uppercase tracking-wider">Detailed Performance Feedback</label>
                    <textarea rows="4" required placeholder="Describe driver communication, on-time arrival precision, and seal condition upon delivery..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-4 text-white focus:outline-none focus:border-amber-500 transition resize-none"></textarea>
                </div>

                <button type="submit" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-semibold py-4 rounded-xl text-xs uppercase tracking-wider transition shadow-lg shadow-amber-600/25 cursor-pointer">
                    Publish Carrier Scorecard →
                </button>
            </form>
        </div>
    </main>

    <footer class="bg-slate-900 border-t border-slate-800 py-8 text-xs text-slate-500 font-mono text-center">
        <p>KRIM Logistics OS Global Network © 2026. All rights reserved.</p>
    </footer>

    <script>
        function handleReviewSubmit(e) {
            e.preventDefault();
            alert('Carrier rating published successfully to network reliability ledger. Proceeding to Support module.');
            window.location.href = '/public/customer/support.html';
        }
    </script>
</body>
  </html>
