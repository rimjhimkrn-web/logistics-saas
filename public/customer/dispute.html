<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRIM OS — Enterprise Dispute & Exception Management</title>
    <meta name="description" content="Log cargo discrepancies, transit delays, or insurance claims for completed or active shipments in KRIM OS.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0284c7', 600: '#026f9e', 900: '#0f172a' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
                }
            }
        }
    </script>

<!-- KRIM_UNIFIED_LIGHT_THEME_BATCH_2 -->
<script>(function(){var p=location.pathname;var b=p.indexOf("/logistics-saas/")===0?"/logistics-saas/":"/";var l=document.createElement("link");l.rel="stylesheet";l.href=b+"core/krim-unified-page.css";document.head.appendChild(l);}());</script>

<!-- KRIM_CUSTOMER_FLOW_NAV -->
<link rel="stylesheet" href="/logistics-saas/core/krim-customer-workflow.css">
<script defer src="/logistics-saas/core/krim-customer-workflow.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans antialiased">
    <header class="bg-slate-900/95 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-rose-600 to-slate-900 flex items-center justify-center text-white font-bold text-lg">K</div>
                <div>
                    <span class="text-base font-extrabold tracking-wide text-white uppercase">KRIM OS</span>
                    <span class="block text-[10px] tracking-widest text-rose-400 font-semibold uppercase">Dispute Resolution</span>
                </div>
            </div>
            <a href="/logistics-saas/public/customer-os/customer-services/shipment-list.html" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-4 py-2 rounded-xl text-xs uppercase tracking-wider transition">Return to Registry</a>
        </div>
    </header>

    <main class="flex-grow max-w-4xl mx-auto px-6 py-12 w-full space-y-8">
        <div class="space-y-2">
            <span class="inline-block px-3 py-1 rounded-full text-[10px] font-mono font-semibold bg-rose-500/10 text-rose-400 border border-rose-500/20 uppercase tracking-widest">Exception Management</span>
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Open Freight Dispute or Claim</h1>
            <p class="text-slate-400 text-xs font-mono">File an insurance claim, report cargo damage, or flag escrow hold discrepancies for audit review.</p>
        </div>

        <div class="bg-slate-800 border border-slate-700 rounded-3xl p-8 shadow-xl space-y-6 font-mono text-xs">
            <form onsubmit="handleDisputeSubmit(event)" class="space-y-5">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="block text-slate-400 uppercase tracking-wider">Shipment Reference</label>
                        <select class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-sky-500 transition">
                            <option>#SHP-2026-8841 (TransGlobal Fleet)</option>
                            <option>#SHP-2026-8790 (Apex Express)</option>
                        </select>
                    </div>
                    <div class="space-y-2">
                        <label class="block text-slate-400 uppercase tracking-wider">Dispute Category</label>
                        <select class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-sky-500 transition">
                            <option>Cargo Damage / Shortage Claim</option>
                            <option>Severe Transit Delay (> 6 Hours)</option>
                            <option>Tampered Bolt Seal / Security Breach</option>
                            <option>Billing / Toll Overcharge Dispute</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="block text-slate-400 uppercase tracking-wider">Incident Description & Evidence Notes</label>
                    <textarea rows="4" required placeholder="Describe the discrepancy in detail. Attach photographic evidence or seal verification logs..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-4 text-white focus:outline-none focus:border-sky-500 transition resize-none"></textarea>
                </div>

                <button type="submit" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-semibold py-4 rounded-xl text-xs uppercase tracking-wider transition shadow-lg shadow-rose-600/25 cursor-pointer">
                    Submit Dispute to Arbitration Vault →
                </button>
            </form>
        </div>
    </main>

    <footer class="bg-slate-900 border-t border-slate-800 py-8 text-xs text-slate-500 font-mono text-center">
        <p>KRIM Logistics OS Global Network © 2026. All rights reserved.</p>
    </footer>

    <script>
        function handleDisputeSubmit(e) {
            e.preventDefault();
            alert('Dispute logged successfully in Supabase arbitration vault. Support team and underwriter notified.');
            window.location.href = '/logistics-saas/public/customer-os/customer-services/shipment-list.html';
        }
    </script>
</body>
</html>
