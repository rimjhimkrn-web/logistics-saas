<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRIM OS — Enterprise Shipment Creation</title>
    <meta name="description" content="Manually initialize and dispatch a new institutional cargo shipment in KRIM OS.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../platform/krim-config.js"></script>
    <script src="../../platform/krim-navigation.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0284c7', 600: '#026f9e', 900: '#0f172a' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans antialiased">
    <header class="bg-slate-900/95 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-sky-600 to-slate-800 flex items-center justify-center text-white font-bold text-lg">K</div>
                <div>
                    <span class="text-base font-extrabold tracking-wide text-white uppercase">KRIM OS</span>
                    <span class="block text-[10px] tracking-widest text-sky-400 font-semibold uppercase">Shipment Creation</span>
                </div>
            </div>
            <a href="/public/customer/booking-confirmation.html" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-4 py-2 rounded-xl text-xs uppercase tracking-wider transition">Back to Confirmation</a>
        </div>
    </header>

    <main class="flex-grow max-w-4xl mx-auto px-6 py-12 w-full space-y-8">
        <div class="space-y-2">
            <span class="inline-block px-3 py-1 rounded-full text-[10px] font-mono font-semibold bg-sky-500/10 text-sky-400 border border-sky-500/20 uppercase tracking-widest">Manual Dispatch</span>
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Create New Shipment</h1>
            <p class="text-slate-400 text-xs font-mono">Manually provision a cargo manifest and route plan directly into the dispatch engine.</p>
        </div>

        <div class="bg-slate-800 border border-slate-700 rounded-3xl p-8 shadow-xl space-y-6 font-mono text-xs">
            <form id="shipment-create-form" class="space-y-5">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label for="shipment-origin" class="block text-slate-400 uppercase tracking-wider">Origin Warehouse</label>
                        <select id="shipment-origin" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-sky-500 transition"><option value="">Loading locations…</option></select>
                    </div>
                    <div class="space-y-2">
                        <label for="shipment-destination" class="block text-slate-400 uppercase tracking-wider">Destination Facility</label>
                        <select id="shipment-destination" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-sky-500 transition"><option value="">Loading locations…</option></select>
                    </div>
                </div>
                <div class="space-y-2">
                    <label for="shipment-goods" class="block text-slate-400 uppercase tracking-wider">Cargo Description</label>
                    <input id="shipment-goods" type="text" required maxlength="500" placeholder="Industrial components, packaged goods…" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-sky-500 transition">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label for="shipment-weight" class="block text-slate-400 uppercase tracking-wider">Cargo Weight (KG)</label>
                        <input id="shipment-weight" type="number" min="0.01" step="0.01" required placeholder="18500" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-sky-500 transition">
                    </div>
                    <div class="space-y-2">
                        <label for="shipment-service-tier" class="block text-slate-400 uppercase tracking-wider">Requested Service Tier</label>
                        <select id="shipment-service-tier" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-sky-500 transition">
                            <option value="surface_express">Surface Express</option>
                            <option value="air_priority">Air Priority</option>
                            <option value="heavy_haul">Heavy Haul</option>
                        </select>
                    </div>
                </div>
                <div id="shipment-create-feedback" role="status" aria-live="polite" class="text-sm text-slate-300 break-words"></div>
                <button id="shipment-create-submit" type="submit" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-semibold py-4 rounded-xl text-xs uppercase tracking-wider transition shadow-lg shadow-sky-600/25 cursor-pointer">
                    Create Shipment & Request Quote →
                </button>
            </form>
        </div>
    </main>

    <footer class="bg-slate-900 border-t border-slate-800 py-8 text-xs text-slate-500 font-mono text-center">
        <p>KRIM Logistics OS Global Network © 2026. All rights reserved.</p>
    </footer>

    <script>
      const shipmentClient = window.KRIM_SUPABASE || window.supabase.createClient(
        window.KRIM_CONFIG.supabase.url,
        window.KRIM_CONFIG.supabase.publishableKey,
        { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: "pkce" } }
      );
      window.KRIM_SUPABASE = shipmentClient;
      const shipmentFeedback = document.getElementById("shipment-create-feedback");
      const shipmentSubmit = document.getElementById("shipment-create-submit");
      let shipmentOrganizationId = null;

      function shipmentMessage(text, type = "error") {
        shipmentFeedback.textContent = text;
        shipmentFeedback.className = "text-sm break-words " + (type === "success" ? "text-emerald-300" : type === "info" ? "text-sky-300" : "text-rose-300");
      }

      async function initShipmentCreate() {
        try {
          const { data: sessionData, error: sessionError } = await shipmentClient.auth.getSession();
          if (sessionError) throw sessionError;
          const session = sessionData?.session;
          if (!session) {
            window.location.assign(window.KRIM_ROUTE("auth/login.html"));
            return;
          }
          const legalName = String(session.user.user_metadata?.organization_name || session.user.user_metadata?.company_name || (session.user.email || "KRIM Customer").split("@")[0] + " Workspace").trim();
          const { data: organizationId, error: orgError } = await shipmentClient.rpc(
            "krim_provision_customer_organization",
            { p_legal_name: legalName }
          );
          if (orgError) throw orgError;
          shipmentOrganizationId = organizationId;
          const { data: locations, error: locationError } = await shipmentClient
            .from("krim_locations")
            .select("id, location_code, city, state_region")
            .eq("is_active", true)
            .order("city", { ascending: true });
          if (locationError) throw locationError;
          if (!locations || locations.length < 2) throw new Error("At least two active locations must be configured before creating shipments.");

          const origin = document.getElementById("shipment-origin");
          const destination = document.getElementById("shipment-destination");
          const optionHtml = locations.map(location => {
            const label = [location.location_code, location.city, location.state_region].filter(Boolean).join(" — ");
            return { id: String(location.id), label };
          });
          [origin, destination].forEach(select => {
            select.innerHTML = "";
            select.add(new Option("Select a location", ""));
            optionHtml.forEach(item => select.add(new Option(item.label, item.id)));
          });
          shipmentMessage("Choose valid locations and enter cargo details. Shipment creation is handled by KRIM's backend.", "info");
        } catch (error) {
          shipmentMessage("Shipment setup failed: " + (error?.message || "Unknown error"));
          shipmentSubmit.disabled = true;
        }
      }

      document.getElementById("shipment-create-form").addEventListener("submit", async function (event) {
        event.preventDefault();
        if (shipmentSubmit.disabled) return;
        shipmentSubmit.disabled = true;
        shipmentSubmit.textContent = "Creating shipment on KRIM…";
        try {
          const originId = Number(document.getElementById("shipment-origin").value);
          const destinationId = Number(document.getElementById("shipment-destination").value);
          const goods = document.getElementById("shipment-goods").value.trim();
          const weight = Number(document.getElementById("shipment-weight").value);
          const tier = document.getElementById("shipment-service-tier").value;
          if (!Number.isInteger(originId) || originId <= 0 || !Number.isInteger(destinationId) || destinationId <= 0 || originId === destinationId) throw new Error("Choose two different active locations.");
          if (!goods || goods.length > 500) throw new Error("Enter a cargo description of 1–500 characters.");
          if (!Number.isFinite(weight) || weight <= 0) throw new Error("Enter a weight greater than zero.");

          const { data, error } = await shipmentClient.rpc("krim_create_global_shipment", {
            p_customer_organization_id: shipmentOrganizationId,
            p_origin_location_id: originId,
            p_destination_location_id: destinationId,
            p_goods_description: goods,
            p_total_weight_kg: weight
          });
          if (error) throw error;
          const shipmentId = Array.isArray(data) ? (data[0]?.id || data[0]?.shipment_id) : (data?.id || data?.shipment_id);
          if (!shipmentId) throw new Error("The server did not return a shipment reference.");
          shipmentMessage("Shipment created. Opening server-side quote calculation…", "success");
          window.location.assign(window.KRIM_ROUTE("public/shipper/rate-calculator.html?shipment_id=" + encodeURIComponent(shipmentId) + "&service_tier=" + encodeURIComponent(tier)));
        } catch (error) {
          shipmentMessage("Shipment creation failed: " + (error?.message || "Unknown error"));
          shipmentSubmit.disabled = false;
          shipmentSubmit.textContent = "Create Shipment & Request Quote →";
        }
      });
      initShipmentCreate();
    </script>
</body>
</html>
