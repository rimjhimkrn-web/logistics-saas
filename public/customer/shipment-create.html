<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KRIM Logistics OS — Create Shipment</title>
  <meta name="description" content="Create a shipment in KRIM's global logistics operating system.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../config.js"></script>
  <script>(function(){var p=location.pathname;var b=p.indexOf("/logistics-saas/")===0?"/logistics-saas/":"/";var l=document.createElement("link");l.rel="stylesheet";l.href=b+"core/krim-unified-page.css";document.head.appendChild(l);}());</script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
<header class="border-b border-slate-800 bg-slate-900/95">
  <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
    <a href="../../index.html" class="font-extrabold tracking-wide">KRIM Logistics OS</a>
    <a href="shipment-list.html" class="text-sm text-sky-300 hover:underline">My shipments</a>
  </div>
</header>
<main class="flex-grow max-w-3xl mx-auto px-4 py-10 w-full">
  <div class="mb-7">
    <p class="text-xs uppercase tracking-widest text-sky-300 font-semibold">Customer workspace</p>
    <h1 class="text-3xl font-bold mt-2">Create a shipment</h1>
    <p class="text-slate-400 mt-2 text-sm">Shipment creation and partner-network request are processed by KRIM's backend. No demo booking or fake success messages.</p>
  </div>
  <form id="shipment-form" class="rounded-2xl border border-slate-800 bg-slate-900 p-5 sm:p-7 space-y-5">
    <div class="grid sm:grid-cols-2 gap-4">
      <label class="block text-sm">Origin location
        <select id="origin-id" required class="mt-2 w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-3 text-white"><option value="">Loading locations…</option></select>
      </label>
      <label class="block text-sm">Destination location
        <select id="destination-id" required class="mt-2 w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-3 text-white"><option value="">Loading locations…</option></select>
      </label>
    </div>
    <label class="block text-sm">Cargo description
      <input id="goods-description" required maxlength="500" placeholder="e.g. Packaged consumer goods" class="mt-2 w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-3 text-white">
    </label>
    <div class="grid sm:grid-cols-2 gap-4">
      <label class="block text-sm">Cargo weight (kg)
        <input id="weight-kg" type="number" required min="0.01" max="1000000000" step="0.01" placeholder="e.g. 1200" class="mt-2 w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-3 text-white">
      </label>
      <label class="block text-sm">Service tier
        <select id="service-tier" required class="mt-2 w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-3 text-white">
          <option value="surface_express">Surface / road express</option>
          <option value="air_priority">Air priority</option>
          <option value="heavy_haul">Heavy haul</option>
        </select>
      </label>
    </div>
    <p id="shipment-feedback" role="status" aria-live="polite" class="text-sm text-slate-300"></p>
    <button id="create-shipment-button" type="submit" disabled class="w-full rounded-xl bg-sky-600 hover:bg-sky-500 disabled:opacity-50 disabled:cursor-not-allowed px-4 py-3 font-bold">Loading secure session…</button>
  </form>
</main>
<footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">KRIM Logistics OS © 2026</footer>
<script>
(function(){
  const client = window.KRIM_SUPABASE || window.supabaseClient;
  const form = document.getElementById("shipment-form");
  const button = document.getElementById("create-shipment-button");
  const feedback = document.getElementById("shipment-feedback");
  let session = null;
  let customerOrganizationId = null;
  let locationsReady = false;
  function message(text, kind) {
    feedback.textContent = text;
    feedback.className = "text-sm " + (kind === "success" ? "text-emerald-300" : kind === "info" ? "text-sky-300" : "text-rose-300");
  }
  function locationLabel(row, countries) {
    const country = countries.get(Number(row.country_id));
    return [row.city, row.state_region || row.region, country ? country.name : "Country pending", row.location_code].filter(Boolean).join(" — ");
  }
  async function initialize() {
    try {
      if (!client) throw new Error("KRIM backend configuration did not load. Refresh and try again.");
      const {data: authData, error: authError} = await client.auth.getSession();
      if (authError) throw authError;
      session = authData.session;
      if (!session) {
        window.location.href = "../../auth/login.html";
        return;
      }
      const {data: memberships, error: membershipError} = await client.from("krim_organization_members")
        .select("organization_id").eq("user_id", session.user.id).eq("status", "active");
      if (membershipError) throw membershipError;
      const ids = [...new Set((memberships || []).map(x => Number(x.organization_id)).filter(Number.isSafeInteger))];
      const {data: organizations, error: orgError} = ids.length
        ? await client.from("krim_organizations").select("id, organization_type, status").in("id", ids).eq("status", "active")
        : {data: [], error: null};
      if (orgError) throw orgError;
      let customerOrg = (organizations || []).find(o => ["customer","shipper","enterprise"].includes(String(o.organization_type).toLowerCase()));
      if (!customerOrg) {
        const accountType = String(session.user.user_metadata?.krim_account_type || session.user.app_metadata?.krim_account_type || "").toLowerCase();
        if (["partner","carrier","warehouse","forwarder"].includes(accountType) ||
            (organizations || []).some(o => ["partner","carrier","warehouse","forwarder"].includes(String(o.organization_type).toLowerCase()))) {
          throw new Error("This account belongs to a logistics partner. Use the Partner workspace to submit bids; customer shipment creation is separate.");
        }
        const metadata = session.user.user_metadata || {};
        const legalName = String(metadata.company_name || metadata.organization_name || metadata.full_name || session.user.email?.split("@")[0] || "").trim();
        if (legalName.length < 2) throw new Error("Complete your profile with a company or organization name before creating a shipment.");
        const {data: provisionedId, error: provisionError} = await client.rpc("krim_provision_customer_organization", {p_legal_name: legalName.slice(0, 200)});
        if (provisionError) throw new Error("Customer organization setup failed: " + provisionError.message);
        customerOrganizationId = Number(provisionedId);
        if (!Number.isSafeInteger(customerOrganizationId) || customerOrganizationId <= 0) {
          throw new Error("Customer organization setup returned an invalid reference. Please sign in again.");
        }
      } else {
        customerOrganizationId = Number(customerOrg.id);
      }
      const {data: locations, error: locationError} = await client.from("krim_locations")
        .select("id, country_id, city, region, state_region, location_code").eq("is_active", true).order("city");
      if (locationError) throw locationError;
      if (!locations || locations.length < 2) throw new Error("KRIM needs at least two active configured locations before a shipment can be created.");
      const {data: countryRows, error: countryError} = await client.from("krim_countries")
        .select("id, name, code").eq("is_active", true);
      if (countryError) throw countryError;
      const countryMap = new Map((countryRows || []).map(country => [Number(country.id), country]));
      const distinctCountries = new Set(locations.map(loc => Number(loc.country_id)).filter(Boolean));
      if (distinctCountries.size < 2) {
        message("Location catalogue currently covers only one country. Global city options are being prepared; check back shortly.", "info");
      }
      for (const selectId of ["origin-id","destination-id"]) {
        const select = document.getElementById(selectId);
        select.replaceChildren(new Option("Select location", ""));
        locations.forEach(loc => select.add(new Option(locationLabel(loc, countryMap), String(loc.id))));
      }
      locationsReady = true;
      button.disabled = false;
      button.textContent = "Create shipment & request partner bids";
      message("Secure session ready. Shipment and partner-network request will be saved by the backend.", "info");
    } catch (err) {
      message(err.message || "Could not initialize shipment creation.");
      button.disabled = true;
      button.textContent = "Unable to initialize";
    }
  }
  form.addEventListener("submit", async function(event) {
    event.preventDefault();
    if (!session || !customerOrganizationId || !locationsReady) {
      message("Secure session or required location data is not ready. Refresh and try again.");
      return;
    }
    const originId = Number(document.getElementById("origin-id").value);
    const destinationId = Number(document.getElementById("destination-id").value);
    const description = document.getElementById("goods-description").value.trim();
    const weight = Number(document.getElementById("weight-kg").value);
    const tier = document.getElementById("service-tier").value;
    if (!originId || !destinationId || originId === destinationId) {
      message("Choose two different configured locations.");
      return;
    }
    if (!description || description.length > 500 || !Number.isFinite(weight) || weight <= 0) {
      message("Enter a cargo description and a valid weight greater than zero.");
      return;
    }
    button.disabled = true;
    button.textContent = "Creating shipment securely…";
    message("Saving shipment with KRIM backend…", "info");
    try {
      const {data: shipment, error: createError} = await client.rpc("krim_create_global_shipment", {
        p_customer_organization_id: customerOrganizationId,
        p_origin_location_id: originId,
        p_destination_location_id: destinationId,
        p_goods_description: description,
        p_total_weight_kg: weight
      });
      if (createError) throw createError;
      const shipmentId = Number(shipment && shipment.id);
      if (!Number.isSafeInteger(shipmentId) || shipmentId <= 0) throw new Error("Backend did not return a valid shipment reference. Check My shipments before retrying.");
      const {error: opportunityError} = await client.rpc("krim_create_partner_opportunity", {
        p_shipment_id: shipmentId,
        p_response_deadline: new Date(Date.now() + 72*60*60*1000).toISOString(),
        p_service_tier: tier
      });
      if (opportunityError) {
        message("Shipment " + (shipment.shipment_number || "#" + shipmentId) + " was created, but the partner bid request failed: " + opportunityError.message + ". Opening My shipments so you can review the saved shipment; do not submit again.", "error");
        button.disabled = true;
        button.textContent = "Opening My shipments…";
        setTimeout(() => { window.location.href = "shipment-list.html"; }, 2500);
        return;
      }
      message("Shipment " + (shipment.shipment_number || "#" + shipmentId) + " created and sent to the partner network. Bids and assignment still require real partner participation.", "success");
      button.textContent = "Shipment created";
      setTimeout(() => { window.location.href = "shipment-list.html"; }, 1800);
    } catch (err) {
      message(err.message || "Shipment creation failed. Check My shipments before retrying.");
      button.disabled = false;
      button.textContent = "Create shipment & request partner bids";
    }
  });
  initialize();
})();
</script>
</body>
</html>
