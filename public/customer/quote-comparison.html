<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRIM OS — Enterprise Quote Comparison</title>
    <meta name="description" content="Compare carrier bids, transit SLAs, and institutional pricing rates in KRIM OS.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../platform/krim-config.js"></script>
    <script src="../../platform/krim-navigation.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0284c7', 600: '#026f9e', 900: '#0f172a' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans antialiased">
    <header class="bg-slate-900/95 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-sky-600 to-slate-800 flex items-center justify-center text-white font-bold text-lg">K</div>
                <div>
                    <span class="text-base font-extrabold tracking-wide text-white uppercase">KRIM OS</span>
                    <span class="block text-[10px] tracking-widest text-sky-400 font-semibold uppercase">Quote Comparison</span>
                </div>
            </div>
            <a href="/public/customer/quote-request.html" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-4 py-2 rounded-xl text-xs uppercase tracking-wider transition">Back to Quote Request</a>
        </div>
    </header>

    <main class="flex-grow max-w-5xl mx-auto px-6 py-12 w-full space-y-8">
        <div class="space-y-2">
            <span class="inline-block px-3 py-1 rounded-full text-[10px] font-mono font-semibold bg-sky-500/10 text-sky-400 border border-sky-500/20 uppercase tracking-widest">Spot Bidding Engine</span>
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Compare Carrier Bids</h1>
            <p class="text-slate-400 text-xs font-mono">Evaluate real-time spot quotes, driver safety scores, and guaranteed transit times.</p>
        </div>

        <div id="quote-comparison-list" class="space-y-4 font-mono text-xs">
            <p class="text-slate-400">Loading authorized quotes…</p>
        </div>
    </main>

    <footer class="bg-slate-900 border-t border-slate-800 py-8 text-xs text-slate-500 font-mono text-center">
        <p>KRIM Logistics OS Global Network © 2026. All rights reserved.</p>
    </footer>

    <script>
      const comparisonClient = window.KRIM_SUPABASE || window.supabase.createClient(
        window.KRIM_CONFIG.supabase.url,
        window.KRIM_CONFIG.supabase.publishableKey,
        { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: "pkce" } }
      );
      window.KRIM_SUPABASE = comparisonClient;
      const comparisonList = document.getElementById("quote-comparison-list");
      const escapeQuote = value => String(value ?? "").replace(/[&<>"']/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[ch]);
      async function loadQuoteComparison() {
        try {
          const { data: sessionData, error: sessionError } = await comparisonClient.auth.getSession();
          if (sessionError) throw sessionError;
          const session=sessionData?.session;
          if (!session) { window.location.assign(window.KRIM_ROUTE("auth/login.html")); return; }
          const {data:memberships,error:membershipError}=await comparisonClient.from("krim_organization_members")
            .select("organization_id").eq("user_id",session.user.id).eq("status","active");
          if(membershipError)throw membershipError;
          const ids=[...new Set((memberships||[]).map(m=>m.organization_id))];
          if(!ids.length)throw new Error("No active organization membership is available.");
          const savedOrg=localStorage.getItem("krim_active_org_id");
          const orgId=ids.find(id=>String(id)===savedOrg)||ids[0];
          const params=new URLSearchParams(window.location.search), shipmentId=params.get("shipment_id");
          let opportunityQuery=comparisonClient.from("krim_partner_opportunities")
            .select("id,shipment_id,opportunity_number,status,response_deadline,service_lane,requested_at")
            .eq("customer_organization_id",orgId)
            .in("status",["open","awarded","shortlisted"])
            .order("requested_at",{ascending:false}).limit(100);
          if(shipmentId&&/^\d+$/.test(shipmentId))opportunityQuery=opportunityQuery.eq("shipment_id",Number(shipmentId));
          const {data:opportunities,error:opportunityError}=await opportunityQuery;
          if(opportunityError)throw opportunityError;
          if(!opportunities?.length){
            comparisonList.innerHTML='<div class="bg-slate-800 border border-slate-700 rounded-3xl p-8 text-center"><p class="text-slate-300">No partner opportunities are available for this organization yet.</p><a href="'+window.KRIM_ROUTE("public/customer/quote-request.html")+'" class="inline-block mt-4 bg-sky-600 hover:bg-sky-500 text-white px-4 py-2 rounded-xl">Request Partner Bids →</a></div>';
            return;
          }
          const opportunityIds=opportunities.map(o=>o.id);
          const {data:bids,error:bidError}=await comparisonClient.from("krim_partner_quotes")
            .select("id,opportunity_id,shipment_id,partner_organization_id,quote_number,amount,currency_code,status,valid_until,notes,submitted_at")
            .in("opportunity_id",opportunityIds).order("submitted_at",{ascending:false}).limit(200);
          if(bidError)throw bidError;
          const partnerIds=[...new Set((bids||[]).map(b=>b.partner_organization_id).filter(Boolean))];
          let partners=[];
          if(partnerIds.length){const result=await comparisonClient.from("krim_organizations").select("id,display_name,legal_name").in("id",partnerIds);if(!result.error)partners=result.data||[];}
          const partnerMap=new Map(partners.map(p=>[String(p.id),p.display_name||p.legal_name||("Partner #"+p.id)]));
          const opportunityMap=new Map(opportunities.map(o=>[String(o.id),o]));
          if(!bids?.length){
            comparisonList.innerHTML=opportunities.map(o=>'<div class="bg-slate-800 border border-slate-700 rounded-3xl p-6 shadow-xl"><div class="flex flex-wrap justify-between gap-3"><strong class="text-white text-base">Opportunity '+escapeQuote(o.opportunity_number||("#"+o.id))+'</strong><span class="text-emerald-400 uppercase font-bold">'+escapeQuote(o.status)+'</span></div><p class="text-slate-400 mt-2">Shipment #'+escapeQuote(o.shipment_id)+' · '+escapeQuote(o.service_lane||"Route not specified")+'</p><p class="text-slate-500 mt-2">Response deadline: '+escapeQuote(o.response_deadline?new Date(o.response_deadline).toLocaleString():"not specified")+'</p><p class="text-slate-300 mt-3">No partner bids have been submitted yet. Refresh this page later to check for new bids.</p></div>').join("");
            return;
          }
          comparisonList.innerHTML=bids.map(b=>{
            const opp=opportunityMap.get(String(b.opportunity_id));
            const status=String(b.status||"unknown");
            const statusClass=status==="accepted"?"text-emerald-400 border-emerald-500/30 bg-emerald-500/10":status==="submitted"||status==="under_review"||status==="shortlisted"?"text-sky-400 border-sky-500/30 bg-sky-500/10":"text-amber-300 border-amber-500/30 bg-amber-500/10";
            const amount=Number(b.amount);
            const amountText=Number.isFinite(amount)?amount.toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2}):"—";
            const detailUrl=window.KRIM_ROUTE("public/customer/quote-details.html?partner_quote_id="+encodeURIComponent(b.id)+"&shipment_id="+encodeURIComponent(b.shipment_id)+"&opportunity_id="+encodeURIComponent(b.opportunity_id));
            return '<div class="bg-slate-800 border border-slate-700 rounded-3xl p-6 shadow-xl flex flex-col md:flex-row items-start md:items-center justify-between gap-6"><div class="space-y-2"><div class="flex flex-wrap items-center gap-3"><span class="font-bold text-white text-base">'+escapeQuote(b.quote_number||("Partner Bid #"+b.id))+'</span><span class="px-2.5 py-0.5 rounded-md border text-[10px] font-bold uppercase '+statusClass+'">'+escapeQuote(status)+'</span></div><p class="text-slate-300">'+escapeQuote(partnerMap.get(String(b.partner_organization_id))||("Partner #"+b.partner_organization_id))+'</p><p class="text-slate-400 text-[11px]">Opportunity '+escapeQuote(opp?.opportunity_number||b.opportunity_id)+' · Shipment #'+escapeQuote(b.shipment_id)+' · Valid until '+escapeQuote(b.valid_until?new Date(b.valid_until).toLocaleString():"not specified")+'</p><p class="text-slate-500 text-[11px]">'+escapeQuote(b.notes||"No additional bid notes supplied.")+'</p></div><div class="flex items-center gap-4 w-full md:w-auto justify-between"><div class="text-right"><span class="block text-lg font-bold text-white">'+escapeQuote(b.currency_code||"INR")+' '+amountText+'</span><span class="text-[10px] text-slate-400">Partner-submitted bid</span></div><a href="'+detailUrl+'" class="bg-sky-600 hover:bg-sky-500 text-white font-semibold px-5 py-3 rounded-xl uppercase tracking-wider transition">Review Bid →</a></div></div>';
          }).join("");
        } catch(error) {
          comparisonList.textContent="Unable to load partner bids: "+(error?.message||"Unknown error");
          comparisonList.className="space-y-4 font-mono text-xs text-rose-300";
        }
      }
      loadQuoteComparison();
    </script>
</body>
          </html>
