<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRIM OS — Quote Expiry & Validity Management</title>
    <meta name="description" content="Manage quotation validity periods, automated expiration triggers, and renewal workflows inside KRIM OS Quoting Suite.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 900: '#0f172a' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans antialiased">
    <header class="bg-slate-900/95 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 to-slate-900 flex items-center justify-center text-white font-bold text-lg">K</div>
                <div>
                    <span class="text-base font-extrabold tracking-wide text-white uppercase">KRIM OS</span>
                    <span class="block text-[10px] tracking-widest text-blue-400 font-semibold uppercase">Quote Expiry</span>
                </div>
            </div>
            <a href="/public/quotes/contract-rates.html" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-xs uppercase tracking-wider transition font-mono font-semibold">Next: Contract Rates →</a>
        </div>
    </header>

    <main class="flex-grow max-w-xl mx-auto px-6 py-12 w-full space-y-8">
        <div class="space-y-2 text-center">
            <span class="inline-block px-3 py-1 rounded-full text-[10px] font-mono font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20 uppercase tracking-widest">Quoting Suite • Module 9 of 16</span>
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Quote Expiry & Validity Rules</h1>
            <p class="text-slate-400 text-xs font-mono">Monitor quotation expiration windows, automated tariff validity periods, and renewal triggers for QTE-2026-OCT-0101.</p>
        </div>

        <div class="bg-slate-800 border border-slate-700 rounded-3xl p-8 shadow-xl space-y-6 font-mono text-xs">
            <form onsubmit="handleExpirySubmit(event)" class="space-y-5">
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="block text-slate-400 uppercase tracking-wider">Quote Reference</label>
                        <input type="text" readonly value="QTE-2026-OCT-0101" class="w-full bg-slate-900/50 border border-slate-700/60 rounded-xl px-4 py-3 text-slate-300 focus:outline-none">
                    </div>
                    <div class="space-y-2">
                        <label class="block text-slate-400 uppercase tracking-wider">Validity Status</label>
                        <select required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500 transition">
                            <option value="active" selected>Active / Valid (14 Days Remaining)</option>
                            <option value="expiring_soon">Expiring Soon (&lt; 48 Hours)</option>
                            <option value="expired">Expired / Archived</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="block text-slate-400 uppercase tracking-wider">Issued Date</label>
                        <input type="text" readonly value="2026-10-17" class="w-full bg-slate-900/50 border border-slate-700/60 rounded-xl px-4 py-3 text-slate-300 focus:outline-none">
                    </div>
                    <div class="space-y-2">
                        <label class="block text-slate-400 uppercase tracking-wider">Expiration Date</label>
                        <input type="text" readonly value="2026-11-01" class="w-full bg-slate-900/50 border border-slate-700/60 rounded-xl px-4 py-3 text-amber-400 font-semibold focus:outline-none">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="block text-slate-400 uppercase tracking-wider">Automated Expiry Policy</label>
                    <select required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500 transition">
                        <option value="auto_archive">Auto-Archive & Notify Customer upon Expiry</option>
                        <option value="auto_renew">Auto-Renew at Updated Market Tariff</option>
                        <option value="manual_review">Require Manual Account Manager Review</option>
                    </select>
                </div>

                <div class="space-y-2">
                    <label class="block text-slate-400 uppercase tracking-wider">Expiry & Renewal Notes</label>
                    <textarea rows="3" required placeholder="Enter validity rules and reminder parameters..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500 transition">Standard 14-day validity window locked to bunker fuel surcharge stability index.</textarea>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-4 rounded-xl text-xs uppercase tracking-wider text-center transition shadow-lg shadow-blue-600/25 cursor-pointer">
                    Save Expiry Rules & Proceed →
                </button>
            </form>
        </div>
    </main>

    <footer class="bg-slate-900 border-t border-slate-800 py-8 text-xs text-slate-500 font-mono text-center">
        <p>KRIM Quoting OS © 2026. All rights reserved.</p>
    </footer>

    <script>
        function handleExpirySubmit(e) {
            e.preventDefault();
            alert('Quote expiry parameters saved successfully! Proceeding to Contract Rates.');
            window.location.href = '/public/quotes/contract-rates.html';
        }
    </script>
</body>
</html>
