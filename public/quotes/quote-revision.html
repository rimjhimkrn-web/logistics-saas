<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRIM OS — Quote Revision & Counter-Offers</title>
    <meta name="description" content="Manage quotation revisions, counter-offer adjustments, and price renegotiation workflows inside KRIM OS Quoting Suite.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 900: '#0f172a' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
                }
            }
        }
    </script>

<!-- KRIM_UNIFIED_LIGHT_THEME_BATCH_5 -->
<script>(function(){var p=location.pathname;var b=p.indexOf("/logistics-saas/")===0?"/logistics-saas/":"/";var l=document.createElement("link");l.rel="stylesheet";l.href=b+"core/krim-unified-page.css";document.head.appendChild(l);}());</script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans antialiased">
    <header class="bg-slate-900/95 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 to-slate-900 flex items-center justify-center text-white font-bold text-lg">K</div>
                <div>
                    <span class="text-base font-extrabold tracking-wide text-white uppercase">KRIM OS</span>
                    <span class="block text-[10px] tracking-widest text-blue-400 font-semibold uppercase">Quote Revision</span>
                </div>
            </div>
            <a href="/logistics-saas/public/quotes/quote-expiry.html" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-xs uppercase tracking-wider transition font-mono font-semibold">Next: Quote Expiry →</a>
        </div>
    </header>

    <main class="flex-grow max-w-xl mx-auto px-6 py-12 w-full space-y-8">
        <div class="space-y-2 text-center">
            <span class="inline-block px-3 py-1 rounded-full text-[10px] font-mono font-semibold bg-blue-500/10 text-blue-400 border border-blue-500/20 uppercase tracking-widest">Quoting Suite • Module 8 of 16</span>
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Quote Revision & Counter-Offer</h1>
            <p class="text-slate-400 text-xs font-mono">Adjust tariff pricing, modify accessorial fees, and issue updated quotation versions for QTE-2026-OCT-0101-REV1.</p>
        </div>

        <div class="bg-slate-800 border border-slate-700 rounded-3xl p-8 shadow-xl space-y-6 font-mono text-xs">
            <form onsubmit="handleRevisionSubmit(event)" class="space-y-5">
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="block text-slate-400 uppercase tracking-wider">Parent Quote ID</label>
                        <input type="text" readonly value="QTE-2026-OCT-0101" class="w-full bg-slate-900/50 border border-slate-700/60 rounded-xl px-4 py-3 text-slate-300 focus:outline-none">
                    </div>
                    <div class="space-y-2">
                        <label class="block text-slate-400 uppercase tracking-wider">Revision Version</label>
                        <input type="text" readonly value="REV-01 (Active Counter)" class="w-full bg-slate-900/50 border border-slate-700/60 rounded-xl px-4 py-3 text-blue-400 font-semibold focus:outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="block text-slate-400 uppercase tracking-wider">Original Rate (USD)</label>
                        <input type="text" readonly value="$4,850.00" class="w-full bg-slate-900/50 border border-slate-700/60 rounded-xl px-4 py-3 text-slate-300 focus:outline-none">
                    </div>
                    <div class="space-y-2">
                        <label class="block text-slate-400 uppercase tracking-wider">Revised Counter Rate (USD)</label>
                        <input type="number" required value="4650" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-emerald-400 font-bold focus:outline-none focus:border-blue-500 transition">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="block text-slate-400 uppercase tracking-wider">Reason for Tariff Adjustment</label>
                    <select required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition">
                        <option value="volume_discount">Volume Discount Concession (Repeat Shipper)</option>
                        <option value="market_adjustment">Competitive Market Tariff Matching</option>
                        <option value="accessorial_waived">Accessorial Fee Reduction / Waiver</option>
                    </select>
                </div>

                <div class="space-y-2">
                    <label class="block text-slate-400 uppercase tracking-wider">Revision Justification Notes</label>
                    <textarea rows="3" required placeholder="Enter commercial justification for discounting or modifying the original quotation tariff..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition">Applied $200.00 volume concession to secure multi-container commitment on USNYC → NLRTM lane.</textarea>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-4 rounded-xl text-xs uppercase tracking-wider text-center transition shadow-lg shadow-blue-600/25 cursor-pointer">
                    Issue Revised Quote & Proceed →
                </button>
            </form>
        </div>
    </main>

    <footer class="bg-slate-900 border-t border-slate-800 py-8 text-xs text-slate-500 font-mono text-center">
        <p>KRIM Quoting OS © 2026. All rights reserved.</p>
    </footer>

    <script>
        function handleRevisionSubmit(e) {
            e.preventDefault();
            alert('Quote revision issued successfully! Proceeding to Quote Expiry.');
            window.location.href = '/public/quotes/quote-expiry.html';
        }
    </script>
</body>
</html>
