<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRIM OS — Shipment Settings & Preferences</title>
    <meta name="description" content="Configure shipment-level operational parameters, notification triggers, and automation preferences inside KRIM OS Shipment Core.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 900: '#0f172a' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
                }
            }
        }
    </script>

<!-- KRIM_UNIFIED_LIGHT_THEME_BATCH_5 -->
<script>(function(){var p=location.pathname;var b=p.indexOf("/logistics-saas/")===0?"/logistics-saas/":"/";var l=document.createElement("link");l.rel="stylesheet";l.href=b+"core/krim-unified-page.css";document.head.appendChild(l);}());</script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans antialiased">
    <header class="bg-slate-900/95 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 to-slate-900 flex items-center justify-center text-white font-bold text-lg">K</div>
                <div>
                    <span class="text-base font-extrabold tracking-wide text-white uppercase">KRIM OS</span>
                    <span class="block text-[10px] tracking-widest text-blue-400 font-semibold uppercase">Shipment Settings</span>
                </div>
            </div>
            <a href="/logistics-saas/public/shipments/shipment-export.html" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-xs uppercase tracking-wider transition font-mono font-semibold">Next: Shipment Export →</a>
        </div>
    </header>

    <main class="flex-grow max-w-xl mx-auto px-6 py-12 w-full space-y-8">
        <div class="space-y-2 text-center">
            <span class="inline-block px-3 py-1 rounded-full text-[10px] font-mono font-semibold bg-blue-500/10 text-blue-400 border border-blue-500/20 uppercase tracking-widest">Shipment Core Module • Step 22 of 23</span>
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Shipment Settings & Preferences</h1>
            <p class="text-slate-400 text-xs font-mono">Configure automated alerts, stakeholder notification triggers, and data retention parameters for SHP-2026-OCT-9901.</p>
        </div>

        <div class="bg-slate-800 border border-slate-700 rounded-3xl p-8 shadow-xl space-y-6 font-mono text-xs">
            <form onsubmit="handleSettingsSubmit(event)" class="space-y-5">
                <div class="space-y-2">
                    <label class="block text-slate-400 uppercase tracking-wider">Automated Stakeholder Notifications</label>
                    <select required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition">
                        <option value="all">Enabled (Email & Webhook Alerts on Milestones)</option>
                        <option value="critical">Critical Milestones Only</option>
                        <option value="disabled">Muted / Manual Dispatch Only</option>
                    </select>
                </div>

                <div class="space-y-2">
                    <label class="block text-slate-400 uppercase tracking-wider">Telemetry Polling Frequency</label>
                    <select required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition">
                        <option value="realtime">High Frequency (Every 15 Minutes)</option>
                        <option value="standard" selected>Standard (Hourly Updates)</option>
                        <option value="daily">Batch Daily Sync</option>
                    </select>
                </div>

                <div class="space-y-2">
                    <label class="block text-slate-400 uppercase tracking-wider">Operational Security Level</label>
                    <input type="text" readonly value="Tier-4 Encrypted Audit Log Active" class="w-full bg-slate-900/50 border border-slate-700/60 rounded-xl px-4 py-3 text-slate-300 focus:outline-none">
                </div>

                <div class="space-y-2">
                    <label class="block text-slate-400 uppercase tracking-wider">Internal Remarks & Policy Tags</label>
                    <textarea rows="3" required placeholder="Priority enterprise routing. Strict adherence to SLA benchmarks required." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition">Assigned to VIP North Atlantic lane profile with automated exception escalation.</textarea>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-4 rounded-xl text-xs uppercase tracking-wider text-center transition shadow-lg shadow-blue-600/25 cursor-pointer">
                    Save Shipment Settings & Proceed →
                </button>
            </form>
        </div>
    </main>

    <footer class="bg-slate-900 border-t border-slate-800 py-8 text-xs text-slate-500 font-mono text-center">
        <p>KRIM Shipment OS © 2026. All rights reserved.</p>
    </footer>

    <script>
        function handleSettingsSubmit(e) {
            e.preventDefault();
            alert('Shipment settings saved successfully! Proceeding to final export module.');
            window.location.href = '/public/shipments/shipment-export.html';
        }
    </script>
</body>
</html>
