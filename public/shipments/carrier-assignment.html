<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRIM OS — Carrier Assignment & Booking</title>
    <meta name="description" content="Assign shipping lines, airlines, and motor carriers, and manage booking confirmations inside KRIM OS Shipment Core.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 900: '#0f172a' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
                }
            }
        }
    </script>

<!-- KRIM_UNIFIED_LIGHT_THEME_BATCH_5 -->
<script>(function(){var p=location.pathname;var b=p.indexOf("/logistics-saas/")===0?"/logistics-saas/":"/";var l=document.createElement("link");l.rel="stylesheet";l.href=b+"core/krim-unified-page.css";document.head.appendChild(l);}());</script>
<style id="krim-journey-theme-carrier-assignment">
/* KRIM Journey Accent Theme — 5 Partner Selection & Assignment; colour is decorative, never a shipment/payment status signal. */
:root{--krim-accent:#16a34a;--krim-accent-2:#84cc16;}
body{background-image:radial-gradient(ellipse at 96% 0%,#16a34a12 0,transparent 32%),radial-gradient(ellipse at 0% 100%,#84cc160d 0,transparent 30%);}
body::before{content:"";position:fixed;z-index:9999;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#16a34a,#84cc16,#16a34a);pointer-events:none}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #84cc16;outline-offset:3px}
.brandmark,.brand-mark{background:linear-gradient(135deg,#16a34a,#84cc16)!important}
.btn:not(.secondary):not(.ghost):not(.outline),button[type="submit"],input[type="submit"]{--theme-shadow:#16a34a38}
.btn:not(.secondary):not(.ghost):not(.outline),button[type="submit"],input[type="submit"]{box-shadow:0 8px 22px var(--theme-shadow)}
a:not(.btn){text-decoration-color:#84cc1670}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
button[type="submit"],a.bg-blue-600{background:linear-gradient(115deg,#16a34a,#84cc16)!important;color:#fff!important;border-color:transparent!important}
</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans antialiased">
    <header class="bg-slate-900/95 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 to-slate-900 flex items-center justify-center text-white font-bold text-lg">K</div>
                <div>
                    <span class="text-base font-extrabold tracking-wide text-white uppercase">KRIM OS</span>
                    <span class="block text-[10px] tracking-widest text-blue-400 font-semibold uppercase">Carrier Assignment</span>
                </div>
            </div>
            <a href="/logistics-saas/shipments/dispatch.html" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-xs uppercase tracking-wider transition font-mono font-semibold">Next: Dispatch Management →</a>
        </div>
    </header>

    <main class="flex-grow max-w-xl mx-auto px-6 py-12 w-full space-y-8">
        <div class="space-y-2 text-center">
            <span class="inline-block px-3 py-1 rounded-full text-[10px] font-mono font-semibold bg-blue-500/10 text-blue-400 border border-blue-500/20 uppercase tracking-widest">Shipment Core Module • Step 9 of 23</span>
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Carrier Assignment & Booking</h1>
            <p class="text-slate-400 text-xs font-mono">Allocate primary shipping lines, verify booking reference numbers, and confirm service contracts for SHP-2026-OCT-9901.</p>
        </div>

        <div class="bg-slate-800 border border-slate-700 rounded-3xl p-8 shadow-xl space-y-6 font-mono text-xs">
            <form onsubmit="handleCarrierSubmit(event)" class="space-y-5">
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="block text-slate-400 uppercase tracking-wider">Carrier Partner Name</label>
                        <input type="text" required value="Maersk Line Global" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition">
                    </div>
                    <div class="space-y-2">
                        <label class="block text-slate-400 uppercase tracking-wider">Booking Confirmation Ref</label>
                        <input type="text" required value="BKG-MSK-2026-8841" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="block text-slate-400 uppercase tracking-wider">Service Contract ID</label>
                        <input type="text" required value="SC-NYC-RTM-992" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition">
                    </div>
                    <div class="space-y-2">
                        <label class="block text-slate-400 uppercase tracking-wider">Booking Status</label>
                        <input type="text" readonly value="Confirmed & Secured ✓" class="w-full bg-slate-900/50 border border-slate-700/60 rounded-xl px-4 py-3 text-slate-300 focus:outline-none">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="block text-slate-400 uppercase tracking-wider">Carrier Agreement & Allocation Notes</label>
                    <textarea rows="3" required placeholder="Space allocation secured under annual service contract. Equipment release order sent to container yard operator." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-slate-500 transition"></textarea>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-4 rounded-xl text-xs uppercase tracking-wider text-center transition shadow-lg shadow-blue-600/25 cursor-pointer">
                    Save Carrier Assignment & Proceed →
                </button>
            </form>
        </div>
    </main>

    <footer class="bg-slate-900 border-t border-slate-800 py-8 text-xs text-slate-500 font-mono text-center">
        <p>KRIM Shipment OS © 2026. All rights reserved.</p>
    </footer>

    <script>
        function handleCarrierSubmit(e) {
            e.preventDefault();
            alert('Carrier assignment saved successfully! Proceeding to Dispatch Management.');
            window.location.href = '/public/shipments/dispatch.html';
        }
    </script>
</body>
</html>
