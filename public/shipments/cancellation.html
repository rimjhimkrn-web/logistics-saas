<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRIM OS — Shipment Cancellation & Abort</title>
    <meta name="description" content="Manage shipment cancellations, booking aborts, and carrier release protocols inside KRIM OS Shipment Core.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 900: '#0f172a' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
                }
            }
        }
    </script>

<!-- KRIM_UNIFIED_LIGHT_THEME_BATCH_5 -->
<script>(function(){var p=location.pathname;var b=p.indexOf("/logistics-saas/")===0?"/logistics-saas/":"/";var l=document.createElement("link");l.rel="stylesheet";l.href=b+"core/krim-unified-page.css";document.head.appendChild(l);}());</script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans antialiased">
    <header class="bg-slate-900/95 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 to-slate-900 flex items-center justify-center text-white font-bold text-lg">K</div>
                <div>
                    <span class="text-base font-extrabold tracking-wide text-white uppercase">KRIM OS</span>
                    <span class="block text-[10px] tracking-widest text-blue-400 font-semibold uppercase">Shipment Cancellation</span>
                </div>
            </div>
            <a href="/logistics-saas/public/shipments/shipment-audit-log.html" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-xs uppercase tracking-wider transition font-mono font-semibold">Next: Audit Log →</a>
        </div>
    </header>

    <main class="flex-grow max-w-xl mx-auto px-6 py-12 w-full space-y-8">
        <div class="space-y-2 text-center">
            <span class="inline-block px-3 py-1 rounded-full text-[10px] font-mono font-semibold bg-rose-500/10 text-rose-400 border border-rose-500/20 uppercase tracking-widest">Shipment Core Module • Step 16 of 23</span>
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Shipment Cancellation & Abort</h1>
            <p class="text-slate-400 text-xs font-mono">Process booking cancellations, notify carrier partners, and release reserved container allocations for SHP-2026-OCT-9901.</p>
        </div>

        <div class="bg-slate-800 border border-slate-700 rounded-3xl p-8 shadow-xl space-y-6 font-mono text-xs">
            <form onsubmit="handleCancelSubmit(event)" class="space-y-5">
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="block text-slate-400 uppercase tracking-wider">Shipment Reference</label>
                        <input type="text" readonly value="SHP-2026-OCT-9901" class="w-full bg-slate-900/50 border border-slate-700/60 rounded-xl px-4 py-3 text-slate-300 focus:outline-none">
                    </div>
                    <div class="space-y-2">
                        <label class="block text-slate-400 uppercase tracking-wider">Cancellation Status</label>
                        <select required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-rose-500 transition">
                            <option value="active" selected>Active / Not Cancelled</option>
                            <option value="pending_cancel">Pending Carrier Acknowledgment</option>
                            <option value="cancelled">Cancelled & Released</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="block text-slate-400 uppercase tracking-wider">Reason for Cancellation / Abort</label>
                    <select class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-rose-500 transition">
                        <option value="none">N/A - Shipment Operating Normally</option>
                        <option value="commercial">Commercial Order Revision / Change of Scope</option>
                        <option value="carrier_issue">Carrier Equipment Unavailability</option>
                        <option value="customs">Regulatory / Compliance Failure</option>
                    </select>
                </div>

                <div class="space-y-2">
                    <label class="block text-slate-400 uppercase tracking-wider">Cancellation Notes & Audit Remarks</label>
                    <textarea rows="3" placeholder="Enter detailed justification if cancelling this shipment record..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-rose-500 transition">Shipment currently active. Form provided for administrative abort or emergency recall protocols.</textarea>
                </div>

                <button type="submit" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-semibold py-4 rounded-xl text-xs uppercase tracking-wider text-center transition shadow-lg shadow-rose-600/25 cursor-pointer">
                    Apply Cancellation Status & Proceed →
                </button>
            </form>
        </div>
    </main>

    <footer class="bg-slate-900 border-t border-slate-800 py-8 text-xs text-slate-500 font-mono text-center">
        <p>KRIM Shipment OS © 2026. All rights reserved.</p>
    </footer>

    <script>
        function handleCancelSubmit(e) {
            e.preventDefault();
            alert('Cancellation parameters recorded. Proceeding to Shipment Audit Log.');
            window.location.href = '/public/shipments/shipment-audit-log.html';
        }
    </script>
</body>
</html>
