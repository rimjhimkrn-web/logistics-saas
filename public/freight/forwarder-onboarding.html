<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRIM OS — Freight Forwarder Onboarding</title>
    <meta name="description" content="Onboard new freight forwarding partners, verify carrier credentials, and manage service level agreements inside KRIM OS Logistics Portal.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 900: '#0f172a' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
                }
            }
        }
    </script>

<!-- KRIM_UNIFIED_LIGHT_THEME_BATCH_4 -->
<script>(function(){var p=location.pathname;var b=p.indexOf("/logistics-saas/")===0?"/logistics-saas/":"/";var l=document.createElement("link");l.rel="stylesheet";l.href=b+"core/krim-unified-page.css";document.head.appendChild(l);}());</script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans antialiased">
    <header class="bg-slate-900/95 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 to-slate-900 flex items-center justify-center text-white font-bold text-lg">K</div>
                <div>
                    <span class="text-base font-extrabold tracking-wide text-white uppercase">KRIM OS</span>
                    <span class="block text-[10px] tracking-widest text-blue-400 font-semibold uppercase">Forwarder Onboarding</span>
                </div>
            </div>
            <a href="/logistics-saas/freight/forwarding-quote.html" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-xs uppercase tracking-wider transition font-mono font-semibold">Next: Forwarding Quote →</a>
        </div>
    </header>

    <main class="flex-grow max-w-xl mx-auto px-6 py-12 w-full space-y-8">
        <div class="space-y-2 text-center">
            <span class="inline-block px-3 py-1 rounded-full text-[10px] font-mono font-semibold bg-blue-500/10 text-blue-400 border border-blue-500/20 uppercase tracking-widest">Freight Forwarding Module • Step 2 of 14</span>
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Forwarder Partner Onboarding</h1>
            <p class="text-slate-400 text-xs font-mono">Register new freight partners, verify carrier compliance certificates, and establish API/EDI connections.</p>
        </div>

        <div class="bg-slate-800 border border-slate-700 rounded-3xl p-8 shadow-xl space-y-6 font-mono text-xs">
            <form onsubmit="handleOnboardingSubmit(event)" class="space-y-5">
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="block text-slate-400 uppercase tracking-wider">Partner Company Name</label>
                        <input type="text" required placeholder="TransGlobal Logistics LLC" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition">
                    </div>
                    <div class="space-y-2">
                        <label class="block text-slate-400 uppercase tracking-wider">Forwarder Type</label>
                        <select required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition">
                            <option value="nvocc">NVOCC (Non-Vessel Operating Common Carrier)</option>
                            <option value="ocean_freight_forwarder">Licensed Ocean Freight Forwarder</option>
                            <option value="air_cargo_agent">IATA Air Cargo Agent</option>
                            <option value="multimodal_MTO">Multimodal Transport Operator (MTO)</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="block text-slate-400 uppercase tracking-wider">FMC / IATA License Number</label>
                        <input type="text" required placeholder="FMC-LIC-029481" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition">
                    </div>
                    <div class="space-y-2">
                        <label class="block text-slate-400 uppercase tracking-wider">Compliance Status</label>
                        <select required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition">
                            <option value="verified">Fully Verified & Bonded</option>
                            <option value="pending_review">Pending Insurance Verification</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="block text-slate-400 uppercase tracking-wider">Primary Operational Contact & Notes</label>
                    <textarea rows="3" required placeholder="Assigned Account Manager: Sarah Jenkins (s.jenkins@transglobal.com). API gateway connected via OAuth2..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition"></textarea>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-4 rounded-xl text-xs uppercase tracking-wider text-center transition shadow-lg shadow-blue-600/25 cursor-pointer">
                    Onboard Partner & Proceed →
                </button>
            </form>
        </div>
    </main>

    <footer class="bg-slate-900 border-t border-slate-800 py-8 text-xs text-slate-500 font-mono text-center">
        <p>KRIM Freight Forwarding OS © 2026. All rights reserved.</p>
    </footer>

    <script>
        function handleOnboardingSubmit(e) {
            e.preventDefault();
            alert('Forwarder partner onboarded successfully! Proceeding to Forwarding Quote.');
            window.location.href = '/public/freight/forwarding-quote.html';
        }
    </script>
</body>
</html>
