<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRIM OS — Forwarding Rate Quotation</title>
    <meta name="description" content="Generate multi-modal freight quotes, calculate spot and contract rates, and manage surcharges inside KRIM OS Logistics Portal.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 900: '#0f172a' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans antialiased">
    <header class="bg-slate-900/95 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 to-slate-900 flex items-center justify-center text-white font-bold text-lg">K</div>
                <div>
                    <span class="text-base font-extrabold tracking-wide text-white uppercase">KRIM OS</span>
                    <span class="block text-[10px] tracking-widest text-blue-400 font-semibold uppercase">Forwarding Quote</span>
                </div>
            </div>
            <a href="/public/freight/booking-management.html" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-xs uppercase tracking-wider transition font-mono font-semibold">Next: Booking Management →</a>
        </div>
    </header>

    <main class="flex-grow max-w-xl mx-auto px-6 py-12 w-full space-y-8">
        <div class="space-y-2 text-center">
            <span class="inline-block px-3 py-1 rounded-full text-[10px] font-mono font-semibold bg-blue-500/10 text-blue-400 border border-blue-500/20 uppercase tracking-widest">Freight Forwarding Module • Step 3 of 14</span>
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Forwarding Rate Quotation</h1>
            <p class="text-slate-400 text-xs font-mono">Calculate spot vs. contract freight rates, factor in bunker/currency surcharges, and issue formal quotations.</p>
        </div>

        <div class="bg-slate-800 border border-slate-700 rounded-3xl p-8 shadow-xl space-y-6 font-mono text-xs">
            <form onsubmit="handleQuoteSubmit(event)" class="space-y-5">
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="block text-slate-400 uppercase tracking-wider">Origin Port / Hub</label>
                        <input type="text" required placeholder="USNYC (New York, USA)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition">
                    </div>
                    <div class="space-y-2">
                        <label class="block text-slate-400 uppercase tracking-wider">Destination Port / Hub</label>
                        <input type="text" required placeholder="NLRTM (Rotterdam, NL)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="block text-slate-400 uppercase tracking-wider">Transport Mode</label>
                        <select required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition">
                            <option value="ocean_fcl">Ocean FCL (Full Container Load)</option>
                            <option value="ocean_lcl">Ocean LCL (Less than Container Load)</option>
                            <option value="air_freight">Air Freight Express</option>
                            <option value="multimodal">Multimodal (Rail + Ocean)</option>
                        </select>
                    </div>
                    <div class="space-y-2">
                        <label class="block text-slate-400 uppercase tracking-wider">Calculated Total Quote ($)</label>
                        <input type="number" required placeholder="4250.00" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="block text-slate-400 uppercase tracking-wider">Surcharges & Terms (BAF, CAF, THC included)</label>
                    <textarea rows="3" required placeholder="Includes Bunker Adjustment Factor (BAF), Terminal Handling Charges (THC) at origin and destination. Valid for 14 days." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition"></textarea>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-4 rounded-xl text-xs uppercase tracking-wider text-center transition shadow-lg shadow-blue-600/25 cursor-pointer">
                    Issue Quotation & Proceed →
                </button>
            </form>
        </div>
    </main>

    <footer class="bg-slate-900 border-t border-slate-800 py-8 text-xs text-slate-500 font-mono text-center">
        <p>KRIM Freight Forwarding OS © 2026. All rights reserved.</p>
    </footer>

    <script>
        function handleQuoteSubmit(e) {
            e.preventDefault();
            alert('Forwarding quotation issued successfully! Proceeding to Booking Management.');
            window.location.href = '/public/freight/booking-management.html';
        }
    </script>
</body>
</html>
