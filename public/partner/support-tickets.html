<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRIM OS — Enterprise Support Tickets & Dispute Resolution</title>
    <meta name="description" content="Manage institutional support tickets, logistics disputes, and resolution escalation inside KRIM OS.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 900: '#0f172a' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
                }
            }
        }
    </script>

<!-- KRIM_UNIFIED_LIGHT_THEME_BATCH_5 -->
<script>(function(){var p=location.pathname;var b=p.indexOf("/logistics-saas/")===0?"/logistics-saas/":"/";var l=document.createElement("link");l.rel="stylesheet";l.href=b+"core/krim-unified-page.css";document.head.appendChild(l);}());</script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans antialiased">
    <header class="bg-slate-900/95 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-600 to-slate-900 flex items-center justify-center text-white font-bold text-lg">K</div>
                <div>
                    <span class="text-base font-extrabold tracking-wide text-white uppercase">KRIM OS</span>
                    <span class="block text-[10px] tracking-widest text-emerald-400 font-semibold uppercase">Support Tickets</span>
                </div>
            </div>
            <a href="/logistics-saas/public/partner/api-webhooks.html" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-4 py-2 rounded-xl text-xs uppercase tracking-wider transition">Next: API Webhooks →</a>
        </div>
    </header>

    <main class="flex-grow max-w-4xl mx-auto px-6 py-12 w-full space-y-8">
        <div class="space-y-2">
            <span class="inline-block px-3 py-1 rounded-full text-[10px] font-mono font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 uppercase tracking-widest">Partner Operations • Step 26 of 35</span>
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Support Tickets & Dispute Resolution</h1>
            <p class="text-slate-400 text-xs font-mono">Create and manage priority logistics support tickets, escrow dispute hearings, and arbitration requests.</p>
        </div>

        <div class="bg-slate-800 border border-slate-700 rounded-3xl p-8 shadow-xl space-y-6 font-mono text-xs">
            <form onsubmit="handleSupportSubmit(event)" class="space-y-5">
                <div class="space-y-2">
                    <label class="block text-slate-400 uppercase tracking-wider">Dispute Category</label>
                    <select required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 transition">
                        <option value="escrow">Escrow Release Delay</option>
                        <option value="loading">Loading Dock Detention</option>
                        <option value="damage">Cargo / Freight Discrepancy</option>
                    </select>
                </div>

                <div class="space-y-2">
                    <label class="block text-slate-400 uppercase tracking-wider">Ticket Description & Details</label>
                    <textarea rows="3" required placeholder="Describe the issue or dispute context clearly for support arbitration..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-4 text-white focus:outline-none focus:border-emerald-500 transition resize-none"></textarea>
                </div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-4 rounded-xl text-xs uppercase tracking-wider transition shadow-lg shadow-emerald-600/25 cursor-pointer">
                    Submit Support Ticket & Proceed →
                </button>
            </form>
        </div>
    </main>

    <footer class="bg-slate-900 border-t border-slate-800 py-8 text-xs text-slate-500 font-mono text-center">
        <p>KRIM Logistics OS Global Network © 2026. All rights reserved.</p>
    </footer>

    <script>
        function handleSupportSubmit(e) {
            e.preventDefault();
            alert('Support ticket created successfully. Proceeding to API Webhooks.');
            window.location.href = '/public/partner/api-webhooks.html';
        }
    </script>
</body>
</html>
