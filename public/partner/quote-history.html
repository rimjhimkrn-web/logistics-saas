<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KRIM Partner — Quote History</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../config.js"></script>
<script>(function(){var p=location.pathname,b=p.indexOf("/logistics-saas/")===0?"/logistics-saas/":"/",l=document.createElement("link");l.rel="stylesheet";l.href=b+"core/krim-unified-page.css";document.head.appendChild(l)}())</script></head>
<body class="min-h-screen bg-slate-950 text-slate-100"><header class="border-b border-slate-800 bg-slate-900"><div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center"><a href="../../index.html" class="font-extrabold">KRIM Logistics OS</a><a href="available-loads.html" class="text-sm text-emerald-300">Available loads</a></div></header>
<main class="max-w-4xl mx-auto px-4 py-10"><p class="text-xs uppercase tracking-widest text-emerald-300 font-bold">Partner workspace</p><h1 class="text-3xl font-extrabold mt-2">Submitted bids</h1><p class="text-slate-400 text-sm mt-3">Actual quote records from your partner organization. Customer acceptance and settlement are separate steps.</p><div id="status" role="status" aria-live="polite" class="my-6 text-sm text-slate-300">Loading quote history…</div><div id="quotes" class="space-y-4"></div></main>
<script>(async function(){
const client=window.KRIM_SUPABASE||window.supabaseClient,status=document.getElementById("status"),list=document.getElementById("quotes");
function msg(t,bad=false){status.textContent=t;status.className="my-6 text-sm "+(bad?"text-rose-300":"text-slate-300")}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
try{
if(!client)throw new Error("Backend configuration failed.");const {data:{session},error:ae}=await client.auth.getSession();if(ae)throw ae;if(!session){location.href="../../auth/login.html";return}
const {data:members,error:me}=await client.from("krim_organization_members").select("organization_id").eq("user_id",session.user.id).eq("status","active");if(me)throw me;
const ids=[...new Set((members||[]).map(x=>Number(x.organization_id)).filter(Number.isSafeInteger))];if(!ids.length)throw new Error("No active organization is linked to this account.");
const {data:orgs,error:oe}=await client.from("krim_organizations").select("id,organization_type,status").in("id",ids);if(oe)throw oe;
const partnerIds=(orgs||[]).filter(o=>["partner","carrier","forwarder"].includes(String(o.organization_type).toLowerCase())&&String(o.status||"").toLowerCase()==="active").map(o=>Number(o.id));if(!partnerIds.length)throw new Error("No partner organization is linked to this account.");
const {data:quotes,error:qe}=await client.from("krim_partner_quotes").select("id,opportunity_id,shipment_id,quote_number,amount,currency_code,status,submitted_at,valid_until,notes").in("partner_organization_id",partnerIds).order("submitted_at",{ascending:false}).limit(100);if(qe)throw qe;
if(!quotes||!quotes.length){msg("No bids have been submitted by this partner organization yet.");return}
list.innerHTML=quotes.map(q=>'<article class="rounded-2xl border border-slate-800 bg-slate-900 p-5"><div class="flex flex-col sm:flex-row sm:justify-between sm:items-start gap-3"><div><p class="text-xs text-emerald-300 font-bold">'+esc(q.quote_number||("Quote #"+q.id))+'</p><h2 class="text-xl font-bold mt-2">'+esc(q.currency_code||"INR")+' '+esc(Number(q.amount).toLocaleString())+'</h2><p class="text-sm text-slate-300 mt-2">Shipment #'+esc(q.shipment_id)+' · Opportunity #'+esc(q.opportunity_id)+'</p><p class="text-xs text-slate-400 mt-2">Submitted: '+esc(q.submitted_at?new Date(q.submitted_at).toLocaleString():"—")+' · Valid until: '+esc(q.valid_until?new Date(q.valid_until).toLocaleString():"—")+'</p>'+(q.notes?'<p class="text-sm text-slate-400 mt-3">'+esc(q.notes)+'</p>':"")+'</div><span class="self-start rounded-lg border border-slate-700 bg-slate-800 px-3 py-2 text-xs uppercase font-bold">'+esc(String(q.status||"unknown").replace(/_/g," "))+'</span></div></article>').join("");
msg("Loaded "+quotes.length+" bid record(s).");
}catch(e){msg(e.message||"Could not load quote history.",true)}
})();</script></body></html>
