<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>KRIM Partner — Submit Bid</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../config.js"></script>
<script>(function(){var p=location.pathname,b=p.indexOf("/logistics-saas/")===0?"/logistics-saas/":"/",l=document.createElement("link");l.rel="stylesheet";l.href=b+"core/krim-unified-page.css";document.head.appendChild(l)}())</script>
</head><body class="min-h-screen bg-slate-950 text-slate-100">
<header class="border-b border-slate-800 bg-slate-900"><div class="max-w-3xl mx-auto px-4 py-4 flex justify-between items-center"><a href="../../index.html" class="font-extrabold">KRIM Logistics OS</a><a href="available-loads.html" class="text-sm text-emerald-300">Available loads</a></div></header>
<main class="max-w-3xl mx-auto px-4 py-10"><p class="text-xs uppercase tracking-widest text-emerald-300 font-bold">Partner workspace</p><h1 class="text-3xl font-extrabold mt-2">Submit freight bid</h1>
<p class="text-slate-400 text-sm mt-3">Submit a real offer against an open opportunity. This does not award the shipment or guarantee payment.</p>
<form id="bid-form" class="mt-7 space-y-5 rounded-2xl border border-slate-800 bg-slate-900 p-5 sm:p-7">
<label class="block text-sm">Open opportunity<select id="opportunity" required class="mt-2 w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-3"></select></label>
<div class="grid sm:grid-cols-2 gap-4"><label class="block text-sm">Bid amount (INR)<input id="amount" type="number" min="0.01" max="100000000000" step="0.01" required class="mt-2 w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-3"></label>
<label class="block text-sm">Offer valid until<input id="valid-until" type="datetime-local" required class="mt-2 w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-3"></label></div>
<label class="block text-sm">Operational notes<textarea id="notes" maxlength="2000" rows="4" required placeholder="Vehicle availability, service conditions, transit estimate, exclusions…" class="mt-2 w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-3"></textarea></label>
<p id="feedback" role="status" aria-live="polite" class="text-sm text-slate-300">Checking partner eligibility…</p>
<button id="submit-button" type="submit" disabled class="w-full rounded-xl bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 px-4 py-3 font-bold">Submit bid securely</button>
</form></main>
<script>
(async function(){
const client=window.KRIM_SUPABASE||window.supabaseClient, form=document.getElementById("bid-form"), select=document.getElementById("opportunity"), button=document.getElementById("submit-button"), feedback=document.getElementById("feedback");
function msg(t,bad=false){feedback.textContent=t;feedback.className="text-sm "+(bad?"text-rose-300":"text-slate-300")}
const queryId=new URLSearchParams(location.search).get("opportunity_id");
try{
 if(!client)throw new Error("Backend configuration failed.");
 const {data:{session},error:authError}=await client.auth.getSession();if(authError)throw authError;
 if(!session){location.href="../../auth/login.html";return}
 const {data:members,error:memberError}=await client.from("krim_organization_members").select("organization_id").eq("user_id",session.user.id).eq("status","active");if(memberError)throw memberError;
 const ids=[...new Set((members||[]).map(x=>Number(x.organization_id)).filter(Number.isSafeInteger))];
 const {data:orgs,error:orgError}=ids.length?await client.from("krim_organizations").select("id,organization_type,partner_verification_status,partner_compliance_status,partner_lifecycle_status").in("id",ids):{data:[],error:null};if(orgError)throw orgError;
 const eligible=(orgs||[]).some(o=>["partner","carrier","forwarder","warehouse"].includes(String(o.organization_type).toLowerCase())&&["verified","approved"].includes(String(o.partner_verification_status||"").toLowerCase())&&["compliant","approved","clear"].includes(String(o.partner_compliance_status||"").toLowerCase())&&["active","verified","approved"].includes(String(o.partner_lifecycle_status||"").toLowerCase()));
 const {data:opps,error:oppError}=await client.from("krim_partner_opportunities").select("id,opportunity_number,response_deadline,service_lane,metadata").eq("status","open").gt("response_deadline",new Date().toISOString()).order("requested_at",{ascending:false}).limit(100);if(oppError)throw oppError;
 if(!opps||!opps.length)throw new Error("No open opportunities are available for bidding right now.");
 select.replaceChildren();opps.forEach(o=>select.add(new Option((o.opportunity_number||("Opportunity #"+o.id))+" — "+(o.service_lane||"Route pending")+" — deadline "+new Date(o.response_deadline).toLocaleString(),String(o.id))));
 if(queryId&&opps.some(o=>String(o.id)===queryId))select.value=queryId;
 const defaultExpiry=new Date(Date.now()+24*60*60*1000);defaultExpiry.setMinutes(defaultExpiry.getMinutes()-defaultExpiry.getTimezoneOffset());
 document.getElementById("valid-until").value=defaultExpiry.toISOString().slice(0,16);
 if(!eligible)throw new Error("Bidding is locked. Your partner organization must be verified, compliant, and active before submitting a quote.");
 button.disabled=false;msg("Partner eligibility checks passed. Submit only an accurate operational offer.");
 form.addEventListener("submit",async function(e){
 e.preventDefault();const id=Number(select.value),amount=Number(document.getElementById("amount").value),expiry=new Date(document.getElementById("valid-until").value),notes=document.getElementById("notes").value.trim();
 const chosen=opps.find(o=>Number(o.id)===id);
 if(!chosen||!Number.isFinite(amount)||amount<=0||!Number.isFinite(expiry.getTime())||expiry<=new Date()||expiry>=new Date(chosen.response_deadline)||!notes||notes.length>2000){msg("Check the bid amount, notes, and offer expiry. Offer must expire before the opportunity deadline.",true);return}
 button.disabled=true;button.textContent="Submitting securely…";msg("Submitting offer to KRIM backend…");
 try{const {data,error}=await client.rpc("krim_submit_partner_quote",{p_opportunity_id:id,p_amount:amount,p_currency_code:"INR",p_valid_until:expiry.toISOString(),p_notes:notes});if(error)throw error;
 msg("Bid submitted to the backend. The customer must review and accept it; no assignment or payment is implied.");
 button.textContent="Bid submitted";setTimeout(()=>location.href="quote-history.html",1500);
 }catch(err){msg(err.message||"Bid submission failed. Check quote history before retrying.",true);button.disabled=false;button.textContent="Submit bid securely"}
 });
}catch(e){msg(e.message||"Could not initialize bidding.",true);button.disabled=true;button.textContent="Bidding unavailable"}
})();
</script></body></html>
