<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRIM OS — Enterprise Dispatch & Asset Assignment</title>
    <meta name="description" content="Assign specific trucks, drivers, and telematics to confirmed freight contracts inside KRIM OS.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 900: '#0f172a' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans antialiased">
    <header class="bg-slate-900/95 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-600 to-slate-900 flex items-center justify-center text-white font-bold text-lg">K</div>
                <div>
                    <span class="text-base font-extrabold tracking-wide text-white uppercase">KRIM OS</span>
                    <span class="block text-[10px] tracking-widest text-emerald-400 font-semibold uppercase">Dispatch Assignment</span>
                </div>
            </div>
            <a href="/public/partner/telematics-tracking.html" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-4 py-2 rounded-xl text-xs uppercase tracking-wider transition">Next: Telematics Tracking →</a>
        </div>
    </header>

    <main class="flex-grow max-w-4xl mx-auto px-6 py-12 w-full space-y-8">
        <div class="space-y-2">
            <span class="inline-block px-3 py-1 rounded-full text-[10px] font-mono font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 uppercase tracking-widest">Partner Operations • Step 17 of 35</span>
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Dispatch & Asset Assignment</h1>
            <p class="text-slate-400 text-xs font-mono">Assign verified vehicles, drivers, and telematics IDs to Load #LD-2026-881 for immediate deployment.</p>
        </div>

        <div class="bg-slate-800 border border-slate-700 rounded-3xl p-8 shadow-xl space-y-6 font-mono text-xs">
            <form onsubmit="handleDispatchSubmit(event)" class="space-y-5">
                <div class="space-y-2">
                    <label class="block text-slate-400 uppercase tracking-wider">Select Assigned Vehicle</label>
                    <select required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 transition">
                        <option value="">Select registered vehicle...</option>
                        <option value="MH-04-GR-4912">MH-04-GR-4912 • Tata 32ft Multi-Axle Container</option>
                    </select>
                </div>

                <div class="space-y-2">
                    <label class="block text-slate-400 uppercase tracking-wider">Select Assigned Driver</label>
                    <select required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 transition">
                        <option value="">Select verified driver...</option>
                        <option value="Rajesh Kumar">Rajesh Kumar • License #DL-1420180098231</option>
                    </select>
                </div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-4 rounded-xl text-xs uppercase tracking-wider transition shadow-lg shadow-emerald-600/25 cursor-pointer">
                    Confirm Dispatch Assignment & Proceed to Telematics →
                </button>
            </form>
        </div>
    </main>

    <footer class="bg-slate-900 border-t border-slate-800 py-8 text-xs text-slate-500 font-mono text-center">
        <p>KRIM Logistics OS Global Network © 2026. All rights reserved.</p>
    </footer>

    <script>
        function handleDispatchSubmit(e) {
            e.preventDefault();
            alert('Vehicle and driver successfully assigned to load dispatch. Proceeding to Telematics Tracking.');
            window.location.href = '/public/partner/telematics-tracking.html';
        }
    </script>
</body>
  </html>
