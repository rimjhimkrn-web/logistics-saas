<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRIM Logistics OS — Secure Checkout & Verification</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#06b6d4">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { dark: { bg: '#090d16', card: '#111827', border: '#1f2937', accent: '#06b6d4' } } } } }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body class="bg-[#090d16] text-gray-100 min-h-screen flex flex-col justify-between font-sans antialiased selection:bg-purple-500 selection:text-white">

    <div class="w-full bg-[#05080f] border-b border-gray-900 text-[11px] text-gray-400 py-1.5 px-6 flex justify-between items-center font-mono">
        <span class="flex items-center space-x-1.5"><span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span><span class="text-emerald-400 font-semibold">KRIM CORE: ONLINE</span></span>
        <span id="session-identity-badge" class="text-purple-400">Authenticating...</span>
    </div>

    <header class="border-b border-gray-800 bg-[#090d16]/95 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded bg-gradient-to-br from-purple-600 to-indigo-600 flex items-center justify-center text-white font-bold text-sm shadow">K</div>
                <span class="text-sm font-extrabold tracking-wider text-white">KRIM OS — CHECKOUT GATEWAY</span>
            </div>
            <a href="/app/customer/index.html" class="text-xs font-mono text-gray-300 bg-gray-800 px-3 py-1.5 rounded-lg hover:bg-gray-700 transition">← Workspace</a>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-12 flex-grow w-full space-y-8">
        <div class="bg-[#111827] border border-gray-800/80 rounded-2xl p-8 shadow-2xl space-y-6">
            <div class="flex items-center justify-between pb-4 border-b border-gray-800">
                <h2 class="text-base font-bold text-white">Secure Gateway Settlement</h2>
                <span id="status-pill" class="px-3 py-1 rounded-full text-xs font-mono border text-amber-400 bg-amber-950/40 border-amber-900">Validating...</span>
            </div>
            <div id="checkout-box" class="space-y-4 font-mono text-sm">
                <div class="flex justify-between p-4 bg-[#090d16] rounded-xl border border-gray-800">
                    <span class="text-gray-500 uppercase text-xs">Shipment ID</span>
                    <span id="val-shipment" class="text-white font-bold">--</span>
                </div>
                <div class="flex justify-between p-4 bg-[#090d16] rounded-xl border border-gray-800">
                    <span class="text-gray-500 uppercase text-xs">Quote Amount</span>
                    <span id="val-amount" class="text-emerald-400 font-bold text-lg">--</span>
                </div>
            </div>
            <button id="pay-btn" disabled class="w-full bg-gray-800 text-gray-500 font-bold py-4 px-6 rounded-xl uppercase text-xs font-mono tracking-wider cursor-not-allowed">
                Awaiting Parameter Verification...
            </button>
        </div>
    </main>

    <footer class="border-t border-gray-800 py-8 text-center text-xs text-gray-500 font-mono">KRIM Logistics OS © 2026.</footer>

    <script>
        const SUPABASE_PROJECT_URL = "https://ebltviniygljwwseplph.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVibHR2aW5peWdsandsZXNwbHBoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEyOTIzMjksImV4cCI6MjA1Njg2ODMyOX0.9W2xZ47Lg2MvS8r1Z6N3q5t8v9w0x1y2z3A4B5C6D7E";
        const supabaseClient = window.supabase.createClient(SUPABASE_PROJECT_URL, SUPABASE_ANON_KEY);

        async function initCheckout() {
            const urlParams = new URLSearchParams(window.location.search);
            const shipmentId = urlParams.get('shipment_id');

            if (!shipmentId) {
                alert("Missing shipment_id parameter. Authorization rejected.");
                window.location.href = "/app/customer/index.html";
                return;
            }

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = "/auth/login.html"; return; }
            document.getElementById('session-identity-badge').innerText = `Node: ${session.user.email}`;

            try {
                // Fetch quote linked to shipment
                const { data: quote, error } = await supabaseClient
                    .from('krim_quotes')
                    .select('*')
                    .eq('shipment_id', shipmentId)
                    .order('created_at', { ascending: false })
                    .limit(1)
                    .single();

                if (error || !quote) throw new Error("No valid quote found for this shipment.");

                document.getElementById('val-shipment').innerText = `#${quote.shipment_id}`;
                document.getElementById('val-amount').innerText = `${quote.currency_code || 'INR'} ${Number(quote.amount).toLocaleString('en-IN')}`;
                document.getElementById('status-pill').className = "px-3 py-1 rounded-full text-xs font-mono border text-emerald-400 bg-emerald-950/40 border-emerald-900";
                document.getElementById('status-pill').innerText = "Verified";

                const payBtn = document.getElementById('pay-btn');
                payBtn.disabled = false;
                payBtn.className = "w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-4 px-6 rounded-xl uppercase text-xs font-mono tracking-wider transition cursor-pointer";
                payBtn.innerText = `Pay via Razorpay →`;

                payBtn.onclick = async function() {
                    payBtn.disabled = true;
                    payBtn.innerText = "Calling Order Creation Edge Function...";

                    try {
                        // Correct Edge Function payload: expects shipment_id
                        const { data: orderRes, error: orderErr } = await supabaseClient.functions.invoke('create-razorpay-order', {
                            body: { shipment_id: Number(shipmentId) }
                        });

                        if (orderErr || !orderRes) throw new Error(orderErr?.message || "Failed to create Razorpay order.");

                        const options = {
                            key: orderRes.key_id || "rzp_test_placeholder",
                            amount: orderRes.amount,
                            currency: orderRes.currency || "INR",
                            name: "KRIM Logistics OS",
                            description: `Settlement for Shipment #${shipmentId}`,
                            order_id: orderRes.order_id,
                            handler: async function (response) {
                                payBtn.innerText = "Verifying Payment Server-Side...";
                                
                                // Invoke verification Edge Function post-payment
                                const { data: verifyRes, error: verifyErr } = await supabaseClient.functions.invoke('verify-razorpay-payment', {
                                    body: {
                                        razorpay_order_id: response.razorpay_order_id,
                                        razorpay_payment_id: response.razorpay_payment_id,
                                        razorpay_signature: response.razorpay_signature,
                                        shipment_id: Number(shipmentId)
                                    }
                                });

                                if (verifyErr || !verifyRes?.success) {
                                    throw new Error(verifyErr?.message || "Payment verification failed on server.");
                                }

                                alert("Payment Verified and Secured Successfully!");
                                window.location.href = "/app/customer/index.html";
                            },
                            prefill: { email: session.user.email },
                            theme: { color: "#06b6d4" }
                        };

                        const rzp = new Razorpay(options);
                        rzp.open();
                        payBtn.disabled = false;
                        payBtn.innerText = `Pay via Razorpay →`;
                    } catch (err) {
                        alert("Checkout Error: " + err.message);
                        payBtn.disabled = false;
                        payBtn.innerText = `Pay via Razorpay →`;
                    }
                };
            } catch (err) {
                document.getElementById('status-pill').className = "px-3 py-1 rounded-full text-xs font-mono border text-red-400 bg-red-950/40 border-red-900";
                document.getElementById('status-pill').innerText = "Failed";
                alert("Error: " + err.message);
            }
        }
        initCheckout();
    </script>
</body>
</html>
