<section class="hero"><div><div class="eyebrow">CUSTOMER OPERATIONS / NEW SHIPMENT</div><h1>Prepare a shipment<br>request with clarity.</h1><p>Capture the essential route and cargo details before a request enters KRIM's secured shipment workflow. A request is not a confirmed booking, partner acceptance or dispatch.</p></div><div class="hero-mark" aria-hidden="true">＋</div></section>
<div class="alert" id="environment" role="status" aria-live="polite">Checking environment…</div>
<div class="alert strong" id="integrity"><b>Submission status:</b> The current canonical shipment-creation workflow is paused because its backend create contract requires correction and verification. This page does not submit or create shipments. No shipment will be implied or fabricated.</div>
<div class="layout"><section class="panel"><div class="panel-head"><div><h2>Shipment request details</h2><p>Illustrative intake fields · No data is sent from this page</p></div><span class="tag" id="form-mode">READ ONLY</span></div><div class="body"><div class="step"><span class="step-num">01</span><div><b>Route details</b><small>Choose a country-aware origin and destination.</small></div></div>
<div class="grid"><div class="field"><label for="origin-country">Origin country / market</label><select id="origin-country"><option value="">Choose country</option><option>India (IN)</option><option>United Arab Emirates (AE)</option><option>Singapore (SG)</option><option>Netherlands (NL)</option><option>Kenya (KE)</option></select></div><div class="field"><label for="origin-location">Origin city / hub</label><input id="origin-location" placeholder="e.g. Ranchi, port, airport or hub"></div><div class="field"><label for="destination-country">Destination country / market</label><select id="destination-country"><option value="">Choose country</option><option>India (IN)</option><option>United Arab Emirates (AE)</option><option>Singapore (SG)</option><option>Netherlands (NL)</option><option>Kenya (KE)</option></select></div><div class="field"><label for="destination-location">Destination city / hub</label><input id="destination-location" placeholder="e.g. Dubai, Rotterdam or Nairobi"></div></div>
<div class="divider"></div><div class="step"><span class="step-num">02</span><div><b>Cargo profile</b><small>Describe the goods and total shipment weight.</small></div></div><div class="grid"><div class="field full"><label for="goods">Goods description</label><textarea id="goods" maxlength="500" placeholder="Describe the cargo, packaging and handling needs"></textarea><div class="hint">Do not enter passwords, payment details or sensitive personal information.</div></div><div class="field"><label for="weight">Total gross weight</label><input id="weight" type="number" min="0.01" step="0.01" placeholder="e.g. 1250"></div><div class="field"><label for="unit">Weight unit</label><select id="unit"><option value="kg">Kilograms (kg)</option><option value="t">Metric tonnes (t)</option><option value="lb">Pounds (lb)</option></select><div class="hint">Canonical storage uses kilograms; display units are preferences only.</div></div><div class="field"><label for="mode">Preferred transport mode</label><select id="mode"><option value="">Select mode</option><option>Road</option><option>Rail</option><option>Air</option><option>Ocean</option><option>Multimodal</option></select></div><div class="field"><label for="route-type">Movement type</label><select id="route-type"><option value="">Select movement type</option><option>Domestic</option><option>Cross-border / international</option></select></div></div><div class="actions-row"><button class="button" id="preview" type="button">Preview request summary</button><button class="button secondary" type="button" disabled>Submit shipment request · unavailable</button><a class="button secondary" href="shipment-list.html">View shipments</a></div><div class="feedback" id="feedback" role="status" aria-live="polite" hidden></div></div></section>
<aside class="panel"><div class="panel-head"><div><h2>Request summary</h2><p>Local preview only · no record is created</p></div><span class="tag">PREVIEW</span></div><div class="summary"><h3>Route overview</h3><div class="route-box"><div class="route-label">ORIGIN</div><div class="route-place" id="sum-origin">Not selected</div><div class="route-divider"></div><div class="route-label">DESTINATION</div><div class="route-place" id="sum-destination">Not selected</div></div><div class="sumrow"><span>Goods</span><b id="sum-goods">Not provided</b></div><div class="sumrow"><span>Gross weight</span><b id="sum-weight">Not provided</b></div><div class="sumrow"><span>Transport</span><b id="sum-mode">Not selected</b></div><div class="sumrow"><span>Movement</span><b id="sum-route">Not selected</b></div><div class="caution"><b>Before any real submission</b><br>KRIM must validate both active market endpoints, exact corridor eligibility, partner capability and capacity, compliance requirements, and the mode-aware backend create contract. A location catalogue entry alone does not prove service availability.</div><div class="caution" id="mode-note">Production shipment creation remains paused pending backend correction. Use the secure workspace to review existing records; do not assume a request has been created.</div></div></aside></div>
<div class="alert strong"><b>Global standards:</b> Country-aware route fields; international transport modes; canonical weight in kilograms; UTC timestamps; locale-aware display; ISO currency only where a verified quote exists. Country lists and transport options do not imply active market coverage or available service.</div></main>

<script>
(function(){'use strict';const staging=location.hostname.endsWith('.krim-staging.pages.dev');const $=id=>document.getElementById(id);$('environment').textContent=staging?'STAGING REVIEW MODE · Public preview · Local sample inputs only · No authentication required and no writes.':'PRODUCTION VIEW · Shipment creation is paused pending verification of the canonical backend workflow. This page is read-only.';$('form-mode').textContent=staging?'STAGING DEMO':'READ ONLY';if(!staging){document.querySelectorAll('#origin-country,#origin-location,#destination-country,#destination-location,#goods,#weight,#unit,#mode,#route-type,#preview').forEach(x=>x.disabled=true);$('mode-note').textContent='Production writes remain disabled here. The existing canonical workflow at public/shipments/shipment-create.html is also paused; no shipment has been submitted.';}const ids=['origin-country','origin-location','destination-country','destination-location','goods','weight','unit','mode','route-type'];function update(){const val=id=>$(id).value.trim();$('sum-origin').textContent=[val('origin-location'),val('origin-country')].filter(Boolean).join(', ')||'Not selected';$('sum-destination').textContent=[val('destination-location'),val('destination-country')].filter(Boolean).join(', ')||'Not selected';$('sum-goods').textContent=val('goods')||'Not provided';let w=Number(val('weight'));let unit=val('unit');if(Number.isFinite(w)&&w>0){let kg=unit==='t'?w*1000:unit==='lb'?w*0.45359237:w;$('sum-weight').textContent=new Intl.NumberFormat(undefined,{maximumFractionDigits:3}).format(w)+' '+unit+' ('+new Intl.NumberFormat(undefined,{maximumFractionDigits:3}).format(kg)+' kg canonical)'}else $('sum-weight').textContent='Not provided';$('sum-mode').textContent=val('mode')||'Not selected';$('sum-route').textContent=val('route-type')||'Not selected'}ids.forEach(id=>$(id).addEventListener('input',update));$('preview').addEventListener('click',()=>{update();$('feedback').hidden=false;$('feedback').textContent='Local preview updated. Nothing has been submitted, saved or transmitted.'});update();const t=$('toggle'),nav=$('nav');function close(){nav.classList.remove('open');t.setAttribute('aria-expanded','false');t.setAttribute('aria-label','Open navigation');t.textContent='☰'}t.addEventListener('click',()=>{const o=!nav.classList.contains('open');nav.classList.toggle('open',o);t.setAttribute('aria-expanded',String(o));t.setAttribute('aria-label',o?'Close navigation':'Open navigation');t.textContent=o?'×':'☰'});nav.addEventListener('click',e=>{if(e.target.closest('a'))close()});document.addEventListener('click',e=>{if(!nav.contains(e.target)&&!t.contains(e.target))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});window.addEventListener('resize',()=>{if(innerWidth>1100)close()})})();
</script><script defer src="../assets/customer-os-globalization.js"></script></body></html>
