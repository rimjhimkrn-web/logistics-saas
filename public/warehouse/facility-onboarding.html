<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRIM OS — Facility Onboarding</title>
    <meta name="description" content="Register and configure new warehouse facilities, storage dimensions, and operating zones inside KRIM OS.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 900: '#0f172a' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans antialiased">
    <header class="bg-slate-900/95 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-600 to-slate-900 flex items-center justify-center text-white font-bold text-lg">K</div>
                <div>
                    <span class="text-base font-extrabold tracking-wide text-white uppercase">KRIM OS</span>
                    <span class="block text-[10px] tracking-widest text-emerald-400 font-semibold uppercase">Facility Onboarding</span>
                </div>
            </div>
            <a href="/public/warehouse/facility-profile.html" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-4 py-2 rounded-xl text-xs uppercase tracking-wider transition">Next: Facility Profile →</a>
        </div>
    </header>

    <main class="flex-grow max-w-xl mx-auto px-6 py-12 w-full space-y-8">
        <div class="space-y-2 text-center">
            <span class="inline-block px-3 py-1 rounded-full text-[10px] font-mono font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 uppercase tracking-widest">Warehouse Module • Step 2 of 22</span>
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Facility Onboarding</h1>
            <p class="text-slate-400 text-xs font-mono">Register new distribution centers, configure node identifiers, and set initial physical boundaries.</p>
        </div>

        <div class="bg-slate-800 border border-slate-700 rounded-3xl p-8 shadow-xl space-y-6 font-mono text-xs">
            <form onsubmit="handleOnboardingSubmit(event)" class="space-y-5">
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="block text-slate-400 uppercase tracking-wider">Facility Code / ID</label>
                        <input type="text" required placeholder="WH-GAMMA-03" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 transition">
                    </div>
                    <div class="space-y-2">
                        <label class="block text-slate-400 uppercase tracking-wider">Facility Classification</label>
                        <select required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 transition">
                            <option value="fulfillment">Primary Fulfillment Center</option>
                            <option value="cross_dock">Cross-Dock Hub</option>
                            <option value="cold_storage">Cold Chain Storage</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="block text-slate-400 uppercase tracking-wider">Physical Address / Coordinates</label>
                    <input type="text" required placeholder="1400 Logistics Parkway, Atlanta, GA" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 transition">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="block text-slate-400 uppercase tracking-wider">Total Area (Sq Ft)</label>
                        <input type="number" required placeholder="250000" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 transition">
                    </div>
                    <div class="space-y-2">
                        <label class="block text-slate-400 uppercase tracking-wider">Total Dock Doors</label>
                        <input type="number" required placeholder="24" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 transition">
                    </div>
                </div>

                <label class="flex items-center justify-between p-4 bg-slate-900 rounded-2xl border border-slate-700 cursor-pointer">
                    <span class="text-slate-300">Enable Automated Yard & Gate Synchronization</span>
                    <input type="checkbox" checked class="w-4 h-4 rounded bg-slate-800 border-slate-700 text-emerald-600 focus:ring-emerald-500">
                </label>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-4 rounded-xl text-xs uppercase tracking-wider text-center transition shadow-lg shadow-emerald-600/25 cursor-pointer">
                    Initialize Facility & Proceed →
                </button>
            </form>
        </div>
    </main>

    <footer class="bg-slate-900 border-t border-slate-800 py-8 text-xs text-slate-500 font-mono text-center">
        <p>KRIM Warehouse Management OS © 2026. All rights reserved.</p>
    </footer>

    <script>
        function handleOnboardingSubmit(e) {
            e.preventDefault();
            alert('Facility onboarded successfully! Proceeding to Facility Profile.');
            window.location.href = '/public/warehouse/facility-profile.html';
        }
    </script>
</body>
</html>
