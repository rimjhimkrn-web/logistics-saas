<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRIM OS — Putaway Strategy & Slotting</title>
    <meta name="description" content="Configure automated putaway rules, ABC inventory slotting, and warehouse bin assignments inside KRIM OS Warehouse Portal.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 900: '#0f172a' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
                }
            }
        }
    </script>

<!-- KRIM_UNIFIED_LIGHT_THEME_BATCH_6 -->
<script>(function(){var p=location.pathname;var b=p.indexOf("/logistics-saas/")===0?"/logistics-saas/":"/";var l=document.createElement("link");l.rel="stylesheet";l.href=b+"core/krim-unified-page.css";document.head.appendChild(l);}());</script>
  <link rel="stylesheet" href="../../core/krim-global-interface.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans antialiased krim-global-shell">
    <header class="bg-slate-900/95 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-600 to-slate-900 flex items-center justify-center text-white font-bold text-lg">K</div>
                <div>
                    <span class="text-base font-extrabold tracking-wide text-white uppercase">KRIM OS</span>
                    <span class="block text-[10px] tracking-widest text-emerald-400 font-semibold uppercase">Putaway Strategy</span>
                </div>
            </div>
            <a href="/logistics-saas/public/warehouse/inventory.html" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-4 py-2 rounded-xl text-xs uppercase tracking-wider transition">Next: Inventory Ledger →</a>
        </div>
    </header>

    <main class="flex-grow max-w-xl mx-auto px-6 py-12 w-full space-y-8">
        <div class="space-y-2 text-center">
            <span class="inline-block px-3 py-1 rounded-full text-[10px] font-mono font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 uppercase tracking-widest">Warehouse Module • Step 10 of 22</span>
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Putaway Strategy & Slotting</h1>
            <p class="text-slate-400 text-xs font-mono">Assign optimal storage bins using ABC inventory velocity rules and weight-based gravity stocking algorithms.</p>
        </div>

        <div class="bg-slate-800 border border-slate-700 rounded-3xl p-8 shadow-xl space-y-6 font-mono text-xs">
            <form onsubmit="handlePutawaySubmit(event)" class="space-y-5">
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="block text-slate-400 uppercase tracking-wider">Slotting Algorithm</label>
                        <select required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 transition">
                            <option value="abc_velocity">ABC Velocity (Fast Movers near Dock)</option>
                            <option value="weight_gravity">Weight Gravity (Heavy Items on Lower Tiers)</option>
                            <option value="zone_affinity">Zone Affinity (Grouped Product Families)</option>
                        </select>
                    </div>
                    <div class="space-y-2">
                        <label class="block text-slate-400 uppercase tracking-wider">Target Destination Zone</label>
                        <select required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 transition">
                            <option value="zone_a_rack_01">Aisle 01 — Bay Racks (Primary Pick)</option>
                            <option value="zone_b_rack_04">Aisle 04 — Bulk Pallet Storage</option>
                            <option value="zone_c_mezz">Mezzanine Tier 2 — Small Parts</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="block text-slate-400 uppercase tracking-wider">Assigned RF Handler / Forklift ID</label>
                    <input type="number" required placeholder="RF-TRUCK-04 (Operator Mike B.)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 transition">
                </div>

                <div class="space-y-2">
                    <label class="block text-slate-400 uppercase tracking-wider">Putaway Directive Notes</label>
                    <textarea rows="3" required placeholder="Verify bin barcode matches target LPN before dropping stock into designated rack slot..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 transition"></textarea>
                </div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-4 rounded-xl text-xs uppercase tracking-wider text-center transition shadow-lg shadow-emerald-600/25 cursor-pointer">
                    Confirm Putaway Route & Proceed →
                </button>
            </form>
        </div>
    </main>

    <footer class="bg-slate-900 border-t border-slate-800 py-8 text-xs text-slate-500 font-mono text-center">
        <p>KRIM Warehouse Management OS © 2026. All rights reserved.</p>
    </footer>

    <script>
        function handlePutawaySubmit(e) {
            e.preventDefault();
            alert('Putaway strategy assigned successfully! Proceeding to Inventory Ledger.');
            window.location.href = '/public/warehouse/inventory.html';
        }
    </script>
</body>
</html>
