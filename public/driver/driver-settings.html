<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRIM OS — Driver Settings & Account Preferences</title>
    <meta name="description" content="Manage driver profile settings, notification preferences, and security configurations inside KRIM OS Driver Portal.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 900: '#0f172a' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
                }
            }
        }
    </script>

<!-- KRIM_UNIFIED_LIGHT_THEME_BATCH_3 -->
<script>(function(){var p=location.pathname;var b=p.indexOf("/logistics-saas/")===0?"/logistics-saas/":"/";var l=document.createElement("link");l.rel="stylesheet";l.href=b+"core/krim-unified-page.css";document.head.appendChild(l);}());</script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans antialiased">
    <header class="bg-slate-900/95 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-600 to-slate-900 flex items-center justify-center text-white font-bold text-lg">K</div>
                <div>
                    <span class="text-base font-extrabold tracking-wide text-white uppercase">KRIM OS</span>
                    <span class="block text-[10px] tracking-widest text-emerald-400 font-semibold uppercase">Driver Settings</span>
                </div>
            </div>
            <span class="text-xs font-mono text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-3 py-1.5 rounded-xl uppercase tracking-wider">Final Step (24/24)</span>
        </div>
    </header>

    <main class="flex-grow max-w-md mx-auto px-6 py-12 w-full space-y-8">
        <div class="space-y-2 text-center">
            <span class="inline-block px-3 py-1 rounded-full text-[10px] font-mono font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 uppercase tracking-widest">Driver Module • Step 24 of 24</span>
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Driver Settings & Preferences</h1>
            <p class="text-slate-400 text-xs font-mono">Configure telemetry frequency, dark mode telemetry UI, push notification alerts, and secure session management.</p>
        </div>

        <div class="bg-slate-800 border border-slate-700 rounded-3xl p-6 shadow-xl space-y-6 font-mono text-xs">
            <form onsubmit="handleSettingsSave(event)" class="space-y-4">
                <label class="flex items-center justify-between p-4 bg-slate-900 rounded-2xl border border-slate-700 cursor-pointer">
                    <span class="text-slate-300">High-Precision GPS Polling (15s interval)</span>
                    <input type="checkbox" checked class="w-4 h-4 rounded bg-slate-800 border-slate-700 text-emerald-600 focus:ring-emerald-500">
                </label>

                <label class="flex items-center justify-between p-4 bg-slate-900 rounded-2xl border border-slate-700 cursor-pointer">
                    <span class="text-slate-300">Audio Dispatch Alerts & Geofence Beeps</span>
                    <input type="checkbox" checked class="w-4 h-4 rounded bg-slate-800 border-slate-700 text-emerald-600 focus:ring-emerald-500">
                </label>

                <label class="flex items-center justify-between p-4 bg-slate-900 rounded-2xl border border-slate-700 cursor-pointer">
                    <span class="text-slate-300">Biometric Login & Secure Passkey Unlock</span>
                    <input type="checkbox" checked class="w-4 h-4 rounded bg-slate-800 border-slate-700 text-emerald-600 focus:ring-emerald-500">
                </label>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-4 rounded-xl text-xs uppercase tracking-wider text-center transition shadow-lg shadow-emerald-600/25 cursor-pointer">
                        Save Preferences & Complete Driver Portal 🎉
                    </button>
                </div>
            </form>
        </div>
    </main>

    <footer class="bg-slate-900 border-t border-slate-800 py-8 text-xs text-slate-500 font-mono text-center">
        <p>KRIM Logistics OS Driver Network © 2026. All rights reserved.</p>
    </footer>

    <script>
        function handleSettingsSave(e) {
            e.preventDefault();
            alert('Settings saved successfully! KRIM OS Driver Portal (Steps 1 to 24) is now fully complete.');
            window.location.href = '/public/driver/dashboard.html';
        }
    </script>
</body>
</html>
