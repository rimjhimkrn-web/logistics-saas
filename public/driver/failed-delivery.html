<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRIM OS — Failed Delivery Exception Log</title>
    <meta name="description" content="Log delivery exceptions, recipient unavailability, or refusal reasons inside KRIM OS Driver Portal.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 900: '#0f172a' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
                }
            }
        }
    </script>

<!-- KRIM_UNIFIED_LIGHT_THEME_BATCH_3 -->
<script>(function(){var p=location.pathname;var b=p.indexOf("/logistics-saas/")===0?"/logistics-saas/":"/";var l=document.createElement("link");l.rel="stylesheet";l.href=b+"core/krim-unified-page.css";document.head.appendChild(l);}());</script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans antialiased">
    <header class="bg-slate-900/95 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-600 to-slate-900 flex items-center justify-center text-white font-bold text-lg">K</div>
                <div>
                    <span class="text-base font-extrabold tracking-wide text-white uppercase">KRIM OS</span>
                    <span class="block text-[10px] tracking-widest text-emerald-400 font-semibold uppercase">Failed Delivery Log</span>
                </div>
            </div>
            <a href="/logistics-saas/driver/return-trip.html" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-4 py-2 rounded-xl text-xs uppercase tracking-wider transition">Next: Return Trip →</a>
        </div>
    </header>

    <main class="flex-grow max-w-md mx-auto px-6 py-12 w-full space-y-8">
        <div class="space-y-2 text-center">
            <span class="inline-block px-3 py-1 rounded-full text-[10px] font-mono font-semibold bg-rose-500/10 text-rose-400 border border-rose-500/20 uppercase tracking-widest">Driver Module • Exception Handling</span>
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Failed Delivery Report</h1>
            <p class="text-slate-400 text-xs font-mono">Record unfulfilled delivery attempts due to recipient absence, facility closure, or cargo rejection.</p>
        </div>

        <div class="bg-slate-800 border border-slate-700 rounded-3xl p-6 shadow-xl space-y-6 font-mono text-xs">
            <form onsubmit="handleFailedDelivery(event)" class="space-y-5">
                <div class="space-y-2">
                    <label class="block text-slate-400 uppercase tracking-wider">Exception Reason</label>
                    <select required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-rose-500 transition">
                        <option value="recipient_absent">Recipient Unavailable / Closed Bay</option>
                        <option value="rejected_cargo">Cargo Damaged / Quality Refused</option>
                        <option value="access_blocked">Warehouse Entry Blocked / Security Denied</option>
                        <option value="other">Other Unforeseen Circumstance</option>
                    </select>
                </div>

                <div class="space-y-2">
                    <label class="block text-slate-400 uppercase tracking-wider">Upload Proof of Attempt / Closed Gate Photo</label>
                    <input type="file" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-rose-500/15 file:text-rose-400 hover:file:bg-rose-500/25 transition">
                </div>

                <div class="space-y-2">
                    <label class="block text-slate-400 uppercase tracking-wider">Detailed Remarks</label>
                    <textarea rows="3" required placeholder="Describe attempted contact with receiver..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-rose-500 transition"></textarea>
                </div>

                <button type="submit" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-semibold py-4 rounded-xl text-xs uppercase tracking-wider text-center transition shadow-lg shadow-rose-600/25 cursor-pointer">
                    Log Failed Delivery & Proceed to Return Trip →
                </button>
            </form>
        </div>
    </main>

    <footer class="bg-slate-900 border-t border-slate-800 py-8 text-xs text-slate-500 font-mono text-center">
        <p>KRIM Logistics OS Driver Network © 2026. All rights reserved.</p>
    </footer>

    <script>
        function handleFailedDelivery(e) {
            e.preventDefault();
            alert('Failed delivery logged. Central dispatch notified. Proceeding to Return Trip routing.');
            window.location.href = '/public/driver/return-trip.html';
        }
    </script>
</body>
</html>
