<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRIM OS — Driver Portal Login & Authentication</title>
    <meta name="description" content="Secure mobile login for logistics drivers inside KRIM OS.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 900: '#0f172a' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
                }
            }
        }
    </script>

<!-- KRIM_UNIFIED_LIGHT_THEME_BATCH_3 -->
<script>(function(){var p=location.pathname;var b=p.indexOf("/logistics-saas/")===0?"/logistics-saas/":"/";var l=document.createElement("link");l.rel="stylesheet";l.href=b+"core/krim-unified-page.css";document.head.appendChild(l);}());</script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans antialiased">
    <header class="bg-slate-900/95 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-600 to-slate-900 flex items-center justify-center text-white font-bold text-lg">K</div>
                <div>
                    <span class="text-base font-extrabold tracking-wide text-white uppercase">KRIM OS</span>
                    <span class="block text-[10px] tracking-widest text-emerald-400 font-semibold uppercase">Driver Mobile Portal</span>
                </div>
            </div>
            <a href="/public/driver/profile.html" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-4 py-2 rounded-xl text-xs uppercase tracking-wider transition">Next: Driver Profile →</a>
        </div>
    </header>

    <main class="flex-grow max-w-md mx-auto px-6 py-16 w-full flex flex-col justify-center space-y-8">
        <div class="space-y-2 text-center">
            <span class="inline-block px-3 py-1 rounded-full text-[10px] font-mono font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 uppercase tracking-widest">Driver Module • Step 1 of 24</span>
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Driver Authentication</h1>
            <p class="text-slate-400 text-xs font-mono">Enter your registered mobile number and OTP to access assigned transit routes and dispatch logs.</p>
        </div>

        <div class="bg-slate-800 border border-slate-700 rounded-3xl p-8 shadow-xl space-y-6 font-mono text-xs">
            <form onsubmit="handleDriverLogin(event)" class="space-y-5">
                <div class="space-y-2">
                    <label class="block text-slate-400 uppercase tracking-wider">Mobile Number</label>
                    <input type="tel" required placeholder="+91 98765 43210" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 transition">
                </div>

                <div class="space-y-2">
                    <label class="block text-slate-400 uppercase tracking-wider">6-Digit SMS OTP</label>
                    <input type="text" maxlength="6" required placeholder="• • • • • •" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white tracking-widest text-center focus:outline-none focus:border-emerald-500 transition">
                </div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-4 rounded-xl text-xs uppercase tracking-wider transition shadow-lg shadow-emerald-600/25 cursor-pointer">
                    Authenticate & Enter Portal →
                </button>
            </form>
        </div>
    </main>

    <footer class="bg-slate-900 border-t border-slate-800 py-8 text-xs text-slate-500 font-mono text-center">
        <p>KRIM Logistics OS Driver Network © 2026. All rights reserved.</p>
    </footer>

    <script>
        function handleDriverLogin(e) {
            e.preventDefault();
            alert('Driver authenticated successfully! Proceeding to Driver Profile.');
            window.location.href = '/public/driver/profile.html';
        }
    </script>
</body>
</html>
