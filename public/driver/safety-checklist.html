<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRIM OS — Pre-Transit Safety Compliance Checklist</title>
    <meta name="description" content="Complete mandatory vehicle and driver safety verification inside KRIM OS Driver Portal.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 900: '#0f172a' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
                }
            }
        }
    </script>

<!-- KRIM_UNIFIED_LIGHT_THEME_BATCH_3 -->
<script>(function(){var p=location.pathname;var b=p.indexOf("/logistics-saas/")===0?"/logistics-saas/":"/";var l=document.createElement("link");l.rel="stylesheet";l.href=b+"core/krim-unified-page.css";document.head.appendChild(l);}());</script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans antialiased">
    <header class="bg-slate-900/95 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-600 to-slate-900 flex items-center justify-center text-white font-bold text-lg">K</div>
                <div>
                    <span class="text-base font-extrabold tracking-wide text-white uppercase">KRIM OS</span>
                    <span class="block text-[10px] tracking-widest text-emerald-400 font-semibold uppercase">Safety Checklist</span>
                </div>
            </div>
            <a href="/logistics-saas/public/driver/emergency-support.html" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-4 py-2 rounded-xl text-xs uppercase tracking-wider transition">Next: Emergency Support →</a>
        </div>
    </header>

    <main class="flex-grow max-w-md mx-auto px-6 py-12 w-full space-y-8">
        <div class="space-y-2 text-center">
            <span class="inline-block px-3 py-1 rounded-full text-[10px] font-mono font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 uppercase tracking-widest">Driver Module • Safety Compliance</span>
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Mandatory Safety Checklist</h1>
            <p class="text-slate-400 text-xs font-mono">Verify brakes, lights, tire pressure, and driver alertness prior to transit.</p>
        </div>

        <div class="bg-slate-800 border border-slate-700 rounded-3xl p-6 shadow-xl space-y-6 font-mono text-xs">
            <form onsubmit="handleSafetyChecklist(event)" class="space-y-4">
                <label class="flex items-start space-x-3 p-4 bg-slate-900 rounded-2xl border border-slate-700 cursor-pointer">
                    <input type="checkbox" required class="mt-0.5 w-4 h-4 rounded bg-slate-800 border-slate-700 text-emerald-600 focus:ring-emerald-500">
                    <span class="text-slate-300">Braking system, ABS sensors, and parking brakes functioning properly.</span>
                </label>

                <label class="flex items-start space-x-3 p-4 bg-slate-900 rounded-2xl border border-slate-700 cursor-pointer">
                    <input type="checkbox" required class="mt-0.5 w-4 h-4 rounded bg-slate-800 border-slate-700 text-emerald-600 focus:ring-emerald-500">
                    <span class="text-slate-300">Headlights, indicators, hazard lamps, and reflectors fully operational.</span>
                </label>

                <label class="flex items-start space-x-3 p-4 bg-slate-900 rounded-2xl border border-slate-700 cursor-pointer">
                    <input type="checkbox" required class="mt-0.5 w-4 h-4 rounded bg-slate-800 border-slate-700 text-emerald-600 focus:ring-emerald-500">
                    <span class="text-slate-300">Driver rested, fit for duty, and verified under fatigue compliance rules.</span>
                </label>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-4 rounded-xl text-xs uppercase tracking-wider text-center transition shadow-lg shadow-emerald-600/25 cursor-pointer">
                    Confirm Safety Compliance & Proceed →
                </button>
            </form>
        </div>
    </main>

    <footer class="bg-slate-900 border-t border-slate-800 py-8 text-xs text-slate-500 font-mono text-center">
        <p>KRIM Logistics OS Driver Network © 2026. All rights reserved.</p>
    </footer>

    <script>
        function handleSafetyChecklist(e) {
            e.preventDefault();
            alert('Safety compliance checklist signed and validated! Proceeding to Emergency Support.');
            window.location.href = '/public/driver/emergency-support.html';
        }
    </script>
</body>
</html>
