<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRIM Logistics OS — Public Consignment Tracking</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#06b6d4">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { dark: { bg: '#090d16', card: '#111827', border: '#1f2937', accent: '#06b6d4' } } } } }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#090d16] text-gray-100 min-h-screen flex flex-col justify-between font-sans antialiased selection:bg-purple-500 selection:text-white">

    <div class="w-full bg-[#05080f] border-b border-gray-900 text-[11px] text-gray-400 py-1.5 px-6 flex justify-between items-center font-mono">
        <span class="flex items-center space-x-1.5"><span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span><span class="text-emerald-400 font-semibold">KRIM CORE: ONLINE</span></span>
        <span class="text-purple-400">Public Telemetry Node</span>
    </div>

    <header class="border-b border-gray-800 bg-[#090d16]/95 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded bg-gradient-to-br from-purple-600 to-indigo-600 flex items-center justify-center text-white font-bold text-sm shadow">K</div>
                <span class="text-sm font-extrabold tracking-wider text-white">KRIM OS — PUBLIC TRACKING</span>
            </div>
            <a href="/auth/login.html" class="text-xs font-mono text-purple-400 bg-purple-950/40 border border-purple-900 px-3 py-1.5 rounded-lg hover:bg-purple-950 transition">Customer Login →</a>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 py-16 flex-grow w-full space-y-8">
        <div class="bg-[#111827] border border-gray-800/80 rounded-2xl p-8 shadow-2xl text-center space-y-6">
            <span class="text-[10px] font-mono uppercase tracking-widest text-purple-400">INSTANT TELEMETRY LOOKUP</span>
            <h1 class="text-3xl font-extrabold text-white">Track Your Consignment</h1>
            <p class="text-sm text-gray-400">Enter your shipment reference ID to inspect real-time network status.</p>
            
            <div class="flex space-x-2">
                <input type="text" id="public-track-input" placeholder="Enter Shipment ID (e.g., 1)" class="flex-grow bg-[#090d16] border border-gray-700 rounded-xl px-4 py-3 text-white font-mono text-sm focus:outline-none focus:border-purple-500">
                <button onclick="runPublicTracking()" class="bg-purple-600 hover:bg-purple-500 text-white px-6 py-3 rounded-xl text-xs font-mono uppercase font-bold transition cursor-pointer">Track →</button>
            </div>

            <div id="public-tracking-result" class="text-left pt-4"></div>
        </div>
    </main>

    <footer class="border-t border-gray-800 py-8 text-center text-xs text-gray-500 font-mono">KRIM Logistics OS © 2026.</footer>

    <script>
        const SUPABASE_PROJECT_URL = "https://ebltviniygljwwseplph.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVibHR2aW5peWdsandsZXNwbHBoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEyOTIzMjksImV4cCI6MjA1Njg2ODMyOX0.9W2xZ47Lg2MvS8r1Z6N3q5t8v9w0x1y2z3A4B5C6D7E";
        const supabaseClient = window.supabase.createClient(SUPABASE_PROJECT_URL, SUPABASE_ANON_KEY);

        async function runPublicTracking() {
            const id = document.getElementById('public-track-input').value.trim();
            const resBox = document.getElementById('public-tracking-result');
            if (!id) {
                resBox.innerHTML = "<p class='text-red-400 font-mono text-xs'>Please enter a valid shipment ID.</p>";
                return;
            }
            resBox.innerHTML = "<p class='text-gray-400 font-mono text-xs'>Querying global telemetry...</p>";

            try {
                const { data, error } = await supabaseClient.from('krim_shipments').select('*').eq('id', id).single();
                if (error || !data) {
                    resBox.innerHTML = `<div class='p-4 bg-[#090d16] rounded-xl border border-red-900/50 text-red-400 font-mono text-xs'>Shipment #${id} not found in network.</div>`;
                } else {
                    resBox.innerHTML = `
                        <div class='bg-[#090d16] p-5 rounded-xl border border-gray-800 space-y-3 font-mono text-xs text-gray-300'>
                            <p class='text-purple-400 font-bold text-sm'>Consignment Telemetry Record (#${data.id})</p>
                            <p><strong>Route:</strong> ${data.origin_location_id || data.origin || 'Origin'} → ${data.destination_location_id || data.destination || 'Destination'}</p>
                            <p><strong>Cargo:</strong> ${data.goods_description || 'General Cargo'} (${data.total_weight_kg || 1000} kg)</p>
                            <p><strong>Status:</strong> <span class='text-emerald-400 uppercase font-bold'>${data.status || 'pending'}</span></p>
                        </div>`;
                }
            } catch (err) {
                resBox.innerHTML = `<p class='text-red-400 font-mono text-xs'>Lookup error occurred.</p>`;
            }
        }
    </script>
</body>
</html>
