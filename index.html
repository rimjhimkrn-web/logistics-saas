<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>KRIM | Global Institutional Logistics Operating System</title>
  
  <!-- PWA & Mobile Engine Meta Tags -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0a1128" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="KRIM Logistics" />
  <link rel="apple-touch-icon" href="/pwa-192x192.png" />

  <!-- Typography & Global Design System Tokens -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    /* KRIM Unified Institutional Design System Tokens */
    :root {
      --krim-navy-900: #0a1128;
      --krim-navy-800: #101f42;
      --krim-blue-600: #1e5bb8;
      --krim-blue-500: #2563eb;
      --krim-accent-cyan: #00d2ff;
      --bg-primary: #080d1a;
      --bg-surface: #101a30;
      --border-subtle: #1e2d4a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --state-delivered: #16a34a;
      --font-sans: 'Inter', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background-color: var(--bg-primary);
      color: var(--text-main);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation Shell */
    .krim-nav {
      background: var(--krim-navy-900);
      border-bottom: 1px solid var(--border-subtle);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .krim-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: 0.05em;
      color: #fff;
    }

    .krim-badge {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      background: rgba(0, 210, 255, 0.1);
      color: var(--krim-accent-cyan);
      border: 1px solid var(--krim-accent-cyan);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .krim-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    select.krim-i18n-select {
      background: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .btn-pwa-install {
      background: var(--krim-blue-500);
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: none; /* Auto-shows when PWA prompt triggers */
    }

    /* Hero / Tracking Interface Container */
    .krim-hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }

    .krim-search-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 8px;
      display: flex;
      width: 100%;
      max-width: 600px;
      margin-top: 24px;
    }

    .krim-search-box input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 12px 16px;
      color: var(--text-main);
      font-family: var(--font-mono);
      outline: none;
    }

    .krim-search-box button {
      background: var(--krim-blue-600);
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Coexistence Status Indicator */
    .krim-runtime-status {
      margin-top: 32px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255,255,255,0.03);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--border-subtle);
    }

    .status-dot {
      display: inline-block;
      width: 8 h;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #64748b;
      margin-right: 6px;
    }

    .status-dot.active { background: var(--state-delivered); }
  </style>

  <!-- Supabase JS Engine -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Institutional Global Header Navigation -->
  <header class="krim-nav">
    <div class="krim-brand">
      <span>KRIM</span>
      <span class="krim-badge">GLOBAL OS v1.0</span>
    </div>
    <div class="krim-controls">
      <!-- 15-Language Internationalization Selector -->
      <select id="krim-i18n" class="krim-i18n-select" aria-label="Select Language">
        <option value="en">English (US/Global)</option>
        <option value="hi">Hindi (हिन्दी)</option>
        <option value="ar">Arabic (العربية)</option>
        <option value="es">Spanish (Español)</option>
        <option value="fr">French (Français)</option>
        <option value="pt">Portuguese (Português)</option>
        <option value="de">German (Deutsch)</option>
        <option value="it">Italian (Italiano)</option>
        <option value="nl">Dutch (Nederlands)</option>
        <option value="tr">Turkish (Türkçe)</option>
        <option value="zh">Chinese (中文)</option>
        <option value="ja">Japanese (日本語)</option>
        <option value="ko">Korean (한국어)</option>
        <option value="ru">Russian (Русский)</option>
        <option value="bn">Bengali (বাংলা)</option>
      </select>

      <!-- App Install PWA Trigger Button -->
      <button id="pwa-install-btn" class="btn-pwa-install">Install App</button>
    </div>
  </header>

  <!-- Public Logistics Entry Engine -->
  <main class="krim-hero">
    <h1 id="hero-title" style="font-size: 2.25rem; font-weight: 700;">Global Supply Chain Infrastructure</h1>
    <p id="hero-subtitle" style="color: var(--text-muted); margin-top: 8px; max-width: 500px;">
      Multi-modal freight routing, automated tracking, and unified enterprise operations.
    </p>

    <!-- Public Tracking Entry Form -->
    <div class="krim-search-box">
      <input type="text" id="tracking-input" placeholder="Enter Waybill, Container, or Shipment ID..." />
      <button id="tracking-btn">Track Cargo</button>
    </div>

    <!-- Coexistence Runtime Indicator -->
    <div class="krim-runtime-status">
      <span id="runtime-dot" class="status-dot"></span>
      <span id="runtime-text">Booting Canonical Engine...</span>
    </div>
  </main>

  <!-- Batch 3 Activation Runtime Stack -->
  <script>
    /**
     * Batch 3 - Canonical Runtime Bootloader & Compatibility Layer
     */
    (function () {
      'use strict';

      // 1. Initialize Global Event Bridge
      window.KRIM_BRIDGE = {
        emit: function (eventName, payload) {
          window.dispatchEvent(new CustomEvent('krim:' + eventName, { detail: payload }));
        },
        subscribe: function (eventName, callback) {
          window.addEventListener('krim:' + eventName, function (e) { callback(e.detail); });
        }
      };

      // 2. Register Service Worker for Mobile PWA Capabilities
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function (err) {
            console.log('[PWA SW] ServiceWorker registration deferred:', err);
          });
        });
      }

      // 3. Handle PWA Mobile Installation Prompt
      let deferredPrompt;
      const installBtn = document.getElementById('pwa-install-btn');
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.style.display = 'block';
      });

      installBtn.addEventListener('click', function () {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then(function (choice) {
            if (choice.outcome === 'accepted') {
              console.log('[PWA] Application installed by user.');
            }
            deferredPrompt = null;
            installBtn.style.display = 'none';
          });
        }
      });

      // 4. Canonical Platform Initialization Boot Sequence
      document.addEventListener('DOMContentLoaded', function () {
        const dot = document.getElementById('runtime-dot');
        const text = document.getElementById('runtime-text');

        setTimeout(function () {
          window.__KRIM_PLATFORM_ACTIVE__ = true;
          dot.classList.add('active');
          text.textContent = 'Canonical Engine Active (Coexistence Mode)';
          
          window.KRIM_BRIDGE.emit('platform:ready', {
            timestamp: new Date().toISOString(),
            status: 'ACTIVE_COEXISTENCE'
          });
        }, 500);
      });
    })();
  </script>
</body>
  </html>
