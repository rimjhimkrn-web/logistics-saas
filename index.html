<!DOCTYPE html>
<html>
<head>
    <title>My First Logistics Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 40px;
        }

        h1 {
            color: #123b6d;
        }

        h2 {
            color: #1f6f8b;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }
      
      button {
            background: #123b6d;
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 17px;
            border-radius: 8px;
            cursor: pointer;
      }
    form {
    margin-top: 30px;
}

label {
    display: block;
    margin-top: 18px;
    margin-bottom: 6px;
    font-weight: bold;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 14px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 6px;
}

form button {
    width: 100%;
    margin-top: 25px;
}
    </style>
</head>

<body>

    <h1>Welcome to My Logistics Business</h1>

    <p>I am building my first logistics website.</p>

    <h2>Our Services</h2>

    <p>We help businesses coordinate transportation and logistics.</p>
<form id="shipmentForm">



    <h2>Request a Shipment</h2>

    <label>Pickup Location</label>
    <input type="text" id="pickup_location" name="pickup_location" placeholder="Enter pickup location" required>

    <label>Delivery Location</label>
    <input type="text" id="delivery_location" name="delivery_location" placeholder="Enter delivery location" required>

    <label>Material / Good</label>
    <input type="text" id="material_goods" name="material_goods" placeholder="What are you transporting?" required>
    <label>Weight</label>
    <input type="text" id="weight" name="weight" placeholder="Example: 10 tonnes" required>

    <label>Truck Type</label>
    <input type="text" id="truck_type" name="truck_type" placeholder="Example: 32 ft" required>

    <label>Your Name</label>
    <input type="text" id="customer_name" name="customer_name" placeholder="Enter your name" required>

    <label>Phone Number</label>
    <input type="tel" id="phone_number" name="phone_number" placeholder="Enter your phone number" required>

    <button type="submit" id="submitButton">Submit Shipment Request</button>

</form>
<script>
    const shipmentForm = document.getElementById("shipmentForm");

    shipmentForm.addEventListener("submit", async function(event) {
        event.preventDefault();

            const submitButton = document.getElementById("submitButton");

                submitButton.disabled = true;
                    submitButton.textContent = "Submitting...";

                        const pickup_location = document.getElementById("pickup_location").value.trim();
                            const delivery_location = document.getElementById("delivery_location").value.trim();
                                const material_goods = document.getElementById("material_goods").value.trim();
                                    const weight = document.getElementById("weight").value.trim();
                                        const truck_type = document.getElementById("truck_type").value.trim();
                                            const customer_name = document.getElementById("customer_name").value.trim();
                                                const phone_number = document.getElementById("phone_number").value.trim();

                                                    if (
                                                            !pickup_location ||
                                                                    !delivery_location ||
                                                                            !material_goods ||
                                                                                    !weight ||
                                                                                            !truck_type ||
                                                                                                    !customer_name ||
                                                                                                            !phone_number
                                                                                                                ) {
                                                                                                                        alert("Please fill all fields.");
                                                                                                                                submitButton.disabled = false;
                                                                                                                                        submitButton.textContent = "Submit Shipment Request";
                                                                                                                                                return;
                                                                                                                                                    }

                                                                                                                                                        const { data, error } = await supabaseClient
                                                                                                                                                                .from("shipment_requests")
                                                                                                                                                                        .insert([
                                                                                                                                                                                    {
                                                                                                                                                                                                    pickup_location: pickup_location,
                                                                                                                                                                                                                    delivery_location: delivery_location,
                                                                                                                                                                                                                                    material_goods: material_goods,
                                                                                                                                                                                                                                                    weight: weight,
                                                                                                                                                                                                                                                                    truck_type: truck_type,
                                                                                                                                                                                                                                                                                    customer_name: customer_name,
                                                                                                                                                                                                                                                                                                    phone_number: phone_number
                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                        ])
                                                                                                                                                                                                                                                                                                                                .select();

                                                                                                                                                                                                                                                                                                                                    if (error) {
                                                                                                                                                                                                                                                                                                                                            console.error("Supabase error:", error);
                                                                                                                                                                                                                                                                                                                                                    alert("Shipment could not be submitted: " + error.message);

                                                                                                                                                                                                                                                                                                                                                            submitButton.disabled = false;
                                                                                                                                                                                                                                                                                                                                                                    submitButton.textContent = "Submit Shipment Request";
                                                                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                    alert("Shipment request submitted successfully!");

                                                                                                                                                                                                                                                                                                                                                                                        shipmentForm.reset();

                                                                                                                                                                                                                                                                                                                                                                                            submitButton.disabled = false;
                                                                                                                                                                                                                                                                                                                                                                                                submitButton.textContent = "Submit Shipment Request";
                                                                                                                                                                                                                                                                                                                                                                                                });
                                                                                                                                                                                                                                                                                                                                                                                                </script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</body>
</html>
