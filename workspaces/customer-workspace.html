<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fa;color:#172033;font:14px Arial,sans-serif}
a{text-decoration:none;color:inherit}
.cw-head{height:64px;background:#fff;border-bottom:1px solid #e3e7ed;
display:flex;align-items:center;padding:0 18px;gap:14px;position:sticky;top:0;z-index:20}
.cw-logo{width:34px;height:34px;border-radius:8px;background:#0b5cff;color:white;
display:grid;place-items:center;font-weight:bold}
.cw-brand{font-weight:800}.cw-brand small{display:block;font-size:8px;color:#7b8492}
.cw-search{flex:1;max-width:430px;padding:9px 12px;border:1px solid #dfe4eb;border-radius:7px}
.cw-head-space{flex:1}
.cw-icon,.cw-user,.cw-menu{border:1px solid #dfe4eb;background:#fff;border-radius:7px;padding:8px;cursor:pointer}
.cw-user{display:flex;align-items:center;gap:7px}
.cw-avatar{width:25px;height:25px;border-radius:50%;background:#eaf1ff;color:#0b5cff;
display:grid;place-items:center;font-weight:bold}
.cw-menu{display:none}

.cw-side{position:fixed;top:64px;bottom:0;width:225px;background:#fff;
border-right:1px solid #e3e7ed;padding:16px 10px;overflow:auto;z-index:15}
.cw-label{font-size:9px;color:#8993a2;font-weight:bold;margin:14px 9px 5px}
.cw-nav{display:block;padding:9px;border-radius:7px;color:#536074;font-size:12px}
.cw-nav:hover,.cw-nav.active{background:#eaf1ff;color:#0b5cff}

.cw-main{margin-left:225px;padding:25px}
.cw-container{max-width:1450px;margin:auto}
.cw-top{display:flex;justify-content:space-between;gap:15px;align-items:end}
.cw-top h1{margin:4px 0;font-size:30px}
.cw-top p{margin:0 0 18px;color:#697586;font-size:12px}
.cw-actions{display:flex;gap:7px;flex-wrap:wrap}
.cw-btn{padding:10px 13px;border-radius:7px;border:1px solid #dfe4eb;background:#fff;font-size:11px;font-weight:bold}
.cw-primary{background:#0b5cff;color:#fff;border-color:#0b5cff}

.cw-context,.cw-kpis,.cw-grid,.cw-domains{display:grid;gap:10px;margin:15px 0}
.cw-context{grid-template-columns:2fr repeat(4,1fr)}
.cw-kpis{grid-template-columns:repeat(6,1fr)}
.cw-grid{grid-template-columns:1.7fr 1fr}
.cw-domains{grid-template-columns:repeat(7,1fr)}

.cw-card{background:#fff;border:1px solid #e0e5ec;border-radius:9px;padding:14px}
.cw-context .cw-card{padding:11px}
.cw-card small{display:block;color:#8993a2;font-size:9px}
.cw-card b{display:block;margin-top:5px;font-size:13px}
.cw-kpi b{font-size:23px}
.cw-links{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cw-link{padding:14px;border:1px solid #e1e6ed;border-radius:7px;font-size:11px}
.cw-link:hover{border-color:#0b5cff;color:#0b5cff}
.cw-domain{min-height:65px}
.cw-domain b{font-size:11px}

.cw-footer{margin-top:25px;background:#14233a;color:#fff;padding:25px;border-radius:10px}
.cw-footer-grid{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:25px}
.cw-footer a{display:block;color:#cbd4df;font-size:10px;margin:7px 0}
.cw-footer p{color:#b6c0cc;font-size:10px;line-height:1.5}
.cw-bottom{margin-top:18px;padding-top:12px;border-top:1px solid #304057;
display:flex;justify-content:space-between;color:#aeb8c5;font-size:9px}

.cw-menu-panel{display:none;position:fixed;right:10px;top:58px;background:#fff;
border:1px solid #dfe4eb;border-radius:9px;padding:10px;z-index:30;min-width:180px;
box-shadow:0 8px 30px #0002}
.cw-menu-panel.open{display:block}
.cw-menu-panel a,.cw-menu-panel button{display:block;width:100%;padding:9px;border:0;
background:none;text-align:left;font-size:11px;cursor:pointer}

@media(max-width:900px){
.cw-kpis{grid-template-columns:repeat(3,1fr)}
.cw-domains{grid-template-columns:repeat(4,1fr)}
.cw-context{grid-template-columns:repeat(2,1fr)}
.cw-grid{grid-template-columns:1fr}
}
@media(max-width:700px){
.cw-menu{display:block}
.cw-side{transform:translateX(-105%);transition:.2s}
.cw-side.open{transform:translateX(0)}
.cw-main{margin-left:0;padding:18px 12px}
.cw-search{max-width:none}
.cw-icon{display:none}
.cw-top{display:block}
.cw-top h1{font-size:25px}
.cw-kpis{grid-template-columns:repeat(2,1fr)}
.cw-domains{grid-template-columns:repeat(2,1fr)}
.cw-footer-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:450px){
.cw-brand small{display:none}
.cw-search{display:none}
.cw-context{grid-template-columns:1fr 1fr}
.cw-links{grid-template-columns:1fr 1fr}
.cw-footer-grid{grid-template-columns:1fr}
.cw-bottom{display:block;line-height:1.8}
}
</style>
</head>

<script>
(function(){
"use strict";

const menu=document.getElementById("menu");
const side=document.getElementById("side");
const account=document.getElementById("account");
const panel=document.getElementById("accountPanel");

menu.onclick=()=>side.classList.toggle("open");
account.onclick=()=>panel.classList.toggle("open");

document.querySelectorAll(".cw-nav").forEach(x=>{
 x.onclick=()=>side.classList.remove("open");
});

document.getElementById("signout").onclick=async()=>{
 try{
  if(window.KRIM_AUTH) await KRIM_AUTH.signOut();
 }finally{
  window.location.href="../login.html";
 }
};

(async()=>{
 try{
  if(window.KRIM_AUTH){
   const user=await KRIM_AUTH.getUser();
   if(user){
    document.getElementById("email").textContent=user.email||"Customer";
    document.getElementById("avatar").textContent=
      (user.email||"C").charAt(0).toUpperCase();
   }
  }
 }catch(e){console.warn("KRIM session:",e)}
})();

})();
</script>
