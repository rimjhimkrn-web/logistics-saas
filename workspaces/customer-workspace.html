<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="KRIM Logistics global customer operations workspace."
    >

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <title>Operations | KRIM Logistics</title>

    <link rel="stylesheet" href="../core/krim-core.css">
    <link rel="stylesheet" href="../core/krim-components.css">
    <link rel="stylesheet" href="../core/krim-responsive.css">

    <style>
        /*
         * =====================================================
         * KRIM CUSTOMER OPERATIONS WORKSPACE
         *
         * Page-specific composition only.
         * Shared visual primitives remain in core/components.
         * =====================================================
         */

        .krim-os {
            min-height: 100vh;
            background: var(--krim-bg);
        }

        /* =====================================================
           GLOBAL TOP BAR
           ===================================================== */

        .krim-os-topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            min-height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 0 24px;
            background: var(--krim-surface);
            border-bottom: 1px solid var(--krim-border);
        }

        .krim-os-brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: inherit;
            text-decoration: none;
            flex-shrink: 0;
        }

        .krim-os-brand-mark {
            width: 38px;
            height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: var(--krim-primary);
            color: #fff;
            font-weight: 800;
        }

        .krim-os-brand-text {
            display: grid;
            line-height: 1.1;
        }

        .krim-os-brand-name {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .krim-os-brand-subtitle {
            margin-top: 3px;
            color: var(--krim-text-muted);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .krim-os-top-context {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex: 1;
        }

        .krim-os-context-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 10px;
            border: 1px solid var(--krim-border);
            border-radius: 8px;
            background: var(--krim-surface);
            color: var(--krim-text-muted);
            font-size: 11px;
            white-space: nowrap;
        }

        .krim-os-context-item strong {
            color: var(--krim-text);
        }

        .krim-os-user {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .krim-os-avatar {
            width: 36px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--krim-primary-soft);
            color: var(--krim-primary);
            font-size: 13px;
            font-weight: 800;
        }

        .krim-os-user-details {
            display: grid;
            gap: 2px;
            max-width: 190px;
        }

        .krim-os-user-role {
            color: var(--krim-text-muted);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .krim-os-user-email {
            overflow: hidden;
            color: var(--krim-text);
            font-size: 12px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* =====================================================
           APPLICATION NAVIGATION
           ===================================================== */

        .krim-os-nav {
            position: sticky;
            top: 68px;
            z-index: 90;
            display: flex;
            align-items: center;
            gap: 2px;
            overflow-x: auto;
            padding: 0 24px;
            background: var(--krim-surface);
            border-bottom: 1px solid var(--krim-border);
            scrollbar-width: thin;
        }

        .krim-os-nav-link {
            display: inline-flex;
            align-items: center;
            min-height: 48px;
            padding: 0 14px;
            color: var(--krim-text-muted);
            text-decoration: none;
            border-bottom: 2px solid transparent;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }

        .krim-os-nav-link:hover {
            color: var(--krim-text);
        }

        .krim-os-nav-link.is-active {
            color: var(--krim-primary);
            border-bottom-color: var(--krim-primary);
        }

        /* =====================================================
           MAIN OPERATING AREA
           ===================================================== */

        .krim-os-main {
            width: 100%;
            max-width: 1500px;
            margin: 0 auto;
            padding: 30px 24px 56px;
        }

        .krim-os-heading {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 24px;
        }

        .krim-os-heading-left {
            max-width: 760px;
        }

        .krim-os-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 10px;
            color: var(--krim-primary);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.09em;
            text-transform: uppercase;
        }

        .krim-os-eyebrow::before {
            content: "";
            width: 18px;
            height: 2px;
            border-radius: 2px;
            background: var(--krim-primary);
        }

        .krim-os-heading h1 {
            margin: 0;
            font-size: clamp(28px, 3vw, 40px);
            line-height: 1.1;
            letter-spacing: -0.035em;
        }

        .krim-os-heading p {
            margin: 9px 0 0;
            color: var(--krim-text-muted);
            line-height: 1.6;
        }

        .krim-os-heading-actions {
            display: flex;
            align-items: center;
            gap: 9px;
            flex-shrink: 0;
        }

        /* =====================================================
           OPERATIONAL STATUS STRIP
           ===================================================== */

        .krim-os-status-strip {
            display: grid;
            grid-template-columns:
                minmax(0, 1.7fr)
                repeat(3, minmax(150px, 0.8fr));
            gap: 1px;
            margin-bottom: 24px;
            overflow: hidden;
            border: 1px solid var(--krim-border);
            border-radius: 12px;
            background: var(--krim-border);
        }

        .krim-os-status-cell {
            min-height: 82px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 15px 18px;
            background: var(--krim-surface);
        }

        .krim-os-status-label {
            color: var(--krim-text-muted);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .krim-os-status-value {
            margin-top: 6px;
            font-size: 16px;
            font-weight: 800;
        }

        .krim-os-status-note {
            margin-top: 3px;
            color: var(--krim-text-muted);
            font-size: 10px;
        }

        /* =====================================================
           KPI SYSTEM
           ===================================================== */

        .krim-os-kpis {
            display: grid;
            grid-template-columns:
                repeat(4, minmax(0, 1fr));
            gap: 14px;
            margin-bottom: 24px;
        }

        .krim-os-kpi {
            min-height: 140px;
            background: var(--krim-surface);
            border: 1px solid var(--krim-border);
            border-radius: 12px;
            box-shadow: var(--krim-shadow-sm);
        }

        .krim-os-kpi-body {
            padding: 19px;
        }

        .krim-os-kpi-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .krim-os-kpi-label {
            color: var(--krim-text-muted);
            font-size: 11px;
            font-weight: 700;
        }

        .krim-os-kpi-code {
            color: var(--krim-text-muted);
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 0.08em;
        }

        .krim-os-kpi-value {
            margin-top: 13px;
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.04em;
        }

        .krim-os-kpi-note {
            margin-top: 6px;
            color: var(--krim-text-muted);
            font-size: 11px;
        }

        /* =====================================================
           OPERATIONAL GRID
           ===================================================== */

        .krim-os-grid {
            display: grid;
            grid-template-columns:
                minmax(0, 1.65fr)
                minmax(300px, 0.85fr);
            gap: 18px;
            margin-bottom: 18px;
        }

        .krim-os-card {
            overflow: hidden;
            background: var(--krim-surface);
            border: 1px solid var(--krim-border);
            border-radius: 12px;
            box-shadow: var(--krim-shadow-sm);
        }

        .krim-os-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            min-height: 60px;
            padding: 0 19px;
            border-bottom: 1px solid var(--krim-border);
        }

        .krim-os-card-title {
            display: grid;
            gap: 3px;
        }

        .krim-os-card-title h2 {
            margin: 0;
            font-size: 15px;
            letter-spacing: -0.01em;
        }

        .krim-os-card-title span {
            color: var(--krim-text-muted);
            font-size: 10px;
        }

        .krim-os-card-header a {
            color: var(--krim-primary);
            font-size: 11px;
            font-weight: 700;
            text-decoration: none;
        }

        .krim-os-card-header a:hover {
            text-decoration: underline;
        }

        .krim-os-card-body {
            padding: 19px;
        }

        /* =====================================================
           SHIPMENT TABLE
           ===================================================== */

        .krim-os-table-wrap {
            overflow-x: auto;
        }

        .krim-os-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
        }

        .krim-os-table th {
            padding: 10px 8px;
            color: var(--krim-text-muted);
            border-bottom: 1px solid var(--krim-border);
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-align: left;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .krim-os-table td {
            padding: 13px 8px;
            border-bottom: 1px solid var(--krim-border);
            vertical-align: middle;
        }

        .krim-os-table tbody tr:last-child td {
            border-bottom: 0;
        }

        .krim-os-table-reference {
            color: var(--krim-text);
            font-weight: 800;
        }

        .krim-os-table-secondary {
            margin-top: 3px;
            color: var(--krim-text-muted);
            font-size: 10px;
        }

        .krim-os-empty {
            padding: 34px 12px;
            color: var(--krim-text-muted);
            text-align: center;
            font-size: 12px;
        }

        /* =====================================================
           ATTENTION PANEL
           ===================================================== */

        .krim-os-attention-list {
            display: grid;
            gap: 10px;
        }

        .krim-os-attention-item {
            display: flex;
            align-items: flex-start;
            gap: 11px;
            padding: 12px;
            border: 1px solid var(--krim-border);
            border-radius: 9px;
        }

        .krim-os-attention-indicator {
            width: 7px;
            height: 7px;
            flex: 0 0 7px;
            margin-top: 5px;
            border-radius: 50%;
            background: var(--krim-success);
        }

        .krim-os-attention-content strong {
            display: block;
            font-size: 11px;
        }

        .krim-os-attention-content span {
            display: block;
            margin-top: 3px;
            color: var(--krim-text-muted);
            font-size: 10px;
            line-height: 1.45;
        }

        /* =====================================================
           DOMAIN MATRIX
           ===================================================== */

        .krim-os-domain-grid {
            display: grid;
            grid-template-columns:
                repeat(4, minmax(0, 1fr));
            gap: 10px;
        }

        .krim-os-domain {
            min-height: 92px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 13px;
            border: 1px solid var(--krim-border);
            border-radius: 10px;
            color: inherit;
            text-decoration: none;
            transition:
                border-color 0.18s ease,
                transform 0.18s ease;
        }

        .krim-os-domain:hover {
            border-color: var(--krim-primary);
            transform: translateY(-1px);
        }

        .krim-os-domain-code {
            color: var(--krim-text-muted);
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 0.07em;
        }

        .krim-os-domain strong {
            font-size: 12px;
        }

        .krim-os-domain span {
            color: var(--krim-text-muted);
            font-size: 9px;
            line-height: 1.35;
        }

        /* =====================================================
           LOWER OPERATING PANELS
           ===================================================== */

        .krim-os-lower-grid {
            display: grid;
            grid-template-columns:
                repeat(3, minmax(0, 1fr));
            gap: 18px;
        }

        .krim-os-list {
            display: grid;
            gap: 0;
        }

        .krim-os-list-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 12px 0;
            border-bottom: 1px solid var(--krim-border);
        }

        .krim-os-list-row:last-child {
            border-bottom: 0;
        }

        .krim-os-list-row strong {
            display: block;
            font-size: 11px;
        }

        .krim-os-list-row span {
            display: block;
            margin-top: 3px;
            color: var(--krim-text-muted);
            font-size: 9px;
        }

        /* =====================================================
           FOOTER
           ===================================================== */

        .krim-os-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-top: 30px;
            padding-top: 18px;
            border-top: 1px solid var(--krim-border);
            color: var(--krim-text-muted);
            font-size: 10px;
        }

        .krim-os-footer-links {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .krim-os-footer a {
            color: inherit;
            text-decoration: none;
        }

        .krim-os-footer a:hover {
            color: var(--krim-primary);
        }

        /* =====================================================
           RESPONSIVE
           ===================================================== */

        @media (max-width: 1200px) {

            .krim-os-kpis {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

            .krim-os-domain-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

            .krim-os-lower-grid {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 980px) {

            .krim-os-grid {
                grid-template-columns: 1fr;
            }

            .krim-os-status-strip {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

            .krim-os-status-cell:first-child {
                grid-column: 1 / -1;
            }

        }

        @media (max-width: 760px) {

            .krim-os-topbar {
                padding: 0 16px;
            }

            .krim-os-top-context {
                display: none;
            }

            .krim-os-nav {
                top: 68px;
                padding: 0 16px;
            }

            .krim-os-main {
                padding:
                    24px 16px 42px;
            }

            .krim-os-heading {
                align-items: flex-start;
                flex-direction: column;
            }

            .krim-os-heading-actions {
                width: 100%;
            }

            .krim-os-heading-actions .krim-btn {
                flex: 1;
            }

            .krim-os-user-details {
                display: none;
            }

        }

        @media (max-width: 520px) {

            .krim-os-brand-subtitle {
                display: none;
            }

            .krim-os-kpis {
                grid-template-columns: 1fr;
            }

            .krim-os-status-strip {
                grid-template-columns: 1fr;
            }

            .krim-os-status-cell:first-child {
                grid-column: auto;
            }

            .krim-os-domain-grid {
                grid-template-columns: 1fr;
            }

            .krim-os-heading-actions {
                flex-direction: column;
            }

            .krim-os-heading-actions .krim-btn {
                width: 100%;
            }

            .krim-os-footer {
                align-items: flex-start;
                flex-direction: column;
            }

        }

        @media (prefers-reduced-motion: reduce) {

            .krim-os-domain {
                transition: none;
            }

        }
    </style>
</head>

<body>

<div class="krim-os">

    <!-- =====================================================
         GLOBAL PLATFORM HEADER
         ===================================================== -->

    <header class="krim-os-topba
