<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <title>Customer Command Centre | KRIM Logistics</title>

    <link rel="stylesheet" href="../core/krim-core.css">
    <link rel="stylesheet" href="../core/krim-components.css">
    <link rel="stylesheet" href="../core/krim-responsive.css">

    <style>
        /* =========================================================
           KRIM CUSTOMER COMMAND CENTRE
           Institutional responsive workspace
           ========================================================= */

        :root {
            --cw-sidebar: 248px;
            --cw-header: 68px;
            --cw-radius: 12px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background: var(--krim-bg, #f5f7fa);
            color: var(--krim-text, #172033);
            font-family: Inter, -apple-system, BlinkMacSystemFont,
                "Segoe UI", Roboto, Arial, sans-serif;
        }

        a {
            color: inherit;
        }

        button,
        input,
        select {
            font: inherit;
        }

        .cw-app {
            min-height: 100vh;
        }

        /* =========================================================
           HEADER
           ========================================================= */

        .cw-header {
            position: fixed;
            z-index: 1000;
            top: 0;
            right: 0;
            left: 0;
            height: var(--cw-header);
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 0 20px;
            background: rgba(255,255,255,.97);
            border-bottom: 1px solid var(--krim-border, #dfe4ec);
            backdrop-filter: blur(14px);
        }

        .cw-menu-button {
            display: none;
            width: 40px;
            height: 40px;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--krim-border, #dfe4ec);
            border-radius: 9px;
            background: #fff;
            cursor: pointer;
        }

        .cw-brand {
            width: var(--cw-sidebar);
            flex: 0 0 var(--cw-sidebar);
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .cw-logo {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 9px;
            background: #0b5cff;
            color: #fff;
            font-weight: 900;
        }

        .cw-brand-name {
            font-size: 17px;
            font-weight: 850;
            letter-spacing: -.03em;
        }

        .cw-brand-subtitle {
            display: block;
            margin-top: 1px;
            color: var(--krim-text-muted, #687386);
            font-size: 8px;
            font-weight: 750;
            letter-spacing: .07em;
            text-transform: uppercase;
        }

        .cw-global-search {
            width: min(430px, 36vw);
            position: relative;
        }

        .cw-global-search input {
            width: 100%;
            height: 40px;
            padding: 0 14px 0 39px;
            border: 1px solid var(--krim-border, #dfe4ec);
            border-radius: 9px;
            outline: none;
            background: #f8fafc;
            color: var(--krim-text, #172033);
            font-size: 12px;
        }

        .cw-global-search input:focus {
            border-color: #0b5cff;
            background: #fff;
        }

        .cw-search-icon {
            position: absolute;
            top: 50%;
            left: 13px;
            transform: translateY(-50%);
            color: #7b8494;
            font-size: 14px;
        }

        .cw-header-spacer {
            flex: 1;
        }

        .cw-header-actions {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .cw-icon-button {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 1px solid var(--krim-border, #dfe4ec);
            border-radius: 9px;
            background: #fff;
            color: #465266;
            cursor: pointer;
        }

        .cw-icon-button:hover {
            border-color: #0b5cff;
            color: #0b5cff;
        }

        .cw-notification-dot {
            position: absolute;
            top: 7px;
            right: 7px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #e5484d;
        }

        .cw-user-button {
            min-height: 40px;
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 3px 8px 3px 4px;
            border: 1px solid var(--krim-border, #dfe4ec);
            border-radius: 9px;
            background: #fff;
            cursor: pointer;
        }

        .cw-avatar {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #eaf1ff;
            color: #0b5cff;
            font-size: 11px;
            font-weight: 850;
        }

        .cw-user-text {
            text-align: left;
        }

        .cw-user-text strong {
            display: block;
            max-width: 160px;
            overflow: hidden;
            font-size: 10px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .cw-user-text span {
            display: block;
            margin-top: 2px;
            color: #7a8494;
            font-size: 8px;
        }

        /* =========================================================
           SIDEBAR
           ========================================================= */

        .cw-sidebar {
            position: fixed;
            z-index: 900;
            top: var(--cw-header);
            bottom: 0;
            left: 0;
            width: var(--cw-sidebar);
            overflow-y: auto;
            padding: 15px 11px 20px;
            background: #fff;
            border-right: 1px solid var(--krim-border, #dfe4ec);
        }

        .cw-sidebar-section {
            margin-bottom: 19px;
        }

        .cw-sidebar-label {
            padding: 0 10px 7px;
            color: #8a94a4;
            font-size: 8px;
            font-weight: 850;
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        .cw-nav-item {
            min-height: 38px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 2px 0;
            padding: 0 10px;
            border-radius: 8px;
            color: #536074;
            text-decoration: none;
            font-size: 11px;
            font-weight: 650;
        }

        .cw-nav-item:hover {
            background: #f2f6ff;
            color: #0b5cff;
        }

        .cw-nav-item.active {
            background: #eaf1ff;
            color: #0b5cff;
            font-weight: 800;
        }

        .cw-nav-icon {
            width: 20px;
            text-align: center;
            font-size: 13px;
        }

        .cw-nav-badge {
            margin-left: auto;
            min-width: 20px;
            padding: 2px 5px;
            border-radius: 10px;
            background: #edf1f6;
            color: #687386;
            font-size: 8px;
            text-align: center;
        }

        .cw-sidebar-market {
            margin: 8px 5px 18px;
            padding: 12px;
            border: 1px solid var(--krim-border, #dfe4ec);
            border-radius: 9px;
            background: #fafbfd;
        }

        .cw-sidebar-market-label {
            color: #8993a2;
            font-size: 8px;
            font-weight: 750;
            text-transform: uppercase;
        }

        .cw-sidebar-market-value {
            margin-top: 5px;
            font-size: 11px;
            font-weight: 800;
        }

        /* =========================================================
           MAIN
           ========================================================= */

        .cw-main {
            min-height: 100vh;
            margin-left: var(--cw-sidebar);
            padding-top: var(--cw-header);
        }

        .cw-content {
            width: 100%;
            max-width: 1700px;
            margin: 0 auto;
            padding: 26px;
        }

        .cw-breadcrumb {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 10px;
            color: #8a94a4;
            font-size: 9px;
        }

        .cw-breadcrumb strong {
            color: #4e596b;
        }

        .cw-page-head {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 22px;
        }

        .cw-eyebrow {
            margin-bottom: 6px;
            color: #0b5cff;
            font-size: 9px;
            font-weight: 850;
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        .cw-page-title {
            margin: 0;
            font-size: clamp(25px, 3vw, 36px);
            line-height: 1.1;
            letter-spacing: -.04em;
        }

        .cw-page-description {
            max-width: 720px;
            margin: 8px 0 0;
            color: #687386;
            font-size: 12px;
            line-height: 1.55;
        }

        .cw-page-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .cw-button {
            min-height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 0 13px;
            border: 1px solid transparent;
            border-radius: 8px;
            text-decoration: none;
            font-size: 10px;
            font-weight: 800;
            cursor: pointer;
        }

        .cw-button-primary {
            background: #0b5cff;
            color: #fff;
        }

        .cw-button-primary:hover {
            background: #084dcc;
        }

        .cw-button-secondary {
            background: #fff;
            border-color: #dfe4ec;
            color: #465266;
        }

        .cw-button-secondary:hover {
            border-color: #0b5cff;
            color: #0b5cff;
        }

        /* =========================================================
           CONTEXT BAR
           ========================================================= */

        .cw-context {
            display: grid;
            grid-template-columns: 1.6fr repeat(4, 1fr);
            overflow: hidden;
            margin-bottom: 18px;
            border: 1px solid #dfe4ec;
            border-radius: 10px;
            background: #dfe4ec;
            gap: 1px;
        }

        .cw-context-cell {
            min-height: 65px;
            padding: 12px 14px;
            background: #fff;
        }

        .cw-context-label {
            color: #8993a2;
            font-size: 8px;
            font-weight: 750;
            text-transform: uppercase;
            letter-spacing: .06em;
        }

        .cw-context-value {
            display: block;
            margin-top: 6px;
            font-size: 11px;
            font-weight: 800;
        }

        /* =========================================================
           KPI
           ========================================================= */

        .cw-kpi-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 11px;
            margin-bottom: 18px;
        }

        .cw-kpi {
            min-width: 0;
            padding: 15px;
            border: 1px solid #dfe4ec;
            border-radius: 10px;
            background: #fff;
        }

        .cw-kpi-label {
            color: #7c8797;
            font-size: 8px;
            font-weight: 750;
            text-transform: uppercase;
        }

        .cw-kpi-value {
            margin-top: 9px;
            font-size: 23px;
            font-weight: 850;
            letter-spacing: -.04em;
        }

        .cw-kpi-note {
            margin-top: 4px;
            color: #8993a2;
            font-size: 8px;
        }

        /* =========================================================
           PANELS
           ========================================================= */

        .cw-grid-main {
            display: grid;
            grid-template-columns: minmax(0, 1.8fr) minmax(280px, .85fr);
            gap: 16px;
            margin-bottom: 16px;
        }

        .cw-grid-two {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }

        .cw-panel {
            min-width: 0;
            overflow: hidden;
            border: 1px solid #dfe4ec;
            border-radius: 11px;
            background: #fff;
        }

        .cw-panel-head {
            min-height: 57px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 0 16px;
            border-bottom: 1px solid #e8ebf0;
        }

        .cw-panel-title {
            margin: 0;
            font-size: 12px;
            font-weight: 850;
        }

        .cw-panel-subtitle {
            margin-top: 3px;
            color: #8993a2;
            font-size: 8px;
        }

        .cw-panel-link {
            color: #0b5cff;
            font-size: 9px;
            font-weight: 800;
            text-decoration: none;
            white-space: nowrap;
        }

        .cw-panel-body {
            padding: 15px;
        }

        /* =========================================================
           SHIPMENT TABLE
           ========================================================= */

        .cw-table-tools {
            display: flex;
            gap: 7px;
            margin-bottom: 12px;
        }

        .cw-table-search {
            flex: 1;
            min-width: 0;
            height: 35px;
            padding: 0 10px;
            border: 1px solid #dfe4ec;
            border-radius: 7px;
            outline: none;
            font-size: 10px;
        }

        .cw-filter {
            height: 35px;
            padding: 0 10px;
            border: 1px solid #dfe4ec;
            border-radius: 7px;
            background: #fff;
            color: #536074;
            font-size: 9px;
        }

        .cw-table-wrap {
            width: 100%;
            overflow-x: auto;
        }

        .cw-table {
            width: 100%;
            min-width: 680px;
            border-collapse: collapse;
        }

        .cw-table th {
            padding: 9px;
            background: #f8fafc;
            color: #8993a2;
            font-size: 8px;
            font-weight: 800;
            text-align: left;
            text-transform: uppercase;
        }

        .cw-table td {
            padding: 11px 9px;
            border-top: 1px solid #edf0f4;
            color: #445064;
            font-size: 9px;
        }

        .cw-table strong {
            color: #172033;
        }

        .cw-status {
            display: inline-flex;
            align-items: center;
            padding: 4px 7px;
            border-radius: 20px;
            background: #edf7f0;
            color: #18794e;
            font-size: 8px;
            font-weight: 800;
        }

        .cw-empty {
            padding: 35px 20px;
            border: 1px dashed #dfe4ec;
            border-radius: 8px;
            color: #8993a2;
            text-align: center;
            font-size: 10px;
        }

        /* =========================================================
           ATTENTION
           ========================================================= */

        .cw-attention-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 11px 0;
            border-bottom: 1px solid #edf0f4;
        }

        .cw-attention-item:first-child {
            padding-top: 0;
        }

        .cw-attention-item:last-child {
            padding-bottom: 0;
            border-bottom: 0;
        }

        .cw-attention-icon {
            width: 29px;
            height: 29px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 29px;
            border-radius: 7px;
            background: #fff4e5;
            color: #b76e00;
            font-size: 11px;
        }

        .cw-attention-content strong {
            display: block;
            font-size: 10px;
        }

        .cw-attention-content span {
            display: block;
            margin-top: 3px;
            color: #8993a2;
            font-size: 8px;
            line-height: 1.4;
        }

        /* =========================================================
           QUICK ACTIONS
           ========================================================= */

        .cw-action-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .cw-action {
            min-height: 76px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 11px;
            border: 1px solid #dfe4ec;
            border-radius: 8px;
            background: #fff;
            color: #172033;
            text-decoration: none;
        }

        .cw-action:hover {
            border-color: #0b5cff;
            background: #f8faff;
        }

        .cw-action-icon {
            color: #0b5cff;
            font-size: 14px;
        }

        .cw-action strong {
            font-size: 9px;
        }

        /* =========================================================
           DOMAIN MATRIX
           ========================================================= */

        .cw-domain-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
        }

        .cw-domain {
            min-height: 86px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 11px;
            border: 1px solid #dfe4ec;
            border-radius: 8px;
            background: #fff;
            text-decoration: none;
        }

        .cw-domain:hover {
            border-color: #0b5cff;
            background: #f8faff;
        }

        .cw-domain-code {
            color: #8993a2;
            font-size: 7px;
            font-weight: 850;
            letter-spacing: .08em;
        }

        .cw-domain strong {
            font-size: 9px;
        }

        .cw-domain span:last-child {
            color: #8993a2;
            font-size: 7px;
            line-height: 1.3;
        }

        /* =========================================================
           FOOTER
           ========================================================= */

        .cw-footer {
            margin-top: 28px;
            padding: 24px 0 10px;
            border-top: 1px solid #dfe4ec;
        }

        .cw-footer-top {
            display: grid;
            grid-template-columns: 1.6fr repeat(4, 1fr);
