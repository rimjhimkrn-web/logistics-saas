<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b5cff">

<title>Customer Command Centre | KRIM Logistics</title>

<style>
*{box-sizing:border-box}

html{
    margin:0;
    padding:0;
    scroll-behavior:smooth;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:#f5f7fa;
    color:#172033;
    font-size:14px;
}

a{
    color:inherit;
    text-decoration:none;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

:root{
    --blue:#0b5cff;
    --blue-dark:#0847c7;
    --blue-soft:#eaf1ff;
    --green:#16834b;
    --green-soft:#e9f8f0;
    --orange:#b86b00;
    --orange-soft:#fff4e5;
    --red:#c9363e;
    --red-soft:#ffedef;
    --purple:#7047d7;
    --purple-soft:#f1edff;

    --text:#172033;
    --muted:#697586;
    --light:#8993a2;
    --border:#dfe5ed;
    --border-soft:#edf0f4;
    --surface:#ffffff;
    --background:#f5f7fa;

    --header-height:68px;
    --sidebar-width:244px;
    --radius:10px;
}

/* =========================================================
   HEADER
========================================================= */

.krim-header{
    position:fixed;
    z-index:1000;
    top:0;
    left:0;
    right:0;
    height:var(--header-height);
    display:flex;
    align-items:center;
    gap:14px;
    padding:0 20px;
    background:#fff;
    border-bottom:1px solid var(--border);
}

.mobile-menu{
    display:none;
    width:38px;
    height:38px;
    flex:0 0 38px;
    border:1px solid var(--border);
    border-radius:8px;
    background:#fff;
    color:var(--text);
    font-size:18px;
}

.krim-brand{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:220px;
}

.krim-logo{
    width:36px;
    height:36px;
    display:grid;
    place-items:center;
    flex:0 0 36px;
    border-radius:9px;
    background:var(--blue);
    color:#fff;
    font-size:17px;
    font-weight:900;
}

.brand-title{
    font-size:17px;
    line-height:1;
    font-weight:850;
    letter-spacing:-.02em;
}

.brand-subtitle{
    display:block;
    margin-top:4px;
    color:var(--light);
    font-size:7px;
    font-weight:750;
    letter-spacing:.08em;
    white-space:nowrap;
}

.global-search{
    width:min(430px,34vw);
}

.global-search input{
    width:100%;
    height:38px;
    padding:0 13px;
    border:1px solid var(--border);
    border-radius:8px;
    outline:none;
    background:#f8fafc;
    color:var(--text);
    font-size:12px;
}

.global-search input:focus{
    border-color:var(--blue);
    background:#fff;
}

.header-spacer{
    flex:1;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:7px;
}

.header-icon{
    width:38px;
    height:38px;
    border:1px solid var(--border);
    border-radius:8px;
    background:#fff;
    color:#526074;
    font-size:15px;
}

.header-icon:hover{
    border-color:var(--blue);
    color:var(--blue);
}

.account-button{
    height:38px;
    display:flex;
    align-items:center;
    gap:8px;
    padding:3px 9px 3px 4px;
    border:1px solid var(--border);
    border-radius:8px;
    background:#fff;
    color:var(--text);
}

.account-avatar{
    width:30px;
    height:30px;
    display:grid;
    place-items:center;
    border-radius:50%;
    background:var(--blue-soft);
    color:var(--blue);
    font-size:11px;
    font-weight:850;
}

.account-label{
    max-width:125px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:11px;
    font-weight:700;
}

/* =========================================================
   DROPDOWN MENUS
========================================================= */

.dropdown{
    position:relative;
}

.dropdown-panel{
    position:absolute;
    z-index:1200;
    top:calc(100% + 8px);
    right:0;
    width:230px;
    display:none;
    padding:7px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:10px;
    box-shadow:0 15px 35px rgba(23,32,51,.14);
}

.dropdown-panel.open{
    display:block;
}

.dropdown-title{
    padding:9px 10px;
    border-bottom:1px solid var(--border-soft);
    margin-bottom:5px;
}

.dropdown-title strong{
    display:block;
    font-size:11px;
}

.dropdown-title span{
    display:block;
    margin-top:3px;
    color:var(--light);
    font-size:9px;
}

.dropdown-item{
    width:100%;
    min-height:36px;
    display:flex;
    align-items:center;
    gap:9px;
    padding:0 10px;
    border:0;
    border-radius:7px;
    background:transparent;
    color:#536074;
    text-align:left;
    font-size:10px;
    font-weight:650;
}

.dropdown-item:hover{
    background:var(--blue-soft);
    color:var(--blue);
}

.dropdown-item.danger:hover{
    background:var(--red-soft);
    color:var(--red);
}

.language-option{
    justify-content:space-between;
}

.language-left{
    display:flex;
    align-items:center;
    gap:9px;
}

/* =========================================================
   SIDEBAR
========================================================= */

.krim-sidebar{
    position:fixed;
    z-index:900;
    top:var(--header-height);
    left:0;
    bottom:0;
    width:var(--sidebar-width);
    padding:17px 11px;
    overflow-y:auto;
    background:#fff;
    border-right:1px solid var(--border);
}

.nav-section{
    margin-bottom:19px;
}

.nav-heading{
    padding:0 10px 7px;
    color:#8b95a5;
    font-size:9px;
    font-weight:850;
    letter-spacing:.08em;
    text-transform:uppercase;
}

.krim-nav{
    display:flex;
    align-items:center;
    gap:9px;
    min-height:37px;
    padding:0 10px;
    border-radius:7px;
    color:#526074;
    font-size:11px;
    font-weight:650;
}

.krim-nav:hover,
.krim-nav.active{
    background:var(--blue-soft);
    color:var(--blue);
}

.nav-icon{
    width:17px;
    text-align:center;
    font-size:12px;
}

.nav-arrow{
    margin-left:auto;
    color:#a0a8b5;
    font-size:10px;
}

/* =========================================================
   MOBILE DRAWER
========================================================= */

.drawer-overlay{
    display:none;
    position:fixed;
    z-index:850;
    inset:0;
    background:rgba(8,15,30,.38);
}

.drawer-overlay.open{
    display:block;
}

/* =========================================================
   MAIN
========================================================= */

.krim-main{
    min-height:100vh;
    margin-left:var(--sidebar-width);
    padding-top:var(--header-height);
}

.krim-content{
    width:100%;
    max-width:1580px;
    margin:0 auto;
    padding:26px;
}

.breadcrumb{
    margin-bottom:10px;
    color:#8b95a5;
    font-size:10px;
}

.hero{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:24px;
    margin-bottom:20px;
}

.hero-label{
    margin-bottom:7px;
    color:var(--blue);
    font-size:9px;
    font-weight:850;
    letter-spacing:.1em;
}

.hero h1{
    margin:0;
    color:var(--text);
    font-size:clamp(27px,3vw,38px);
    line-height:1.05;
    letter-spacing:-.04em;
}

.hero p{
    max-width:720px;
    margin:9px 0 0;
    color:var(--muted);
    font-size:12px;
    line-height:1.55;
}

.hero-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.krim-btn{
    min-height:38px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:0 14px;
    border:1px solid var(--border);
    border-radius:8px;
    background:#fff;
    color:#526074;
    font-size:10px;
    font-weight:800;
}

.krim-btn:hover{
    border-color:var(--blue);
    color:var(--blue);
}

.krim-btn-primary{
    border-color:var(--blue);
    background:var(--blue);
    color:#fff;
}

.krim-btn-primary:hover{
    border-color:var(--blue-dark);
    background:var(--blue-dark);
    color:#fff;
}

/* =========================================================
   GLOBAL CONTEXT
========================================================= */

.context-bar{
    display:grid;
    grid-template-columns:2fr repeat(4,1fr);
    gap:1px;
    margin-bottom:15px;
    overflow:hidden;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--border);
}

.context-item{
    min-height:64px;
    padding:11px 14px;
    background:#fff;
}

.context-item small{
    display:block;
    color:#8b95a5;
    font-size:8px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.05em;
}

.context-item strong{
    display:block;
    margin-top:6px;
    color:var(--text);
    font-size:11px;
}

/* =========================================================
   KPI
========================================================= */

.kpi-grid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:9px;
    margin-bottom:15px;
}

.kpi{
    min-height:105px;
    padding:14px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:10px;
}

.kpi-label{
    color:#8b95a5;
    font-size:8px;
    font-weight:800;
    text-transform:uppercase;
}

.kpi-value{
    margin-top:9px;
    color:var(--text);
    font-size:24px;
    font-weight:800;
}

.kpi-note{
    margin-top:5px;
    color:#8b95a5;
    font-size:8px;
}

/* =========================================================
   PANELS
========================================================= */

.dashboard-grid{
    display:grid;
    grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);
    gap:14px;
    margin-bottom:14px;
}

.panel{
    overflow:hidden;
    background:#fff;
    border:1px solid var(--border);
    border-radius:10px;
}

.panel-header{
    min-height:60px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:0 15px;
    border-bottom:1px solid var(--border-soft);
}

.panel-title{
    color:var(--text);
    font-size:12px;
    font-weight:800;
}

.panel-subtitle{
    display:block;
    margin-top:3px;
    color:#8b95a5;
    font-size:8px;
    font-weight:500;
}

.panel-link{
    color:var(--blue);
    font-size:9px;
    font-weight:800;
}

.panel-body{
    padding:15px;
}

/* =========================================================
   SHIPMENT SEARCH
========================================================= */

.shipment-toolbar{
    display:flex;
    gap:7px;
    margin-bottom:11px;
}

.shipment-toolbar input{
    flex:1;
    min-width:0;
    height:36px;
    padding:0 10px;
    border:1px solid var(--border);
    border-radius:7px;
    outline:none;
    font-size:10px;
}

.shipment-toolbar input:focus{
    border-color:var(--blue);
}

.shipment-toolbar select{
    height:36px;
    padding:0 9px;
    border:1px solid var(--border);
    border-radius:7px;
    background:#fff;
    color:#536074;
    font-size:9px;
}

.table-scroll{
    overflow-x:auto;
}

.shipment-table{
    width:100%;
    min-width:620px;
    border-collapse:collapse;
}

.shipment-table th{
    padding:9px 8px;
    background:#f8fafc;
    color:#8b95a5;
    font-size:8px;
    font-weight:800;
    text-align:left;
    text-transform:uppercase;
}

.shipment-table td{
    padding:11px 8px;
    border-top:1px solid var(--border-soft);
    color:#536074;
    font-size:9px;
}

.shipment-table td strong{
    color:var(--text);
}

.status{
    display:inline-flex;
    padding:5px 8px;
    border-radius:20px;
    background:var(--green-soft);
    color:var(--green);
    font-size:8px;
    font-weight:800;
}

.empty-state{
    padding:25px 12px;
    border:1px dashed var(--border);
    border-radius:8px;
    color:#8b95a5;
    text-align:center;
    font-size:10px;
    line-height:1.5;
}

/* =========================================================
   ATTENTION
========================================================= */

.attention-item{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:12px 0;
    border-bottom:1px solid var(--border-soft);
}

.attention-item:last-child{
    border-bottom:0;
}

.attention-icon{
    width:32px;
    height:32px;
    flex:0 0 32px;
    display:grid;
    place-items:center;
    border-radius:8px;
    background:var(--orange-soft);
    color:var(--orange);
    font-size:12px;
    font-weight:800;
}

.attention-title{
    color:var(--text);
    font-size:10px;
    font-weight:800;
}

.attention-text{
    margin-top:4px;
    color:#8b95a5;
    font-size:9px;
    line-height:1.45;
}

/* =========================================================
   QUICK ACTIONS
========================================================= */

.quick-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.quick-action{
    min-height:80px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:11px;
    border:1px solid var(--border);
    border-radius:8px;
}

.quick-action:hover{
    border-color:var(--blue);
    background:#f8faff;
}

.quick-icon{
    color:var(--blue);
    font-size:16px;
}

.quick-title{
    color:var(--text);
    font-size:9px;
    font-weight:800;
}

.quick-note{
    color:#8b95a5;
    font-size:8px;
}

/* =========================================================
   DOMAINS
========================================================= */

.domain-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:8px;
}

.domain{
    min-height:82px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:10px;
    border:1px solid var(--border);
    border-radius:8px;
}

.domain:hover{
    border-color:var(--blue);
    background:#f8faff;
}

.domain-code{
    color:var(--blue);
    font-size:8px;
    font-weight:850;
}

.domain-name{
    color:var(--text);
    font-size:10px;
    font-weight:800;
}

.domain-description{
    color:#8b95a5;
    font-size:8px;
}

/* =========================================================
   FOOTER
========================================================= */

.krim-footer{
    margin-top:26px;
    padding:26px 0 10px;
    border-top:1px solid var(--border);
}

.footer-grid{
    display:grid;
    grid-template-columns:2fr repeat(4,1fr);
    gap:25px;
}

.footer-brand{
    color:var(--text);
    font-size:12px;
    font-weight:850;
}

.footer-description{
    max-width:330px;
    margin:8px 0 0;
    color:#8b95a5;
    font-size:9px;
    line-height:1.55;
}

.footer-column h4{
    margin:0 0 10px;
    color:var(--text);
    font-size:9px;
    font-weight:850;
}

.footer-column a{
    display:block;
    margin-bottom:7px;
    color:#737f91;
    font-size:8px;
}

.footer-column a:hover{
    color:var(--blue);
}

.footer-bottom{
    display:flex;
    justify-content:space-between;
    gap:15px;
    margin-top:22px;
    padding-top:12px;
    border-top:1px solid var(--border-soft);
    color:#8b95a5;
    font-size:8px;
}

/* =========================================================
   MOBILE BOTTOM NAV
========================================================= */

.mobile-bottom-nav{
    display:none;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1250px){

    .kpi-grid{
        grid-template-columns:repeat(3,1fr);
    }

    .domain-grid{
        grid-template-columns:repeat(4,1fr);
    }

    .footer-grid{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:950px){

    :root{
        --sidebar-width:220px;
    }

    .context-bar{
        grid-template-columns:repeat(2,1fr);
    }

    .context-item:first-child{
        grid-column:1/-1;
    }

    .dashboard-grid{
        grid-template-columns:1fr;
    }

    .domain-grid{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:720px){

    :root{
        --header-height:62px;
    }

    .krim-header{
        padding:0 10px;
        gap:8px;
    }

    .mobile-menu{
        display:block;
    }

    .krim-brand{
        min-width:auto;
    }

    .brand-subtitle{
        display:none;
    }

    .brand-title{
        font-size:15px;
    }

    .global-search{
        flex:1;
        width:auto;
    }

    .global-search input{
        height:36px;
        font-size:10px;
    }

    .header-icon{
        display:none;
    }

    .account-label{
        display:none;
    }

    .account-button{
        padding-right:4px;
    }

    .krim-sidebar{
        width:270px;
        transform:translateX(-105%);
        transition:transform .2s ease;
        box-shadow:12px 0 30px rgba(0,0,0,.15);
    }

    .krim-sidebar.open{
        transform:translateX(0);
    }

    .krim-main{
        margin-left:0;
    }

    .krim-content{
        padding:19px 13px 85px;
    }

    .hero{
        flex-direction:column;
        align-items:flex-start;
        gap:15px;
    }

    .hero h1{
        font-size:29px;
    }

    .hero p{
        font-size:11px;
    }

    .hero-actions{
        width:100%;
    }

    .hero-actions .krim-btn{
        flex:1;
    }

    .context-bar{
        grid-template-columns:1fr 1fr;
    }

    .context-item:first-child{
        grid-column:1/-1;
    }

    .kpi-grid{
        grid-template-columns:1fr 1fr;
    }

    .kpi{
        min-height:95px;
    }

    .kpi-value{
        font-size:21px;
    }

    .quick-grid{
        grid-template-columns:1fr 1fr;
    }

    .domain-grid{
        grid-template-columns:1fr 1fr;
    }

    .footer-grid{
        grid-template-columns:1fr 1fr;
    }

    .footer-bottom{
        flex-direction:column;
    }

    .mobile-bottom-nav{
        position:fixed;
        z-index:800;
        left:0;
        right:0;
        bottom:0;
        height:62px;
        display:grid;
        grid-template-columns:repeat(4,1fr);
        background:#fff;
        border-top:1px solid var(--border);
        box-shadow:0 -5px 20px rgba(23,32,51,.08);
    }

    .mobile-bottom-nav a{
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        gap:4px;
        color:#7d8796;
        font-size:8px;
        font-weight:750;
    }

    .mobile-bottom-nav a.active{
        color:var(--blue);
    }

    .mobile-bottom-nav span{
        font-size:15px;
    }

    .drawer-overlay{
        top:var(--header-height);
    }
}

@media(max-width:470px){

    body{
        font-size:14px;
    }

    .global-search{
        display:none;
    }

    .hero-actions{
        display:grid;
        grid-template-columns:1fr 1fr;
    }

    .hero-actions .krim-btn:first-child{
        grid-column:1/-1;
    }

    .context-bar{
        grid-template-columns:1fr 1fr;
    }

    .context-item{
        min-height:60px;
    }

    .kpi-grid{
        grid-template-columns:1fr 1fr;
        gap:7px;
    }

    .kpi{
        padding:11px;
    }

    .kpi-label{
        font-size:7px;
    }

    .kpi-value{
        font-size:20px;
    }

    .dashboard-grid{
        gap:10px;
    }

    .shipment-toolbar{
        flex-direction:column;
    }

    .shipment-toolbar select{
        width:100%;
    }

    .quick-grid{
        grid-template-columns:1fr 1fr;
    }

    .domain-grid{
        grid-template-columns:1fr 1fr;
    }

    .footer-grid{
        grid-template-columns:1fr 1fr;
        gap:18px;
    }

    .footer-brand{
        grid-column:1/-1;
    }
}

@media(max-width:340px){

    .krim-content{
        padding-left:10px;
        padding-right:10px;
    }

    .kpi-grid{
        grid-template-columns:1fr;
    }

    .context-bar{
        grid-template-columns:1fr;
    }

    .context-item:first-child{
        grid-column:auto;
    }

    .domain-grid{
        grid-template-columns:1fr;
    }

    .footer-grid{
        grid-template-columns:1fr;
    }

    .footer-brand{
        grid-column:auto;
    }
}

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        scroll-behavior:auto!important;
        transition:none!important;
    }
}
