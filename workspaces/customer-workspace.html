<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Customer Command Centre | KRIM Logistics">

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
font-family:Arial,Helvetica,sans-serif;
background:#f5f7fb;
color:#172033;
font-size:14px;
line-height:1.45
}
a{text-decoration:none;color:inherit}
button,input,select{font:inherit}

:root{
--blue:#0b5cff;
--blue-soft:#eaf1ff;
--dark:#172033;
--muted:#687588;
--line:#dfe5ed;
--white:#fff;
--green:#16834b;
--red:#c9363e;
--orange:#b86b00;
--header:64px;
--sidebar:240px
}

/* HEADER */
.krim-header{
position:fixed;
top:0;
left:0;
right:0;
height:var(--header);
z-index:1000;
display:flex;
align-items:center;
gap:14px;
padding:0 18px;
background:#fff;
border-bottom:1px solid var(--line)
}

.krim-menu{
display:none;
width:40px;
height:40px;
border:1px solid var(--line);
border-radius:8px;
background:#fff;
cursor:pointer
}

.krim-brand{
display:flex;
align-items:center;
gap:9px;
min-width:220px
}

.krim-logo{
width:36px;
height:36px;
border-radius:8px;
display:grid;
place-items:center;
background:var(--blue);
color:#fff;
font-weight:900;
font-size:18px
}

.krim-brand strong{font-size:17px}
.krim-brand small{
display:block;
font-size:8px;
letter-spacing:.08em;
color:#7c8797
}

.krim-search{
width:360px
}

.krim-search input{
width:100%;
height:38px;
border:1px solid var(--line);
border-radius:8px;
padding:0 12px;
outline:none;
background:#f8fafc;
font-size:12px
}

.krim-search input:focus{
border-color:var(--blue);
background:#fff
}

.krim-grow{flex:1}

.krim-header-actions{
display:flex;
align-items:center;
gap:7px
}

.krim-icon{
width:38px;
height:38px;
border:1px solid var(--line);
border-radius:8px;
background:#fff;
cursor:pointer
}

.krim-account{
height:40px;
display:flex;
align-items:center;
gap:8px;
padding:3px 10px 3px 4px;
border:1px solid var(--line);
border-radius:8px;
background:#fff;
cursor:pointer
}

.krim-avatar{
width:30px;
height:30px;
border-radius:50%;
display:grid;
place-items:center;
background:var(--blue-soft);
color:var(--blue);
font-size:11px;
font-weight:800
}

#accountEmail{
max-width:130px;
overflow:hidden;
white-space:nowrap;
text-overflow:ellipsis;
font-size:11px;
font-weight:700
}

/* SIDEBAR */
.krim-sidebar{
position:fixed;
left:0;
top:var(--header);
bottom:0;
width:var(--sidebar);
z-index:900;
overflow:auto;
padding:16px 11px;
background:#fff;
border-right:1px solid var(--line)
}

.krim-section{
margin-bottom:18px
}

.krim-section-title{
padding:0 10px 7px;
font-size:9px;
font-weight:800;
color:#8993a2;
letter-spacing:.08em;
text-transform:uppercase
}

.krim-nav{
height:38px;
display:flex;
align-items:center;
gap:10px;
padding:0 10px;
margin-bottom:2px;
border-radius:7px;
font-size:11px;
font-weight:600;
color:#536074
}

.krim-nav:hover,
.krim-nav.active{
background:var(--blue-soft);
color:var(--blue)
}

/* MOBILE OVERLAY */
.krim-overlay{
display:none
}

/* MAIN */
.krim-main{
margin-left:var(--sidebar);
padding-top:var(--header);
min-height:100vh
}

.krim-content{
max-width:1550px;
margin:auto;
padding:25px
}

.krim-breadcrumb{
font-size:10px;
color:#8993a2;
margin-bottom:9px
}

.krim-hero{
display:flex;
justify-content:space-between;
align-items:flex-end;
gap:20px;
margin-bottom:18px
}

.krim-hero h1{
margin:0;
font-size:32px;
line-height:1.15;
letter-spacing:-.04em
}

.krim-hero p{
margin:8px 0 0;
max-width:720px;
font-size:12px;
color:var(--muted)
}

.krim-actions{
display:flex;
gap:8px;
flex-wrap:wrap
}

.krim-btn{
height:38px;
padding:0 14px;
border-radius:7px;
border:1px solid var(--line);
background:#fff;
font-size:10px;
font-weight:800;
cursor:pointer;
display:inline-flex;
align-items:center;
justify-content:center
}

.krim-btn-primary{
background:var(--blue);
border-color:var(--blue);
color:#fff
}

/* CONTEXT */
.krim-context{
display:grid;
grid-template-columns:2fr repeat(4,1fr);
gap:1px;
background:var(--line);
border:1px solid var(--line);
border-radius:9px;
overflow:hidden;
margin-bottom:15px
}

.krim-context-item{
background:#fff;
padding:12px 14px
}

.krim-context-item small{
display:block;
font-size:8px;
color:#8993a2;
font-weight:800;
text-transform:uppercase
}

.krim-context-item strong{
display:block;
margin-top:4px;
font-size:11px
}

/* KPI */
.krim-kpis{
display:grid;
grid-template-columns:repeat(6,1fr);
gap:9px;
margin-bottom:15px
}

.krim-kpi{
background:#fff;
border:1px solid var(--line);
border-radius:9px;
padding:14px
}

.krim-kpi small{
font-size:8px;
font-weight:800;
color:#8993a2;
text-transform:uppercase
}

.krim-kpi strong{
display:block;
margin-top:7px;
font-size:23px
}

.krim-kpi span{
display:block;
margin-top:3px;
font-size:9px;
color:#8993a2
}

/* PANELS */
.krim-grid{
display:grid;
grid-template-columns:1.7fr 1fr;
gap:14px;
margin-bottom:14px
}

.krim-panel{
background:#fff;
border:1px solid var(--line);
border-radius:9px;
overflow:hidden
}

.krim-panel-head{
min-height:57px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
border-bottom:1px solid #edf0f4
}

.krim-panel-head strong{
font-size:12px
}

.krim-panel-head small{
display:block;
margin-top:2px;
font-size:9px;
color:#8993a2
}

.krim-panel-head a{
font-size:9px;
font-weight:800;
color:var(--blue)
}

.krim-panel-body{
padding:15px
}

/* SEARCH */
.krim-filter{
display:flex;
gap:7px;
margin-bottom:11px
}

.krim-filter input,
.krim-filter select{
height:34px;
border:1px solid var(--line);
border-radius:6px;
padding:0 9px;
background:#fff;
font-size:10px
}

.krim-filter input{flex:1}

/* TABLE */
.krim-table-wrap{
overflow:auto
}

.krim-table{
width:100%;
min-width:580px;
border-collapse:collapse
}

.krim-table th{
padding:9px;
background:#f8fafc;
font-size:8px;
color:#8993a2;
text-align:left;
text-transform:uppercase
}

.krim-table td{
padding:11px 9px;
border-top:1px solid #edf0f4;
font-size:9px;
color:#536074
}

.krim-empty{
padding:27px 12px;
text-align:center;
border:1px dashed var(--line);
border-radius:7px;
color:#8993a2;
font-size:10px
}

/* ATTENTION */
.krim-attention{
display:flex;
gap:10px;
padding:11px 0;
border-bottom:1px solid #edf0f4
}

.krim-attention:last-child{
border-bottom:0
}

.krim-attention-icon{
width:30px;
height:30px;
flex:0 0 30px;
display:grid;
place-items:center;
border-radius:7px;
background:#fff4e5;
color:var(--orange);
font-weight:800
}

.krim-attention strong{
font-size:10px
}

.krim-attention span{
display:block;
margin-top:3px;
font-size:9px;
color:#8993a2
}

/* QUICK ACTIONS */
.krim-actions-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px
}

.krim-action{
min-height:70px;
padding:11px;
border:1px solid var(--line);
border-radius:7px
}

.krim-action:hover{
border-color:var(--blue);
background:#f8faff
}

.krim-action b{
display:block;
margin-top:10px;
font-size:9px
}

.krim-action span{
font-size:9px;
color:var(--blue)
}

/* DOMAINS */
.krim-domains{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:8px
}

.krim-domain{
min-height:78px;
padding:10px;
border:1px solid var(--line);
border-radius:7px
}

.krim-domain:hover{
border-color:var(--blue);
background:#f8faff
}

.krim-domain small{
font-size:7px;
color:#8993a2;
font-weight:800
}

.krim-domain strong{
display:block;
margin-top:7px;
font-size:9px
}

.krim-domain span{
display:block;
margin-top:3px;
font-size:8px;
color:#8993a2
}

/* FOOTER */
.krim-footer{
margin-top:25px;
background:#142238;
color:#fff;
padding:28px 25px 16px
}

.krim-footer-grid{
max-width:1550px;
margin:auto;
display:grid;
grid-template-columns:2fr repeat(4,1fr);
gap:25px
}

.krim-footer h3{
margin:0 0 8px;
font-size:13px
}

.krim-footer h4{
margin:0 0 9px;
font-size:10px
}

.krim-footer p,
.krim-footer a{
font-size:9px;
line-height:1.6;
color:#b9c3d2
}

.krim-footer a{
display:block;
margin-bottom:4px
}

.krim-footer a:hover{
color:#fff
}

.krim-footer-bottom{
max-width:1550px;
margin:22px auto 0;
padding-top:13px;
border-top:1px solid #304057;
display:flex;
justify-content:space-between;
gap:10px;
font-size:8px;
color:#9eabbc
}

/* MENU PANELS */
.krim-popover{
display:none;
position:fixed;
z-index:1200;
right:15px;
top:58px;
width:280px;
background:#fff;
border:1px solid var(--line);
border-radius:10px;
box-shadow:0 12px 35px rgba(20,35,56,.18);
padding:12px
}

.krim-popover.open{
display:block
}

.krim-popover h3{
margin:3px 5px 10px;
font-size:12px
}

.krim-popover a,
.krim-language{
display:flex;
align-items:center;
gap:9px;
min-height:38px;
padding:0 9px;
border-radius:7px;
font-size:10px;
cursor:pointer
}

.krim-popover a:hover,
.krim-language:hover{
background:var(--blue-soft);
color:var(--blue)
}

.krim-language.active{
color:var(--blue);
font-weight:800
}

/* RESPONSIVE */
@media(max-width:1200px){
.krim-kpis{grid-template-columns:repeat(3,1fr)}
.krim-domains{grid-template-columns:repeat(4,1fr)}
.krim-footer-grid{grid-template-columns:repeat(3,1fr)}
}

@media(max-width:900px){
.krim-context{grid-template-columns:repeat(2,1fr)}
.krim-context-item:first-child{grid-column:1/-1}
.krim-grid{grid-template-columns:1fr}
.krim-domains{grid-template-columns:repeat(3,1fr)}
}

@media(max-width:700px){

.krim-header{
padding:0 10px;
gap:7px
}

.krim-menu{
display:block
}

.krim-brand{
min-width:auto
}

.krim-brand small{
display:none
}

.krim-search{
flex:1;
width:auto
}

.krim-search input{
font-size:10px
}

.krim-header-actions .krim-icon{
display:none
}

.krim-account{
padding-right:6px
}

#accountEmail{
display:none
}

.krim-sidebar{
transform:translateX(-105%);
transition:transform .2s ease;
box-shadow:8px 0 25px rgba(0,0,0,.14)
}

.krim-sidebar.open{
transform:translateX(0)
}

.krim-overlay.open{
display:block;
position:fixed;
inset:0;
z-index:850;
background:rgba(0,0,0,.35)
}

.krim-main{
margin-left:0
}

.krim-content{
padding:18px 12px
}

.krim-hero{
display:block
}

.krim-hero h1{
font-size:27px
}

.krim-hero p{
font-size:11px
}

.krim-actions{
margin-top:13px
}

.krim-actions .krim-btn{
flex:1
}

.krim-context{
grid-template-columns:1fr 1fr
}

.krim-kpis{
grid-template-columns:repeat(2,1fr)
}

.krim-domains{
grid-template-columns:repeat(2,1fr)
}

.krim-footer{
padding:25px 14px 15px
}

.krim-footer-grid{
grid-template-columns:1fr 1fr;
gap:22px 15px
}

.krim-footer-bottom{
flex-direction:column;
align-items:flex-start
}
}

@media(max-width:430px){

.krim-brand strong{
font-size:14px
}

.krim-search{
display:none
}

.krim-hero h1{
font-size:25px
}

.krim-kpis{
grid-template-columns:1fr 1fr
}

.krim-actions-grid{
grid-template-columns:1fr 1fr
}

.krim-domains{
grid-template-columns:1fr 1fr
}

.krim-footer-grid{
grid-template-columns:1fr
}
}
</style>
</head>
