<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b5cff">

<title>KRIM Customer Control Centre</title>

<!-- KRIM global design system -->
<link rel="stylesheet" href="../core/krim-core.css">
<link rel="stylesheet" href="../core/krim-components.css">
<link rel="stylesheet" href="../core/krim-responsive.css">

<style>
/* =========================================================
   KRIM CUSTOMER CONTROL CENTRE
   Permanent customer workspace shell
   ========================================================= */

:root{
    --krim-blue:#0b5cff;
    --krim-dark:#172033;
    --krim-muted:#697586;
    --krim-line:#e1e6ee;
    --krim-soft:#f7f9fc;
    --krim-white:#ffffff;
    --krim-green:#16834b;
    --krim-orange:#b86b00;
    --krim-red:#c9363e;
    --header-height:64px;
    --sidebar-width:238px;
}

*{
    box-sizing:border-box;
}

html{
    min-height:100%;
    background:#f5f7fa;
}

body{
    margin:0;
    min-height:100vh;
    background:#f5f7fa;
    color:var(--krim-dark);
    font-family:Inter,Arial,Helvetica,sans-serif;
}

/* ---------------------------------------------------------
   APPLICATION STATES
   --------------------------------------------------------- */

.krim-loading{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:#f5f7fa;
}

.krim-loading-card{
    width:min(420px,100%);
    padding:30px;
    text-align:center;
    background:#fff;
    border:1px solid var(--krim-line);
    border-radius:14px;
    box-shadow:0 12px 40px rgba(20,30,50,.07);
}

.krim-loading-mark{
    width:48px;
    height:48px;
    margin:0 auto 16px;
    border-radius:11px;
    display:grid;
    place-items:center;
    background:var(--krim-blue);
    color:#fff;
    font-weight:900;
    font-size:20px;
}

.krim-loading-card h1{
    margin:0;
    font-size:18px;
}

.krim-loading-card p{
    margin:8px 0 0;
    color:var(--krim-muted);
    font-size:12px;
    line-height:1.55;
}

.krim-spinner{
    width:24px;
    height:24px;
    margin:18px auto 0;
    border:3px solid #dce6ff;
    border-top-color:var(--krim-blue);
    border-radius:50%;
    animation:krimSpin .8s linear infinite;
}

@keyframes krimSpin{
    to{transform:rotate(360deg)}
}

.krim-error{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:#f5f7fa;
}

.krim-error-card{
    width:min(470px,100%);
    padding:32px;
    text-align:center;
    background:#fff;
    border:1px solid var(--krim-line);
    border-radius:14px;
    box-shadow:0 12px 40px rgba(20,30,50,.08);
}

.krim-error-icon{
    width:50px;
    height:50px;
    margin:0 auto 14px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:#fff1f2;
    color:var(--krim-red);
    font-size:22px;
    font-weight:900;
}

.krim-error-card h1{
    margin:0;
    font-size:20px;
}

.krim-error-card p{
    margin:10px 0 0;
    color:var(--krim-muted);
    font-size:12px;
    line-height:1.6;
}

.krim-error-actions{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-top:20px;
    flex-wrap:wrap;
}

.krim-error-actions a,
.krim-error-actions button{
    min-height:38px;
    padding:0 15px;
    border-radius:8px;
    border:1px solid var(--krim-line);
    background:#fff;
    color:var(--krim-dark);
    font-size:11px;
    font-weight:800;
    cursor:pointer;
    text-decoration:none;
}

.krim-error-actions .primary{
    background:var(--krim-blue);
    border-color:var(--krim-blue);
    color:#fff;
}

/* ---------------------------------------------------------
   HEADER
   --------------------------------------------------------- */

.krim-header{
    position:fixed;
    z-index:1000;
    top:0;
    left:0;
    right:0;
    height:var(--header-height);

    display:flex;
    align-items:center;
    gap:12px;

    padding:0 18px;

    background:#fff;
    border-bottom:1px solid var(--krim-line);
}

.krim-menu{
    display:none;
    width:36px;
    height:36px;
    border:1px solid var(--krim-line);
    border-radius:8px;
    background:#fff;
    cursor:pointer;
    font-size:17px;
}

.krim-brand{
    display:flex;
    align-items:center;
    gap:9px;
    min-width:210px;
    text-decoration:none;
    color:inherit;
}

.krim-logo{
    width:34px;
    height:34px;
    border-radius:8px;
    display:grid;
    place-items:center;
    background:var(--krim-blue);
    color:#fff;
    font-size:17px;
    font-weight:900;
}

.krim-brand-text strong{
    display:block;
    font-size:17px;
    line-height:1;
}

.krim-brand-text small{
    display:block;
    margin-top:4px;
    color:#8993a2;
    font-size:7px;
    font-weight:700;
    letter-spacing:.08em;
}

.krim-search{
    width:min(390px,35vw);
}

.krim-search input{
    width:100%;
    height:36px;
    padding:0 12px;
    border:1px solid var(--krim-line);
    border-radius:8px;
    outline:none;
    background:#f8fafc;
    color:var(--krim-dark);
    font-size:11px;
}

.krim-search input:focus{
    border-color:var(--krim-blue);
    background:#fff;
}

.krim-header-space{
    flex:1;
}

.krim-header-actions{
    display:flex;
    align-items:center;
    gap:7px;
}

.krim-icon-button{
    width:36px;
    height:36px;
    border:1px solid var(--krim-line);
    border-radius:8px;
    background:#fff;
    color:#536074;
    cursor:pointer;
}

.krim-user-button{
    height:36px;
    display:flex;
    align-items:center;
    gap:8px;
    padding:3px 9px 3px 4px;
    border:1px solid var(--krim-line);
    border-radius:8px;
    background:#fff;
    cursor:pointer;
}

.krim-avatar{
    width:28px;
    height:28px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:#eaf1ff;
    color:var(--krim-blue);
    font-size:10px;
    font-weight:900;
}

.krim-user-email{
    max-width:135px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    color:var(--krim-dark);
    font-size:9px;
    font-weight:700;
}

/* ---------------------------------------------------------
   SIDEBAR
   --------------------------------------------------------- */

.krim-sidebar{
    position:fixed;
    z-index:900;
    top:var(--header-height);
    bottom:0;
    left:0;
    width:var(--sidebar-width);

    padding:16px 10px;
    overflow-y:auto;

    background:#fff;
    border-right:1px solid var(--krim-line);
}

.krim-nav-section{
    margin-bottom:18px;
}

.krim-nav-title{
    padding:0 9px 7px;
    color:#8a94a4;
    font-size:8px;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:.09em;
}

.krim-nav{
    display:flex;
    align-items:center;
    gap:9px;

    min-height:36px;
    padding:0 9px;

    border-radius:7px;

    color:#536074;
    font-size:10px;
    font-weight:650;

    text-decoration:none;
}

.krim-nav:hover,
.krim-nav.active{
    background:#eaf1ff;
    color:var(--krim-blue);
}

.krim-nav-icon{
    width:17px;
    text-align:center;
    flex:0 0 17px;
}

/* ---------------------------------------------------------
   MOBILE OVERLAY
   --------------------------------------------------------- */

.krim-overlay{
    display:none;
}

/* ---------------------------------------------------------
   MAIN
   --------------------------------------------------------- */

.krim-main{
    margin-left:var(--sidebar-width);
    padding-top:var(--header-height);
    min-height:100vh;
}

.krim-content{
    width:100%;
    max-width:1580px;
    margin:0 auto;
    padding:24px;
}

.krim-breadcrumb{
    margin-bottom:9px;
    color:#8993a2;
    font-size:9px;
}

/* ---------------------------------------------------------
   HERO
   --------------------------------------------------------- */

.krim-hero{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    margin-bottom:20px;
}

.krim-eyebrow{
    color:var(--krim-blue);
    font-size:8px;
    font-weight:900;
    letter-spacing:.1em;
}

.krim-hero h1{
    margin:5px 0 0;
    font-size:clamp(25px,3vw,37px);
    line-height:1.05;
    letter-spacing:-.04em;
}

.krim-hero p{
    max-width:720px;
    margin:9px 0 0;
    color:var(--krim-muted);
    font-size:11px;
    line-height:1.55;
}

.krim-hero-actions{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

.krim-btn{
    min-height:36px;
    display:inline-flex;
    align-items:center;
    justify-content:center;

    padding:0 13px;

    border:1px solid var(--krim-line);
    border-radius:7px;

    font-size:9px;
    font-weight:900;
    text-decoration:none;
    cursor:pointer;
}

.krim-btn-primary{
    background:var(--krim-blue);
    border-color:var(--krim-blue);
    color:#fff;
}

.krim-btn-secondary{
    background:#fff;
    color:#536074;
}

/* ---------------------------------------------------------
   GLOBAL CONTEXT
   --------------------------------------------------------- */

.krim-context{
    display:grid;
    grid-template-columns:2fr repeat(4,1fr);
    gap:1px;

    margin-bottom:15px;

    overflow:hidden;

    background:var(--krim-line);
    border:1px solid var(--krim-line);
    border-radius:9px;
}

.krim-context-item{
    min-height:58px;
    padding:11px 13px;
    background:#fff;
}

.krim-context-item small{
    display:block;
    color:#8993a2;
    font-size:7px;
    font-weight:900;
    text-transform:uppercase;
}

.krim-context-item strong{
    display:block;
    margin-top:5px;
    font-size:10px;
}

/* ---------------------------------------------------------
   KPI
   --------------------------------------------------------- */

.krim-kpis{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:9px;
    margin-bottom:15px;
}

.krim-kpi{
    min-height:104px;
    padding:13px;

    background:#fff;
    border:1px solid var(--krim-line);
    border-radius:9px;
}

.krim-kpi small{
    color:#8993a2;
    font-size:7px;
    font-weight:900;
    text-transform:uppercase;
}

.krim-kpi-value{
    display:block;
    margin-top:9px;
    font-size:21px;
    font-weight:900;
}

.krim-kpi-description{
    display:block;
    margin-top:4px;
    color:#8993a2;
    font-size:7px;
}

/* ---------------------------------------------------------
   TWO-COLUMN GRID
   --------------------------------------------------------- */

.krim-grid{
    display:grid;
    grid-template-columns:1.7fr 1fr;
    gap:14px;
    margin-bottom:14px;
}

/* ---------------------------------------------------------
   PANELS
   --------------------------------------------------------- */

.krim-panel{
    overflow:hidden;
    background:#fff;
    border:1px solid var(--krim-line);
    border-radius:9px;
}

.krim-panel-header{
    min-height:54px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;

    padding:0 14px;

    border-bottom:1px solid #edf0f4;
}

.krim-panel-title strong{
    display:block;
    font-size:11px;
}

.krim-panel-title small{
    display:block;
    margin-top:3px;
    color:#8993a2;
    font-size:7px;
}

.krim-panel-link{
    color:var(--krim-blue);
    font-size:8px;
    font-weight:900;
    text-decoration:none;
}

.krim-panel-body{
    padding:14px;
}

/* ---------------------------------------------------------
   SHIPMENT SEARCH
   --------------------------------------------------------- */

.krim-shipment-tools{
    display:flex;
    gap:6px;
    margin-bottom:10px;
}

.krim-shipment-tools input{
    flex:1;
    min-width:0;
    height:32px;
    padding:0 9px;

    border:1px solid var(--krim-line);
    border-radius:6px;

    outline:none;
    font-size:9px;
}

.krim-shipment-tools select{
    height:32px;
    padding:0 7px;

    border:1px solid var(--krim-line);
    border-radius:6px;

    background:#fff;
    font-size:8px;
}

.krim-table-wrap{
    overflow-x:auto;
}

.krim-table{
    width:100%;
    min-width:580px;
    border-collapse:collapse;
}

.krim-table th{
    padding:8px;
    background:#f8fafc;
    color:#8993a2;
    text-align:left;
    font-size:7px;
    font-weight:900;
    text-transform:uppercase;
}

.krim-table td{
    padding:10px 8px;
    border-top:1px solid #edf0f4;
    color:#536074;
    font-size:8px;
}

.krim-table td strong{
    color:var(--krim-dark);
}

.krim-empty{
    padding:28px 12px;
    text-align:center;
    color:#8993a2;
    border:1px dashed var(--krim-line);
    border-radius:7px;
    font-size:9px;
    line-height:1.5;
}

/* ---------------------------------------------------------
   ATTENTION
   --------------------------------------------------------- */

.krim-attention{
    display:flex;
    gap:9px;
    padding:11px 0;
    border-bottom:1px solid #edf0f4;
}

.krim-attention:last-child{
    border-bottom:0;
}

.krim-attention-icon{
    width:28px;
    height:28px;
    flex:0 0 28px;

    display:grid;
    place-items:center;

    border-radius:7px;
    background:#fff4e5;
    color:var(--krim-orange);
    font-size:10px;
    font-weight:900;
}

.krim-attention strong{
    font-size:9px;
}

.krim-attention span{
    display:block;
    margin-top:3px;
    color:#8993a2;
    font-size:8px;
    line-height:1.4;
}

/* ---------------------------------------------------------
   QUICK OPERATIONS
   --------------------------------------------------------- */

.krim-actions-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
}

.krim-action{
    min-height:68px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;

    padding:10px;

    border:1px solid var(--krim-line);
    border-radius:7px;

    color:inherit;
    text-decoration:none;
}

.krim-action:hover{
    border-color:var(--krim-blue);
    background:#f8faff;
}

.krim-action-icon{
    color:var(--krim-blue);
    font-size:13px;
}

.krim-action strong{
    font-size:8px;
}

/* ---------------------------------------------------------
   OPERATING ENVIRONMENT
   --------------------------------------------------------- */

.krim-environment-item{
    display:flex;
    gap:9px;
    padding:10px 0;
    border-bottom:1px solid #edf0f4;
}

.krim-environment-item:last-child{
    border-bottom:0;
}

.krim-environment-icon{
    width:28px;
    height:28px;
    flex:0 0 28px;

    display:grid;
    place-items:center;

    border-radius:7px;
    background:#eef8f2;
    color:var(--krim-green);
    font-size:10px;
    font-weight:900;
}

.krim-environment-item strong{
    font-size:9px;
}

.krim-environment-item span{
    display:block;
    margin-top:3px;
    color:#8993a2;
    font-size:8px;
    line-height:1.4;
}

/* ---------------------------------------------------------
   DOMAINS
   --------------------------------------------------------- */

.krim-domains-panel{
    margin-bottom:14px;
}

.krim-domains{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:7px;
}

.krim-domain{
    min-height:76px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;

    padding:9px;

    border:1px solid var(--krim-line);
    border-radius:7px;

    color:inherit;
    text-decoration:none;
}

.krim-domain:hover{
    border-color:var(--krim-blue);
    background:#f8faff;
}

.krim-domain-code{
    color:#8993a2;
    font-size:6px;
    font-weight:900;
}

.krim-domain strong{
    font-size:8px;
}

.krim-domain span{
    color:#8993a2;
    font-size:7px;
}

.krim-domain.disabled{
    opacity:.55;
    cursor:not-allowed;
}

.krim-domain.disabled:hover{
    border-color:var(--krim-line);
    background:#fff;
}

/* ---------------------------------------------------------
   FOOTER
   --------------------------------------------------------- */

.krim-footer{
    margin-top:25px;
    padding:20px 0 8px;
    border-top:1px solid var(--krim-line);
}

.krim-footer-grid{
    display:grid;
    grid-template-columns:2fr repeat(4,1fr);
    gap:22px;
}

.krim-footer strong{
    font-size:10px;
}

.krim-footer p{
    max-width:300px;
    margin:9px 0 0;
    color:#8993a2;
    font-size:8px;
    line-height:1.5;
}

.krim-footer h4{
    margin:0 0 8px;
    font-size:8px;
}

.krim-footer a{
    display:block;
    margin-bottom:6px;
    color:#7c8797;
    font-size:7px;
    text-decoration:none;
}

.krim-footer a:hover{
    color:var(--krim-blue);
}

.krim-footer-bottom{
    display:flex;
    justify-content:space-between;
    gap:12px;

    margin-top:18px;
    padding-top:10px;

    border-top:1px solid #edf0f4;

    color:#8993a2;
    font-size:7px;
}

/* ---------------------------------------------------------
   RESPONSIVE
   --------------------------------------------------------- */

@media(max-width:1200px){

    .krim-kpis{
        grid-template-columns:repeat(3,1fr);
    }

    .krim-domains{
        grid-template-columns:repeat(4,1fr);
    }

    .krim-footer-grid{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:900px){

    :root{
        --sidebar-width:210px;
    }

    .krim-context{
        grid-template-columns:repeat(2,1fr);
    }

    .krim-context-item:first-child{
        grid-column:1/-1;
    }

    .krim-grid{
        grid-template-columns:1fr;
    }

    .krim-domains{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:700px){

    .krim-menu{
        display:block;
    }

    .krim-brand{
        min-width:auto;
    }

    .krim-brand-text small{
        display:none;
    }

    .krim-search{
        flex:1;
        width:auto;
    }

    .krim-sidebar{
        transform:translateX(-100%);
        transition:transform .2s ease;
        box-shadow:8px 0 25px rgba(0,0,0,.12);
    }

    .krim-sidebar.open{
        transform:translateX(0);
    }

    .krim-overlay.open{
        display:block;
        position:fixed;
        z-index:850;
        inset:0;
        background:rgba(0,0,0,.35);
    }

    .krim-main{
        margin-left:0;
    }

    .krim-content{
        padding:18px 13px;
    }

    .krim-hero{
        flex-direction:column;
        align-items:flex-start;
    }

    .krim-hero-actions{
        width:100%;
    }

    .krim-hero-actions .krim-btn{
        flex:1;
    }

    .krim-domains{
        grid-template-columns:repeat(2,1fr);
    }

    .krim-footer-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:480px){

    .krim-header{
        padding:0 9px;
        gap:7px;
    }

    .krim-brand-text strong{
        font-size:14px;
    }

    .krim-header-actions .krim-icon-button{
        display:none;
    }

    .krim-user-email{
        display:none;
    }

    .krim-search input{
        font-size:9px;
    }

    .krim-kpis{
        grid-template-columns:repeat(2,1fr);
    }

    .krim-context{
        grid-template-columns:1fr 1fr;
    }

    .krim-context-item:first-child{
        grid-column:1/-1;
    }

    .krim-actions-grid{
        grid-template-columns:1fr 1fr;
    }

    .krim-domains{
        grid-template-columns:1fr 1fr;
    }

    .krim-footer-grid{
        grid-template-columns:1fr 1fr;
    }

    .krim-footer-bottom{
        flex-direction:column;
    }
}

@media(max-width:350px){

    .krim-search{
        display:none;
    }

    .krim-kpis{
        grid-template-columns:1fr;
    }

    .krim-context{
        grid-template-columns:1fr;
    }

    .krim-context-item:first-child{
        grid-column:auto;
    }

    .krim-domains{
        grid-template-columns:1fr;
    }

    .krim-footer-grid{
        grid-template-columns:1fr;
    }
}

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
    }
}
</style>
</head>

<body>

<!-- =======================================================
     INITIAL LOADING STATE
     ======================================================= -->

<div id="krimLoading" class="krim-loading">
