<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b5cff">

<title>KRIM Dashboard</title>

<style>
/* =========================================================
   KRIM DASHBOARD
   Permanent standalone visual shell
   ========================================================= */

:root{
    --blue:#0b5cff;
    --blue-dark:#0847c7;
    --dark:#142033;
    --text:#344054;
    --muted:#7b8798;
    --line:#e4e8ef;
    --bg:#f5f7fa;
    --white:#ffffff;
    --green:#16834b;
    --green-bg:#edf8f2;
    --orange:#b86b00;
    --orange-bg:#fff5e8;
    --red:#c9363e;
    --red-bg:#fff0f2;
    --blue-bg:#edf3ff;
    --sidebar:240px;
    --header:66px;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    background:var(--bg);
    color:var(--dark);
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    font-size:14px;
}

button,
input,
select{
    font:inherit;
}

button,
a{
    -webkit-tap-highlight-color:transparent;
}

a{
    color:inherit;
}

/* =========================================================
   HEADER
   ========================================================= */

.header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:1000;

    height:var(--header);

    display:flex;
    align-items:center;

    padding:0 18px;

    background:#fff;
    border-bottom:1px solid var(--line);
}

.menu-btn{
    display:none;

    width:38px;
    height:38px;

    margin-right:8px;

    border:1px solid var(--line);
    border-radius:8px;

    background:#fff;

    cursor:pointer;

    font-size:19px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;

    width:235px;

    text-decoration:none;
}

.logo-mark{
    width:35px;
    height:35px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:8px;

    background:var(--blue);
    color:white;

    font-weight:900;
    font-size:18px;
}

.logo-text strong{
    display:block;

    font-size:17px;
    line-height:1;
    letter-spacing:-.02em;
}

.logo-text span{
    display:block;

    margin-top:4px;

    color:#8993a2;

    font-size:7px;
    font-weight:800;
    letter-spacing:.08em;
}

.search{
    width:390px;
}

.search input{
    width:100%;
    height:38px;

    padding:0 13px;

    border:1px solid var(--line);
    border-radius:8px;

    outline:none;

    background:#f8fafc;

    color:var(--dark);

    font-size:12px;
}

.search input:focus{
    border-color:var(--blue);
    background:#fff;
}

.header-space{
    flex:1;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:8px;
}

.header-icon{
    width:37px;
    height:37px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid var(--line);
    border-radius:8px;

    background:#fff;

    cursor:pointer;

    color:#596579;
}

.profile{
    height:38px;

    display:flex;
    align-items:center;
    gap:8px;

    padding:3px 10px 3px 4px;

    border:1px solid var(--line);
    border-radius:8px;

    background:#fff;

    cursor:pointer;
}

.avatar{
    width:30px;
    height:30px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:var(--blue-bg);
    color:var(--blue);

    font-weight:900;
    font-size:11px;
}

.profile-name{
    max-width:150px;

    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;

    font-size:10px;
    font-weight:800;
}

/* =========================================================
   SIDEBAR
   ========================================================= */

.sidebar{
    position:fixed;
    top:var(--header);
    left:0;
    bottom:0;
    z-index:900;

    width:var(--sidebar);

    overflow-y:auto;

    padding:18px 11px;

    background:#fff;
    border-right:1px solid var(--line);
}

.nav-group{
    margin-bottom:22px;
}

.nav-title{
    padding:0 9px 8px;

    color:#98a2b3;

    font-size:8px;
    font-weight:900;

    text-transform:uppercase;
    letter-spacing:.09em;
}

.nav-link{
    min-height:37px;

    display:flex;
    align-items:center;
    gap:10px;

    margin:2px 0;
    padding:0 10px;

    border-radius:7px;

    color:#526074;

    font-size:10px;
    font-weight:700;

    text-decoration:none;
}

.nav-link:hover{
    background:#f1f5ff;
    color:var(--blue);
}

.nav-link.active{
    background:var(--blue-bg);
    color:var(--blue);
    font-weight:900;
}

.nav-icon{
    width:17px;
    text-align:center;
    font-size:13px;
}

/* =========================================================
   MOBILE OVERLAY
   ========================================================= */

.overlay{
    display:none;
}

/* =========================================================
   MAIN
   ========================================================= */

.main{
    min-height:100vh;

    margin-left:var(--sidebar);
    padding-top:var(--header);
}

.container{
    width:100%;
    max-width:1600px;

    margin:auto;

    padding:25px;
}

/* =========================================================
   BREADCRUMB
   ========================================================= */

.breadcrumb{
    margin-bottom:9px;

    color:#98a2b3;

    font-size:9px;
}

/* =========================================================
   HERO
   ========================================================= */

.hero{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;

    gap:20px;

    margin-bottom:20px;
}

.eyebrow{
    color:var(--blue);

    font-size:8px;
    font-weight:900;

    letter-spacing:.1em;
}

.hero h1{
    margin:6px 0 0;

    font-size:36px;
    line-height:1.08;

    letter-spacing:-.045em;
}

.hero p{
    max-width:720px;

    margin:10px 0 0;

    color:var(--muted);

    font-size:11px;
    line-height:1.6;
}

.hero-actions{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.btn{
    min-height:38px;

    display:inline-flex;
    align-items:center;
    justify-content:center;

    padding:0 14px;

    border:1px solid var(--line);
    border-radius:7px;

    background:#fff;

    color:var(--text);

    font-size:9px;
    font-weight:900;

    text-decoration:none;

    cursor:pointer;
}

.btn-primary{
    background:var(--blue);
    border-color:var(--blue);
    color:#fff;
}

.btn-primary:hover{
    background:var(--blue-dark);
}

/* =========================================================
   GLOBAL CONTEXT
   ========================================================= */

.context{
    display:grid;
    grid-template-columns:2fr repeat(4,1fr);

    overflow:hidden;

    margin-bottom:15px;

    border:1px solid var(--line);
    border-radius:9px;

    background:var(--line);
}

.context-item{
    min-height:62px;

    padding:12px 14px;

    background:#fff;
}

.context-item small{
    display:block;

    color:#98a2b3;

    font-size:7px;
    font-weight:900;

    text-transform:uppercase;
}

.context-item strong{
    display:block;

    margin-top:5px;

    font-size:10px;
}

/* =========================================================
   KPI
   ========================================================= */

.kpis{
    display:grid;
    grid-template-columns:repeat(6,1fr);

    gap:9px;

    margin-bottom:15px;
}

.kpi{
    min-height:110px;

    padding:15px;

    border:1px solid var(--line);
    border-radius:9px;

    background:#fff;
}

.kpi-label{
    color:#8993a2;

    font-size:7px;
    font-weight:900;

    text-transform:uppercase;
}

.kpi-value{
    display:block;

    margin-top:10px;

    font-size:25px;
    font-weight:900;
}

.kpi-note{
    display:block;

    margin-top:5px;

    color:#98a2b3;

    font-size:7px;
}

/* =========================================================
   CONTENT GRID
   ========================================================= */

.grid{
    display:grid;
    grid-template-columns:1.7fr 1fr;

    gap:14px;

    margin-bottom:14px;
}

/* =========================================================
   PANEL
   ========================================================= */

.panel{
    overflow:hidden;

    border:1px solid var(--line);
    border-radius:9px;

    background:#fff;
}

.panel-head{
    min-height:58px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:12px;

    padding:0 15px;

    border-bottom:1px solid #edf0f4;
}

.panel-head strong{
    display:block;

    font-size:11px;
}

.panel-head small{
    display:block;

    margin-top:4px;

    color:#98a2b3;

    font-size:7px;
}

.panel-link{
    color:var(--blue);

    font-size:8px;
    font-weight:900;

    text-decoration:none;
}

.panel-body{
    padding:15px;
}

/* =========================================================
   SHIPMENT CONTROLS
   ========================================================= */

.controls{
    display:flex;
    gap:7px;

    margin-bottom:11px;
}

.shipment-search{
    flex:1;

    height:34px;

    min-width:0;

    padding:0 10px;

    border:1px solid var(--line);
    border-radius:6px;

    outline:none;

    font-size:9px;
}

.shipment-search:focus{
    border-color:var(--blue);
}

.shipment-filter{
    height:34px;

    padding:0 9px;

    border:1px solid var(--line);
    border-radius:6px;

    background:#fff;

    font-size:8px;
}

/* =========================================================
   TABLE
   ========================================================= */

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    min-width:620px;

    border-collapse:collapse;
}

th{
    padding:9px 8px;

    background:#f8fafc;

    color:#98a2b3;

    font-size:7px;
    font-weight:900;

    text-align:left;

    text-transform:uppercase;
}

td{
    padding:11px 8px;

    border-top:1px solid #edf0f4;

    color:#596579;

    font-size:8px;
}

td strong{
    color:var(--dark);
}

.empty{
    padding:28px 15px;

    border:1px dashed var(--line);
    border-radius:7px;

    color:#98a2b3;

    text-align:center;

    font-size:9px;
    line-height:1.5;
}

/* =========================================================
   BADGES
   ========================================================= */

.badge{
    display:inline-flex;
    align-items:center;

    min-height:20px;

    padding:0 7px;

    border-radius:999px;

    font-size:7px;
    font-weight:900;
}

.badge-blue{
    background:var(--blue-bg);
    color:var(--blue);
}

.badge-green{
    background:var(--green-bg);
    color:var(--green);
}

.badge-orange{
    background:var(--orange-bg);
    color:var(--orange);
}

/* =========================================================
   ATTENTION
   ========================================================= */

.attention{
    display:flex;
    gap:10px;

    padding:12px 0;

    border-bottom:1px solid #edf0f4;
}

.attention:last-child{
    border-bottom:0;
}

.attention-icon{
    width:30px;
    height:30px;

    flex:0 0 30px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:7px;

    background:var(--orange-bg);
    color:var(--orange);

    font-size:11px;
    font-weight:900;
}

.attention strong{
    font-size:9px;
}

.attention span{
    display:block;

    margin-top:4px;

    color:#98a2b3;

    font-size:8px;
    line-height:1.45;
}

/* =========================================================
   QUICK ACTIONS
   ========================================================= */

.actions{
    display:grid;
    grid-template-columns:repeat(3,1fr);

    gap:7px;
}

.action{
    min-height:73px;

    display:flex;
    flex-direction:column;
    justify-content:space-between;

    padding:10px;

    border:1px solid var(--line);
    border-radius:7px;

    background:#fff;

    text-decoration:none;
}

.action:hover{
    border-color:var(--blue);
    background:#f8faff;
}

.action-icon{
    color:var(--blue);

    font-size:15px;
}

.action strong{
    font-size:8px;
}

/* =========================================================
   ENVIRONMENT
   ========================================================= */

.environment{
    display:flex;
    flex-direction:column;
}

.environment-row{
    display:flex;
    gap:10px;

    padding:11px 0;

    border-bottom:1px solid #edf0f4;
}

.environment-row:last-child{
    border-bottom:0;
}

.environment-icon{
    width:30px;
    height:30px;

    flex:0 0 30px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:7px;

    background:var(--green-bg);
    color:var(--green);

    font-size:10px;
    font-weight:900;
}

.environment-row strong{
    font-size:9px;
}

.environment-row span{
    display:block;

    margin-top:4px;

    color:#98a2b3;

    font-size:8px;
    line-height:1.45;
}

/* =========================================================
   DOMAINS
   ========================================================= */

.domain-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);

    gap:7px;
}

.domain{
    min-height:82px;

    display:flex;
    flex-direction:column;
    justify-content:space-between;

    padding:10px;

    border:1px solid var(--line);
    border-radius:7px;

    background:#fff;

    text-decoration:none;
}

.domain:hover{
    border-color:var(--blue);
    background:#f8faff;
}

.domain-code{
    color:#98a2b3;

    font-size:6px;
    font-weight:900;
}

.domain strong{
    font-size:8px;
}

.domain span{
    color:#98a2b3;

    font-size:7px;
}

/* =========================================================
   FOOTER
   ========================================================= */

.footer{
    margin-top:25px;

    padding-top:20px;

    border-top:1px solid var(--line);
}

.footer-grid{
    display:grid;
    grid-template-columns:2fr repeat(4,1fr);

    gap:25px;
}

.footer strong{
    font-size:10px;
}

.footer p{
    max-width:310px;

    margin:9px 0 0;

    color:#98a2b3;

    font-size:8px;
    line-height:1.55;
}

.footer h4{
    margin:0 0 9px;

    font-size:8px;
}

.footer a{
    display:block;

    margin-bottom:7px;

    color:#7b8798;

    font-size:7px;

    text-decoration:none;
}

.footer a:hover{
    color:var(--blue);
}

.footer-bottom{
    display:flex;
    justify-content:space-between;

    gap:15px;

    margin-top:18px;
    padding:11px 0 5px;

    border-top:1px solid #edf0f4;

    color:#98a2b3;

    font-size:7px;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-width:1200px){

    .kpis{
        grid-template-columns:repeat(3,1fr);
    }

    .domain-grid{
        grid-template-columns:repeat(4,1fr);
    }

    .footer-grid{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:900px){

    .context{
        grid-template-columns:repeat(2,1fr);
    }

    .context-item:first-child{
        grid-column:1/-1;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .domain-grid{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:700px){

    .menu-btn{
        display:flex;
        align-items:center;
        justify-content:center;
    }

    .logo{
        width:auto;
    }

    .logo-text span{
        display:none;
    }

    .search{
        flex:1;
        width:auto;
    }

    .sidebar{
        transform:translateX(-105%);

        transition:transform .2s ease;

        box-shadow:10px 0 25px rgba(0,0,0,.12);
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .overlay.open{
        display:block;

        position:fixed;
        inset:0;
        z-index:850;

        background:rgba(0,0,0,.35);
    }

    .main{
        margin-left:0;
    }

    .container{
        padding:18px 13px;
    }

    .hero{
        flex-direction:column;
        align-items:flex-start;
    }

    .hero h1{
        font-size:29px;
    }

    .hero-actions{
        width:100%;
    }

    .hero-actions .btn{
        flex:1;
    }

    .domain-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .footer-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:480px){

    .header{
        padding:0 9px;
    }

    .logo-text strong{
        font-size:14px;
    }

    .header-icon{
        display:none;
    }

    .profile-name{
        display:none;
    }

    .search input{
        height:36px;
        font-size:9px;
    }

    .context{
        grid-template-columns:1fr 1fr;
    }

    .context-item:first-child{
        grid-column:1/-1;
    }

    .kpis{
        grid-template-columns:repeat(2,1fr);
    }

    .actions{
        grid-template-columns:1fr 1fr;
    }

    .domain-grid{
        grid-template-columns:1fr 1fr;
    }

    .footer-grid{
        grid-template-columns:1fr 1fr;
    }

    .footer-bottom{
        flex-direction:column;
    }
}

@media(max-width:350px){

    .search{
        display:none;
    }

    .kpis{
        grid-template-columns:1fr;
    }

    .context{
        grid-template-columns:1fr;
    }

    .context-item:first-child{
        grid-column:auto;
    }

    .domain-grid,
    .footer-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>


<body>

<!-- =======================================================
     HEADER
     ======================================================= -->

<header class="header">

    <button
        id="menuButton"
        class="menu-btn"
        type="button"
        aria-label="Open navigation"
    >
        ☰
    </button>


    <a
        class="logo"
        href="../home.html"
    >

        <span class="logo-mark">
            K
        </span>

        <span class="logo-text">

            <strong>
                KRIM
            </strong>

            <span>
                GLOBAL LOGISTICS OPERATING SYSTEM
            </span>

        </span>

    </a>


    <div class="search">

        <input
            id="globalSearch"
            type="search"
            placeholder="Search shipments, tracking, quotes..."
            aria-label="Search KRIM"
        >

    </div>


    <div class="header-space"></div>


    <div class="header-actions">

        <button
            class="header-icon"
            type="button"
            aria-label="Notifications"
        >
            🔔
        </button>

        <button
            class="header-icon"
            type="button"
            aria-label="Help"
        >
            ?
        </button>

        <button
            id="profileButton"
            class="profile"
            type="button"
            title="Account"
        >

            <span
                id="avatar"
                class="avatar"
            >
                K
            </span>

            <span
                id="profileName"
                class="profile-name"
            >
                KRIM Customer
            </span>

        </button>

    </div>

</header>


<!-- =======================================================
     MOBILE OVERLAY
     ======================================================= -->

<div
    id="overlay"
    class="overlay"
></div>


<!-- =======================================================
     SIDEBAR
     ======================================================= -->

<aside
    id="sidebar"
    class="sidebar"
>


    <div class="nav-group">

        <div class="nav-title">
            Overview
        </div>

        <a
            href="customer-workspace.html"
            class="nav-link active"
        >
            <span class="nav-icon">⌂</span>
            Dashboard
        </a>

        <a
            href="../domains/shipments.html"
            class="nav-link"
        >
            <span class="nav-icon">▣</span>
            Shipments
        </a>
