<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Logistics Admin Dashboard</title>

<style>

body {
    font-family: Arial, sans-serif;
        background: #f4f7fb;
            margin: 0;
                padding: 20px;
                }

                h1 {
                    color: #123b6d;
                    }

                    .message {
                        padding: 12px;
                            margin: 15px 0;
                                border-radius: 6px;
                                    display: none;
                                    }

                                    .success {
                                        background: #d4edda;
                                            color: #155724;
                                            }

                                            .error {
                                                background: #f8d7da;
                                                    color: #721c24;
                                                    }

                                                    .loading {
                                                        color: #555;
                                                            margin: 15px 0;
                                                            }

                                                            table {
                                                                width: 100%;
                                                                    border-collapse: collapse;
                                                                        background: white;
                                                                            margin-top: 20px;
                                                                            }

                                                                            th {
                                                                                background: #123b6d;
                                                                                    color: white;
                                                                                        padding: 12px;
                                                                                            text-align: left;
                                                                                            }

                                                                                            td {
                                                                                                padding: 10px;
                                                                                                    border-bottom: 1px solid #ddd;
                                                                                                    }

                                                                                                    select {
                                                                                                        padding: 8px;
                                                                                                            border-radius: 5px;
                                                                                                                border: 1px solid #ccc;
                                                                                                                }

                                                                                                                button {
                                                                                                                    padding: 8px 12px;
                                                                                                                        background: #123b6d;
                                                                                                                            color: white;
                                                                                                                                border: none;
                                                                                                                                    border-radius: 5px;
                                                                                                                                        cursor: pointer;
                                                                                                                                        }

                                                                                                                                        button:hover {
                                                                                                                                            background: #0d2d52;
                                                                                                                                            }

                                                                                                                                            .status-badge {
                                                                                                                                                padding: 5px 9px;
                                                                                                                                                    border-radius: 12px;
                                                                                                                                                        font-size: 13px;
                                                                                                                                                            font-weight: bold;
                                                                                                                                                            }

                                                                                                                                                            .status-new {
                                                                                                                                                                background: #dbeafe;
                                                                                                                                                                    color: #1d4ed8;
                                                                                                                                                                    }

                                                                                                                                                                    .status-confirmed {
                                                                                                                                                                        background: #dcfce7;
                                                                                                                                                                            color: #166534;
                                                                                                                                                                            }

                                                                                                                                                                            .status-transit {
                                                                                                                                                                                background: #fef3c7;
                                                                                                                                                                                    color: #92400e;
                                                                                                                                                                                    }

                                                                                                                                                                                    .status-delivered {
                                                                                                                                                                                        background: #d1fae5;
                                                                                                                                                                                            color: #065f46;
                                                                                                                                                                                            }

                                                                                                                                                                                            .status-cancelled {
                                                                                                                                                                                                background: #fee2e2;
                                                                                                                                                                                                    color: #991b1b;
                                                                                                                                                                                                    }

                                                                                                                                                                                                    </style>

                                                                                                                                                                                                    </head>

                                                                                                                                                                                                    <body>

                                                                                                                                                                                                    <h1>🚚 Logistics Admin Dashboard</h1>

                                                                                                                                                                                                    <div id="message" class="message"></div>

                                                                                                                                                                                                    <div id="loading" class="loading">
                                                                                                                                                                                                        Loading shipments...
                                                                                                                                                                                                        </div>

                                                                                                                                                                                                        <div id="tableContainer"></div>
                                                                                                                                                                                                   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

                                                                                                                                                                                                   <script src="config.js"></script>

                                                                                                                                                                                                        <script>

                                                                                                                                                                                                        const tableContainer = document.getElementById("tableContainer");

                                                                                                                                                                                                        const loading = document.getElementById("loading");

                                                                                                                                                                                                        const message = document.getElementById("message");


                                                                                                                                                                                                        function showMessage(text, type) {

                                                                                                                                                                                                            message.textContent = text;

                                                                                                                                                                                                                message.className = "message " + type;

                                                                                                                                                                                                                    message.style.display = "block";

                                                                                                                                                                                                                    }


                                                                                                                                                                                                                    function hideMessage() {

                                                                                                                                                                                                                        message.style.display = "none";

                                                                                                                                                                                                                        }
                                                                                                                                                                                                    async function loadShipments() {

                                                                                                                                                                                                            loading.style.display = "block";

                                                                                                                                                                                                                tableContainer.innerHTML = "";

                                                                                                                                                                                                                    hideMessage();

                                                                                                                                                                                                                        try {

                                                                                                                                                                                                                                const { data, error } = await supabaseClient
                                                                                                                                                                                                                                            .from("shipment_requests")
                                                                                                                                                                                                                                                        .select("*")
                                                                                                                                                                                                                                                                    .order("created_at", { ascending: false });


                                                                                                                                                                                                                                                                            if (error) {

                                                                                                                                                                                                                                                                                        console.error("Supabase error:", error);

                                                                                                                                                                                                                                                                                                    showMessage(
                                                                                                                                                                                                                                                                                                                    "Error loading shipments: " + error.message,
                                                                                                                                                                                                                                                                                                                                    "error"
                                                                                                                                                                                                                                                                                                                                                );

                                                                                                                                                                                                                                                                                                                                                            loading.style.display = "none";

                                                                                                                                                                                                                                                                                                                                                                        return;
                                                                                                                                                                                                                                                                                                                                                                                }


                                                                                                                                                                                                                                                                                                                                                                                        loading.style.display = "none";


                                                                                                                                                                                                                                                                                                                                                                                                if (!data || data.length === 0) {

                                                                                                                                                                                                                                                                                                                                                                                                            tableContainer.innerHTML =
                                                                                                                                                                                                                                                                                                                                                                                                                            "<p>No shipment requests found.</p>";

                                                                                                                                                                                                                                                                                                                                                                                                                                        return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                }


                                                                                                                                                                                                                                                                                                                                                                                                                                                        createShipmentTable(data);

                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                catch (error) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                        console.error(error);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                loading.style.display = "none";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        showMessage(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    "Something went wrong: " + error.message,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "error"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                function createShipmentTable(shipments) {
                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                    let html = `
                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                        <table>
                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                <thead>
                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                            <tr>
                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                            <th>Pickup</th>
                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                            <th>Delivery</th>
                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                            <th>Material / Goods</th>
                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                            <th>Weight</th>
                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                            <th>Truck Type</th>
                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                            <th>Customer</th>
                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                            <th>Phone</th>
                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                            <th>Status</th>
                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                            <th>Action</th>
                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                        </tr>
                                                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                                                                </thead>
                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                        <tbody>
                                                                                                                                                                                                                                                                                                                                                                                                                                                            `;
                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                shipments.forEach(function(shipment) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const status =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    shipment.status || "new";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            html += `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <tr>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <td>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ${escapeHtml(shipment.pickup_location || "")}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </td>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <td>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ${escapeHtml(shipment.delivery_location || "")}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </td>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <td>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ${escapeHtml(shipment.material_goods || "")}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </td>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <td>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ${escapeHtml(shipment.weight || "")}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </td>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <td>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ${escapeHtml(shipment.truck_type || "")}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </td>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <td>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ${escapeHtml(shipment.customer_name || "")}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </td>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <td>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ${escapeHtml(shipment.phone_number || "")}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </td>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <td>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <span class="status-badge status-${statusClass(status)}">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ${escapeHtml(status)}

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </span>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </td>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <td>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <select id="status-${shipment.id}">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <option value="new"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ${status === "new" ? "selected" : ""}>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        New
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </option>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <option value="confirmed"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ${status === "confirmed" ? "selected" : ""}>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                Confirmed
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </option>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <option value="in_transit"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ${status === "in_transit" ? "selected" : ""}>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        In Transit
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </option>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <option value="delivered"
