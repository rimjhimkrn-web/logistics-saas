<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logistics SaaS Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
header{background:#172033;color:white;padding:18px}
header div{max-width:1200px;margin:auto}
h1{margin:0;font-size:23px}
header p{margin:5px 0 0;opacity:.8}
main{max-width:1200px;margin:20px auto;padding:0 14px 40px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.card{background:white;border:1px solid #ddd;border-radius:12px;padding:18px}
.card small{color:#64748b}
.num{font-size:28px;font-weight:bold;margin-top:8px}
.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr 150px;gap:10px;margin-bottom:16px}
input,select,button{width:100%;min-height:44px;border:1px solid #cbd5e1;border-radius:8px;padding:10px;font-size:14px;background:white}
button{background:#172033;color:white;font-weight:bold;border-color:#172033}
.message{display:none;padding:12px;border-radius:8px;margin-bottom:15px}
.success{display:block;background:#dcfce7;color:#166534}
.error{display:block;background:#fee2e2;color:#991b1b}
.tablebox{background:white;border-radius:12px;border:1px solid #ddd;overflow:auto}
table{width:100%;min-width:1100px;border-collapse:collapse}
th,td{padding:12px;border-bottom:1px solid #eee;text-align:left;font-size:13px}
th{background:#f8fafc;font-size:12px}
.actions{display:flex;flex-direction:column;gap:7px;min-width:170px}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;font-weight:bold;font-size:12px}
.new{background:#dbeafe;color:#1d4ed8}
.assigned{background:#ede9fe;color:#6d28d9}
.accepted{background:#e0e7ff;color:#3730a3}
.picked_up{background:#fef3c7;color:#92400e}
.in_transit{background:#cffafe;color:#155e75}
.delivered{background:#dcfce7;color:#166534}
.cancelled{background:#fee2e2;color:#991b1b}
.loading{text-align:center;padding:30px;color:#64748b}
@media(max-width:800px){
.grid{grid-template-columns:repeat(2,1fr)}
.toolbar{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<div>
<h1>Logistics SaaS Admin</h1>
<p>Shipment & Partner Management</p>
</div>
</header>

<main>

<div id="message" class="message"></div>

<div class="grid">
<div class="card"><small>Total Shipments</small><div id="total" class="num">0</div></div>
<div class="card"><small>New</small><div id="new" class="num">0</div></div>
<div class="card"><small>Assigned</small><div id="assigned" class="num">0</div></div>
<div class="card"><small>Delivered</small><div id="delivered" class="num">0</div></div>
</div>

<div class="toolbar">
<input id="search" placeholder="Search customer, pickup, delivery, phone...">

<select id="statusFilter">
<option value="">All statuses</option>
<option value="new">New</option>
<option value="assigned">Assigned</option>
<option value="accepted">Accepted</option>
<option value="picked_up">Picked Up</option>
<option value="in_transit">In Transit</option>
<option value="delivered">Delivered</option>
<option value="cancelled">Cancelled</option>
</select>

<select id="partnerFilter">
<option value="">All partners</option>
</select>

<button onclick="loadAll()">Refresh</button>
</div>

<div class="tablebox">
<div id="loading" class="loading">Loading shipments...</div>

<table id="table" style="display:none">
<thead>
<tr>
<th>ID</th>
<th>Customer</th>
<th>Route</th>
<th>Material</th>
<th>Weight</th>
<th>Truck</th>
<th>Status</th>
<th>Partner</th>
<th>Actions</th>
</tr>
</thead>
<tbody id="body"></tbody>
</table>
</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = "https://ebltviniygljwwseplph.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_8xzZUeubYp_nIxVRWEQdiw_2H4RkHAa";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
        );
        </script>

<script>

let shipments=[];
let partners=[];

const $=id=>document.getElementById(id);

function message(text,type){
const m=$("message");
m.textContent=text;
m.className="message "+type;
setTimeout(()=>{
m.className="message";
m.textContent="";
},4000);
}

function esc(v){
return String(v??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}

function statusText(s){
return({
new:"New",
assigned:"Assigned",
accepted:"Accepted",
picked_up:"Picked Up",
in_transit:"In Transit",
delivered:"Delivered",
cancelled:"Cancelled"
})[s]||s;
}

async function loadPartners(){

const result=await supabaseClient
.from("partners")
.select("id,name,contact_person,phone,email,status,created_at")
.order("name");

if(result.error) throw result.error;

partners=result.data||[];

const filter=$("partnerFilter");

filter.innerHTML='<option value="">All partners</option>';

partners.forEach(p=>{
filter.innerHTML+=
'<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>';
});

}

async function loadShipments(){

const result=await supabaseClient
.from("shipment_requests")
.select(`
id,
pickup_location,
delivery_location,
material_goods,
weight,
truck_type,
customer_name,
phone_number,
status,
created_at,
partner,
partner_id
`)
.order("created_at",{ascending:false});

if(result.error) throw result.error;

shipments=result.data||[];

}

function updateStats(){

$("total").textContent=shipments.length;

$("new").textContent=
shipments.filter(x=>x.status==="new").length;

$("assigned").textContent=
shipments.filter(x=>x.partner_id!==null).length;

$("delivered").textContent=
shipments.filter(x=>x.status==="delivered").length;

}

function partnerName(id,oldName){

if(id===null||id===undefined)
return oldName||"unassigned";

const p=partners.find(x=>String(x.id)===String(id));

return p?p.name:(oldName||"unassigned");
}

function statusOptions(current){

const list=[
["new","New"],
["assigned","Assigned"],
["accepted","Accepted"],
["picked_up","Picked Up"],
["in_transit","In Transit"],
["delivered","Delivered"],
["cancelled","Cancelled"]
];

return list.map(x=>
'<option value="'+x[0]+'" '+(current===x[0]?"selected":"")+'>'+
x[1]+'</option>'
).join("");
}

function partnerOptions(current){

let html='<option value="">Unassigned</option>';

partners.forEach(p=>{
html+=
'<option value="'+p.id+'" '+
(String(current)===String(p.id)?"selected":"")+
'>'+esc(p.name)+'</option>';
});

return html;
}

function render(){

const q=$("search").value.toLowerCase().trim();
const sf=$("statusFilter").value;
const pf=$("partnerFilter").value;

const rows=shipments.filter(s=>{

const text=[
s.id,
s.customer_name,
s.phone_number,
s.pickup_location,
s.delivery_location,
s.material_goods,
s.weight,
s.truck_type,
s.partner
].join(" ").toLowerCase();

return (!q||text.includes(q)) &&
(!sf||s.status===sf) &&
(!pf||String(s.partner_id)===String(pf));

});

const body=$("body");

body.innerHTML="";

rows.forEach(s=>{

const tr=document.createElement("tr");

const partner=partnerName(s.partner_id,s.partner);

tr.innerHTML=`

<td><b>#${esc(s.id)}</b></td>

<td>
<b>${esc(s.customer_name)}</b><br>
${esc(s.phone_number)}
</td>

<td>
${esc(s.pickup_location)}
<br>↓<br>
${esc(s.delivery_location)}
</td>

<td>${esc(s.material_goods)}</td>

<td>${esc(s.weight)}</td>

<td>${esc(s.truck_type)}</td>

<td>
<span class="badge ${esc(s.status)}">
${esc(statusText(s.status))}
</span>
</td>

<td>${esc(partner)}</td>

<td>
<div class="actions">

<select id="status-${s.id}">
${statusOptions(s.status)}
</select>

<select id="partner-${s.id}">
${partnerOptions(s.partner_id)}
</select>

<button onclick="updateShipment(${s.id})">
Update Shipment
</button>

</div>
</td>

`;

body.appendChild(tr);

});

}

async function updateShipment(id){

const status=$("status-"+id).value;
const partnerId=$("partner-"+id).value;

const pid=partnerId===""?null:Number(partnerId);

const partner=pid===null
?null
:partners.find(p=>Number(p.id)===pid);

let finalStatus=status;

if(pid!==null && status==="new"){
finalStatus="assigned";
}

const result=await supabaseClient
.from("shipment_requests")
.update({
status:finalStatus,
partner_id:pid,
partner:partner?partner.name:"unassigned"
})
.eq("id",id);

if(result.error){

message("Update failed: "+result.error.message,"error");
return;

}

message("Shipment #"+id+" updated successfully.","success");

await loadAll();

}

async function loadAll(){

$("loading").style.display="block";
$("table").style.display="none";

try{

await loadPartners();
await loadShipments();

updateStats();
render();

$("loading").style.display="none";
$("table").style.display="table";

}catch(error){

console.error(error);

$("loading").textContent=
"Could not load dashboard.";

message(error.message,"error");

}

}

$("search").addEventListener("input",render);

$("statusFilter").addEventListener("change",render);

$("partnerFilter").addEventListener("change",render);

loadAll();

setInterval(loadAll,30000);

</script>

</body>
</html>
