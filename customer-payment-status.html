<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
    <title>Payment Status</title>

      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

        <style>
            body {
                  font-family: Arial, sans-serif;
                        padding: 30px;
                              max-width: 500px;
                                    margin: auto;
                                        }

                                            input, button {
                                                  width: 100%;
                                                        padding: 12px;
                                                              margin-top: 10px;
                                                                    box-sizing: border-box;
                                                                        }

                                                                            #result {
                                                                                  margin-top: 20px;
                                                                                        line-height: 1.8;
                                                                                            }
                                                                                              </style>
                                                                                              </head>

                                                                                              <body>

                                                                                                <h2>Payment Status</h2>

                                                                                                  <input
                                                                                                      type="text"
                                                                                                          id="tracking"
                                                                                                              placeholder="Enter Tracking Number"
                                                                                                                >

                                                                                                                  <button onclick="checkPayment()">
                                                                                                                      Check Payment
                                                                                                                        </button>

                                                                                                                          <div id="result"></div>

                                                                                                                            <script>

                                                                                                                                const SUPABASE_URL =
                                                                                                                                      "https://ebltviniygljwwseplph.supabase.co";

                                                                                                                                          const SUPABASE_PUBLISHABLE_KEY =
                                                                                                                                                "sb_publishable_8xzZUeubYp_nIxVRWEQdiw_2H4RkHAa";

                                                                                                                                                    const supabaseClient =
                                                                                                                                                          supabase.createClient(
                                                                                                                                                                  SUPABASE_URL,
                                                                                                                                                                          SUPABASE_PUBLISHABLE_KEY
                                                                                                                                                                                );


                                                                                                                                                                                    async function checkPayment() {

                                                                                                                                                                                          const result =
                                                                                                                                                                                                  document.getElementById("result");

                                                                                                                                                                                                        const tracking =
                                                                                                                                                                                                                document.getElementById("tracking").value.trim();


                                                                                                                                                                                                                      if (!tracking) {
                                                                                                                                                                                                                              result.innerText =
                                                                                                                                                                                                                                        "Please enter tracking number.";
                                                                                                                                                                                                                                                return;
                                                                                                                                                                                                                                                      }


                                                                                                                                                                                                                                                            const { data: userData, error: userError } =
                                                                                                                                                                                                                                                                    await supabaseClient.auth.getUser();


                                                                                                                                                                                                                                                                          if (userError || !userData.user) {
                                                                                                                                                                                                                                                                                  result.innerText =
                                                                                                                                                                                                                                                                                            "Please login first.";
                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                          }


                                                                                                                                                                                                                                                                                                                const { data: shipment, error: shipmentError } =
                                                                                                                                                                                                                                                                                                                        await supabaseClient
                                                                                                                                                                                                                                                                                                                                  .from("shipment_requests")
                                                                                                                                                                                                                                                                                                                                            .select("id, tracking_number, quoted_price, quote_status")
                                                                                                                                                                                                                                                                                                                                                      .eq("tracking_number", tracking)
                                                                                                                                                                                                                                                                                                                                                                .eq("customer_id", userData.user.id)
                                                                                                                                                                                                                                                                                                                                                                          .single();


                                                                                                                                                                                                                                                                                                                                                                                if (shipmentError || !shipment) {
                                                                                                                                                                                                                                                                                                                                                                                        result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                  "Shipment not found.";
                                                                                                                                                                                                                                                                                                                                                                                                          return;
                                                                                                                                                                                                                                                                                                                                                                                                                }


                                                                                                                                                                                                                                                                                                                                                                                                                      const { data: payment, error: paymentError } =
                                                                                                                                                                                                                                                                                                                                                                                                                              await supabaseClient
                                                                                                                                                                                                                                                                                                                                                                                                                                        .from("payments")
                                                                                                                                                                                                                                                                                                                                                                                                                                                  .select("amount, status, payment_method, transaction_id, paid_at")
                                                                                                                                                                                                                                                                                                                                                                                                                                                            .eq("shipment_id", shipment.id)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      .eq("customer_id", userData.user.id)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                .order("created_at", { ascending: false })
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          .limit(1)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .maybeSingle();


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if (paymentError) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            "Payment information unavailable.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!payment) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        result.innerHTML = `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <hr>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <p><strong>Tracking Number:</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      ${shipment.tracking_number}</p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <p><strong>Quotation:</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          ${
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      shipment.quoted_price
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ? "₹" + shipment.quoted_price
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  : "Not available"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }</p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <p><strong>Payment Status:</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                Payment not started
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  `;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      result.innerHTML = `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <hr>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <p><strong>Tracking Number:</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              ${shipment.tracking_number}</p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <p><strong>Amount:</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              ₹${payment.amount}</p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <p><strong>Payment Status:</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              ${payment.status}</p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <p><strong>Payment Method:</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              ${payment.payment_method || "Razorpay"}</p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <p><strong>Transaction ID:</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              ${payment.transaction_id || "Not available"}</p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <p><strong>Paid At:</strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              ${payment.paid_at || "Not paid yet"}</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    `;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </html>
