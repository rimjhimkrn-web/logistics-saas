<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <title>KRIM Logistics - Partner Performance</title>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
          <script src="config.js"></script>

            <style>
                body {
                      font-family: Arial, sans-serif;
                            background: #f4f6f8;
                                  padding: 20px;
                                        margin: 0;
                                            }

                                                .box {
                                                      max-width: 900px;
                                                            margin: auto;
                                                                  background: white;
                                                                        padding: 20px;
                                                                              border-radius: 10px;
                                                                                  }

                                                                                      h2 {
                                                                                            margin-top: 0;
                                                                                                }

                                                                                                    button {
                                                                                                          padding: 10px 15px;
                                                                                                                border: 0;
                                                                                                                      border-radius: 6px;
                                                                                                                            background: #2563eb;
                                                                                                                                  color: white;
                                                                                                                                        font-weight: bold;
                                                                                                                                              cursor: pointer;
                                                                                                                                                  }

                                                                                                                                                      .card {
                                                                                                                                                            border: 1px solid #ddd;
                                                                                                                                                                  border-radius: 8px;
                                                                                                                                                                        padding: 15px;
                                                                                                                                                                              margin-top: 15px;
                                                                                                                                                                                  }

                                                                                                                                                                                      .stars {
                                                                                                                                                                                            font-size: 24px;
                                                                                                                                                                                                }

                                                                                                                                                                                                    .muted {
                                                                                                                                                                                                          color: #666;
                                                                                                                                                                                                              }

                                                                                                                                                                                                                  .error {
                                                                                                                                                                                                                        color: red;
                                                                                                                                                                                                                              font-weight: bold;
                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                      .success {
                                                                                                                                                                                                                                            color: green;
                                                                                                                                                                                                                                                  font-weight: bold;
                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                        </style>
                                                                                                                                                                                                                                                        </head>

                                                                                                                                                                                                                                                        <body>

                                                                                                                                                                                                                                                        <div class="box">

                                                                                                                                                                                                                                                          <h2>KRIM Logistics</h2>
                                                                                                                                                                                                                                                            <h3>Partner Performance</h3>

                                                                                                                                                                                                                                                              <button onclick="loadPerformance()">
                                                                                                                                                                                                                                                                  Refresh
                                                                                                                                                                                                                                                                    </button>

                                                                                                                                                                                                                                                                      <div id="message"></div>
                                                                                                                                                                                                                                                                        <div id="list"></div>

                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                        <script>

                                                                                                                                                                                                                                                                        const db = supabase.createClient(
                                                                                                                                                                                                                                                                          SUPABASE_URL,
                                                                                                                                                                                                                                                                            SUPABASE_PUBLISHABLE_KEY
                                                                                                                                                                                                                                                                            );

                                                                                                                                                                                                                                                                            async function loadPerformance() {

                                                                                                                                                                                                                                                                              const message =
                                                                                                                                                                                                                                                                                  document.getElementById("message");

                                                                                                                                                                                                                                                                                    const list =
                                                                                                                                                                                                                                                                                        document.getElementById("list");

                                                                                                                                                                                                                                                                                          message.innerHTML = "Loading...";
                                                                                                                                                                                                                                                                                            list.innerHTML = "";

                                                                                                                                                                                                                                                                                              /* Check login */

                                                                                                                                                                                                                                                                                                const { data: userData, error: userError } =
                                                                                                                                                                                                                                                                                                    await db.auth.getUser();

                                                                                                                                                                                                                                                                                                      if (userError || !userData.user) {
                                                                                                                                                                                                                                                                                                          message.innerHTML =
                                                                                                                                                                                                                                                                                                                '<p class="error">Please login first.</p>';
                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                        /* Check admin */

                                                                                                                                                                                                                                                                                                                          const { data: admin, error: adminError } =
                                                                                                                                                                                                                                                                                                                              await db
                                                                                                                                                                                                                                                                                                                                    .from("admin_users")
                                                                                                                                                                                                                                                                                                                                          .select("user_id")
                                                                                                                                                                                                                                                                                                                                                .eq("user_id", userData.user.id)
                                                                                                                                                                                                                                                                                                                                                      .maybeSingle();

                                                                                                                                                                                                                                                                                                                                                        if (adminError || !admin) {
                                                                                                                                                                                                                                                                                                                                                            message.innerHTML =
                                                                                                                                                                                                                                                                                                                                                                  '<p class="error">Access denied. Admin only.</p>';
                                                                                                                                                                                                                                                                                                                                                                      return;
                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                          /* Load performance */

                                                                                                                                                                                                                                                                                                                                                                            const { data, error } =
                                                                                                                                                                                                                                                                                                                                                                                await db
                                                                                                                                                                                                                                                                                                                                                                                      .from("partner_rating_summary")
                                                                                                                                                                                                                                                                                                                                                                                            .select("*")
                                                                                                                                                                                                                                                                                                                                                                                                  .order("average_rating", {
                                                                                                                                                                                                                                                                                                                                                                                                          ascending: false,
                                                                                                                                                                                                                                                                                                                                                                                                                  nullsFirst: false
                                                                                                                                                                                                                                                                                                                                                                                                                        });

                                                                                                                                                                                                                                                                                                                                                                                                                          if (error) {
                                                                                                                                                                                                                                                                                                                                                                                                                              message.innerHTML =
                                                                                                                                                                                                                                                                                                                                                                                                                                    '<p class="error">Error: ' +
                                                                                                                                                                                                                                                                                                                                                                                                                                          error.message +
                                                                                                                                                                                                                                                                                                                                                                                                                                                '</p>';
                                                                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (!data || data.length === 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                            message.innerHTML =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  '<p>No partner performance data found.</p>';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                          message.innerHTML =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              '<p class="success">Partner performance loaded successfully.</p>';

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                data.forEach(function(item) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const average =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          item.average_rating === null
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  ? "No ratings"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          : Number(item.average_rating).toFixed(2) + " / 5";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              let stars = "";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if (item.average_rating !== null) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const rounded =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                Math.round(Number(item.average_rating));

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      for (let i = 1; i <= 5; i++) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              stars += i <= rounded ? "★" : "☆";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              stars = "☆☆☆☆☆";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const card =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.createElement("div");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                card.className = "card";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    card.innerHTML = `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <h3>${item.partner_name || "Unnamed Partner"}</h3>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="stars">${stars}</div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <b>Average Rating:</b>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      ${average}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <b>Total Ratings:</b>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  ${item.total_ratings || 0}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <p class="muted">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      Partner ID: ${item.partner_id}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                `;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    list.appendChild(card);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      loadPerformance();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </html>
