<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <title>Reset Password - KRIM Logistics</title>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
          <script src="config.js"></script>

            <style>
                * {
                      box-sizing: border-box;
                          }

                              body {
                                    margin: 0;
                                          font-family: Arial, sans-serif;
                                                background: #f5f7fa;
                                                      min-height: 100vh;
                                                            display: flex;
                                                                  align-items: center;
                                                                        justify-content: center;
                                                                              padding: 20px;
                                                                                  }

                                                                                      .box {
                                                                                            width: 100%;
                                                                                                  max-width: 420px;
                                                                                                        background: white;
                                                                                                              padding: 30px 24px;
                                                                                                                    border-radius: 14px;
                                                                                                                          box-shadow: 0 5px 25px rgba(0,0,0,0.08);
                                                                                                                              }

                                                                                                                                  h1 {
                                                                                                                                        margin: 0 0 10px;
                                                                                                                                              text-align: center;
                                                                                                                                                    font-size: 26px;
                                                                                                                                                        }

                                                                                                                                                            .subtitle {
                                                                                                                                                                  text-align: center;
                                                                                                                                                                        color: #666;
                                                                                                                                                                              margin-bottom: 25px;
                                                                                                                                                                                  }

                                                                                                                                                                                      label {
                                                                                                                                                                                            display: block;
                                                                                                                                                                                                  margin-bottom: 7px;
                                                                                                                                                                                                        font-weight: bold;
                                                                                                                                                                                                            }

                                                                                                                                                                                                                input {
                                                                                                                                                                                                                      width: 100%;
                                                                                                                                                                                                                            padding: 13px;
                                                                                                                                                                                                                                  margin-bottom: 16px;
                                                                                                                                                                                                                                        border: 1px solid #ccc;
                                                                                                                                                                                                                                              border-radius: 8px;
                                                                                                                                                                                                                                                    font-size: 16px;
                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                            button {
                                                                                                                                                                                                                                                                  width: 100%;
                                                                                                                                                                                                                                                                        padding: 14px;
                                                                                                                                                                                                                                                                              border: none;
                                                                                                                                                                                                                                                                                    border-radius: 8px;
                                                                                                                                                                                                                                                                                          background: #111827;
                                                                                                                                                                                                                                                                                                color: white;
                                                                                                                                                                                                                                                                                                      font-size: 16px;
                                                                                                                                                                                                                                                                                                            font-weight: bold;
                                                                                                                                                                                                                                                                                                                  cursor: pointer;
                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                          button:disabled {
                                                                                                                                                                                                                                                                                                                                opacity: 0.6;
                                                                                                                                                                                                                                                                                                                                      cursor: not-allowed;
                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                              #message {
                                                                                                                                                                                                                                                                                                                                                    margin-top: 16px;
                                                                                                                                                                                                                                                                                                                                                          padding: 12px;
                                                                                                                                                                                                                                                                                                                                                                border-radius: 8px;
                                                                                                                                                                                                                                                                                                                                                                      display: none;
                                                                                                                                                                                                                                                                                                                                                                            text-align: center;
                                                                                                                                                                                                                                                                                                                                                                                  font-size: 14px;
                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                          .success {
                                                                                                                                                                                                                                                                                                                                                                                                background: #ecfdf5;
                                                                                                                                                                                                                                                                                                                                                                                                      color: #047857;
                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                              .error {
                                                                                                                                                                                                                                                                                                                                                                                                                    background: #fef2f2;
                                                                                                                                                                                                                                                                                                                                                                                                                          color: #b91c1c;
                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                  .back {
                                                                                                                                                                                                                                                                                                                                                                                                                                        display: block;
                                                                                                                                                                                                                                                                                                                                                                                                                                              text-align: center;
                                                                                                                                                                                                                                                                                                                                                                                                                                                    margin-top: 20px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                          color: #2563eb;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                text-decoration: none;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </head>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="box">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <h1>KRIM Logistics</h1>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="subtitle">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      Create your new password
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <form id="resetForm">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <label for="password">New Password</label>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <input
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  type="password"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          id="password"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  placeholder="Enter new password"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          minlength="8"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  required
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        >

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <label for="confirmPassword">Confirm Password</label>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <input
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            type="password"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    id="confirmPassword"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            placeholder="Confirm new password"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    minlength="8"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            required
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  >

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button type="submit" id="resetButton">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                Update Password
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </form>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div id="message"></div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <a class="back" href="customer-login.html">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ← Back to Customer Login
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </a>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let client;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        try {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if (typeof supabaseClient !== "undefined") {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      client = supabaseClient;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    client = window.supabase.createClient(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              SUPABASE_URL,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        SUPABASE_PUBLISHABLE_KEY
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                );
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          } catch (error) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                console.error(error);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const form = document.getElementById("resetForm");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const button = document.getElementById("resetButton");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const message = document.getElementById("message");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function showMessage(text, type) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          message.textContent = text;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                message.className = type;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      message.style.display = "block";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              form.addEventListener("submit", async function(event) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    event.preventDefault();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const password =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  document.getElementById("password").value;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const confirmPassword =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById("confirmPassword").value;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if (password.length < 8) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              showMessage(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        "Password must be at least 8 characters.",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  "error"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          );
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if (password !== confirmPassword) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      showMessage(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "Passwords do not match.",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          "error"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  );
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if (!client) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              showMessage(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        "System configuration error. Please try again.",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  "error"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          );
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
