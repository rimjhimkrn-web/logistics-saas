<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <title>KRIM Logistics - Set New Password</title>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
          <script src="config.js"></script>

            <style>
                * {
                      box-sizing: border-box;
                          }

                              body {
                                    margin: 0;
                                          min-height: 100vh;
                                                font-family: Arial, sans-serif;
                                                      background: #f4f7fb;
                                                            display: flex;
                                                                  align-items: center;
                                                                        justify-content: center;
                                                                              padding: 20px;
                                                                                  }

                                                                                      .box {
                                                                                            width: 100%;
                                                                                                  max-width: 420px;
                                                                                                        background: white;
                                                                                                              padding: 30px 24px;
                                                                                                                    border-radius: 18px;
                                                                                                                          box-shadow: 0 8px 30px rgba(0,0,0,0.10);
                                                                                                                              }

                                                                                                                                  h1 {
                                                                                                                                        text-align: center;
                                                                                                                                              margin-bottom: 8px;
                                                                                                                                                  }

                                                                                                                                                      .subtitle {
                                                                                                                                                            text-align: center;
                                                                                                                                                                  color: #666;
                                                                                                                                                                        margin-bottom: 25px;
                                                                                                                                                                            }

                                                                                                                                                                                label {
                                                                                                                                                                                      display: block;
                                                                                                                                                                                            font-weight: bold;
                                                                                                                                                                                                  margin-top: 15px;
                                                                                                                                                                                                        margin-bottom: 8px;
                                                                                                                                                                                                            }

                                                                                                                                                                                                                input {
                                                                                                                                                                                                                      width: 100%;
                                                                                                                                                                                                                            padding: 14px;
                                                                                                                                                                                                                                  border: 1px solid #ccc;
                                                                                                                                                                                                                                        border-radius: 10px;
                                                                                                                                                                                                                                              font-size: 16px;
                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                      button {
                                                                                                                                                                                                                                                            width: 100%;
                                                                                                                                                                                                                                                                  margin-top: 22px;
                                                                                                                                                                                                                                                                        padding: 14px;
                                                                                                                                                                                                                                                                              border: none;
                                                                                                                                                                                                                                                                                    border-radius: 10px;
                                                                                                                                                                                                                                                                                          background: #111827;
                                                                                                                                                                                                                                                                                                color: white;
                                                                                                                                                                                                                                                                                                      font-size: 16px;
                                                                                                                                                                                                                                                                                                            font-weight: bold;
                                                                                                                                                                                                                                                                                                                  cursor: pointer;
                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                          button:disabled {
                                                                                                                                                                                                                                                                                                                                opacity: 0.6;
                                                                                                                                                                                                                                                                                                                                      cursor: not-allowed;
                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                              #message {
                                                                                                                                                                                                                                                                                                                                                    display: none;
                                                                                                                                                                                                                                                                                                                                                          margin-top: 15px;
                                                                                                                                                                                                                                                                                                                                                                padding: 12px;
                                                                                                                                                                                                                                                                                                                                                                      border-radius: 10px;
                                                                                                                                                                                                                                                                                                                                                                            text-align: center;
                                                                                                                                                                                                                                                                                                                                                                                  font-size: 14px;
                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                          .success {
                                                                                                                                                                                                                                                                                                                                                                                                display: block !important;
                                                                                                                                                                                                                                                                                                                                                                                                      background: #dcfce7;
                                                                                                                                                                                                                                                                                                                                                                                                            color: #166534;
                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                    .error {
                                                                                                                                                                                                                                                                                                                                                                                                                          display: block !important;
                                                                                                                                                                                                                                                                                                                                                                                                                                background: #fee2e2;
                                                                                                                                                                                                                                                                                                                                                                                                                                      color: #991b1b;
                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                              .links {
                                                                                                                                                                                                                                                                                                                                                                                                                                                    text-align: center;
                                                                                                                                                                                                                                                                                                                                                                                                                                                          margin-top: 20px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                  .links a {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        display: block;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              margin-top: 10px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    color: #2563eb;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          text-decoration: none;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </head>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="box">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <h1>KRIM Logistics</h1>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="subtitle">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        Set New Password
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <form id="passwordForm">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <label for="password">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      New Password
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </label>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <input
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    type="password"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          id="password"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                placeholder="Enter new password"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      minlength="6"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            required
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  autocomplete="new-password"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      >

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <label for="confirmPassword">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                Confirm New Password
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </label>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <input
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              type="password"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    id="confirmPassword"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          placeholder="Confirm new password"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                minlength="6"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      required
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            autocomplete="new-password"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                >

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button type="submit" id="button">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          Update Password
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </form>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div id="message"></div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="links">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <a href="admin-login.html">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              Back to Admin Login
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </a>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <a href="partner-login.html">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            Partner Login
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </a>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <a href="index.html">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          Back to KRIM Logistics
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </a>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const form = document.getElementById("passwordForm");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const button = document.getElementById("button");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const message = document.getElementById("message");


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                function showMessage(text, type) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  message.textContent = text;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    message.className = type;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    form.addEventListener("submit", async function(event) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      event.preventDefault();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        button.disabled = true;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          button.textContent = "Updating...";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            message.className = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              message.textContent = "";


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                try {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (typeof supabaseClient === "undefined") {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          throw new Error(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  "Supabase client not found. Check config.js."
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const password =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      document.getElementById("password").value;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const confirmPassword =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById("confirmPassword").value;


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (password.length < 6) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          throw new Error(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  "Password must be at least 6 characters."
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (password !== confirmPassword) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      throw new Error(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              "Passwords do not match."
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const { error } =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  await supabaseClient.auth.updateUser({

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          password: password

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                });
