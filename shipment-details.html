<!DOCTYPE html>
<html>
<head>
    <title>Shipment Details</title>
    </head>
    <body>

        <h1>Shipment Details</h1>

            <p>
                    Tracking Number: <strong id="trackingDisplay"></strong>
                        </p>

                            <div id="result">
                                    Loading...
                                        </div>

                                            <br>
                                                <a href="tracking.html">← Back to Tracking</a>

                                                    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
                                                        </script>
                                                            <script>
                                                                    // ========================================
                                                                            // YOUR SUPABASE CREDENTIALS
                                                                                    // ========================================
                                                                                            const SUPABASE_URL = 'https://ebltviniygljwwseplph.supabase.co';
                                                                                                    const SUPABASE_ANON_KEY = 'sb_publishable_8xzZUeubYp_nIxVRWEQdiw_2H4RkHAa';
                                                                                                            // ========================================

                                                                                                                    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

                                                                                                                            // Get tracking number from URL
                                                                                                                                    const urlParams = new URLSearchParams(window.location.search);
                                                                                                                                            const trackingNumber = urlParams.get('tracking');

                                                                                                                                                    // Show tracking number on page
                                                                                                                                                            document.getElementById('trackingDisplay').textContent = trackingNumber || 'Not provided';

                                                                                                                                                                    async function getShipment() {
                                                                                                                                                                                const resultDiv = document.getElementById('result');

                                                                                                                                                                                            if (!trackingNumber) {
                                                                                                                                                                                                            resultDiv.innerHTML = '❌ No tracking number provided.';
                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                    try {
                                                                                                                                                                                                                                                                    const { data, error } = await supabase
                                                                                                                                                                                                                                                                                        .from('shipment_requests')
                                                                                                                                                                                                                                                                                                            .select('*')
                                                                                                                                                                                                                                                                                                                                .eq('tracking_number', trackingNumber)
                                                                                                                                                                                                                                                                                                                                                    .single();

                                                                                                                                                                                                                                                                                                                                                                    if (error) {
                                                                                                                                                                                                                                                                                                                                                                                        resultDiv.innerHTML = '❌ Error: ' + error.message;
                                                                                                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                            if (!data) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                resultDiv.innerHTML = '❌ Shipment not found: ' + trackingNumber;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // Show all data as text
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    resultDiv.innerHTML = `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <h2>Shipment Found!</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <p><strong>Tracking:</strong> ${data.tracking_number}</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <p><strong>Status:</strong> ${data.status}</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <p><strong>Pickup:</strong> ${data.pickup_location}</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <p><strong>Delivery:</strong> ${data.delivery_location}</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <p><strong>Material:</strong> ${data.material || data.material_goods}</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <p><strong>Created:</strong> ${data.created_at}</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                `;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            } catch (err) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            resultDiv.innerHTML = '❌ Error: ' + err.message;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        // Run it
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                getShipment();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
