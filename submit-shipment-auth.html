<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Submit Shipment</title>
            </head>
            <body>

                <h1>Request a Shipment</h1>

                    <div id="userInfo"></div>

                        <form id="shipmentForm">
                                <p>
                                            <label>Pickup Location:</label><br>
                                                        <input type="text" id="pickup_location" placeholder="Rourkela" required>
                                                                </p>

                                                                        <p>
                                                                                    <label>Delivery Location:</label><br>
                                                                                                <input type="text" id="delivery_location" placeholder="Banaras" required>
                                                                                                        </p>

                                                                                                                <p>
                                                                                                                            <label>Material / Goods:</label><br>
                                                                                                                                        <input type="text" id="material_goods" placeholder="Electronics" required>
                                                                                                                                                </p>

                                                                                                                                                        <p>
                                                                                                                                                                    <label>Weight:</label><br>
                                                                                                                                                                                <input type="text" id="weight" placeholder="10 tonnes">
                                                                                                                                                                                        </p>

                                                                                                                                                                                                <p>
                                                                                                                                                                                                            <label>Truck Type:</label><br>
                                                                                                                                                                                                                        <input type="text" id="truck_type" placeholder="32 ft">
                                                                                                                                                                                                                                </p>

                                                                                                                                                                                                                                        <button type="submit">Submit Shipment</button>
                                                                                                                                                                                                                                            </form>

                                                                                                                                                                                                                                                <div id="message"></div>

                                                                                                                                                                                                                                                    <br>
                                                                                                                                                                                                                                                        <a href="customer-dashboard.html">← Back to Dashboard</a>
                                                                                                                                                                                                                                                            <br>
                                                                                                                                                                                                                                                                <a href="index.html">Back to Home</a>

                                                                                                                                                                                                                                                                    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
                                                                                                                                                                                                                                                                        </script>
                                                                                                                                                                                                                                                                            <script>
                                                                                                                                                                                                                                                                                    const supabase = window.supabase.createClient(
                                                                                                                                                                                                                                                                                                'https://ebltviniygljwwseplph.supabase.co',
                                                                                                                                                                                                                                                                                                            'sb_publishable_8xzZUeubYp_nIxVRWEQdiw_2H4RkHAa'
                                                                                                                                                                                                                                                                                                                    );

                                                                                                                                                                                                                                                                                                                            const form = document.getElementById('shipmentForm');
                                                                                                                                                                                                                                                                                                                                    const message = document.getElementById('message');

                                                                                                                                                                                                                                                                                                                                            async function checkUser() {
                                                                                                                                                                                                                                                                                                                                                        const { data: { user }, error } = await supabase.auth.getUser();

                                                                                                                                                                                                                                                                                                                                                                    if (error || !user) {
                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById('userInfo').innerHTML = `
                                                                                                                                                                                                                                                                                                                                                                                                        <p style="color:red;">⚠️ Please login first.</p>
                                                                                                                                                                                                                                                                                                                                                                                                                            <a href="customer-login.html">Login</a>
                                                                                                                                                                                                                                                                                                                                                                                                                                            `;
                                                                                                                                                                                                                                                                                                                                                                                                                                                            form.style.display = 'none';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById('userInfo').innerHTML = `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <p>Logged in as: <strong>${user.email}</strong></p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <hr>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                `;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            form.style.display = 'block';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            form.addEventListener('submit', async function(e) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        e.preventDefault();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const { data: { user }, error: userError } = await supabase.auth.getUser();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (userError || !user) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                message.innerHTML = '⚠️ Please login first';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const pickup = document.getElementById('pickup_location').value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const delivery = document.getElementById('delivery_location').value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const material = document.getElementById('material_goods').value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const weight = document.getElementById('weight').value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const truck = document.getElementById('truck_type').value.trim();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (!pickup || !delivery || !material) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    message.innerHTML = '⚠️ Please fill in Pickup, Delivery, and Material';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            message.innerHTML = '⏳ Submitting...';

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const { data, error } = await supabase
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        .from('shipment_requests')
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        .insert([{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            pickup_location: pickup,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                delivery_location: delivery,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    material_goods: material,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        weight: weight || null,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            truck_type: truck || null,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                customer_email: user.email,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    status: 'new'
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }])
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .select();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (error) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                message.innerHTML = '❌ Error: ' + error.message;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        message.innerHTML = '✅ Success! Tracking: ' + data[0].tracking_number;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    form.reset();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    checkUser();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
