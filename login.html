<!DOCTYPE html>
<html>
    <head>
            <title>KRIM Logistics - Login</title>

                <meta name="viewport" content="width=device-width, initial-scale=1">

                    <style>
                                body {
                                                margin: 0;
                                                            font-family: Arial, sans-serif;
                                                                        background: #f4f6f8;
                                }

                                        .header {
                                                        background: #172033;
                                                                    color: white;
                                                                                padding: 20px;
                                                                                            text-align: center;
                                        }

                                                .login-box {
                                                                width: 90%;
                                                                            max-width: 400px;
                                                                                        margin: 60px auto;
                                                                                                    background: white;
                                                                                                                padding: 25px;
                                                                                                                            border: 1px solid #ddd;
                                                                                                                                        border-radius: 8px;
                                                                                                                                                    box-sizing: border-box;
                                                }

                                                        h2 {
                                                                        margin-top: 0;
                                                        }

                                                                label {
                                                                                display: block;
                                                                                            margin-top: 15px;
                                                                                                        margin-bottom: 5px;
                                                                                                                    font-weight: bold;
                                                                }

                                                                        input {
                                                                                        width: 100%;
                                                                                                    padding: 12px;
                                                                                                                box-sizing: border-box;
                                                                                                                            border: 1px solid #ccc;
                                                                                                                                        border-radius: 5px;
                                                                        }

                                                                                button {
                                                                                                width: 100%;
                                                                                                            margin-top: 20px;
                                                                                                                        padding: 12px;
                                                                                                                                    background: #155eef;
                                                                                                                                                color: white;
                                                                                                                                                            border: none;
                                                                                                                                                                        border-radius: 5px;
                                                                                                                                                                                    cursor: pointer;
                                                                                                                                                                                                font-weight: bold;
                                                                                }

                                                                                        button:hover {
                                                                                                        background: #0d47c7;
                                                                                        }

                                                                                                #message {
                                                                                                                margin-top: 15px;
                                                                                                                            text-align: center;
                                                                                                }
                                                                                            </style>
                                                                                        </head>

                                                                                        <body>

                                                                                            <div class="header">
                                                                                                    <h1>KRIM Logistics</h1>
                                                                                                        <p>Global Logistics Operating System</p>
                                                                                            </div>

                                                                                            <div class="login-box">

                                                                                                    <h2>Sign In</h2>

                                                                                                        <label>Email</label>
                                                                                                            <input
                                                                                                                    type="email"
                                                                                                                            id="email"
                                                                                                                                    placeholder="Enter your email"
                                                                                                                                        >

                                                                                                                                            <label>Password</label>
                                                                                                                                                <input
                                                                                                                                                        type="password"
                                                                                                                                                                id="password"
                                                                                                                                                                        placeholder="Enter your password"
                                                                                                                                                                            >

                                                                                                                                                                                <button onclick="login()">
                                                                                                                                                                                            Sign In
                                                                                                                                                                                </button>

                                                                                                                                                                                    <div id="message"></div>

                                                                                                                                                                            </div>

                                                                                                                                                                            <script>

                                                                                                                                                                                async function login() {

                                                                                                                                                                                        const email =
                                                                                                                                                                                                document.getElementById("email").value;

                                                                                                                                                                                                    const password =
                                                                                                                                                                                                            document.getElementById("password").value;

                                                                                                                                                                                                                const message =
                                                                                                                                                                                                                        document.getElementById("message");

                                                                                                                                                                                                                            if (!email || !password) {

                                                                                                                                                                                                                                        message.innerHTML =
                                                                                                                                                                                                                                                    "Please enter email and password.";

                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                message.innerHTML = "Signing in...";

                                                                                                                                                                                                                                    try {

                                                                                                                                                                                                                                                const response = await fetch(
                                                                                                                                                                                                                                                                "https://ebltviniygljwwseplph.supabase.co/auth/v1/token?grant_type=password",
                                                                                                                                                                                                                                                                            {
                                                                                                                                                                                                                                                                                                method: "POST",

                                                                                                                                                                                                                                                                                                                headers: {
                                                                                                                                                                                                                                                                                                                                        "apikey":
                                                                                                                                                                                                                                                                                                                                                            "sb_publishable_8xzZUeubYp_nIxVRWEQdiw_2H4RkHAa",

                                                                                                                                                                                                                                                                                                                                                                                "Content-Type":
                                                                                                                                                                                                                                                                                                                                                                                                    "application/json"
                                                                                                                                                                                                                                                                                                                },

                                                                                                                                                                                                                                                                                                                                body: JSON.stringify({
                                                                                                                                                                                                                                                                                                                                                        email: email,
                                                                                                                                                                                                                                                                                                                                                                            password: password
                                                                                                                                                                                                                                                                                                                                })
                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                );

                                                                                                                                                                                                                                                        const data = await response.json();

                                                                                                                                                                                                                                                                if (!response.ok) {

                                                                                                                                                                                                                                                                                message.innerHTML =
                                                                                                                                                                                                                                                                                                data.error_description ||
                                                                                                                                                                                                                                                                                                                "Login failed.";

                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                        message.innerHTML =
                                                                                                                                                                                                                                                                                    "Login successful.";

                                                                                                                                                                                                                                                                                            console.log(data);

                                                                                                                                                                                                                                                            } catch (error) {

                                                                                                                                                                                                                                                                        message.innerHTML =
                                                                                                                                                                                                                                                                                    "Connection error. Please try again.";

                                                                                                                                                                                                                                                                                            console.log(error);
                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                    </script>

                                                                                                                                                                                                                                                </body>
                                                                                                                                                                                                                                                </html>
