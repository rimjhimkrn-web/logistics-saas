<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:#172033;font:13px Arial,sans-serif}
a{text-decoration:none;color:inherit}
button,input,select{font:inherit}

:root{
--b:#0b5cff;--bd:#dfe5ee;--muted:#728096;
--w:#fff;--dark:#10233f;--g:#15945b;
--o:#d98212;--r:#d9363e
}

.header{
height:64px;position:fixed;inset:0 0 auto;background:#fff;
border-bottom:1px solid var(--bd);display:flex;align-items:center;
gap:12px;padding:0 18px;z-index:20
}

.logo{
width:34px;height:34px;border-radius:7px;background:var(--b);
color:#fff;display:grid;place-items:center;font-weight:900
}

.brand{display:flex;align-items:center;gap:9px;min-width:195px}
.brand b{font-size:17px}
.brand small{display:block;font-size:7px;color:#8490a2;letter-spacing:.05em}

.search{width:380px}
.search input{
width:100%;height:36px;border:1px solid var(--bd);
border-radius:7px;padding:0 12px;background:#f8fafc
}

.spacer{flex:1}
.top{display:flex;gap:7px}
.top button,.account,.menu{
height:36px;border:1px solid var(--bd);background:#fff;
border-radius:7px;cursor:pointer
}
.top button{width:36px}

.account{
padding:3px 9px 3px 4px;display:flex;align-items:center;
gap:7px;font-size:10px
}

.avatar{
width:28px;height:28px;border-radius:50%;background:#eaf1ff;
color:var(--b);display:grid;place-items:center;font-weight:bold
}

.menu{display:none;width:36px}

.side{
position:fixed;top:64px;bottom:0;left:0;width:220px;
background:#fff;border-right:1px solid var(--bd);
padding:15px 10px;overflow:auto;z-index:15
}

.st{
font-size:8px;color:var(--b);font-weight:bold;
margin:14px 9px 6px;text-transform:uppercase
}

.nav{
height:34px;padding:0 9px;border-radius:7px;display:flex;
align-items:center;gap:9px;color:#526077;font-size:10px
}

.nav:hover,.nav.active{background:#eaf1ff;color:var(--b)}
.nav span{margin-left:auto}

.main{margin-left:220px;padding-top:64px}
.wrap{max-width:1500px;margin:auto;padding:22px}

.crumb{font-size:8px;color:#8b96a7;margin-bottom:7px}

.hero{
display:flex;justify-content:space-between;gap:20px;align-items:end
}

.hero h1{margin:0;font-size:30px;letter-spacing:-1px}
.hero p{
margin:7px 0;color:var(--muted);font-size:11px;
line-height:1.5;max-width:760px
}

.actions{display:flex;gap:7px}
.btn{
padding:10px 13px;border-radius:7px;border:1px solid var(--bd);
background:#fff;font-size:9px;font-weight:bold
}
.primary{background:var(--b);color:#fff;border-color:var(--b)}

.context{
display:grid;grid-template-columns:2fr repeat(4,1fr);
gap:1px;background:var(--bd);margin:16px 0;
border-radius:8px;overflow:hidden
}

.context div{background:#fff;padding:11px 13px}
.context small{
display:block;color:#8994a5;font-size:7px;text-transform:uppercase
}
.context b{display:block;margin-top:4px;font-size:10px}

.card{
background:#fff;border:1px solid var(--bd);
border-radius:8px;overflow:hidden
}

.head{
min-height:51px;padding:0 13px;border-bottom:1px solid #edf0f4;
display:flex;align-items:center;justify-content:space-between
}

.head b{font-size:11px}
.head small{
display:block;color:#8994a5;font-size:7px;margin-top:3px
}
.head a{color:var(--b);font-size:8px;font-weight:bold}

.body{padding:13px}

.filters{
display:grid;grid-template-columns:2fr repeat(4,1fr) auto;
gap:7px;margin-bottom:12px
}

.filters input,.filters select{
height:35px;border:1px solid var(--bd);
border-radius:6px;padding:0 9px;font-size:9px;
background:#fff;min-width:0
}

.filterbtn{
height:35px;border:1px solid var(--bd);
background:#fff;border-radius:6px;padding:0 11px;
font-size:9px;font-weight:bold
}

.table{overflow:auto}
table{width:100%;min-width:850px;border-collapse:collapse}

th{
text-align:left;background:#f8fafc;color:#8994a5;
font-size:7px;padding:9px
}

td{
border-top:1px solid #edf0f4;padding:10px 8px;
font-size:8px;color:#526077
}

td b{color:#172033}

.status{
padding:4px 7px;border-radius:10px;
background:#eaf1ff;color:var(--b);
font-size:7px;font-weight:bold
}

.status.green{background:#eaf8f0;color:var(--g)}
.status.orange{background:#fff5e8;color:var(--o)}
.status.red{background:#fff0f0;color:var(--r)}

.empty{
text-align:center;padding:35px;
border:1px dashed var(--bd);
color:#8994a5;font-size:8px
}

.bottom{
display:grid;grid-template-columns:repeat(4,1fr);
gap:8px;margin-top:12px
}

.info{
background:#fff;border:1px solid var(--bd);
border-radius:8px;padding:13px
}

.info small{
display:block;color:#8994a5;font-size:7px;text-transform:uppercase
}

.info b{display:block;margin-top:7px;font-size:11px}
.info span{display:block;margin-top:4px;color:#8994a5;font-size:8px}

.footer{
margin-top:22px;background:var(--dark);color:#fff;
padding:25px 22px 12px;border-radius:8px 8px 0 0
}

.footgrid{
display:grid;grid-template-columns:2fr repeat(4,1fr);gap:20px
}

.footer b{font-size:10px}
.footer p,.footer a{
font-size:8px;color:#b9c5d6;line-height:1.5
}
.footer a{display:block;margin:5px 0}

.footbottom{
border-top:1px solid #30425d;margin-top:18px;
padding-top:10px;display:flex;
justify-content:space-between;font-size:7px;color:#aebbd0
}

.drop{
position:fixed;right:18px;top:58px;width:190px;
background:#fff;border:1px solid var(--bd);border-radius:8px;
box-shadow:0 12px 30px #0002;padding:7px;
display:none;z-index:40
}

.drop.open{display:block}
.drop button{
width:100%;text-align:left;border:0;background:#fff;
padding:9px;border-radius:6px;font-size:9px
}
.drop hr{border:0;border-top:1px solid #edf0f4}

.overlay{display:none}

@media(max-width:1050px){
.filters{grid-template-columns:1fr 1fr 1fr}
.filters input{grid-column:1/-1}
.bottom{grid-template-columns:1fr 1fr}
}

@media(max-width:900px){
.context{grid-template-columns:repeat(2,1fr)}
.footgrid{grid-template-columns:repeat(3,1fr)}
}

@media(max-width:700px){
.menu{display:block}
.brand{min-width:auto}
.brand small{display:none}
.search{flex:1;width:auto}
.top .help{display:none}

.side{
transform:translateX(-105%);
transition:.2s;
box-shadow:8px 0 25px #0002
}
.side.open{transform:translateX(0)}

.overlay.open{
display:block;position:fixed;inset:64px 0 0;
background:#0005;z-index:14
}

.main{margin-left:0}
.wrap{padding:15px 12px}

.hero{flex-direction:column;align-items:flex-start}
.actions{width:100%}
.actions .btn{flex:1;text-align:center}

.context{grid-template-columns:1fr 1fr}
.context div:first-child{grid-column:1/-1}

.filters{grid-template-columns:1fr 1fr}
.filters input{grid-column:1/-1}
.filters .filterbtn{grid-column:1/-1}

}

@media(max-width:480px){
.hero h1{font-size:24px}
.bottom{grid-template-columns:1fr}
.footgrid{grid-template-columns:1fr 1fr}
.footbottom{flex-direction:column;gap:5px}
.account{padding-right:4px}
.account .email{display:none}
}
</style>

<script src="../platform/krim-security.js"></script>

<script>
(function(){
"use strict";

const $=id=>document.getElementById(id);
const side=$("side");
const overlay=$("overlay");
const account=$("account");
const accountMenu=$("accountMenu");

$("menu").onclick=()=>{
side.classList.toggle("open");
overlay.classList.toggle("open");
};

overlay.onclick=()=>{
side.classList.remove("open");
overlay.classList.remove("open");
};

account.onclick=()=>{
accountMenu.classList.toggle("open");
};

document.addEventListener("click",e=>{
if(!account.contains(e.target)&&!accountMenu.contains(e.target))
accountMenu.classList.remove("open");
});

$("signout").onclick=async()=>{
try{
if(window.KRIM_AUTH)await KRIM_AUTH.signOut();
}finally{
location.href=window.KRIM_CONFIG?.routes?.auth?.login||"../auth/login.html";
}
};

$("globalSearch").onkeydown=e=>{
if(e.key==="Enter"&&e.target.value.trim()){
location.href="shipments.html?search="+encodeURIComponent(e.target.value.trim());
}
};

$("shipmentSearch").onkeydown=e=>{
if(e.key==="Enter"&&e.target.value.trim()){
location.href="shipments.html?search="+encodeURIComponent(e.target.value.trim());
}
};

async function init(){
try{
if(window.KRIM_SECURITY?.requireUser){
const user=await KRIM_SECURITY.requireUser({preserveReturnUrl:true});

if(user){
const email=user.email||"KRIM";
$("email").textContent=email;
$("avatar").textContent=email.charAt(0).toUpperCase();
}
}
}catch(error){
console.error("KRIM shipment authentication:",error);
}
}

init();

})();
</script>
