<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Global Quotes | KRIM Logistics</title>

  <link rel="stylesheet" href="../platform/krim-core.css">
  <link rel="stylesheet" href="../platform/krim-components.css">
  <link rel="stylesheet" href="../platform/krim-responsive.css">

  <style>
    .quote-page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    .quote-header {
      margin-bottom: 24px;
    }

    .quote-header h1 {
      margin-bottom: 8px;
    }

    .quote-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-weight: 600;
    }

    .field input,
    .field select {
      width: 100%;
      box-sizing: border-box;
      padding: 11px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #fff;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    .form-actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .form-message {
      margin-top: 16px;
    }

    .quote-table {
      width: 100%;
      border-collapse: collapse;
    }

    .quote-table th,
    .quote-table td {
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
    }

    @media (max-width: 700px) {
      .quote-page {
        padding: 16px;
      }

      .quote-grid {
        grid-template-columns: 1fr;
      }

      .full-width {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>

  <header class="site-header">
    <div class="container">

      <button
        id="menuBtn"
        type="button"
        aria-label="Open menu">
        ☰
      </button>

      <a href="../customer/index.html" class="brand">
        KRIM Logistics
      </a>

      <button
        id="signoutBtn"
        type="button">
        Sign out
      </button>

    </div>
  </header>

  <aside id="sidebar">
    <nav>
      <a href="../customer/index.html">Customer Workspace</a>
      <a href="shipments.html">Shipments</a>
      <a href="quotes.html">Quotes</a>
    </nav>
  </aside>

  <main class="quote-page">

    <section class="quote-header">
      <h1>Global Quotes</h1>
      <p>
        Create and manage authorized KRIM logistics quote requests.
      </p>
    </section>

    <section class="panel">

      <h2>Create Quote Request</h2>

      <div class="quote-grid">

        <div class="field">
          <label for="shipmentId">Shipment ID</label>
          <input
            id="shipmentId"
            type="number"
            min="1"
            placeholder="Enter KRIM shipment ID">
        </div>

        <div class="field">
          <label for="quoteAmount">Quote Amount</label>
          <input
            id="quoteAmount"
            type="number"
            min="0"
            step="0.01"
            placeholder="Enter quote amount">
        </div>

        <div class="field">
          <label for="origin">Origin</label>
          <input
            id="origin"
            type="text"
            placeholder="Origin location">
        </div>

        <div class="field">
          <label for="destination">Destination</label>
          <input
            id="destination"
            type="text"
            placeholder="Destination location">
        </div>

        <div class="field">
          <label for="mode">Transport Mode</label>
          <select id="mode">
            <option value="">Select mode</option>
            <option value="road">Road</option>
            <option value="rail">Rail</option>
            <option value="ocean">Ocean</option>
            <option value="air">Air</option>
            <option value="multimodal">Multimodal</option>
          </select>
        </div>

        <div class="field">
          <label for="service">Service</label>
          <select id="service">
            <option value="">Select service</option>
            <option value="standard">Standard</option>
            <option value="priority">Priority</option>
            <option value="express">Express</option>
          </select>
        </div>

        <div class="field">
          <label for="cargo">Cargo</label>
          <input
            id="cargo"
            type="text"
            placeholder="Cargo description">
        </div>

        <div class="field">
          <label for="weight">Weight (kg)</label>
          <input
            id="weight"
            type="number"
            min="0"
            step="0.01"
            placeholder="Cargo weight">
        </div>

        <div class="field">
          <label for="market">Market</label>
          <input
            id="market"
            type="text"
            placeholder="Market">
        </div>

        <div class="field">
          <label for="currency">Currency</label>
          <select id="currency">
            <option value="">Select currency</option>
            <option value="INR">INR</option>
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
            <option value="GBP">GBP</option>
          </select>
        </div>

        <div class="field full-width">
          <label for="reference">Customer Reference</label>
          <input
            id="reference"
            type="text"
            placeholder="Customer reference">
        </div>

      </div>

      <div class="form-actions">

        <button
          id="createBtn"
          type="button">
          Create Quote
        </button>

        <button
          id="clearBtn"
          type="button">
          Clear
        </button>

      </div>

      <div
        id="formMessage"
        class="form-message"
        aria-live="polite">
      </div>

    </section>

    <section class="panel" style="margin-top:24px;">

      <h2>Recent Quotes</h2>

      <div style="overflow-x:auto;">

        <table class="quote-table">

          <thead>
            <tr>
              <th>Reference</th>
              <th>Shipment</th>
              <th>Route</th>
              <th>Amount</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody>

            <tr>
              <td>KRIM-TEST-001</td>
              <td>KRIM-2026-00000002</td>
              <td>Test Route</td>
              <td>INR 25,000</td>
              <td>Test</td>
              <td>
                <button
                  type="button"
                  class="convertBtn">
                  Convert
                </button>
              </td>
            </tr>

          </tbody>

        </table>

      </div>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../platform/krim-config.js"></script>
  <script src="../platform/krim-supabase.js"></script>
  <script src="../platform/krim-auth.js"></script>
  <script src="../platform/krim-api.js"></script>
  <script src="../platform/krim-ui.js"></script>
  <script src="../platform/krim-security.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {

      const sidebar = document.getElementById("sidebar");

      document.getElementById("menuBtn")?.addEventListener("click", () => {
        if (sidebar) {
          sidebar.classList.toggle("open");
        }
      });


      document.getElementById("signoutBtn")?.addEventListener("click", async () => {
        try {
          if (window.KRIM_AUTH?.signOut) {
            await window.KRIM_AUTH.signOut();
          }
        } catch (e) {
          location.href = "../auth/login.html";
        }
      });


      document.getElementById("clearBtn")?.addEventListener("click", () => {

        [
          "shipmentId",
          "origin",
          "destination",
          "cargo",
          "weight",
          "reference",
          "quoteAmount",
          "market"
        ].forEach(id => {

          const element = document.getElementById(id);

          if (element) {
            element.value = "";
          }

        });

        const mode = document.getElementById("mode");
        const service = document.getElementById("service");
        const currency = document.getElementById("currency");

        if (mode) mode.value = "";
        if (service) service.value = "";
        if (currency) currency.value = "";

        const message = document.getElementById("formMessage");

        if (message) {
          message.innerHTML = "";
        }

      });


      document.getElementById("createBtn")?.addEventListener("click", async () => {

        const shipmentId =
          Number(document.getElementById("shipmentId")?.value);

        const amount =
          Number(document.getElementById("quoteAmount")?.value);

        const currency =
          document.getElementById("currency")?.value.trim();

        const message =
          document.getElementById("formMessage");

        const createBtn =
          document.getElementById("createBtn");


        if (!Number.isInteger(shipmentId) || shipmentId <= 0) {

          message.innerHTML =
            '<div class="panel" style="margin-top:12px;background:#fff7ed">Please enter a valid Shipment ID.</div>';

          return;
        }


        if (!Number.isFinite(amount) || amount < 0) {

          message.innerHTML =
            '<div class="panel" style="margin-top:12px;background:#fff7ed">Please enter a valid quote amount.</div>';

          return;
        }


        if (!currency) {

          message.innerHTML =
            '<div class="panel" style="margin-top:12px;background:#fff7ed">Please select a currency.</div>';

          return;
        }


        if (!window.KRIM_SUPABASE) {

          message.innerHTML =
            '<div class="panel" style="margin-top:12px;background:#fef2f2">KRIM Supabase client is not ready.</div>';

          return;
        }


        try {

          createBtn.disabled = true;
          createBtn.textContent = "Creating...";


          const { data, error } =
            await window.KRIM_SUPABASE.rpc(
              "krim_create_global_quote",
              {
                p_shipment_id: shipmentId,
                p_amount: amount,
                p_currency_code: currency,
                p_valid_until:
                  new Date(
                    Date.now() +
                    7 * 24 * 60 * 60 * 1000
                  ).toISOString()
              }
            );


          if (error) {
            throw error;
          }


          message.innerHTML =
            '<div class="panel" style="margin-top:12px;background:#ecfdf5">Quote created successfully.</div>';


          console.log(
            "KRIM quote created:",
            data
          );


        } catch (error) {

          console.error(
            "Quote creation failed:",
            error
          );


          message.innerHTML =
            '<div class="panel" style="margin-top:12px;background:#fef2f2">Quote creation failed: ' +
            (
              error?.message ||
              "Unknown error"
            ) +
            '</div>';


        } finally {

          createBtn.disabled = false;
          createBtn.textContent = "Create Quote";

        }

      });


      document.querySelectorAll(".convertBtn").forEach(btn => {

        btn.addEventListener("click", () => {

          alert(
            "Quote-to-shipment conversion will use the authorized KRIM shipment workflow."
          );

        });

      });


      document.getElementById("globalSearch")?.addEventListener("keydown", e => {

        if (e.key === "Enter") {

          const query =
            e.target.value.trim();

          if (query) {

            const reference =
              document.getElementById("reference");

            if (reference) {
              reference.value = query;
            }

          }

        }

      });

    });
  </script>

</body>
  </html>
