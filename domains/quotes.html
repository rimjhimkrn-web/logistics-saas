<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Quotes | KRIM Logistics</title>

<link rel="stylesheet" href="../core/krim-core.css">
<link rel="stylesheet" href="../core/krim-components.css">
<link rel="stylesheet" href="../core/krim-responsive.css">

<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
}

.krim-page{
  max-width:1400px;
  margin:0 auto;
  padding:20px;
}

.krim-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  margin-bottom:24px;
}

.krim-header h1{
  margin:0;
}

.krim-header p{
  margin:6px 0 0;
  opacity:.7;
}

.krim-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.krim-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.krim-card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:20px;
  box-shadow:0 4px 18px rgba(0,0,0,.04);
}

.krim-card h2{
  margin-top:0;
}

.krim-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.krim-field{
  margin-bottom:15px;
}

.krim-field label{
  display:block;
  font-weight:600;
  margin-bottom:6px;
}

.krim-field input,
.krim-field select{
  width:100%;
  box-sizing:border-box;
  padding:11px 12px;
  border:1px solid #d1d5db;
  border-radius:8px;
  font-size:15px;
}

.krim-field input:focus,
.krim-field select:focus{
  outline:none;
  border-color:#2563eb;
}

.krim-quote-box{
  background:#f8fafc;
  border-radius:12px;
  padding:18px;
  margin-top:15px;
}

.krim-quote-amount{
  font-size:32px;
  font-weight:700;
  margin:8px 0;
}

.krim-status{
  display:inline-block;
  padding:5px 10px;
  border-radius:999px;
  font-size:13px;
  font-weight:600;
  background:#e5e7eb;
}

.krim-status.sent{
  background:#dbeafe;
  color:#1d4ed8;
}

.krim-status.accepted{
  background:#dcfce7;
  color:#166534;
}

.krim-status.rejected,
.krim-status.cancelled,
.krim-status.expired{
  background:#fee2e2;
  color:#991b1b;
}

.krim-message{
  margin-top:14px;
  padding:12px 14px;
  border-radius:8px;
  display:none;
}

.krim-message.show{
  display:block;
}

.krim-message.success{
  background:#dcfce7;
  color:#166534;
}

.krim-message.error{
  background:#fee2e2;
  color:#991b1b;
}

.krim-message.warning{
  background:#fef3c7;
  color:#92400e;
}

.krim-message.info{
  background:#dbeafe;
  color:#1e40af;
}

.krim-button{
  border:0;
  border-radius:8px;
  padding:11px 16px;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
}

.krim-button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.krim-button-primary{
  background:#2563eb;
  color:#fff;
}

.krim-button-success{
  background:#16a34a;
  color:#fff;
}

.krim-button-secondary{
  background:#e5e7eb;
  color:#111827;
}

.krim-button-danger{
  background:#dc2626;
  color:#fff;
}

.krim-payment-box{
  margin-top:20px;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:18px;
}

.krim-payment-title{
  font-size:18px;
  font-weight:700;
  margin-bottom:8px;
}

.krim-payment-details{
  margin-top:12px;
  font-size:14px;
  line-height:1.7;
}

.krim-muted{
  opacity:.7;
}

.krim-loading{
  padding:20px;
  text-align:center;
}

.krim-sidebar-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:15px;
}

@media(max-width:800px){
  .krim-grid{
    grid-template-columns:1fr;
  }

  .krim-row{
    grid-template-columns:1fr;
  }

  .krim-header{
    align-items:flex-start;
    flex-direction:column;
  }

  .krim-page{
    padding:14px;
  }
}
</style>
</head>

<body>

<div class="krim-page">

  <header class="krim-header">
    <div>
      <h1>Quotes</h1>
      <p>Review your KRIM Logistics shipment quote and complete payment.</p>
    </div>

    <div class="krim-actions">
      <button
        type="button"
        id="clearBtn"
        class="krim-button krim-button-secondary">
        Clear
      </button>

      <button
        type="button"
        id="signOutBtn"
        class="krim-button krim-button-secondary">
        Sign Out
      </button>
    </div>
  </header>

  <div id="pageLoading" class="krim-loading">
    Loading quote...
  </div>

  <main id="quoteContent" style="display:none;">

    <div class="krim-grid">

      <section class="krim-card">

        <h2>Shipment Quote</h2>

        <div class="krim-row">

          <div class="krim-field">
            <label for="shipmentId">
              Shipment ID
            </label>

            <input
              id="shipmentId"
              type="text"
              readonly>
          </div>

          <div class="krim-field">
            <label for="quoteId">
              Quote ID
            </label>

            <input
              id="quoteId"
              type="text"
              readonly>
          </div>

        </div>

        <div class="krim-row">

          <div class="krim-field">
            <label for="origin">
              Origin
            </label>

            <input
              id="origin"
              type="text"
              placeholder="Origin">
          </div>

          <div class="krim-field">
            <label for="destination">
              Destination
            </label>

            <input
              id="destination"
              type="text"
              placeholder="Destination">
          </div>

        </div>

        <div class="krim-row">

          <div class="krim-field">
            <label for="cargo">
              Cargo Description
            </label>

            <input
              id="cargo"
              type="text"
              placeholder="Cargo description">
          </div>

          <div class="krim-field">
            <label for="weight">
              Weight (kg)
            </label>

            <input
              id="weight"
              type="number"
              min="0"
              step="0.01"
              placeholder="Weight">
          </div>

        </div>

        <div class="krim-quote-box">

          <div class="krim-muted">
            Quoted Amount
          </div>

          <div
            id="quoteAmount"
            class="krim-quote-amount">
            —
          </div>

          <div>
            Currency:
            <strong id="quoteCurrency">—</strong>
          </div>

          <div style="margin-top:10px;">
            Status:
            <span
              id="quoteStatus"
              class="krim-status">
              —
            </span>
          </div>

          <div style="margin-top:10px;">
            Valid Until:
            <strong id="quoteValidUntil">—</strong>
          </div>

        </div>

        <div id="formMessage" class="krim-message"></div>

        <div class="krim-sidebar-actions">

          <button
            type="button"
            id="acceptQuoteBtn"
            class="krim-button krim-button-success"
            style="display:none;">
            Accept Quote
          </button>

          <button
            type="button"
            id="createBtn"
            class="krim-button krim-button-primary">
            Create Quote
          </button>

        </div>

      </section>

      <section class="krim-card">

        <h2>Payment</h2>

        <p class="krim-muted">
          Complete payment securely through Razorpay.
        </p>

        <div class="krim-payment-box">

          <div class="krim-payment-title">
            Payment Status
          </div>

          <div id="paymentStatusText">
            Checking payment status...
          </div>

          <div
            id="paymentMessage"
            class="krim-message">
          </div>

          <div
            id="paymentAction"
            style="margin-top:16px;">
          </div>

          <div
            id="paymentDetails"
            class="krim-payment-details"
            style="display:none;">
          </div>

        </div>

      </section>

    </div>

  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script src="../platform/krim-config.js"></script>
<script src="../platform/krim-supabase.js"></script>
<script src="../platform/krim-auth.js"></script>
<script src="../platform/krim-api.js"></script>
<script src="../platform/krim-ui.js"></script>
<script src="../platform/krim-security.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {

  "use strict";

  const pageLoading =
    document.getElementById("pageLoading");

  const quoteContent =
    document.getElementById("quoteContent");

  const shipmentIdInput =
    document.getElementById("shipmentId");

  const quoteIdInput =
    document.getElementById("quoteId");

  const originInput =
    document.getElementById("origin");

  const destinationInput =
    document.getElementById("destination");

  const cargoInput =
    document.getElementById("cargo");

  const weightInput =
    document.getElementById("weight");

  const quoteAmount =
    document.getElementById("quoteAmount");

  const quoteCurrency =
    document.getElementById("quoteCurrency");

  const quoteStatus =
    document.getElementById("quoteStatus");

  const quoteValidUntil =
    document.getElementById("quoteValidUntil");

  const formMessage =
    document.getElementById("formMessage");

  const paymentMessage =
    document.getElementById("paymentMessage");

  const paymentStatusText =
    document.getElementById("paymentStatusText");

  const paymentAction =
    document.getElementById("paymentAction");

  const paymentDetails =
    document.getElementById("paymentDetails");

  const acceptQuoteBtn =
    document.getElementById("acceptQuoteBtn");

  const createBtn =
    document.getElementById("createBtn");

  const clearBtn =
    document.getElementById("clearBtn");

  const signOutBtn =
    document.getElementById("signOutBtn");


  function showMessage(
    element,
    message,
    type = "info"
  ) {
    if (!element) return;

    element.textContent = message;

    element.className =
      "krim-message show " + type;
  }


  function hideMessage(element) {
    if (!element) return;

    element.textContent = "";

    element.className =
      "krim-message";
  }


  function formatMoney(amount, currency) {

    const numericAmount =
      Number(amount);

    if (!Number.isFinite(numericAmount)) {
      return "—";
    }

    try {

      return new Intl.NumberFormat(
        "en-IN",
        {
          style: "currency",
          currency: currency || "INR",
          maximumFractionDigits: 2
        }
      ).format(numericAmount);

    } catch (error) {

      return `${currency || "INR"} ${numericAmount.toFixed(2)}`;
    }
  }


  function formatDate(dateValue) {

    if (!dateValue) {
      return "—";
    }

    const date =
      new Date(dateValue);

    if (Number.isNaN(date.getTime())) {
      return "—";
    }

    return date.toLocaleString(
      "en-IN",
      {
        dateStyle: "medium",
        timeStyle: "short"
      }
    );
  }


  function setQuoteStatus(status) {

    if (!quoteStatus) return;

    quoteStatus.textContent =
      status || "—";

    quoteStatus.className =
      "krim-status " +
      String(status || "").toLowerCase();
  }


  function getShipmentId() {

    const params =
      new URLSearchParams(
        window.location.search
      );

    const raw =
      params.get("shipment_id");

    if (!raw) {
      return null;
    }

    const id =
      Number(raw);

    if (
      !Number.isInteger(id) ||
      id <= 0
    ) {
      return null;
    }

    return id;
  }


  function createPaymentButton() {

    if (!paymentAction) {
      return null;
    }

    paymentAction.innerHTML = "";

    const button =
      document.createElement("button");

    button.type = "button";

    button.id =
      "paymentTestBtn";

    button.className =
      "krim-button krim-button-primary";

    button.textContent =
      "Pay Now";

    paymentAction.appendChild(button);

    return button;
  }


  function showPaymentDetails(payment) {

    if (!paymentDetails) {
      return;
    }

    paymentDetails.style.display =
      "block";

    paymentDetails.innerHTML = "";

    const rows = [

      [
        "Payment Order",
        payment?.razorpay_order_id || "—"
      ],

      [
        "Payment ID",
        payment?.razorpay_payment_id || "—"
      ],

      [
        "Amount",
        formatMoney(
          Number(payment?.amount_paise || 0) / 100,
          payment?.currency || "INR"
        )
      ],

      [
        "Paid At",
        formatDate(payment?.paid_at)
      ]

    ];

    rows.forEach(([label, value]) => {

      const div =
        document.createElement("div");

      const strong =
        document.createElement("strong");

      strong.textContent =
        `${label}: `;

      div.appendChild(strong);

      div.appendChild(
        document.createTextNode(value)
      );

      paymentDetails.appendChild(div);
    });
  }


  function markPaymentPaid(payment) {

    paymentStatusText.textContent =
      "Payment received successfully.";

    showMessage(
      paymentMessage,
      "Your payment has been successfully received and verified by KRIM.",
      "success"
    );

    paymentAction.innerHTML = "";

    showPaymentDetails(payment);
  }


  function markVerificationPending(paymentId) {

    paymentStatusText.textContent =
      "Payment received — verification pending.";

    showMessage(
      paymentMessage,
      "Payment was received by Razorpay, but KRIM verification did not complete. Do not make another payment. Please contact KRIM support with Payment ID: " +
        paymentId,
      "warning"
    );

    paymentAction.innerHTML = "";

    const pendingText =
      document.createElement("strong");

    pendingText.textContent =
      "Verification Pending — Do Not Pay Again";

    paymentAction.appendChild(
      pendingText
    );
  }


  const shipmentId =
    getShipmentId();


  if (!shipmentId) {

    pageLoading.style.display =
      "none";

    quoteContent.style.display =
      "block";

    showMessage(
      formMessage,
      "A valid shipment_id is required in the page URL.",
      "error"
    );

    return;
  }


  shipmentIdInput.value =
    shipmentId;


  if (!window.KRIM_SUPABASE) {

    pageLoading.style.display =
      "none";

    quoteContent.style.display =
      "block";

    showMessage(
      formMessage,
      "KRIM Supabase client is not available. Please refresh the page.",
      "error"
    );

    return;
  }


  let currentUser = null;


  try {

    const {
      data,
      error
    } =
      await window.KRIM_SUPABASE.auth.getUser();

    if (error) {
      throw error;
    }

    currentUser =
      data?.user || null;

  } catch (error) {

    console.error(
      "KRIM auth error:",
      error
    );

    pageLoading.style.display =
      "none";

    quoteContent.style.display =
      "block";

    showMessage(
      formMessage,
      "Your login session could not be verified. Please sign in again.",
      "error"
    );

    return;
  }


  if (!currentUser) {

    pageLoading.style.display =
      "none";

    quoteContent.style.display =
      "block";

    showMessage(
      formMessage,
      "Please sign in to access this quote.",
      "warning"
    );

    return;
  }


  let currentQuote = null;


  async function loadGlobalQuote() {

    hideMessage(formMessage);

    try {

      const {
        data,
        error
      } =
        await window.KRIM_SUPABASE
          .from("krim_quotes")
          .select(`
            id,
            shipment_id,
            customer_organization_id,
            amount,
            currency_code,
            valid_until,
            status,
            created_at,
            updated_at
          `)
          .eq(
            "shipment_id",
            shipmentId
          )
          .order(
            "created_at",
            {
              ascending: false
            }
          )
          .limit(1)
          .maybeSingle();


      if (error) {
        throw error;
      }


      currentQuote =
        data || null;


      if (!currentQuote) {

        quoteIdInput.value =
          "—";

        quoteAmount.textContent =
          "—";

        quoteCurrency.textContent =
          "—";

        setQuoteStatus(
          "No Quote"
        );

        quoteValidUntil.textContent =
          "—";

        acceptQuoteBtn.style.display =
          "none";

        showMessage(
          formMessage,
          "No quote was found for this shipment.",
          "warning"
        );

        return;
      }


      quoteIdInput.value =
        currentQuote.id;

      quoteAmount.textContent =
        formatMoney(
          currentQuote.amount,
          currentQuote.currency_code
        );

      quoteCurrency.textContent =
        currentQuote.currency_code || "INR";

      setQuoteStatus(
        currentQuote.status
      );

      quoteValidUntil.textContent =
        formatDate(
          currentQuote.valid_until
        );


      if (
        currentQuote.status === "sent"
      ) {

        acceptQuoteBtn.style.display =
          "inline-block";

        acceptQuoteBtn.disabled =
          false;

      } else {

        acceptQuoteBtn.style.display =
          "none";
      }


      if (
        currentQuote.status === "accepted"
      ) {

        showMessage(
          formMessage,
          "Quote accepted successfully.",
          "success"
        );
      }


    } catch (error) {

      console.error(
        "Global quote load error:",
        error
      );

      showMessage(
        formMessage,
        "Unable to load the KRIM quote. Please refresh and try again.",
        "error"
      );
    }
  }
  
  async function loadPaymentStatus() {

    hideMessage(paymentMessage);

    paymentAction.innerHTML = "";

    paymentDetails.style.display =
      "none";

    paymentDetails.innerHTML = "";

    paymentStatusText.textContent =
      "Checking payment status...";


    try {

      const {
        data: existingPayment,
        error: paymentCheckError
      } =
        await window.KRIM_SUPABASE
          .from("payment_orders")
          .select(`
            id,
            status,
            amount_paise,
            currency,
            razorpay_order_id,
            razorpay_payment_id,
            paid_at,
            created_at
          `)
          .eq(
            "krim_shipment_id",
            shipmentId
          )
          .order(
            "created_at",
            {
              ascending: false
            }
          )
          .limit(1)
          .maybeSingle();


      if (paymentCheckError) {

        console.error(
          "Payment status error:",
          paymentCheckError
        );

        paymentStatusText.textContent =
          "Payment status could not be checked.";

        showMessage(
          paymentMessage,
          "Payment status could not be verified. Do not make another payment until the status is checked.",
          "warning"
        );

        return;
      }


      if (!existingPayment) {

        paymentStatusText.textContent =
          "No payment has been made yet.";

        const paymentTestBtn =
          createPaymentButton();

        await setupPaymentButton(
          paymentTestBtn
        );

        return;
      }


      if (
        existingPayment.status === "paid"
      ) {

        markPaymentPaid(
          existingPayment
        );

        return;
      }


      if (
        existingPayment.status === "failed" ||
        existingPayment.status === "cancelled" ||
        existingPayment.status === "expired"
      ) {

        paymentStatusText.textContent =
          "Previous payment attempt was not completed.";

        showMessage(
          paymentMessage,
          "You may start a new payment attempt.",
          "info"
        );

        const paymentTestBtn =
          createPaymentButton();

        await setupPaymentButton(
          paymentTestBtn
        );

        return;
      }


      paymentStatusText.textContent =
        "A payment order already exists.";

      showMessage(
        paymentMessage,
        "A previous payment attempt is still being processed. Do not create another payment until its status is confirmed.",
        "warning"
      );


      if (
        existingPayment.razorpay_payment_id
      ) {

        showPaymentDetails(
          existingPayment
        );
      }


    } catch (error) {

      console.error(
        "Payment status exception:",
        error
      );

      paymentStatusText.textContent =
        "Payment status could not be checked.";

      showMessage(
        paymentMessage,
        "Payment status could not be checked. Please refresh before attempting payment.",
        "warning"
      );
    }
  }


  async function setupPaymentButton(
    paymentTestBtn
  ) {

    if (!paymentTestBtn) {
      return;
    }


    paymentTestBtn.addEventListener(
      "click",
      async () => {

        paymentTestBtn.disabled =
          true;

        paymentTestBtn.textContent =
          "Preparing Payment...";

        hideMessage(paymentMessage);


        try {

          if (
            typeof window.Razorpay !==
            "function"
          ) {

            throw new Error(
              "Razorpay Checkout is not loaded."
            );
          }


          const {
            data: sessionData,
            error: sessionError
          } =
            await window.KRIM_SUPABASE.auth
              .getSession();


          if (sessionError) {
            throw sessionError;
          }


          const accessToken =
            sessionData?.session?.access_token;


          if (!accessToken) {

            throw new Error(
              "Authentication session expired. Please sign in again."
            );
          }


          paymentTestBtn.textContent =
            "Creating Order...";


          const functionUrl =
            window.KRIM_SUPABASE.supabaseUrl +
            "/functions/v1/create-global-razorpay-order";


          const orderResponse =
            await fetch(
              functionUrl,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json",

                  "Authorization":
                    `Bearer ${accessToken}`,

                  "apikey":
                    window.KRIM_SUPABASE.supabaseKey
                },

                body: JSON.stringify({
                  shipment_id:
                    shipmentId
                })
              }
            );


          const orderResult =
            await orderResponse
              .json()
              .catch(() => ({}));


          if (!orderResponse.ok) {

            throw new Error(
              orderResult?.error ||
              orderResult?.message ||
              "Unable to create Razorpay order."
            );
          }


          const razorpayOrderId =
            orderResult?.order_id ||
            orderResult?.razorpay_order_id;


          const razorpayAmount =
            orderResult?.amount;


          const razorpayCurrency =
            orderResult?.currency ||
            "INR";


          const razorpayKeyId =
            orderResult?.key_id ||
            "rzp_test_TgXmRwBC44Bx71";


          if (!razorpayOrderId) {

            throw new Error(
              "Razorpay order ID was not returned."
            );
          }


          if (
            !razorpayAmount ||
            Number(razorpayAmount) <= 0
          ) {

            throw new Error(
              "Invalid Razorpay payment amount."
            );
          }


          paymentTestBtn.textContent =
            "Opening Payment...";


          const options = {

            key:
              razorpayKeyId,

            amount:
              Number(razorpayAmount),

            currency:
              razorpayCurrency,

            name:
              "KRIM Logistics",

            description:
              `KRIM shipment #${shipmentId}`,

            order_id:
              razorpayOrderId,

            prefill: {
              email:
                currentUser.email || ""
            },

            theme: {
              color: "#2563eb"
            },


            handler:
              async function(response) {

                console.log(
                  "Razorpay success response:",
                  response
                );


                const paymentId =
                  response?.razorpay_payment_id;

                const orderId =
                  response?.razorpay_order_id;

                const signature =
                  response?.razorpay_signature;


                if (
                  !paymentId ||
                  !orderId ||
                  !signature
                ) {

                  markVerificationPending(
                    paymentId ||
                    "Unavailable"
                  );

                  return;
                }


                paymentTestBtn.disabled =
                  true;

                paymentTestBtn.textContent =
                  "Verifying Payment...";


                try {

                  const {
                    data: verifySessionData,
                    error: verifySessionError
                  } =
                    await window.KRIM_SUPABASE.auth
                      .getSession();


                  if (verifySessionError) {
                    throw verifySessionError;
                  }


                  const verifyToken =
                    verifySessionData
                      ?.session
                      ?.access_token;


                  if (!verifyToken) {

                    throw new Error(
                      "Authentication session expired during payment verification."
                    );
                  }


                  const verifyUrl =
                    window.KRIM_SUPABASE.supabaseUrl +
                    "/functions/v1/verify-razorpay-payment-";


                  const verifyResponse =
                    await fetch(
                      verifyUrl,
                      {
                        method: "POST",

                        headers: {
                          "Content-Type":
                            "application/json",

                          "Authorization":
                            `Bearer ${verifyToken}`,

                          "apikey":
                            window.KRIM_SUPABASE.supabaseKey
                        },

                        body: JSON.stringify({

                          razorpay_order_id:
                            orderId,

                          razorpay_payment_id:
                            paymentId,

                          razorpay_signature:
                            signature

                        })
                      }
                    );


                  const verifyResult =
                    await verifyResponse
                      .json()
                      .catch(() => ({}));


                  console.log(
                    "KRIM verification result:",
                    verifyResult
                  );


                  if (
                    !verifyResponse.ok ||
                    verifyResult?.success !== true
                  ) {

                    markVerificationPending(
                      paymentId
                    );

                    return;
                  }


                  paymentStatusText.textContent =
                    "Payment verified successfully.";


                  showMessage(
                    paymentMessage,
                    "Payment received and successfully verified by KRIM.",
                    "success"
                  );


                  paymentAction.innerHTML = "";


                  paymentDetails.style.display =
                    "block";

                  paymentDetails.innerHTML = "";


                  const details = [

                    [
                      "Payment ID",
                      paymentId
                    ],

                    [
                      "Razorpay Order ID",
                      orderId
                    ],

                    [
                      "Status",
                      "Paid / Verified"
                    ],

                    [
                      "Verified At",
                      formatDate(new Date())
                    ]

                  ];


                  details.forEach(
                    ([label, value]) => {

                      const row =
                        document.createElement(
                          "div"
                        );

                      const strong =
                        document.createElement(
                          "strong"
                        );

                      strong.textContent =
                        `${label}: `;

                      row.appendChild(
                        strong
                      );

                      row.appendChild(
                        document.createTextNode(value)
                      );

                      paymentDetails.appendChild(
                        row
                      );
                    }
                  );


                } catch (verificationError) {

                  console.error(
                    "Payment verification error:",
                    verificationError
                  );


                  markVerificationPending(
                    paymentId
                  );
                }

              },


            modal: {

              ondismiss: function() {

                paymentTestBtn.disabled =
                  false;

                paymentTestBtn.textContent =
                  "Pay Now";

                paymentStatusText.textContent =
                  "Payment window closed.";
              }

            },


            notes: {

              shipment_id:
                String(shipmentId),

              krim:
                "global-logistics"
            }

          };


          const razorpay =
            new window.Razorpay(
              options
            );


          razorpay.on(
            "payment.failed",
            function(response) {

              console.error(
                "Razorpay payment failed:",
                response
              );


              paymentStatusText.textContent =
                "Payment failed.";


              showMessage(
                paymentMessage,
                response?.error?.description ||
                "The payment was not completed. You may try again.",
                "error"
              );


              paymentTestBtn.disabled =
                false;

              paymentTestBtn.textContent =
                "Pay Now";
            }
          );


          razorpay.open();


        } catch (error) {

          console.error(
            "Payment preparation error:",
            error
          );


          paymentStatusText.textContent =
            "Payment could not be started.";


          showMessage(
            paymentMessage,
            error?.message ||
            "Unable to start payment. Please try again.",
            "error"
          );


          paymentTestBtn.disabled =
            false;

          paymentTestBtn.textContent =
            "Pay Now";
        }

      }
    );
  }
    acceptQuoteBtn.addEventListener(
    "click",
    async () => {

      if (!currentQuote?.id) {

        showMessage(
          formMessage,
          "No valid quote is available.",
          "error"
        );

        return;
      }


      acceptQuoteBtn.disabled =
        true;

      acceptQuoteBtn.textContent =
        "Accepting...";

      hideMessage(formMessage);


      try {

        const {
          data,
          error
        } =
          await window.KRIM_SUPABASE
            .rpc(
              "krim_accept_global_quote",
              {
                p_quote_id:
                  currentQuote.id
              }
            );


        if (error) {
          throw error;
        }


        console.log(
          "Quote acceptance result:",
          data
        );


        showMessage(
          formMessage,
          "Quote accepted successfully. Shipment is now confirmed.",
          "success"
        );


        await loadGlobalQuote();


      } catch (error) {

        console.error(
          "Quote acceptance error:",
          error
        );


        showMessage(
          formMessage,
          error?.message ||
          "Unable to accept quote.",
          "error"
        );


        acceptQuoteBtn.disabled =
          false;

        acceptQuoteBtn.textContent =
          "Accept Quote";
      }

    }
  );


  createBtn.addEventListener(
    "click",
    async () => {

      hideMessage(formMessage);


      const amount =
        Number(
          String(
            quoteAmount.textContent || ""
          )
          .replace(/[^\d.]/g, "")
        );


      const currency =
        quoteCurrency.textContent ||
        "INR";


      if (
        !Number.isFinite(amount) ||
        amount <= 0
      ) {

        showMessage(
          formMessage,
          "Enter a valid quote amount before creating a quote.",
          "warning"
        );

        return;
      }


      createBtn.disabled =
        true;

      createBtn.textContent =
        "Creating...";


      try {

        const validUntil =
          new Date(
            Date.now() +
            7 * 24 * 60 * 60 * 1000
          ).toISOString();


        const {
          data,
          error
        } =
          await window.KRIM_SUPABASE
            .rpc(
              "krim_create_global_quote",
              {
                p_shipment_id:
                  shipmentId,

                p_amount:
                  amount,

                p_currency_code:
                  currency,

                p_valid_until:
                  validUntil
              }
            );


        if (error) {
          throw error;
        }


        console.log(
          "Global quote creation result:",
          data
        );


        showMessage(
          formMessage,
          "Quote created successfully.",
          "success"
        );


        await loadGlobalQuote();


      } catch (error) {

        console.error(
          "Global quote creation error:",
          error
        );


        showMessage(
          formMessage,
          error?.message ||
          "Unable to create quote.",
          "error"
        );

      } finally {

        createBtn.disabled =
          false;

        createBtn.textContent =
          "Create Quote";
      }

    }
  );


  clearBtn.addEventListener(
    "click",
    () => {

      hideMessage(formMessage);

      originInput.value = "";
      destinationInput.value = "";
      cargoInput.value = "";
      weightInput.value = "";

    }
  );


  signOutBtn.addEventListener(
    "click",
    async () => {

      signOutBtn.disabled =
        true;

      signOutBtn.textContent =
        "Signing Out...";


      try {

        const {
          error
        } =
          await window.KRIM_SUPABASE.auth
            .signOut();


        if (error) {
          throw error;
        }


        window.location.href =
          "../index.html";


      } catch (error) {

        console.error(
          "Sign out error:",
          error
        );


        signOutBtn.disabled =
          false;

        signOutBtn.textContent =
          "Sign Out";


        showMessage(
          formMessage,
          "Unable to sign out. Please try again.",
          "error"
        );
      }

    }
  );


  try {

    await loadGlobalQuote();

    await loadPaymentStatus();

  } finally {

    pageLoading.style.display =
      "none";

    quoteContent.style.display =
      "block";
  }


});
</script>
