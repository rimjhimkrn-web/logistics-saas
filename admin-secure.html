<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

            <title>KRIM Admin Security</title>

                <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
                    <script src="config.js"></script>

                        <style>
                                body {
                                            font-family: Arial, sans-serif;
                                                        max-width: 500px;
                                                                    margin: 60px auto;
                                                                                padding: 20px;
                                                                                        }

                                                                                                input,
                                                                                                        button {
                                                                                                                    width: 100%;
                                                                                                                                padding: 12px;
                                                                                                                                            margin-top: 12px;
                                                                                                                                                        box-sizing: border-box;
                                                                                                                                                                }

                                                                                                                                                                        button {
                                                                                                                                                                                    cursor: pointer;
                                                                                                                                                                                            }

                                                                                                                                                                                                    #mfaBox {
                                                                                                                                                                                                                display: none;
                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                #message {
                                                                                                                                                                                                                                            margin-top: 15px;
                                                                                                                                                                                                                                                        font-weight: bold;
                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                    </style>
                                                                                                                                                                                                                                                                    </head>

                                                                                                                                                                                                                                                                    <body>

                                                                                                                                                                                                                                                                    <h1>KRIM Admin Security</h1>

                                                                                                                                                                                                                                                                    <p id="status">Checking security...</p>

                                                                                                                                                                                                                                                                    <div id="mfaBox">

                                                                                                                                                                                                                                                                        <h2>MFA Verification</h2>

                                                                                                                                                                                                                                                                            <p>
                                                                                                                                                                                                                                                                                    Enter the 6-digit code from your authenticator app.
                                                                                                                                                                                                                                                                                        </p>

                                                                                                                                                                                                                                                                                            <input
                                                                                                                                                                                                                                                                                                    id="code"
                                                                                                                                                                                                                                                                                                            type="text"
                                                                                                                                                                                                                                                                                                                    inputmode="numeric"
                                                                                                                                                                                                                                                                                                                            maxlength="6"
                                                                                                                                                                                                                                                                                                                                    autocomplete="one-time-code"
                                                                                                                                                                                                                                                                                                                                            placeholder="123456"
                                                                                                                                                                                                                                                                                                                                                >

                                                                                                                                                                                                                                                                                                                                                    <button id="verifyBtn" onclick="verifyMFA()">
                                                                                                                                                                                                                                                                                                                                                            Verify MFA
                                                                                                                                                                                                                                                                                                                                                                </button>

                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                <p id="message"></p>


                                                                                                                                                                                                                                                                                                                                                                <script>

                                                                                                                                                                                                                                                                                                                                                                let factorId = null;
                                                                                                                                                                                                                                                                                                                                                                let challengeId = null;


                                                                                                                                                                                                                                                                                                                                                                /* --------------------------------
                                                                                                                                                                                                                                                                                                                                                                   INITIAL SECURITY CHECK
                                                                                                                                                                                                                                                                                                                                                                   -------------------------------- */

                                                                                                                                                                                                                                                                                                                                                                   async function startSecurity() {

                                                                                                                                                                                                                                                                                                                                                                       const sessionResult =
                                                                                                                                                                                                                                                                                                                                                                               await supabaseClient.auth.getSession();

                                                                                                                                                                                                                                                                                                                                                                                   const session =
                                                                                                                                                                                                                                                                                                                                                                                           sessionResult.data.session;


                                                                                                                                                                                                                                                                                                                                                                                               if (!session) {

                                                                                                                                                                                                                                                                                                                                                                                                       document.getElementById("status").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                   "No active admin session.";

                                                                                                                                                                                                                                                                                                                                                                                                                           document.getElementById("message").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                       "Please login through Admin Login first.";

                                                                                                                                                                                                                                                                                                                                                                                                                                               return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                   }


                                                                                                                                                                                                                                                                                                                                                                                                                                                       /*
                                                                                                                                                                                                                                                                                                                                                                                                                                                              Get MFA factors for the
                                                                                                                                                                                                                                                                                                                                                                                                                                                                     currently logged-in account.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                         */

                                                                                                                                                                                                                                                                                                                                                                                                                                                                             const factorsResult =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     await supabaseClient.auth.mfa.listFactors();


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         if (factorsResult.error) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 document.getElementById("message").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             factorsResult.error.message;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             const factors =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     factorsResult.data.totp || [];


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         const verifiedFactor =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 factors.find(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             factor => factor.status === "verified"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     );


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         if (!verifiedFactor) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 document.getElementById("status").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             "MFA required.";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     document.getElementById("message").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 "No verified MFA factor is available for this account.";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 factorId =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         verifiedFactor.id;


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             /*
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    Check authentication assurance level.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        */

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const aalResult =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    await supabaseClient.auth.mfa
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                .getAuthenticatorAssuranceLevel();


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (aalResult.error) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById("message").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        aalResult.error.message;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const currentLevel =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                aalResult.data.currentLevel;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const nextLevel =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            aalResult.data.nextLevel;


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                /*
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       Already MFA verified.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           */

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               if (currentLevel === "aal2") {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       openAdmin();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       /*
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              MFA is required.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  */

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if (
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              currentLevel === "aal1" &&
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      nextLevel === "aal2"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          ) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  await createChallenge();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  /*
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         Fallback for a session where
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                the current level isn't explicitly
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       reported as aal1.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           */

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               if (
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       currentLevel === null ||
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               currentLevel === undefined
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   ) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           await createChallenge();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           document.getElementById("status").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   "Security verification required.";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       document.getElementById("message").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               "Authentication level: " +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       currentLevel;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       /* --------------------------------
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          CREATE MFA CHALLENGE
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          -------------------------------- */

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          async function createChallenge() {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const challengeResult =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      await supabaseClient.auth.mfa.challenge({
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  factorId: factorId
