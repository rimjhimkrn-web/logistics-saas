<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

            <title>KRIM Admin Security</title>

                <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
                    <script src="config.js"></script>

                        <style>
                                body {
                                            font-family: Arial, sans-serif;
                                                        max-width: 500px;
                                                                    margin: 60px auto;
                                                                                padding: 20px;
                                                                                        }

                                                                                                h1 {
                                                                                                            margin-bottom: 10px;
                                                                                                                    }

                                                                                                                            input,
                                                                                                                                    button {
                                                                                                                                                width: 100%;
                                                                                                                                                            padding: 12px;
                                                                                                                                                                        margin-top: 12px;
                                                                                                                                                                                    box-sizing: border-box;
                                                                                                                                                                                            }

                                                                                                                                                                                                    button {
                                                                                                                                                                                                                cursor: pointer;
                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                #mfaBox {
                                                                                                                                                                                                                                            display: none;
                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                            #message {
                                                                                                                                                                                                                                                                        margin-top: 15px;
                                                                                                                                                                                                                                                                                    font-weight: bold;
                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                </style>
                                                                                                                                                                                                                                                                                                </head>

                                                                                                                                                                                                                                                                                                <body>

                                                                                                                                                                                                                                                                                                <h1>KRIM Admin Security</h1>

                                                                                                                                                                                                                                                                                                <p id="status">Checking security...</p>

                                                                                                                                                                                                                                                                                                <div id="mfaBox">

                                                                                                                                                                                                                                                                                                    <h2>MFA Verification</h2>

                                                                                                                                                                                                                                                                                                        <p>
                                                                                                                                                                                                                                                                                                                Enter the 6-digit code from your authenticator app.
                                                                                                                                                                                                                                                                                                                    </p>

                                                                                                                                                                                                                                                                                                                        <input
                                                                                                                                                                                                                                                                                                                                id="code"
                                                                                                                                                                                                                                                                                                                                        type="text"
                                                                                                                                                                                                                                                                                                                                                inputmode="numeric"
                                                                                                                                                                                                                                                                                                                                                        maxlength="6"
                                                                                                                                                                                                                                                                                                                                                                autocomplete="one-time-code"
                                                                                                                                                                                                                                                                                                                                                                        placeholder="123456"
                                                                                                                                                                                                                                                                                                                                                                            >

                                                                                                                                                                                                                                                                                                                                                                                <button id="verifyBtn" onclick="verifyMFA()">
                                                                                                                                                                                                                                                                                                                                                                                        Verify MFA
                                                                                                                                                                                                                                                                                                                                                                                            </button>

                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                            <p id="message"></p>


                                                                                                                                                                                                                                                                                                                                                                                            <script>

                                                                                                                                                                                                                                                                                                                                                                                            let factorId = null;
                                                                                                                                                                                                                                                                                                                                                                                            let challengeId = null;


                                                                                                                                                                                                                                                                                                                                                                                            /* ================================
                                                                                                                                                                                                                                                                                                                                                                                               START SECURITY CHECK
                                                                                                                                                                                                                                                                                                                                                                                               ================================ */

                                                                                                                                                                                                                                                                                                                                                                                               async function startSecurity() {

                                                                                                                                                                                                                                                                                                                                                                                                   const sessionResult =
                                                                                                                                                                                                                                                                                                                                                                                                           await supabaseClient.auth.getSession();

                                                                                                                                                                                                                                                                                                                                                                                                               const session =
                                                                                                                                                                                                                                                                                                                                                                                                                       sessionResult.data.session;


                                                                                                                                                                                                                                                                                                                                                                                                                           if (!session) {

                                                                                                                                                                                                                                                                                                                                                                                                                                   document.getElementById("status").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                               "No active admin session.";

                                                                                                                                                                                                                                                                                                                                                                                                                                                       document.getElementById("message").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                   "Please login through Admin Login first.";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                           return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                               }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   /*
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          Get MFA factors belonging
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 to the currently logged-in user.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     */

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         const factorsResult =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 await supabaseClient.auth.mfa.listFactors();


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     if (factorsResult.error) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             document.getElementById("status").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         "Security check failed.";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 document.getElementById("message").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             factorsResult.error.message;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             const factors =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     factorsResult.data.totp || [];


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         const verifiedFactor =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 factors.find(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             factor => factor.status === "verified"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     );


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         if (!verifiedFactor) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 document.getElementById("status").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             "MFA required.";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     document.getElementById("message").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 "No verified MFA factor is available for this account.";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 /*
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        Save the verified factor.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            */

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                factorId =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        verifiedFactor.id;


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            /*
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   IMPORTANT:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          Always create a fresh MFA challenge
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 when entering the protected admin area.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     */

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         await createChallenge();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         /* ================================
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            CREATE MFA CHALLENGE
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ================================ */

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            async function createChallenge() {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById("status").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        "Creating MFA challenge...";


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const challengeResult =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    await supabaseClient.auth.mfa.challenge({
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                factorId: factorId
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        });


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (challengeResult.error) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById("status").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "MFA challenge failed.";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("message").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    challengeResult.error.message;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    challengeId =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            challengeResult.data.id;


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById("status").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        "MFA verification required.";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById("mfaBox").style.display =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    "block";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("message").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "Enter your authenticator code.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                /* ================================
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   VERIFY MFA
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   ================================ */

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   async function verifyMFA() {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       const code =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               document.getElementById("code")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           .value
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       .trim();


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           if (!/^[0-9]{6}$/.test(code)) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   document.getElementById("message").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               "Enter exactly 6 digits.";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               if (!factorId || !challengeId) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       document.getElementById("message").textContent =
