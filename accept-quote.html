<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <title>KRIM Logistics - Accept Quote</title>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
          <script src="config.js"></script>

            <style>
                body {
                      font-family: Arial, sans-serif;
                            background: #f4f7fb;
                                  margin: 0;
                                        padding: 20px;
                                            }

                                                .box {
                                                      max-width: 500px;
                                                            margin: 40px auto;
                                                                  background: white;
                                                                        padding: 25px;
                                                                              border-radius: 14px;
                                                                                    box-shadow: 0 4px 18px rgba(0,0,0,0.08);
                                                                                        }

                                                                                            h1 {
                                                                                                  color: #102a43;
                                                                                                      }

                                                                                                          .row {
                                                                                                                margin: 15px 0;
                                                                                                                      padding: 14px;
                                                                                                                            background: #f7f9fc;
                                                                                                                                  border-radius: 8px;
                                                                                                                                      }

                                                                                                                                          .label {
                                                                                                                                                color: #666;
                                                                                                                                                      font-size: 13px;
                                                                                                                                                          }

                                                                                                                                                              .value {
                                                                                                                                                                    margin-top: 5px;
                                                                                                                                                                          font-size: 18px;
                                                                                                                                                                                font-weight: bold;
                                                                                                                                                                                      color: #102a43;
                                                                                                                                                                                          }

                                                                                                                                                                                              button {
                                                                                                                                                                                                    width: 100%;
                                                                                                                                                                                                          padding: 14px;
                                                                                                                                                                                                                margin-top: 15px;
                                                                                                                                                                                                                      border: none;
                                                                                                                                                                                                                            border-radius: 8px;
                                                                                                                                                                                                                                  background: #102a43;
                                                                                                                                                                                                                                        color: white;
                                                                                                                                                                                                                                              font-size: 16px;
                                                                                                                                                                                                                                                    cursor: pointer;
                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                            button:disabled {
                                                                                                                                                                                                                                                                  background: #999;
                                                                                                                                                                                                                                                                        cursor: not-allowed;
                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                #message {
                                                                                                                                                                                                                                                                                      margin-top: 15px;
                                                                                                                                                                                                                                                                                            font-weight: bold;
                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                  </style>
                                                                                                                                                                                                                                                                                                  </head>

                                                                                                                                                                                                                                                                                                  <body>

                                                                                                                                                                                                                                                                                                  <div class="box">

                                                                                                                                                                                                                                                                                                    <h1>Accept Quotation</h1>

                                                                                                                                                                                                                                                                                                      <div class="row">
                                                                                                                                                                                                                                                                                                          <div class="label">Tracking Number</div>
                                                                                                                                                                                                                                                                                                              <div class="value" id="tracking">Loading...</div>
                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                  <div class="row">
                                                                                                                                                                                                                                                                                                                      <div class="label">Quotation</div>
                                                                                                                                                                                                                                                                                                                          <div class="value" id="price">Loading...</div>
                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                              <div class="row">
                                                                                                                                                                                                                                                                                                                                  <div class="label">Current Status</div>
                                                                                                                                                                                                                                                                                                                                      <div class="value" id="status">Loading...</div>
                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                          <button id="acceptButton" onclick="acceptQuote()" disabled>
                                                                                                                                                                                                                                                                                                                                              Accept Quote
                                                                                                                                                                                                                                                                                                                                                </button>

                                                                                                                                                                                                                                                                                                                                                  <div id="message"></div>

                                                                                                                                                                                                                                                                                                                                                  </div>

                                                                                                                                                                                                                                                                                                                                                  <script>

                                                                                                                                                                                                                                                                                                                                                  const params = new URLSearchParams(window.location.search);

                                                                                                                                                                                                                                                                                                                                                  const trackingNumber =
                                                                                                                                                                                                                                                                                                                                                    params.get("tracking") || "TRK-000014";

                                                                                                                                                                                                                                                                                                                                                    const trackingEl = document.getElementById("tracking");
                                                                                                                                                                                                                                                                                                                                                    const priceEl = document.getElementById("price");
                                                                                                                                                                                                                                                                                                                                                    const statusEl = document.getElementById("status");
                                                                                                                                                                                                                                                                                                                                                    const button = document.getElementById("acceptButton");
                                                                                                                                                                                                                                                                                                                                                    const message = document.getElementById("message");

                                                                                                                                                                                                                                                                                                                                                    let shipmentId = null;

                                                                                                                                                                                                                                                                                                                                                    trackingEl.innerText = trackingNumber;


                                                                                                                                                                                                                                                                                                                                                    async function loadQuote() {

                                                                                                                                                                                                                                                                                                                                                      message.innerText = "Loading quotation...";

                                                                                                                                                                                                                                                                                                                                                        try {

                                                                                                                                                                                                                                                                                                                                                            const { data, error } = await supabaseClient
                                                                                                                                                                                                                                                                                                                                                                  .from("shipment_requests")
                                                                                                                                                                                                                                                                                                                                                                        .select(`
                                                                                                                                                                                                                                                                                                                                                                                id,
                                                                                                                                                                                                                                                                                                                                                                                        tracking_number,
                                                                                                                                                                                                                                                                                                                                                                                                quoted_price,
                                                                                                                                                                                                                                                                                                                                                                                                        quote_status
                                                                                                                                                                                                                                                                                                                                                                                                              `)
                                                                                                                                                                                                                                                                                                                                                                                                                    .eq("tracking_number", trackingNumber)
                                                                                                                                                                                                                                                                                                                                                                                                                          .maybeSingle();

                                                                                                                                                                                                                                                                                                                                                                                                                              if (error) {
                                                                                                                                                                                                                                                                                                                                                                                                                                    console.error(error);

                                                                                                                                                                                                                                                                                                                                                                                                                                          message.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                  "Error loading quotation: " + error.message;

                                                                                                                                                                                                                                                                                                                                                                                                                                                        return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!data) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                      message.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              "Shipment not found.";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            console.log("QUOTE DATA:", data);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                shipmentId = data.id;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    priceEl.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          data.quoted_price !== null
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  ? "₹" + Number(data.quoted_price).toLocaleString("en-IN")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          : "Not quoted";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              statusEl.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    data.quote_status || "pending";


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              Number(data.quoted_price) > 0 &&
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    String(data.quote_status || "").toLowerCase() === "sent"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              button.disabled = false;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    message.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            "Your quotation is ready for acceptance.";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    else if (
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          String(data.quote_status || "").toLowerCase() === "accepted"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              ) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    button.disabled = true;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          message.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  "Quotation already accepted.";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          else {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                button.disabled = true;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      message.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              "Quotation is not ready for acceptance.";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    } catch (err) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        console.error(err);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            message.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  "Error: " + err.message;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    async function acceptQuote() {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if (!shipmentId) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          message.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "Shipment information is not loaded.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        button.disabled = true;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          button.innerText = "Accepting...";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            message.innerText = "Saving acceptance...";


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              try {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  /*
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        IMPORTANT:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              Update the exact shipment by ID.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  */

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const { data, error } = await supabaseClient
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .from("shipment_requests")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  .update({
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          quote_status: "accepted"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                })
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      .eq("id", shipmentId)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .select(`
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    id,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            tracking_number,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    quoted_price,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            quote_status
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  `)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        .single();


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (error) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  console.error("ACCEPT ERROR:", error);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        message.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "Acceptance failed: " + error.message;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      button.disabled = false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            button.innerText = "Accept Quote";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          console.log("UPDATED QUOTE:", data);


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              /*
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    VERIFY that Supabase actually returned accepted.
