<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Accept Quotation - KRIM Logistics">

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
          <script src="config.js"></script>

            <style>
                body {
                      font-family: Arial, sans-serif;
                            background: #f4f7fb;
                                  padding: 30px 15px;
                                      }

                                          .box {
                                                max-width: 450px;
                                                      margin: auto;
                                                            background: white;
                                                                  padding: 25px;
                                                                        border-radius: 15px;
                                                                            }

                                                                                h2 {
                                                                                      color: #0b1f3a;
                                                                                          }

                                                                                              p {
                                                                                                    font-size: 16px;
                                                                                                          margin: 15px 0;
                                                                                                              }

                                                                                                                  button {
                                                                                                                        width: 100%;
                                                                                                                              padding: 14px;
                                                                                                                                    background: #0b1f3a;
                                                                                                                                          color: white;
                                                                                                                                                border: none;
                                                                                                                                                      border-radius: 8px;
                                                                                                                                                            font-size: 16px;
                                                                                                                                                                  cursor: pointer;
                                                                                                                                                                      }

                                                                                                                                                                          button:disabled {
                                                                                                                                                                                opacity: 0.6;
                                                                                                                                                                                    }

                                                                                                                                                                                        #message {
                                                                                                                                                                                              margin-top: 15px;
                                                                                                                                                                                                    font-weight: bold;
                                                                                                                                                                                                        }
                                                                                                                                                                                                          </style>
                                                                                                                                                                                                          </head>

                                                                                                                                                                                                          <body>

                                                                                                                                                                                                          <div class="box">

                                                                                                                                                                                                            <h2>Accept Quotation</h2>

                                                                                                                                                                                                              <p>
                                                                                                                                                                                                                  <b>Tracking Number:</b>
                                                                                                                                                                                                                      <span id="tracking">Loading...</span>
                                                                                                                                                                                                                        </p>

                                                                                                                                                                                                                          <p>
                                                                                                                                                                                                                              <b>Quotation:</b>
                                                                                                                                                                                                                                  ₹<span id="price">Loading...</span>
                                                                                                                                                                                                                                    </p>

                                                                                                                                                                                                                                      <p>
                                                                                                                                                                                                                                          <b>Current Status:</b>
                                                                                                                                                                                                                                              <span id="status">Loading...</span>
                                                                                                                                                                                                                                                </p>

                                                                                                                                                                                                                                                  <button id="acceptBtn" onclick="acceptQuote()" disabled>
                                                                                                                                                                                                                                                      Accept Quote
                                                                                                                                                                                                                                                        </button>

                                                                                                                                                                                                                                                          <div id="message"></div>

                                                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                                                          <script>

                                                                                                                                                                                                                                                          let shipmentId = null;
                                                                                                                                                                                                                                                          let trackingNumber = null;

                                                                                                                                                                                                                                                          async function loadShipment() {

                                                                                                                                                                                                                                                            const params = new URLSearchParams(window.location.search);

                                                                                                                                                                                                                                                              trackingNumber = params.get("tracking") || "TRK-000014";

                                                                                                                                                                                                                                                                document.getElementById("tracking").innerText = trackingNumber;

                                                                                                                                                                                                                                                                  const { data, error } = await supabaseClient
                                                                                                                                                                                                                                                                      .from("shipment_requests")
                                                                                                                                                                                                                                                                          .select("id,tracking_number,quoted_price,quote_status")
                                                                                                                                                                                                                                                                              .eq("tracking_number", trackingNumber)
                                                                                                                                                                                                                                                                                  .single();

                                                                                                                                                                                                                                                                                    if (error) {
                                                                                                                                                                                                                                                                                        document.getElementById("message").innerText =
                                                                                                                                                                                                                                                                                              "Error: " + error.message;
                                                                                                                                                                                                                                                                                                  return;
                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                      shipmentId = data.id;

                                                                                                                                                                                                                                                                                                        document.getElementById("price").innerText =
                                                                                                                                                                                                                                                                                                            Number(data.quoted_price).toLocaleString("en-IN");

                                                                                                                                                                                                                                                                                                              document.getElementById("status").innerText =
                                                                                                                                                                                                                                                                                                                  data.quote_status;

                                                                                                                                                                                                                                                                                                                    if (data.quote_status === "sent") {
                                                                                                                                                                                                                                                                                                                        document.getElementById("acceptBtn").disabled = false;
                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                          }


                                                                                                                                                                                                                                                                                                                          async function acceptQuote() {

                                                                                                                                                                                                                                                                                                                            const button = document.getElementById("acceptBtn");

                                                                                                                                                                                                                                                                                                                              button.disabled = true;
                                                                                                                                                                                                                                                                                                                                button.innerText = "Accepting...";

                                                                                                                                                                                                                                                                                                                                  const { data, error } = await supabaseClient.rpc(
                                                                                                                                                                                                                                                                                                                                      "accept_shipment_quote",
                                                                                                                                                                                                                                                                                                                                          {
                                                                                                                                                                                                                                                                                                                                                p_shipment_id: shipmentId
                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                      );

                                                                                                                                                                                                                                                                                                                                                        if (error) {

                                                                                                                                                                                                                                                                                                                                                            document.getElementById("message").innerText =
                                                                                                                                                                                                                                                                                                                                                                  "Acceptance failed: " + error.message;

                                                                                                                                                                                                                                                                                                                                                                      button.disabled = false;
                                                                                                                                                                                                                                                                                                                                                                          button.innerText = "Accept Quote";

                                                                                                                                                                                                                                                                                                                                                                              return;
                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                  document.getElementById("status").innerText = "accepted";

                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById("message").innerText =
                                                                                                                                                                                                                                                                                                                                                                                        "Quotation accepted successfully!";

                                                                                                                                                                                                                                                                                                                                                                                          button.innerText = "Accepted";

                                                                                                                                                                                                                                                                                                                                                                                          }


                                                                                                                                                                                                                                                                                                                                                                                          loadShipment();

                                                                                                                                                                                                                                                                                                                                                                                          </script>

                                                                                                                                                                                                                                                                                                                                                                                          </body>
                                                                                                                                                                                                                                                                                                                                                                                          </html>
