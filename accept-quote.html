<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

      <title>Accept Quote - KRIM Logistics</title>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
          <script src="config.js"></script>
          </head>

          <body>

          <h2>Accept Quotation</h2>

          <p>
            Tracking Number:
              <b id="tracking">TRK-000014</b>
              </p>

              <p>
                Quotation:
                  <b>₹5,000</b>
                  </p>

                  <p>
                    Current Status:
                      <b id="status">sent</b>
                      </p>

                      <button id="button" onclick="acceptQuote()">
                        Accept Quote
                        </button>

                        <p id="message"></p>

                        <script>

                        async function acceptQuote() {

                          document.getElementById("button").disabled = true;

                            const { data: shipment, error: findError } =
                                await supabaseClient
                                      .from("shipment_requests")
                                            .select("id")
                                                  .eq("tracking_number", "TRK-000014")
                                                        .single();

                                                          if (findError) {
                                                              document.getElementById("message").innerText =
                                                                    "Error: " + findError.message;
                                                                        return;
                                                                          }

                                                                            const { data, error } =
                                                                                await supabaseClient.rpc(
                                                                                      "accept_shipment_quote",
                                                                                            {
                                                                                                    p_shipment_id: shipment.id
                                                                                                          }
                                                                                                              );

                                                                                                                if (error) {
                                                                                                                    document.getElementById("message").innerText =
                                                                                                                          "Error: " + error.message;
                                                                                                                              return;
                                                                                                                                }

                                                                                                                                  if (data === true) {

                                                                                                                                      document.getElementById("status").innerText =
                                                                                                                                            "accepted";

                                                                                                                                                document.getElementById("message").innerText =
                                                                                                                                                      "Quotation accepted successfully!";

                                                                                                                                                          document.getElementById("button").innerText =
                                                                                                                                                                "Accepted";

                                                                                                                                                                  } else {

                                                                                                                                                                      document.getElementById("message").innerText =
                                                                                                                                                                            "Quotation could not be accepted.";

                                                                                                                                                                                document.getElementById("button").disabled = false;
                                                                                                                                                                                  }

                                                                                                                                                                                  }

                                                                                                                                                                                  </script>

                                                                                                                                                                                  </body>
                                                                                                                                                                                  </html>
