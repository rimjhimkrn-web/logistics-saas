<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>KRIM Logistics - Accept Quote</title>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
          <script src="config.js"></script>

            <style>
                body {
                      font-family: Arial, sans-serif;
                            background: #f4f7fb;
                                  padding: 20px;
                                      }

                                          .box {
                                                max-width: 500px;
                                                      margin: 50px auto;
                                                            background: white;
                                                                  padding: 25px;
                                                                        border-radius: 12px;
                                                                              text-align: center;
                                                                                    box-shadow: 0 4px 15px rgba(0,0,0,.08);
                                                                                        }

                                                                                            button {
                                                                                                  width: 100%;
                                                                                                        padding: 14px;
                                                                                                              background: #102a43;
                                                                                                                    color: white;
                                                                                                                          border: 0;
                                                                                                                                border-radius: 7px;
                                                                                                                                      font-size: 16px;
                                                                                                                                            cursor: pointer;
                                                                                                                                                }

                                                                                                                                                    #message {
                                                                                                                                                          margin: 20px 0;
                                                                                                                                                                font-weight: bold;
                                                                                                                                                                    }
                                                                                                                                                                      </style>
                                                                                                                                                                      </head>

                                                                                                                                                                      <body>

                                                                                                                                                                      <div class="box">

                                                                                                                                                                        <h1>Accept Quotation</h1>

                                                                                                                                                                          <p>Tracking Number</p>
                                                                                                                                                                            <h2 id="tracking">Loading...</h2>

                                                                                                                                                                              <p>Quoted Price</p>
                                                                                                                                                                                <h2 id="price">₹0</h2>

                                                                                                                                                                                  <button id="acceptBtn">Accept Quote</button>

                                                                                                                                                                                    <div id="message"></div>

                                                                                                                                                                                    </div>

                                                                                                                                                                                    <script>

                                                                                                                                                                                    const client = supabaseClient;

                                                                                                                                                                                    let shipmentId = null;
                                                                                                                                                                                    let trackingNumber = null;

                                                                                                                                                                                    async function loadShipment() {

                                                                                                                                                                                      const params = new URLSearchParams(window.location.search);

                                                                                                                                                                                        trackingNumber = params.get("tracking") || "TRK-000014";

                                                                                                                                                                                          document.getElementById("tracking").innerText = trackingNumber;

                                                                                                                                                                                            const { data, error } = await client
                                                                                                                                                                                                .from("shipment_requests")
                                                                                                                                                                                                    .select("id,tracking_number,quoted_price,quote_status")
                                                                                                                                                                                                        .eq("tracking_number", trackingNumber)
                                                                                                                                                                                                            .maybeSingle();

                                                                                                                                                                                                              if (error) {
                                                                                                                                                                                                                  document.getElementById("message").innerText =
                                                                                                                                                                                                                        "Error: " + error.message;
                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                if (!data) {
                                                                                                                                                                                                                                    document.getElementById("message").innerText =
                                                                                                                                                                                                                                          "Shipment not found.";
                                                                                                                                                                                                                                              return;
                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                  shipmentId = data.id;

                                                                                                                                                                                                                                                    document.getElementById("price").innerText =
                                                                                                                                                                                                                                                        data.quoted_price
                                                                                                                                                                                                                                                              ? "₹" + Number(data.quoted_price).toLocaleString("en-IN")
                                                                                                                                                                                                                                                                    : "Price not available";

                                                                                                                                                                                                                                                                      if (data.quote_status === "accepted") {
                                                                                                                                                                                                                                                                          document.getElementById("message").innerText =
                                                                                                                                                                                                                                                                                "Quotation already accepted.";

                                                                                                                                                                                                                                                                                    document.getElementById("acceptBtn").innerText =
                                                                                                                                                                                                                                                                                          "Proceed to Payment";
                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                            }


                                                                                                                                                                                                                                                                                            document.getElementById("acceptBtn").onclick = async function() {

                                                                                                                                                                                                                                                                                              const button = document.getElementById("acceptBtn");
                                                                                                                                                                                                                                                                                                const message = document.getElementById("message");

                                                                                                                                                                                                                                                                                                  button.disabled = true;
                                                                                                                                                                                                                                                                                                    button.innerText = "Processing...";
                                                                                                                                                                                                                                                                                                      message.innerText = "";

                                                                                                                                                                                                                                                                                                        if (!shipmentId) {
                                                                                                                                                                                                                                                                                                            message.innerText = "Shipment not loaded.";
                                                                                                                                                                                                                                                                                                                button.disabled = false;
                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                        const { error } = await client
                                                                                                                                                                                                                                                                                                                            .from("shipment_requests")
                                                                                                                                                                                                                                                                                                                                .update({
                                                                                                                                                                                                                                                                                                                                      quote_status: "accepted"
                                                                                                                                                                                                                                                                                                                                          })
                                                                                                                                                                                                                                                                                                                                              .eq("id", shipmentId);

                                                                                                                                                                                                                                                                                                                                                if (error) {
                                                                                                                                                                                                                                                                                                                                                    message.innerText =
                                                                                                                                                                                                                                                                                                                                                          "Could not accept quote: " + error.message;

                                                                                                                                                                                                                                                                                                                                                              button.disabled = false;
                                                                                                                                                                                                                                                                                                                                                                  button.innerText = "Accept Quote";
                                                                                                                                                                                                                                                                                                                                                                      return;
                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                          message.innerText = "Quotation accepted successfully!";

                                                                                                                                                                                                                                                                                                                                                                            setTimeout(function() {

                                                                                                                                                                                                                                                                                                                                                                                window.location.href =
                                                                                                                                                                                                                                                                                                                                                                                      "payment.html?tracking=" +
                                                                                                                                                                                                                                                                                                                                                                                            encodeURIComponent(trackingNumber);

                                                                                                                                                                                                                                                                                                                                                                                              }, 800);

                                                                                                                                                                                                                                                                                                                                                                                              };


                                                                                                                                                                                                                                                                                                                                                                                              loadShipment();

                                                                                                                                                                                                                                                                                                                                                                                              </script>

                                                                                                                                                                                                                                                                                                                                                                                              </body>
                                                                                                                                                                                                                                                                                                                                                                                              </html>
