<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Accept Quote - KRIM Logistics</title>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
          <script src="config.js"></script>
          </head>

          <body>

            <h2>Shipment Quotation</h2>

              <p>Tracking Number:</p>

                <input
                    id="tracking"
                        type="text"
                            placeholder="TRK-000014"
                              >

                                <br><br>

                                  <button id="acceptBtn" onclick="acceptQuote()">
                                      Accept Quote
                                        </button>

                                          <p id="message"></p>

                                          <script>

                                          async function acceptQuote() {

                                            const message = document.getElementById("message");
                                              const button = document.getElementById("acceptBtn");

                                                const tracking =
                                                    document.getElementById("tracking").value.trim().toUpperCase();

                                                      if (!tracking) {
                                                          message.textContent = "Please enter tracking number.";
                                                              return;
                                                                }

                                                                  button.disabled = true;
                                                                    button.textContent = "Processing...";

                                                                      try {

                                                                          const { data: authData, error: authError } =
                                                                                await supabaseClient.auth.getUser();

                                                                                    if (authError) throw authError;

                                                                                        const user = authData.user;

                                                                                            if (!user) {
                                                                                                  message.textContent = "Please login first.";
                                                                                                        button.disabled = false;
                                                                                                              button.textContent = "Accept Quote";
                                                                                                                    return;
                                                                                                                        }

                                                                                                                            const { data: shipment, error: shipmentError } =
                                                                                                                                  await supabaseClient
                                                                                                                                          .from("shipment_requests")
                                                                                                                                                  .select("id, tracking_number, quoted_price, quote_status")
                                                                                                                                                          .eq("tracking_number", tracking)
                                                                                                                                                                  .eq("customer_id", user.id)
                                                                                                                                                                          .single();

                                                                                                                                                                              if (shipmentError) throw shipmentError;

                                                                                                                                                                                  if (shipment.quote_status !== "sent") {
                                                                                                                                                                                        message.textContent =
                                                                                                                                                                                                "Quote cannot be accepted. Current status: " +
                                                                                                                                                                                                        shipment.quote_status;

                                                                                                                                                                                                              button.disabled = false;
                                                                                                                                                                                                                    button.textContent = "Accept Quote";
                                                                                                                                                                                                                          return;
                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                  const { data, error } =
                                                                                                                                                                                                                                        await supabaseClient.rpc(
                                                                                                                                                                                                                                                "accept_shipment_quote",
                                                                                                                                                                                                                                                        {
                                                                                                                                                                                                                                                                  p_shipment_id: shipment.id
                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                );

                                                                                                                                                                                                                                                                                    if (error) throw error;

                                                                                                                                                                                                                                                                                        message.textContent =
                                                                                                                                                                                                                                                                                              "Quote accepted. Opening secure payment...";

                                                                                                                                                                                                                                                                                                  setTimeout(function () {

                                                                                                                                                                                                                                                                                                        window.location.href =
                                                                                                                                                                                                                                                                                                                "payment-secure.html?tracking=" +
                                                                                                                                                                                                                                                                                                                        encodeURIComponent(shipment.tracking_number);

                                                                                                                                                                                                                                                                                                                            }, 700);

                                                                                                                                                                                                                                                                                                                              } catch (error) {

                                                                                                                                                                                                                                                                                                                                  console.error(error);

                                                                                                                                                                                                                                                                                                                                      message.textContent =
                                                                                                                                                                                                                                                                                                                                            "Error: " + error.message;

                                                                                                                                                                                                                                                                                                                                                button.disabled = false;
                                                                                                                                                                                                                                                                                                                                                    button.textContent = "Accept Quote";
                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                      </script>

                                                                                                                                                                                                                                                                                                                                                      </body>
                                                                                                                                                                                                                                                                                                                                                      </html>
