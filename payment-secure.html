<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KRIM Logistics - Shipment Payment</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
    font-family:Arial,sans-serif;
      background:#f4f7fb;
        color:#222;
        }

        header{
          background:#071a33;
            color:white;
              padding:18px 20px;
              }

              .header-inner{
                max-width:1000px;
                  margin:auto;
                    display:flex;
                      justify-content:space-between;
                        align-items:center;
                        }

                        .logo{
                          font-size:22px;
                            font-weight:bold;
                            }

                            .workspace{
                              color:white;
                                text-decoration:none;
                                  font-size:14px;
                                  }

                                  main{
                                    max-width:600px;
                                      margin:50px auto;
                                        padding:0 20px;
                                        }

                                        .card{
                                          background:white;
                                            border-radius:12px;
                                              padding:30px;
                                                box-shadow:0 5px 20px rgba(0,0,0,.08);
                                                }

                                                h1{
                                                  margin-top:0;
                                                    color:#071a33;
                                                    }

                                                    .row{
                                                      display:flex;
                                                        justify-content:space-between;
                                                          padding:14px 0;
                                                            border-bottom:1px solid #eee;
                                                            }

                                                            .label{
                                                              color:#666;
                                                              }

                                                              .value{
                                                                font-weight:bold;
                                                                  text-align:right;
                                                                  }

                                                                  .amount{
                                                                    font-size:24px;
                                                                      color:#071a33;
                                                                      }

                                                                      button{
                                                                        width:100%;
                                                                          margin-top:25px;
                                                                            padding:15px;
                                                                              border:0;
                                                                                border-radius:8px;
                                                                                  background:#071a33;
                                                                                    color:white;
                                                                                      font-size:17px;
                                                                                        font-weight:bold;
                                                                                        }

                                                                                        button:disabled{
                                                                                          background:#999;
                                                                                          }

                                                                                          #message{
                                                                                            display:none;
                                                                                              margin-top:20px;
                                                                                                padding:12px;
                                                                                                  text-align:center;
                                                                                                    line-height:1.6;
                                                                                                    }

                                                                                                    footer{
                                                                                                      text-align:center;
                                                                                                        padding:30px;
                                                                                                          color:#777;
                                                                                                            font-size:13px;
                                                                                                            }
                                                                                                            </style>
                                                                                                            </head>

                                                                                                            <body>

                                                                                                            <header>
                                                                                                              <div class="header-inner">
                                                                                                                  <div class="logo">KRIM Logistics</div>
                                                                                                                      <a class="workspace" href="customer-workspace.html">
                                                                                                                            Customer Workspace
                                                                                                                                </a>
                                                                                                                                  </div>
                                                                                                                                  </header>

                                                                                                                                  <main>

                                                                                                                                  <div class="card">

                                                                                                                                  <h1>Shipment Payment</h1>

                                                                                                                                  <div class="row">
                                                                                                                                    <span class="label">Tracking Number</span>
                                                                                                                                      <span class="value">TRK-000014</span>
                                                                                                                                      </div>

                                                                                                                                      <div class="row">
                                                                                                                                        <span class="label">Pickup</span>
                                                                                                                                          <span class="value">Ranchi</span>
                                                                                                                                          </div>

                                                                                                                                          <div class="row">
                                                                                                                                            <span class="label">Delivery</span>
                                                                                                                                              <span class="value">Delhi</span>
                                                                                                                                              </div>

                                                                                                                                              <div class="row">
                                                                                                                                                <span class="label">Quotation</span>
                                                                                                                                                  <span class="value amount">₹5,000</span>
                                                                                                                                                  </div>

                                                                                                                                                  <div class="row">
                                                                                                                                                    <span class="label">Payment Status</span>
                                                                                                                                                      <span class="value" id="status">
                                                                                                                                                          Ready for Payment
                                                                                                                                                            </span>
                                                                                                                                                            </div>

                                                                                                                                                            <button id="payButton" onclick="payNow()">
                                                                                                                                                              Pay ₹5,000
                                                                                                                                                              </button>

                                                                                                                                                              <div id="message"></div>

                                                                                                                                                              </div>

                                                                                                                                                              </main>

                                                                                                                                                              <footer>
                                                                                                                                                              © 2026 KRIM Logistics — Global Logistics Platform
                                                                                                                                                              </footer>


                                                                                                                                                              <script>

                                                                                                                                                              const TRACKING = "TRK-000014";
                                                                                                                                                              const RAZORPAY_KEY = "rzp_test_TYjnGVeCidh3SI";

                                                                                                                                                              const button = document.getElementById("payButton");
                                                                                                                                                              const status = document.getElementById("status");
                                                                                                                                                              const message = document.getElementById("message");


                                                                                                                                                              function showMessage(text){

                                                                                                                                                                message.style.display = "block";
                                                                                                                                                                  message.innerHTML = text;

                                                                                                                                                                  }


                                                                                                                                                                  async function payNow(){

                                                                                                                                                                    button.disabled = true;
                                                                                                                                                                      button.innerText = "Preparing Payment...";
                                                                                                                                                                        status.innerText = "Preparing";


                                                                                                                                                                          try{

                                                                                                                                                                              /* GET CURRENT CUSTOMER LOGIN */

                                                                                                                                                                                  const {
                                                                                                                                                                                        data: sessionData,
                                                                                                                                                                                              error: sessionError
                                                                                                                                                                                                  } = await supabaseClient.auth.getSession();


                                                                                                                                                                                                      if(sessionError){
                                                                                                                                                                                                            throw sessionError;
                                                                                                                                                                                                                }


                                                                                                                                                                                                                    const session = sessionData.session;


                                                                                                                                                                                                                        if(!session){

                                                                                                                                                                                                                              throw new Error(
                                                                                                                                                                                                                                      "Please login to your Customer Workspace first."
                                                                                                                                                                                                                                            );

                                                                                                                                                                                                                                                }


                                                                                                                                                                                                                                                    /* CREATE RAZORPAY ORDER */

                                                                                                                                                                                                                                                        status.innerText = "Creating Order";


                                                                                                                                                                                                                                                            const {
                                                                                                                                                                                                                                                                  data: order,
                                                                                                                                                                                                                                                                        error: orderError
                                                                                                                                                                                                                                                                            } = await supabaseClient.functions.invoke(
                                                                                                                                                                                                                                                                                  "create-razorpay-order",
                                                                                                                                                                                                                                                                                        {
                                                                                                                                                                                                                                                                                                body:{
                                                                                                                                                                                                                                                                                                          tracking_number: TRACKING
                                                                                                                                                                                                                                                                                                                  },
                                                                                                                                                                                                                                                                                                                          headers:{
                                                                                                                                                                                                                                                                                                                                    Authorization:
                                                                                                                                                                                                                                                                                                                                                "Bearer " + session.access_token
                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                  );


                                                                                                                                                                                                                                                                                                                                                                      if(orderError){

                                                                                                                                                                                                                                                                                                                                                                            throw new Error(
                                                                                                                                                                                                                                                                                                                                                                                    orderError.message
                                                                                                                                                                                                                                                                                                                                                                                          );

                                                                                                                                                                                                                                                                                                                                                                                              }


                                                                                                                                                                                                                                                                                                                                                                                                  if(!order || !order.success){

                                                                                                                                                                                                                                                                                                                                                                                                        throw new Error(
                                                                                                                                                                                                                                                                                                                                                                                                                order?.error ||
                                                                                                                                                                                                                                                                                                                                                                                                                        "Razorpay order was not created."
                                                                                                                                                                                                                                                                                                                                                                                                                              );

                                                                                                                                                                                                                                                                                                                                                                                                                                  }


                                                                                                                                                                                                                                                                                                                                                                                                                                      /* OPEN RAZORPAY */

                                                                                                                                                                                                                                                                                                                                                                                                                                          status.innerText = "Ready for Payment";
                                                                                                                                                                                                                                                                                                                                                                                                                                              button.innerText = "Opening Payment...";


                                                                                                                                                                                                                                                                                                                                                                                                                                                  const razorpay = new Razorpay({

                                                                                                                                                                                                                                                                                                                                                                                                                                                        key: RAZORPAY_KEY,

                                                                                                                                                                                                                                                                                                                                                                                                                                                              amount: order.amount,

                                                                                                                                                                                                                                                                                                                                                                                                                                                                    currency: order.currency || "INR",

                                                                                                                                                                                                                                                                                                                                                                                                                                                                          name: "KRIM Logistics",

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                description:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        "Shipment Payment - " + TRACKING,

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              order_id: order.order_id,


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    handler: async function(response){

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            try{

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      status.innerText = "Verifying Payment";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                button.innerText = "Verifying...";


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          /* SEND PAYMENT TO SUPABASE */

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                data: result,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            error: verifyError
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      } = await supabaseClient.functions.invoke(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  "verify-razorpay-payment",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            body:{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            razorpay_payment_id:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              response.razorpay_payment_id,

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              razorpay_order_id:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                response.razorpay_order_id,

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                razorpay_signature:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  response.razorpay_signature
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                },

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              headers:{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              Authorization:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "Bearer " + session.access_token
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    );


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if(verifyError){

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          throw new Error(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        verifyError.message
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if(!result || !result.success){

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    throw new Error(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  result?.error ||
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "Payment verification failed."
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                /* SUCCESS */

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          status.innerText = "Payment Completed";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    button.innerText = "Payment Completed";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              showMessage(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          "Payment successful and verified.<br><br>" +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      "Payment ID: " +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  response.razorpay_payment_id
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            );


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }catch(error){

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              console.error(error);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        status.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    "Verification Failed";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              button.disabled = false;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        button.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    "Try Again";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              showMessage(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          "Payment was completed, but KRIM could not verify it.<br><br>" +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      error.message
