        <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

          <style>

                                                                                                                            .logo {
                                                                                                                                  font-size: 22px;

                                                                                                                                            }

                                                                                                                                                .workspace {
                                                                                                                                                      color: white;

                                                                                                                                                                  font-size: 14px;
                                                                                                                                                                      }

                                                                                                                                                                          main {
                                                                                                                                                                                max-width: 600px;
                                                                                                                                                                                      margin: 50px auto;
                                                                                                                                                                                            padding: 0 20px;
                                                                                                                                                                                                }

                                                                                                                                                                                                    .card {
                                                                                                                                                                                                          background: white;
                                                                                                                                                                                                                border-radius: 12px;

                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                    h1 {
                                                                                                                                                                                                                                          margin-top: 0;
                                                                                                                                                                                                                                                color: #071a33;
                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                        .row {
                                                                                                                                                                                                                                                              display: flex;
                                                                                                                                                                                                                                                                    justify-content: space-between;
                                                                                                                                                                                                                                                                          padding: 14px 0;
                                                                                                                                                                                                                                                                                border-bottom: 1px solid #eee;
                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                        .label {
                                                                                                                                                                                                                                                                                              color: #666;
                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                      .value {
                                                                                                                                                                                                                                                                                                            font-weight: bold;
                                                                                                                                                                                                                                                                                                                  text-align: right;
                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                          .amount {
                                                                                                                                                                                                                                                                                                                                font-size: 24px;
                                                                                                                                                                                                                                                                                                                                      color: #071a33;
                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                              button {
                                                                                                                                                                                                                                                                                                                                                    width: 100%;
                                                                                                                                                                                                                                                                                                                                                          margin-top: 25px;
                                                                                                                                                                                                                                                                                                                                                                padding: 15px;
                                                                                                                                                                                                                                                                                                                                                                      border: none;
                                                                                                                                                                                                                                                                                                                                                                            border-radius: 8px;
                                                                                                                                                                                                                                                                                                                                                                                  background: #071a33;
                                                                                                                                                                                                                                                                                                                                                                                        color: white;
                                                                                                                                                                                                                                                                                                                                                                                              font-size: 17px;
                                                                                                                                                                                                                                                                                                                                                                                                    font-weight: bold;
                                                                                                                                                                                                                                                                                                                                                                                                          cursor: pointer;
                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                  button:disabled {
                                                                                                                                                                                                                                                                                                                                                                                                                        background: #999;
                                                                                                                                                                                                                                                                                                                                                                                                                              cursor: not-allowed;
                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                      #message {
                                                                                                                                                                                                                                                                                                                                                                                                                                            margin-top: 20px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                  padding: 12px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                        border-radius: 8px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                              display: none;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    text-align: center;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                            footer {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  text-align: center;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        padding: 30px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              color: #777;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    font-size: 13px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </head>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <header>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="header-inner">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="logo">KRIM Logistics</div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <a class="workspace" href="customer-workspace.html">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          Customer Workspace
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </a>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </header>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="card">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <h1>Shipment Payment</h1>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="row">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <span class="label">Tracking Number</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <span class="value">TRK-000014</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="row">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <span class="label">Pickup</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <span class="value">Ranchi</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="row">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <span class="label">Delivery</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <span class="value">Delhi</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="row">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <span class="label">Quotation</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <span class="value amount">₹5,000</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="row">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <span class="label">Payment Status</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <span class="value" id="status">Ready for Payment</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <button id="payButton" onclick="payNow()">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    Pay ₹5,000
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div id="message"></div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <footer>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                © 2026 KRIM Logistics — Global Logistics Platform
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </footer>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  // YOUR RAZORPAY TEST KEY ID
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const RAZORPAY_KEY_ID = "rzp_test_TYjnGVeCidh3SI";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      function payNow() {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const button = document.getElementById("payButton");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const status = document.getElementById("status");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const message = document.getElementById("message");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      button.disabled = true;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          button.innerText = "Opening Payment...";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const options = {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    key: RAZORPAY_KEY_ID,

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          amount: 500000,

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                currency: "INR",

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      name: "KRIM Logistics",

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            description: "Shipment Payment - TRK-000014",

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  handler: function(response) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          status.innerText = "Payment Completed";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  message.style.display = "block";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          message.innerHTML =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    "Payment successful.<br><br>" +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              "Payment ID: " +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        response.razorpay_payment_id;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                button.innerText = "Payment Completed";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      },

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            prefill: {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    name: "KRIM Customer"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          },

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                theme: {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        color: "#071a33"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              },

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    modal: {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ondismiss: function() {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      button.disabled = false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                button.innerText = "Pay ₹5,000";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      try {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const razorpay = new Razorpay(options);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  razorpay.on("payment.failed", function(response) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          button.disabled = false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  button.innerText = "Pay ₹5,000";
