<html>
<head>

                                                                                                              <body>

                                                                                                                <h2>Secure Shipment Payment</h2>

                                                                                                                  <input
                                                                                                                      type="text"
                                                                                                                          id="tracking"

                                                                                                                                >

                                                                                                                                  <button onclick="startPayment()">Pay Now</button>

                                                                                                                                    <div id="result"></div>

                                                                                                                                      <script>

                                                                                                                                          const SUPABASE_URL =
                                                                                                                                                "https://ebltviniygljwwseplph.supabase.co";

                                                                                                                                                    const SUPABASE_PUBLISHABLE_KEY =
                                                                                                                                                          "sb_publishable_8xzZUeubYp_nIxVRWEQdiw_2H4RkHAa";

                                                                                                                                                              const RAZORPAY_KEY_ID =
                                                                                                                                                                    "rzp_test_TYjnGVeCidh3SI";

                                                                                                                                                                        const supabaseClient = supabase.createClient(
                                                                                                                                                                              SUPABASE_URL,
                                                                                                                                                                                    SUPABASE_PUBLISHABLE_KEY
                                                                                                                                                                                        );


                                                                                                                                                                                            async function startPayment() {

                                                                                                                                                                                                  const result =
                                                                                                                                                                                                          document.getElementById("result");

                                                                                                                                                                                                                const tracking =
                                                                                                                                                                                                                        document.getElementById("tracking").value.trim();

                                                                                                                                                                                                                              result.innerText = "";

                                                                                                                                                                                                                                    if (!tracking) {
                                                                                                                                                                                                                                            result.innerText =
                                                                                                                                                                                                                                                      "Please enter tracking number.";
                                                                                                                                                                                                                                                              return;
                                                                                                                                                                                                                                                                    }


                                                                                                                                                                                                                                                                          const { data: userData, error: userError } =
                                                                                                                                                                                                                                                                                  await supabaseClient.auth.getUser();

                                                                                                                                                                                                                                                                                        if (userError || !userData.user) {
                                                                                                                                                                                                                                                                                                result.innerText =
                                                                                                                                                                                                                                                                                                          "Please login first.";
                                                                                                                                                                                                                                                                                                                  return;
                                                                                                                                                                                                                                                                                                                        }


                                                                                                                                                                                                                                                                                                                              const { data: shipment, error: shipmentError } =
                                                                                                                                                                                                                                                                                                                                      await supabaseClient
                                                                                                                                                                                                                                                                                                                                                .from("shipment_requests")
                                                                                                                                                                                                                                                                                                                                                          .select(
                                                                                                                                                                                                                                                                                                                                                                      "id, tracking_number, quoted_price, quote_status"
                                                                                                                                                                                                                                                                                                                                                                                )

                                                                                                                                                                                                                                                                                                                                                                                                    .eq("customer_id", userData.user.id)
                                                                                                                                                                                                                                                                                                                                                                                                              .single();


                                                                                                                                                                                                                                                                                                                                                                                                                    if (shipmentError || !shipment) {
                                                                                                                                                                                                                                                                                                                                                                                                                            result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                      "Shipment not found.";
                                                                                                                                                                                                                                                                                                                                                                                                                                              return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                    }


                                                                                                                                                                                                                                                                                                                                                                                                                                                          if (!shipment.quoted_price) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            "Quotation is not available.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (shipment.quote_status !== "accepted") {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  "Please accept the quotation first.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const amount =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              Math.round(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        Number(shipment.quoted_price) * 100
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                );


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              "Creating payment order...";


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const response = await fetch(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            SUPABASE_URL +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    "/functions/v1/create-razorpay-order",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      method: "POST",

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                headers: {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            "Content-Type": "application/json",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        "apikey": SUPABASE_PUBLISHABLE_KEY,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    "Authorization":
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  "Bearer " + SUPABASE_PUBLISHABLE_KEY
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            },

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      body: JSON.stringify({
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  amount: amount,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              receipt: tracking
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        })
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      );


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const order = await response.json();


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if (!response.ok || !order.id) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    "Payment order error: " +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              (order.error ||
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         "Unable to create order.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     key: RAZORPAY_KEY_ID,

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             amount: order.amount,

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     currency: order.currency,

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             name: "RimjhimKrn Web",

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           "Payment received. Saving payment...";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               .from("payments")

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             customer_id:

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 status: "pending",

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 payment_method:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   "razorpay",

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   transaction_id:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     paymentResponse
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         .razorpay_payment_id,

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         razorpay_order_id:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           paymentResponse
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               .razorpay_order_id

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             });


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       if (insertError) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 "Payment received, but record error: " +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               insertError.message;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           "Verifying payment...";
