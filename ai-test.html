<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>KRIM AI Test</title>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
          <script src="config.js"></script>

            <style>
                body {
                      font-family: Arial, sans-serif;
                            background: #f4f7fb;
                                  margin: 0;
                                        padding: 20px;
                                            }

                                                .box {
                                                      max-width: 600px;
                                                            margin: 30px auto;
                                                                  background: white;
                                                                        padding: 24px;
                                                                              border-radius: 16px;
                                                                                    box-shadow: 0 5px 20px rgba(0,0,0,.08);
                                                                                        }

                                                                                            textarea {
                                                                                                  width: 100%;
                                                                                                        min-height: 120px;
                                                                                                              box-sizing: border-box;
                                                                                                                    padding: 12px;
                                                                                                                          font-size: 16px;
                                                                                                                                border: 1px solid #ccc;
                                                                                                                                      border-radius: 10px;
                                                                                                                                          }

                                                                                                                                              button {
                                                                                                                                                    width: 100%;
                                                                                                                                                          padding: 14px;
                                                                                                                                                                margin-top: 15px;
                                                                                                                                                                      border: 0;
                                                                                                                                                                            border-radius: 10px;
                                                                                                                                                                                  background: #111827;
                                                                                                                                                                                        color: white;
                                                                                                                                                                                              font-size: 16px;
                                                                                                                                                                                                  }

                                                                                                                                                                                                      #status {
                                                                                                                                                                                                            margin-top: 18px;
                                                                                                                                                                                                                  font-weight: bold;
                                                                                                                                                                                                                      }

                                                                                                                                                                                                                          #result {
                                                                                                                                                                                                                                margin-top: 15px;
                                                                                                                                                                                                                                      padding: 15px;
                                                                                                                                                                                                                                            background: #f3f4f6;
                                                                                                                                                                                                                                                  border-radius: 10px;
                                                                                                                                                                                                                                                        white-space: pre-wrap;
                                                                                                                                                                                                                                                              word-break: break-word;
                                                                                                                                                                                                                                                                    line-height: 1.5;
                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                          </style>
                                                                                                                                                                                                                                                                          </head>

                                                                                                                                                                                                                                                                          <body>

                                                                                                                                                                                                                                                                          <div class="box">

                                                                                                                                                                                                                                                                            <h1>KRIM AI Test</h1>

                                                                                                                                                                                                                                                                              <p>
                                                                                                                                                                                                                                                                                  Temporary internal test for the KRIM AI system.
                                                                                                                                                                                                                                                                                    </p>

                                                                                                                                                                                                                                                                                      <textarea id="message">Hello KRIM AI. Explain in one short paragraph what you can help me with as a logistics assistant.</textarea>

                                                                                                                                                                                                                                                                                        <button id="testButton" onclick="runTest()">
                                                                                                                                                                                                                                                                                            Test KRIM AI
                                                                                                                                                                                                                                                                                              </button>

                                                                                                                                                                                                                                                                                                <div id="status"></div>

                                                                                                                                                                                                                                                                                                  <div id="result"></div>

                                                                                                                                                                                                                                                                                                  </div>

                                                                                                                                                                                                                                                                                                  <script>

                                                                                                                                                                                                                                                                                                  const client = window.supabase.createClient(
                                                                                                                                                                                                                                                                                                    SUPABASE_URL,
                                                                                                                                                                                                                                                                                                      SUPABASE_PUBLISHABLE_KEY
                                                                                                                                                                                                                                                                                                      );

                                                                                                                                                                                                                                                                                                      async function runTest() {

                                                                                                                                                                                                                                                                                                        const button = document.getElementById("testButton");
                                                                                                                                                                                                                                                                                                          const status = document.getElementById("status");
                                                                                                                                                                                                                                                                                                            const result = document.getElementById("result");

                                                                                                                                                                                                                                                                                                              button.disabled = true;

                                                                                                                                                                                                                                                                                                                status.textContent = "Checking KRIM login...";
                                                                                                                                                                                                                                                                                                                  result.textContent = "";

                                                                                                                                                                                                                                                                                                                    try {

                                                                                                                                                                                                                                                                                                                        const sessionResult = await client.auth.getSession();

                                                                                                                                                                                                                                                                                                                            if (sessionResult.error) {
                                                                                                                                                                                                                                                                                                                                  throw new Error(
                                                                                                                                                                                                                                                                                                                                          "Session error: " + sessionResult.error.message
                                                                                                                                                                                                                                                                                                                                                );
                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                        const session = sessionResult.data.session;

                                                                                                                                                                                                                                                                                                                                                            if (!session) {
                                                                                                                                                                                                                                                                                                                                                                  throw new Error(
                                                                                                                                                                                                                                                                                                                                                                          "No active KRIM login found. Please log in first."
                                                                                                                                                                                                                                                                                                                                                                                );
                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                        status.textContent =
                                                                                                                                                                                                                                                                                                                                                                                              "Login found. Connecting to KRIM AI...";

                                                                                                                                                                                                                                                                                                                                                                                                  const message =
                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("message").value.trim();

                                                                                                                                                                                                                                                                                                                                                                                                            const response = await client.functions.invoke(
                                                                                                                                                                                                                                                                                                                                                                                                                  "krim-ai",
                                                                                                                                                                                                                                                                                                                                                                                                                        {
                                                                                                                                                                                                                                                                                                                                                                                                                                body: {
                                                                                                                                                                                                                                                                                                                                                                                                                                          message: message,
                                                                                                                                                                                                                                                                                                                                                                                                                                                    user_role: "customer"
                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                          console.log("KRIM AI RESPONSE:", response);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if (response.error) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    throw new Error(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            response.error.message ||
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    JSON.stringify(response.error)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          );
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if (!response.data) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        throw new Error("KRIM AI returned no data.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (response.data.error) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      throw new Error(response.data.error);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              status.textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    "✅ KRIM AI TEST SUCCESSFUL";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        result.textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              response.data.reply ||
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    JSON.stringify(response.data, null, 2);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      } catch (error) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          console.error("KRIM AI ERROR:", error);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              status.textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    "❌ KRIM AI TEST FAILED";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        result.textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              error.message ||
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    JSON.stringify(error, null, 2);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      } finally {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          button.disabled = false;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
