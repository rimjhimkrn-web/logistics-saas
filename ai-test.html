<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>KRIM AI Test</title>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
          <script src="config.js"></script>

            <style>
                body {
                      margin: 0;
                            font-family: Arial, sans-serif;
                                  background: #f4f7fb;
                                        color: #111827;
                                            }

                                                .container {
                                                      max-width: 600px;
                                                            margin: 40px auto;
                                                                  padding: 20px;
                                                                      }

                                                                          .card {
                                                                                background: white;
                                                                                      padding: 24px;
                                                                                            border-radius: 16px;
                                                                                                  box-shadow: 0 5px 20px rgba(0,0,0,0.08);
                                                                                                      }

                                                                                                          h1 {
                                                                                                                margin-top: 0;
                                                                                                                    }

                                                                                                                        .badge {
                                                                                                                              display: inline-block;
                                                                                                                                    padding: 6px 10px;
                                                                                                                                          border-radius: 20px;
                                                                                                                                                background: #eef2ff;
                                                                                                                                                      color: #3730a3;
                                                                                                                                                            font-size: 13px;
                                                                                                                                                                  margin-bottom: 15px;
                                                                                                                                                                      }

                                                                                                                                                                          textarea {
                                                                                                                                                                                width: 100%;
                                                                                                                                                                                      box-sizing: border-box;
                                                                                                                                                                                            min-height: 120px;
                                                                                                                                                                                                  padding: 12px;
                                                                                                                                                                                                        border: 1px solid #d1d5db;
                                                                                                                                                                                                              border-radius: 10px;
                                                                                                                                                                                                                    font-size: 15px;
                                                                                                                                                                                                                          resize: vertical;
                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                  button {
                                                                                                                                                                                                                                        width: 100%;
                                                                                                                                                                                                                                              margin-top: 15px;
                                                                                                                                                                                                                                                    padding: 13px;
                                                                                                                                                                                                                                                          border: none;
                                                                                                                                                                                                                                                                border-radius: 10px;
                                                                                                                                                                                                                                                                      background: #111827;
                                                                                                                                                                                                                                                                            color: white;
                                                                                                                                                                                                                                                                                  font-size: 16px;
                                                                                                                                                                                                                                                                                        cursor: pointer;
                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                button:disabled {
                                                                                                                                                                                                                                                                                                      opacity: 0.6;
                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                              #status {
                                                                                                                                                                                                                                                                                                                    margin-top: 18px;
                                                                                                                                                                                                                                                                                                                          font-weight: bold;
                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                  #response {
                                                                                                                                                                                                                                                                                                                                        margin-top: 15px;
                                                                                                                                                                                                                                                                                                                                              padding: 15px;
                                                                                                                                                                                                                                                                                                                                                    background: #f9fafb;
                                                                                                                                                                                                                                                                                                                                                          border-radius: 10px;
                                                                                                                                                                                                                                                                                                                                                                white-space: pre-wrap;
                                                                                                                                                                                                                                                                                                                                                                      line-height: 1.5;
                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                              .error {
                                                                                                                                                                                                                                                                                                                                                                                    color: #b91c1c;
                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                            .success {
                                                                                                                                                                                                                                                                                                                                                                                                  color: #047857;
                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                        </style>
                                                                                                                                                                                                                                                                                                                                                                                                        </head>

                                                                                                                                                                                                                                                                                                                                                                                                        <body>

                                                                                                                                                                                                                                                                                                                                                                                                        <div class="container">
                                                                                                                                                                                                                                                                                                                                                                                                          <div class="card">

                                                                                                                                                                                                                                                                                                                                                                                                              <div class="badge">KRIM Logistics • Internal AI Test</div>

                                                                                                                                                                                                                                                                                                                                                                                                                  <h1>KRIM AI</h1>

                                                                                                                                                                                                                                                                                                                                                                                                                      <p>
                                                                                                                                                                                                                                                                                                                                                                                                                            This temporary page tests the authenticated connection between
                                                                                                                                                                                                                                                                                                                                                                                                                                  your KRIM account, Supabase Edge Functions, and OpenAI.
                                                                                                                                                                                                                                                                                                                                                                                                                                      </p>

                                                                                                                                                                                                                                                                                                                                                                                                                                          <textarea id="message">Hello KRIM AI. Explain in one short paragraph what you can help me with as a logistics assistant.</textarea>

                                                                                                                                                                                                                                                                                                                                                                                                                                              <button id="testBtn" onclick="testAI()">
                                                                                                                                                                                                                                                                                                                                                                                                                                                    Test KRIM AI
                                                                                                                                                                                                                                                                                                                                                                                                                                                        </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div id="status"></div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div id="response"></div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const supabaseClient = window.supabase.createClient(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        window.SUPABASE_URL,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            window.SUPABASE_PUBLISHABLE_KEY
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                async function testAI() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const button = document.getElementById("testBtn");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const status = document.getElementById("status");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const responseBox = document.getElementById("response");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const message = document.getElementById("message").value.trim();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    responseBox.textContent = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        status.className = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            status.textContent = "";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!message) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      status.className = "error";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            status.textContent = "Please enter a message.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          button.disabled = true;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              button.textContent = "Testing KRIM AI...";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  status.textContent = "Checking your login...";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      try {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    data: { session },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            error: sessionError
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  } = await supabaseClient.auth.getSession();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (sessionError) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                throw new Error(sessionError.message);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (!session) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    throw new Error(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              "No active login found. Please log in to your KRIM account first."
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      );
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  status.textContent = "Sending request to KRIM AI...";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const { data, error } = await supabaseClient.functions.invoke(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "krim-ai",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  body: {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              message: message,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          user_role: "customer"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (error) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                throw new Error(error.message || "KRIM AI request failed.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (!data) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    throw new Error("KRIM AI returned no response.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (data.error) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        throw new Error(data.error);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    status.className = "success";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          status.textContent = "✅ KRIM AI connection successful";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                responseBox.textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        data.reply ||
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                JSON.stringify(data, null, 2);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    } catch (error) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          console.error(error);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                status.className = "error";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      status.textContent = "❌ AI test failed";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            responseBox.textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    error.message || "Unknown error occurred.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            button.disabled = false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                button.textContent = "Test KRIM AI";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </html>
