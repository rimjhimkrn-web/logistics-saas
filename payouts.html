<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
    <title>Partner Payouts</title>

      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

        <style>
            body {
                  font-family: Arial, sans-serif;
                        padding: 30px;
                              max-width: 600px;
                                    margin: auto;
                                        }

                                            input, select, button {
                                                  width: 100%;
                                                        padding: 12px;
                                                              margin-top: 10px;
                                                                    box-sizing: border-box;
                                                                        }

                                                                            #result {
                                                                                  margin-top: 20px;
                                                                                        font-weight: bold;
                                                                                            }
                                                                                              </style>
                                                                                              </head>

                                                                                              <body>

                                                                                                <h2>Partner Payout Management</h2>

                                                                                                  <input
                                                                                                      type="text"
                                                                                                          id="tracking"
                                                                                                              placeholder="Enter Tracking Number"
                                                                                                                >

                                                                                                                  <input
                                                                                                                      type="number"
                                                                                                                          id="amount"
                                                                                                                              placeholder="Partner Payout Amount"
                                                                                                                                >

                                                                                                                                  <input
                                                                                                                                      type="text"
                                                                                                                                          id="partnerId"
                                                                                                                                              placeholder="Partner ID"
                                                                                                                                                >

                                                                                                                                                  <select id="status">
                                                                                                                                                      <option value="pending">Pending</option>
                                                                                                                                                          <option value="processing">Processing</option>
                                                                                                                                                              <option value="paid">Paid</option>
                                                                                                                                                                </select>

                                                                                                                                                                  <button onclick="savePayout()">Save Payout</button>

                                                                                                                                                                    <div id="result"></div>

                                                                                                                                                                      <script>

                                                                                                                                                                          const SUPABASE_URL =
                                                                                                                                                                                "https://ebltviniygljwwseplph.supabase.co";

                                                                                                                                                                                    const SUPABASE_PUBLISHABLE_KEY =
                                                                                                                                                                                          "sb_publishable_8xzZUeubYp_nIxVRWEQdiw_2H4RkHAa";

                                                                                                                                                                                              const supabaseClient =
                                                                                                                                                                                                    supabase.createClient(
                                                                                                                                                                                                            SUPABASE_URL,
                                                                                                                                                                                                                    SUPABASE_PUBLISHABLE_KEY
                                                                                                                                                                                                                          );


                                                                                                                                                                                                                              async function savePayout() {

                                                                                                                                                                                                                                    const result =
                                                                                                                                                                                                                                            document.getElementById("result");

                                                                                                                                                                                                                                                  const tracking =
                                                                                                                                                                                                                                                          document.getElementById("tracking").value.trim();

                                                                                                                                                                                                                                                                const amount =
                                                                                                                                                                                                                                                                        Number(
                                                                                                                                                                                                                                                                                  document.getElementById("amount").value
                                                                                                                                                                                                                                                                                          );

                                                                                                                                                                                                                                                                                                const partnerId =
                                                                                                                                                                                                                                                                                                        document.getElementById("partnerId").value.trim();

                                                                                                                                                                                                                                                                                                              const status =
                                                                                                                                                                                                                                                                                                                      document.getElementById("status").value;


                                                                                                                                                                                                                                                                                                                            if (!tracking || !amount || !partnerId) {
                                                                                                                                                                                                                                                                                                                                    result.innerText =
                                                                                                                                                                                                                                                                                                                                              "Please fill all fields.";
                                                                                                                                                                                                                                                                                                                                                      return;
                                                                                                                                                                                                                                                                                                                                                            }


                                                                                                                                                                                                                                                                                                                                                                  const { data: shipment, error: shipmentError } =
                                                                                                                                                                                                                                                                                                                                                                          await supabaseClient
                                                                                                                                                                                                                                                                                                                                                                                    .from("shipment_requests")
                                                                                                                                                                                                                                                                                                                                                                                              .select("id, tracking_number")
                                                                                                                                                                                                                                                                                                                                                                                                        .eq("tracking_number", tracking)
                                                                                                                                                                                                                                                                                                                                                                                                                  .single();


                                                                                                                                                                                                                                                                                                                                                                                                                        if (shipmentError || !shipment) {
                                                                                                                                                                                                                                                                                                                                                                                                                                result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                          "Shipment not found.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                  return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                        }


                                                                                                                                                                                                                                                                                                                                                                                                                                                              const { error } =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      await supabaseClient
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                .from("partner_payouts")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          .insert({

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      shipment_id:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    shipment.id,

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                partner_id:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              Number(partnerId),

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          payout_amount:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        amount,

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    status:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  status

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            });


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if (error) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    "Error: " + error.message;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "Partner payout saved successfully!";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </html>
