<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Partner Login | KRIM Logistics</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
    font-family:Arial,sans-serif;
      background:#f4f7fb;
      }

      .container{
        max-width:430px;
          margin:60px auto;
            padding:20px;
            }

            .card{
              background:white;
                padding:28px;
                  border-radius:14px;
                    box-shadow:0 5px 20px rgba(0,0,0,.08);
                    }

                    .logo{
                      text-align:center;
                        color:#1261d6;
                          font-size:28px;
                            font-weight:bold;
                            }

                            .subtitle{
                              text-align:center;
                                color:#666;
                                  margin:8px 0 25px;
                                  }

                                  label{
                                    display:block;
                                      margin:15px 0 6px;
                                        font-weight:bold;
                                        }

                                        input{
                                          width:100%;
                                            padding:13px;
                                              border:1px solid #ccc;
                                                border-radius:8px;
                                                  font-size:15px;
                                                  }

                                                  button{
                                                    width:100%;
                                                      margin-top:22px;
                                                        padding:14px;
                                                          border:0;
                                                            border-radius:8px;
                                                              background:#1261d6;
                                                                color:white;
                                                                  font-size:16px;
                                                                    font-weight:bold;
                                                                      cursor:pointer;
                                                                      }

                                                                      button:disabled{
                                                                        background:#999;
                                                                        }

                                                                        .message{
                                                                          display:none;
                                                                            margin-top:18px;
                                                                              padding:13px;
                                                                                border-radius:8px;
                                                                                  line-height:1.5;
                                                                                  }

                                                                                  .success{
                                                                                    display:block;
                                                                                      background:#dcfce7;
                                                                                        color:#166534;
                                                                                        }

                                                                                        .error{
                                                                                          display:block;
                                                                                            background:#fee2e2;
                                                                                              color:#991b1b;
                                                                                              }

                                                                                              .signup{
                                                                                                text-align:center;
                                                                                                  margin-top:20px;
                                                                                                  }

                                                                                                  .signup a{
                                                                                                    color:#1261d6;
                                                                                                      font-weight:bold;
                                                                                                        text-decoration:none;
                                                                                                        }
                                                                                                        </style>
                                                                                                        </head>

                                                                                                        <body>

                                                                                                        <div class="container">

                                                                                                        <div class="card">

                                                                                                        <div class="logo">KRIM Logistics</div>

                                                                                                        <div class="subtitle">Partner Login</div>

                                                                                                        <form id="loginForm">

                                                                                                        <label>Email</label>

                                                                                                        <input
                                                                                                          type="email"
                                                                                                            id="email"
                                                                                                              placeholder="Enter your email"
                                                                                                                required
                                                                                                                >

                                                                                                                <label>Password</label>

                                                                                                                <input
                                                                                                                  type="password"
                                                                                                                    id="password"
                                                                                                                      placeholder="Enter your password"
                                                                                                                        required
                                                                                                                        >

                                                                                                                        <button id="loginButton" type="submit">
                                                                                                                        Login
                                                                                                                        </button>

                                                                                                                        </form>

                                                                                                                        <div id="message" class="message"></div>

                                                                                                                        <div class="signup">
                                                                                                                        New partner?
                                                                                                                        <a href="partner-signup.html">Create Partner Account</a>
                                                                                                                        </div>

                                                                                                                        </div>

                                                                                                                        </div>

                                                                                                                        <script>

                                                                                                                            const form = document.getElementById("loginForm");
                                                                                                                            const button = document.getElementById("loginButton");
                                                                                                                            const message = document.getElementById("message");

                                                                                                                            function showMessage(text, type) {
                                                                                                                              message.textContent = text;
                                                                                                                                message.className = "message " + type;
                                                                                                                                }

                                                                                                                                form.addEventListener("submit", async function(e) {

                                                                                                                                  e.preventDefault();

                                                                                                                                    button.disabled = true;
                                                                                                                                      button.textContent = "Logging in...";

                                                                                                                                        const email =
                                                                                                                                            document.getElementById("email").value.trim();

                                                                                                                                              const password =
                                                                                                                                                  document.getElementById("password").value;

                                                                                                                                                    try {

                                                                                                                                                        const { data, error } =
                                                                                                                                                              await supabaseClient.auth.signInWithPassword({
                                                                                                                                                                      email: email,
                                                                                                                                                                              password: password
                                                                                                                                                                                    });

                                                                                                                                                                                        if (error) {
                                                                                                                                                                                              throw error;
                                                                                                                                                                                                  }

                                                                                                                                                                                                      const user = data.user;

                                                                                                                                                                                                          const { data: roleData, error: roleError } =
                                                                                                                                                                                                                await supabaseClient
                                                                                                                                                                                                                        .from("user_roles")
                                                                                                                                                                                                                                .select("role")
                                                                                                                                                                                                                                        .eq("user_id", user.id)
                                                                                                                                                                                                                                                .maybeSingle();

                                                                                                                                                                                                                                                    if (roleError) {
                                                                                                                                                                                                                                                          throw roleError;
                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                  if (!roleData || roleData.role !== "partner") {

                                                                                                                                                                                                                                                                        await supabaseClient.auth.signOut();

                                                                                                                                                                                                                                                                              throw new Error(
                                                                                                                                                                                                                                                                                      "This account is not registered as a partner."
                                                                                                                                                                                                                                                                                            );
                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                    showMessage(
                                                                                                                                                                                                                                                                                                          "Login successful. Redirecting to Partner Portal...",
                                                                                                                                                                                                                                                                                                                "success"
                                                                                                                                                                                                                                                                                                                    );

                                                                                                                                                                                                                                                                                                                        button.textContent = "Success";

                                                                                                                                                                                                                                                                                                                            setTimeout(function() {
                                                                                                                                                                                                                                                                                                                                  window.location.href = "partner.html";
                                                                                                                                                                                                                                                                                                                                      }, 800);

                                                                                                                                                                                                                                                                                                                                        } catch (error) {

                                                                                                                                                                                                                                                                                                                                            console.error(error);

                                                                                                                                                                                                                                                                                                                                                showMessage(
                                                                                                                                                                                                                                                                                                                                                      error.message || "Login failed.",
                                                                                                                                                                                                                                                                                                                                                            "error"
                                                                                                                                                                                                                                                                                                                                                                );

                                                                                                                                                                                                                                                                                                                                                                    button.disabled = false;
                                                                                                                                                                                                                                                                                                                                                                        button.textContent = "Login";
                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                          });

                                                                                                                                                                                                                                                                                                                                                                          </script>

                                                                                                                                                                                                                                                          </body>
                                                                                                                                                                                                                                                          </html>
