<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#07111f"><title>Opening Partner Workspace | KRIM</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(800px 500px at 90% 0,#14504c66,transparent 70%),#07111f;color:#f3f7fb;font:15px/1.5 system-ui,sans-serif}.box{width:min(100%,500px);padding:32px;text-align:center;background:#102137;border:1px solid #ffffff20;border-radius:24px;box-shadow:0 25px 80px #0005}.spinner{width:36px;height:36px;margin:20px auto;border:3px solid #345064;border-top-color:#4ce0a2;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}p{color:#a9bbcf;overflow-wrap:anywhere}a{color:#9ed4ff}#status{font-weight:650}</style></head><body><main class="box"><div style="color:#4ce0a2;font-size:11px;font-weight:800;letter-spacing:.16em">KRIM LOGISTICS OS</div><h1>Opening Partner Workspace</h1><div class="spinner" id="spinner"></div><p id="status" role="status" aria-live="polite">Checking your secure session…</p><p><a id="back" href="partner-signin.html">Return to Partner Sign In</a></p></main>
<script>
(async function(){
 const BASE=location.hostname.endsWith("github.io")&&location.pathname.startsWith("/logistics-saas/")?"/logistics-saas":"";
 const client=window.supabase&&window.supabase.createClient("https://ebltviniygljwwseplph.supabase.co","sb_publishable_8xzZUeubYp_nIxVRWEQdiw_2H4RkHAa");
 const status=document.getElementById("status"),spinner=document.getElementById("spinner");
 function fail(message){status.textContent=message;spinner.style.display="none"}
 try{
  if(!client)throw new Error("Authentication service failed to load. Please return to sign-in and retry.");
  const {data,error}=await client.auth.getSession();if(error)throw error;
  if(!data.session){location.replace(BASE+"/auth/partner-signin.html");return}
  const user=data.session.user,meta=user.user_metadata||{},type=String(meta.krim_account_type||meta.account_type||meta.role||"").toLowerCase().replace(/[^a-z0-9]+/g,"_");
  const r=await client.from("krim_organization_members").select("role,status,krim_organizations(organization_type,organization_type_code,display_name,legal_name)").eq("user_id",user.id).eq("status","active");
  const memberPartner=Array.isArray(r.data)&&r.data.some(m=>{const o=m.krim_organizations||{};return /partner|carrier|transport|forwarder/.test([m.role,o.organization_type,o.organization_type_code,o.display_name,o.legal_name].join(" ").toLowerCase())});
  const metaPartner=["partner","carrier","transport_partner","transport"].includes(type);
  if(!metaPartner&&!memberPartner)throw new Error(r.error?"Partner membership could not be verified. Contact KRIM support to check workspace access.":"Your signed-in account has no recognized partner role. Sign in with your registered partner account.");
  status.textContent="Access confirmed. Redirecting now…";
  location.replace(BASE+"/app/partner/index.html");
 }catch(e){fail(e.message||"Unable to verify partner access.")}
})();
</script></body></html>
