<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#07111f"><title>Verifying Partner Access | KRIM</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(800px 500px at 90% 0,#14504c66,transparent 70%),#07111f;color:#f3f7fb;font:15px/1.5 system-ui,sans-serif}.box{width:min(100%,500px);padding:32px;text-align:center;background:#102137;border:1px solid #ffffff20;border-radius:24px;box-shadow:0 25px 80px #0005}.mark{width:44px;height:44px;margin:auto;display:grid;place-items:center;border-radius:14px;background:#4ce0a2;color:#06241d;font-weight:950;font-size:22px}.eyebrow{margin-top:16px;color:#4ce0a2;font-size:11px;font-weight:800;letter-spacing:.16em}h1{font-size:25px}p{color:#a9bbcf;overflow-wrap:anywhere}a{color:#9ed4ff}#status{font-weight:650}</style></head>
<body><main class="box"><div class="mark">K</div><div class="eyebrow">KRIM LOGISTICS OS</div><h1>Verifying partner access</h1><p id="status" role="status" aria-live="polite">Checking your authenticated session and organization permissions…</p><p><a id="back" href="partner-signin.html">Return to Partner Sign In</a></p></main>
<script>
(async function(){
"use strict";
const client=window.KRIM_SUPABASE||window.supabaseClient;
const base=window.KRIM_BASE_PATH||"";
const status=document.getElementById("status");
try{
 if(!client)throw new Error("Authentication service did not load. Return to sign-in and retry.");
 const {data,error}=await client.auth.getSession();
 if(error)throw error;
 if(!data.session){location.replace(base+"/auth/partner-signin.html");return;}
 status.textContent="Session confirmed. The secure partner gateway will identify your account pathway and route you to the correct workspace…";
 location.replace(base+"/app/partner/index.html");
}catch(error){
 status.textContent=error&&error.message?error.message:"Unable to verify partner access. Please return to sign-in and retry.";
}
})();
</script></body></html>
