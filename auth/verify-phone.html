<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>KRIM Logistics OS — Phone Verification</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<script>
(function(){var p=location.pathname;var b=p.indexOf("/logistics-saas/")===0?"/logistics-saas/":"/";var l=document.createElement("link");l.rel="stylesheet";l.href=b+"core/krim-unified-page.css";document.head.appendChild(l);}());
</script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:#f8fafc;color:#0f172a;font-family:Inter,system-ui,-apple-system,sans-serif}
header,footer{padding:22px max(20px,calc((100% - 1000px)/2))}header{background:#fff;border-bottom:1px solid #e2e8f0;font-weight:800;letter-spacing:.06em}
main{width:min(100% - 32px,460px);margin:auto;padding:32px 26px;background:#fff;border:1px solid #e2e8f0;border-radius:20px;box-shadow:0 18px 50px #0f172a0d}
.badge{width:48px;height:48px;margin:0 auto 16px;display:grid;place-items:center;border-radius:15px;background:#e0f2fe;color:#0369a1;font-size:22px}
h1{text-align:center;font-size:25px;margin:0 0 10px}p{text-align:center;color:#64748b;font-size:14px;line-height:1.6}
label{display:block;margin:20px 0 8px;font-size:13px;font-weight:700}
input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}
input:focus{outline:2px solid #0284c7;border-color:#0284c7}
#sms-code{text-align:center;font-size:24px;letter-spacing:.4em;font-family:ui-monospace,monospace}
button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:10px;background:#0369a1;color:#fff;font-weight:750;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}#feedback{margin-top:16px;padding:12px;border-radius:10px;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
a{color:#0369a1;font-weight:700;text-decoration:none}.back{display:block;text-align:center;margin-top:20px;font-size:14px}
footer{text-align:center;color:#64748b;font-size:12px}
</style>
</head>
<body>
<header>KRIM <span style="color:#0284c7">LOGISTICS OS</span></header>
<main>
<div class="badge" aria-hidden="true">📱</div>
<h1>Verify your phone</h1>
<p>Use an international phone number in E.164 format (for example, +919876543210). SMS verification works only when phone auth and an SMS provider are configured in Supabase.</p>
<div id="feedback" role="status" aria-live="polite" hidden></div>
<form id="phone-form">
<div id="phone-step">
<label for="phone">Mobile number</label>
<input id="phone" type="tel" inputmode="tel" autocomplete="tel" required maxlength="16" pattern="\+[1-9][0-9]{7,14}" placeholder="+919876543210">
<button id="send-btn" type="submit">Send verification code</button>
</div>
<div id="code-step" hidden>
<label for="sms-code">Six-digit SMS code</label>
<input id="sms-code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" placeholder="000000" required>
<button id="verify-btn" type="button">Verify phone</button>
<button id="resend-btn" type="button" style="margin-top:10px;background:#e2e8f0;color:#0f172a">Send a new code</button>
</div>
</form>
<a class="back" href="login.html">← Back to sign in</a>
</main>
<footer>© 2026 KRIM Logistics</footer>
<script>
(function(){
 const client=window.KRIM_SUPABASE;
 const form=document.getElementById("phone-form");
 const phoneInput=document.getElementById("phone");
 const codeInput=document.getElementById("sms-code");
 const phoneStep=document.getElementById("phone-step");
 const codeStep=document.getElementById("code-step");
 const sendBtn=document.getElementById("send-btn");
 const verifyBtn=document.getElementById("verify-btn");
 const resendBtn=document.getElementById("resend-btn");
 const feedback=document.getElementById("feedback");
 let verifiedPhone="";
 function show(message,ok){
  feedback.hidden=false;feedback.textContent=message;
  feedback.style.background=ok?"#ecfdf5":"#fff1f2";
  feedback.style.color=ok?"#065f46":"#9f1239";
 }
 async function sendCode(){
  const phone=phoneInput.value.trim().replace(/[\s()-]/g,"");
  if(!/^\+[1-9]\d{7,14}$/.test(phone)){show("Enter a valid international number, including country code, such as +919876543210.",false);return;}
  sendBtn.disabled=true;resendBtn.disabled=true;sendBtn.textContent="Sending…";resendBtn.textContent="Sending…";
  try{
   const result=await client.auth.signInWithOtp({phone});
   if(result.error) throw result.error;
   verifiedPhone=phone;phoneInput.value=phone;phoneStep.hidden=true;codeStep.hidden=false;
   show("If SMS delivery is configured, a verification code has been sent. Enter it below.",true);
   codeInput.focus();
  }catch(error){
   show(error&&error.message?error.message:"Could not send a verification code. Check Supabase phone-auth and SMS-provider settings.",false);
  }finally{
   sendBtn.disabled=false;resendBtn.disabled=false;sendBtn.textContent="Send verification code";resendBtn.textContent="Send a new code";
  }
 }
 form.addEventListener("submit",function(event){event.preventDefault();if(phoneStep.hidden)return;sendCode();});
 resendBtn.addEventListener("click",sendCode);
 verifyBtn.addEventListener("click",async function(){
  const code=codeInput.value.trim();
  if(!verifiedPhone||!/^\d{6}$/.test(code)){show("Enter the six-digit code sent to your phone.",false);return;}
  verifyBtn.disabled=true;verifyBtn.textContent="Verifying…";
  try{
   const result=await client.auth.verifyOtp({phone:verifiedPhone,token:code,type:"sms"});
   if(result.error)throw result.error;
   show("Phone verified. Returning you to sign in…",true);
   form.hidden=true;
   setTimeout(function(){location.replace("login.html");},900);
  }catch(error){
   show(error&&error.message?error.message:"Phone verification failed. The code may be invalid or expired.",false);
  }finally{verifyBtn.disabled=false;verifyBtn.textContent="Verify phone";}
 });
})();
</script>
</body>
</html>
