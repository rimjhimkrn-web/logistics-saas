<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRIM OS — Organization Invitation Acceptance</title>
    <meta name="description" content="Accept your enterprise tenant invitation and join collaborative logistics workspaces within KRIM OS.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0284c7', 600: '#026f9e', 900: '#0f172a' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans antialiased">
    <header class="bg-slate-900/95 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-sky-600 to-slate-800 flex items-center justify-center text-white font-bold text-lg">K</div>
                <div>
                    <span class="text-base font-extrabold tracking-wide text-white uppercase">KRIM OS</span>
                    <span class="block text-[10px] tracking-widest text-sky-400 font-semibold uppercase">Tenant Onboarding</span>
                </div>
            </div>
            <a href="/auth/login.html" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-4 py-2 rounded-xl text-xs uppercase tracking-wider transition">Sign In</a>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center px-6 py-16">
        <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-3xl p-8 sm:p-10 shadow-2xl space-y-8">
            <div class="space-y-2 text-center">
                <span class="inline-block px-3 py-1 rounded-full text-[10px] font-mono font-semibold bg-sky-500/10 text-sky-400 border border-sky-500/20 uppercase tracking-widest">Workspace Invitation</span>
                <h1 class="text-2xl font-extrabold text-white tracking-tight">Join Organization</h1>
                <p class="text-slate-400 text-xs font-mono">You have been invited to join <strong class="text-white">Acme Global Logistics</strong> as a Fleet Operator.</p>
            </div>

            <div class="space-y-4">
                <button onclick="acceptInvitation()" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-semibold py-4 rounded-xl text-xs uppercase tracking-wider transition shadow-lg shadow-sky-600/20 cursor-pointer">
                    Accept Invitation & Enter Portal →
                </button>
                <button onclick="declineInvitation()" class="w-full bg-slate-900 hover:bg-slate-800 text-slate-400 hover:text-white font-semibold py-3.5 rounded-xl border border-slate-700 text-xs uppercase tracking-wider transition cursor-pointer">
                    Decline
                </button>
            </div>
        </div>
    </main>

    <footer class="bg-slate-900 border-t border-slate-800 py-8 text-xs text-slate-500 font-mono text-center">
        <p>KRIM Logistics OS Global Network © 2026. All rights reserved.</p>
    </footer>

    <script>
        function acceptInvitation() {
            alert('Invitation accepted successfully via Supabase RLS tenant linking.');
            window.location.href = '/portal.html';
        }
        function declineInvitation() {
            alert('Invitation declined.');
            window.location.href = '/auth/login.html';
        }
    </script>
</body>
</html>
