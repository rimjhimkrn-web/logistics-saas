<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Organization Registration — KRIM LOGISTICS OS</title>
  <link rel="stylesheet" href="/core/krim-core.css" />
  <link rel="stylesheet" href="/core/krim-components.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .auth-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .auth-card { width: 100%; max-width: 520px; background: var(--krim-card); border: 1px solid var(--krim-border); border-radius: var(--radius-lg); padding: 36px; box-shadow: var(--shadow-lg); }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: 24px;">
        <h2 style="font-weight: 800; font-size: 1.3rem;">Onboard Organization</h2>
        <p class="text-muted" style="font-size: 0.82rem;">Select your institutional domain to establish platform credentials.</p>
      </div>

      <form id="registerForm" onsubmit="handleRegister(event)">
        <div style="margin-bottom: 14px;">
          <label class="font-mono text-muted" style="font-size:0.75rem; display:block; margin-bottom:6px;">ORGANIZATION / FULL LEGAL NAME</label>
          <input type="text" id="orgName" class="krim-input" placeholder="e.g. Apex Industrial Solutions Inc." required />
        </div>

        <div style="margin-bottom: 14px;">
          <label class="font-mono text-muted" style="font-size:0.75rem; display:block; margin-bottom:6px;">OFFICIAL WORK EMAIL</label>
          <input type="email" id="email" class="krim-input" placeholder="corporate@company.com" required />
        </div>

        <div style="margin-bottom: 14px;">
          <label class="font-mono text-muted" style="font-size:0.75rem; display:block; margin-bottom:6px;">ACCOUNT TYPE / PLATFORM DOMAIN</label>
          <select id="role" class="krim-input" required style="cursor:pointer;">
            <option value="customer">Shipper & Commercial Client (Customer App)</option>
            <option value="enterprise">Multi-National Enterprise / Subsidiary</option>
            <option value="partner">Carrier / Fleet / Logistics Partner</option>
            <option value="warehouse">Warehouse & Terminal Operator</option>
            <option value="freight">Freight Forwarder & Customs Broker</option>
            <option value="driver">Independent Driver / Fleet Operator</option>
          </select>
        </div>

        <div style="margin-bottom: 20px;">
          <label class="font-mono text-muted" style="font-size:0.75rem; display:block; margin-bottom:6px;">MASTER PASSWORD</label>
          <input type="password" id="password" class="krim-input" placeholder="••••••••••••" required minlength="8" />
        </div>

        <button type="submit" id="btnSubmit" class="btn-krim btn-emerald" style="width:100%;">Create Account & Send Verification</button>
      </form>

      <div style="margin-top:20px; text-align:center; font-size:0.8rem;" class="text-muted">
        Already registered? <a href="/auth/login.html" class="text-cyan" style="text-decoration:none; font-weight:700;">Sign In</a>
      </div>
    </div>
  </div>

  <script src="/core/krim-config.js"></script>
  <script src="/core/krim-supabase.js"></script>
  <script src="/js/session.js"></script>
  <script>
    async function handleRegister(e) {
      e.preventDefault();
      const orgName = document.getElementById("orgName").value;
      const email = document.getElementById("email").value;
      const role = document.getElementById("role").value;
      const password = document.getElementById("password").value;

      try {
        if (window.KrimBackend && window.KrimBackend.client) {
          const { error } = await window.KrimBackend.signUp(email, password, { orgName, role });
          if (error) throw error;
        }

        // Store temporary verification state
        sessionStorage.setItem("KRIM_PENDING_VERIFY_EMAIL", email);
        sessionStorage.setItem("KRIM_PENDING_ROLE", role);

        window.location.href = "/auth/verify-email.html";
      } catch (err) {
        alert("Registration Error: " + err.message);
      }
    }
  </script>
</body>
</html>
