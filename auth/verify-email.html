<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Email — KRIM LOGISTICS OS</title>
  <link rel="stylesheet" href="/core/krim-core.css" />
  <link rel="stylesheet" href="/core/krim-components.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    .auth-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .auth-card { width: 100%; max-width: 440px; background: var(--krim-card); border: 1px solid var(--krim-border); border-radius: var(--radius-lg); padding: 36px; text-align: center; box-shadow: var(--shadow-lg); }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div style="font-size: 2.5rem; margin-bottom: 12px;">✉️</div>
      <h2 style="font-weight: 800; font-size: 1.3rem;">Verify Your Email</h2>
      <p class="text-muted" style="font-size: 0.85rem; margin-top: 8px;">
        We sent a 6-digit verification code to <br/>
        <strong id="displayEmail" class="text-cyan font-mono">user@organization.com</strong>
      </p>

      <div style="margin: 24px 0;">
        <input type="text" id="otpCode" class="krim-input font-mono" placeholder="1 2 3 4 5 6" style="text-align: center; font-size: 1.4rem; letter-spacing: 0.3em;" maxlength="6" />
      </div>

      <button onclick="confirmVerification()" class="btn-krim btn-primary" style="width: 100%;">Verify & Activate Workspace</button>

      <div style="margin-top: 20px; font-size: 0.78rem;" class="text-muted">
        Didn't receive the code? <a href="#" onclick="resendCode()" class="text-cyan" style="text-decoration:none;">Resend OTP</a>
      </div>
    </div>
  </div>

  <script src="/core/krim-config.js"></script>
  <script src="/js/session.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const email = sessionStorage.getItem("KRIM_PENDING_VERIFY_EMAIL") || "partner@krim.com";
      document.getElementById("displayEmail").innerText = email;
    });

    function confirmVerification() {
      const code = document.getElementById("otpCode").value;
      if (code.length < 6) {
        alert("Please enter a valid 6-digit verification code.");
        return;
      }

      const role = sessionStorage.getItem("KRIM_PENDING_ROLE") || "customer";
      KrimSession.set({
        email: sessionStorage.getItem("KRIM_PENDING_VERIFY_EMAIL"),
        role: role,
        token: "krim_verified_token_" + Math.random().toString(36).substring(2),
        accountId: `${role.substring(0,3).toUpperCase()}-88392`
      });

      window.location.href = KRIM_CONFIG.ROUTES[role] || KRIM_CONFIG.ROUTES.customer;
    }

    function resendCode() {
      alert("Verification code has been re-sent to your inbox.");
    }
  </script>
</body>
</html>
