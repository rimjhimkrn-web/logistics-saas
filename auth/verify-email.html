<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>KRIM Logistics OS — Verify Email</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<script>
(function(){var p=location.pathname;var b=p.indexOf("/logistics-saas/")===0?"/logistics-saas/":"/";var l=document.createElement("link");l.rel="stylesheet";l.href=b+"core/krim-unified-page.css";document.head.appendChild(l);}());
</script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:#f8fafc;color:#0f172a;font-family:Inter,system-ui,-apple-system,sans-serif}
header,footer{padding:22px max(20px,calc((100% - 1000px)/2))}header{background:white;border-bottom:1px solid #e2e8f0;font-weight:800;letter-spacing:.06em}
main{width:min(100% - 32px,460px);margin:auto;padding:34px 28px;background:white;border:1px solid #e2e8f0;border-radius:20px;box-shadow:0 18px 50px #0f172a0d}
.badge{width:48px;height:48px;margin:0 auto 16px;display:grid;place-items:center;border-radius:15px;background:#e0f2fe;color:#0369a1;font-size:22px}
h1{text-align:center;font-size:25px;margin:0 0 10px}p{text-align:center;color:#64748b;font-size:14px;line-height:1.6}
label{display:block;margin:20px 0 8px;font-size:13px;font-weight:700}
input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}
input:focus{outline:2px solid #0284c7;border-color:#0284c7}
#otp-code{text-align:center;font-size:24px;letter-spacing:.4em;font-family:ui-monospace,monospace}
button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:10px;background:#0369a1;color:white;font-weight:750;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#feedback{margin-top:16px;padding:12px;border-radius:10px;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
a{color:#0369a1;font-weight:700;text-decoration:none}.back{display:block;text-align:center;margin-top:20px;font-size:14px}
footer{text-align:center;color:#64748b;font-size:12px}
</style>
</head>
<body>
<header>KRIM <span style="color:#0284c7">LOGISTICS OS</span></header>
<main>
<div class="badge" aria-hidden="true">✉</div>
<h1>Verify your email</h1>
<p>Enter the email address and six-digit signup code from Supabase, if email confirmation is enabled for your account.</p>
<div id="feedback" role="status" aria-live="polite" hidden></div>
<form id="verify-form">
<label for="email">Email address</label>
<input id="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@company.com">
<label for="otp-code">Six-digit confirmation code</label>
<input id="otp-code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required placeholder="000000">
<button id="submit-btn" type="submit">Verify email</button>
</form>
<a class="back" href="login.html">← Back to sign in</a>
</main>
<footer>© 2026 KRIM Logistics</footer>
<script>
(function(){
 const client=window.KRIM_SUPABASE;
 const form=document.getElementById("verify-form");
 const email=document.getElementById("email");
 const token=document.getElementById("otp-code");
 const button=document.getElementById("submit-btn");
 const feedback=document.getElementById("feedback");
 email.value=(new URLSearchParams(location.search).get("email")||"").trim().toLowerCase();
 function show(message,ok){
  feedback.hidden=false;feedback.textContent=message;
  feedback.style.background=ok?"#ecfdf5":"#fff1f2";
  feedback.style.color=ok?"#065f46":"#9f1239";
 }
 form.addEventListener("submit",async function(event){
  event.preventDefault();
  const address=email.value.trim().toLowerCase();
  const code=token.value.trim();
  if(!address||!/^\d{6}$/.test(code)){show("Enter a valid email address and six-digit code.",false);return;}
  button.disabled=true;button.textContent="Verifying…";
  try{
   const result=await client.auth.verifyOtp({email:address,token:code,type:"signup"});
   if(result.error) throw result.error;
   show("Email verified successfully. Redirecting to sign in…",true);
   form.hidden=true;
   setTimeout(function(){location.replace("login.html");},900);
  }catch(error){
   show(error&&error.message?error.message:"Email verification failed. The code may be invalid or expired.",false);
   button.disabled=false;button.textContent="Verify email";
  }
 });
})();
</script>
</body>
</html>
