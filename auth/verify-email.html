<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KRIM OS — Verify Email OTP</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#060b17] text-slate-100 min-h-screen flex flex-col justify-between items-center p-4 font-sans">
  <header class="w-full max-w-7xl flex justify-between items-center py-4">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 bg-gradient-to-tr from-cyan-500 to-blue-600 rounded-xl flex items-center justify-center font-black text-white text-lg">K</div>
      <span class="font-extrabold text-lg tracking-wider text-white">KRIM <span class="text-xs font-mono text-cyan-400 block -mt-1">LOGISTICS OS</span></span>
    </div>
  </header>

  <main class="w-full max-w-md p-8 bg-[#0f172a] border border-white/10 rounded-2xl shadow-2xl text-center">
    <div class="w-12 h-12 mx-auto mb-3 bg-cyan-500/10 border border-cyan-500/30 rounded-full flex items-center justify-center text-xl text-cyan-400">✉️</div>
    <h1 class="text-xl font-extrabold text-white">Verify Work Email</h1>
    <p class="text-xs text-slate-400 mt-1">Enter 6-digit confirmation OTP code sent to your inbox.</p>

    <div id="alert-box" class="hidden p-3 my-4 rounded-lg text-xs text-left"></div>

    <form id="otp-form" class="mt-6 space-y-4">
      <input type="text" id="otp-code" maxlength="6" autofocus placeholder="000000" class="w-full py-3 text-center text-2xl font-mono tracking-[0.5em] bg-[#0b1329] border border-white/10 rounded-xl text-cyan-400 focus:outline-none focus:border-cyan-400">

      <button type="submit" id="submit-btn" class="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold text-xs rounded-lg uppercase tracking-wider hover:opacity-90 transition-all">
        Confirm & Activate Account →
      </button>
    </form>
  </main>

  <footer class="text-[11px] font-mono text-slate-500 py-4">© 2026 KRIM Logistics Engine</footer>

  <script type="module">
    import { supabase, AUTH_ROUTES, renderTestSwitcher } from './js/auth-core.js';
    renderTestSwitcher();

    const urlParams = new URLSearchParams(window.location.search);
    const emailParam = urlParams.get('email') || '';

    const form = document.getElementById('otp-form');
    const alertBox = document.getElementById('alert-box');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const token = document.getElementById('otp-code').value;

      const { data, error } = await supabase.auth.verifyOtp({
        email: emailParam,
        token: token,
        type: 'signup'
      });

      if (error) {
        alertBox.className = 'p-3 my-4 rounded-lg text-xs bg-rose-500/10 border border-rose-500/30 text-rose-400';
        alertBox.innerText = error.message;
        alertBox.classList.remove('hidden');
      } else {
        window.location.href = AUTH_ROUTES.DASHBOARD;
      }
    });
  </script>
</body>
</html>
