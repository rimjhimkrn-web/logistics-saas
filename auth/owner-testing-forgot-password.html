<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>KRIM Staging · Password Recovery</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<body><main class="card"><div style="color:#64dfeb;font-size:10px;font-weight:900;letter-spacing:.16em">STAGING · OWNER SECURITY</div><h1>Reset staging password</h1><p class="muted">This recovery page connects only to KRIM Logistics Staging. It cannot reset your Production password. A staging account must already exist.</p><form id="form"><label for="email">Staging account email</label><input id="email" type="email" autocomplete="email" required><button id="send">Send staging reset link</button></form><p id="feedback" role="status"></p><p><a href="krim-admin-access.html">Back to staging sign in</a></p></main>
<script>
(()=>{const URL="https://qrpcivhdxobiaofppbkl.supabase.co",KEY="sb_publishable_WYEwWxfNmMryQCu-mLAlQg_FRmn4_O3",client=window.supabase.createClient(URL,KEY),form=document.getElementById("form"),email=document.getElementById("email"),btn=document.getElementById("send"),feedback=document.getElementById("feedback");const preset=new URLSearchParams(location.search).get("email");if(preset)email.value=preset;form.addEventListener("submit",async e=>{e.preventDefault();btn.disabled=true;feedback.textContent="Requesting staging reset…";try{const base=location.pathname.includes("/logistics-saas/")?"/logistics-saas/":"/";const redirectTo=location.origin+base+"auth/owner-testing-reset-password.html";const {error}=await client.auth.resetPasswordForEmail(email.value.trim().toLowerCase(),{redirectTo});if(error)throw error;feedback.textContent="If this email exists in Staging Auth, a reset email has been sent. Check your inbox and spam folder.";}catch(err){feedback.textContent=err.message||"Could not request staging reset.";}finally{btn.disabled=false;}});})();
