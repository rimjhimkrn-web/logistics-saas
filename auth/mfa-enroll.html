<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MFA Enrollment — KRIM LOGISTICS OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/core/krim-config.js"></script>
  <script src="/core/krim-supabase.js"></script>
  <script src="/core/krim-mfa.js"></script>

  <style>
    :root {
      --krim-bg: #030712;
      --krim-surface: #0b1329;
      --krim-surface-card: #0f172a;
      --krim-border: rgba(255, 255, 255, 0.08);
      --krim-cyan: #00d2ff;
      --krim-emerald: #10b981;
      --krim-text-muted: #94a3b8;
      --font-code: "JetBrains Mono", monospace;
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--krim-bg);
      color: #fff;
      font-family: var(--font-sans);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: var(--krim-surface-card);
      border: 1px solid var(--krim-border);
      border-radius: 20px;
      padding: 36px;
      width: 100%;
      max-width: 460px;
      text-align: center;
    }

    .qr-placeholder {
      background: #fff;
      padding: 16px;
      border-radius: 12px;
      display: inline-block;
      margin: 20px 0;
    }

    .secret-key {
      font-family: var(--font-code);
      background: var(--krim-surface);
      padding: 10px;
      border-radius: 8px;
      color: var(--krim-cyan);
      font-size: 0.85rem;
      margin-bottom: 20px;
      word-break: break-all;
    }

    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, #00d2ff 0%, #0072ff 100%);
      color: #fff;
      font-weight: 700;
      border: none;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2 style="font-size: 1.3rem; font-weight: 800;">Enroll Multi-Factor Authentication</h2>
    <p style="color: var(--krim-text-muted); font-size: 0.82rem; margin-top: 6px;">Scan the QR code using Google Authenticator or Authy to secure your node.</p>

    <div class="qr-placeholder" id="qr-container">
      <div style="color: #000; font-size: 0.8rem;">Generating QR Code...</div>
    </div>

    <div style="font-size: 0.72rem; color: var(--krim-text-muted); margin-bottom: 4px;">MANUAL SECRET KEY</div>
    <div class="secret-key" id="secret-key-display">----------------</div>

    <input type="text" id="confirm-code" placeholder="Enter 6-digit confirmation code" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--krim-border); background: var(--krim-surface); color: #fff; text-align: center; font-family: var(--font-code); margin-bottom: 16px;">

    <button onclick="confirmEnrollment()" class="btn-primary">Activate MFA Protection →</button>
  </div>

  <script>
    let activeFactorId = null;

    async function initEnrollment() {
      try {
        const { factorId, qrCodeUrl, secret } = await KrimMFA.enroll();
        activeFactorId = factorId;
        document.getElementById('secret-key-display').innerText = secret;
        document.getElementById('qr-container').innerHTML = `<img src="${qrCodeUrl}" alt="MFA QR Code" style="width: 160px; height: 160px; display: block;">`;
      } catch (e) {
        alert("Failed to initialize MFA: " + e.message);
      }
    }

    async function confirmEnrollment() {
      const code = document.getElementById('confirm-code').value;
      if (!code || !activeFactorId) return alert("Please enter the verification code.");

      try {
        await KrimMFA.verifyEnrollment(activeFactorId, code);
        alert("MFA successfully enrolled! Redirecting to workspace...");
        window.location.href = "/dashboard.html";
      } catch (e) {
        alert("Verification failed: " + e.message);
      }
    }

    window.onload = initEnrollment;
  </script>
</body>
</html>
