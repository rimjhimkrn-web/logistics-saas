<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KRIM OS — Enroll MFA Factor</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#060b17] text-slate-100 min-h-screen flex flex-col justify-between items-center p-4 font-sans">
  <header class="w-full max-w-7xl flex justify-between items-center py-4">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 bg-gradient-to-tr from-cyan-500 to-blue-600 rounded-xl flex items-center justify-center font-black text-white text-lg">K</div>
      <span class="font-extrabold text-lg tracking-wider text-white">KRIM <span class="text-xs font-mono text-cyan-400 block -mt-1">LOGISTICS OS</span></span>
    </div>
  </header>

  <main class="w-full max-w-md p-8 bg-[#0f172a] border border-white/10 rounded-2xl shadow-2xl text-center">
    <h1 class="text-xl font-extrabold text-white">Enroll MFA Factor</h1>
    <p class="text-xs text-slate-400 mt-1">Scan QR code using Google Authenticator or Authy</p>

    <div id="qr-container" class="my-6 p-4 bg-white rounded-xl w-48 h-48 mx-auto flex items-center justify-center text-slate-800 text-xs font-mono">
      Loading QR Code...
    </div>

    <form id="mfa-enroll-form" class="space-y-4">
      <input type="text" id="totp-code" maxlength="6" placeholder="000000" class="w-full py-2.5 text-center text-xl font-mono tracking-[0.3em] bg-[#0b1329] border border-white/10 rounded-lg text-cyan-400 focus:outline-none focus:border-cyan-400">

      <button type="submit" class="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold text-xs rounded-lg uppercase tracking-wider hover:opacity-90 transition-all">
        Activate & Save Factor →
      </button>
    </form>
  </main>

  <footer class="text-[11px] font-mono text-slate-500 py-4">© 2026 KRIM Logistics Engine</footer>

  <script type="module">
    import { supabase, AUTH_ROUTES, renderTestSwitcher } from './js/auth-core.js';
    renderTestSwitcher();

    let factorId = '';

    async function initEnrollment() {
      const { data, error } = await supabase.auth.mfa.enroll({ factorType: 'totp' });
      if (data) {
        factorId = data.id;
        document.getElementById('qr-container').innerHTML = `<img src="${data.totp.qr_code}" alt="MFA QR" class="w-full h-full rounded-lg"/>`;
      }
    }

    document.getElementById('mfa-enroll-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const code = document.getElementById('totp-code').value;

      const { data: challenge } = await supabase.auth.mfa.challenge({ factorId });
      const { error } = await supabase.auth.mfa.verify({ factorId, challengeId: challenge.id, code });

      if (error) {
        alert('Invalid TOTP code');
      } else {
        alert('MFA Successfully Enrolled!');
        window.location.href = AUTH_ROUTES.DASHBOARD;
      }
    });

    initEnrollment();
  </script>
</body>
</html>
