<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KRIM OS — Accept Enterprise Invite</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#060b17] text-slate-100 min-h-screen flex flex-col justify-between items-center p-4 font-sans">
  <header class="w-full max-w-7xl flex justify-between items-center py-4">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 bg-gradient-to-tr from-cyan-500 to-blue-600 rounded-xl flex items-center justify-center font-black text-white text-lg">K</div>
      <span class="font-extrabold text-lg tracking-wider text-white">KRIM <span class="text-xs font-mono text-cyan-400 block -mt-1">LOGISTICS OS</span></span>
    </div>
  </header>

  <main class="w-full max-w-md p-8 bg-[#0f172a] border border-cyan-500/30 rounded-2xl shadow-2xl text-center">
    <div class="w-12 h-12 mx-auto mb-3 bg-cyan-500/10 border border-cyan-500/30 rounded-full flex items-center justify-center text-xl text-cyan-400">🏢</div>
    <h1 class="text-xl font-extrabold text-white">Join Organization</h1>
    <p id="invite-desc" class="text-xs text-slate-400 mt-1">Accept organization invite token.</p>

    <form id="invite-form" class="mt-6 space-y-4">
      <input type="password" id="password" required placeholder="Set Account Password" class="w-full px-3 py-2.5 bg-[#0b1329] border border-white/10 rounded-lg text-sm text-white focus:outline-none focus:border-cyan-400">

      <button type="submit" class="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold text-xs rounded-lg uppercase tracking-wider hover:opacity-90 transition-all">
        Accept Invitation & Access Workspace →
      </button>
    </form>
  </main>

  <footer class="text-[11px] font-mono text-slate-500 py-4">© 2026 KRIM Logistics Engine</footer>

  <script type="module">
    import { supabase, AUTH_ROUTES, renderTestSwitcher } from './js/auth-core.js';
    renderTestSwitcher();

    const urlParams = new URLSearchParams(window.location.search);
    const orgName = urlParams.get('org') || 'Enterprise Workspace';
    document.getElementById('invite-desc').innerText = `You are joining organization: ${orgName}`;

    document.getElementById('invite-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const { error } = await supabase.auth.updateUser({ password });

      if (error) {
        alert(error.message);
      } else {
        window.location.href = AUTH_ROUTES.DASHBOARD;
      }
    });
  </script>
</body>
</html>
