<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KRIM OS — MFA Challenge</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#060b17] text-slate-100 min-h-screen flex flex-col justify-between items-center p-4 font-sans">
  <header class="w-full max-w-7xl flex justify-between items-center py-4">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 bg-gradient-to-tr from-cyan-500 to-blue-600 rounded-xl flex items-center justify-center font-black text-white text-lg">K</div>
      <span class="font-extrabold text-lg tracking-wider text-white">KRIM <span class="text-xs font-mono text-cyan-400 block -mt-1">LOGISTICS OS</span></span>
    </div>
  </header>

  <main class="w-full max-w-md p-8 bg-[#0f172a] border border-cyan-500/30 rounded-2xl shadow-2xl text-center">
    <div class="w-12 h-12 mx-auto mb-3 bg-cyan-500/10 border border-cyan-500/30 rounded-full flex items-center justify-center text-xl text-cyan-400">🛡️</div>
    <h1 class="text-xl font-extrabold text-white">MFA Challenge Required</h1>
    <p class="text-xs text-slate-400 mt-1">Enter code from Google Authenticator / Authy.</p>

    <div id="alert-box" class="hidden p-3 my-4 rounded-lg text-xs text-left"></div>

    <form id="mfa-form" class="mt-6 space-y-4">
      <input type="text" id="mfa-code" maxlength="6" autofocus placeholder="000000" class="w-full py-3 text-center text-2xl font-mono tracking-[0.5em] bg-[#0b1329] border border-white/10 rounded-xl text-cyan-400 focus:outline-none focus:border-cyan-400">

      <button type="submit" id="submit-btn" class="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold text-xs rounded-lg uppercase tracking-wider hover:opacity-90 transition-all">
        Verify AAL2 Token →
      </button>

      <div class="flex justify-between items-center pt-4 border-t border-white/10 text-[11px] font-mono">
        <a href="recovery.html" class="text-slate-400 hover:text-cyan-400">Lost Authenticator?</a>
        <a href="login.html" class="text-rose-400 hover:underline">Cancel Sign In</a>
      </div>
    </form>
  </main>

  <footer class="text-[11px] font-mono text-slate-500 py-4">© 2026 KRIM Logistics Engine</footer>

  <script type="module">
    import { supabase, AUTH_ROUTES, renderTestSwitcher } from './js/auth-core.js';
    renderTestSwitcher();

    const form = document.getElementById('mfa-form');
    const alertBox = document.getElementById('alert-box');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const code = document.getElementById('mfa-code').value;

      const { data: factors } = await supabase.auth.mfa.listFactors();
      const totp = factors?.totp[0];

      if (!totp) {
        alertBox.className = 'p-3 my-4 rounded-lg text-xs bg-rose-500/10 border border-rose-500/30 text-rose-400';
        alertBox.innerText = 'No TOTP factor enrolled for this user.';
        alertBox.classList.remove('hidden');
        return;
      }

      const { data: challenge, error: cErr } = await supabase.auth.mfa.challenge({ factorId: totp.id });
      if (cErr) {
        alertBox.className = 'p-3 my-4 rounded-lg text-xs bg-rose-500/10 border border-rose-500/30 text-rose-400';
        alertBox.innerText = cErr.message;
        alertBox.classList.remove('hidden');
        return;
      }

      const { error: vErr } = await supabase.auth.mfa.verify({ factorId: totp.id, challengeId: challenge.id, code });

      if (vErr) {
        alertBox.className = 'p-3 my-4 rounded-lg text-xs bg-rose-500/10 border border-rose-500/30 text-rose-400';
        alertBox.innerText = 'Invalid verification code.';
        alertBox.classList.remove('hidden');
      } else {
        window.location.href = AUTH_ROUTES.DASHBOARD;
      }
    });
  </script>
</body>
</html>
