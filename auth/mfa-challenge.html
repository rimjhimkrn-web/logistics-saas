<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>KRIM Logistics OS — MFA Challenge</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<script>
(function(){var p=location.pathname;var b=p.indexOf("/logistics-saas/")===0?"/logistics-saas/":"/";var l=document.createElement("link");l.rel="stylesheet";l.href=b+"core/krim-unified-page.css";document.head.appendChild(l);}());
</script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:#f8fafc;color:#0f172a;font-family:Inter,system-ui,-apple-system,sans-serif}
header,footer{padding:22px max(20px,calc((100% - 1000px)/2))}header{background:#fff;border-bottom:1px solid #e2e8f0;font-weight:800;letter-spacing:.06em}
main{width:min(100% - 32px,460px);margin:auto;padding:34px 28px;background:#fff;border:1px solid #e2e8f0;border-radius:20px;box-shadow:0 18px 50px #0f172a0d}
.badge{width:48px;height:48px;margin:0 auto 16px;display:grid;place-items:center;border-radius:15px;background:#dbeafe;color:#1d4ed8;font-size:22px}
h1{text-align:center;font-size:25px;margin:0 0 10px}p{text-align:center;color:#64748b;font-size:14px;line-height:1.6}
label{display:block;margin:22px 0 8px;font-size:13px;font-weight:700}
input{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:10px;font-size:24px;text-align:center;letter-spacing:.4em;font-family:ui-monospace,monospace}
input:focus{outline:2px solid #0284c7;border-color:#0284c7}
button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:10px;background:#0369a1;color:#fff;font-weight:750;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}#feedback{margin-top:16px;padding:12px;border-radius:10px;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.links{display:flex;justify-content:space-between;gap:16px;margin-top:20px;padding-top:18px;border-top:1px solid #e2e8f0;font-size:13px}
a{color:#0369a1;font-weight:700;text-decoration:none}.cancel{color:#be123c}
footer{text-align:center;color:#64748b;font-size:12px}
</style>
</head>
<body>
<header>KRIM <span style="color:#0284c7">LOGISTICS OS</span></header>
<main>
<div class="badge" aria-hidden="true">🛡</div>
<h1>Multi-factor challenge</h1>
<p>Enter the current six-digit code from the authenticator app enrolled on your account.</p>
<div id="feedback" role="status" aria-live="polite" hidden></div>
<form id="mfa-form">
<label for="mfa-code">Authenticator code</label>
<input id="mfa-code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required placeholder="000000" autofocus>
<button id="submit-btn" type="submit">Verify and continue</button>
</form>
<div class="links"><a href="recovery.html">Lost authenticator?</a><a class="cancel" href="login.html">Cancel sign-in</a></div>
</main>
<footer>© 2026 KRIM Logistics</footer>
<script>
(function(){
 const client=window.KRIM_SUPABASE;
 const form=document.getElementById("mfa-form");
 const codeInput=document.getElementById("mfa-code");
 const button=document.getElementById("submit-btn");
 const feedback=document.getElementById("feedback");
 function show(message,ok){
  feedback.hidden=false;feedback.textContent=message;
  feedback.style.background=ok?"#ecfdf5":"#fff1f2";
  feedback.style.color=ok?"#065f46":"#9f1239";
 }
 function destination(user){
  const type=String(user.user_metadata?.krim_account_type||user.app_metadata?.krim_account_type||user.user_metadata?.account_type||"customer").toLowerCase();
  const routes={customer:"../app/customer/index.html",partner:"../app/partner/index.html",enterprise:"../app/enterprise/index.html",driver:"../app/driver/index.html",warehouse:"../app/warehouse/index.html",customs:"../app/customs/index.html",finance:"../app/finance/index.html"};
  return routes[type]||"../app/customer/index.html";
 }
 form.addEventListener("submit",async function(event){
  event.preventDefault();
  const code=codeInput.value.trim();
  if(!/^\d{6}$/.test(code)){show("Enter the six-digit code from your authenticator app.",false);return;}
  button.disabled=true;button.textContent="Verifying…";
  try{
   if(!client)throw new Error("Supabase configuration did not load. Refresh and try again.");
   const sessionResult=await client.auth.getSession();
   if(sessionResult.error)throw sessionResult.error;
   const session=sessionResult.data.session;
   if(!session?.user)throw new Error("Your sign-in session has expired. Please sign in again.");
   const listResult=await client.auth.mfa.listFactors();
   if(listResult.error)throw listResult.error;
   const factors=listResult.data?.totp||[];
   const savedId=sessionStorage.getItem("KRIM_MFA_FACTOR_ID");
   const factor=factors.find(item=>item.id===savedId&&item.status==="verified")||factors.find(item=>item.status==="verified");
   if(!factor)throw new Error("No verified authenticator was found. Sign in again or enroll MFA in account security settings.");
   const challengeResult=await client.auth.mfa.challenge({factorId:factor.id});
   if(challengeResult.error)throw challengeResult.error;
   const verifyResult=await client.auth.mfa.verify({factorId:factor.id,challengeId:challengeResult.data.id,code});
   if(verifyResult.error)throw verifyResult.error;
   sessionStorage.removeItem("KRIM_MFA_FACTOR_ID");
   show("MFA verified. Opening your workspace…",true);
   form.hidden=true;
   setTimeout(function(){location.replace(destination(session.user));},700);
  }catch(error){
   show(error&&error.message?error.message:"MFA verification failed. Check the code and try again.",false);
   button.disabled=false;button.textContent="Verify and continue";
  }
 });
})();
</script>
</body>
</html>
