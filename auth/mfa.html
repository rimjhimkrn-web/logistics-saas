<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MFA Verification — KRIM LOGISTICS OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/core/krim-config.js"></script>
  <script src="/core/krim-supabase.js"></script>
  <script src="/core/krim-mfa.js"></script>
  <script src="/js/session.js"></script>

  <style>
    :root {
      --krim-bg: #030712;
      --krim-surface: #0b1329;
      --krim-surface-card: #0f172a;
      --krim-border: rgba(255, 255, 255, 0.08);
      --krim-cyan: #00d2ff;
      --krim-emerald: #10b981;
      --krim-rose: #f43f5e;
      --krim-text-muted: #94a3b8;
      --font-code: "JetBrains Mono", monospace;
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--krim-bg);
      color: #fff;
      font-family: var(--font-sans);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .mfa-card {
      background: var(--krim-surface-card);
      border: 1px solid var(--krim-border);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .otp-input {
      font-family: var(--font-code);
      font-size: 2rem;
      letter-spacing: 0.4em;
      text-align: center;
      background: var(--krim-surface);
      border: 1px solid var(--krim-border);
      color: var(--krim-cyan);
      padding: 12px;
      border-radius: 12px;
      width: 100%;
      margin: 20px 0;
      outline: none;
    }
    .otp-input:focus { border-color: var(--krim-cyan); }

    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, #00d2ff 0%, #0072ff 100%);
      color: #fff;
      font-weight: 700;
      border: none;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="mfa-card">
    <div style="font-size: 2.5rem; margin-bottom: 12px;">🛡️</div>
    <h2 style="font-size: 1.3rem; font-weight: 800;">MFA Verification Required</h2>
    <p style="color: var(--krim-text-muted); font-size: 0.82rem; margin-top: 6px;">Enter the 6-digit verification code from your Authenticator App.</p>

    <div id="error-msg" style="color: var(--krim-rose); font-size: 0.8rem; margin-top: 10px; display: none;"></div>

    <input type="text" id="mfa-code" class="otp-input" maxlength="6" placeholder="000000" autofocus>

    <button onclick="verifyMFA()" class="btn-primary">Verify & Access OS →</button>
  </div>

  <script>
    async function verifyMFA() {
      const code = document.getElementById('mfa-code').value;
      const factorId = sessionStorage.getItem('KRIM_MFA_FACTOR_ID');
      const errorMsg = document.getElementById('error-msg');

      if (!code || code.length !== 6) {
        errorMsg.innerText = "Please enter a valid 6-digit TOTP code.";
        errorMsg.style.display = "block";
        return;
      }

      try {
        await KrimMFA.challengeAndVerify(factorId, code);
        
        // Fetch current session info
        const session = await window.KrimBackend.getSession();
        const role = session.user.user_metadata?.role || KRIM_CONFIG.ROLES.PARTNER;

        KrimSession.set({
          token: session.access_token,
          user: session.user,
          role: role,
          mfaVerified: true
        });

        window.location.href = KRIM_CONFIG.ROUTES[role] || KRIM_CONFIG.ROUTES.partner;
      } catch (e) {
        errorMsg.innerText = e.message || "Invalid authentication code.";
        errorMsg.style.display = "block";
      }
    }
  </script>
</body>
</html>
