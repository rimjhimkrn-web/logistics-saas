<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MFA Verification — KRIM LOGISTICS OS</title>
  <link rel="stylesheet" href="/core/krim-core.css" />
  <link rel="stylesheet" href="/core/krim-components.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    .auth-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .auth-card { width: 100%; max-width: 420px; background: var(--krim-card); border: 1px solid var(--krim-border); border-radius: var(--radius-lg); padding: 32px; text-align: center; }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div style="font-size: 2.2rem; margin-bottom: 10px;">🔐</div>
      <h2 style="font-weight: 800; font-size: 1.2rem;">Two-Factor Authentication</h2>
      <p class="text-muted" style="font-size: 0.82rem; margin-top: 6px;">Enter the authentication code generated by your hardware token or authenticator app.</p>

      <div style="margin: 20px 0;">
        <input type="text" id="mfaCode" class="krim-input font-mono" placeholder="000 000" style="text-align: center; font-size: 1.4rem; letter-spacing: 0.25em;" maxlength="6" />
      </div>

      <button onclick="verifyMFA()" class="btn-krim btn-primary" style="width: 100%;">Authorize Session</button>
      <div style="margin-top:16px;">
        <a href="/auth/recovery.html" class="text-muted" style="font-size:0.75rem; text-decoration:none;">Use Backup Recovery Code</a>
      </div>
    </div>
  </div>

  <script src="/core/krim-config.js"></script>
  <script src="/js/session.js"></script>
  <script>
    function verifyMFA() {
      const code = document.getElementById("mfaCode").value;
      if (code.length < 6) return alert("Enter valid 6-digit MFA code.");
      
      const session = KrimSession.get() || { role: "super_admin", email: "admin@krim.com", token: "mfa_token" };
      session.mfaVerified = true;
      KrimSession.set(session);

      window.location.href = KRIM_CONFIG.ROUTES[session.role] || KRIM_CONFIG.ROUTES.super_admin;
    }
  </script>
</body>
</html>
