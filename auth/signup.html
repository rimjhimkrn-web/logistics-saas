<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRIM Logistics OS — Customer Registration</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#06b6d4">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { dark: { bg: '#090d16', card: '#111827', border: '#1f2937', accent: '#06b6d4' } } } } }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#090d16] text-gray-100 min-h-screen flex flex-col justify-between font-sans antialiased selection:bg-purple-500 selection:text-white">

    <div class="w-full bg-[#05080f] border-b border-gray-900 text-[11px] text-gray-400 py-1.5 px-6 flex justify-between items-center font-mono">
        <span class="flex items-center space-x-1.5"><span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span><span class="text-emerald-400 font-semibold">KRIM CORE: ONLINE</span></span>
        <span class="text-purple-400">Authentication Gateway</span>
    </div>

    <main class="max-w-md mx-auto px-4 py-16 flex-grow w-full flex items-center">
        <div class="bg-[#111827] border border-gray-800/80 rounded-2xl p-8 shadow-2xl w-full space-y-6">
            <div class="text-center space-y-2">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-purple-600 to-indigo-600 flex items-center justify-center text-white font-bold text-xl mx-auto shadow">K</div>
                <h1 class="text-2xl font-extrabold text-white">Create Shipper Node</h1>
                <p class="text-xs text-gray-400 font-mono">Register your enterprise account on KRIM OS.</p>
            </div>

            <form id="signup-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-mono uppercase tracking-wider text-gray-400 mb-2">Corporate Email</label>
                    <input type="email" id="signup-email" required placeholder="shipper@company.com" class="w-full bg-[#090d16] border border-gray-700/80 rounded-xl px-4 py-3 text-white font-mono text-sm focus:outline-none focus:border-purple-500">
                </div>
                <div>
                    <label class="block text-xs font-mono uppercase tracking-wider text-gray-400 mb-2">Password</label>
                    <input type="password" id="signup-password" required placeholder="••••••••••••" class="w-full bg-[#090d16] border border-gray-700/80 rounded-xl px-4 py-3 text-white font-mono text-sm focus:outline-none focus:border-purple-500">
                </div>
                <button type="submit" id="signup-btn" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3.5 px-4 rounded-xl uppercase text-xs font-mono tracking-wider transition cursor-pointer shadow-lg shadow-purple-600/20">
                    Initialize Registration →
                </button>
            </form>

            <div class="text-center text-xs text-gray-400 font-mono pt-2">
                Already registered? <a href="/auth/login.html" class="text-purple-400 hover:underline">Sign In</a>
            </div>
        </div>
    </main>

    <footer class="border-t border-gray-800 py-8 text-center text-xs text-gray-500 font-mono">KRIM Logistics OS © 2026.</footer>

    <script>
        const SUPABASE_PROJECT_URL = "https://ebltviniygljwwseplph.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVibHR2aW5peWdsandsZXNwbHBoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEyOTIzMjksImV4cCI6MjA1Njg2ODMyOX0.9W2xZ47Lg2MvS8r1Z6N3q5t8v9w0x1y2z3A4B5C6D7E";
        const supabaseClient = window.supabase.createClient(SUPABASE_PROJECT_URL, SUPABASE_ANON_KEY);

        document.getElementById('signup-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('signup-btn');
            btn.disabled = true;
            btn.innerText = "Registering Node...";

            try {
                const email = document.getElementById('signup-email').value;
                const password = document.getElementById('signup-password').value;

                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: { emailRedirectTo: window.location.origin + '/auth/verify-email.html' }
                });

                if (error) throw error;

                alert("Registration successful! Please check your email to verify your account.");
                window.location.href = "/auth/verify-email.html";
            } catch (err) {
                alert("Registration Error: " + err.message);
                btn.disabled = false;
                btn.innerText = "Initialize Registration →";
            }
        });
    </script>
</body>
</html>
