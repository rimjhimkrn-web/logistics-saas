<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KRIM OS — Set New Credentials</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#060b17] text-slate-100 min-h-screen flex flex-col justify-between items-center p-4 font-sans">
  <header class="w-full max-w-7xl flex justify-between items-center py-4">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 bg-gradient-to-tr from-cyan-500 to-blue-600 rounded-xl flex items-center justify-center font-black text-white text-lg">K</div>
      <span class="font-extrabold text-lg tracking-wider text-white">KRIM <span class="text-xs font-mono text-cyan-400 block -mt-1">LOGISTICS OS</span></span>
    </div>
  </header>

  <main class="w-full max-w-md p-8 bg-[#0f172a] border border-white/10 rounded-2xl shadow-2xl">
    <div class="text-center mb-6">
      <h1 class="text-xl font-extrabold text-white">Update Password</h1>
      <p class="text-xs text-slate-400 mt-1">Minimum 12 characters with symbol entropy.</p>
    </div>

    <div id="alert-box" class="hidden p-3 mb-4 rounded-lg text-xs"></div>

    <form id="reset-form" class="space-y-4">
      <div>
        <label class="block text-[11px] font-mono text-slate-400 uppercase mb-1">New Password</label>
        <input type="password" id="password" required placeholder="••••••••••••" class="w-full px-3 py-2.5 bg-[#0b1329] border border-white/10 rounded-lg text-sm text-white font-mono focus:outline-none focus:border-cyan-400">
      </div>

      <div>
        <label class="block text-[11px] font-mono text-slate-400 uppercase mb-1">Confirm Password</label>
        <input type="password" id="confirm-password" required placeholder="••••••••••••" class="w-full px-3 py-2.5 bg-[#0b1329] border border-white/10 rounded-lg text-sm text-white font-mono focus:outline-none focus:border-cyan-400">
      </div>

      <button type="submit" id="submit-btn" class="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold text-xs rounded-lg uppercase tracking-wider hover:opacity-90 transition-all">
        Update & Revoke Other Sessions →
      </button>
    </form>
  </main>

  <footer class="text-[11px] font-mono text-slate-500 py-4">© 2026 KRIM Logistics Engine</footer>

  <script type="module">
    import { supabase, AUTH_ROUTES, renderTestSwitcher } from './js/auth-core.js';
    renderTestSwitcher();

    const form = document.getElementById('reset-form');
    const alertBox = document.getElementById('alert-box');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const pwd = document.getElementById('password').value;
      const confirmPwd = document.getElementById('confirm-password').value;

      if (pwd !== confirmPwd || pwd.length < 12) {
        alertBox.className = 'p-3 mb-4 rounded-lg text-xs bg-rose-500/10 border border-rose-500/30 text-rose-400';
        alertBox.innerText = 'Passwords must match and contain at least 12 characters.';
        alertBox.classList.remove('hidden');
        return;
      }

      const { error } = await supabase.auth.updateUser({ password: pwd });

      if (error) {
        alertBox.className = 'p-3 mb-4 rounded-lg text-xs bg-rose-500/10 border border-rose-500/30 text-rose-400';
        alertBox.innerText = error.message;
        alertBox.classList.remove('hidden');
      } else {
        alertBox.className = 'p-3 mb-4 rounded-lg text-xs bg-emerald-500/10 border border-emerald-500/30 text-emerald-400';
        alertBox.innerText = 'Password updated! Revoking active sessions and redirecting...';
        alertBox.classList.remove('hidden');

        setTimeout(async () => {
          await supabase.auth.signOut({ scope: 'global' });
          window.location.href = AUTH_ROUTES.SIGN_IN;
        }, 2000);
      }
    });
  </script>
</body>
</html>
