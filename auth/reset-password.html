<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff"><title>KRIM Logistics OS — Reset Password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script>
<script>(function(){var p=location.pathname;var b=p.indexOf("/logistics-saas/")===0?"/logistics-saas/":"/";var l=document.createElement("link");l.rel="stylesheet";l.href=b+"core/krim-unified-page.css";document.head.appendChild(l);}());</script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f8fafc;color:#0f172a;font-family:Inter,system-ui,-apple-system,sans-serif;display:flex;flex-direction:column}
header,footer{padding:22px max(20px,calc((100% - 1000px)/2))}header{border-bottom:1px solid #e2e8f0;background:#fff;font-weight:800;letter-spacing:.06em}
main{width:min(100% - 32px,460px);margin:auto;padding:34px 28px;background:#fff;border:1px solid #e2e8f0;border-radius:20px;box-shadow:0 18px 50px #0f172a0d}
h1{font-size:26px;margin:0 0 10px}p{color:#64748b;line-height:1.6;font-size:14px}label{display:block;font-size:13px;font-weight:650;margin:20px 0 8px}
input{width:100%;padding:13px 14px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}input:focus{outline:2px solid #0284c7;border-color:#0284c7}
button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:10px;background:#0369a1;color:white;font-weight:750;font-size:14px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}
#feedback{padding:12px;border-radius:10px;margin-top:16px;font-size:14px;line-height:1.5;overflow-wrap:anywhere}a{color:#0369a1;font-weight:650;text-decoration:none}.back{display:block;text-align:center;margin-top:22px;font-size:14px}footer{text-align:center;color:#64748b;font-size:12px}.hidden{display:none!important}
</style><link rel="stylesheet" href="../core/krim-global-interface.css">
<link rel="stylesheet" href="../core/krim-global-interface.css">
</head>
<body class="krim-global-shell"><header>KRIM <span style="color:#0284c7">LOGISTICS OS</span></header>
<main>
<h1>Set a new password</h1>
<p>Use at least 12 characters. Open this page from the password-recovery email. If MFA is enabled, verify your authenticator code before changing the password.</p>
<div id="feedback" role="status" aria-live="polite" hidden></div>
<section id="mfa-section" class="hidden">
<label for="mfa-code">Authenticator code</label><input id="mfa-code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="6-digit code">
<button id="verify-mfa" type="button">Verify MFA and continue</button>
</section>
<form id="reset-form" class="hidden">
<label for="password">New password</label><input id="password" type="password" minlength="12" autocomplete="new-password" required>
<label for="confirm-password">Confirm new password</label><input id="confirm-password" type="password" minlength="12" autocomplete="new-password" required>
<button id="submit-btn" type="submit">Update password & revoke sessions</button>
</form>
<a class="back" href="login.html">← Return to sign in</a>
</main><footer>© 2026 KRIM Logistics</footer>
<script>
(function(){
 const client=window.KRIM_SUPABASE, form=document.getElementById("reset-form"), feedback=document.getElementById("feedback");
 const mfaSection=document.getElementById("mfa-section"), mfaCode=document.getElementById("mfa-code"), verifyBtn=document.getElementById("verify-mfa"), submitBtn=document.getElementById("submit-btn");
 let factorId=null, challengeId=null, recoverySession=false, mfaRequired=false;
 function show(message,ok){feedback.hidden=false;feedback.textContent=message;feedback.style.background=ok?"#ecfdf5":"#fff1f2";feedback.style.color=ok?"#065f46":"#9f1239";}
 async function initialize(){
  if(!client){show("Authentication service did not load. Refresh and try again.",false);return;}
  const hash=new URLSearchParams(location.hash.replace(/^#/,"")), query=new URLSearchParams(location.search);
  const hasRecovery=hash.has("access_token")||hash.get("type")==="recovery"||query.has("code");
  if(!hasRecovery){show("Open this page using the password-recovery link from your email. If it expired, request a new link.",false);return;}
  if(query.has("code")){
   const {error}=await client.auth.exchangeCodeForSession(query.get("code"));
   if(error){show("This recovery link is invalid or expired. Request a new password-reset email.",false);return;}
  }
  const {data,error}=await client.auth.getSession();
  if(error||!data.session){show("This recovery link is invalid or expired. Request a new password-reset email.",false);return;}
  recoverySession=true;
  const {data:aalData,error:aalError}=await client.auth.mfa.getAuthenticatorAssuranceLevel();
  if(aalError){show("Could not check your account's MFA status. Refresh and try again.",false);return;}
  mfaRequired=aalData.nextLevel==="aal2"&&aalData.currentLevel!=="aal2";
  if(mfaRequired){
   const {data:factorData,error:factorError}=await client.auth.mfa.listFactors();
   if(factorError){show("Could not load MFA factors. Sign in again or contact support.",false);return;}
   const factor=(factorData.totp||[]).find(f=>f.status==="verified");
   if(!factor){show("This account requires MFA but no verified authenticator was found. Sign in and review account security, or contact KRIM support.",false);return;}
   factorId=factor.id;mfaSection.classList.remove("hidden");
   show("Your account requires an authenticator check before the password can be changed.",true);
  }else{form.classList.remove("hidden");}
 }
 verifyBtn.addEventListener("click",async function(){
  const code=mfaCode.value.trim();
  if(!/^\d{6}$/.test(code)){show("Enter the current six-digit code from your authenticator app.",false);return;}
  verifyBtn.disabled=true;verifyBtn.textContent="Verifying…";
  try{
   const ch=await client.auth.mfa.challenge({factorId});if(ch.error)throw ch.error;challengeId=ch.data.id;
   const verified=await client.auth.mfa.verify({factorId,challengeId,code});if(verified.error)throw verified.error;
   const aal=await client.auth.mfa.getAuthenticatorAssuranceLevel();
   if(aal.error)throw aal.error;
   if(aal.data.currentLevel!=="aal2")throw new Error("MFA was not completed. Check the code and try again.");
   mfaSection.classList.add("hidden");form.classList.remove("hidden");
   show("MFA verified. You can now set your new password.",true);
  }catch(e){show(e.message||"MFA verification failed. Try again.",false);}
  finally{verifyBtn.disabled=false;verifyBtn.textContent="Verify MFA and continue";}
 });
 form.addEventListener("submit",async function(e){
  e.preventDefault();if(!recoverySession){show("Recovery session expired. Request a new reset link.",false);return;}
  const pwd=document.getElementById("password").value, confirm=document.getElementById("confirm-password").value;
  if(pwd.length<12){show("Use a password with at least 12 characters.",false);return;}
  if(pwd!==confirm){show("The passwords do not match.",false);return;}
  submitBtn.disabled=true;submitBtn.textContent="Updating password…";
  try{
   const aal=await client.auth.mfa.getAuthenticatorAssuranceLevel();if(aal.error)throw aal.error;
   if(aal.data.nextLevel==="aal2"&&aal.data.currentLevel!=="aal2")throw new Error("Complete the authenticator verification first.");
   show("Contacting the authentication service…",true);
   const updatePromise=client.auth.updateUser({password:pwd});
   const result=await Promise.race([updatePromise,new Promise((_,reject)=>setTimeout(()=>reject(new Error("The authentication server did not respond within 20 seconds. The password may or may not have changed. First try signing in with the new password; if it fails, request a fresh recovery link and retry on a stable connection.")),20000))]);
   if(result.error)throw result.error;
   show("Password updated successfully. Signing out all sessions…",true);form.hidden=true;
   setTimeout(async()=>{try{await client.auth.signOut({scope:"global"});}finally{location.replace("login.html");}},1500);
  }catch(err){show(err.message||"Password could not be updated. Request a fresh recovery link and try again.",false);}
  finally{submitBtn.disabled=false;submitBtn.textContent="Update password & revoke sessions";}
 });
 initialize().catch(()=>show("Could not initialize password recovery. Request a fresh reset link and try again.",false));
})();
</script></body></html>
