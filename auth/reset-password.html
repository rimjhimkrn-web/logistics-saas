<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set New Password — KRIM LOGISTICS OS</title>
  <link rel="stylesheet" href="/core/krim-core.css" />
  <link rel="stylesheet" href="/core/krim-components.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    .auth-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .auth-card { width: 100%; max-width: 420px; background: var(--krim-card); border: 1px solid var(--krim-border); border-radius: var(--radius-lg); padding: 32px; }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <h2 style="font-weight: 800; font-size: 1.25rem; margin-bottom: 8px;">Set New Password</h2>
      <p class="text-muted" style="font-size: 0.82rem; margin-bottom: 20px;">Provide a new high-entropy password for your account.</p>

      <form onsubmit="handleReset(event)">
        <div style="margin-bottom: 14px;">
          <label class="font-mono text-muted" style="font-size:0.75rem; display:block; margin-bottom:6px;">NEW PASSWORD</label>
          <input type="password" id="pass1" class="krim-input" placeholder="••••••••••••" required minlength="8" />
        </div>
        <div style="margin-bottom: 20px;">
          <label class="font-mono text-muted" style="font-size:0.75rem; display:block; margin-bottom:6px;">CONFIRM NEW PASSWORD</label>
          <input type="password" id="pass2" class="krim-input" placeholder="••••••••••••" required minlength="8" />
        </div>
        <button type="submit" class="btn-krim btn-emerald" style="width: 100%;">Update Account Credentials</button>
      </form>
    </div>
  </div>

  <script>
    function handleReset(e) {
      e.preventDefault();
      if (document.getElementById("pass1").value !== document.getElementById("pass2").value) {
        alert("Passwords do not match.");
        return;
      }
      alert("Password updated successfully. Please sign in.");
      window.location.href = "/auth/login.html";
    }
  </script>
</body>
</html>
