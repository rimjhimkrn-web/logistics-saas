<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRIM OS — Permanent Enterprise Account Deletion</title>
    <meta name="description" content="Permanently purge your enterprise tenant account, database records, and encryption keys from the KRIM OS multi-tenant network.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0284c7', 600: '#026f9e', 900: '#0f172a' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans antialiased">
    <header class="bg-slate-900/95 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-rose-600 to-slate-900 flex items-center justify-center text-white font-bold text-lg">K</div>
                <div>
                    <span class="text-base font-extrabold tracking-wide text-white uppercase">KRIM OS</span>
                    <span class="block text-[10px] tracking-widest text-rose-400 font-semibold uppercase">Destructive Action</span>
                </div>
            </div>
            <a href="/portal.html" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-4 py-2 rounded-xl text-xs uppercase tracking-wider transition">Return to Portal</a>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center px-6 py-16">
        <div class="w-full max-w-md bg-slate-800 border border-rose-500/30 rounded-3xl p-8 sm:p-10 shadow-2xl space-y-8">
            <div class="space-y-2 text-center">
                <span class="inline-block px-3 py-1 rounded-full text-[10px] font-mono font-semibold bg-rose-500/10 text-rose-400 border border-rose-500/20 uppercase tracking-widest">Irreversible Purge</span>
                <h1 class="text-2xl font-extrabold text-white tracking-tight">Delete Tenant Account</h1>
                <p class="text-slate-400 text-xs font-mono">Permanently erase all tenant databases, keys, and RLS vaults.</p>
            </div>

            <form onsubmit="handleDeletion(event)" class="space-y-5">
                <div class="space-y-2">
                    <label class="block text-xs font-mono text-slate-400 uppercase tracking-wider">Type "PURGE-TENANT" to Confirm</label>
                    <input type="text" id="confirm-text" required placeholder="PURGE-TENANT" class="w-full bg-slate-900 border border-rose-500/30 rounded-xl px-4 py-3.5 text-white text-sm focus:outline-none focus:border-rose-500 transition font-mono">
                </div>

                <div class="space-y-2">
                    <label class="block text-xs font-mono text-slate-400 uppercase tracking-wider">Master Password / AAL2 Token</label>
                    <input type="password" required placeholder="••••••••••••" class="w-full bg-slate-900 border border-rose-500/30 rounded-xl px-4 py-3.5 text-white text-sm focus:outline-none focus:border-rose-500 transition">
                </div>

                <button type="submit" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-semibold py-4 rounded-xl text-xs uppercase tracking-wider transition shadow-lg shadow-rose-600/20 cursor-pointer">
                    Permanently Delete Tenant Account →
                </button>
            </form>
        </div>
    </main>

    <footer class="bg-slate-900 border-t border-slate-800 py-8 text-xs text-slate-500 font-mono text-center">
        <p>KRIM Logistics OS Global Network © 2026. All rights reserved.</p>
    </footer>

    <script>
        function handleDeletion(e) {
            e.preventDefault();
            const txt = document.getElementById('confirm-text').value;
            if(txt !== 'PURGE-TENANT') {
                alert('Confirmation phrase did not match. Deletion aborted.');
                return;
            }
            if(confirm('WARNING: This action is completely irreversible. Purge all tenant data?')) {
                alert('Tenant account and associated database vaults permanently erased via Supabase Auth.');
                window.location.href = '/';
            }
        }
    </script>
</body>
</html>
