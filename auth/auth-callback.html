<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KRIM OS — Authenticating Session...</title>
  <script src="https://cdn.tailwindcss.com"></script>

<!-- KRIM_UNIFIED_LIGHT_THEME_BATCH_1 -->
<script>(function(){var p=location.pathname;var b=p.indexOf("/logistics-saas/")===0?"/logistics-saas/":"/";var l=document.createElement("link");l.rel="stylesheet";l.href=b+"core/krim-unified-page.css";document.head.appendChild(l);}());</script>
</head>
<body class="bg-[#060b17] text-slate-100 min-h-screen flex flex-col justify-center items-center p-4 font-sans text-center">
  <div class="w-12 h-12 mb-4 bg-cyan-500/10 border border-cyan-500/30 rounded-2xl flex items-center justify-center text-xl text-cyan-400 animate-pulse">⚡</div>
  <h1 class="text-lg font-bold text-white">Verifying Identity Token...</h1>
  <p id="status-text" class="text-xs text-slate-400 mt-1 font-mono">Exchanging PKCE authorization code with Supabase backend.</p>

  <script type="module">
    import { supabase, AUTH_ROUTES } from '../auth-core.js';

    async function handleAuthCallback() {
      const statusText = document.getElementById('status-text');

      // Detect session automatically parsed by Supabase JS client from hash/query params
      const { data: { session }, error } = await supabase.auth.getSession();

      if (error || !session) {
        statusText.innerText = "Authentication failed or token expired. Redirecting to login...";
        setTimeout(() => window.location.href = AUTH_ROUTES.SIGN_IN, 2000);
        return;
      }

      // Complete idempotent organization provisioning after email-confirmation callbacks.
      const metadata = session.user?.user_metadata || {};
      const accountType = metadata.krim_account_type;
      const organizationName = String(metadata.company_name || "").trim();
      let dashboardPath = AUTH_ROUTES.DASHBOARD;
      if ((accountType === "customer" || accountType === "partner") && organizationName.length >= 2) {
        const provisionRpc = accountType === "partner"
          ? "krim_provision_partner_organization"
          : "krim_provision_customer_organization";
        const { error: provisionError } = await supabase.rpc(provisionRpc, {
          p_legal_name: organizationName
        });
        if (provisionError) {
          statusText.innerText = "Identity verified, but organization setup could not be completed. Please sign in to retry or contact support.";
          return;
        }
        if (accountType === "partner") dashboardPath = "../app/partner/index.html";
      }

      // Check MFA requirement (AAL level)
      const { data: mfaData } = await supabase.auth.mfa.getAuthenticatorAssuranceLevel();
      if (mfaData?.nextLevel === 'aal2' && mfaData?.currentLevel !== 'aal2') {
        window.location.href = AUTH_ROUTES.MFA_CHALLENGE;
        return;
      }

      statusText.innerText = "Identity verified! Launching workspace...";
      setTimeout(() => window.location.href = dashboardPath, 1000);
    }

    handleAuthCallback();
  </script>
</body>
</html>
