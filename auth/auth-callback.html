<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>KRIM Logistics OS — Authentication Callback</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<script>
(function(){var p=location.pathname;var b=p.indexOf("/logistics-saas/")===0?"/logistics-saas/":"/";var l=document.createElement("link");l.rel="stylesheet";l.href=b+"core/krim-unified-page.css";document.head.appendChild(l);}());
</script>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8fafc;color:#0f172a;font-family:Inter,system-ui,sans-serif;padding:24px}
main{width:min(100%,480px);text-align:center;background:white;border:1px solid #e2e8f0;border-radius:20px;padding:36px 28px;box-shadow:0 18px 50px #0f172a0d}
.mark{width:48px;height:48px;margin:0 auto 18px;border-radius:14px;background:#e0f2fe;color:#0369a1;display:grid;place-items:center;font-size:24px}
h1{font-size:22px;margin:0 0 10px}p{font-size:14px;line-height:1.6;color:#64748b}
a{display:inline-block;margin-top:18px;color:#0369a1;font-weight:700;text-decoration:none}
</style>
<link rel="stylesheet" href="../core/krim-global-interface.css">

<!-- KRIM_GLOBAL_BRAND_ROLLOUT -->
<link rel="stylesheet" href="/logistics-saas/assets/krim-global-brand.css?v=20261111-global-brand-v1">
<script defer src="/logistics-saas/assets/krim-global-brand.js?v=20261111-global-brand-v1"></script>
</head>
<body class="krim-global-shell">
<main>
<div class="mark" aria-hidden="true">K</div>
<h1>Completing secure sign-in</h1>
<p id="status-text" role="status" aria-live="polite">Validating your session with KRIM authentication services…</p>
<a id="login-link" href="login.html" hidden>Return to sign in</a>
</main>
<script>
(async function(){
  const client=window.KRIM_SUPABASE;
  const base=window.KRIM_BASE_PATH||"";
  const status=document.getElementById("status-text");
  const loginLink=document.getElementById("login-link");
  function fail(message){
    status.textContent=message;
    loginLink.href=base+"/auth/login.html";
    loginLink.hidden=false;
  }
  try{
    if(!client)throw new Error("Authentication service did not initialize.");
    const params=new URLSearchParams(location.search);
    const driverInvite=params.get("invite");
    if(driverInvite && /^[a-f0-9]{64}$/.test(driverInvite)){
      sessionStorage.setItem("krim_driver_invite_token",driverInvite);
    }
    const code=params.get("code");
    let session=null;
    if(code){
      const result=await client.auth.exchangeCodeForSession(code);
      if(result.error)throw result.error;
      session=result.data&&result.data.session;
    }else{
      const result=await client.auth.getSession();
      if(result.error)throw result.error;
      session=result.data&&result.data.session;
    }
    if(!session){
      fail("This sign-in link is invalid or expired. Return to sign in and try again.");
      return;
    }
    // Confirmation proves control of the email address; it does NOT authorize a
    // workspace. Every account must pass its role-specific sign-in journey,
    // which checks active membership, organization state, MFA and workspace role.
    const metadata=session.user?.user_metadata||{};
    const accountType=String(metadata.krim_account_type||metadata.account_type||"").trim().toLowerCase();
    if(accountType==="partner"){
      // Email-confirmation signups have no authenticated session during the
      // original signup request, so organization provisioning is completed here.
      // Reuse an existing active partner organization; never create a duplicate.
      const {data: memberships,error: membershipError}=await client
        .from("krim_organization_members")
        .select("organization_id")
        .eq("user_id",session.user.id)
        .eq("status","active");
      if(membershipError)throw membershipError;
      const organizationIds=[...new Set((memberships||[]).map(row=>Number(row.organization_id)).filter(Number.isSafeInteger))];
      let partnerOrganizations=[];
      if(organizationIds.length){
        const {data: organizations,error: organizationError}=await client
          .from("krim_organizations")
          .select("id,organization_type,organization_type_code,status,partner_account_mode")
          .in("id",organizationIds);
        if(organizationError)throw organizationError;
        const partnerTypes=["partner","carrier","forwarder","logistics_provider","warehouse","warehouse_operator"];
        partnerOrganizations=(organizations||[]).filter(org=>
          partnerTypes.includes(String(org.organization_type_code||org.organization_type||"").toLowerCase())
        );
      }
      if(partnerOrganizations.length>1){
        throw new Error("Multiple partner organizations are linked to this account. Contact KRIM support; no organization was selected automatically.");
      }
      let partnerOrganization=partnerOrganizations[0]||null;
      if(partnerOrganization && String(partnerOrganization.status||"").toLowerCase()!=="active"){
        throw new Error("Your partner organization is inactive. Contact KRIM support before continuing.");
      }
      if(!partnerOrganization){
        const legalName=String(metadata.company_name||"").trim();
        if(legalName.length<2)throw new Error("Partner account details are incomplete. Return to Partner Sign Up and contact KRIM support; do not create another account.");
        const {data: organizationId,error: provisionError}=await client.rpc(
          "krim_provision_partner_organization",{p_legal_name:legalName}
        );
        if(provisionError)throw provisionError;
        if(!organizationId)throw new Error("KRIM did not confirm partner organization setup.");
        const {data: organization,error: fetchError}=await client
          .from("krim_organizations")
          .select("id,organization_type,organization_type_code,status,partner_account_mode")
          .eq("id",organizationId)
          .maybeSingle();
        if(fetchError)throw fetchError;
        partnerOrganization=organization;
      }
      if(!partnerOrganization || String(partnerOrganization.status||"").toLowerCase()!=="active"){
        throw new Error("KRIM could not confirm an active partner organization. Contact support.");
      }
      if(!String(partnerOrganization.partner_account_mode||"").trim()){
        const mode=String(metadata.krim_partner_account_mode||"").trim();
        if(["registered_business","individual_interest","development_test"].includes(mode)){
          const profile=metadata.krim_partner_profile && typeof metadata.krim_partner_profile==="object"
            ? metadata.krim_partner_profile : {};
          const {error: modeError}=await client.rpc("krim_set_partner_account_mode",{p_mode:mode,p_profile:profile});
          if(modeError)throw modeError;
        }
      }
    }
    let destination=base+"/auth/login.html";
    if(accountType==="driver")destination=base+"/auth/driver-signin.html";
    else if(accountType==="partner")destination=base+"/auth/partner-signin.html";
    else if(accountType==="customer")destination=base+"/auth/login.html?role=customer";
    else if(accountType==="enterprise")destination=base+"/auth/login.html?role=enterprise";
    status.textContent="Email confirmed. Verifying your KRIM role, organisation membership and MFA…";
    location.replace(destination);
  }catch(error){
    console.error("KRIM auth callback error:",error);
    fail("We could not complete sign-in. The link may have expired, or authentication configuration needs attention.");
  }
})();
</script>
</body>
</html>
