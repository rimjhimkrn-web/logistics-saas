<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accept Invitation — KRIM LOGISTICS OS</title>
  <link rel="stylesheet" href="/core/krim-core.css" />
  <link rel="stylesheet" href="/core/krim-components.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    .auth-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .auth-card { width: 100%; max-width: 440px; background: var(--krim-card); border: 1px solid var(--krim-border); border-radius: var(--radius-lg); padding: 36px; text-align: center; }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <span class="status-pill pill-cyan" style="margin-bottom:12px;">TEAM INVITATION</span>
      <h2 style="font-weight: 800; font-size: 1.3rem; margin-top:8px;">Join Organization Workspace</h2>
      <p class="text-muted" style="font-size: 0.85rem; margin-top: 8px;">
        You have been invited by <strong class="text-cyan">TATA Steel & Infrastructure</strong> to join as <span class="font-mono text-emerald">Enterprise Operations Director</span>.
      </p>

      <div style="margin: 24px 0; text-align:left;">
        <label class="font-mono text-muted" style="font-size:0.75rem; display:block; margin-bottom:6px;">CREATE YOUR ACCESS PASSWORD</label>
        <input type="password" id="invPass" class="krim-input" placeholder="••••••••••••" required />
      </div>

      <button onclick="acceptInvite()" class="btn-krim btn-primary" style="width: 100%;">Accept Invitation & Sign In</button>
    </div>
  </div>

  <script src="/core/krim-config.js"></script>
  <script src="/js/session.js"></script>
  <script>
    function acceptInvite() {
      KrimSession.set({
        email: "invited.director@tatasteel.com",
        role: "enterprise",
        token: "invited_jwt_" + Math.random().toString(36).substring(2),
        accountId: "ENT-INVITED-991"
      });
      window.location.href = KRIM_CONFIG.ROUTES.enterprise;
    }
  </script>
</body>
</html>
