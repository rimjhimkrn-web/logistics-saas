<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>KRIM Staging · Set New Password</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#061426;color:#f4f8ff;font:15px/1.6 system-ui,sans-serif}.card{width:min(460px,100%);padding:28px;border:1px solid #28435f;border-radius:18px;background:#102943}h1{margin:8px 0}.muted{color:#a8bad0;font-size:13px}label{display:block;margin:17px 0 7px}input,button{width:100%;padding:13px;border-radius:9px;font:inherit}input{border:1px solid #385572;background:#07182a;color:white}button{margin-top:16px;border:0;background:#168fe0;color:white;font-weight:850}a{color:#64dfeb}#feedback{font-size:13px;overflow-wrap:anywhere}</style></head>
<body><main class="card"><div style="color:#64dfeb;font-size:10px;font-weight:900;letter-spacing:.16em">STAGING · OWNER SECURITY</div><h1>Set staging password</h1><p class="muted">This page updates the password only in KRIM Logistics Staging.</p><form id="form"><label for="password">New password (minimum 12 characters)</label><input id="password" type="password" minlength="12" autocomplete="new-password" required><label for="confirm">Confirm new password</label><input id="confirm" type="password" minlength="12" autocomplete="new-password" required><button id="save">Update staging password</button></form><p id="feedback" role="status"></p><p><a href="krim-admin-access.html">Return to staging sign in</a></p></main>
<script>
(()=>{const URL="https://qrpcivhdxobiaofppbkl.supabase.co",KEY="sb_publishable_WYEwWxfNmMryQCu-mLAlQg_FRmn4_O3",client=window.supabase.createClient(URL,KEY),form=document.getElementById("form"),pw=document.getElementById("password"),confirmPw=document.getElementById("confirm"),btn=document.getElementById("save"),feedback=document.getElementById("feedback");async function init(){const params=new URLSearchParams(location.search),hash=new URLSearchParams(location.hash.slice(1));if(params.has("code")){const {error}=await client.auth.exchangeCodeForSession(params.get("code"));if(error)throw error;}const {data,error}=await client.auth.getSession();if(error||!data.session||!(hash.has("access_token")||hash.get("type")==="recovery"||params.has("code")))throw new Error("Recovery link is invalid or expired. Request a new staging reset email.");}init().catch(e=>{form.hidden=true;feedback.textContent=e.message;});form.addEventListener("submit",async e=>{e.preventDefault();if(pw.value.length<12){feedback.textContent="Use at least 12 characters.";return;}if(pw.value!==confirmPw.value){feedback.textContent="Passwords do not match.";return;}btn.disabled=true;feedback.textContent="Updating staging password…";try{const {error}=await client.auth.updateUser({password:pw.value});if(error)throw error;feedback.textContent="Staging password updated. Returning to staging sign in…";setTimeout(async()=>{await client.auth.signOut({scope:"local"});const base=location.pathname.includes("/logistics-saas/")?"/logistics-saas/":"/";location.replace(base+"auth/krim-admin-access.html?password-updated=1");},900);}catch(err){feedback.textContent=err.message||"Could not update staging password.";}finally{btn.disabled=false;}});})();
</script></body></html>
