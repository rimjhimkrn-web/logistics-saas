<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password Request — KRIM LOGISTICS OS</title>
  <link rel="stylesheet" href="/core/krim-core.css" />
  <link rel="stylesheet" href="/core/krim-components.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    .auth-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .auth-card { width: 100%; max-width: 420px; background: var(--krim-card); border: 1px solid var(--krim-border); border-radius: var(--radius-lg); padding: 32px; }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <h2 style="font-weight: 800; font-size: 1.25rem; margin-bottom: 8px;">Forgot Password</h2>
      <p class="text-muted" style="font-size: 0.82rem; margin-bottom: 20px;">Enter your registered work email to generate a secure reset token link.</p>

      <form onsubmit="handleForgot(event)">
        <div style="margin-bottom: 18px;">
          <label class="font-mono text-muted" style="font-size:0.75rem; display:block; margin-bottom:6px;">WORK EMAIL ADDRESS</label>
          <input type="email" id="resetEmail" class="krim-input" placeholder="user@company.com" required />
        </div>
        <button type="submit" class="btn-krim btn-primary" style="width: 100%;">Send Reset Dispatch</button>
      </form>

      <div style="margin-top: 18px; text-align: center; font-size: 0.8rem;">
        <a href="/auth/login.html" class="text-muted" style="text-decoration:none;">← Return to Sign In</a>
      </div>
    </div>
  </div>

  <script>
    function handleForgot(e) {
      e.preventDefault();
      alert("Password reset instructions have been dispatched to your email address.");
      window.location.href = "/auth/reset-password.html";
    }
  </script>
</body>
</html>
