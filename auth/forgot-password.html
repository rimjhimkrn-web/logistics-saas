<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>KRIM Logistics OS — Reset Password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const KRIM_SUPABASE_URL = "https://ebltviniygljwwseplph.supabase.co";
  const KRIM_SUPABASE_KEY = "sb_publishable_8xzZUeubYp_nIxVRWEQdiw_2H4RkHAa";
  window.KRIM_SUPABASE = window.supabase.createClient(KRIM_SUPABASE_URL, KRIM_SUPABASE_KEY);
</script>
<script>
(function(){
  var p=location.pathname;
  var b=p.indexOf("/logistics-saas/")===0?"/logistics-saas/":"/";
  var l=document.createElement("link");l.rel="stylesheet";l.href=b+"core/krim-unified-page.css";document.head.appendChild(l);
}());
</script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f8fafc;color:#0f172a;font-family:Inter,system-ui,-apple-system,sans-serif;display:flex;flex-direction:column}
header,footer{padding:22px max(20px,calc((100% - 1000px)/2))}header{border-bottom:1px solid #e2e8f0;background:#fff;font-weight:800;letter-spacing:.06em}
main{width:min(100% - 32px,460px);margin:auto;padding:34px 28px;background:#fff;border:1px solid #e2e8f0;border-radius:20px;box-shadow:0 18px 50px #0f172a0d}
h1{font-size:26px;margin:0 0 10px}p{color:#64748b;line-height:1.6;font-size:14px}
label{display:block;font-size:13px;font-weight:650;margin:22px 0 8px}
input{width:100%;padding:13px 14px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}
input:focus{outline:2px solid #0284c7;border-color:#0284c7}
button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:10px;background:#0369a1;color:white;font-weight:750;font-size:14px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#feedback{padding:12px;border-radius:10px;margin-top:16px;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
a{color:#0369a1;font-weight:650;text-decoration:none}a:hover{text-decoration:underline}.back{display:block;text-align:center;margin-top:22px;font-size:14px}footer{text-align:center;color:#64748b;font-size:12px}
</style>
</head>
<body>
<header>KRIM <span style="color:#0284c7">LOGISTICS OS</span></header>
<main>
<h1>Reset your password</h1>
<p>Enter the email address associated with your KRIM account. If password recovery email is configured, Supabase will send a secure reset link.</p>
<form id="forgot-form">
<label for="email">Email address</label>
<input id="email" name="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@company.com">
<button id="submit-btn" type="submit">Send password reset link</button>
</form>
<div id="feedback" role="status" aria-live="polite" hidden></div>
<a class="back" href="login.html">← Back to sign in</a>
</main>
<footer>© 2026 KRIM Logistics</footer>
<script>
(function(){
  const form=document.getElementById("forgot-form");
  const emailInput=document.getElementById("email");
  const requestedEmail=new URLSearchParams(location.search).get("email");
  if(requestedEmail && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(requestedEmail)) emailInput.value=requestedEmail;
  const button=document.getElementById("submit-btn");
  const feedback=document.getElementById("feedback");
  function show(message,ok){
    feedback.hidden=false;
    feedback.textContent=message;
    feedback.style.background=ok?"#ecfdf5":"#fff1f2";
    feedback.style.color=ok?"#065f46":"#9f1239";
  }
  form.addEventListener("submit",async function(event){
    event.preventDefault();
    const email=emailInput.value.trim().toLowerCase();
    if(!emailInput.checkValidity()||!email){show("Enter a valid email address.",false);return;}
    button.disabled=true;button.textContent="Requesting reset link…";feedback.hidden=true;
    try{
      const base=location.pathname.indexOf("/logistics-saas/")===0?"/logistics-saas/":"/";
      const redirectTo=location.origin+base+"auth/reset-password.html";
      const {error}=await window.KRIM_SUPABASE.auth.resetPasswordForEmail(email,{redirectTo});
      if(error) throw error;
      show("If this email belongs to a KRIM account, a password reset email will be sent. If it does not arrive, email delivery/SMTP and the Supabase redirect URL may need configuration.",true);
    }catch(error){
      show(error&&error.message?error.message:"Unable to request a password reset. Please try again.",false);
    }finally{
      button.disabled=false;button.textContent="Send password reset link";
    }
  });
}());
</script>
</body>
</html>
