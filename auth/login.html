<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — KRIM LOGISTICS OS</title>
  <link rel="stylesheet" href="/core/krim-core.css" />
  <link rel="stylesheet" href="/core/krim-components.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .auth-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .auth-card { width: 100%; max-width: 460px; background: var(--krim-card); border: 1px solid var(--krim-border); border-radius: var(--radius-lg); padding: 36px; box-shadow: var(--shadow-lg); }
    .auth-header { text-align: center; margin-bottom: 28px; }
    .brand-mark { width: 48px; height: 48px; background: linear-gradient(135deg, var(--krim-cyan), var(--krim-blue)); clip-path: polygon(0% 0%, 45% 0%, 100% 50%, 45% 100%, 0% 100%, 45% 50%); margin: 0 auto 16px; }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="brand-mark"></div>
        <h2 style="font-weight: 800; font-size: 1.4rem;">KRIM LOGISTICS OS</h2>
        <p class="text-muted" style="font-size: 0.82rem; margin-top: 4px;">Institutional Portal Access</p>
      </div>

      <div id="alertBox" class="pill-amber" style="display:none; width:100%; margin-bottom:16px; padding:10px; border-radius:8px;"></div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div style="margin-bottom: 16px;">
          <label class="font-mono text-muted" style="font-size:0.75rem; display:block; margin-bottom:6px;">WORK EMAIL ADDRESS</label>
          <input type="email" id="email" class="krim-input" placeholder="e.g. director@enterprise.com" required />
        </div>

        <div style="margin-bottom: 20px;">
          <div style="display:flex; justify-size:space-between; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <label class="font-mono text-muted" style="font-size:0.75rem;">PASSWORD</label>
            <a href="/auth/forgot-password.html" class="text-cyan" style="font-size:0.75rem; text-decoration:none;">Forgot?</a>
          </div>
          <input type="password" id="password" class="krim-input" placeholder="••••••••••••" required />
        </div>

        <button type="submit" id="btnSubmit" class="btn-krim btn-primary" style="width:100%;">Authenticate & Enter</button>
      </form>

      <div style="margin-top:24px; padding-top:16px; border-top:1px solid var(--krim-border); text-align:center; font-size:0.8rem;" class="text-muted">
        Need an institutional account? <a href="/auth/register.html" class="text-cyan" style="text-decoration:none; font-weight:700;">Register Organization</a>
      </div>
    </div>
  </div>

  <script src="/core/krim-config.js"></script>
  <script src="/core/krim-supabase.js"></script>
  <script src="/js/session.js"></script>
  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const btn = document.getElementById("btnSubmit");
      const alertBox = document.getElementById("alertBox");

      btn.disabled = true;
      btn.innerText = "Authenticating...";
      alertBox.style.display = "none";

      try {
        let authData;
        if (window.KrimBackend && window.KrimBackend.client) {
          const { data, error } = await window.KrimBackend.signIn(email, password);
          if (error) throw error;
          authData = data;
        }

        // Determine user role context
        const role = email.includes("enterprise") ? KRIM_CONFIG.ROLES.ENTERPRISE :
                     email.includes("partner") ? KRIM_CONFIG.ROLES.PARTNER :
                     email.includes("driver") ? KRIM_CONFIG.ROLES.DRIVER :
                     email.includes("control") ? KRIM_CONFIG.ROLES.SUPER_ADMIN : KRIM_CONFIG.ROLES.CUSTOMER;

        KrimSession.set({
          email: email,
          role: role,
          token: authData?.session?.access_token || "live_token_" + Math.random().toString(36).substring(2),
          accountId: `${role.substring(0,3).toUpperCase()}-${Math.floor(100000 + Math.random() * 900000)}`
        });

        // Check if MFA required
        if (email.includes("mfa")) {
          window.location.href = "/auth/mfa.html";
          return;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const redirect = urlParams.get("redirect") || KRIM_CONFIG.ROUTES[role] || KRIM_CONFIG.ROUTES.customer;
        window.location.href = redirect;
      } catch (err) {
        alertBox.innerText = err.message || "Invalid authentication credentials.";
        alertBox.style.display = "block";
        btn.disabled = false;
        btn.innerText = "Authenticate & Enter";
      }
    }
  </script>
</body>
</html>
