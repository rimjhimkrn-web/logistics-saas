<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Secure KRIM Logistics sign in"
    >

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <title>Sign In | KRIM Logistics</title>

    <link rel="stylesheet" href="../core/krim-core.css">
    <link rel="stylesheet" href="../core/krim-components.css">
    <link rel="stylesheet" href="../core/krim-responsive.css">

    <style>
        .krim-auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(
                    circle at top right,
                    rgba(11, 92, 255, 0.08),
                    transparent 35%
                ),
                var(--krim-bg);
        }

        .krim-auth-container {
            width: 100%;
            max-width: 440px;
        }

        .krim-auth-brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .krim-auth-brand a {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: inherit;
        }

        .krim-auth-brand-mark {
            width: 44px;
            height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: var(--krim-primary);
            color: #fff;
            font-size: 22px;
            font-weight: 800;
        }

        .krim-auth-brand-name {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .krim-auth-card {
            background: var(--krim-surface);
            border: 1px solid var(--krim-border);
            border-radius: 18px;
            box-shadow: var(--krim-shadow-lg);
            padding: 32px;
        }

        .krim-auth-header {
            margin-bottom: 24px;
        }

        .krim-auth-header h1 {
            margin-bottom: 8px;
        }

        .krim-auth-header p {
            margin: 0;
            color: var(--krim-text-muted);
        }

        .krim-auth-form {
            display: grid;
            gap: 18px;
        }

        .krim-auth-field {
            display: grid;
            gap: 8px;
        }

        .krim-auth-field label {
            font-weight: 600;
        }

        .krim-auth-field input {
            width: 100%;
        }

        .krim-auth-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 4px;
        }

        .krim-auth-link {
            color: var(--krim-primary);
            text-decoration: none;
            font-weight: 600;
        }

        .krim-auth-link:hover {
            text-decoration: underline;
        }

        .krim-auth-footer {
            text-align: center;
            margin-top: 24px;
            color: var(--krim-text-muted);
            font-size: 13px;
        }

        .krim-auth-footer a {
            color: inherit;
        }

        .krim-auth-status {
            display: none;
            margin-bottom: 18px;
        }

        .krim-auth-status.is-visible {
            display: block;
        }

        @media (max-width: 520px) {
            .krim-auth-page {
                padding: 16px;
            }

            .krim-auth-card {
                padding: 24px 20px;
            }

            .krim-auth-actions {
                align-items: flex-start;
                flex-direction: column;
            }

            .krim-auth-actions button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<main class="krim-auth-page">

    <div class="krim-auth-container">

        <!-- BRAND -->

        <div class="krim-auth-brand">

            <a
                href="../home.html"
                aria-label="KRIM Logistics home"
            >

                <span class="krim-auth-brand-mark">
                    K
                </span>

                <span class="krim-auth-brand-name">
                    KRIM
                </span>

            </a>

        </div>


        <!-- LOGIN CARD -->

        <section class="krim-auth-card">

            <header class="krim-auth-header">

                <span class="krim-badge krim-badge-info">
                    Secure access
                </span>

                <h1>
                    Sign in to KRIM
                </h1>

                <p>
                    Access your KRIM Logistics workspace.
                </p>

            </header>


            <!-- STATUS -->

            <div
                id="login-status"
                class="krim-alert krim-auth-status"
                role="alert"
                aria-live="polite"
            ></div>


            <!-- FORM -->

            <form
                id="login-form"
                class="krim-auth-form"
                novalidate
            >

                <div class="krim-auth-field">

                    <label for="email">
                        Email address
                    </label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="krim-auth-field">

                    <label for="password">
                        Password
                    </label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="krim-auth-actions">

                    <a
                        href="forgot-password.html"
                        class="krim-auth-link"
                    >
                        Forgot password?
                    </a>

                    <button
                        id="login-submit"
                        type="submit"
                        class="krim-btn krim-btn-primary"
                    >
                        Sign in
                    </button>

                </div>

            </form>

        </section>


        <!-- FOOTER -->

        <footer class="krim-auth-footer">

            <div>
                Secure access powered by KRIM Logistics.
            </div>

            <div style="margin-top: 8px;">

                <a href="../trust/privacy.html">
                    Privacy
                </a>

                <span aria-hidden="true">
                    ·
                </span>

                <a href="../trust/terms.html">
                    Terms
                </a>

            </div>

        </footer>

    </div>

</main>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- KRIM PLATFORM -->

<script src="../platform/krim-config.js"></script>
<script src="../platform/krim-supabase.js"></script>
<script src="../platform/krim-auth.js"></script>
<script src="../platform/krim-api.js"></script>
<script src="../platform/krim-ui.js"></script>
<script src="../platform/krim-security.js"></script>


<script>

(function () {

    "use strict";


    const form =
        document.getElementById("login-form");

    const emailInput =
        document.getElementById("email");

    const passwordInput =
        document.getElementById("password");

    const submitButton =
        document.getElementById("login-submit");

    const status =
        document.getElementById("login-status");


    function showStatus(message, type) {

        status.className =
            "krim-alert krim-auth-status is-visible";

        if (type === "success") {

            status.classList.add(
                "krim-alert-success"
            );

        } else {

            status.classList.add(
                "krim-alert-danger"
            );

        }

        KRIM_UI.setText(
            status,
            message
        );

    }


    function clearStatus() {

        status.className =
            "krim-alert krim-auth-status";

        KRIM_UI.setText(
            status,
            ""
        );

    }


    async function handleLogin(event) {

        event.preventDefault();

        clearStatus();


        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;


        if (!email) {

            showStatus(
                "Please enter your email address.",
                "danger"
            );

            emailInput.focus();

            return;
        }


        if (!password) {

            showStatus(
                "Please enter your password.",
                "danger"
            );

            passwordInput.focus();

            return;
        }


        KRIM_UI.setLoading(
            submitButton,
            true,
            {
                text: "Signing in..."
            }
        );


        try {

            const result =
                await KRIM_AUTH.signIn(
                    email,
                    password
                );


            const user =
                result.user;


            if (!user) {

                throw new Error(
                    "Authentication did not return a user."
                );

            }


            /*
             * Check the authenticated session.
             */

            const session =
                await KRIM_AUTH.getSession();


            if (!session) {

                throw new Error(
                    "Authenticated session could not be established."
                );

            }


            /*
             * Check MFA assurance.
             *
             * If a verified TOTP factor exists and
             * the current session is not AAL2,
             * send the user through the dedicated
             * MFA verification page.
             */

            let requiresMFA = false;


            try {

                const mfa =
                    await KRIM_AUTH.getAssuranceLevel();


                if (
                    mfa &&
                    mfa.currentLevel === "aal1" &&
                    mfa.nextLevel === "aal2"
                ) {

                    const factors =
                        await KRIM_AUTH.listMFAFactors();


                    const verifiedTotp =
                        factors.some(
                            function (factor) {

                                return (
                                    factor.factor &&
                                    factor.factor.type === "totp" &&
                                    factor.factor.status === "verified"
                                );

                            }
                        );


                    requiresMFA =
                        verifiedTotp;

                }

            } catch (mfaError) {

                console.warn(
                    "KRIM: MFA status could not be determined.",
                    mfaError
                );

            }


            showStatus(
                requiresMFA
                    ? "Sign in successful. Secure verification required."
                    : "Sign in successful. Opening KRIM...",
                "success"
            );


            /*
             * Preserve the requested destination when
             * one exists. Otherwise route to the
             * appropriate workspace.
             */

            const params =
                new URLSearchParams(
                    window.location.search
                );


            const requested =
                params.get("redirect");


            if (requiresMFA) {

                const mfaUrl =
                    KRIM_CONFIG.routes.auth.mfa;


                const destination =
                    requested
                        ? "?redirect=" +
                          encodeURIComponent(requested)
                        : "";


                window.location.replace(
                    mfaUrl + destination
                );


                return;

            }


            /*
             * Workspace routing.
             *
             * Privileged users go to operations.
             * Partners go to partner workspace.
             * Other authenticated users go to
             * customer workspace.
             */

            let destination =
                KRIM_CONFIG.routes.workspaces.customer;


            try {

                const assignments =
                    await KRIM_SECURITY
                        .getRoleAssignments(
                            user.id
                        );


                const roles =
                    assignments
                        .filter(
                            function (item) {
                                return item.active !== false;
                            }
                        )
                        .map(
                            function (item) {
                                return String(
                                    item.role_code ||
                                    item.role ||
                                    item.code ||
                                    ""
                                ).toLowerCase();
                            }
                        );


                if (
                    roles.includes(
                        "platform_superadmin"
                    ) ||
                    roles.includes("admin") ||
                    roles.includes("operations")
                ) {

                    destination =
                        KRIM_CONFIG
                            .routes
                            .workspaces
                            .operations;

                } else if (
                    roles.includes("partner")
                ) {

                    destination =
                        KRIM_CONFIG
                            .routes
                            .workspaces
                            .partner;

                }

            } catch (roleError) {

                console.warn(
                    "KRIM: Workspace role could not be resolved.",
                    roleError
                );

            }


            if (requested) {

                try {

                    const requestedUrl =
                        new URL(
                            requested,
                            window.location.origin
                        );


                    /*
                     * Only allow same-origin redirects.
                     */

                    if (
                        requestedUrl.origin ===
                        window.location.origin
                    ) {

                        destination =
                            requestedUrl.pathname +
                            requestedUrl.search +
                            requestedUrl.hash;

                    }

                } catch (redirectError) {

                    console.warn(
                        "KRIM: Invalid redirect ignored.",
                        redirectError
                    );

                }

            }


            window.location.replace(
                destination
            );

        } catch (error) {

            console.error(
                "KRIM: Login failed.",
                error
            );


            let message =
                "Unable to sign in. Please check your credentials and try again.";


            const errorMessage =
                String(
                    error &&
                    error.message
                        ? error.message
                        : ""
                ).toLowerCase();


            if (
                errorMessage.includes(
                    "invalid login credentials"
                )
            ) {

                message =
                    "Incorrect email or password.";

            } else if (
                errorMessage.includes(
                    "email not confirmed"
                )
            ) {

                message =
                    "Please confirm your email address before signing in.";

            }


            showStatus(
                message,
                "danger"
            );


            KRIM_UI.setLoading(
                submitButton,
                false
            );

        }

    }


    form.addEventListener(
        "submit",
        handleLogin
    );


    /*
     * If the user already has a valid session,
     * don't leave them on the login page.
     */

    async function checkExistingSession() {

        try {

            const session =
                await KRIM_AUTH.getSession();


            if (!session) {
                return;
            }


            const params =
                new URLSearchParams(
                    window.location.search
                );


            const requested =
                params.get("redirect");


            if (requested) {

                try {

                    const url =
                        new URL(
                            requested,
                            window.location.origin
                        );


                    if (
                        url.origin ===
                        window.location.origin
                    ) {

                        window.location.replace(
                            url.pathname +
                            url.search +
                            url.hash
                        );

                        return;

                    }

                } catch (error) {

                    console.warn(
                        "KRIM: Existing-session redirect ignored.",
                        error
                    );

                }

            }


            window.location.replace(
                KRIM_CONFIG
                    .routes
                    .workspaces
                    .customer
            );

        } catch (error) {

            console.warn(
                "KRIM: Existing session check failed.",
                error
            );

        }

    }


    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            checkExistingSession,
            {
                once: true
            }
        );

    } else {

        checkExistingSession();

    }

})();

</script>

</body>
  </html>
