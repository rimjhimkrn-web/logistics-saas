<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>KRIM Logistics — Sign In</title>

  <meta
    name="description"
    content="Secure sign in to KRIM Logistics."
  />

  <!-- KRIM Design System -->
  <link rel="stylesheet" href="../core/krim-core.css" />
  <link rel="stylesheet" href="../core/krim-components.css" />
  <link rel="stylesheet" href="../core/krim-responsive.css" />

  <!-- Official Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- KRIM Platform -->
  <script src="../platform/krim-config.js"></script>
  <script src="../platform/krim-supabase.js"></script>
  <script src="../platform/krim-auth.js"></script>
  <script src="../platform/krim-ui.js"></script>
  <script src="../platform/krim-security.js"></script>

  <style>
    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at top right,
          rgba(11, 92, 255, 0.08),
          transparent 35%
        ),
        var(--krim-bg, #f5f7fb);
    }

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-container {
      width: 100%;
      max-width: 470px;
    }

    .login-card {
      background: #ffffff;
      border: 1px solid var(--krim-border, #e5e7eb);
      border-radius: 20px;
      box-shadow: 0 18px 55px rgba(15, 23, 42, 0.10);
      overflow: hidden;
    }

    .login-header {
      padding: 30px 30px 24px;
      border-bottom: 1px solid var(--krim-border, #e5e7eb);
    }

    .krim-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: -0.02em;
    }

    .krim-mark {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: #0b5cff;
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
    }

    .login-header h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.2;
    }

    .login-header p {
      margin: 0;
      color: #64748b;
      line-height: 1.6;
    }

    .login-body {
      padding: 30px;
    }

    .login-form {
      display: grid;
      gap: 18px;
    }

    .form-group {
      display: grid;
      gap: 7px;
    }

    .form-group label {
      font-size: 14px;
      font-weight: 700;
      color: #334155;
    }

    .form-group input {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 11px;
      background: #ffffff;
      color: #0f172a;
      font-size: 15px;
      outline: none;
    }

    .form-group input:focus {
      border-color: #0b5cff;
      box-shadow: 0 0 0 3px rgba(11, 92, 255, 0.12);
    }

    .password-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .forgot-link {
      color: #0b5cff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .login-button {
      width: 100%;
      min-height: 50px;
      border: 0;
      border-radius: 11px;
      background: #0b5cff;
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    .login-button:hover {
      transform: translateY(-1px);
    }

    .login-button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
      transform: none;
    }

    .status {
      margin-bottom: 18px;
    }

    .login-footer {
      padding: 18px 30px;
      border-top: 1px solid var(--krim-border, #e5e7eb);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      color: #64748b;
      font-size: 13px;
    }

    .home-link {
      color: #0b5cff;
      text-decoration: none;
      font-weight: 700;
    }

    .home-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .login-page {
        padding: 12px;
      }

      .login-header,
      .login-body {
        padding: 22px;
      }

      .login-footer {
        padding: 16px 22px;
        align-items: flex-start;
        flex-direction: column;
      }

      .login-header h1 {
        font-size: 24px;
      }

      .password-row {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <main class="login-page">

    <div class="login-container">

      <section class="login-card">

        <header class="login-header">

          <div class="krim-brand">
            <span class="krim-mark">K</span>
            <span>KRIM Logistics</span>
          </div>

          <h1>Sign in</h1>

          <p>
            Access your secure KRIM Logistics workspace.
          </p>

        </header>

        <div class="login-body">

          <div id="status" class="status"></div>

          <form id="loginForm" class="login-form">

            <div class="form-group">

              <label for="email">
                Email address
              </label>

              <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                placeholder="you@example.com"
                required
              />

            </div>

            <div class="form-group">

              <div class="password-row">

                <label for="password">
                  Password
                </label>

                <a
                  class="forgot-link"
                  href="forgot-password.html"
                >
                  Forgot password?
                </a>

              </div>

              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="Enter your password"
                required
              />

            </div>

            <button
              id="loginButton"
              class="login-button"
              type="submit"
            >
              Sign in
            </button>

          </form>

        </div>

        <footer class="login-footer">

          <span>
            KRIM Security
          </span>

          <a
            class="home-link"
            href="../home.html"
          >
            Back to KRIM
          </a>

        </footer>

      </section>

    </div>

  </main>


  <script>
    (function () {

      "use strict";

      const form =
        document.getElementById("loginForm");

      const emailInput =
        document.getElementById("email");

      const passwordInput =
        document.getElementById("password");

      const loginButton =
        document.getElementById("loginButton");

      const status =
        document.getElementById("status");


      function showError(message) {

        if (
          window.KRIM_UI &&
          typeof window.KRIM_UI.showAlert === "function"
        ) {

          window.KRIM_UI.showAlert(
            status,
            message,
            "danger"
          );

          return;
        }

        status.textContent = message;
      }


      function showSuccess(message) {

        if (
          window.KRIM_UI &&
          typeof window.KRIM_UI.showAlert === "function"
        ) {

          window.KRIM_UI.showAlert(
            status,
            message,
            "success"
          );

          return;
        }

        status.textContent = message;
      }


      function setLoading(loading) {

        loginButton.disabled = loading;

        loginButton.textContent =
          loading
            ? "Signing in..."
            : "Sign in";

      }


      function goTo(path) {

        window.location.href = path;

      }


      async function determineMFARoute() {

        /*
         * Get the current Supabase MFA assurance level.
         *
         * aal1 -> aal1
         * = no MFA factor enrolled
         *
         * aal1 -> aal2
         * = MFA factor exists and needs verification
         *
         * aal2 -> aal2
         * = MFA already verified
         */

        const assuranceResult =
          await window.KRIM_AUTH.getAssuranceLevel();


        if (assuranceResult.error) {

          throw assuranceResult.error;

        }


        const assurance =
          assuranceResult.data || {};

        const currentLevel =
          assurance.currentLevel;

        const nextLevel =
          assurance.nextLevel;


        /*
         * CASE 1
         *
         * MFA is already completely verified.
         */
        if (
          currentLevel === "aal2" &&
          nextLevel === "aal2"
        ) {

          goTo(
            "../workspaces/customer-workspace.html"
          );

          return;

        }


        /*
         * Get actual factors.
         */
        const factorsResult =
          await window.KRIM_AUTH.listMFAFactors();


        if (factorsResult.error) {

          throw factorsResult.error;

        }


        const factors =
          factorsResult.data || {};

        const totpFactors =
          Array.isArray(factors.totp)
            ? factors.totp
            : [];


        const verifiedFactors =
          totpFactors.filter(function (factor) {

            return factor.status === "verified";

          });


        /*
         * CASE 2
         *
         * A verified authenticator already exists.
         *
         * Send user to the MFA challenge page.
         */
        if (verifiedFactors.length > 0) {

          goTo("mfa.html");

          return;

        }


        /*
         * CASE 3
         *
         * No verified authenticator exists.
         *
         * This is the important fix.
         *
         * Do NOT send the user back to login.
         * Send them to permanent MFA enrollment.
         */
        goTo("mfa-enroll.html");

      }


      form.addEventListener(
        "submit",
        async function (event) {

          event.preventDefault();

          status.innerHTML = "";

          const email =
            emailInput.value.trim();

          const password =
            passwordInput.value;


          if (!email || !password) {

            showError(
              "Enter your email address and password."
            );

            return;

          }


          setLoading(true);


          try {

            /*
             * Password authentication.
             */
            const signInResult =
              await window.KRIM_AUTH.signIn(
                email,
                password
              );


            if (signInResult.error) {

              throw signInResult.error;

            }


            showSuccess(
              "Password verified. Checking account security..."
            );


            /*
             * Now determine:
             *
             * 1. Already AAL2
             * 2. Existing MFA
             * 3. No MFA → enrollment
             */
            await determineMFARoute();


          } catch (error) {

            console.error(
              "KRIM login error:",
              error
            );


            showError(
              error && error.message
                ? error.message
                : "Unable to sign in. Please check your credentials and try again."
            );


            setLoading(false);

          }

        }
      );

    })();
  </script>

</body>
</html>
