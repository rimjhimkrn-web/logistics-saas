<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>KRIM Financial Management</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

<style>

body {
    margin: 0;
        padding: 20px;
            font-family: Arial, sans-serif;
                background: #f5f5f5;
                }

                .container {
                    max-width: 600px;
                        margin: auto;
                        }

                        .card {
                            background: white;
                                padding: 20px;
                                    border-radius: 10px;
                                        margin-bottom: 20px;
                                        }

                                        input {
                                            width: 100%;
                                                padding: 12px;
                                                    margin: 8px 0 15px;
                                                        box-sizing: border-box;
                                                            border: 1px solid #ccc;
                                                                border-radius: 6px;
                                                                    font-size: 16px;
                                                                    }

                                                                    button {
                                                                        width: 100%;
                                                                            padding: 13px;
                                                                                background: #111827;
                                                                                    color: white;
                                                                                        border: none;
                                                                                            border-radius: 6px;
                                                                                                font-size: 16px;
                                                                                                }

                                                                                                #message {
                                                                                                    margin-top: 15px;
                                                                                                        font-weight: bold;
                                                                                                        }

                                                                                                        .record {
                                                                                                            padding: 15px 0;
                                                                                                                border-bottom: 1px solid #ddd;
                                                                                                                }

                                                                                                                </style>

                                                                                                                </head>


                                                                                                                <body>

                                                                                                                <div class="container">


                                                                                                                <div class="card">

                                                                                                                <h1>KRIM Logistics</h1>

                                                                                                                <h2>Financial Management</h2>

                                                                                                                </div>


                                                                                                                <div class="card">

                                                                                                                <h3>Financial Record</h3>


                                                                                                                <label>Shipment ID</label>

                                                                                                                <input
                                                                                                                id="shipment"
                                                                                                                type="number"
                                                                                                                placeholder="Example: 14"
                                                                                                                >


                                                                                                                <label>Customer Amount</label>

                                                                                                                <input
                                                                                                                id="customer"
                                                                                                                type="number"
                                                                                                                placeholder="Example: 5000"
                                                                                                                >


                                                                                                                <label>Partner Cost</label>

                                                                                                                <input
                                                                                                                id="partner"
                                                                                                                type="number"
                                                                                                                placeholder="Example: 3000"
                                                                                                                >


                                                                                                                <button onclick="saveRecord()">
                                                                                                                Save Financial Record
                                                                                                                </button>


                                                                                                                <div id="message"></div>

                                                                                                                </div>


                                                                                                                <div class="card">

                                                                                                                <h3>Financial Records</h3>

                                                                                                                <div id="records">
                                                                                                                Loading...
                                                                                                                </div>

                                                                                                                </div>


                                                                                                                </div>


                                                                                                                <script>


                                                                                                                async function saveRecord() {

                                                                                                                    const shipment =
                                                                                                                            document.getElementById("shipment").value;

                                                                                                                                const customer =
                                                                                                                                        document.getElementById("customer").value;

                                                                                                                                            const partner =
                                                                                                                                                    document.getElementById("partner").value;

                                                                                                                                                        const message =
                                                                                                                                                                document.getElementById("message");


                                                                                                                                                                    if (!shipment || !customer || !partner) {

                                                                                                                                                                            message.innerText =
                                                                                                                                                                                        "Please fill all fields.";

                                                                                                                                                                                                return;
                                                                                                                                                                                                    }


                                                                                                                                                                                                        message.innerText =
                                                                                                                                                                                                                "Saving...";


                                                                                                                                                                                                                    const { data, error } =
                                                                                                                                                                                                                            await supabaseClient.rpc(
                                                                                                                                                                                                                                        "save_financial",
                                                                                                                                                                                                                                                    {
                                                                                                                                                                                                                                                                    p_shipment_id: Number(shipment),
                                                                                                                                                                                                                                                                                    p_customer_amount: Number(customer),
                                                                                                                                                                                                                                                                                                    p_partner_cost: Number(partner)
                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                        );


                                                                                                                                                                                                                                                                                                                            if (error) {

                                                                                                                                                                                                                                                                                                                                    console.error(error);

                                                                                                                                                                                                                                                                                                                                            message.innerText =
                                                                                                                                                                                                                                                                                                                                                        "Error: " + error.message;

                                                                                                                                                                                                                                                                                                                                                                return;
                                                                                                                                                                                                                                                                                                                                                                    }


                                                                                                                                                                                                                                                                                                                                                                        message.innerText =
                                                                                                                                                                                                                                                                                                                                                                                "Financial record saved successfully.";

                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById("shipment").value = "";

                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("customer").value = "";

                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById("partner").value = "";


                                                                                                                                                                                                                                                                                                                                                                                                loadRecords();

                                                                                                                                                                                                                                                                                                                                                                                                }



                                                                                                                                                                                                                                                                                                                                                                                                async function loadRecords() {

                                                                                                                                                                                                                                                                                                                                                                                                    const box =
                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById("records");


                                                                                                                                                                                                                                                                                                                                                                                                                const { data, error } =
                                                                                                                                                                                                                                                                                                                                                                                                                        await supabaseClient
                                                                                                                                                                                                                                                                                                                                                                                                                                .from("shipment_financials")
                                                                                                                                                                                                                                                                                                                                                                                                                                        .select(
                                                                                                                                                                                                                                                                                                                                                                                                                                                    "id,shipment_id,customer_amount,partner_cost,platform_margin,status"
                                                                                                                                                                                                                                                                                                                                                                                                                                                            )
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .order("id", {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ascending: false
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        });


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (error) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    box.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "Error: " + error.message;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!data || data.length === 0) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        box.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    "No financial records.";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    box.innerHTML = "";


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        data.forEach(function(row) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const customer =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            Number(row.customer_amount || 0);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const partner =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                Number(row.partner_cost || 0);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const margin =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    Number(row.platform_margin || 0);


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            box.innerHTML += `

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="record">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <b>Shipment #${row.shipment_id}</b>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            Customer Amount:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ₹${customer.toLocaleString("en-IN")}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    Partner Cost:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ₹${partner.toLocaleString("en-IN")}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            KRIM Margin:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ₹${margin.toLocaleString("en-IN")}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    Status:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ${row.status || "pending"}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            `;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                loadRecords();


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </html>
