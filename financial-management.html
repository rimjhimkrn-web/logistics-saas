<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>KRIM Financial Management</title>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
          <script src="config.js"></script>

            <style>
                body {
                      font-family: Arial;
                            margin: 0;
                                  padding: 15px;
                                        background: #f5f5f5;
                                            }

                                                h1 {
                                                      margin-top: 0;
                                                          }

                                                              button {
                                                                    padding: 10px 15px;
                                                                          margin: 5px;
                                                                                cursor: pointer;
                                                                                    }

                                                                                        input, select {
                                                                                              width: 100%;
                                                                                                    padding: 10px;
                                                                                                          margin: 5px 0 10px;
                                                                                                                box-sizing: border-box;
                                                                                                                    }

                                                                                                                        .box {
                                                                                                                              background: white;
                                                                                                                                    padding: 15px;
                                                                                                                                          margin: 15px 0;
                                                                                                                                                border-radius: 8px;
                                                                                                                                                    }

                                                                                                                                                        .record {
                                                                                                                                                              background: white;
                                                                                                                                                                    padding: 15px;
                                                                                                                                                                          margin: 10px 0;
                                                                                                                                                                                border-radius: 8px;
                                                                                                                                                                                      border: 1px solid #ddd;
                                                                                                                                                                                          }

                                                                                                                                                                                              .error {
                                                                                                                                                                                                    color: red;
                                                                                                                                                                                                        }

                                                                                                                                                                                                            .success {
                                                                                                                                                                                                                  color: green;
                                                                                                                                                                                                                      }
                                                                                                                                                                                                                        </style>
                                                                                                                                                                                                                        </head>

                                                                                                                                                                                                                        <body>

                                                                                                                                                                                                                        <h1>KRIM Logistics</h1>
                                                                                                                                                                                                                        <h3>Financial Management</h3>

                                                                                                                                                                                                                        <button onclick="loadFinancials()">Refresh</button>
                                                                                                                                                                                                                        <button onclick="logout()">Logout</button>

                                                                                                                                                                                                                        <p id="message"></p>

                                                                                                                                                                                                                        <div class="box">

                                                                                                                                                                                                                          <h3>Create Financial Record</h3>

                                                                                                                                                                                                                            <label>Shipment ID</label>
                                                                                                                                                                                                                              <input id="shipmentId" type="number" placeholder="Example: 11">

                                                                                                                                                                                                                                <label>Customer Amount (₹)</label>
                                                                                                                                                                                                                                  <input id="customerAmount" type="number" placeholder="Example: 25000">

                                                                                                                                                                                                                                    <label>Partner Cost (₹)</label>
                                                                                                                                                                                                                                      <input id="partnerCost" type="number" placeholder="Example: 18000">

                                                                                                                                                                                                                                        <label>Status</label>
                                                                                                                                                                                                                                          <select id="newStatus">
                                                                                                                                                                                                                                              <option value="pending">Pending</option>
                                                                                                                                                                                                                                                  <option value="paid">Paid</option>
                                                                                                                                                                                                                                                      <option value="completed">Completed</option>
                                                                                                                                                                                                                                                          <option value="cancelled">Cancelled</option>
                                                                                                                                                                                                                                                            </select>

                                                                                                                                                                                                                                                              <button onclick="createFinancial()">Create Record</button>

                                                                                                                                                                                                                                                              </div>

                                                                                                                                                                                                                                                              <div class="box">

                                                                                                                                                                                                                                                                <h3>Financial Records</h3>

                                                                                                                                                                                                                                                                  <p>
                                                                                                                                                                                                                                                                      Total Customer Revenue:
                                                                                                                                                                                                                                                                          <b id="totalRevenue">₹0</b>
                                                                                                                                                                                                                                                                            </p>

                                                                                                                                                                                                                                                                              <p>
                                                                                                                                                                                                                                                                                  Total KRIM Margin:
                                                                                                                                                                                                                                                                                      <b id="totalMargin">₹0</b>
                                                                                                                                                                                                                                                                                        </p>

                                                                                                                                                                                                                                                                                          <div id="records">
                                                                                                                                                                                                                                                                                              Loading...
                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                <script>

                                                                                                                                                                                                                                                                                                var supabase = window.supabase.createClient(
                                                                                                                                                                                                                                                                                                  window.SUPABASE_URL,
                                                                                                                                                                                                                                                                                                    window.SUPABASE_ANON_KEY
                                                                                                                                                                                                                                                                                                    );


                                                                                                                                                                                                                                                                                                    /* LOAD FINANCIAL RECORDS */

                                                                                                                                                                                                                                                                                                    async function loadFinancials() {

                                                                                                                                                                                                                                                                                                      document.getElementById("message").innerHTML = "Loading...";

                                                                                                                                                                                                                                                                                                        var result = await supabase
                                                                                                                                                                                                                                                                                                            .from("shipment_financials")
                                                                                                                                                                                                                                                                                                                .select("*")
                                                                                                                                                                                                                                                                                                                    .order("id", { ascending: false });

                                                                                                                                                                                                                                                                                                                      if (result.error) {

                                                                                                                                                                                                                                                                                                                          document.getElementById("message").innerHTML =
                                                                                                                                                                                                                                                                                                                                result.error.message;

                                                                                                                                                                                                                                                                                                                                    document.getElementById("message").className = "error";

                                                                                                                                                                                                                                                                                                                                        return;
                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                            var data = result.data || [];

                                                                                                                                                                                                                                                                                                                                              var revenue = 0;
                                                                                                                                                                                                                                                                                                                                                var margin = 0;

                                                                                                                                                                                                                                                                                                                                                  var html = "";

                                                                                                                                                                                                                                                                                                                                                    for (var i = 0; i < data.length; i++) {

                                                                                                                                                                                                                                                                                                                                                        var row = data[i];

                                                                                                                                                                                                                                                                                                                                                            revenue =
                                                                                                                                                                                                                                                                                                                                                                  revenue + Number(row.customer_amount || 0);

                                                                                                                                                                                                                                                                                                                                                                      margin =
                                                                                                                                                                                                                                                                                                                                                                            margin + Number(row.platform_margin || 0);

                                                                                                                                                                                                                                                                                                                                                                                html +=
                                                                                                                                                                                                                                                                                                                                                                                      "<div class='record'>" +

                                                                                                                                                                                                                                                                                                                                                                                            "<h3>Shipment #" +
                                                                                                                                                                                                                                                                                                                                                                                                  row.shipment_id +
                                                                                                                                                                                                                                                                                                                                                                                                        "</h3>" +

                                                                                                                                                                                                                                                                                                                                                                                                              "<p>Customer Amount: ₹" +
                                                                                                                                                                                                                                                                                                                                                                                                                    Number(row.customer_amount || 0).toLocaleString("en-IN") +
                                                                                                                                                                                                                                                                                                                                                                                                                          "</p>" +

                                                                                                                                                                                                                                                                                                                                                                                                                                "<p>Partner Cost: ₹" +
                                                                                                                                                                                                                                                                                                                                                                                                                                      Number(row.partner_cost || 0).toLocaleString("en-IN") +
                                                                                                                                                                                                                                                                                                                                                                                                                                            "</p>" +

                                                                                                                                                                                                                                                                                                                                                                                                                                                  "<p>KRIM Margin: ₹" +
                                                                                                                                                                                                                                                                                                                                                                                                                                                        Number(row.platform_margin || 0).toLocaleString("en-IN") +
                                                                                                                                                                                                                                                                                                                                                                                                                                                              "</p>" +

                                                                                                                                                                                                                                                                                                                                                                                                                                                                    "<p>Status: <b>" +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          (row.status || "pending") +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "</b></p>" +

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      "<button onclick='editRecord(" +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            row.id +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  ")'>Edit</button>" +

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        "<button onclick='deleteRecord(" +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              row.id +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ")'>Delete</button>" +

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          "</div>";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if (data.length === 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  html = "<p>No financial records found.</p>";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      document.getElementById("records").innerHTML = html;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("totalRevenue").innerHTML =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            "₹" + revenue.toLocaleString("en-IN");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.getElementById("totalMargin").innerHTML =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  "₹" + margin.toLocaleString("en-IN");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById("message").innerHTML =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        "Financial records loaded.";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          document.getElementById("message").className = "success";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          /* CREATE */

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          async function createFinancial() {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            var shipmentId =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById("shipmentId").value;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  var customerAmount =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      Number(document.getElementById("customerAmount").value);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        var partnerCost =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            Number(document.getElementById("partnerCost").value);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              var status =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  document.getElementById("newStatus").value;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (!shipmentId) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        alert("Enter Shipment ID");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (customerAmount <= 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    alert("Enter Customer Amount");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (partnerCost < 0 || isNaN(partnerCost)) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                alert("Enter Partner Cost");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        var margin =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            customerAmount - partnerCost;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              var result = await supabase
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  .from("shipment_financials")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      .insert({
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            shipment_id: Number(shipmentId),
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  customer_amount: customerAmount,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        partner_cost: partnerCost,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              platform_margin: margin,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    status: status
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if (result.error) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              alert(result.error.message);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      alert("Financial Record Created!");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("shipmentId").value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          document.getElementById("customerAmount").value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById("partnerCost").value = "";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              loadFinancials();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              /* EDIT */

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              async function editRecord(id) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                var cost = prompt(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    "Enter new Partner Cost:"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (cost === null) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                cost = Number(cost);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if (isNaN(cost) || cost < 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      alert("Invalid Partner Cost");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
