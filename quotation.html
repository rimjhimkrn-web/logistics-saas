<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>KRIM Logistics - Quotation</title>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
          <script src="config.js"></script>

            <style>
                body {
                      font-family: Arial, sans-serif;
                            background: #f4f7fb;
                                  padding: 20px;
                                      }

                                          .box {
                                                max-width: 500px;
                                                      margin: auto;
                                                            background: white;
                                                                  padding: 25px;
                                                                        border-radius: 12px;
                                                                              box-shadow: 0 4px 15px rgba(0,0,0,0.08);
                                                                                  }

                                                                                      h1 {
                                                                                            color: #102a43;
                                                                                                }

                                                                                                    input, select, button {
                                                                                                          width: 100%;
                                                                                                                padding: 12px;
                                                                                                                      margin-top: 10px;
                                                                                                                            margin-bottom: 15px;
                                                                                                                                  box-sizing: border-box;
                                                                                                                                      }

                                                                                                                                          button {
                                                                                                                                                background: #102a43;
                                                                                                                                                      color: white;
                                                                                                                                                            border: none;
                                                                                                                                                                  border-radius: 6px;
                                                                                                                                                                        cursor: pointer;
                                                                                                                                                                            }

                                                                                                                                                                                #message {
                                                                                                                                                                                      margin-top: 15px;
                                                                                                                                                                                            font-weight: bold;
                                                                                                                                                                                                }
                                                                                                                                                                                                  </style>
                                                                                                                                                                                                  </head>

                                                                                                                                                                                                  <body>

                                                                                                                                                                                                  <div class="box">

                                                                                                                                                                                                    <h1>Shipment Quotation</h1>

                                                                                                                                                                                                      <label>Tracking Number</label>
                                                                                                                                                                                                        <input id="tracking" value="TRK-000014">

                                                                                                                                                                                                          <label>Quotation Amount (₹)</label>
                                                                                                                                                                                                            <input id="price" type="number" placeholder="Enter amount">

                                                                                                                                                                                                              <label>Quotation Status</label>
                                                                                                                                                                                                                <select id="status">
                                                                                                                                                                                                                    <option value="pending">Pending</option>
                                                                                                                                                                                                                        <option value="sent">Sent</option>
                                                                                                                                                                                                                            <option value="accepted">Accepted</option>
                                                                                                                                                                                                                                <option value="rejected">Rejected</option>
                                                                                                                                                                                                                                  </select>

                                                                                                                                                                                                                                    <button onclick="saveQuotation()">Save Quotation</button>

                                                                                                                                                                                                                                      <div id="message"></div>

                                                                                                                                                                                                                                      </div>

                                                                                                                                                                                                                                      <script>

                                                                                                                                                                                                                                      async function saveQuotation() {

                                                                                                                                                                                                                                        const tracking = document.getElementById("tracking").value.trim();
                                                                                                                                                                                                                                          const price = document.getElementById("price").value;
                                                                                                                                                                                                                                            const status = document.getElementById("status").value;
                                                                                                                                                                                                                                              const message = document.getElementById("message");

                                                                                                                                                                                                                                                message.innerText = "Saving...";

                                                                                                                                                                                                                                                  if (!tracking) {
                                                                                                                                                                                                                                                      message.innerText = "Enter tracking number.";
                                                                                                                                                                                                                                                          return;
                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                              if (!price) {
                                                                                                                                                                                                                                                                  message.innerText = "Enter quotation amount.";
                                                                                                                                                                                                                                                                      return;
                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                          // Find shipment
                                                                                                                                                                                                                                                                            const { data: shipment, error: findError } = await supabaseClient
                                                                                                                                                                                                                                                                                .from("shipment_requests")
                                                                                                                                                                                                                                                                                    .select("id, tracking_number")
                                                                                                                                                                                                                                                                                        .eq("tracking_number", tracking)
                                                                                                                                                                                                                                                                                            .maybeSingle();

                                                                                                                                                                                                                                                                                              if (findError) {
                                                                                                                                                                                                                                                                                                  message.innerText = "Error finding shipment: " + findError.message;
                                                                                                                                                                                                                                                                                                      return;
                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                          if (!shipment) {
                                                                                                                                                                                                                                                                                                              message.innerText = "Shipment not found.";
                                                                                                                                                                                                                                                                                                                  return;
                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                      // Save quotation
                                                                                                                                                                                                                                                                                                                        const { error: updateError } = await supabaseClient
                                                                                                                                                                                                                                                                                                                            .from("shipment_requests")
                                                                                                                                                                                                                                                                                                                                .update({
                                                                                                                                                                                                                                                                                                                                      quoted_price: Number(price),
                                                                                                                                                                                                                                                                                                                                            quote_status: status
                                                                                                                                                                                                                                                                                                                                                })
                                                                                                                                                                                                                                                                                                                                                    .eq("id", shipment.id);

                                                                                                                                                                                                                                                                                                                                                      if (updateError) {
                                                                                                                                                                                                                                                                                                                                                          message.innerText = "Save failed: " + updateError.message;
                                                                                                                                                                                                                                                                                                                                                              return;
                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                  message.innerText = "Quotation saved successfully.";

                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                  </script>

                                                                                                                                                                                                                                                                                                                                                                  </body>
                                                                                                                                                                                                                                                                                                                                                                  </html>
