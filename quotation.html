<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Shipment Quotation - KRIM Logistics</title>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
          <script src="config.js"></script>

            <style>
                body {
                      font-family: Arial, sans-serif;
                            background: #f4f6f8;
                                  padding: 20px;
                                      }

                                          .box {
                                                max-width: 500px;
                                                      margin: 30px auto;
                                                            background: white;
                                                                  padding: 25px;
                                                                        border-radius: 12px;
                                                                            }

                                                                                h2 {
                                                                                      margin-top: 0;
                                                                                          }

                                                                                              input {
                                                                                                    width: 100%;
                                                                                                          padding: 12px;
                                                                                                                margin: 8px 0 15px;
                                                                                                                      box-sizing: border-box;
                                                                                                                          }

                                                                                                                              button {
                                                                                                                                    width: 100%;
                                                                                                                                          padding: 12px;
                                                                                                                                                margin-top: 8px;
                                                                                                                                                      border: 0;
                                                                                                                                                            border-radius: 6px;
                                                                                                                                                                  background: #0757a5;
                                                                                                                                                                        color: white;
                                                                                                                                                                              font-size: 16px;
                                                                                                                                                                                  }

                                                                                                                                                                                      #result {
                                                                                                                                                                                            margin-top: 20px;
                                                                                                                                                                                                  padding: 12px;
                                                                                                                                                                                                        background: #f1f3f5;
                                                                                                                                                                                                              border-radius: 6px;
                                                                                                                                                                                                                  }
                                                                                                                                                                                                                    </style>
                                                                                                                                                                                                                    </head>

                                                                                                                                                                                                                    <body>

                                                                                                                                                                                                                    <div class="box">

                                                                                                                                                                                                                      <h2>Shipment Quotation</h2>

                                                                                                                                                                                                                        <label>Tracking Number</label>
                                                                                                                                                                                                                          <input id="tracking" placeholder="TRK-000014">

                                                                                                                                                                                                                            <button onclick="findShipment()">Find Shipment</button>

                                                                                                                                                                                                                              <div id="result"></div>

                                                                                                                                                                                                                                <label>Quotation Amount (₹)</label>
                                                                                                                                                                                                                                  <input id="amount" type="number" placeholder="5000">

                                                                                                                                                                                                                                    <button onclick="saveQuote()">Save Quotation</button>

                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                    <script>

                                                                                                                                                                                                                                    let shipmentId = null;

                                                                                                                                                                                                                                    async function findShipment() {

                                                                                                                                                                                                                                      const tracking = document
                                                                                                                                                                                                                                          .getElementById("tracking")
                                                                                                                                                                                                                                              .value
                                                                                                                                                                                                                                                  .trim();

                                                                                                                                                                                                                                                    if (!tracking) {
                                                                                                                                                                                                                                                        document.getElementById("result").innerText =
                                                                                                                                                                                                                                                              "Enter tracking number.";
                                                                                                                                                                                                                                                                  return;
                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                      const { data, error } = await supabaseClient
                                                                                                                                                                                                                                                                          .from("shipment_requests")
                                                                                                                                                                                                                                                                              .select("*")
                                                                                                                                                                                                                                                                                  .eq("tracking_number", tracking)
                                                                                                                                                                                                                                                                                      .maybeSingle();

                                                                                                                                                                                                                                                                                        if (error) {
                                                                                                                                                                                                                                                                                            console.log(error);

                                                                                                                                                                                                                                                                                                document.getElementById("result").innerText =
                                                                                                                                                                                                                                                                                                      "Error: " + error.message;

                                                                                                                                                                                                                                                                                                          return;
                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                              if (!data) {
                                                                                                                                                                                                                                                                                                                  document.getElementById("result").innerText =
                                                                                                                                                                                                                                                                                                                        "Tracking number not found.";

                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                shipmentId = data.id;

                                                                                                                                                                                                                                                                                                                                  document.getElementById("result").innerHTML =
                                                                                                                                                                                                                                                                                                                                      "Shipment found<br><br>" +
                                                                                                                                                                                                                                                                                                                                          "Tracking: " + data.tracking_number + "<br>" +
                                                                                                                                                                                                                                                                                                                                              "Pickup: " + data.pickup_location + "<br>" +
                                                                                                                                                                                                                                                                                                                                                  "Delivery: " + data.delivery_location + "<br>" +
                                                                                                                                                                                                                                                                                                                                                      "Status: " + data.status;

                                                                                                                                                                                                                                                                                                                                                      }


                                                                                                                                                                                                                                                                                                                                                      async function saveQuote() {

                                                                                                                                                                                                                                                                                                                                                        if (!shipmentId) {
                                                                                                                                                                                                                                                                                                                                                            document.getElementById("result").innerText =
                                                                                                                                                                                                                                                                                                                                                                  "First find the shipment.";

                                                                                                                                                                                                                                                                                                                                                                      return;
                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                          const amount = document
                                                                                                                                                                                                                                                                                                                                                                              .getElementById("amount")
                                                                                                                                                                                                                                                                                                                                                                                  .value;

                                                                                                                                                                                                                                                                                                                                                                                    if (!amount || Number(amount) <= 0) {
                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("result").innerText =
                                                                                                                                                                                                                                                                                                                                                                                              "Enter a valid quotation amount.";

                                                                                                                                                                                                                                                                                                                                                                                                  return;
                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                      const { error } = await supabaseClient
                                                                                                                                                                                                                                                                                                                                                                                                          .from("shipment_requests")
                                                                                                                                                                                                                                                                                                                                                                                                              .update({
                                                                                                                                                                                                                                                                                                                                                                                                                    quoted_price: Number(amount),
                                                                                                                                                                                                                                                                                                                                                                                                                          quote_status: "sent"
                                                                                                                                                                                                                                                                                                                                                                                                                              })
                                                                                                                                                                                                                                                                                                                                                                                                                                  .eq("id", shipmentId);

                                                                                                                                                                                                                                                                                                                                                                                                                                    if (error) {

                                                                                                                                                                                                                                                                                                                                                                                                                                        console.log(error);

                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById("result").innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                  "Error: " + error.message;

                                                                                                                                                                                                                                                                                                                                                                                                                                                      return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                          document.getElementById("result").innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                              "Quotation saved successfully: ₹" + amount;

                                                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                                              </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                              </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                              </html>
