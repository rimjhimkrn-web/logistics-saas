<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<script>
(async()=>{

 window.addEventListener('message',event=>{if(event.source!==frame.contentWindow||!event.data||event.data.type!=='krim-demo-navigate')return;const next=String(event.data.path||'').replace(/^\/+/, '');if(!next||next.split('/').includes('..')||!next.endsWith('.html'))return;location.href='/owner-page-review.html?path='+encodeURIComponent(next)+'&mode=demo'});

 const item=pages.find(p=>(p.path.startsWith('public/')?p.path.slice(7):p.path)===requested);
 if(!item)throw Error('This page is not in the approved review inventory.');
 const path=item.path.startsWith('public/')?item.path.slice(7):item.path;

 const sourceUrl=new URL('/'+path.split('/').map(encodeURIComponent).join('/'),location.origin).href;

 if(!response.ok)throw Error('Page source could not be loaded (HTTP '+response.status+').');
 const source=await response.text(),doc=new DOMParser().parseFromString(source,'text/html');
 doc.querySelectorAll('script,noscript,iframe,object,embed').forEach(n=>n.remove());
 doc.querySelectorAll('meta[http-equiv]').forEach(n=>{if((n.getAttribute('http-equiv')||'').toLowerCase()==='refresh')n.remove()});

 const banner=doc.createElement('div');

 banner.setAttribute('style','position:sticky;top:0;z-index:2147483647;background:#102b46;color:#dff7ff;padding:7px 12px;font:12px/1.4 system-ui,sans-serif;text-align:center;border-bottom:1px solid #75d9f0');
 doc.body.prepend(banner);
 if(mode==='demo'){
  const demoScript=doc.createElement('script');
  demoScript.textContent=\`(function(){
const toast=(message)=>{let n=document.getElementById('krim-demo-toast');if(!n){n=document.createElement('div');n.id='krim-demo-toast';n.style.cssText='position:fixed;right:16px;bottom:16px;z-index:2147483647;background:#132b4a;color:white;padding:12px 16px;border-radius:9px;box-shadow:0 5px 24px #0003;max-width:min(380px,90vw);font:13px/1.45 Arial';document.body.append(n)}n.textContent=message;n.style.display='block';clearTimeout(window.__krimToastTimer);window.__krimToastTimer=setTimeout(()=>n.style.display='none',3500)};
const modal=(heading,copy)=>{let old=document.getElementById('krim-demo-modal');if(old)old.remove();const box=document.createElement('div');box.id='krim-demo-modal';box.style.cssText='position:fixed;inset:0;z-index:2147483646;background:#07182bcc;display:grid;place-items:center;padding:18px;font:14px Arial';const card=document.createElement('section');card.style.cssText='background:white;color:#172033;border-radius:12px;padding:20px;width:min(460px,100%);box-shadow:0 15px 50px #0004';const h=document.createElement('h2');h.textContent=heading;h.style.margin='0 0 10px';const p=document.createElement('p');p.textContent=copy;p.style.cssText='line-height:1.5;color:#526077';const actions=document.createElement('div');actions.style.cssText='display:flex;gap:8px;justify-content:flex-end;margin-top:18px';const close=document.createElement('button');close.type='button';close.textContent='Close';close.onclick=()=>box.remove();close.style.cssText='padding:10px 15px;border:1px solid #dce3eb;background:white;border-radius:7px';const simulate=document.createElement('button');simulate.type='button';simulate.textContent='Simulate';simulate.style.cssText='padding:10px 15px;border:0;background:#0b5cff;color:white;border-radius:7px';simulate.onclick=()=>{box.remove();toast('Demo action completed locally. No live data or backend record was changed.')};actions.append(close,simulate);card.append(h,p,actions);box.append(card);box.addEventListener('click',e=>{if(e.target===box)box.remove()});document.body.append(box)};
const safeLabel=el=>(el.innerText||el.getAttribute('aria-label')||el.getAttribute('title')||el.value||el.name||el.id||el.tagName||'Control').trim().replace(/\s+/g,' ').slice(0,90);
[['menu','side','overlay'],['hamburger','sidebar','sidebar-overlay']].forEach(([tid,sid,oid])=>{const t=document.getElementById(tid),s=document.getElementById(sid),o=document.getElementById(oid);if(t&&s)t.addEventListener('click',()=>{s.classList.toggle('open');o?.classList.toggle('open')});if(o&&s)o.addEventListener('click',()=>{s.classList.remove('open');o.classList.remove('open')})});
document.querySelectorAll('[aria-expanded="false"],[data-toggle],.accordion-button,[role="tab"]').forEach(el=>el.addEventListener('click',()=>{const ex=el.getAttribute('aria-expanded');if(ex!==null)el.setAttribute('aria-expanded',ex==='true'?'false':'true');const id=el.getAttribute('aria-controls')||el.dataset.target;if(id){const panel=document.getElementById(id.replace(/^#/ ,''));if(panel)panel.hidden=!panel.hidden}}));
const profile=document.getElementById('profile'),pop=document.getElementById('profilePop');if(profile&&pop)profile.addEventListener('click',()=>pop.classList.toggle('show'));
const lang=document.getElementById('language');if(lang)lang.addEventListener('click',()=>{const list=['English','हिन्दी','Español','Français','Deutsch','日本語'],el=document.getElementById('lang'),ctx=document.getElementById('contextLang');let i=list.indexOf(el?.textContent||'English'),v=list[(i+1)%list.length];if(el)el.textContent=v;if(ctx)ctx.textContent=v;toast('Demo language label changed to '+v+'. Translation is not connected.')});
const signout=document.getElementById('signout');if(signout)signout.addEventListener('click',e=>{e.preventDefault();toast('Sign-out is disabled in demo mode. No session exists.')});
document.querySelectorAll('input[type="search"],input[placeholder*="search" i],input[aria-label*="search" i]').forEach(input=>{input.addEventListener('input',()=>{const q=input.value.trim().toLowerCase(),scope=input.closest('section,main,article,.card,.panel')||document,rows=scope.querySelectorAll('tbody tr,.list-item,[data-search-item]');if(rows.length)rows.forEach(row=>row.hidden=!!q&&!row.textContent.toLowerCase().includes(q))});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&input.value.trim())toast('Local demo search: '+input.value.trim()+'. No server search was made.')})});
document.querySelectorAll('select').forEach(select=>select.addEventListener('change',()=>{const table=select.closest('section,main,article,.card,.panel')?.querySelector('tbody')||document.querySelector('tbody');if(!table)return;const value=select.value.toLowerCase();[...table.rows].forEach(row=>row.hidden=!!value&&!/all|select|status/i.test(value)&&!row.textContent.toLowerCase().includes(value))}));
document.querySelectorAll('form').forEach(form=>form.addEventListener('submit',e=>{e.preventDefault();const invalid=[...form.querySelectorAll('[required]')].find(x=>!x.value.trim());if(invalid){invalid.reportValidity?.();toast('Complete the required fields to continue this local demo.');return}toast('Form validated locally. Submission, uploads and backend writes are disabled.')}));
document.querySelectorAll('a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();const label=safeLabel(a),raw=a.getAttribute('href')||'';if(/^(mailto:|tel:|javascript:|#)/i.test(raw)){toast(label+' is not activated in the isolated demo.');return}let target;try{target=new URL(raw,document.baseURI)}catch(_){toast('This link is unavailable in the demo.');return}if(target.origin===location.origin&&/\.html?(?:$|[?#])/i.test(target.pathname)){parent.postMessage({type:'krim-demo-navigate',path:target.pathname.replace(/^\//,'')},'*');return}toast(label+' — external navigation is blocked in demo mode.')}));
document.querySelectorAll('button,[role="button"],input[type="button"],input[type="submit"]').forEach(button=>{if(button.dataset.krimDemoBound)return;button.dataset.krimDemoBound='1';button.addEventListener('click',e=>{if(button.type==='submit'&&button.form)return;const label=safeLabel(button);if(/close|dismiss|cancel/i.test(label)){const dialog=button.closest('[role="dialog"],dialog,.modal');if(dialog){dialog.hidden=true;dialog.removeAttribute('open');return}}modal(label+' · Interactive Demo','This control is simulated for owner review. Real permission checks, business rules, API calls and data changes are not executed.')})});
document.querySelectorAll('input:not([type="hidden"]),textarea').forEach(input=>{input.addEventListener('change',()=>input.dataset.krimDemoEdited='true');if(input.type==='file')input.addEventListener('change',()=>toast('File selection is local only. No file was uploaded.'))});
if('workspaces/customer-workspace.html'==='workspaces/customer-workspace.html'){
 const table=document.querySelector('.table tbody'),rows=[['KR-IND-26041','Ranchi → Kolkata','In transit','22 Nov 2026','Demo Carrier East'],['KR-IND-26038','Delhi → Mumbai','Confirmed','24 Nov 2026','Demo Road Network'],['KR-IND-26029','Kolkata → Bengaluru','Delivered','18 Nov 2026','Demo Multimodal']];
 if(table){table.replaceChildren();rows.forEach(r=>{const tr=document.createElement('tr');r.forEach((v,i)=>{const td=document.createElement('td');td.textContent=v;if(i===2){const badge=document.createElement('span');badge.className='status';badge.textContent=v;td.replaceChildren(badge)}tr.append(td)});table.append(tr)})}
 const k=document.querySelectorAll('.k b');['3','1','1','0','2','1'].forEach((v,i)=>{if(k[i])k[i].textContent=v});
}
window.fetch=()=>Promise.reject(new Error('Network blocked in KRIM demo mode'));window.XMLHttpRequest=function(){throw new Error('Network blocked in KRIM demo mode')};window.WebSocket=function(){throw new Error('Network blocked in KRIM demo mode')};window.EventSource=function(){throw new Error('Network blocked in KRIM demo mode')};try{if(navigator.sendBeacon)navigator.sendBeacon=()=>false}catch(_){}
})();\`;
  doc.body.append(demoScript);
  frame.setAttribute('sandbox','allow-scripts');
 }else frame.setAttribute('sandbox','');
 frame.srcdoc='<!doctype html>\\n'+doc.documentElement.outerHTML;
 frame.hidden=false;msg.hidden=true;
}catch(e){msg.textContent='Preview unavailable: '+e.message}
})();
</script></body></html>
