<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Delivery Confirmation - KRIM Logistics</title>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
          <script src="config.js"></script>

            <style>
                body {
                      font-family: Arial, sans-serif;
                            background: #f4f6f8;
                                  margin: 0;
                                        padding: 20px;
                                            }

                                                .container {
                                                      max-width: 600px;
                                                            margin: auto;
                                                                  background: white;
                                                                        padding: 20px;
                                                                              border-radius: 12px;
                                                                                    box-shadow: 0 2px 10px rgba(0,0,0,.08);
                                                                                        }

                                                                                            h1 {
                                                                                                  margin-top: 0;
                                                                                                      }

                                                                                                          input, textarea {
                                                                                                                width: 100%;
                                                                                                                      box-sizing: border-box;
                                                                                                                            padding: 12px;
                                                                                                                                  margin: 8px 0 14px;
                                                                                                                                        border: 1px solid #ccc;
                                                                                                                                              border-radius: 8px;
                                                                                                                                                    font-size: 15px;
                                                                                                                                                        }

                                                                                                                                                            button {
                                                                                                                                                                  width: 100%;
                                                                                                                                                                        padding: 13px;
                                                                                                                                                                              border: 0;
                                                                                                                                                                                    border-radius: 8px;
                                                                                                                                                                                          background: #111827;
                                                                                                                                                                                                color: white;
                                                                                                                                                                                                      font-size: 16px;
                                                                                                                                                                                                            cursor: pointer;
                                                                                                                                                                                                                }

                                                                                                                                                                                                                    button:hover {
                                                                                                                                                                                                                          opacity: .9;
                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                  #message {
                                                                                                                                                                                                                                        margin-top: 15px;
                                                                                                                                                                                                                                              padding: 10px;
                                                                                                                                                                                                                                                    border-radius: 8px;
                                                                                                                                                                                                                                                          display: none;
                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                  .success {
                                                                                                                                                                                                                                                                        background: #dcfce7;
                                                                                                                                                                                                                                                                              color: #166534;
                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                      .error {
                                                                                                                                                                                                                                                                                            background: #fee2e2;
                                                                                                                                                                                                                                                                                                  color: #991b1b;
                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                        </style>
                                                                                                                                                                                                                                                                                                        </head>

                                                                                                                                                                                                                                                                                                        <body>

                                                                                                                                                                                                                                                                                                        <div class="container">

                                                                                                                                                                                                                                                                                                          <h1>Delivery Confirmation</h1>
                                                                                                                                                                                                                                                                                                            <p>Confirm delivery details for a shipment.</p>

                                                                                                                                                                                                                                                                                                              <label>Shipment ID</label>
                                                                                                                                                                                                                                                                                                                <input id="shipmentId" type="number" placeholder="Example: 11">

                                                                                                                                                                                                                                                                                                                  <label>Receiver Name</label>
                                                                                                                                                                                                                                                                                                                    <input id="receiverName" type="text" placeholder="Receiver name">

                                                                                                                                                                                                                                                                                                                      <label>Receiver Phone</label>
                                                                                                                                                                                                                                                                                                                        <input id="receiverPhone" type="tel" placeholder="Receiver phone">

                                                                                                                                                                                                                                                                                                                          <label>Delivery Remarks</label>
                                                                                                                                                                                                                                                                                                                            <textarea id="deliveryRemarks" rows="4"
                                                                                                                                                                                                                                                                                                                                placeholder="Example: Delivered safely and received by customer"></textarea>

                                                                                                                                                                                                                                                                                                                                  <button onclick="confirmDelivery()">Confirm Delivery</button>

                                                                                                                                                                                                                                                                                                                                    <div id="message"></div>

                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                    <script>
                                                                                                                                                                                                                                                                                                                                      const db = supabase.createClient(
                                                                                                                                                                                                                                                                                                                                          SUPABASE_URL,
                                                                                                                                                                                                                                                                                                                                              SUPABASE_PUBLISHABLE_KEY
                                                                                                                                                                                                                                                                                                                                                );

                                                                                                                                                                                                                                                                                                                                                  function showMessage(text, success) {
                                                                                                                                                                                                                                                                                                                                                      const box = document.getElementById("message");

                                                                                                                                                                                                                                                                                                                                                          box.style.display = "block";
                                                                                                                                                                                                                                                                                                                                                              box.className = success ? "success" : "error";
                                                                                                                                                                                                                                                                                                                                                                  box.textContent = text;
                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                      async function confirmDelivery() {

                                                                                                                                                                                                                                                                                                                                                                          showMessage("", true);

                                                                                                                                                                                                                                                                                                                                                                              const shipmentId =
                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById("shipmentId").value.trim();

                                                                                                                                                                                                                                                                                                                                                                                        const receiverName =
                                                                                                                                                                                                                                                                                                                                                                                              document.getElementById("receiverName").value.trim();

                                                                                                                                                                                                                                                                                                                                                                                                  const receiverPhone =
                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("receiverPhone").value.trim();

                                                                                                                                                                                                                                                                                                                                                                                                            const deliveryRemarks =
                                                                                                                                                                                                                                                                                                                                                                                                                  document.getElementById("deliveryRemarks").value.trim();

                                                                                                                                                                                                                                                                                                                                                                                                                      if (!shipmentId) {
                                                                                                                                                                                                                                                                                                                                                                                                                            showMessage("Please enter Shipment ID.", false);
                                                                                                                                                                                                                                                                                                                                                                                                                                  return;
                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                          if (!receiverName) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                showMessage("Please enter receiver name.", false);
                                                                                                                                                                                                                                                                                                                                                                                                                                                      return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                              const { data: userData, error: userError } =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    await db.auth.getUser();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (userError || !userData.user) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              showMessage("Please login first.", false);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // Check whether logged-in user is an admin
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const { data: admin, error: adminError } =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      await db
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              .from("admin_users")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      .select("user_id")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              .eq("user_id", userData.user.id)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      .maybeSingle();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if (adminError || !admin) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                showMessage("Admin access required.", false);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const { data, error } =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    await db
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .from("shipment_requests")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .update({
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              status: "delivered",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        delivered_at: new Date().toISOString(),
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  receiver_name: receiverName,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            receiver_phone: receiverPhone || null,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      delivery_remarks: deliveryRemarks || null
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              })
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      .eq("id", shipmentId)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              .select()
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      .single();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if (error) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                console.error(error);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      showMessage(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              "Delivery update failed: " + error.message,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      false
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            );
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          showMessage(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "Delivery confirmed successfully for Shipment #" +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      shipmentId,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            true
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById("shipmentId").value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("receiverName").value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById("receiverPhone").value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById("deliveryRemarks").value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </html>
