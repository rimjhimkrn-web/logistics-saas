<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Partner Shipment Acceptance</title>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
          <script src="config.js"></script>

            <style>
                body {
                      font-family: Arial, sans-serif;
                            background: #f4f7fb;
                                  margin: 0;
                                        padding: 20px;
                                            }

                                                .container {
                                                      max-width: 500px;
                                                            margin: 40px auto;
                                                                  background: white;
                                                                        padding: 25px;
                                                                              border-radius: 12px;
                                                                                    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
                                                                                        }

                                                                                            h1 {
                                                                                                  text-align: center;
                                                                                                        color: #1f4f8f;
                                                                                                              margin-bottom: 25px;
                                                                                                                  }

                                                                                                                      label {
                                                                                                                            display: block;
                                                                                                                                  margin-top: 15px;
                                                                                                                                        margin-bottom: 6px;
                                                                                                                                              font-weight: bold;
                                                                                                                                                  }

                                                                                                                                                      input {
                                                                                                                                                            width: 100%;
                                                                                                                                                                  box-sizing: border-box;
                                                                                                                                                                        padding: 12px;
                                                                                                                                                                              border: 1px solid #ccc;
                                                                                                                                                                                    border-radius: 7px;
                                                                                                                                                                                          font-size: 16px;
                                                                                                                                                                                              }

                                                                                                                                                                                                  button {
                                                                                                                                                                                                        width: 100%;
                                                                                                                                                                                                              margin-top: 22px;
                                                                                                                                                                                                                    padding: 13px;
                                                                                                                                                                                                                          border: none;
                                                                                                                                                                                                                                border-radius: 7px;
                                                                                                                                                                                                                                      background: #1f4f8f;
                                                                                                                                                                                                                                            color: white;
                                                                                                                                                                                                                                                  font-size: 16px;
                                                                                                                                                                                                                                                        font-weight: bold;
                                                                                                                                                                                                                                                              cursor: pointer;
                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                      button:hover {
                                                                                                                                                                                                                                                                            background: #173c6d;
                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                    #result {
                                                                                                                                                                                                                                                                                          margin-top: 20px;
                                                                                                                                                                                                                                                                                                padding: 12px;
                                                                                                                                                                                                                                                                                                      border-radius: 7px;
                                                                                                                                                                                                                                                                                                            background: #f1f5f9;
                                                                                                                                                                                                                                                                                                                  line-height: 1.5;
                                                                                                                                                                                                                                                                                                                        word-break: break-word;
                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                              </style>
                                                                                                                                                                                                                                                                                                                              </head>

                                                                                                                                                                                                                                                                                                                              <body>

                                                                                                                                                                                                                                                                                                                              <div class="container">

                                                                                                                                                                                                                                                                                                                                <h1>Partner Shipment Acceptance</h1>

                                                                                                                                                                                                                                                                                                                                  <label for="tracking">Tracking Number</label>
                                                                                                                                                                                                                                                                                                                                    <input
                                                                                                                                                                                                                                                                                                                                        type="text"
                                                                                                                                                                                                                                                                                                                                            id="tracking"
                                                                                                                                                                                                                                                                                                                                                placeholder="Enter Tracking Number"
                                                                                                                                                                                                                                                                                                                                                  >

                                                                                                                                                                                                                                                                                                                                                    <label for="partnerId">Partner ID</label>
                                                                                                                                                                                                                                                                                                                                                      <input
                                                                                                                                                                                                                                                                                                                                                          type="number"
                                                                                                                                                                                                                                                                                                                                                              id="partnerId"
                                                                                                                                                                                                                                                                                                                                                                  placeholder="Enter Partner ID"
                                                                                                                                                                                                                                                                                                                                                                    >

                                                                                                                                                                                                                                                                                                                                                                      <button onclick="acceptShipment()">
                                                                                                                                                                                                                                                                                                                                                                          Accept Shipment
                                                                                                                                                                                                                                                                                                                                                                            </button>

                                                                                                                                                                                                                                                                                                                                                                              <div id="result"></div>

                                                                                                                                                                                                                                                                                                                                                                              </div>

                                                                                                                                                                                                                                                                                                                                                                              <script>

                                                                                                                                                                                                                                                                                                                                                                              async function acceptShipment() {

                                                                                                                                                                                                                                                                                                                                                                                const result = document.getElementById("result");

                                                                                                                                                                                                                                                                                                                                                                                  const tracking = document
                                                                                                                                                                                                                                                                                                                                                                                      .getElementById("tracking")
                                                                                                                                                                                                                                                                                                                                                                                          .value
                                                                                                                                                                                                                                                                                                                                                                                              .trim()
                                                                                                                                                                                                                                                                                                                                                                                                  .toUpperCase();

                                                                                                                                                                                                                                                                                                                                                                                                    const partnerId = Number(
                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("partnerId").value
                                                                                                                                                                                                                                                                                                                                                                                                          );

                                                                                                                                                                                                                                                                                                                                                                                                            result.innerText = "Checking shipment...";

                                                                                                                                                                                                                                                                                                                                                                                                              if (!tracking || !partnerId) {
                                                                                                                                                                                                                                                                                                                                                                                                                  result.innerText = "Please fill all fields.";
                                                                                                                                                                                                                                                                                                                                                                                                                      return;
                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                          try {

                                                                                                                                                                                                                                                                                                                                                                                                                              /*
                                                                                                                                                                                                                                                                                                                                                                                                                                   * STEP 1
                                                                                                                                                                                                                                                                                                                                                                                                                                        * Find shipment only by tracking number.
                                                                                                                                                                                                                                                                                                                                                                                                                                             */
                                                                                                                                                                                                                                                                                                                                                                                                                                                 const {
                                                                                                                                                                                                                                                                                                                                                                                                                                                       data: shipment,
                                                                                                                                                                                                                                                                                                                                                                                                                                                             error: shipmentError
                                                                                                                                                                                                                                                                                                                                                                                                                                                                 } = await supabaseClient
                                                                                                                                                                                                                                                                                                                                                                                                                                                                       .from("shipment_requests")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                             .select("id, tracking_number, partner_id, status")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   .eq("tracking_number", tracking)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         .maybeSingle();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             /*
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  * IMPORTANT:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       * Show the real Supabase error instead of hiding it
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            * behind "Shipment not found."
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 */
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     if (shipmentError) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           console.error("Shipment lookup error:", shipmentError);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         "Supabase Error: " +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 shipmentError.message;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               if (!shipment) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             "Shipment not found for tracking number: " +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     tracking;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   /*
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        * STEP 2
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             * Check whether this shipment belongs
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  * to the entered partner.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       */
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           if (Number(shipment.partner_id) !== partnerId) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         "This shipment is assigned to Partner ID " +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 shipment.partner_id +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         ", not Partner ID " +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 partnerId +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         ".";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       /*
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            * STEP 3
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 * Shipment must be assigned before acceptance.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      */
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if (shipment.status !== "assigned") {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        "Shipment cannot be accepted because its current status is: " +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                shipment.status;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              /*
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   * STEP 4
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        * Accept shipment.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             */
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 const {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       error: updateError
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           } = await supabaseClient
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 .from("shipment_requests")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       .update({
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               status: "accepted"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     })
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           .eq("id", shipment.id)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 .eq("partner_id", partnerId);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     if (updateError) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           console.error("Shipment update error:", updateError);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         "Update Error: " +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 updateError.message;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     "Shipment accepted successfully!";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       } catch (error) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           console.error("Unexpected error:", error);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     "Error: " +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           error.message;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             </html>
