<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
    <title>Partner Acceptance</title>

      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

        <style>
            body {
                  font-family: Arial, sans-serif;
                        padding: 30px;
                              max-width: 600px;
                                    margin: auto;
                                        }

                                            input, button {
                                                  width: 100%;
                                                        padding: 12px;
                                                              margin-top: 10px;
                                                                    box-sizing: border-box;
                                                                        }

                                                                            button {
                                                                                  cursor: pointer;
                                                                                      }

                                                                                          #result {
                                                                                                margin-top: 20px;
                                                                                                      font-weight: bold;
                                                                                                          }
                                                                                                            </style>
                                                                                                            </head>

                                                                                                            <body>

                                                                                                              <h2>Partner Shipment Acceptance</h2>

                                                                                                                <input
                                                                                                                    type="text"
                                                                                                                        id="tracking"
                                                                                                                            placeholder="Enter Tracking Number"
                                                                                                                              >

                                                                                                                                <input
                                                                                                                                    type="number"
                                                                                                                                        id="partnerId"
                                                                                                                                            placeholder="Enter Partner ID"
                                                                                                                                              >

                                                                                                                                                <button onclick="acceptShipment()">
                                                                                                                                                    Accept Shipment
                                                                                                                                                      </button>

                                                                                                                                                        <div id="result"></div>

                                                                                                                                                          <script>

                                                                                                                                                              const SUPABASE_URL =
                                                                                                                                                                    "https://ebltviniygljwwseplph.supabase.co";

                                                                                                                                                                        const SUPABASE_PUBLISHABLE_KEY =
                                                                                                                                                                              "sb_publishable_8xzZUebYp_nIxVRWEQdiw_2H4RkHAa";

                                                                                                                                                                                  const supabaseClient =
                                                                                                                                                                                        supabase.createClient(
                                                                                                                                                                                                SUPABASE_URL,
                                                                                                                                                                                                        SUPABASE_PUBLISHABLE_KEY
                                                                                                                                                                                                              );


                                                                                                                                                                                                                  async function acceptShipment() {

                                                                                                                                                                                                                        const result =
                                                                                                                                                                                                                                document.getElementById("result");

                                                                                                                                                                                                                                      const tracking =
                                                                                                                                                                                                                                              document.getElementById("tracking").value.trim();

                                                                                                                                                                                                                                                    const partnerId =
                                                                                                                                                                                                                                                            Number(
                                                                                                                                                                                                                                                                      document.getElementById("partnerId").value
                                                                                                                                                                                                                                                                              );


                                                                                                                                                                                                                                                                                    if (!tracking || !partnerId) {
                                                                                                                                                                                                                                                                                            result.innerText =
                                                                                                                                                                                                                                                                                                      "Please fill all fields.";
                                                                                                                                                                                                                                                                                                              return;
                                                                                                                                                                                                                                                                                                                    }


                                                                                                                                                                                                                                                                                                                          const { data: shipment, error: shipmentError } =
                                                                                                                                                                                                                                                                                                                                  await supabaseClient
                                                                                                                                                                                                                                                                                                                                            .from("shipment_requests")
                                                                                                                                                                                                                                                                                                                                                      .select("id, tracking_number, partner_id, status")
                                                                                                                                                                                                                                                                                                                                                                .eq("tracking_number", tracking)
                                                                                                                                                                                                                                                                                                                                                                          .single();


                                                                                                                                                                                                                                                                                                                                                                                if (shipmentError || !shipment) {
                                                                                                                                                                                                                                                                                                                                                                                        result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                  "Shipment not found.";
                                                                                                                                                                                                                                                                                                                                                                                                          return;
                                                                                                                                                                                                                                                                                                                                                                                                                }


                                                                                                                                                                                                                                                                                                                                                                                                                      if (Number(shipment.partner_id) !== partnerId) {
                                                                                                                                                                                                                                                                                                                                                                                                                              result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                        "This shipment is not assigned to this partner.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                      }


                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (shipment.status !== "assigned") {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              "Shipment is not waiting for partner acceptance.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const { error: updateError } =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          await supabaseClient
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .from("shipment_requests")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              .update({
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          status: "accepted"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    })
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              .eq("id", shipment.id)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        .eq("partner_id", partnerId);


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if (updateError) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "Error: " + updateError.message;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    result.innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            "Shipment accepted successfully!";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </html>
