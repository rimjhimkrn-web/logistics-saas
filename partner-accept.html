<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <title>KRIM Logistics - Accept Load</title>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
          <script src="config.js"></script>

            <style>
                * {
                      box-sizing: border-box;
                          }

                              body {
                                    margin: 0;
                                          font-family: Arial, sans-serif;
                                                background: #f5f8fc;
                                                      color: #172033;
                                                          }

                                                              header {
                                                                    background: #0b5ed7;
                                                                          color: white;
                                                                                padding: 18px;
                                                                                    }

                                                                                        .header-inner {
                                                                                              max-width: 1100px;
                                                                                                    margin: auto;
                                                                                                        }

                                                                                                            .brand {
                                                                                                                  font-size: 24px;
                                                                                                                        font-weight: 800;
                                                                                                                            }

                                                                                                                                .subtitle {
                                                                                                                                      margin-top: 5px;
                                                                                                                                            opacity: 0.9;
                                                                                                                                                  font-size: 14px;
                                                                                                                                                      }

                                                                                                                                                          main {
                                                                                                                                                                max-width: 700px;
                                                                                                                                                                      margin: 30px auto;
                                                                                                                                                                            padding: 0 16px;
                                                                                                                                                                                }

                                                                                                                                                                                    .card {
                                                                                                                                                                                          background: white;
                                                                                                                                                                                                border-radius: 16px;
                                                                                                                                                                                                      padding: 22px;
                                                                                                                                                                                                            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
                                                                                                                                                                                                                }

                                                                                                                                                                                                                    h1 {
                                                                                                                                                                                                                          margin-top: 0;
                                                                                                                                                                                                                                font-size: 24px;
                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                        .description {
                                                                                                                                                                                                                                              color: #667085;
                                                                                                                                                                                                                                                    margin-bottom: 24px;
                                                                                                                                                                                                                                                          line-height: 1.5;
                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                  label {
                                                                                                                                                                                                                                                                        display: block;
                                                                                                                                                                                                                                                                              font-weight: 700;
                                                                                                                                                                                                                                                                                    margin-bottom: 8px;
                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                            input {
                                                                                                                                                                                                                                                                                                  width: 100%;
                                                                                                                                                                                                                                                                                                        padding: 13px;
                                                                                                                                                                                                                                                                                                              border: 1px solid #d0d5dd;
                                                                                                                                                                                                                                                                                                                    border-radius: 10px;
                                                                                                                                                                                                                                                                                                                          font-size: 16px;
                                                                                                                                                                                                                                                                                                                                margin-bottom: 18px;
                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                        button {
                                                                                                                                                                                                                                                                                                                                              width: 100%;
                                                                                                                                                                                                                                                                                                                                                    border: none;
                                                                                                                                                                                                                                                                                                                                                          background: #0b5ed7;
                                                                                                                                                                                                                                                                                                                                                                color: white;
                                                                                                                                                                                                                                                                                                                                                                      padding: 14px;
                                                                                                                                                                                                                                                                                                                                                                            border-radius: 10px;
                                                                                                                                                                                                                                                                                                                                                                                  font-size: 16px;
                                                                                                                                                                                                                                                                                                                                                                                        font-weight: 700;
                                                                                                                                                                                                                                                                                                                                                                                              cursor: pointer;
                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                      button:disabled {
                                                                                                                                                                                                                                                                                                                                                                                                            opacity: 0.6;
                                                                                                                                                                                                                                                                                                                                                                                                                  cursor: not-allowed;
                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                          .message {
                                                                                                                                                                                                                                                                                                                                                                                                                                margin-top: 18px;
                                                                                                                                                                                                                                                                                                                                                                                                                                      padding: 12px;
                                                                                                                                                                                                                                                                                                                                                                                                                                            border-radius: 10px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                  display: none;
                                                                                                                                                                                                                                                                                                                                                                                                                                                        line-height: 1.5;
                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                .success {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      display: block;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            background: #ecfdf3;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  color: #027a48;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          .error {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                display: block;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      background: #fef3f2;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            color: #b42318;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .info {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          display: block;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                background: #eef5ff;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      color: #175cd3;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              .back {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    display: block;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          margin-top: 18px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                text-align: center;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      color: #0b5ed7;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            text-decoration: none;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  font-weight: 700;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          @media (max-width: 500px) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                main {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        margin-top: 20px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .brand {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            font-size: 21px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        .card {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                padding: 18px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </head>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <header>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="header-inner">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="brand">KRIM Logistics</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="subtitle">Partner Operations</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </header>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <section class="card">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <h1>Accept Shipment Load</h1>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="description">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        Review your assigned shipment and accept the load to begin the delivery operation.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <label for="shipmentId">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      Shipment ID
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </label>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <input
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    id="shipmentId"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          type="number"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                value="14"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      placeholder="Example: 14"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          >

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <button id="acceptBtn" onclick="acceptLoad()">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    Accept Load
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div id="message" class="message"></div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <a class="back" href="partner-workspace.html">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      ← Back to Partner Workspace
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </a>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            async function acceptLoad() {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const button = document.getElementById("acceptBtn");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const message = document.getElementById("message");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const shipmentId = Number(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      document.getElementById("shipmentId").value
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          message.className = "message";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            message.textContent = "";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if (!shipmentId) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  message.className = "message error";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      message.textContent = "Please enter a valid Shipment ID.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              try {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if (typeof supabaseClient === "undefined") {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        throw new Error(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "Supabase client not found. Please check config.js."
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      );
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              button.disabled = true;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  button.textContent = "Processing...";
