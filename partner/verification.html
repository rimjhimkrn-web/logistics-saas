<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KRIM OS — Partner Verification & KYB Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/core/krim-core.css">
  <link rel="stylesheet" href="/core/krim-components.css">
</head>
<body class="bg-[#02050e] text-slate-200 min-h-screen flex flex-col justify-between font-mono text-xs">

  <header class="h-16 bg-[#040814]/95 border-b border-slate-800 px-6 flex items-center justify-between">
    <a href="/partner/partner-workspace.html" class="flex items-center space-x-2.5">
      <div class="w-8 h-8 bg-blue-500 rounded-lg flex items-center justify-center font-black text-slate-950">K</div>
      <span class="font-extrabold text-white text-sm">KRIM PARTNER ONBOARDING</span>
    </a>
  </header>

  <main class="flex-1 max-w-4xl mx-auto px-6 py-12 space-y-8">
    <div class="krim-card space-y-2">
      <span class="text-emerald-400 font-bold uppercase tracking-wider text-[10px]">KYB & Compliance Engine</span>
      <h1 class="text-2xl font-extrabold text-white">Partner Verification & Serviceability Mapping</h1>
      <p class="text-slate-400 text-xs">Submit corporate identification, fleet credentials, and service PIN codes to activate network load matching.</p>
    </div>

    <div class="krim-card space-y-6">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="space-y-1">
          <label class="text-slate-400 font-bold block">Company Legal Name *</label>
          <input type="text" placeholder="e.g., Apex Road Carriers Pvt Ltd" class="w-full bg-[#040814] border border-slate-800 rounded-xl px-3 py-2 text-white font-bold outline-none" />
        </div>
        <div class="space-y-1">
          <label class="text-slate-400 font-bold block">GSTIN / Corporate Tax ID *</label>
          <input type="text" placeholder="27AAAAA0000A1Z5" class="w-full bg-[#040814] border border-slate-800 rounded-xl px-3 py-2 text-white font-bold outline-none" />
        </div>
      </div>
      <button onclick="alert('Partner verification documents submitted successfully. Status: Under Automated Review.')" class="krim-btn-primary w-full py-3">Submit for Network Verification →</button>
    </div>
  </main>

  <footer class="bg-[#02050e] border-t border-slate-800 text-slate-400 text-xs py-6">
    <div class="max-w-4xl mx-auto px-6 flex justify-between">
      <span>KRIM LOGISTICS OS</span>
      <p class="text-[10px] text-slate-600">© 2026 KRIM System Technologies Ltd.</p>
    </div>
  </footer>
</body>
</html>
