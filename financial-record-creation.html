<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Create Financial Record - KRIM Logistics</title>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
          <script src="config.js"></script>

            <style>
                body {
                      font-family: Arial, sans-serif;
                            background: #f4f6f8;
                                  margin: 0;
                                        padding: 20px;
                                            }

                                                .container {
                                                      max-width: 600px;
                                                            margin: auto;
                                                                  background: white;
                                                                        padding: 20px;
                                                                              border-radius: 12px;
                                                                                    box-shadow: 0 2px 10px rgba(0,0,0,.08);
                                                                                        }

                                                                                            h1 {
                                                                                                  margin-top: 0;
                                                                                                      }

                                                                                                          input {
                                                                                                                width: 100%;
                                                                                                                      box-sizing: border-box;
                                                                                                                            padding: 12px;
                                                                                                                                  margin: 8px 0 16px;
                                                                                                                                        border: 1px solid #ccc;
                                                                                                                                              border-radius: 8px;
                                                                                                                                                    font-size: 15px;
                                                                                                                                                        }

                                                                                                                                                            button {
                                                                                                                                                                  width: 100%;
                                                                                                                                                                        padding: 13px;
                                                                                                                                                                              border: 0;
                                                                                                                                                                                    border-radius: 8px;
                                                                                                                                                                                          background: #111827;
                                                                                                                                                                                                color: white;
                                                                                                                                                                                                      font-size: 16px;
                                                                                                                                                                                                            cursor: pointer;
                                                                                                                                                                                                                }

                                                                                                                                                                                                                    button:hover {
                                                                                                                                                                                                                          opacity: .9;
                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                  #message {
                                                                                                                                                                                                                                        display: none;
                                                                                                                                                                                                                                              margin-top: 15px;
                                                                                                                                                                                                                                                    padding: 12px;
                                                                                                                                                                                                                                                          border-radius: 8px;
                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                  .success {
                                                                                                                                                                                                                                                                        display: block !important;
                                                                                                                                                                                                                                                                              background: #dcfce7;
                                                                                                                                                                                                                                                                                    color: #166534;
                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                            .error {
                                                                                                                                                                                                                                                                                                  display: block !important;
                                                                                                                                                                                                                                                                                                        background: #fee2e2;
                                                                                                                                                                                                                                                                                                              color: #991b1b;
                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                    </style>
                                                                                                                                                                                                                                                                                                                    </head>

                                                                                                                                                                                                                                                                                                                    <body>

                                                                                                                                                                                                                                                                                                                    <div class="container">

                                                                                                                                                                                                                                                                                                                      <h1>Create Financial Record</h1>

                                                                                                                                                                                                                                                                                                                        <p>
                                                                                                                                                                                                                                                                                                                            Add the partner cost for a shipment after the customer has accepted
                                                                                                                                                                                                                                                                                                                                the quotation and a partner has been assigned.
                                                                                                                                                                                                                                                                                                                                  </p>

                                                                                                                                                                                                                                                                                                                                    <label>Shipment ID</label>
                                                                                                                                                                                                                                                                                                                                      <input
                                                                                                                                                                                                                                                                                                                                          id="shipmentId"
                                                                                                                                                                                                                                                                                                                                              type="number"
                                                                                                                                                                                                                                                                                                                                                  placeholder="Example: 11"
                                                                                                                                                                                                                                                                                                                                                    >

                                                                                                                                                                                                                                                                                                                                                      <label>Partner Cost (₹)</label>
                                                                                                                                                                                                                                                                                                                                                        <input
                                                                                                                                                                                                                                                                                                                                                            id="partnerCost"
                                                                                                                                                                                                                                                                                                                                                                type="number"
                                                                                                                                                                                                                                                                                                                                                                    min="0"
                                                                                                                                                                                                                                                                                                                                                                        step="0.01"
                                                                                                                                                                                                                                                                                                                                                                            placeholder="Example: 20000"
                                                                                                                                                                                                                                                                                                                                                                              >

                                                                                                                                                                                                                                                                                                                                                                                <button onclick="createFinancialRecord()">
                                                                                                                                                                                                                                                                                                                                                                                    Create Financial Record
                                                                                                                                                                                                                                                                                                                                                                                      </button>

                                                                                                                                                                                                                                                                                                                                                                                        <div id="message"></div>

                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                        <script>
                                                                                                                                                                                                                                                                                                                                                                                          const db = supabase.createClient(
                                                                                                                                                                                                                                                                                                                                                                                              SUPABASE_URL,
                                                                                                                                                                                                                                                                                                                                                                                                  SUPABASE_PUBLISHABLE_KEY
                                                                                                                                                                                                                                                                                                                                                                                                    );

                                                                                                                                                                                                                                                                                                                                                                                                      function showMessage(text, success) {
                                                                                                                                                                                                                                                                                                                                                                                                          const box = document.getElementById("message");

                                                                                                                                                                                                                                                                                                                                                                                                              box.textContent = text;
                                                                                                                                                                                                                                                                                                                                                                                                                  box.className = success ? "success" : "error";
                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                      async function createFinancialRecord() {

                                                                                                                                                                                                                                                                                                                                                                                                                          const shipmentId =
                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById("shipmentId").value.trim();

                                                                                                                                                                                                                                                                                                                                                                                                                                    const partnerCost =
                                                                                                                                                                                                                                                                                                                                                                                                                                          document.getElementById("partnerCost").value.trim();

                                                                                                                                                                                                                                                                                                                                                                                                                                              if (!shipmentId) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                    showMessage("Please enter Shipment ID.", false);
                                                                                                                                                                                                                                                                                                                                                                                                                                                          return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if (partnerCost === "" || Number(partnerCost) < 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        showMessage("Please enter a valid partner cost.", false);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const { data: userData, error: userError } =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            await db.auth.getUser();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (userError || !userData.user) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      showMessage("Please login first.", false);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // Admin access check
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const { data: admin, error: adminError } =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              await db
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      .from("admin_users")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              .select("user_id")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      .eq("user_id", userData.user.id)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              .maybeSingle();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if (adminError || !admin) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        showMessage("Admin access required.", false);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      // Call the secure database function
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const { data, error } =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                await db.rpc(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        "create_shipment_financial",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          p_shipment_id: Number(shipmentId),
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    p_partner_cost: Number(partnerCost)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if (error) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            console.error(error);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  showMessage(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          "Could not create financial record: " +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  error.message,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          false
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              showMessage(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    "Financial record created successfully. Financial ID: " +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          data,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                true
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("shipmentId").value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById("partnerCost").value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </html>
