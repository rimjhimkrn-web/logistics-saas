<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>KRIM Admin Security</title>

                <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
                    <script src="config.js"></script>

                        <style>
                                body {
                                            font-family: Arial, sans-serif;
                                                        max-width: 500px;
                                                                    margin: 60px auto;
                                                                                padding: 20px;
                                                                                        }

                                                                                                input,
                                                                                                        button {
                                                                                                                    width: 100%;
                                                                                                                                padding: 12px;
                                                                                                                                            margin-top: 12px;
                                                                                                                                                        box-sizing: border-box;
                                                                                                                                                                }

                                                                                                                                                                        button {
                                                                                                                                                                                    cursor: pointer;
                                                                                                                                                                                            }

                                                                                                                                                                                                    #box {
                                                                                                                                                                                                                display: none;
                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                #message {
                                                                                                                                                                                                                                            margin-top: 15px;
                                                                                                                                                                                                                                                        font-weight: bold;
                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                    </style>
                                                                                                                                                                                                                                                                    </head>

                                                                                                                                                                                                                                                                    <body>

                                                                                                                                                                                                                                                                    <h1>KRIM Admin Security</h1>

                                                                                                                                                                                                                                                                    <p id="status">Checking security...</p>

                                                                                                                                                                                                                                                                    <div id="box">

                                                                                                                                                                                                                                                                        <h2>MFA Verification</h2>

                                                                                                                                                                                                                                                                            <p>Enter the 6-digit code from your authenticator app.</p>

                                                                                                                                                                                                                                                                                <input
                                                                                                                                                                                                                                                                                        id="code"
                                                                                                                                                                                                                                                                                                type="text"
                                                                                                                                                                                                                                                                                                        inputmode="numeric"
                                                                                                                                                                                                                                                                                                                maxlength="6"
                                                                                                                                                                                                                                                                                                                        autocomplete="one-time-code"
                                                                                                                                                                                                                                                                                                                                placeholder="123456"
                                                                                                                                                                                                                                                                                                                                    >

                                                                                                                                                                                                                                                                                                                                        <button id="verifyBtn" onclick="verifyMFA()">
                                                                                                                                                                                                                                                                                                                                                Verify MFA
                                                                                                                                                                                                                                                                                                                                                    </button>

                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                    <p id="message"></p>

                                                                                                                                                                                                                                                                                                                                                    <script>

                                                                                                                                                                                                                                                                                                                                                    let factorId = null;
                                                                                                                                                                                                                                                                                                                                                    let challengeId = null;


                                                                                                                                                                                                                                                                                                                                                    /* --------------------------------
                                                                                                                                                                                                                                                                                                                                                       START
                                                                                                                                                                                                                                                                                                                                                       -------------------------------- */

                                                                                                                                                                                                                                                                                                                                                       async function start() {

                                                                                                                                                                                                                                                                                                                                                           const sessionResult =
                                                                                                                                                                                                                                                                                                                                                                   await supabaseClient.auth.getSession();

                                                                                                                                                                                                                                                                                                                                                                       const session =
                                                                                                                                                                                                                                                                                                                                                                               sessionResult.data.session;

                                                                                                                                                                                                                                                                                                                                                                                   if (!session) {

                                                                                                                                                                                                                                                                                                                                                                                           document.getElementById("status").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                       "No active login session.";

                                                                                                                                                                                                                                                                                                                                                                                                               document.getElementById("message").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                           "Please login first.";

                                                                                                                                                                                                                                                                                                                                                                                                                                   return;
                                                                                                                                                                                                                                                                                                                                                                                                                                       }


                                                                                                                                                                                                                                                                                                                                                                                                                                           const factorsResult =
                                                                                                                                                                                                                                                                                                                                                                                                                                                   await supabaseClient.auth.mfa.listFactors();
                                                                                                                                                                                                                                                                                                                                                                                                                                                   console.log("MFA FACTORS:", factorsResult);

                                                                                                                                                                                                                                                                                                                                                                                                                                                       if (factorsResult.error) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                               document.getElementById("message").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                           factorsResult.error.message;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           const factors =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   factorsResult.data.totp || [];


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       const verifiedFactor =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               factors.find(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           factor => factor.status === "verified"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   );


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       if (!verifiedFactor) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               document.getElementById("message").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           "No verified MFA factor found.";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           factorId =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   verifiedFactor.id;


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       const aalResult =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               await supabaseClient.auth.mfa
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           .getAuthenticatorAssuranceLevel();


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               if (aalResult.error) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       document.getElementById("message").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   aalResult.error.message;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   const currentLevel =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           aalResult.data.currentLevel;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               const nextLevel =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       aalResult.data.nextLevel;


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           /*
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  Already MFA verified.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      */

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if (currentLevel === "aal2") {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  document.getElementById("status").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              "MFA verified.";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      document.getElementById("message").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  "Admin security verification complete.";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  /*
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         Need MFA.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             */

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 if (
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         currentLevel === "aal1" &&
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 nextLevel === "aal2"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     ) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             await createChallenge();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             /*
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    Some Supabase sessions may return
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           an incomplete assurance state.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  If a verified factor exists,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         attempt the MFA challenge directly.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             */

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 if (
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         currentLevel === "aal1" ||
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 currentLevel === null ||
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         currentLevel === undefined
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             ) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     await createChallenge();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     document.getElementById("status").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             "Security check requires attention.";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 document.getElementById("message").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         "Current authentication level: " +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 currentLevel +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         " | Next level: " +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 nextLevel;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 /* --------------------------------
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    CREATE CHALLENGE
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    -------------------------------- */

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    async function createChallenge() {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const challengeResult =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                await supabaseClient.auth.mfa.challenge({
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            factorId: factorId
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    });


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (challengeResult.error) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById("message").textContent =
